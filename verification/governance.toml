schema_version = 1
id = "VERIFICATION_GOVERNANCE_001"
owner = "verification"
status = "mapped"
last_reviewed = "2026-07-19"
coverage_dimensions = [
  "happy_path", "boundary_low", "boundary_high", "below_min", "above_max",
  "wrong_type_or_shape", "missing_required", "extra_or_unknown",
  "duplicate_or_collision", "ordering_or_lifecycle", "encoding_or_unicode",
  "resource_limit", "auth_or_permission", "persistence_or_recovery",
  "concurrency_or_cancellation", "time_or_clock_fault",
  "hardware_or_network_fault", "supply_chain_or_artifact_fault",
  "platform_or_filesystem_variation",
]

[staleness]
maximum_active_age_days = 90
date_field = "last_reviewed"
future_dates_forbidden = true

[suite_composition]
includes_semantics = "ordered_display_dependency_only"
excludes_semantics = "reviewed_constraint_labels_only"
command_inheritance = false
execution_inheritance = false
proof_inheritance = false
allowed_excludes = [
  "hardware_lab", "hardware_lab_unless_configured", "long_soak",
  "milestone_enforcement", "network_timing", "skip_capable_default_as_proof",
  "visual_capture",
]

[change_policy]
product_change_requires = ["written_specification", "native_executable_test"]
public_claim_change_requires = ["written_specification", "native_executable_test"]
public_claim_paths = ["README.md", "docs/public/**"]
safety_risks = ["safety_critical", "silent_corruption", "wrong_result", "false_status"]

[archive_policy]
registry_path = "verification/retirements.toml"
delete_evidence_records = false
delete_invariant_records = false
retirement_requires = ["owner", "rationale", "replacement", "retired_at", "evidence_refs"]

[[grace_periods]]
id = "ignored_unknown"
trigger = "ignored test classified unknown"
duration_days = 30
milestone = ""

[[grace_periods]]
id = "missing_oracle"
trigger = "registered invariant lacks eligible oracle"
duration_days = 30
milestone = ""

[[grace_periods]]
id = "public_claim_disposition"
trigger = "public claim lacks proof, gap, or reviewed nonclaim disposition"
duration_days = 30
milestone = ""

[[grace_periods]]
id = "mutation_survivor"
trigger = "safety-relevant mutant survives"
duration_days = 0
milestone = "before_merge"

