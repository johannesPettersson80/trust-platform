schema_version = 1
id = "RUNTIME_ANOMALY_TAXONOMY_V1"
title = "Runtime anomaly taxonomy v1"
area = "runtime_safety"
mapping_basis = "explicit_reviewed_discovery_id_only"
proof_posture = "association_only"
fault_interface_status = "not_implemented"
production_hook_policy = "design_review_required"
last_reviewed = "2026-07-11"

[spec_gap_reviews.scan_cycle_allocation_policy]
outcome = "written_contract_present"
source_ref = "SPEC_RUNTIME_ENGINE_001"
source_path = "docs/specs/11-runtime-engine.md"
required_text = [
  "dynamic allocation in hot path",
  "No heap allocation during execution",
]
rationale = "The active normative runtime-engine contract already excludes dynamic allocation from the scan hot path and heap allocation from execution. Allocation-failure and OOM testing outside that scope remains unmapped test debt and does not make this written scan-cycle policy absent."

[spec_gap_reviews.restart_timebase]
outcome = "resolved_source"
source_ref = "SPEC_IEC_STANDARD_FBS_CANDIDATE_001"
source_path = "docs/specs/08-standard-function-blocks.md"
superseded_gap_id = "SPEC_GAP_IEC_TIMER_RESTART_TIMEBASE_001"
rationale = "The active normative timer source and reviewed decision log now define executed-scan, restart, PT, clock-step, and TIME/LTIME boundaries and supersede the prior gap. This association-only review creates no runnable assertion or adequacy claim."

[[classes]]
id = "panic"
title = "Panic containment"
stimulus = "A scan-cycle, I/O, or resource-thread operation panics."
primary_suite = "pr"
conditional_suites = ["nightly", "release"]
injection_boundary = "test_harness"
rationale = "Fast deterministic harnesses can verify visible fault state, containment, and safe-output ordering without a production panic hook."

[[classes]]
id = "timeout"
title = "Operation timeout"
stimulus = "A bounded runtime or harness operation exceeds its configured timeout."
primary_suite = "pr"
conditional_suites = ["nightly"]
injection_boundary = "external_harness"
rationale = "Short deterministic child-process and service harnesses belong in PR; broader timeout matrices belong in nightly."

[[classes]]
id = "deadline"
title = "Execution deadline expiry"
stimulus = "Execution begins with an expired deadline or runs beyond a bounded deadline."
primary_suite = "pr"
conditional_suites = ["nightly", "release"]
injection_boundary = "test_harness"
rationale = "The VM and scheduler expose deterministic test deadlines; release execution remains conditional on delivered-path relevance."

[[classes]]
id = "watchdog"
title = "Watchdog expiry"
stimulus = "A configured execution watchdog expires during runtime work."
primary_suite = "pr"
conditional_suites = ["nightly", "release"]
injection_boundary = "test_harness"
rationale = "Manual clocks and short watchdog budgets provide deterministic checks without changing production behavior."

[[classes]]
id = "slow_device"
title = "Slow device response"
stimulus = "A protocol or device response is delayed beyond the scan-thread service budget."
primary_suite = "nightly"
conditional_suites = ["release", "hardware_lab"]
injection_boundary = "external_harness"
rationale = "Loopback delay is suitable for nightly checks; real device timing remains conditional on a hardware-lab run."

[[classes]]
id = "disconnect"
title = "Connection loss"
stimulus = "A protocol session or transport disconnects while runtime state is active."
primary_suite = "nightly"
conditional_suites = ["release", "hardware_lab"]
injection_boundary = "external_harness"
rationale = "Reconnect and freshness behavior needs repeated loopback stress, with real transport runs reserved for the lab."

[[classes]]
id = "queue_full"
title = "Worker queue saturation"
stimulus = "A scan-facing producer outpaces a bounded worker handoff or queue."
primary_suite = "nightly"
conditional_suites = ["release"]
injection_boundary = "test_harness"
rationale = "Saturation is deterministic in controlled workers, while release use remains conditional on the unresolved safe-state handoff contract."

[[classes]]
id = "stale_data"
title = "Stale input data"
stimulus = "A previously valid input snapshot is observed without a fresh device update."
primary_suite = "pr"
conditional_suites = ["nightly", "hardware_lab"]
injection_boundary = "test_harness"
rationale = "Freshness state machines are fast deterministic tests; prolonged and real-device freshness belongs in deeper lanes."

[[classes]]
id = "corrupt_retain"
title = "Corrupt retain image"
stimulus = "A retained-state image contains trailing, mutated, or integrity-invalid bytes."
primary_suite = "pr"
conditional_suites = ["release"]
injection_boundary = "ordinary_input"
rationale = "Versioned file bytes are ordinary decoder input and can be checked deterministically in PR and release gates."

[[classes]]
id = "malformed_bytecode"
title = "Malformed bytecode"
stimulus = "A bytecode container or instruction stream is structurally malformed."
primary_suite = "pr"
conditional_suites = ["nightly"]
injection_boundary = "ordinary_input"
rationale = "Malformed encoded bytes are ordinary validator input; extended generated variation remains nightly work."

[[classes]]
id = "bad_config"
title = "Invalid runtime configuration"
stimulus = "Runtime or protocol configuration contains an unknown, out-of-range, or invalid value."
primary_suite = "pr"
conditional_suites = ["release"]
injection_boundary = "ordinary_input"
rationale = "Configuration validation is a deterministic ordinary-input check and is release-relevant."

[[classes]]
id = "bad_signal"
title = "Invalid or unexpected process signal"
stimulus = "The runtime receives a signal outside its reviewed graceful-shutdown signal set."
primary_suite = "release"
conditional_suites = ["nightly"]
injection_boundary = "external_harness"
rationale = "Process signals are platform-facing behavior; current valid-signal tests do not cover this anomaly."

[[classes]]
id = "partial_web_request"
title = "Partial web request"
stimulus = "A client sends headers and only part of a declared request body while keeping the connection open."
primary_suite = "nightly"
conditional_suites = ["release"]
injection_boundary = "external_harness"
rationale = "Socket-level partial request behavior needs an orchestrated server/client harness and must not block unrelated control traffic."

[[classes]]
id = "disk_error"
title = "Persistent storage error"
stimulus = "Persistent-state load, write, flush, sync, or rename returns a storage error."
primary_suite = "release"
conditional_suites = ["nightly"]
injection_boundary = "external_harness"
rationale = "Real filesystem failures are platform-sensitive release checks; injected backend failure remains a narrower association."

[[classes]]
id = "clock_step"
title = "Clock step"
stimulus = "A relevant time source moves discontinuously forward or backward."
primary_suite = "nightly"
conditional_suites = ["release"]
injection_boundary = "test_harness"
rationale = "The reviewed monotonic scheduler contract permits deterministic backward and forward step checks through the manual-clock harness."

[[classes]]
id = "monotonic_wall_clock_divergence"
title = "Monotonic and wall-clock divergence"
stimulus = "Monotonic scheduling time and civil wall-clock time diverge materially."
primary_suite = "nightly"
conditional_suites = ["release"]
injection_boundary = "test_harness"
rationale = "The reviewed scheduler contract isolates readiness from civil wall time, so a fixed manual clock can exercise the divergence boundary without changing production time sources."

[[classes]]
id = "suspend_resume"
title = "Host suspend and resume"
stimulus = "The host suspends runtime execution and later resumes with elapsed real time."
primary_suite = "nightly"
conditional_suites = ["release"]
injection_boundary = "test_harness"
rationale = "A forward manual-clock discontinuity exercises the scheduler-visible elapsed interval after a host pause; platform sleep delivery remains a separate system test."

[[classes]]
id = "timer_duration_overflow"
title = "Timer duration overflow"
stimulus = "Timer elapsed time, preset time, or a time delta reaches an arithmetic duration boundary."
primary_suite = "pr"
conditional_suites = ["release"]
injection_boundary = "ordinary_input"
rationale = "Extreme duration values can be supplied as ordinary inputs, but no current assertion exercises the overflow condition."

[[classes]]
id = "allocation_failure_oom"
title = "Allocation failure or OOM"
stimulus = "A required allocation fails or the process reaches an out-of-memory condition outside the promised allocation-free scan path."
primary_suite = "nightly"
conditional_suites = ["release"]
injection_boundary = "design_review_required"
rationale = "Malformed count fields exercise the reviewed reject-before-reservation boundary; a production allocation-failure hook remains prohibited without design review."

