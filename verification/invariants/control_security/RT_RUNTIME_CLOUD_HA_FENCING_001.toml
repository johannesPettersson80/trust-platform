schema_version = 1
id = "RT_RUNTIME_CLOUD_HA_FENCING_001"
title = "Runtime Cloud dual-host authority is fenced, split-brain safe, and replay guarded"
area = "control_security"
risk = "safety_critical"
status = "mapped"
owner = "trust-runtime"
last_reviewed = "2026-07-22"
claim = "Every protected dual-host action requires one valid fenced ACTIVE lease owner across the complete supplied HA group, and command replay cannot start a duplicate live dispatch or bypass monotonic completed-sequence checks."
proof_level = "T1"
contract_kind = "state_machine"
source_refs = [
  "crates/trust-runtime/src/runtime_cloud/ha.rs",
  "crates/trust-runtime/src/runtime_cloud/ha/policy.rs",
  "crates/trust-runtime/src/web/runtime_cloud_dispatch.rs",
]
tests = ["TEST_HA_CRASH_MID_COMMAND_CAN_RETRY_AFTER_STATE_ROUNDTRIP_001", "TEST_HA_DUAL_HOST_REQUIRES_EXTERNAL_CONSISTENT_LEASE_AUTHORITY_001", "TEST_HA_LEASE_LOSS_FOR_ACTIVE_RUNTIME_REQUIRES_DEMOTED_SAFE_BEHAVIOR_001", "TEST_HA_LIVE_IN_FLIGHT_DUPLICATE_IS_DENIED_BUT_RECOVERY_CAN_RESUME_ONCE_001", "TEST_HA_PARSE_ACTION_HA_REQUEST_ACCEPTS_OPTIONAL_PAYLOAD_001", "TEST_HA_REPLAY_GUARD_DEDUPLICATES_AND_REJECTS_STALE_SEQUENCES_001", "TEST_HA_SPLIT_BRAIN_CANDIDATES_ARE_DETECTED_AND_REJECTED_001", "TEST_HA_SPLIT_BRAIN_DETECTION_USES_COMPLETE_GROUP_VIEW_NOT_ACTION_SUBSET_001", "TEST_INTEGRATION_WEB_IO_CONFIG_INTEGRATION_PART_19_RUNTIME_CLOUD_HA_DUAL_OUTPUT_PREVENTION_BLOCKS_STANDBY_DISPATCH_001", "TEST_INTEGRATION_WEB_IO_CONFIG_INTEGRATION_PART_19_RUNTIME_CLOUD_HA_LEASE_EXPIRY_DEMOTES_ACTIVE_RUNTIME_PREFLIGHT_001", "TEST_INTEGRATION_WEB_IO_CONFIG_INTEGRATION_PART_19_RUNTIME_CLOUD_HA_SPLIT_BRAIN_PREFLIGHT_CHECKS_CANDIDATES_OUTSIDE_ACTION_SUBSET_001", "TEST_INTEGRATION_WEB_IO_CONFIG_INTEGRATION_PART_19_RUNTIME_CLOUD_HA_SPLIT_BRAIN_PREFLIGHT_DENIES_DUAL_ACTIVE_CANDIDATES_001", "TEST_INTEGRATION_WEB_IO_CONFIG_INTEGRATION_PART_20_RUNTIME_CLOUD_HA_REPLAY_GUARD_DEDUPLICATES_AND_REJECTS_STALE_SEQ_001"]
gates = ["pr"]
evidence_refs = []
spec_gap_refs = []
missing = ["assertion_reachability", "mutation_sensitivity", "broad_remote_gate"]

[spec]
status = "specified"
source_refs = ["SPEC_RUNTIME_ENGINE_001"]

[oracle]
kind = "trust_contract"
ref = "SPEC_RUNTIME_ENGINE_001#runtime-cloud-ha-lease-split-brain-and-replay-contract"

[[behavior]]
partition = { equals = "ONE_VALID_ACTIVE_FENCED_OWNER" }
case_family = "happy_path"
oracle_ref = "SPEC_RUNTIME_ENGINE_001#runtime-cloud-ha-lease-split-brain-and-replay-contract"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "unchanged", process_image = "unchanged", diagnostics = "none", status = "not_applicable" }
rationale = "The sole ACTIVE runtime owns an available consistent lease and a valid nonempty fence."

[[behavior]]
partition = { equals = "MISSING_OR_AMBIGUOUS_AUTHORITY" }
case_family = "auth_or_permission"
oracle_ref = "SPEC_RUNTIME_ENGINE_001#runtime-cloud-ha-lease-split-brain-and-replay-contract"
outcome = "reject"
no_partial_apply = true
delta = { target = "unchanged", siblings = "unchanged", retain = "unchanged", process_image = "unchanged", diagnostics = "stable_error", status = "not_safe_reported" }
rationale = "Missing lease, owner, ACTIVE role, fence, or unambiguous authority denies protected work before side effects."

[[behavior]]
partition = { equals = "MULTIPLE_VALID_ACTIVE_OWNERS" }
case_family = "concurrency_or_cancellation"
oracle_ref = "SPEC_RUNTIME_ENGINE_001#runtime-cloud-ha-lease-split-brain-and-replay-contract"
outcome = "reject"
no_partial_apply = true
delta = { target = "unchanged", siblings = "unchanged", retain = "unchanged", process_image = "unchanged", diagnostics = "stable_error", status = "not_safe_reported" }
rationale = "Every protected action is denied when the complete supplied group view contains split-brain authority."

[[behavior]]
partition = { equals = "LIVE_IN_FLIGHT_DUPLICATE" }
case_family = "concurrency_or_cancellation"
oracle_ref = "SPEC_RUNTIME_ENGINE_001#runtime-cloud-ha-lease-split-brain-and-replay-contract"
outcome = "reject"
no_partial_apply = true
delta = { target = "unchanged", siblings = "unchanged", retain = "unchanged", process_image = "unchanged", diagnostics = "stable_error", status = "not_safe_reported" }
rationale = "Ephemeral live ownership blocks a second begin for the same request and sequence."

[[behavior]]
partition = { equals = "RECOVERED_PENDING_REQUEST" }
case_family = "persistence_or_recovery"
oracle_ref = "SPEC_RUNTIME_ENGINE_001#runtime-cloud-ha-lease-split-brain-and-replay-contract"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "unchanged", process_image = "unchanged", diagnostics = "none", status = "not_applicable" }
rationale = "Serialized pending state retains durable replay identity but not stale live-process ownership."

[[coverage.cells]]
dimension = "happy_path"
state = "covered"
rationale = "Unit and HTTP tests cover valid authority, first dispatch, completion, and stored-result replay."

[[coverage.cells]]
dimension = "auth_or_permission"
state = "covered"
rationale = "Focused tests cover missing lease authority, lease loss, standby output denial, ownership, and fencing."

[[coverage.cells]]
dimension = "concurrency_or_cancellation"
state = "covered"
rationale = "Focused tests cover complete-group split brain and live duplicate dispatch ownership."

[[coverage.cells]]
dimension = "persistence_or_recovery"
state = "covered"
rationale = "Coordinator roundtrip tests cover recovered pending retry and completed-result deduplication."
