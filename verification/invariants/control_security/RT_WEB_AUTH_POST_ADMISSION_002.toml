schema_version = 1
id = "RT_WEB_AUTH_POST_ADMISSION_002"
title = "Runtime web authentication and POST admission fail closed"
area = "control_security"
risk = "security"
status = "specified"
owner = "trust-runtime"
last_reviewed = "2026-08-01"
claim = "The embedded web surface derives authority from the documented peer or exact token, preserves role and IDE-session identity, and admits state-changing JSON only after exact content-type, same-origin, and bounded-body checks."
proof_level = "S0"
contract_kind = "security_policy"
source_refs = ["docs/specs/11-runtime-engine.md", "crates/trust-runtime/src/web/auth_helpers/contract_tests.rs", "crates/trust-runtime/src/web/http_post_policy/contract_tests.rs"]
tests = []
gates = ["veryquick", "pr"]
evidence_refs = []
spec_gap_refs = []
missing = ["catalog_mapping", "focused_execution_evidence", "assertion_reachability", "mutation_sensitivity", "broad_remote_gate"]

[spec]
status = "specified"
source_refs = ["SPEC_RUNTIME_ENGINE_001"]

[oracle]
kind = "trust_contract"
ref = "SPEC_RUNTIME_ENGINE_001#6-9-7-runtime-web-authentication-and-post-admission"

[[behavior]]
partition = { equals = "LOCAL_LOOPBACK_SOCKET_AUTHORITY" }
case_family = "auth_or_permission"
oracle_ref = "SPEC_RUNTIME_ENGINE_001#6-9-7-runtime-web-authentication-and-post-admission"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "none", status = "unchanged" }
rationale = "Local mode grants Admin only to IPv4 or IPv6 loopback peers and ignores a token header as an alternative source of local authority."

[[behavior]]
partition = { equals = "LOCAL_NON_LOOPBACK_OR_UNKNOWN_PEER" }
case_family = "auth_or_permission"
oracle_ref = "SPEC_RUNTIME_ENGINE_001#6-9-7-runtime-web-authentication-and-post-admission"
outcome = "reject"
no_partial_apply = true
delta = { target = "unchanged", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "expected_diagnostic", status = "not_safe_reported" }
rationale = "A non-loopback or unavailable peer has no local-mode authority even when it supplies a token header."

[[behavior]]
partition = { equals = "PRIMARY_TOKEN_EXACT_ADMIN" }
case_family = "auth_or_permission"
oracle_ref = "SPEC_RUNTIME_ENGINE_001#6-9-7-runtime-web-authentication-and-post-admission"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "none", status = "unchanged" }
rationale = "The first case-insensitive token header name is accepted only when its byte-exact untrimmed value matches the primary credential, and that exact value is forwarded."

[[behavior]]
partition = { equals = "PAIRING_TOKEN_ROLE_FALLBACK" }
case_family = "auth_or_permission"
oracle_ref = "SPEC_RUNTIME_ENGINE_001#6-9-7-runtime-web-authentication-and-post-admission"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "none", status = "unchanged" }
rationale = "An exact enabled pairing token supplies only its stored role after primary-token mismatch and remains subject to the route's role requirement."

[[behavior]]
partition = { equals = "MISSING_UNKNOWN_OR_UNAVAILABLE_CREDENTIAL" }
case_family = "missing_required"
oracle_ref = "SPEC_RUNTIME_ENGINE_001#6-9-7-runtime-web-authentication-and-post-admission"
outcome = "reject"
no_partial_apply = true
delta = { target = "unchanged", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "expected_diagnostic", status = "not_safe_reported" }
rationale = "Missing or unknown tokens, absent pairing authority, and poisoned primary credential state fail closed without falling through to another authority source."

[[behavior]]
partition = { equals = "STABLE_UNAUTHORIZED_AND_FORBIDDEN_JSON" }
case_family = "auth_or_permission"
oracle_ref = "SPEC_RUNTIME_ENGINE_001#6-9-7-runtime-web-authentication-and-post-admission"
outcome = "reject"
no_partial_apply = true
delta = { target = "unchanged", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "stable_error", status = "not_safe_reported" }
rationale = "Absent authority and insufficient role remain distinct JSON denials with stable status, content type, ok=false, and error text."

[[behavior]]
partition = { equals = "IDE_SESSION_HEADER_IDENTITY" }
case_family = "encoding_or_unicode"
oracle_ref = "SPEC_RUNTIME_ENGINE_001#6-9-7-runtime-web-authentication-and-post-admission"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "none", status = "unchanged" }
rationale = "The IDE-session header name is ASCII-case-insensitive, an absent header stays absent, and a present value is preserved exactly."

[[behavior]]
partition = { equals = "EXACT_JSON_MEDIA_TYPE" }
case_family = "wrong_type_or_shape"
oracle_ref = "SPEC_RUNTIME_ENGINE_001#6-9-7-runtime-web-authentication-and-post-admission"
outcome = "reject"
no_partial_apply = true
delta = { target = "unchanged", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "stable_error", status = "not_safe_reported" }
rationale = "Required JSON admits application/json case-insensitively with parameters and rejects absence, unrelated types, and prefix or suffix lookalikes; optional JSON does not manufacture the requirement."

[[behavior]]
partition = { equals = "SAME_ORIGIN_OR_LOOPBACK_ABSENCE" }
case_family = "auth_or_permission"
oracle_ref = "SPEC_RUNTIME_ENGINE_001#6-9-7-runtime-web-authentication-and-post-admission"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "stable_error", status = "unchanged" }
rationale = "A missing Origin is accepted only for loopback; a supplied origin requires Host and exact normalized scheme, host, and port equality with no path, opaque null, or prefix match."

[[behavior]]
partition = { equals = "BOUNDED_JSON_BODY_CLASSIFICATION" }
case_family = "boundary_high"
oracle_ref = "SPEC_RUNTIME_ENGINE_001#6-9-7-runtime-web-authentication-and-post-admission"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "stable_error", status = "unchanged" }
rationale = "The exact inclusive byte limit parses and preserves nested JSON, one byte over is too large, malformed or empty content is invalid, and maximum-usize arithmetic cannot overflow."

