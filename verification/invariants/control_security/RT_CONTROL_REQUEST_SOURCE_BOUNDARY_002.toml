schema_version = 1
id = "RT_CONTROL_REQUEST_SOURCE_BOUNDARY_002"
title = "Control request, endpoint, credential-channel, and source boundaries are exact"
area = "control_security"
risk = "security"
status = "mapped"
owner = "trust-runtime"
last_reviewed = "2026-08-01"
claim = "The control server admits only exact local endpoint forms, preserves registered source identity, decodes one request into one response, projects the reviewed access/role authority, and injects server-owned authority fields without overwriting explicit authentication or malformed parameter shapes."
proof_level = "S0"
contract_kind = "protocol_trace"
source_refs = ["docs/specs/11-runtime-engine.md", "crates/trust-runtime/src/control/tests/control_endpoint_source_contract.rs", "crates/trust-runtime/src/control/tests/control_request_boundary_contract.rs"]
tests = ["TEST_AUTO_FC73D9AFC867CA81AE8F"]
gates = ["veryquick", "pr"]
evidence_refs = []
spec_gap_refs = []
missing = ["focused_execution_evidence", "assertion_reachability", "mutation_sensitivity", "broad_remote_gate"]
[spec]
status = "specified"
source_refs = ["SPEC_RUNTIME_ENGINE_001"]
[oracle]
kind = "trust_contract"
ref = "SPEC_RUNTIME_ENGINE_001#695-runtime-control-authorization"

[[behavior]]
partition = { equals = "NUMERIC_LOOPBACK_TCP_ENDPOINT" }
case_family = "happy_path"
oracle_ref = "SPEC_RUNTIME_ENGINE_001#695-runtime-control-authorization"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "none", status = "unchanged" }
rationale = "Exact numeric IPv4 or bracketed IPv6 loopback socket forms preserve their parsed address and required port."
[[behavior]]
partition = { equals = "NONLOCAL_OR_MALFORMED_TCP_ENDPOINT" }
case_family = "hardware_or_network_fault"
oracle_ref = "SPEC_RUNTIME_ENGINE_001#695-runtime-control-authorization"
outcome = "reject"
no_partial_apply = true
delta = { target = "unchanged", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "expected_diagnostic", status = "unchanged" }
rationale = "Hostnames, non-loopback IPs, absent ports, whitespace, case variants, and trailing text reject before binding."
[[behavior]]
partition = { equals = "UNIX_SOCKET_PATH_IDENTITY" }
case_family = "platform_or_filesystem_variation"
oracle_ref = "SPEC_RUNTIME_ENGINE_001#695-runtime-control-authorization"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "none", status = "unchanged" }
rationale = "Unix endpoints require and preserve one nonempty absolute or relative socket path without inventing a default."
[[behavior]]
partition = { equals = "REGISTERED_SOURCE_EXACT_ID_PATH_AND_TEXT" }
case_family = "happy_path"
oracle_ref = "SPEC_RUNTIME_ENGINE_001#695-runtime-control-authorization"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "none", status = "unchanged" }
rationale = "Registration order, IDs, paths, and text are preserved and duplicate ID lookup returns the first registered row."
[[behavior]]
partition = { equals = "PROJECT_RELATIVE_AND_UNIQUE_SUFFIX_LOOKUP" }
case_family = "platform_or_filesystem_variation"
oracle_ref = "SPEC_RUNTIME_ENGINE_001#695-runtime-control-authorization"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "none", status = "unchanged" }
rationale = "Exact, project-relative, project-src, canonical-equivalent, and unique suffix lookup follow the specified precedence."
[[behavior]]
partition = { equals = "AMBIGUOUS_SUFFIX_OR_UNMATCHED_ABSOLUTE" }
case_family = "duplicate_or_collision"
oracle_ref = "SPEC_RUNTIME_ENGINE_001#695-runtime-control-authorization"
outcome = "reject"
no_partial_apply = true
delta = { target = "unchanged", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "expected_diagnostic", status = "unchanged" }
rationale = "Ambiguous relative suffixes and unmatched absolute paths return no source rather than selecting a candidate."
[[behavior]]
partition = { equals = "ONE_REQUEST_ONE_RESPONSE" }
case_family = "ordering_or_lifecycle"
oracle_ref = "SPEC_RUNTIME_ENGINE_001#runtime-control-request-job-and-state-surface-contract"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "expected_diagnostic", status = "unchanged" }
rationale = "Each request line decodes and routes once and produces one serialized response; malformed input returns the stable negative envelope."
[[behavior]]
partition = { equals = "WEB_AUTH_INJECTION_ONLY_WHEN_ABSENT" }
case_family = "auth_or_permission"
oracle_ref = "SPEC_RUNTIME_ENGINE_001#695-runtime-control-authorization"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "none", status = "unchanged" }
rationale = "Web dispatch injects a header token only when auth is absent and never overwrites explicit string, null, or malformed auth."
[[behavior]]
partition = { equals = "SERVER_OWNED_CREDENTIAL_CHANNEL" }
case_family = "auth_or_permission"
oracle_ref = "SPEC_RUNTIME_ENGINE_001#695-runtime-control-authorization"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "none", status = "unchanged" }
rationale = "Only named communication operations receive one server-owned trusted/untrusted channel classification, replacing caller values only in an object."
[[behavior]]
partition = { equals = "BOUNDED_EVENT_TIME_AND_PORT_CONTEXT" }
case_family = "boundary_high"
oracle_ref = "SPEC_RUNTIME_ENGINE_001#runtime-control-request-job-and-state-surface-contract"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "none", status = "unchanged" }
rationale = "Control context preserves owned project/resource identity and event time remains nonnegative and representable by signed 64-bit wire fields."

[[behavior]]
partition = { equals = "ACCESS_CAPABILITY_ROLE_AND_RESULT_PROJECTION" }
case_family = "auth_or_permission"
oracle_ref = "SPEC_RUNTIME_ENGINE_001#695-runtime-control-authorization"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "none", status = "unchanged" }
rationale = "Every role projects its exact capabilities and registry-owned required-role port; result objects receive access metadata without changing scalar, array, null, or error results, and capability reason capitalization remains total for empty, ASCII, and Unicode input."

