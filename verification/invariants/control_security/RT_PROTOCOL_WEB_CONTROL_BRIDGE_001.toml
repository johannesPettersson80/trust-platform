[[behavior]]
partition = { equals = "OUTBOUND_PROXY_STRIPS_INTERNAL_TOKEN" }
case_family = "auth_or_permission"
oracle_ref = "SPEC_RUNTIME_ENGINE_001#ads-browser-to-control-boundary"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "none", status = "unchanged" }
rationale = "The generic proxy request contains neither the internal token nor its authentication header."

[[coverage.cells]]
dimension = "auth_or_permission"
state = "gap_open"
rationale = "Both credential-boundary behaviors are specified; catalog mapping and focused execution remain open."
