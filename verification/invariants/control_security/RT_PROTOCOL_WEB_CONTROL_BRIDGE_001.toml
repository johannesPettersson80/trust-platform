[oracle]
kind = "trust_contract"
ref = "SPEC_RUNTIME_ENGINE_001#ads-browser-to-control-boundary"

[[behavior]]
partition = { equals = "LOCAL_WEB_AUTH_TO_IN_PROCESS_CONTROL" }
case_family = "auth_or_permission"
oracle_ref = "SPEC_RUNTIME_ENGINE_001#ads-browser-to-control-boundary"
outcome = "accept_value"
