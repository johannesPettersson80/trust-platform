schema_version = 1
id = "IEC_LEXER_CANDIDATE_BOUNDARIES_002"
title = "Lexer candidate ownership and trivia boundaries fail closed"
area = "compiler_iec"
risk = "wrong_result"
status = "specified"
owner = "trust-syntax"
last_reviewed = "2026-08-01"
claim = "The lexer consumes each reviewed identifier, numeric, duration, temporal, string, comment, pragma, and whitespace candidate as one lossless source partition, accepts only its specified lexical family, and emits Error rather than a valid prefix when the complete candidate is malformed."
proof_level = "S0"
contract_kind = "decision_table"
source_refs = [
  "crates/trust-syntax/src/lexer/mod.rs",
  "crates/trust-syntax/src/lexer/tokens.rs",
  "crates/trust-syntax/src/lexer/tokens/token_kind.rs",
  "docs/specs/01-lexical-elements.md",
]
tests = []
gates = ["veryquick", "pr"]
evidence_refs = []
spec_gap_refs = []
missing = [
  "catalog_mapping",
  "assertion_reachability",
  "mutation_sensitivity",
  "broad_remote_gate",
]

[input]
name = "source_candidate"
type = "Structured Text lexical candidate"
declared = "One complete candidate beginning at the current source position, including every character owned by its identifier, literal, comment, pragma, or whitespace family"

[spec]
status = "specified"
source_refs = ["SPEC_IEC_LEXICAL_ELEMENTS_001"]

[oracle]
kind = "trust_contract"
ref = "SPEC_IEC_LEXICAL_ELEMENTS_001#lexical-rejection-and-value-validation-boundary"

[[behavior]]
partition = { equals = "IEC_IDENTIFIER_FORM" }
case_family = "happy_path"
oracle_ref = "SPEC_IEC_LEXICAL_ELEMENTS_001#2-identifiers-table-2-section-6-1-2"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "none", status = "unchanged" }
rationale = "A supported ASCII identifier, including a permitted single leading underscore and significant internal underscore positions, is emitted as one Ident token."

[[behavior]]
partition = { equals = "INVALID_IDENTIFIER_CANDIDATE" }
case_family = "wrong_type_or_shape"
oracle_ref = "SPEC_IEC_LEXICAL_ELEMENTS_001#lexical-rejection-and-value-validation-boundary"
outcome = "reject"
no_partial_apply = true
delta = { target = "unchanged", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "stable_error", status = "unchanged" }
rationale = "A Unicode identifier, sole underscore, repeated leading or embedded underscore, or trailing underscore is one Error candidate and is never split into a valid Ident prefix."

[[behavior]]
partition = { equals = "DECIMAL_AND_BASED_DIGIT_FORM" }
case_family = "happy_path"
oracle_ref = "SPEC_IEC_LEXICAL_ELEMENTS_001#7-numeric-literals-table-5-section-6-3-2"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "none", status = "unchanged" }
rationale = "Decimal digits with legal separators and binary, octal, or hexadecimal digits within the declared base retain one numeric token."

[[behavior]]
partition = { equals = "REAL_FRACTION_AND_EXPONENT_FORM" }
case_family = "happy_path"
oracle_ref = "SPEC_IEC_LEXICAL_ELEMENTS_001#7-numeric-literals-table-5-section-6-3-2"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "none", status = "unchanged" }
rationale = "A real fraction and an exponent with its required digits, optional sign, and legal separators are emitted as one RealLiteral."

[[behavior]]
partition = { equals = "INVALID_NUMERIC_CANDIDATE" }
case_family = "wrong_type_or_shape"
oracle_ref = "SPEC_IEC_LEXICAL_ELEMENTS_001#lexical-rejection-and-value-validation-boundary"
outcome = "reject"
no_partial_apply = true
delta = { target = "unchanged", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "stable_error", status = "unchanged" }
rationale = "A leading, trailing, or repeated separator, out-of-base digit, missing exponent digit, or sign embedded after a based prefix makes the complete numeric candidate Error."

[[behavior]]
partition = { equals = "DURATION_ALIAS_CASE_AND_COMPOSITION" }
case_family = "happy_path"
oracle_ref = "SPEC_IEC_LEXICAL_ELEMENTS_001#10-duration-literals-table-8-section-6-3-4"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "none", status = "unchanged" }
rationale = "TIME and LTIME prefix aliases and unit names are case-insensitive, and a fraction is accepted on the least-significant written unit."

[[behavior]]
partition = { equals = "INVALID_DURATION_CANDIDATE" }
case_family = "wrong_type_or_shape"
oracle_ref = "SPEC_IEC_LEXICAL_ELEMENTS_001#lexical-rejection-and-value-validation-boundary"
outcome = "reject"
no_partial_apply = true
delta = { target = "unchanged", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "stable_error", status = "unchanged" }
rationale = "A duration exponent or a fractional unit followed by another less-significant unit makes the complete duration candidate Error."

[[behavior]]
partition = { equals = "TEMPORAL_PREFIX_ALIAS_AND_SHAPE" }
case_family = "happy_path"
oracle_ref = "SPEC_IEC_LEXICAL_ELEMENTS_001#11-date-and-time-literals-table-9-section-6-3-5"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "none", status = "unchanged" }
rationale = "Supported short and long date, time-of-day, and date-time prefix aliases with exact external field widths retain their temporal token family."

[[behavior]]
partition = { equals = "INVALID_TEMPORAL_FIELD_WIDTH" }
case_family = "wrong_type_or_shape"
oracle_ref = "SPEC_IEC_LEXICAL_ELEMENTS_001#lexical-rejection-and-value-validation-boundary"
outcome = "reject"
no_partial_apply = true
delta = { target = "unchanged", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "stable_error", status = "unchanged" }
rationale = "A temporal candidate with an incorrectly sized external field is Error rather than a valid temporal prefix plus residual tokens."

[[behavior]]
partition = { equals = "SHAPE_VALID_TEMPORAL_VALUE_INVALID" }
case_family = "boundary_low"
oracle_ref = "SPEC_IEC_LEXICAL_ELEMENTS_001#lexical-rejection-and-value-validation-boundary"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "none", status = "unchanged" }
rationale = "A shape-valid calendar date or clock remains a temporal token even when later semantic value validation must reject its fields."

[[behavior]]
partition = { equals = "NARROW_AND_WIDE_ESCAPE_FAMILIES" }
case_family = "happy_path"
oracle_ref = "SPEC_IEC_LEXICAL_ELEMENTS_001#9-escape-sequences-table-7-section-6-3-3"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "none", status = "unchanged" }
rationale = "Narrow and wide strings accept their documented control, dollar, quote, and exact-width hexadecimal escape families."

[[behavior]]
partition = { equals = "INVALID_STRING_ESCAPE_FAMILY_OR_WIDTH" }
case_family = "wrong_type_or_shape"
oracle_ref = "SPEC_IEC_LEXICAL_ELEMENTS_001#lexical-rejection-and-value-validation-boundary"
outcome = "reject"
no_partial_apply = true
delta = { target = "unchanged", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "stable_error", status = "unchanged" }
rationale = "A wrong-family quote escape, unknown escape, or short hexadecimal escape makes the string candidate Error and never a valid string token."

[[behavior]]
partition = { equals = "UNTERMINATED_STRING" }
case_family = "wrong_type_or_shape"
oracle_ref = "SPEC_IEC_LEXICAL_ELEMENTS_001#lexical-rejection-and-value-validation-boundary"
outcome = "reject"
no_partial_apply = true
delta = { target = "unchanged", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "stable_error", status = "unchanged" }
rationale = "A string without its matching quote is Error through the available candidate text."

[[behavior]]
partition = { equals = "MATCHED_BLOCK_COMMENT_NESTING" }
case_family = "happy_path"
oracle_ref = "SPEC_IEC_LEXICAL_ELEMENTS_001#5-comments-table-3-section-6-1-5"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "none", status = "unchanged" }
rationale = "Pascal and C block-comment families nest and close only with their own matching delimiter pair."

[[behavior]]
partition = { equals = "OTHER_COMMENT_FAMILY_IS_TEXT" }
case_family = "boundary_low"
oracle_ref = "SPEC_IEC_LEXICAL_ELEMENTS_001#5-comments-table-3-section-6-1-5"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "none", status = "unchanged" }
rationale = "The other block-comment family's delimiters are ordinary text and cannot alter nesting depth."

[[behavior]]
partition = { equals = "COMMENT_MARKERS_INSIDE_STRING" }
case_family = "boundary_low"
oracle_ref = "SPEC_IEC_LEXICAL_ELEMENTS_001#5-comments-table-3-section-6-1-5"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "none", status = "unchanged" }
rationale = "Comment markers inside a narrow or wide string remain string content and never start a comment."

[[behavior]]
partition = { equals = "LINE_COMMENT_TERMINATOR" }
case_family = "boundary_low"
oracle_ref = "SPEC_IEC_LEXICAL_ELEMENTS_001#5-comments-table-3-section-6-1-5"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "none", status = "unchanged" }
rationale = "A line comment stops before carriage return, line feed, or form feed and leaves the terminator for the following Whitespace token."

[[behavior]]
partition = { equals = "WHITESPACE_TRIVIA_SOURCE_PARTITION" }
case_family = "happy_path"
oracle_ref = "SPEC_IEC_LEXICAL_ELEMENTS_001#4-white-space-section-6-1-4"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "none", status = "unchanged" }
rationale = "Each maximal run of space, tab, carriage return, line feed, or form feed is one lossless Whitespace trivia token."

[[behavior]]
partition = { equals = "UNTERMINATED_BLOCK_COMMENT_OR_PRAGMA" }
case_family = "wrong_type_or_shape"
oracle_ref = "SPEC_IEC_LEXICAL_ELEMENTS_001#lexical-rejection-and-value-validation-boundary"
outcome = "reject"
no_partial_apply = true
delta = { target = "unchanged", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "stable_error", status = "unchanged" }
rationale = "A block comment or pragma without its matching closing delimiter is Error through all available candidate text."

