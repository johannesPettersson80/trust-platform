schema_version = 1
id = "IEC_HIR_STANDARD_FUNCTIONS_001"
title = "HIR validates standard functions and documented allocation extensions"
area = "compiler_iec"
risk = "wrong_result"
status = "specified"
owner = "trust-hir"
last_reviewed = "2026-07-26"
claim = "Registered conversion, numeric, bitwise, validation, string, time, assertion, allocation, and deletion calls enforce their written arity and type domains."
proof_level = "S0"
contract_kind = "decision_table"
source_refs = ["crates/trust-hir/src"]
tests = []
gates = ["pr"]
evidence_refs = []
