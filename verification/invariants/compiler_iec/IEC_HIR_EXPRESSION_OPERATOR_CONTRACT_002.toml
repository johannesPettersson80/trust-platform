oracle_ref = "SPEC_IEC_EXPRESSIONS_001#61-arithmetic-operations"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "none", status = "unchanged" }
rationale = "Numeric arithmetic uses exact identity or one accuracy-preserving common type and produces that reviewed result type."
