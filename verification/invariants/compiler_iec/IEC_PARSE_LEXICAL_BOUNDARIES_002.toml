schema_version = 1
id = "IEC_PARSE_LEXICAL_BOUNDARIES_002"
title = "Parser preserves valid lexical forms and rejects lexer errors"
area = "compiler_iec"
risk = "wrong_result"
status = "specified"
owner = "trust-syntax"
last_reviewed = "2026-08-01"
claim = "The parser consumes valid lexical forms and trivia without reconstruction, retains shape-valid temporal tokens for later value validation, and never reinterprets an Error candidate as valid Structured Text."
proof_level = "S0"
contract_kind = "decision_table"
source_refs = [
  "crates/trust-syntax/src/lexer",
  "crates/trust-syntax/src/parser",
  "docs/specs/01-lexical-elements.md",
]
tests = []
gates = ["veryquick", "pr"]
evidence_refs = []
spec_gap_refs = []
missing = ["catalog_mapping", "assertion_reachability", "mutation_sensitivity", "broad_remote_gate"]

[spec]
status = "specified"
source_refs = ["SPEC_IEC_LEXICAL_ELEMENTS_001"]

[oracle]
kind = "trust_contract"
ref = "SPEC_IEC_LEXICAL_ELEMENTS_001#parser-handoff-boundary"

[[behavior]]
partition = { equals = "TRIVIA_HANDOFF" }
case_family = "happy_path"
oracle_ref = "SPEC_IEC_LEXICAL_ELEMENTS_001#parser-handoff-boundary"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "none", status = "unchanged" }
rationale = "Comments and pragmas remain lossless trivia and do not change the surrounding grammar."

[[behavior]]
partition = { equals = "VALID_TEMPORAL_LITERAL_HANDOFF" }
case_family = "happy_path"
oracle_ref = "SPEC_IEC_LEXICAL_ELEMENTS_001#parser-handoff-boundary"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "none", status = "unchanged" }
rationale = "Date, time, and duration prefix aliases and legal fractional separators remain their corresponding literal syntax nodes."

[[behavior]]
partition = { equals = "VALID_NUMERIC_LITERAL_HANDOFF" }
case_family = "happy_path"
oracle_ref = "SPEC_IEC_LEXICAL_ELEMENTS_001#parser-handoff-boundary"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "none", status = "unchanged" }
rationale = "Complete decimal, based, signed, fractional, and exponent numeric tokens retain their literal syntax."

[[behavior]]
partition = { equals = "VALID_IDENTIFIER_AND_KEYWORD_HANDOFF" }
case_family = "happy_path"
oracle_ref = "SPEC_IEC_LEXICAL_ELEMENTS_001#parser-handoff-boundary"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "none", status = "unchanged" }
rationale = "Supported identifier forms and case-insensitive keywords retain their distinct parser roles."

[[behavior]]
partition = { equals = "VALID_STRING_ESCAPE_HANDOFF" }
case_family = "happy_path"
oracle_ref = "SPEC_IEC_LEXICAL_ELEMENTS_001#parser-handoff-boundary"
