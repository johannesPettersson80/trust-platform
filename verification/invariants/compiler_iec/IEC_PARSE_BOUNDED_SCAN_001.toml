schema_version = 1
id = "IEC_PARSE_BOUNDED_SCAN_001"
title = "Parser recovery scans respect nested delimiters and owning boundaries"
area = "compiler_iec"
risk = "silent_corruption"
status = "mapped"
owner = "trust-syntax"
last_reviewed = "2026-07-25"
claim = "A bounded parser-recovery scan treats separators and closing delimiters as top-level only outside nested parentheses and brackets, returns the owning closer after balanced nesting, and stops before the configured statement boundary when malformed nesting prevents that close."
proof_level = "S0"
contract_kind = "decision_table"
source_refs = ["crates/trust-syntax/src/parser/parser.rs"]
tests = ["TEST_AUTO_24926AF7B506A67CE190", "TEST_AUTO_3C5D1667AD9E1B86A142", "TEST_AUTO_5F59509A6C430C5EE9F8", "TEST_AUTO_7A7978359CD7CD06FA6F", "TEST_AUTO_B29671FE018210E9C48E"]
gates = ["veryquick", "pr"]
evidence_refs = []
spec_gap_refs = []
missing = ["assertion_reachability", "broad_remote_gate"]

[spec]
status = "specified"
source_refs = ["SPEC_IEC_STATEMENTS_001", "SPEC_IEC_DECISIONS_001"]

[oracle]
kind = "trust_contract"
ref = "SPEC_IEC_STATEMENTS_001#malformed-source-recovery"

[[behavior]]
partition = { equals = "BALANCED_BRACKET_CONTAINS_COMMA" }
case_family = "boundary_high"
oracle_ref = "SPEC_IEC_STATEMENTS_001#malformed-source-recovery"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "none", status = "unchanged" }
rationale = "A comma inside balanced brackets is not top-level, so the scan returns the owning closing parenthesis."

[[behavior]]
partition = { equals = "UNCLOSED_BRACKET_REACHES_STATEMENT_BOUNDARY" }
case_family = "wrong_type_or_shape"
oracle_ref = "SPEC_IEC_STATEMENTS_001#malformed-source-recovery"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "none", status = "unchanged" }
rationale = "An unclosed bracket keeps its comma non-top-level, so the scan returns the configured semicolon boundary."

[[behavior]]
partition = { equals = "MISMATCHED_RPAREN_INSIDE_UNCLOSED_BRACKET" }
case_family = "wrong_type_or_shape"
oracle_ref = "SPEC_IEC_STATEMENTS_001#malformed-source-recovery"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "none", status = "unchanged" }
rationale = "A closing parenthesis inside an unclosed bracket cannot close the outer construct; recovery returns and preserves the following semicolon boundary."

[[behavior]]
partition = { equals = "BALANCED_NESTED_PAREN_BEFORE_OWNER_CLOSE" }
case_family = "boundary_high"
oracle_ref = "SPEC_IEC_STATEMENTS_001#malformed-source-recovery"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "none", status = "unchanged" }
rationale = "After a nested parenthesis is balanced, recovery returns the owning closing parenthesis and preserves the following semicolon."

[[behavior]]
partition = { equals = "BALANCED_NESTED_BRACKET_BEFORE_OWNER_CLOSE" }
case_family = "boundary_high"
oracle_ref = "SPEC_IEC_STATEMENTS_001#malformed-source-recovery"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "none", status = "unchanged" }
rationale = "After a nested bracket is balanced, recovery returns the owning closing parenthesis and preserves the following semicolon."

[[coverage.cells]]
dimension = "boundary_high"
state = "covered"
rationale = "Focused unit tests cover nested commas and balanced parenthesis and bracket depth before the owning closer."

[[coverage.cells]]
dimension = "wrong_type_or_shape"
state = "covered"
rationale = "Focused unit tests cover an unclosed bracket and a mismatched closing parenthesis stopping before the configured semicolon boundary."
