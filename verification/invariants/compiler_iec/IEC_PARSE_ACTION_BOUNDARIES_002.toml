schema_version = 1
id = "IEC_PARSE_ACTION_BOUNDARIES_002"
title = "Textual ACTION parser ownership and recovery boundaries"
area = "compiler_iec"
risk = "wrong_result"
status = "specified"
owner = "trust-syntax"
last_reviewed = "2026-08-01"
claim = "The parser accepts only the documented textual ACTION declaration shape in PROGRAM and FUNCTION_BLOCK owners, preserves each complete ST body under its own action node, and rejects malformed names, punctuation, ownership, nesting, local declarations, terminators, and unsupported textual-SFC forms visibly."
proof_level = "S0"
contract_kind = "decision_table"
source_refs = [
  "crates/trust-syntax/src/parser/grammar/pou/pou_part_06.rs",
  "docs/specs/04-pou-declarations.md",
]
tests = []
gates = ["veryquick", "pr"]
evidence_refs = []
spec_gap_refs = []
missing = [
  "catalog_mapping",
  "assertion_reachability",
  "mutation_sensitivity",
  "broad_remote_gate",
]

[spec]
status = "specified"
source_refs = ["SPEC_IEC_POU_DECLARATIONS_001"]

[oracle]
kind = "trust_contract"
ref = "SPEC_IEC_POU_DECLARATIONS_001#parser-acceptance-and-recovery-boundary"

[[behavior]]
partition = { equals = "VALID_OWNER_NAME_COLON_AND_TERMINATOR" }
case_family = "happy_path"
oracle_ref = "SPEC_IEC_POU_DECLARATIONS_001#parser-acceptance-and-recovery-boundary"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "none", status = "unchanged" }
rationale = "A PROGRAM or FUNCTION_BLOCK action with one identifier, one colon, and the matching terminator is one valid action declaration, including an empty body."

[[behavior]]
partition = { equals = "CASE_INSENSITIVE_ACTION_DELIMITERS" }
case_family = "happy_path"
oracle_ref = "SPEC_IEC_POU_DECLARATIONS_001#parser-acceptance-and-recovery-boundary"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "none", status = "unchanged" }
rationale = "ACTION and END_ACTION retain the language-wide case-insensitive keyword contract."

[[behavior]]
partition = { equals = "COMPLETE_ST_BODY_OWNERSHIP" }
case_family = "happy_path"
oracle_ref = "SPEC_IEC_POU_DECLARATIONS_001#parser-acceptance-and-recovery-boundary"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "none", status = "unchanged" }
rationale = "A complete ST statement list belongs to the action node while ordinary statements around the action remain owned by the enclosing POU."

[[behavior]]
partition = { equals = "MULTIPLE_ACTION_NODE_ISOLATION" }
case_family = "happy_path"
oracle_ref = "SPEC_IEC_POU_DECLARATIONS_001#parser-acceptance-and-recovery-boundary"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "none", status = "unchanged" }
rationale = "Several actions in one owner remain separate declarations and each retains only its own body."

[[behavior]]
partition = { equals = "ACTION_NAME_NAMESPACE_SEPARATION" }
case_family = "happy_path"
oracle_ref = "SPEC_IEC_POU_DECLARATIONS_001#parser-acceptance-and-recovery-boundary"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "none", status = "unchanged" }
rationale = "An owner variable may share an action spelling, and two different owners may independently use the same action spelling."

[[behavior]]
partition = { equals = "INVALID_ACTION_OWNER_OR_SCOPE" }
case_family = "wrong_type_or_shape"
oracle_ref = "SPEC_IEC_POU_DECLARATIONS_001#parser-acceptance-and-recovery-boundary"
outcome = "reject"
no_partial_apply = true
delta = { target = "unchanged", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "expected_diagnostic", status = "unchanged" }
rationale = "File, namespace, function, class, method, and property scopes cannot own a textual action declaration."

[[behavior]]
partition = { equals = "ACTION_LOCAL_VARIABLE_SECTION" }
case_family = "wrong_type_or_shape"
oracle_ref = "SPEC_IEC_POU_DECLARATIONS_001#parser-acceptance-and-recovery-boundary"
outcome = "reject"
no_partial_apply = true
delta = { target = "unchanged", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "expected_diagnostic", status = "unchanged" }
rationale = "An action body is a statement list and cannot declare an action-local VAR section."

[[behavior]]
partition = { equals = "MISSING_OR_RESERVED_ACTION_NAME" }
case_family = "wrong_type_or_shape"
oracle_ref = "SPEC_IEC_POU_DECLARATIONS_001#parser-acceptance-and-recovery-boundary"
outcome = "reject"
no_partial_apply = true
delta = { target = "unchanged", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "expected_diagnostic", status = "unchanged" }
rationale = "A missing name or reserved keyword in the name position cannot create an action declaration."

[[behavior]]
partition = { equals = "MISSING_OR_INVALID_ACTION_COLON" }
case_family = "wrong_type_or_shape"
oracle_ref = "SPEC_IEC_POU_DECLARATIONS_001#parser-acceptance-and-recovery-boundary"
outcome = "reject"
no_partial_apply = true
delta = { target = "unchanged", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "expected_diagnostic", status = "unchanged" }
rationale = "The required colon cannot be omitted, doubled, or replaced by a semicolon."

[[behavior]]
partition = { equals = "MISSING_ACTION_TERMINATOR" }
case_family = "wrong_type_or_shape"
oracle_ref = "SPEC_IEC_POU_DECLARATIONS_001#parser-acceptance-and-recovery-boundary"
outcome = "reject"
no_partial_apply = true
delta = { target = "unchanged", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "expected_diagnostic", status = "unchanged" }
rationale = "End of owner or source before END_ACTION produces a visible required-terminator diagnostic."

[[behavior]]
partition = { equals = "NESTED_ACTION_DECLARATION" }
case_family = "wrong_type_or_shape"
oracle_ref = "SPEC_IEC_POU_DECLARATIONS_001#parser-acceptance-and-recovery-boundary"
outcome = "reject"
no_partial_apply = true
delta = { target = "unchanged", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "expected_diagnostic", status = "unchanged" }
rationale = "An action body cannot own another textual action declaration."

[[behavior]]
partition = { equals = "UNSUPPORTED_TEXTUAL_SFC_BODY_FORM" }
case_family = "wrong_type_or_shape"
oracle_ref = "SPEC_IEC_POU_DECLARATIONS_001#parser-acceptance-and-recovery-boundary"
outcome = "reject"
no_partial_apply = true
delta = { target = "unchanged", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "expected_diagnostic", status = "unchanged" }
rationale = "Textual STEP and TRANSITION forms are not ST statements in the current front-end analysis profile."

