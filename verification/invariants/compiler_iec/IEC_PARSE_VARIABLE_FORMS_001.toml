[[behavior]]
partition = { equals = "VARIABLE_LENGTH_ARRAY_DECLARATIONS" }
case_family = "happy_path"
oracle_ref = "SPEC_IEC_VARIABLES_001#6-variable-length-arrays-tables-15-16-section-6545"
