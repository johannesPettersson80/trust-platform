contract_kind = "decision_table"
source_refs = ["crates/trust-syntax/src/parser", "docs/specs/03-variables.md"]
tests = []
gates = ["veryquick", "pr"]
evidence_refs = []
spec_gap_refs = []
missing = ["cataloged_behavior_tests", "assertion_reachability", "broad_remote_gate"]

[spec]
status = "specified"
source_refs = ["SPEC_IEC_VARIABLES_001", "SPEC_IEC_STATEMENTS_001", "SPEC_IEC_DATA_TYPES_CANDIDATE_001"]

[oracle]
kind = "trust_contract"
ref = "SPEC_IEC_VARIABLES_001"

[[behavior]]
partition = { equals = "VARIABLE_SECTIONS_AND_QUALIFIERS" }
case_family = "happy_path"
oracle_ref = "SPEC_IEC_VARIABLES_001#2-variable-section-keywords-figure-7-section-652"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "none", status = "unchanged" }
rationale = "Local, input, output, in-out, temporary, file-global, constant, retain, and persistent declarations remain in their declared sections with their qualifiers."

[[behavior]]
