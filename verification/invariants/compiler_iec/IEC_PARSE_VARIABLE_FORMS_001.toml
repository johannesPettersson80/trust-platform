delta = { target = "set_to_expected", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "none", status = "unchanged" }
rationale = "ARRAY[*] remains a variable-length array type in the documented input, in-out, and pointer-to-array declaration positions."

[[behavior]]
