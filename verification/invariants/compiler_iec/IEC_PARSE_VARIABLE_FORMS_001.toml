schema_version = 1
id = "IEC_PARSE_VARIABLE_FORMS_001"
title = "Parser preserves variable sections, addresses, arrays, and initializers"
area = "compiler_iec"
risk = "wrong_result"
status = "specified"
owner = "trust-syntax"
last_reviewed = "2026-07-26"
claim = "Documented variable sections, qualifiers, direct addresses, variable-length arrays, and declaration initializers parse without being confused with call or enumeration syntax, and malformed aggregate recovery remains bounded at declaration boundaries."
