schema_version = 1
id = "TRUST_CURRENT_DT_HOST_CLOCK_001"
title = "CURRENT_DT exposes one explicit UTC host-clock boundary"
area = "compiler_iec"
risk = "wrong_result"
status = "mapped"
owner = "language"
last_reviewed = "2026-08-11"
claim = "CURRENT_DT accepts no arguments, returns timezone-naive DT milliseconds from the UTC Unix epoch across the full nonnegative tick range, fails closed outside that range, and remains independent of logical, simulation, and replay clocks without hiding host-clock rollback."
