[[behavior]]
partition = { equals = "ZERO_ARGUMENT_DT_RESULT" }
case_family = "happy_path"
oracle_ref = "SPEC_IEC_STANDARD_FUNCTIONS_001#runtime-clock-sources-time-current-dt"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "unchanged", process_image = "unchanged", diagnostics = "none", status = "unchanged" }
rationale = "HIR and runtime dispatch accept the zero-argument call and preserve the DT result family."

[[behavior]]
partition = { equals = "NONZERO_ARGUMENT_REJECTED" }
case_family = "wrong_type_or_shape"
oracle_ref = "SPEC_IEC_STANDARD_FUNCTIONS_001#runtime-clock-sources-time-current-dt"
outcome = "reject"
no_partial_apply = true
delta = { target = "unchanged", siblings = "unchanged", retain = "unchanged", process_image = "unchanged", diagnostics = "expected_diagnostic", status = "unchanged" }
rationale = "HIR validation and runtime dispatch reject every supplied argument instead of ignoring it."

[[behavior]]
partition = { equals = "UTC_EPOCH_AND_MILLISECOND_TRUNCATION" }
case_family = "happy_path"
oracle_ref = "SPEC_RUNTIME_ENGINE_001#current-dt-host-clock-boundary"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "unchanged", process_image = "unchanged", diagnostics = "none", status = "unchanged" }
rationale = "A fixed UTC Unix host timestamp maps to timezone-naive DT ticks and discards only its positive sub-millisecond remainder."

[[behavior]]
partition = { equals = "FULL_NONNEGATIVE_DT_TICK_RANGE" }
case_family = "boundary_high"
oracle_ref = "SPEC_RUNTIME_ENGINE_001#current-dt-host-clock-boundary"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "unchanged", process_image = "unchanged", diagnostics = "none", status = "unchanged" }
rationale = "Unix tick zero and i64::MAX milliseconds are representable without narrowing the intermediate timestamp to signed nanoseconds."

[[behavior]]
partition = { equals = "PRE_EPOCH_OR_ABOVE_RANGE" }
case_family = "boundary_low"
oracle_ref = "SPEC_RUNTIME_ENGINE_001#current-dt-host-clock-boundary"
outcome = "reject"
no_partial_apply = true
delta = { target = "unchanged", siblings = "unchanged", retain = "unchanged", process_image = "unchanged", diagnostics = "none", status = "unchanged" }
rationale = "A pre-epoch or larger-than-DT host sample returns RuntimeError::Overflow without producing a value."

[[behavior]]
partition = { equals = "LOGICAL_CLOCK_INDEPENDENCE_AND_HOST_ROLLBACK" }
case_family = "time_or_clock_fault"
oracle_ref = "SPEC_RUNTIME_ENGINE_001#current-dt-host-clock-boundary"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "unchanged", process_image = "unchanged", diagnostics = "none", status = "unchanged" }
rationale = "Logical, manual, simulation, and replay time do not offset the host sample, while a lower later host sample remains visible rather than being clamped."

