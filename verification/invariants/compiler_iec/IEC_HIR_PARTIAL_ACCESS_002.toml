schema_version = 1
id = "IEC_HIR_PARTIAL_ACCESS_002"
title = "ANY_BIT partial access is typed, bounded, and base-preserving"
area = "compiler_iec"
risk = "silent_corruption"
status = "specified"
owner = "trust-hir"
last_reviewed = "2026-08-01"
claim = "Bit, byte, word, and double-word projections accept only the documented ANY_BIT bases and selector ranges, preserve the complete base path's mutability, and type each read or write exactly."
proof_level = "S0"
contract_kind = "decision_table"
source_refs = ["docs/specs/02-data-types.md", "crates/trust-hir/tests/semantic_type_checking/partial_access_acceptance.rs", "crates/trust-hir/tests/semantic_type_checking/partial_access_rejection.rs"]
