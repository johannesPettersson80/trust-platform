evidence_refs = []
spec_gap_refs = []
missing = ["catalog_mapping", "focused_execution_evidence", "assertion_reachability", "mutation_sensitivity", "broad_remote_gate"]
[spec]
status = "specified"
source_refs = ["SPEC_IEC_DATA_TYPES_CANDIDATE_001"]
[oracle]
kind = "trust_contract"
ref = "SPEC_IEC_DATA_TYPES_CANDIDATE_001#partial-access-to-any_bit-variables-table-17-section-6613"

[[behavior]]
partition = { equals = "SUPPORTED_BASE_AND_SELECTOR_MATRIX" }
case_family = "happy_path"
oracle_ref = "SPEC_IEC_DATA_TYPES_CANDIDATE_001#partial-access-to-any_bit-variables-table-17-section-6613"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "none", status = "unchanged" }
rationale = "BYTE, WORD, DWORD, and LWORD expose exactly their documented bit, byte, word, and dword selectors and result types."
[[behavior]]
partition = { equals = "CASE_INSENSITIVE_PREFIX_AND_DIGIT_SEPARATOR" }
case_family = "encoding_or_unicode"
oracle_ref = "SPEC_IEC_DATA_TYPES_CANDIDATE_001#partial-access-to-any_bit-variables-table-17-section-6613"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "none", status = "unchanged" }
rationale = "Selector prefixes are ASCII case-insensitive, digit separators are accepted, and omission of the prefix is limited to bit access."
[[behavior]]
partition = { equals = "DIRECT_ALIAS_TO_SUPPORTED_BITSTRING" }
case_family = "happy_path"
oracle_ref = "SPEC_IEC_DATA_TYPES_CANDIDATE_001#partial-access-to-any_bit-variables-table-17-section-6613"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "none", status = "unchanged" }
rationale = "A directly derived alias inherits the selector set and result type of its ultimate supported bit-string target."
[[behavior]]
partition = { equals = "COMPLETE_NESTED_BASE_PATH" }
case_family = "happy_path"
oracle_ref = "SPEC_IEC_DATA_TYPES_CANDIDATE_001#partial-access-to-any_bit-variables-table-17-section-6613"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "none", status = "unchanged" }
rationale = "Structure fields, array elements, object fields, dereferences, and VAR_IN_OUT aliases retain their complete type and lifetime path."
[[behavior]]
partition = { equals = "UNSUPPORTED_BASE_FAMILY" }
case_family = "wrong_type_or_shape"
oracle_ref = "SPEC_IEC_DATA_TYPES_CANDIDATE_001#partial-access-to-any_bit-variables-table-17-section-6613"
outcome = "reject"
no_partial_apply = true
delta = { target = "unchanged", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "expected_diagnostic", status = "unchanged" }
rationale = "BOOL, signed/unsigned integers, enums, strings, unselected arrays/aggregates, and directly represented variables do not acquire partial access."
[[behavior]]
partition = { equals = "SELECTOR_KIND_OR_RANGE_VIOLATION" }
case_family = "boundary_high"
oracle_ref = "SPEC_IEC_DATA_TYPES_CANDIDATE_001#partial-access-to-any_bit-variables-table-17-section-6613"
outcome = "reject"
no_partial_apply = true
delta = { target = "unchanged", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "expected_diagnostic", status = "unchanged" }
rationale = "A selector outside the closed type-specific range or wider than its base is rejected."
[[behavior]]
partition = { equals = "EXACT_PART_WRITE_TYPE" }
case_family = "wrong_type_or_shape"
oracle_ref = "SPEC_IEC_DATA_TYPES_CANDIDATE_001#partial-access-to-any_bit-variables-table-17-section-6613"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "expected_diagnostic", status = "unchanged" }
rationale = "Writes accept only assignment-compatible values of the selected BOOL, BYTE, WORD, or DWORD result type and preserve every unselected bit."
[[behavior]]
