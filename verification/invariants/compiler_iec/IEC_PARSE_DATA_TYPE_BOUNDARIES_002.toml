schema_version = 1
id = "IEC_PARSE_DATA_TYPE_BOUNDARIES_002"
title = "Data-type, reference, selector, and edge parser boundaries"
area = "compiler_iec"
risk = "wrong_result"
status = "specified"
owner = "trust-syntax"
last_reviewed = "2026-08-01"
claim = "The parser preserves documented generic, user-defined, reference, pointer, partial-access, string-index, and edge-declaration syntax for semantic analysis and visibly rejects incomplete or structurally invalid forms at bounded recovery boundaries."
proof_level = "S0"
contract_kind = "decision_table"
source_refs = [
  "crates/trust-syntax/src/parser/grammar/declarations.rs",
  "crates/trust-syntax/src/parser/grammar/expressions.rs",
  "crates/trust-syntax/src/parser/grammar/pou",
  "docs/specs/02-data-types.md",
  "docs/specs/03-variables.md",
]
tests = []
gates = ["veryquick", "pr"]
evidence_refs = []
spec_gap_refs = []
missing = ["catalog_mapping", "assertion_reachability", "mutation_sensitivity", "broad_remote_gate"]

[spec]
status = "specified"
source_refs = ["SPEC_IEC_DATA_TYPES_CANDIDATE_001", "SPEC_IEC_VARIABLES_001"]

[oracle]
kind = "trust_contract"
ref = "SPEC_IEC_DATA_TYPES_CANDIDATE_001#7-parser-acceptance-and-recovery-boundaries"

[[behavior]]
partition = { equals = "GENERIC_KEYWORD_TYPE_REFERENCE" }
case_family = "happy_path"
oracle_ref = "SPEC_IEC_DATA_TYPES_CANDIDATE_001#7-parser-acceptance-and-recovery-boundaries"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "none", status = "unchanged" }
rationale = "Every case spelling of every ANY-family keyword retains a generic TypeRef node."

