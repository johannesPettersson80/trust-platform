delta = { target = "set_to_expected", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "none", status = "unchanged" }
rationale = "IEC keywords and explicitly documented truST extension keywords produce their registered keyword TokenKind while adjacent identifiers remain identifiers."

[[behavior]]
