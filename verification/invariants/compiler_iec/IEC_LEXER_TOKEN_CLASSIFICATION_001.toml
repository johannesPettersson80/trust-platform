schema_version = 1
id = "IEC_LEXER_TOKEN_CLASSIFICATION_001"
title = "Lexer assigns the specified token class"
area = "compiler_iec"
risk = "wrong_result"
status = "mapped"
owner = "trust-syntax"
last_reviewed = "2026-07-24"
claim = "The lexer classifies IEC and documented truST lexical forms as their exact TokenKind, recognizes keywords case-insensitively, and emits Error rather than a valid string token for an invalid escape."
proof_level = "S0"
contract_kind = "decision_table"
source_refs = [
  "crates/trust-syntax/src/lexer/tokens/token_kind.rs",
  "crates/trust-syntax/src/lexer/mod.rs",
]
tests = ["TEST_AUTO_AAADEA7806AA1F78A9A3"]
gates = ["veryquick", "pr"]
evidence_refs = []
spec_gap_refs = []
missing = [
  "cataloged_behavior_tests",
  "assertion_reachability",
  "mutation_sensitivity",
  "broad_remote_gate",
]

[input]
name = "source"
type = "Structured Text source"
declared = "One or more lexical forms governed by the registered lexical, expression, or variable specification"

[spec]
status = "specified"
source_refs = [
  "SPEC_IEC_LEXICAL_ELEMENTS_001",
  "SPEC_IEC_EXPRESSIONS_001",
  "SPEC_IEC_VARIABLES_001",
]

[oracle]
kind = "trust_contract"
ref = "SPEC_IEC_LEXICAL_ELEMENTS_001#6a-trust-emitted-token-contract"

[[behavior]]
partition = { equals = "CASE_INSENSITIVE_KEYWORD" }
case_family = "happy_path"
oracle_ref = "SPEC_IEC_LEXICAL_ELEMENTS_001#3-keywords-section-613"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "none", status = "unchanged" }
rationale = "Every supported case spelling of a keyword produces the same exact keyword TokenKind."

[[behavior]]
