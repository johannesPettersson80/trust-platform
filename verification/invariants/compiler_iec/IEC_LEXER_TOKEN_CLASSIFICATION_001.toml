kind = "trust_contract"
ref = "SPEC_IEC_LEXICAL_ELEMENTS_001#6a-trust-emitted-token-contract"

[[behavior]]
partition = { equals = "CASE_INSENSITIVE_KEYWORD" }
case_family = "happy_path"
oracle_ref = "SPEC_IEC_LEXICAL_ELEMENTS_001#3-keywords-section-613"
