delta = { target = "set_to_expected", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "none", status = "unchanged" }
rationale = "Complete and documented incomplete direct-address forms produce DirectAddress tokens."

[[behavior]]
partition = { equals = "HASH_PREFIXED_PRODUCT_IDENTIFIER" }
