[oracle]
kind = "trust_contract"
ref = "SPEC_HIR_WARNING_POLICY_001"

[[behavior]]
partition = { equals = "UNUSED_ELIGIBLE_DECLARATION" }
case_family = "missing_required"
oracle_ref = "SPEC_HIR_WARNING_POLICY_001"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "unchanged", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "expected_diagnostic", status = "unchanged" }
rationale = "Eligible unused locals, input parameters, constants, and POUs produce their warning; resolved calls, type use, configuration, and VAR_CONFIG paths suppress it."

[[behavior]]
partition = { equals = "ACCEPTED_IMPLICIT_CONVERSION" }
case_family = "wrong_type_or_shape"
oracle_ref = "SPEC_HIR_WARNING_POLICY_001"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "expected_diagnostic", status = "unchanged" }
rationale = "A compatible implicit conversion may warn without becoming an incompatibility error."

[[behavior]]
partition = { above = "CYCLOMATIC_COMPLEXITY_15" }
case_family = "above_max"
oracle_ref = "SPEC_HIR_WARNING_POLICY_001"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "unchanged", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "expected_diagnostic", status = "unchanged" }
rationale = "Complexity greater than 15 warns with bounded related decision points."

[[behavior]]
partition = { equals = "PROVEN_UNREACHABLE_STATEMENT_OR_FALSE_BRANCH" }
case_family = "ordering_or_lifecycle"
oracle_ref = "SPEC_HIR_WARNING_POLICY_001"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "unchanged", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "expected_diagnostic", status = "unchanged" }
rationale = "Statements after unconditional termination and literal-false IF or ELSIF branches produce the unreachable warning."

[[behavior]]
partition = { equals = "TIME_DATE_OR_DIRECT_IO_DECLARATION" }
case_family = "hardware_or_network_fault"
oracle_ref = "SPEC_HIR_WARNING_POLICY_001"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "unchanged", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "expected_diagnostic", status = "status_degraded" }
rationale = "Live time/date values and direct %I/%Q bindings are reported as nondeterministic engineering inputs."

[[behavior]]
partition = { equals = "MULTITASK_GLOBAL_WITH_WRITER" }
case_family = "concurrency_or_cancellation"
oracle_ref = "SPEC_HIR_WARNING_POLICY_001"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "unchanged", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "expected_diagnostic", status = "status_degraded" }
rationale = "A resolved global accessed from multiple tasks with at least one writer warns; one-task access does not."

[[behavior]]
partition = { equals = "FLOAT_EQUALITY_OR_INEQUALITY" }
case_family = "wrong_type_or_shape"
oracle_ref = "SPEC_HIR_WARNING_POLICY_001"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "expected_diagnostic", status = "unchanged" }
rationale = "Equality with a REAL-family operand warns, while integer-only equality does not."

[[behavior]]
partition = { equals = "DIV_OR_MOD_LITERAL_ZERO" }
case_family = "boundary_low"
oracle_ref = "SPEC_HIR_WARNING_POLICY_001"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "unchanged", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "expected_diagnostic", status = "unchanged" }
rationale = "A literal zero divisor warns; a nonliteral divisor does not receive this syntactic warning."

