schema_version = 1
id = "IEC_LEXER_PRAGMA_TRIVIA_001"
title = "Pragmas are lossless parser trivia only when brace-delimited"
area = "compiler_iec"
risk = "wrong_result"
status = "mapped"
owner = "trust-syntax"
last_reviewed = "2026-08-01"
claim = "A balanced brace-delimited pragma is emitted as one lossless Pragma token and classified as parser trivia so removing it preserves the exact tokenization of surrounding Structured Text; an unterminated opening brace is rejected as a lexical error rather than accepted as pragma trivia."
proof_level = "S0"
contract_kind = "decision_table"
source_refs = [
  "crates/trust-syntax/src/lexer/tokens/token_kind.rs",
  "crates/trust-syntax/src/lexer/tokens/token_kind_impl_classification.rs",
  "crates/trust-syntax/src/lexer/mod.rs",
]
tests = ["TEST_AUTO_2AF2E848622EF1F5885B", "TEST_AUTO_3BED96886BD89FD6AA6D", "TEST_AUTO_559831E7FED8B46A6B78", "TEST_AUTO_AAADEA7806AA1F78A9A3"]
gates = ["veryquick", "pr"]
evidence_refs = []
spec_gap_refs = []
missing = [
  "assertion_reachability",
  "mutation_sensitivity",
  "broad_remote_gate",
]

[input]
name = "source"
type = "Structured Text source"
declared = "A brace-delimited pragma, an unterminated pragma opening, or brace text inside a character string"

[spec]
status = "specified"
source_refs = ["SPEC_IEC_LEXICAL_ELEMENTS_001"]

[oracle]
kind = "trust_contract"
ref = "SPEC_IEC_LEXICAL_ELEMENTS_001#6a-trust-emitted-token-contract"

[[behavior]]
partition = { equals = "BALANCED_PRAGMA" }
case_family = "happy_path"
oracle_ref = "SPEC_IEC_LEXICAL_ELEMENTS_001#trust-lexer-contract"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "none", status = "unchanged" }
rationale = "The complete brace-delimited source is represented by one Pragma token."

[[behavior]]
partition = { equals = "PRAGMA_BETWEEN_ST_TOKENS" }
case_family = "happy_path"
oracle_ref = "SPEC_IEC_LEXICAL_ELEMENTS_001#trust-lexer-contract"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "none", status = "unchanged" }
rationale = "Pragma is trivia, and removing trivia preserves the exact token kinds before and after it."

[[behavior]]
partition = { equals = "BRACES_INSIDE_STRING_LITERAL" }
case_family = "happy_path"
oracle_ref = "SPEC_IEC_LEXICAL_ELEMENTS_001#trust-lexer-contract"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "none", status = "unchanged" }
rationale = "Brace text inside a character string remains part of the string token and is not emitted as a pragma."

[[behavior]]
partition = { equals = "UNTERMINATED_PRAGMA_REJECTION" }
case_family = "wrong_type_or_shape"
oracle_ref = "SPEC_IEC_LEXICAL_ELEMENTS_001#trust-lexer-contract"
outcome = "reject"
no_partial_apply = true
delta = { target = "unchanged", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "added", status = "error" }
rationale = "End of input before the closing brace is a lexical error and must not produce a balanced Pragma token."

[[coverage.cells]]
dimension = "happy_path"
state = "covered"
rationale = "Accepted catalog mappings bind reviewed assertions to every happy_path behavior in IEC_LEXER_PRAGMA_TRIVIA_001; dynamic proof, mutation sensitivity, and broad remote validation remain explicit debt."
