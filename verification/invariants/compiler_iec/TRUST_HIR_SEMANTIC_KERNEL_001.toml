missing = ["cataloged_behavior_tests", "assertion_reachability", "broad_remote_gate"]

[spec]
status = "specified"
source_refs = ["SPEC_HIR_SEMANTIC_KERNEL_001"]

[oracle]
kind = "trust_contract"
ref = "SPEC_HIR_SEMANTIC_KERNEL_001"

[[behavior]]
partition = { equals = "UNCHANGED_OR_UNRELATED_SOURCE" }
case_family = "happy_path"
oracle_ref = "SPEC_HIR_SEMANTIC_KERNEL_001"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "none", status = "unchanged" }
rationale = "Unchanged inputs preserve semantic results and may reuse public shared query values; unrelated edits do not invalidate a dependency-independent file query."

[[behavior]]
partition = { equals = "SOURCE_OR_DEPENDENCY_EDIT" }
case_family = "ordering_or_lifecycle"
oracle_ref = "SPEC_HIR_SEMANTIC_KERNEL_001"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "expected_diagnostic", status = "expected_delta" }
rationale = "The edited source and every dependent query recompute before returning, while independent siblings remain coherent."

[[behavior]]
partition = { equals = "REMOVE_AND_READD_SOURCE" }
case_family = "persistence_or_recovery"
oracle_ref = "SPEC_HIR_SEMANTIC_KERNEL_001"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "expected_diagnostic", status = "expected_delta" }
rationale = "Removal clears live query products and re-addition rebuilds resolution from the new project graph without stale dependencies."

[[behavior]]
partition = { equals = "CROSS_FILE_TRANSLATION" }
case_family = "happy_path"
oracle_ref = "SPEC_HIR_SEMANTIC_KERNEL_001"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "none", status = "unchanged" }
rationale = "Imported declarations, namespaces, compound types, callables, and initializers retain valid target-table identities and original source ownership."

[[behavior]]
partition = { malformed = "MISSING_OR_COLLIDING_INTERNAL_IDENTITY" }
coverage_dimension = "wrong_type_or_shape"
oracle_ref = "SPEC_HIR_SEMANTIC_KERNEL_001"
outcome = "reject"
no_partial_apply = true
delta = { target = "unchanged", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "expected_diagnostic", status = "unchanged" }
rationale = "File-ID collisions and missing array or pointer component identities fail closed instead of aliasing or becoming assignment-compatible."

[[behavior]]
partition = { equals = "NONRESOLVED_CONTEXT" }
case_family = "missing_required"
oracle_ref = "SPEC_HIR_SEMANTIC_KERNEL_001"
outcome = "reject"
no_partial_apply = true
delta = { target = "unchanged", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "expected_diagnostic", status = "unchanged" }
rationale = "Missing owner, scope, or name classifications remain explicit and never fall back to an unrelated global identity."

[[behavior]]
partition = { equals = "CONCURRENT_EDIT_QUERY_OR_CANCELLATION" }
case_family = "concurrency_or_cancellation"
oracle_ref = "SPEC_HIR_SEMANTIC_KERNEL_001"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "none", status = "unchanged" }
rationale = "A completed query observes one synchronized revision; cancellation or concurrency cannot panic, deadlock, or publish a partial model."

