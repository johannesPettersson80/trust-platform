schema_version = 1
id = "TRUST_HIR_SEMANTIC_KERNEL_001"
title = "HIR semantic queries publish one coherent project model"
area = "compiler_iec"
risk = "silent_corruption"
status = "specified"
owner = "trust-hir"
last_reviewed = "2026-07-26"
claim = "Source identity, query reuse and invalidation, cross-file translation, semantic outcomes, declaration catalogs, cancellation, and concurrency preserve one coherent project revision without stale or invented identities."
proof_level = "S0"
contract_kind = "decision_table"
source_refs = ["crates/trust-hir/src"]
tests = []
gates = ["pr"]
evidence_refs = []
