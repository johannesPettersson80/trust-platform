last_reviewed = "2026-07-25"
claim = "Assignment is accepted only when the left side resolves to modifiable storage or a property with a setter; read-only parameters, callable declarations, THIS, call results, and properties without setters are rejected."
proof_level = "S0"
contract_kind = "decision_table"
source_refs = ["crates/trust-hir/src"]
tests = []
gates = ["pr"]
evidence_refs = []
spec_gap_refs = []
missing = ["cataloged_behavior_tests", "assertion_reachability", "broad_remote_gate"]

[spec]
status = "specified"
source_refs = ["SPEC_IEC_SEMANTIC_RULES_001", "SPEC_IEC_STATEMENTS_001"]

[oracle]
kind = "trust_contract"
ref = "SPEC_IEC_SEMANTIC_RULES_001#2-1-valid-assignment-targets"

[[behavior]]
partition = { equals = "MODIFIABLE_STORAGE" }
case_family = "happy_path"
oracle_ref = "SPEC_IEC_SEMANTIC_RULES_001#2-1-valid-assignment-targets"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "none", status = "unchanged" }
rationale = "A resolved modifiable variable, output, in-out parameter, temporary, or property with a setter is a valid assignment target."

[[behavior]]
partition = { equals = "READ_ONLY_OR_NON_STORAGE_TARGET" }
case_family = "wrong_type_or_shape"
oracle_ref = "SPEC_IEC_SEMANTIC_RULES_001#2-1-valid-assignment-targets"
outcome = "reject"
no_partial_apply = true
delta = { target = "unchanged", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "expected_diagnostic", status = "unchanged" }
rationale = "VAR_INPUT, constants, callable declarations, THIS or SUPER, call-result fields, and properties without setters are not modifiable storage."

[[coverage.cells]]
dimension = "happy_path"
state = "gap_open"
rationale = "The written target contract is ready for generated catalog mapping; no test association is claimed yet."

[[coverage.cells]]
dimension = "wrong_type_or_shape"
