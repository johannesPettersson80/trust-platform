owner = "trust-hir"
last_reviewed = "2026-07-26"
claim = "SIZEOF produces the documented compile-time byte count for complete types and stable storage, uses platform pointer width, and rejects unknown, ambiguous, dynamic, or unsupported storage without diagnostic cascades."
proof_level = "S0"
contract_kind = "decision_table"
source_refs = ["crates/trust-hir/src"]
