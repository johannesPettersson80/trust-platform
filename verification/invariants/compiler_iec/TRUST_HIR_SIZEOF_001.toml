delta = { target = "unchanged", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "expected_diagnostic", status = "unchanged" }
rationale = "Calls, computed expressions, open arrays, function-block instances, and bare THIS lack a supported static HIR storage-size contract."

