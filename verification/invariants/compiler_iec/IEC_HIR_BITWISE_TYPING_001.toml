schema_version = 1
id = "IEC_HIR_BITWISE_TYPING_001"
title = "HIR preserves ANY_BIT operator result width"
area = "compiler_iec"
risk = "wrong_result"
status = "specified"
owner = "trust-hir"
last_reviewed = "2026-07-26"
claim = "Bitwise AND, ampersand, OR, and XOR accept ANY_BIT operands, produce the wider operand type, and cannot be assigned to a narrower target without an explicit conversion."
proof_level = "S0"
contract_kind = "decision_table"
source_refs = ["crates/trust-hir/src"]
tests = []
gates = ["pr"]
evidence_refs = []
spec_gap_refs = []
missing = ["cataloged_behavior_tests", "assertion_reachability", "broad_remote_gate"]

[spec]
status = "specified"
source_refs = ["SPEC_IEC_EXPRESSIONS_001"]

[oracle]
kind = "trust_contract"
ref = "SPEC_IEC_EXPRESSIONS_001#4-3-logical-boolean-operators"

[[behavior]]
partition = { equals = "ANY_BIT_OPERATORS_ACCEPTED" }
case_family = "happy_path"
oracle_ref = "SPEC_IEC_EXPRESSIONS_001#4-3-logical-boolean-operators"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "none", status = "unchanged" }
rationale = "The infix bitwise operator family accepts operands from the IEC ANY_BIT category."

[[behavior]]
partition = { equals = "AMPERSAND_WIDENS_LIKE_AND" }
case_family = "happy_path"
oracle_ref = "SPEC_IEC_EXPRESSIONS_001#4-3-logical-boolean-operators"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "none", status = "unchanged" }
rationale = "The ampersand spelling has the same result-type widening rule as AND."

[[behavior]]
partition = { malformed = "MIXED_WIDTH_RESULT_ASSIGNED_TO_NARROWER_TARGET" }
coverage_dimension = "wrong_type_or_shape"
oracle_ref = "SPEC_IEC_EXPRESSIONS_001#4-3-logical-boolean-operators"
outcome = "reject"
no_partial_apply = true
delta = { target = "unchanged", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "expected_diagnostic", status = "unchanged" }
rationale = "A mixed-width bitwise expression has the wider operand type and cannot silently shrink on assignment."

[[coverage.cells]]
dimension = "happy_path"
state = "gap_open"
rationale = "ANY_BIT and ampersand acceptance awaits catalog association."

[[coverage.cells]]
dimension = "wrong_type_or_shape"
