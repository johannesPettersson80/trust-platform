[[behavior]]
partition = { equals = "UNKNOWN_TASK_OR_NON_PROGRAM_TYPE" }
case_family = "wrong_type_or_shape"
oracle_ref = "SPEC_IEC_CONFIG_TASKS_001#3-validation-rules"
outcome = "reject"
no_partial_apply = true
delta = { target = "unchanged", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "expected_diagnostic", status = "unchanged" }
rationale = "A program binding to an unknown task or a declaration that is not a PROGRAM POU is rejected with the owning semantic diagnostic."

[[behavior]]
partition = { equals = "VALID_TASK_PARAMETER_DOMAIN" }
case_family = "happy_path"
oracle_ref = "SPEC_IEC_CONFIG_TASKS_001#3-validation-rules"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "none", status = "unchanged" }
rationale = "PRIORITY accepts exactly one unsigned decimal u32 value, SINGLE accepts a visible BOOL storage reference, and INTERVAL accepts a nonnegative TIME literal including zero, independently of field order and keyword case."

[[behavior]]
partition = { equals = "DUPLICATE_OR_CROSS_SCOPE_TASK_IDENTITY" }
case_family = "duplicate_or_collision"
oracle_ref = "SPEC_IEC_CONFIG_TASKS_001#3-validation-rules"
outcome = "reject"
no_partial_apply = true
delta = { target = "unchanged", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "expected_diagnostic", status = "unchanged" }
rationale = "Task names normalize ASCII case within their direct resource scope, duplicates reject, and a program binding cannot capture an equally named task from a sibling resource."

[[behavior]]
partition = { equals = "VALID_TASK_IDENTITY_AND_DIRECT_SCOPE" }
case_family = "happy_path"
oracle_ref = "SPEC_IEC_CONFIG_TASKS_001#3-validation-rules"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "none", status = "unchanged" }
rationale = "A task has one case-normalized identity in its direct resource scope, and a program binding resolves that identity case-insensitively only within the same scope."

