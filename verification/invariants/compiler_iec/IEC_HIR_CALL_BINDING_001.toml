coverage_dimension = "ordering_or_lifecycle"
oracle_ref = "SPEC_IEC_SEMANTIC_RULES_001#3-4-call-binding-errors"
outcome = "reject"
no_partial_apply = true
delta = { target = "unchanged", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "expected_diagnostic", status = "unchanged" }
rationale = "Once a formal assignment begins, a later positional argument is rejected."

