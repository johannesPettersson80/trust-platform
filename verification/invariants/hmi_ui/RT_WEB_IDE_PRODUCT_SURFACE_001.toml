no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "unchanged", process_image = "unchanged", diagnostics = "not_applicable", status = "unchanged" }
rationale = "Body-bearing and mutating requests use the bounded body lane and released permits are reusable without unbounded admission."

[[behavior]]
partition = { equals = "FOCUSED_APPLY_AND_FILE_SIZE_BUDGET" }
case_family = "boundary_high"
oracle_ref = "SPEC_RUNTIME_ENGINE_001#6-8-1e-standalone-web-ide-contract"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "unchanged", process_image = "unchanged", diagnostics = "none", status = "unchanged" }
rationale = "Focused source apply stays within the documented in-process and HTTP limits and oversize content rejects before writing."

[[behavior]]
partition = { equals = "REFERENCE_ANALYSIS_PERFORMANCE_BOUNDS" }
case_family = "boundary_high"
oracle_ref = "SPEC_RUNTIME_ENGINE_001#6-8-1e-standalone-web-ide-contract"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "unchanged", process_image = "unchanged", diagnostics = "none", status = "unchanged" }
