no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "unchanged", process_image = "unchanged", diagnostics = "none", status = "unchanged" }
rationale = "The standalone export contains its entrypoint, routes, complete modules, assets, schema, and resolved descriptor and can bootstrap offline."

[[behavior]]
partition = { equals = "WEBSOCKET_PUSH_FALLBACK_RECONNECT_AND_ISOLATION" }
case_family = "concurrency_or_cancellation"
oracle_ref = "SPEC_HMI_OPERATOR_FIRST_001#transport-and-live-data-contract"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "unchanged", process_image = "unchanged", diagnostics = "none", status = "unchanged" }
rationale = "Value, revision, and alarm push remain available across reconnect churn; forced failure falls back within one interval and a slow consumer cannot block control or another client."

[[behavior]]
partition = { equals = "LOCAL_TRANSPORT_AND_POLLING_BUDGET" }
case_family = "boundary_high"
oracle_ref = "SPEC_HMI_OPERATOR_FIRST_001#transport-and-live-data-contract"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "unchanged", process_image = "unchanged", diagnostics = "none", status = "unchanged" }
rationale = "Focused local WebSocket percentiles and HMI polling maximum and average stay within the normative reference-fixture budgets."

[[behavior]]
