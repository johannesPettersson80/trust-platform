no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "unchanged", process_image = "unchanged", diagnostics = "none", status = "unchanged" }
rationale = "Browser routes, complete source and embedded modules, section spans, widget spans, and the descriptor-owned dashboard hierarchy remain aligned."

[[behavior]]
partition = { equals = "STANDALONE_EXPORT_AND_OFFLINE_BOOTSTRAP" }
case_family = "persistence_or_recovery"
