case_family = "platform_or_filesystem_variation"
oracle_ref = "SPEC_RUNTIME_ENGINE_001#6-8-1e-standalone-web-ide-contract"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "stable_error", status = "unchanged" }
rationale = "Project roots resolve explicitly while workspace paths trim and normalize current-directory components, use forward slashes, and reject empty non-root, absolute, parent, and hidden components."

