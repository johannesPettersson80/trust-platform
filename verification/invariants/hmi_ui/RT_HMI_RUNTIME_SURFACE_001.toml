schema_version = 1
id = "RT_HMI_RUNTIME_SURFACE_001"
title = "Runtime HMI schema, live state, and writes preserve one typed authority"
area = "hmi_ui"
risk = "safety_critical"
status = "planned"
owner = "trust-runtime"
last_reviewed = "2026-07-26"
claim = "HMI schema, value snapshots, writes, descriptor reload, events, trends, alarms, and control errors preserve stable binding identity, declared types, quality, revision, allowlist, read-only, and lifecycle authority."
proof_level = "S0"
contract_kind = "state_machine"
source_refs = ["crates/trust-runtime/src/hmi", "crates/trust-runtime/src/control", "crates/trust-runtime/src/web/hmi_ws.rs"]
tests = []
gates = ["pr"]
evidence_refs = []
spec_gap_refs = []
missing = ["catalog_mapping", "assertion_reachability", "mutation_sensitivity", "broad_remote_gate", "rendered_browser_hmi"]

[spec]
status = "specified"
source_refs = ["SPEC_RUNTIME_ENGINE_001", "SPEC_RUNTIME_SEMANTICS_001"]

[oracle]
kind = "trust_contract"
ref = "SPEC_RUNTIME_ENGINE_001#runtime-hmi-descriptor-live-state-and-control-contract"

[[behavior]]
partition = { equals = "SCHEMA_STABLE_BINDING_AND_WRITABILITY" }
case_family = "happy_path"
oracle_ref = "SPEC_RUNTIME_ENGINE_001#runtime-hmi-descriptor-live-state-and-control-contract"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "unchanged", process_image = "unchanged", diagnostics = "none", status = "unchanged" }
rationale = "Stable widget IDs and paths preserve declared type, quality, writability, limits, annotations, and layout while invalid bindings remain visible."

[[behavior]]
partition = { equals = "TYPED_VALUE_SNAPSHOT" }
case_family = "happy_path"
oracle_ref = "SPEC_RUNTIME_ENGINE_001#runtime-hmi-descriptor-live-state-and-control-contract"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "unchanged", process_image = "unchanged", diagnostics = "none", status = "unchanged" }
rationale = "HMI reads expose typed runtime values with timestamp and quality through the direct and JSON projections."

[[behavior]]
partition = { equals = "ALLOWLISTED_WRITE_OR_READ_ONLY_DENIAL" }
case_family = "auth_or_permission"
oracle_ref = "SPEC_RUNTIME_ENGINE_001#runtime-hmi-descriptor-live-state-and-control-contract"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "unchanged", process_image = "expected_delta", diagnostics = "not_applicable", status = "unchanged" }
rationale = "Only writable allowlisted IDs, paths, or aliases queue a typed cycle-boundary write; read-only and nonallowlisted requests leave storage unchanged."

[[behavior]]
partition = { equals = "DESCRIPTOR_ATOMIC_RELOAD" }
case_family = "ordering_or_lifecycle"
oracle_ref = "SPEC_RUNTIME_ENGINE_001#runtime-hmi-descriptor-live-state-and-control-contract"
outcome = "not_safe_reported"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "unchanged", process_image = "unchanged", diagnostics = "not_applicable", status = "unchanged" }
rationale = "Valid descriptor changes increment revision without restart; invalid input retains the last good schema and rapid changes cannot deadlock."

[[behavior]]
partition = { equals = "LIVE_EVENT_REVISION_AND_DEDUPLICATION" }
case_family = "ordering_or_lifecycle"
oracle_ref = "SPEC_RUNTIME_ENGINE_001#runtime-hmi-descriptor-live-state-and-control-contract"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "unchanged", process_image = "unchanged", diagnostics = "none", status = "unchanged" }
rationale = "The event stream carries stable IDs and schema revision, emits changed values only, and suppresses duplicate alarm payloads."

[[behavior]]
partition = { equals = "TREND_BOUNDS_AND_WINDOW" }
case_family = "boundary_high"
oracle_ref = "SPEC_RUNTIME_ENGINE_001#runtime-hmi-descriptor-live-state-and-control-contract"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "unchanged", process_image = "unchanged", diagnostics = "none", status = "unchanged" }
rationale = "Downsampling preserves the requested time window and first, last, minimum, and maximum values."

[[behavior]]
partition = { equals = "ALARM_RAISE_ACK_CLEAR_DEADBAND" }
case_family = "ordering_or_lifecycle"
oracle_ref = "SPEC_RUNTIME_ENGINE_001#runtime-hmi-descriptor-live-state-and-control-contract"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "expected_delta", process_image = "unchanged", diagnostics = "none", status = "unchanged" }
rationale = "Alarm labels, history, acknowledgement, clear ordering, and the configured deadband reentry rule remain stable."

[[behavior]]
partition = { equals = "STRUCTURED_HMI_CONTROL_ERROR" }
case_family = "wrong_type_or_shape"
oracle_ref = "SPEC_RUNTIME_ENGINE_001#runtime-hmi-descriptor-live-state-and-control-contract"
outcome = "reject"
no_partial_apply = true
delta = { target = "unchanged", siblings = "unchanged", retain = "unchanged", process_image = "unchanged", diagnostics = "stable_error", status = "unchanged" }
rationale = "HMI control failures return a structured stable code without requiring diagnostic-prose parsing."

[[coverage.cells]]
dimension = "happy_path"
state = "gap_open"
rationale = "Reviewed HMI schema and value assertions await generated catalog mapping."

[[coverage.cells]]
dimension = "permission_or_policy"
state = "gap_open"
rationale = "Reviewed HMI write and read-only assertions await generated catalog mapping."

[[coverage.cells]]
dimension = "ordering_or_lifecycle"
state = "gap_open"
rationale = "Reviewed descriptor, event, and alarm assertions await generated catalog mapping."

[[coverage.cells]]
dimension = "boundary_high"
state = "gap_open"
rationale = "Reviewed trend-window assertions await generated catalog mapping."

[[coverage.cells]]
dimension = "wrong_type_or_shape"
state = "gap_open"
rationale = "Reviewed structured-error assertions await generated catalog mapping."
