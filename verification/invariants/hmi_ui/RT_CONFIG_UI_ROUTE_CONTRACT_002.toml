schema_version = 1
id = "RT_CONFIG_UI_ROUTE_CONTRACT_002"
title = "Configuration UI route helpers preserve workspace and live-target authority"
area = "hmi_ui"
risk = "data_loss"
status = "mapped"
owner = "trust-runtime"
last_reviewed = "2026-08-01"
claim = "Configuration UI route helpers normalize exact runtime and live-target identities, discover and mutate only one selected workspace, enforce revision and source-path preconditions, project endpoint health honestly, and return stable JSON errors."
proof_level = "S0"
contract_kind = "state_machine"
source_refs = ["docs/specs/11-runtime-engine.md", "crates/trust-runtime/src/web/config_ui_routes"]
tests = ["TEST_AUTO_A012BE9C7A90E2D0016E"]
gates = ["veryquick", "pr"]
evidence_refs = []
spec_gap_refs = []
missing = ["focused_execution_evidence", "assertion_reachability", "mutation_sensitivity", "rendered_configuration_ui_smoke", "broad_remote_gate"]

[spec]
status = "specified"
source_refs = ["SPEC_RUNTIME_ENGINE_001"]

[oracle]
kind = "trust_contract"
ref = "SPEC_RUNTIME_ENGINE_001#standalone-configuration-ui-workspace-contract"

[[behavior]]
partition = { equals = "NORMALIZED_EXACT_RUNTIME_ID" }
case_family = "encoding_or_unicode"
oracle_ref = "SPEC_RUNTIME_ENGINE_001#standalone-configuration-ui-workspace-contract"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "stable_error", status = "unchanged" }
rationale = "Runtime IDs trim, lowercase, accept only documented ASCII letters, digits, dash, and underscore, and resolve exactly after rejecting empty, punctuation, Unicode, or embedded whitespace."

[[behavior]]
partition = { equals = "BOUNDED_SORTED_WORKSPACE_DISCOVERY" }
case_family = "platform_or_filesystem_variation"
oracle_ref = "SPEC_RUNTIME_ENGINE_001#standalone-configuration-ui-workspace-contract"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "stable_error", status = "status_degraded" }
rationale = "Discovery admits the selected root and direct children only, sorts by normalized ID, rejects empty workspaces and duplicate resource names, and projects the documented safe loopback I/O default when project I/O is absent."

[[behavior]]
partition = { equals = "COMPLETE_RUNTIME_CREATION_AND_EXACT_DELETION" }
case_family = "ordering_or_lifecycle"
oracle_ref = "SPEC_RUNTIME_ENGINE_001#standalone-configuration-ui-workspace-contract"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "stable_error", status = "unchanged" }
rationale = "Creation writes one complete validated minimal bundle at a new ID and path; deletion removes only one child runtime and cannot remove the last runtime."

[[behavior]]
partition = { equals = "NORMALIZED_HOST_GROUP_TEMPLATE_BINDING" }
case_family = "encoding_or_unicode"
oracle_ref = "SPEC_RUNTIME_ENGINE_001#standalone-configuration-ui-workspace-contract"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "none", status = "unchanged" }
rationale = "Host groups trim and lowercase, preserve documented ASCII characters, replace every other character with dash, omit an empty result, and bind generated identity and local-safe defaults."

[[behavior]]
partition = { equals = "EXACT_REVISION_ATOMIC_VALIDATED_REPLACEMENT" }
case_family = "ordering_or_lifecycle"
oracle_ref = "SPEC_RUNTIME_ENGINE_001#standalone-configuration-ui-workspace-contract"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "stable_error", status = "unchanged" }
rationale = "Lowercase SHA-256 binds exact UTF-8 text, blank expected revision means no precondition, stale or invalid candidates leave the file unchanged, and accepted content replaces atomically with exact text."

[[behavior]]
partition = { equals = "CONFINED_STRUCTURED_TEXT_PATH" }
case_family = "platform_or_filesystem_variation"
oracle_ref = "SPEC_RUNTIME_ENGINE_001#standalone-configuration-ui-workspace-contract"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "stable_error", status = "unchanged" }
rationale = "Structured Text paths trim, remain relative below src, accept case-insensitive .st, and reject empty, absolute, parent, or other-extension inputs."

[[behavior]]
partition = { equals = "CONTROL_ENDPOINT_HEALTH_PROJECTION" }
case_family = "hardware_or_network_fault"
oracle_ref = "SPEC_RUNTIME_ENGINE_001#standalone-configuration-ui-workspace-contract"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "none", status = "status_degraded" }
rationale = "Trimmed listening TCP and Unix endpoints project online, while absent, empty, malformed, unsupported, or unavailable endpoints project offline without inventing health."

[[behavior]]
partition = { equals = "NORMALIZED_LIVE_TARGET_AND_REDACTED_SNAPSHOT" }
case_family = "hardware_or_network_fault"
oracle_ref = "SPEC_RUNTIME_ENGINE_001#standalone-configuration-ui-workspace-contract"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "stable_error", status = "status_degraded" }
rationale = "Live targets normalize one HTTP(S) origin and optional slash, reject unsupported schemes and extra URL components, sort profiles, preserve connection projection, and never serialize credentials or cached state."

[[behavior]]
partition = { equals = "STABLE_JSON_RESPONSE_CONTRACT" }
case_family = "wrong_type_or_shape"
oracle_ref = "SPEC_RUNTIME_ENGINE_001#standalone-configuration-ui-workspace-contract"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "stable_error", status = "unchanged" }
rationale = "All route responses declare JSON, preserve requested status and exact body, represent conflicts with the current version, and keep ordered structured error fields with ok=false."

