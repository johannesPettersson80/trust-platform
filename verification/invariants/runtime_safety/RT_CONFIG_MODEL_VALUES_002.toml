kind = "trust_contract"
ref = "SPEC_RUNTIME_ENGINE_001#runtime-configuration-loading-and-validation-contract"

[[behavior]]
partition = { equals = "DEEP_CLONE_OWNS_NESTED_CONFIGURATION" }
case_family = "persistence_or_recovery"
oracle_ref = "SPEC_RUNTIME_ENGINE_001#runtime-configuration-loading-and-validation-contract"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "none", status = "unchanged" }
rationale = "Discovery, mesh, OpenOT, task-override, and TLS clones own their nested strings, paths, lists, and maps."
[[behavior]]
partition = { equals = "IO_DRIVER_VALUE_EQUALITY" }
case_family = "happy_path"
oracle_ref = "SPEC_RUNTIME_ENGINE_001#runtime-configuration-loading-and-validation-contract"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "none", status = "unchanged" }
rationale = "Driver configuration equality includes canonical name, complete parameters, and enabled state."
[[behavior]]
partition = { equals = "EXACT_LINK_AND_WAN_RULE_VALUES" }
case_family = "encoding_or_unicode"
oracle_ref = "SPEC_RUNTIME_ENGINE_001#runtime-configuration-loading-and-validation-contract"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "none", status = "unchanged" }
rationale = "Link preferences retain exact endpoints and transport, while WAN allow rules retain exact action and target."
[[behavior]]
partition = { equals = "INERT_CONNECTOR_DEFAULTS" }
case_family = "happy_path"
oracle_ref = "SPEC_RUNTIME_ENGINE_001#runtime-configuration-loading-and-validation-contract"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "none", status = "unchanged" }
rationale = "ADS and OPC UA client defaults are disabled with exact sidecar and interval, and OpenOT defaults to disabled inert fenced heartbeat state."
[[behavior]]
partition = { equals = "CLOSED_TRIMMED_CASE_INSENSITIVE_ENUMS" }
case_family = "encoding_or_unicode"
oracle_ref = "SPEC_RUNTIME_ENGINE_001#runtime-configuration-loading-and-validation-contract"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "stable_error", status = "unchanged" }
rationale = "Web auth, TLS mode, mesh role, Runtime Cloud profile and transport, OpenOT fence mode, and OpenOT source accept the complete documented vocabulary case-insensitively after trimming and reject every near match with its owning key."
[[behavior]]
