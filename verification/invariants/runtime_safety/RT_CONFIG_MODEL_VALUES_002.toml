delta = { target = "set_to_expected", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "none", status = "unchanged" }
rationale = "Only non-disabled TLS modes are enabled and self-managed accepts its documented compatibility spelling without admitting other near matches."
[[behavior]]
