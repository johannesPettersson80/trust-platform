schema_version = 1
id = "RT_CONFIG_MODEL_VALUES_002"
title = "Runtime configuration value models preserve closed vocabularies and owned state"
area = "runtime_safety"
risk = "security"
status = "specified"
owner = "trust-runtime"
last_reviewed = "2026-08-01"
claim = "Runtime configuration model defaults, clones, equality, endpoint rules, enum vocabularies, TLS enablement, and secure Runtime Cloud requirements preserve exact owned values and fail closed on near matches."
