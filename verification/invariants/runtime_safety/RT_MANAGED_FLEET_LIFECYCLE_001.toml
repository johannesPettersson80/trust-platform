[spec]
status = "specified"
source_refs = ["SPEC_RUNTIME_ENGINE_001"]

[oracle]
kind = "trust_contract"
ref = "SPEC_RUNTIME_ENGINE_001#6-8-3-managed-local-fleet-scaffolding"

[[behavior]]
partition = { equals = "VALID_MANAGED_RUNTIME" }
case_family = "happy_path"
oracle_ref = "SPEC_RUNTIME_ENGINE_001#6-8-3-managed-local-fleet-scaffolding"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "expected_delta", retain = "unchanged", process_image = "unchanged", diagnostics = "none", status = "unchanged" }
rationale = "A portable runtime name produces deterministic valid sources and resource naming, unique available loopback listeners, a strong random credential, and a sorted manifest."

[[behavior]]
partition = { equals = "INVALID_NAME_MANIFEST_PORT_OR_AUTH" }
case_family = "wrong_type_or_shape"
oracle_ref = "SPEC_RUNTIME_ENGINE_001#6-8-3-managed-local-fleet-scaffolding"
outcome = "reject"
no_partial_apply = true
delta = { target = "unchanged", siblings = "unchanged", retain = "unchanged", process_image = "unchanged", diagnostics = "stable_error", status = "status_degraded" }
rationale = "Whitespace and unsafe names, duplicate entries, malformed endpoints or auth, zero ports, and cross-role collisions fail closed."

[[behavior]]
partition = { equals = "CONNECTED_INVALID_CONTROL_RESPONSE" }
case_family = "extra_or_unknown"
oracle_ref = "SPEC_RUNTIME_ENGINE_001#6-8-3-managed-local-fleet-scaffolding"
outcome = "reject"
no_partial_apply = true
delta = { target = "unchanged", siblings = "unchanged", retain = "unchanged", process_image = "unchanged", diagnostics = "stable_error", status = "status_degraded" }
rationale = "Malformed, oversized, rejected, ambiguous, and mismatched-ID control responses remain errors rather than false stopped status."

[[behavior]]
partition = { equals = "START_STOP_STATUS_AND_LOG_LIFECYCLE" }
case_family = "ordering_or_lifecycle"
oracle_ref = "SPEC_RUNTIME_ENGINE_001#6-8-3-managed-local-fleet-scaffolding"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "expected_delta", retain = "unchanged", process_image = "unchanged", diagnostics = "none", status = "status_degraded" }
rationale = "Endpoint status overrides stale PID metadata, read-only calls do not create state, failed starts are reaped, and confirmed stop removes advisory PID state."

[[coverage.cells]]
dimension = "happy_path"
state = "covered"
rationale = "Focused project and shipped-CLI tests cover add, list, start, status, logs, stop, generated configuration, credentials, and ports."

[[coverage.cells]]
dimension = "wrong_type_or_shape"
state = "covered"
rationale = "Focused tests reject invalid and whitespace-padded names, malformed manifests and auth, zero ports, and port collisions."

[[coverage.cells]]
dimension = "extra_or_unknown"
state = "covered"
rationale = "Control tests reject invalid JSON, missing or non-Boolean ok, auth rejection, mismatched IDs, and oversized responses."

[[coverage.cells]]
dimension = "ordering_or_lifecycle"
state = "covered"
rationale = "Focused tests cover stale PID truth, read-only state, early child exit, PID-write failure cleanup, and the shipped lifecycle."

[[coverage.cells]]
dimension = "platform_or_filesystem_variation"
state = "gap_open"
rationale = "Linux process and filesystem behavior is focused-proof complete; Windows process variation remains for final platform gates."
