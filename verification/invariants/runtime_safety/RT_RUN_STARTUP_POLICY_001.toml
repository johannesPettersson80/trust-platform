[spec]
status = "specified"
source_refs = ["SPEC_RUNTIME_ENGINE_001"]

[oracle]
kind = "trust_contract"
ref = "SPEC_RUNTIME_ENGINE_001#runtime-launcher-input-validation-and-startup-contract"

[[behavior]]
partition = { equals = "SIMULATION_WARNING_VISIBILITY" }
case_family = "happy_path"
oracle_ref = "SPEC_RUNTIME_ENGINE_001#runtime-launcher-input-validation-and-startup-contract"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "unchanged", process_image = "unchanged", diagnostics = "expected_diagnostic", status = "unchanged" }
rationale = "Simulation mode reports its effective scale and live-hardware warning, while production mode emits no simulation warning."

[[behavior]]
partition = { equals = "GRACEFUL_UNIX_SIGNAL_SET" }
case_family = "concurrency_or_cancellation"
oracle_ref = "SPEC_RUNTIME_ENGINE_001#runtime-launcher-input-validation-and-startup-contract"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "unchanged", process_image = "unchanged", diagnostics = "none", status = "status_degraded" }
rationale = "SIGINT and SIGTERM request the ordinary runtime shutdown target; unreviewed Unix signals do not manufacture a runtime stop request."

[[behavior]]
partition = { equals = "UNSUPPORTED_BUNDLE_VERSION_BEFORE_POLICY_MUTATION" }
case_family = "extra_or_unknown"
oracle_ref = "SPEC_RUNTIME_ENGINE_001#runtime-launcher-input-validation-and-startup-contract"
outcome = "reject"
no_partial_apply = true
delta = { target = "unchanged", siblings = "unchanged", retain = "unchanged", process_image = "unchanged", diagnostics = "stable_error", status = "unchanged" }
rationale = "An unsupported bundle version rejects before watchdog, fault, or other runtime policy is replaced."

[[behavior]]
partition = { equals = "EFFECTIVE_RUNTIME_SETTINGS" }
case_family = "happy_path"
oracle_ref = "SPEC_RUNTIME_ENGINE_001#runtime-launcher-input-validation-and-startup-contract"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "unchanged", process_image = "unchanged", diagnostics = "none", status = "unchanged" }
rationale = "Exposed settings preserve the effective bundle, simulation plan, execution backend, and backend-source selections used for startup."

[[behavior]]
partition = { equals = "STARTUP_SOURCE_MODE_COMPILATION" }
case_family = "happy_path"
oracle_ref = "SPEC_RUNTIME_ENGINE_001#runtime-launcher-input-validation-and-startup-contract"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "unchanged", process_image = "unchanged", diagnostics = "none", status = "unchanged" }
rationale = "Project mode compiles its resolved source closure, legacy mode compiles its literal source root, and IDE-shell mode compiles exactly one synthetic empty Main program without claiming a project bundle."

[[behavior]]
