no_partial_apply = true
delta = { target = "unchanged", siblings = "unchanged", retain = "unchanged", process_image = "unchanged", diagnostics = "stable_error", status = "unchanged" }
rationale = "Disabled ADS and OPC UA clients construct no transport; an enabled client without its loaded sidecar fails before factory invocation or connection-state mutation."

[[behavior]]
