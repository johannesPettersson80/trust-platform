schema_version = 1
id = "RT_RUN_STARTUP_POLICY_001"
title = "Runtime startup policy fails before mutation and exposes effective launch state"
area = "runtime_safety"
risk = "false_status"
status = "mapped"
owner = "trust-runtime"
last_reviewed = "2026-07-30"
claim = "Runtime startup compiles the selected project, legacy, or IDE-shell source mode; rejects unsupported or incomplete bundle and protocol configuration before unsafe activation; exposes simulation, backend, settings, and structured-log state truthfully; and maps only the reviewed graceful Unix signals into the ordinary bounded shutdown path."
proof_level = "S0"
contract_kind = "protocol_trace"
source_refs = [
  "crates/trust-runtime/src/bin/trust-runtime/run/logging.rs",
  "crates/trust-runtime/src/bin/trust-runtime/run/runtime/bundle_apply.rs",
  "crates/trust-runtime/src/bin/trust-runtime/run/runtime/entry.rs",
