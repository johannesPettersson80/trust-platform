no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "unchanged", process_image = "unchanged", diagnostics = "none", status = "unchanged" }
rationale = "Severity filtering follows the canonical error-through-trace order and each emitted lifecycle event carries timestamp, canonical level, event name, and data in one JSON object."

[[behavior]]
