  "crates/trust-runtime/src/bin/trust-runtime/run/runtime/settings.rs",
  "crates/trust-runtime/src/bin/trust-runtime/run/runtime/signals.rs",
  "crates/trust-runtime/src/bin/trust-runtime/run/runtime/simulation.rs",
  "crates/trust-runtime/src/bin/trust-runtime/run/types.rs",
  "crates/trust-runtime/src/bin/trust-runtime/run/ui_helpers.rs",
]
tests = ["TEST_AUTO_05F976172E8A5BB0566B", "TEST_AUTO_0DDFCA476A330F0BE047", "TEST_AUTO_22897986F57293559DFC", "TEST_AUTO_2A95A1E7A1B8C6F5AC14", "TEST_AUTO_3C5AC4C3361E223612AF", "TEST_AUTO_52713E8ACD6ECDB5BF78", "TEST_AUTO_57D298DD438F5E6F5975", "TEST_AUTO_598D28DD4E4B50652577", "TEST_AUTO_63C4C5C26503EF8BCCB4", "TEST_AUTO_882AC2B18B63A61E7771", "TEST_AUTO_A786BA87F3027726DC24", "TEST_AUTO_AFCC00BEFCCFE4F149A0"]
