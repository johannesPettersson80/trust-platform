schema_version = 1
id = "RT_RUNTIME_CLOUD_STATE_PROJECTION_001"
title = "Runtime Cloud state preserves topology, freshness, secure transport, route, and persistence truth"
area = "runtime_safety"
risk = "false_status"
status = "mapped"
owner = "trust-runtime"
last_reviewed = "2026-07-29"
claim = "Runtime Cloud state retains context, secure discovery metadata, topology and freshness, fails closed when its profile transport is unavailable, keeps removed device routes unavailable, and surfaces corrupt persisted configuration instead of a healthy default."
proof_level = "S0"
contract_kind = "state_machine"
source_refs = [
  "crates/trust-runtime/src/web/runtime_cloud_state",
  "crates/trust-runtime/src/web/runtime_cloud_routes",
  "crates/trust-runtime/tests/web_io_config_integration",
]
tests = ["TEST_AUTO_0BE4515DD096557819FD", "TEST_AUTO_72E65032998D488D9425", "TEST_AUTO_E7A707C5FC176B559C9B", "TEST_AUTO_E93FABAF7C59E8624A8B", "TEST_AUTO_F40798D55C3053BE0BBB", "TEST_AUTO_FE959E7B21A272DDC249", "TEST_AUTO_FF389AFB0C0F656C2142"]
gates = ["pr"]
evidence_refs = []
spec_gap_refs = []
missing = ["assertion_reachability", "mutation_sensitivity", "broad_remote_gate"]

[spec]
status = "specified"
source_refs = ["SPEC_RUNTIME_ENGINE_001"]

[oracle]
kind = "trust_contract"
ref = "SPEC_RUNTIME_ENGINE_001#runtime-cloud-state-dispatch-and-rollout-contract"

[[behavior]]
partition = { equals = "CONTEXT_TOPOLOGY_AND_SECURE_DISCOVERY_PROJECTION" }
case_family = "happy_path"
oracle_ref = "SPEC_RUNTIME_ENGINE_001#runtime-cloud-state-dispatch-and-rollout-contract"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "unchanged", process_image = "unchanged", diagnostics = "none", status = "unchanged" }
rationale = "State preserves runtime context, topology nodes and links, and reviewed secure discovery transport metadata without inventing measurements."

[[behavior]]
partition = { equals = "FRESH_DISCONNECT_STALE_BEFORE_PARTITIONED" }
case_family = "ordering_or_lifecycle"
oracle_ref = "SPEC_RUNTIME_ENGINE_001#runtime-cloud-state-dispatch-and-rollout-contract"
outcome = "not_safe_reported"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "unchanged", process_image = "unchanged", diagnostics = "none", status = "status_degraded" }
rationale = "A fresh disconnect transitions through stale before partitioned and its topology edge retains that visible state."

[[behavior]]
partition = { equals = "PLANT_OR_WAN_WITHOUT_SECURE_PROFILE_TRANSPORT" }
case_family = "auth_or_permission"
oracle_ref = "SPEC_RUNTIME_ENGINE_001#runtime-cloud-state-dispatch-and-rollout-contract"
outcome = "reject"
no_partial_apply = true
delta = { target = "unchanged", siblings = "unchanged", retain = "unchanged", process_image = "unchanged", diagnostics = "stable_error", status = "not_safe_reported" }
rationale = "A secure profile without token-authenticated TLS and its required transport authority denies state access."

[[behavior]]
partition = { equals = "REMOVED_DEVICE_MUTATION_ROUTES" }
case_family = "extra_or_unknown"
oracle_ref = "SPEC_RUNTIME_ENGINE_001#runtime-cloud-state-dispatch-and-rollout-contract"
outcome = "reject"
no_partial_apply = true
delta = { target = "unchanged", siblings = "unchanged", retain = "unchanged", process_image = "unchanged", diagnostics = "stable_error", status = "unchanged" }
rationale = "Removed device-list GET and POST routes remain not found and cannot mutate current topology."

[[behavior]]
partition = { equals = "CORRUPT_PERSISTED_CONFIGURATION_STATE" }
case_family = "persistence_or_recovery"
oracle_ref = "SPEC_RUNTIME_ENGINE_001#runtime-cloud-state-dispatch-and-rollout-contract"
outcome = "not_safe_reported"
no_partial_apply = true
delta = { target = "unchanged", siblings = "unchanged", retain = "unchanged", process_image = "unchanged", diagnostics = "stable_error", status = "status_degraded" }
rationale = "Corrupt persisted configuration produces explicit error state with parse evidence rather than an in-sync default."

