[[behavior]]
partition = { equals = "CACHE_RECOVERY_AND_INVALIDATION" }
case_family = "persistence_or_recovery"
oracle_ref = "SPEC_RUNTIME_SEMANTICS_001#321-variable-storage-reference-and-layout-contract"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "unchanged", process_image = "unchanged", diagnostics = "none", status = "unchanged" }
rationale = "A poisoned cache lock does not prevent logical storage cloning; direct misses and inherited hits invalidate after relevant insertion, while recursive parent-chain misses remain uncached."

[[behavior]]
partition = { equals = "INSTANCE_FIELD_PRECEDENCE_AND_DECLARED_LAYOUT" }
case_family = "ordering_or_lifecycle"
oracle_ref = "SPEC_RUNTIME_SEMANTICS_001#321-variable-storage-reference-and-layout-contract"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "unchanged", process_image = "unchanged", diagnostics = "none", status = "unchanged" }
rationale = "Direct fields precede parent fallback, same-type instances reuse declared offsets, inherited fields remain owned by the parent layout, and offset access reaches the exact resolved field."

[[behavior]]
partition = { equals = "DIRECT_AND_REFERENCE_HELPER_EQUIVALENCE" }
case_family = "happy_path"
oracle_ref = "SPEC_RUNTIME_SEMANTICS_001#321-variable-storage-reference-and-layout-contract"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "unchanged", process_image = "unchanged", diagnostics = "none", status = "unchanged" }
rationale = "Global, current-local-frame, and instance direct slots equal empty-path references, and borrowed and owned reference helpers observe and update the same value."

[[behavior]]
partition = { equals = "NESTED_COPY_ON_WRITE_ISOLATION" }
case_family = "happy_path"
oracle_ref = "SPEC_RUNTIME_SEMANTICS_001#321-variable-storage-reference-and-layout-contract"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "unchanged", process_image = "unchanged", diagnostics = "none", status = "unchanged" }
rationale = "A nested aggregate reference write changes only its selected storage slot and path even when another slot shared the original structure value."

[[behavior]]
partition = { equals = "CHECKED_EXTREME_ARRAY_REFERENCE" }
case_family = "boundary_low"
oracle_ref = "SPEC_RUNTIME_SEMANTICS_001#321-variable-storage-reference-and-layout-contract"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "unchanged", process_image = "unchanged", diagnostics = "none", status = "unchanged" }
rationale = "Checked array-offset arithmetic handles a valid element at an extreme signed lower bound without wrapping and reads and writes that selected element exactly."

[[behavior]]
