schema_version = 1
id = "RT_ADS_CLI_AUTHORING_001"
title = "ADS CLI authoring and validation preserve deterministic reviewed artifacts"
area = "runtime_safety"
risk = "data_loss"
status = "mapped"
owner = "trust-runtime"
last_reviewed = "2026-07-29"
claim = "ADS CLI argument binding preserves the selected authoring action and options; offline ADS import and validation canonicalize snapshots, generate deterministic ST, avoid unnecessary rewrites, protect changed output, and fail visibly on incompatible or drifting inputs."
proof_level = "T1"
contract_kind = "state_machine"
source_refs = [
  "crates/trust-runtime/src/bin/trust-runtime/ads.rs",
  "crates/trust-runtime/src/bin/trust-runtime/cli/ads.rs",
]
tests = ["TEST_AUTO_1A1F998AA3DD2B019B46", "TEST_AUTO_1AEAA1027B1757F68626", "TEST_AUTO_28C45C94601F0C40AE4D", "TEST_AUTO_4FE6FED1EBCF1EE95C22", "TEST_AUTO_599A651C94F4B8F1A6F9", "TEST_AUTO_61C813EDB460F6E9100B", "TEST_AUTO_69AD36A7A2A98E2859DE", "TEST_AUTO_843D6E3A504812FC041C", "TEST_AUTO_85C67E74CD7EE13584EC", "TEST_AUTO_D2271C8F01D4CF4DF239", "TEST_AUTO_D96D92F4C86DFE0FCD13", "TEST_AUTO_E25566DAD91C9F28AE8F", "TEST_RUNTIME_ADS_IMPORT_OUTPUT_POLICY_001", "TEST_RUNTIME_ADS_IMPORT_SYMBOLS_NO_WIRE_001", "TEST_RUNTIME_ADS_VALIDATE_LIVE_NO_WIRE_001", "TEST_RUNTIME_ADS_VALIDATE_MISSING_SYMBOL_001", "TEST_RUNTIME_ADS_VALIDATE_SOURCE_DRIFT_001", "TEST_RUNTIME_ADS_VALIDATE_TYPE_MISMATCH_001"]
gates = ["pr"]
evidence_refs = []
spec_gap_refs = []
missing = ["assertion_reachability", "live_target_validation", "mutation_sensitivity", "broad_remote_gate"]

[spec]
status = "specified"
source_refs = ["SPEC_RUNTIME_ENGINE_001"]

[oracle]
kind = "trust_contract"
ref = "SPEC_RUNTIME_ENGINE_001#6-8-1b-ads-cli-authoring-and-server-control-contract"

[[behavior]]
partition = { equals = "BYTE_IDENTICAL_OR_CHANGED_OUTPUT" }
case_family = "persistence_or_recovery"
oracle_ref = "SPEC_RUNTIME_ENGINE_001#6-8-1b-ads-cli-authoring-and-server-control-contract"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "unchanged", process_image = "unchanged", diagnostics = "none", status = "not_applicable" }
rationale = "Import creates missing parents, reports byte-identical output unchanged, and overwrites different generated content only with explicit force."

[[behavior]]
partition = { equals = "INCOMPATIBLE_SNAPSHOT_OR_GENERATED_SOURCE" }
case_family = "wrong_type_or_shape"
oracle_ref = "SPEC_RUNTIME_ENGINE_001#6-8-1b-ads-cli-authoring-and-server-control-contract"
outcome = "reject"
no_partial_apply = true
delta = { target = "unchanged", siblings = "unchanged", retain = "unchanged", process_image = "unchanged", diagnostics = "stable_error", status = "not_applicable" }
rationale = "Missing symbols, type mismatches, and generated-source drift fail before accepted artifact status is reported."

[[behavior]]
partition = { equals = "LIVE_AUTHORING_WITHOUT_WIRE_FEATURE" }
case_family = "platform_or_filesystem_variation"
oracle_ref = "SPEC_RUNTIME_ENGINE_001#6-8-1b-ads-cli-authoring-and-server-control-contract"
outcome = "reject"
no_partial_apply = true
delta = { target = "unchanged", siblings = "unchanged", retain = "unchanged", process_image = "unchanged", diagnostics = "stable_error", status = "not_safe_reported" }
rationale = "Live validation and live symbol import fail before file reads or generated-file writes when ads-wire is unavailable."

[[behavior]]
partition = { equals = "OFFLINE_IMPORT_CLI_ARGUMENTS" }
case_family = "happy_path"
oracle_ref = "SPEC_RUNTIME_ENGINE_001#6-8-1b-ads-cli-authoring-and-server-control-contract"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "unchanged", process_image = "unchanged", diagnostics = "none", status = "not_applicable" }
rationale = "Offline import preserves the selected configuration, ordered snapshot paths, generated output path, force choice, and JSON-output choice without entering another ADS action."

[[behavior]]
partition = { equals = "OFFLINE_OR_LIVE_VALIDATION_CLI_MODE" }
case_family = "happy_path"
oracle_ref = "SPEC_RUNTIME_ENGINE_001#6-8-1b-ads-cli-authoring-and-server-control-contract"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "unchanged", process_image = "unchanged", diagnostics = "none", status = "not_applicable" }
rationale = "Offline validation preserves its cached snapshots with live disabled, while live validation preserves an empty snapshot set with offline disabled; both retain the selected configuration, generated source, and JSON choice."

[[behavior]]
partition = { equals = "LIVE_SYMBOL_IMPORT_CLI_ARGUMENTS" }
case_family = "happy_path"
oracle_ref = "SPEC_RUNTIME_ENGINE_001#6-8-1b-ads-cli-authoring-and-server-control-contract"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "unchanged", process_image = "unchanged", diagnostics = "none", status = "not_applicable" }
rationale = "Live symbol import preserves the target identity, connection and naming choices, ordered selection and snapshot inputs, artifact destinations, force, dry-run, and JSON choices without substituting another action."

[[behavior]]
partition = { equals = "LIVE_CLIENT_CLI_ARGUMENTS_AND_DEFAULT_PORT" }
case_family = "happy_path"
oracle_ref = "SPEC_RUNTIME_ENGINE_001#6-8-1b-ads-cli-authoring-and-server-control-contract"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "unchanged", process_image = "unchanged", diagnostics = "none", status = "not_applicable" }
rationale = "Discovery, browse, and Doctor preserve their target, target Net ID, connection, configuration, guarded-write, and JSON choices; omitted discovery and Doctor AMS ports select 851."

[[coverage.cells]]
dimension = "persistence_or_recovery"
state = "covered"
rationale = "Focused integration tests cover first write, byte-identical rerun, changed-output rejection, and forced replacement."

[[coverage.cells]]
dimension = "wrong_type_or_shape"
state = "covered"
rationale = "Focused integration tests cover missing symbols, type mismatch, and first-difference source drift."

[[coverage.cells]]
dimension = "hardware_or_network_fault"
state = "gap_open"
rationale = "No live TwinCAT target is used in the focused batch; live target validation remains explicit missing proof."
