schema_version = 1
id = "RT_RETAIN_PERSISTENCE_CODEC_001"
title = "Retain persistence preserves snapshots and exposes filesystem boundaries"
area = "runtime_safety"
risk = "data_loss"
status = "mapped"
owner = "trust-runtime"
last_reviewed = "2026-07-27"
claim = "The file-backed retain store round-trips supported snapshots, reads supported legacy framing, distinguishes a missing file from real filesystem failure, publishes atomically, reports post-publish sync failure, and retains retry eligibility."
proof_level = "S0"
contract_kind = "decision_table"
source_refs = [
  "docs/specs/11-runtime-engine.md",
  "crates/trust-runtime/src/retain",
]
tests = []
gates = ["pr"]
evidence_refs = []
spec_gap_refs = []
missing = [
  "cataloged_tests",
  "focused_execution_evidence",
  "final_remote_gate",
]

[spec]
status = "specified"
source_refs = ["SPEC_RUNTIME_ENGINE_001"]

[oracle]
kind = "trust_contract"
ref = "SPEC_RUNTIME_ENGINE_001#retain-codec-compatibility-and-migration"

[[behavior]]
partition = { equals = "MISSING_FILE_IS_EMPTY_SNAPSHOT" }
case_family = "persistence_or_recovery"
oracle_ref = "SPEC_RUNTIME_ENGINE_001#retain-codec-compatibility-and-migration"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "unchanged", process_image = "unchanged", diagnostics = "none", status = "unchanged" }
rationale = "Only an absent retain file materializes as an empty snapshot."

[[behavior]]
partition = { equals = "FILESYSTEM_FAILURE_REMAINS_VISIBLE" }
case_family = "platform_or_filesystem_variation"
oracle_ref = "SPEC_RUNTIME_ENGINE_001#retain-codec-compatibility-and-migration"
outcome = "reject"
no_partial_apply = true
delta = { target = "unchanged", siblings = "unchanged", retain = "unchanged", process_image = "unchanged", diagnostics = "stable_error", status = "unchanged" }
rationale = "Existing unreadable paths, read failures, and invalid parent paths return an error rather than a default snapshot or false save success."

[[behavior]]
partition = { equals = "ATOMIC_REPLACEMENT_ROUNDTRIP" }
case_family = "happy_path"
oracle_ref = "SPEC_RUNTIME_ENGINE_001#retain-codec-compatibility-and-migration"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "expected_delta", process_image = "unchanged", diagnostics = "none", status = "unchanged" }
rationale = "Successful replacement makes exactly the new complete snapshot readable and leaves no retain temporary file."

[[behavior]]
partition = { equals = "PARENT_SYNC_FAILURE_AFTER_PUBLISH" }
case_family = "platform_or_filesystem_variation"
oracle_ref = "SPEC_RUNTIME_ENGINE_001#retain-codec-compatibility-and-migration"
outcome = "reject"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "expected_delta", process_image = "unchanged", diagnostics = "stable_error", status = "unchanged" }
rationale = "A parent-sync failure is reported after rename, so the same session may read the published snapshot without the runtime claiming durable success."

[[behavior]]
partition = { equals = "FAILED_SAVE_REMAINS_RETRYABLE" }
case_family = "persistence_or_recovery"
oracle_ref = "SPEC_RUNTIME_ENGINE_001#retain-codec-compatibility-and-migration"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "unchanged", process_image = "unchanged", diagnostics = "none", status = "unchanged" }
rationale = "A failed due save remains eligible and the next save may succeed without another dirty mark."

[[behavior]]
partition = { equals = "SUPPORTED_V2_VALUE_ROUNDTRIP" }
case_family = "happy_path"
oracle_ref = "SPEC_RUNTIME_ENGINE_001#retain-codec-compatibility-and-migration"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "expected_delta", process_image = "unchanged", diagnostics = "none", status = "unchanged" }
rationale = "The focused profile preserves Boolean and integer scalars, bounded arrays, structures, and enumerations exactly across store/load."

[[behavior]]
partition = { equals = "SUPPORTED_V1_READ_COMPATIBILITY" }
case_family = "persistence_or_recovery"
oracle_ref = "SPEC_RUNTIME_ENGINE_001#retain-codec-compatibility-and-migration"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "expected_delta", process_image = "unchanged", diagnostics = "none", status = "unchanged" }
rationale = "A supported version-1 STRN value decodes to the same logical name and runtime value."

[[coverage.cells]]
dimension = "happy_path"
state = "gap_open"
rationale = "Atomic replacement and supported value roundtrip await focused catalog proof."

[[coverage.cells]]
dimension = "persistence_or_recovery"
state = "gap_open"
rationale = "Missing-file, legacy-read, and retry behavior await focused catalog proof."

