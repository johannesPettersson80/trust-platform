no_partial_apply = true
delta = { target = "set_to_expected", siblings = "expected_delta", retain = "unchanged", process_image = "unchanged", diagnostics = "none", status = "unchanged" }
rationale = "Profiling begins enabled, retains two reviewed kind:name calls, reports MAIN once, and assigns it a positive average cycle contribution."

[[behavior]]
partition = { equals = "DISABLE_CLEAR_AND_REENABLE_COLLECTION" }
case_family = "ordering_or_lifecycle"
oracle_ref = "SPEC_RUNTIME_ENGINE_001#runtime-metrics-window-and-profiling-contract"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "expected_delta", retain = "unchanged", process_image = "unchanged", diagnostics = "none", status = "unchanged" }
rationale = "Disabling clears calls and contributors and ignores the reviewed call; re-enabling admits one new call into a clean collection."

[[behavior]]
partition = { equals = "TOP_CONTRIBUTOR_RANKING" }
case_family = "happy_path"
oracle_ref = "SPEC_RUNTIME_ENGINE_001#runtime-metrics-window-and-profiling-contract"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "expected_delta", retain = "unchanged", process_image = "unchanged", diagnostics = "none", status = "unchanged" }
rationale = "The reviewed program:MAIN call ranks first ahead of the smaller function-block contribution and has positive cycle percentage."

[[behavior]]
