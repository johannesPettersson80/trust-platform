case_family = "time_or_clock_fault"
oracle_ref = "SPEC_RUNTIME_ENGINE_001#runtime-metrics-window-and-profiling-contract"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "unchanged", process_image = "unchanged", diagnostics = "none", status = "unchanged" }
rationale = "The reviewed 5, 10, 15, 20, and 25 ms sequence reports five samples, a p50 of at least 10 ms, monotonic p95, and a 25 ms maximum."

[[behavior]]
partition = { equals = "CYCLE_STATISTICS_PERCENTILE_AND_512_SAMPLE_WINDOW" }
case_family = "time_or_clock_fault"
oracle_ref = "SPEC_RUNTIME_ENGINE_001#runtime-metrics-window-and-profiling-contract"
