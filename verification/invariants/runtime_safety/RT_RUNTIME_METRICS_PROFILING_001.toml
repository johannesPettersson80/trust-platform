rationale = "Empty, first, zero, and repeated cycle samples preserve finite min/max/mean/last values, documented rounded-index percentile selection with clamped quantiles, and exactly the newest 512 samples without snapshot-induced rollover changes."

[[behavior]]
partition = { equals = "TASK_DURATION_OVERRUN_ORDER_AND_IDENTITY" }
case_family = "ordering_or_lifecycle"
oracle_ref = "SPEC_RUNTIME_ENGINE_001#runtime-metrics-window-and-profiling-contract"
