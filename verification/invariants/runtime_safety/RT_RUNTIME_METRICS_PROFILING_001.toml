delta = { target = "set_to_expected", siblings = "unchanged", retain = "unchanged", process_image = "unchanged", diagnostics = "none", status = "unchanged" }
rationale = "Task rows are keyed and sorted by exact name; duration, positive overrun, and missed activation update only the selected task and retain independent accounting, while zero missed activations materialize nothing."

[[behavior]]
partition = { equals = "SATURATING_COUNTER_AND_OBSERVATIONAL_SNAPSHOT" }
case_family = "boundary_high"
oracle_ref = "SPEC_RUNTIME_ENGINE_001#runtime-metrics-window-and-profiling-contract"
