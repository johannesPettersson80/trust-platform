schema_version = 1
id = "RT_RETAIN_SNAPSHOT_INSERT_001"
title = "Retained snapshot insertion preserves deterministic identity, order, and value"
area = "runtime_safety"
risk = "safety_critical"
status = "implemented"
owner = "trust-runtime"
last_reviewed = "2026-07-22"
claim = "Inserting a new resolved retained name appends exactly one exact runtime value; reinserting the same name replaces that value at its original position without changing cardinality, sibling values, or sibling order. Insertion does not claim persistence or reload validity."
proof_level = "G1"
contract_kind = "decision_table"
source_refs = ["crates/trust-runtime-core/src/retain.rs"]
tests = ["TEST_RUNTIME_RETAIN_SNAPSHOT_INSERT_001", "TEST_RUNTIME_RETAIN_SNAPSHOT_INSERT_TRACE_001"]
gates = ["pr"]
evidence_refs = [
  "EVID_TEST_RUNTIME_RETAIN_SNAPSHOT_INSERT_TRACE_001_LOCK_BASELINE",
  "EVID_TEST_RUNTIME_RETAIN_SNAPSHOT_INSERT_TRACE_001_LOCK_COMPARE",
]
spec_gap_refs = []
missing = [
  "assertion_reachability",
  "mutation_sensitivity",
  "broad_remote_gate",
]

[spec]
status = "specified"
source_refs = ["SPEC_RUNTIME_ENGINE_001"]

[oracle]
kind = "trust_contract"
ref = "SPEC_RUNTIME_ENGINE_001#retain-snapshot-identity-and-order"

[[behavior]]
partition = { equals = "NEW_RESOLVED_RETAINED_NAME" }
case_family = "happy_path"
oracle_ref = "SPEC_RUNTIME_ENGINE_001#retain-snapshot-identity-and-order"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "expected_delta", process_image = "unchanged", diagnostics = "none", status = "unchanged" }
rationale = "The first insertion appends one entry after existing entries and preserves the supplied runtime value exactly."

[[behavior]]
partition = { equals = "EXISTING_RESOLVED_RETAINED_NAME" }
case_family = "ordering_or_lifecycle"
oracle_ref = "SPEC_RUNTIME_ENGINE_001#retain-snapshot-identity-and-order"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "expected_delta", process_image = "unchanged", diagnostics = "none", status = "unchanged" }
rationale = "Reinsertion replaces only the matching entry at its original position without changing cardinality or sibling order."

[[behavior]]
partition = { equals = "DISTINCT_RESOLVED_RETAINED_NAME" }
case_family = "ordering_or_lifecycle"
oracle_ref = "SPEC_RUNTIME_ENGINE_001#retain-snapshot-identity-and-order"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "expected_delta", process_image = "unchanged", diagnostics = "none", status = "unchanged" }
rationale = "A non-equal supplied key remains distinct and appends after all earlier entries; insertion performs no hidden name normalization."

[[coverage.cells]]
dimension = "happy_path"
state = "covered"
rationale = "The producer-authentic behavior-lock pair inserts a new resolved name and compares the exact key, concrete runtime value, cardinality, and position."

[[coverage.cells]]
dimension = "ordering_or_lifecycle"
state = "covered"
rationale = "The producer-authentic behavior-lock pair replaces an existing key without changing cardinality or sibling order and separately proves that a distinct supplied key appends in call order."
