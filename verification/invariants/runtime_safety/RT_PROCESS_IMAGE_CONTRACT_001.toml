schema_version = 1
id = "RT_PROCESS_IMAGE_CONTRACT_001"
title = "Process-image bounds and metadata application are deterministic and transactional"
area = "runtime_safety"
risk = "safety_critical"
status = "planned"
owner = "trust-runtime"
last_reviewed = "2026-07-26"
claim = "Process-image sizing, access, snapshots, and metadata application must preserve the documented bounds, representation, and no-partial-apply rules."
proof_level = "S0"
contract_kind = "decision_table"
source_refs = ["crates/trust-runtime/src/io/interface.rs", "crates/trust-runtime/src/runtime", "docs/specs/11-runtime-engine.md"]
tests = []
gates = ["veryquick", "pr"]
evidence_refs = []
spec_gap_refs = []
missing = ["cataloged_behavior_tests", "focused_remote_execution", "broad_remote_gate"]

[spec]
status = "specified"
source_refs = ["SPEC_RUNTIME_ENGINE_001"]

[oracle]
kind = "trust_contract"
ref = "SPEC_RUNTIME_ENGINE_001"

[[behavior]]
partition = { equals = "VALID_METADATA_AREA_SIZES" }
case_family = "happy_path"
oracle_ref = "SPEC_RUNTIME_ENGINE_001#process-image-bounds-reads-snapshots-and-metadata-application"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "unchanged", process_image = "expected_delta", diagnostics = "none", status = "unchanged" }
rationale = "Validated bytecode metadata sizes the selected input, output, and memory areas exactly."

[[behavior]]
partition = { equals = "AREA_OR_ADDRESS_ABOVE_16_MIB" }
case_family = "resource_limit"
oracle_ref = "SPEC_RUNTIME_ENGINE_001#process-image-bounds-reads-snapshots-and-metadata-application"
outcome = "reject"
no_partial_apply = true
delta = { target = "unchanged", siblings = "unchanged", retain = "unchanged", process_image = "unchanged", diagnostics = "expected_diagnostic", status = "unchanged" }
rationale = "Oversized metadata, source bindings, resizes, and writes fail before allocation or mutation."

[[behavior]]
partition = { equals = "UNALLOCATED_READ" }
case_family = "boundary_high"
oracle_ref = "SPEC_RUNTIME_ENGINE_001#process-image-bounds-reads-snapshots-and-metadata-application"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "unchanged", process_image = "unchanged", diagnostics = "none", status = "unchanged" }
rationale = "Unallocated scalar and string reads return zero or empty values without growing an area."

[[behavior]]
partition = { equals = "OVERSIZED_FIXED_STRING_WRITE" }
case_family = "above_max"
oracle_ref = "SPEC_RUNTIME_ENGINE_001#process-image-bounds-reads-snapshots-and-metadata-application"
outcome = "reject"
no_partial_apply = true
delta = { target = "unchanged", siblings = "unchanged", retain = "unchanged", process_image = "unchanged", diagnostics = "expected_diagnostic", status = "unchanged" }
rationale = "A string payload larger than its declared byte window fails without allocation or partial bytes."

[[behavior]]
partition = { equals = "INVALID_METADATA_PREPARATION" }
case_family = "wrong_type_or_shape"
oracle_ref = "SPEC_RUNTIME_ENGINE_001#6-7-1-online-change-transaction"
outcome = "reject"
no_partial_apply = true
delta = { target = "unchanged", siblings = "unchanged", retain = "unchanged", process_image = "unchanged", diagnostics = "expected_diagnostic", status = "unchanged" }
rationale = "Unknown tasks, programs, resources, or invalid sizes fail before the prior runtime and process image change."

[[behavior]]
partition = { equals = "EXACT_OR_SINGLE_LEGACY_RESOURCE" }
case_family = "happy_path"
oracle_ref = "SPEC_RUNTIME_ENGINE_001#6-7-1-online-change-transaction"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "unchanged", process_image = "expected_delta", diagnostics = "none", status = "unchanged" }
rationale = "A named resource resolves exactly, with only the documented one-resource RESOURCE placeholder compatibility path."

[[behavior]]
partition = { equals = "TYPED_SNAPSHOT_SHAPE" }
case_family = "ordering_or_lifecycle"
oracle_ref = "SPEC_RUNTIME_ENGINE_001#process-image-bounds-reads-snapshots-and-metadata-application"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "unchanged", process_image = "unchanged", diagnostics = "none", status = "unchanged" }
rationale = "A snapshot preserves typed values, addresses, names, and optional driver-source authority."

[[behavior]]
partition = { equals = "SNAPSHOT_AFTER_OUTPUT_COMMIT" }
case_family = "ordering_or_lifecycle"
oracle_ref = "SPEC_RUNTIME_ENGINE_001#process-image-bounds-reads-snapshots-and-metadata-application"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "unchanged", process_image = "unchanged", diagnostics = "none", status = "unchanged" }
rationale = "The cycle snapshot is emitted only after output commit, so it represents the committed boundary."

[[coverage.cells]]
dimension = "boundary_high"
state = "gap_open"
rationale = "The grouped bound and transactional cases are specified; catalog mapping and focused execution are pending."
