schema_version = 1
id = "RT_RELOAD_001"
title = "Runtime reload is transactionally consistent"
area = "runtime_safety"
risk = "silent_corruption"
status = "gap_open"
owner = "trust-runtime"
last_reviewed = "2026-10-20"
claim = "Online change and hot reload must not leave live runtime state partially applied or inconsistent with status."
proof_level = "S0"
contract_kind = "state_machine"
source_refs = ["crates/trust-runtime/src/runtime"]
tests = ["TEST_AUTO_4F2995A2CBD7C4CB4598", "TEST_AUTO_536B258421ADD8E350A4", "TEST_AUTO_6881AED77BE0CFD99ED5", "TEST_AUTO_A0DC7334328B65BCFDBA", "TEST_AUTO_E067B79A22B8500C7619", "TEST_AUTO_F48BA48F6FB8942539AE", "TEST_RUNTIME_RELOAD_TRANSACTION_001"]
gates = ["pr"]
evidence_refs = [
  "EVID_TEST_RUNTIME_RELOAD_TRANSACTION_001_RED",
  "EVID_TEST_RUNTIME_RELOAD_TRANSACTION_001_GREEN",
  "EVID_RUNTIME_RELOAD_TRANSACTION_GAP_CLOSEOUT_20260714",
  "EVID_BROAD_REMOTE_PR_20260714_1F7316C15C47",
]
spec_gap_refs = []
missing = ["bytecode_resource_commit_failure_cases"]

[spec]
status = "specified"
source_refs = ["SPEC_RUNTIME_ENGINE_001", "SPEC_DEBUG_ADAPTER_001"]

[oracle]
kind = "trust_contract"
ref = "SPEC_RUNTIME_ENGINE_001"

[[behavior]]
partition = { equals = "RETAIN_STORE_NOT_READ_BY_ONLINE_CHANGE" }
case_family = "persistence_or_recovery"
oracle_ref = "SPEC_RUNTIME_ENGINE_001#online-change-transaction"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "unchanged", siblings = "expected_delta", retain = "unchanged", process_image = "unchanged", diagnostics = "none", status = "unchanged" }
rationale = "An online change keeps the retained values the running program holds and reads no retain store (specification 34 section 11.3, decision OC-1), so a store whose load fails neither refuses the change nor changes the retained value; the committed change restarts the scan counter."

[[behavior]]
partition = { equals = "COMPLETED_SCAN_BOUNDARY_COMMIT" }
case_family = "ordering_or_lifecycle"
oracle_ref = "SPEC_RUNTIME_ENGINE_001#online-change-transaction"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "unchanged", process_image = "expected_delta", diagnostics = "none", status = "unchanged" }
rationale = "A reload waits for the blocked in-flight scan input phase and reports success only after the completed scan boundary becomes available for commit."

[[behavior]]
partition = { equals = "SUCCESSFUL_WARM_RELOAD_STORAGE_IMAGE" }
case_family = "persistence_or_recovery"
oracle_ref = "SPEC_RUNTIME_ENGINE_001#online-change-transaction"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "expected_delta", retain = "expected_delta", process_image = "unchanged", diagnostics = "none", status = "unchanged" }
rationale = "A successful online change keeps the reviewed retained and non-retained globals, program values and the function-block instance's member: every variable at the same place keeps its value (specification 34 section 11.3, decision OC-1)."

[[behavior]]
partition = { equals = "SUCCESSFUL_IO_REBIND" }
case_family = "ordering_or_lifecycle"
oracle_ref = "SPEC_RUNTIME_ENGINE_001#online-change-transaction"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "unchanged", process_image = "expected_delta", diagnostics = "none", status = "unchanged" }
rationale = "Successful warm reload rebinds the reviewed single BOOL output so the next cycle exposes the new program value through its runtime binding."

[[behavior]]
partition = { equals = "ENTRYPOINT_AND_SCAN_COUNTER_RESTART" }
case_family = "ordering_or_lifecycle"
oracle_ref = "SPEC_RUNTIME_ENGINE_001#online-change-transaction"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "unchanged", process_image = "unchanged", diagnostics = "none", status = "unchanged" }
rationale = "A successful reload keeps the reviewed non-retained value, restarts the scan counter at zero, and executes the changed body from its entry point on the following cycle."

[[behavior]]
partition = { equals = "RETAINED_VALUE_THAT_DOES_NOT_FIT_TAKES_ITS_INITIAL_VALUE" }
case_family = "persistence_or_recovery"
oracle_ref = "SPEC_RUNTIME_ENGINE_001#online-change-transaction"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "expected_delta", retain = "expected_delta", process_image = "unchanged", diagnostics = "none", status = "unchanged" }
rationale = "The reviewed retained INT 100, which the new declaration INT(0..10) does not hold, takes its initial value and is recorded as an online_change_value event; no value refuses the change, and the new body runs from the kept program value (owner, 20 October 2026, keep what fits)."

[[behavior]]
partition = { equals = "INVALID_BYTECODE_TYPED_REJECTION" }
case_family = "wrong_type_or_shape"
oracle_ref = "SPEC_RUNTIME_ENGINE_001#online-change-transaction"
outcome = "reject"
no_partial_apply = true
delta = { target = "unchanged", siblings = "unchanged", retain = "unchanged", process_image = "unchanged", diagnostics = "stable_error", status = "unchanged" }
rationale = "The reviewed malformed four-byte module rejects as typed RuntimeError::Bytecode before any reload commit; no stable diagnostic text is claimed."

[[coverage.cells]]
dimension = "ordering_or_lifecycle"
state = "gap_open"
rationale = "Focused mapped tests now cover completed-scan commit, storage kept across a change and I/O replacement, entrypoint/counter restart, a retained value that does not fit taking its initial value, and typed malformed-byte rejection. Broader bytecode/resource commit failure cases remain pending."
