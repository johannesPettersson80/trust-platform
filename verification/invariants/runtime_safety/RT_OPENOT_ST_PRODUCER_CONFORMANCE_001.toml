[[behavior]]
partition = { equals = "EDGE_TRIGGERED_SCAN_COMMIT" }
case_family = "ordering_or_lifecycle"
oracle_ref = "SPEC_OPENOT_AUTHORING_001#11-1-producer-scan-contract"
