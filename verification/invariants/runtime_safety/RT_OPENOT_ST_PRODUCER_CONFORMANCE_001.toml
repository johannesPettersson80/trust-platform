no_partial_apply = true
delta = { target = "unchanged", siblings = "unchanged", retain = "unchanged", process_image = "unchanged", diagnostics = "expected_diagnostic", status = "expected_delta" }
rationale = "Oversize, incomplete, inactive-lifecycle, and invalid-attestation operations publish nothing and do not advance their successful baseline."

[[behavior]]
partition = { equals = "VALUE_SAMPLING_POLICY" }
case_family = "ordering_or_lifecycle"
oracle_ref = "SPEC_OPENOT_AUTHORING_001#11-4-runtime-value-sampling"
