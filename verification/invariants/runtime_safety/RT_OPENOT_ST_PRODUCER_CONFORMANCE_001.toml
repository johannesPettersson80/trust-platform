no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "unchanged", process_image = "unchanged", diagnostics = "none", status = "expected_delta" }
rationale = "On-change, deadband, periodic, and hysteresis policies emit or suppress against only their last successfully committed value and time baselines."

