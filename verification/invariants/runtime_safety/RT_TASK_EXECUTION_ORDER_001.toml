no_partial_apply = true
delta = { target = "set_to_expected", siblings = "expected_delta", retain = "unchanged", process_image = "unchanged", diagnostics = "none", status = "unchanged" }
rationale = "Every unassociated background program executes once per cycle while a task-associated program executes only when its task becomes ready. Relative lowest-priority ordering is separate debt."

