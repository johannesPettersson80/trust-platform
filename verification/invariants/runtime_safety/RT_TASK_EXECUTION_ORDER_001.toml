[[behavior]]
partition = { equals = "UNASSOCIATED_BACKGROUND_ONCE_PER_CYCLE" }
case_family = "ordering_or_lifecycle"
oracle_ref = "SPEC_RUNTIME_ENGINE_001#6-2-task-manager-resource-scheduler"
