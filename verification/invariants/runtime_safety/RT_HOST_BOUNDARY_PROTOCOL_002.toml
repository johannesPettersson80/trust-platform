schema_version = 1
id = "RT_HOST_BOUNDARY_PROTOCOL_002"
title = "Host symbolic boundary resolution and envelopes fail closed"
area = "runtime_safety"
risk = "silent_corruption"
status = "specified"
owner = "trust-runtime"
last_reviewed = "2026-08-01"
claim = "The host symbolic boundary resolves one exact global or unique program path, preserves composite runtime values and stable errors, and never creates fallback storage, aliases, or bindings after a rejected operation."
proof_level = "S0"
contract_kind = "decision_table"
source_refs = ["docs/specs/10-runtime-semantics.md", "crates/trust-runtime/src/host/boundary"]
tests = []
gates = ["veryquick", "pr"]
evidence_refs = []
spec_gap_refs = []
missing = ["catalog_mapping", "focused_execution_evidence", "assertion_reachability", "mutation_sensitivity", "broad_remote_gate"]
[spec]
status = "specified"
source_refs = ["SPEC_RUNTIME_SEMANTICS_001"]
[oracle]
kind = "trust_contract"
ref = "SPEC_RUNTIME_SEMANTICS_001#1112-symbolic-boundary-resolution"

[[behavior]]
partition = { equals = "GLOBAL_BEFORE_UNIQUE_PROGRAM_ROOT" }
case_family = "happy_path"
oracle_ref = "SPEC_RUNTIME_SEMANTICS_001#1112-symbolic-boundary-resolution"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "none", status = "unchanged" }
rationale = "Exact globals take precedence over same-named program fields; otherwise exactly one program root resolves."
[[behavior]]
partition = { equals = "AMBIGUOUS_OR_MISSING_SIMPLE_NAME" }
case_family = "duplicate_or_collision"
oracle_ref = "SPEC_RUNTIME_SEMANTICS_001#1112-symbolic-boundary-resolution"
outcome = "reject"
no_partial_apply = true
delta = { target = "unchanged", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "expected_diagnostic", status = "unchanged" }
rationale = "Ambiguous names preserve complete candidates in registration order and missing names remain unresolved without fallback."
[[behavior]]
partition = { equals = "COMPOSITE_ASSIGNMENT_PATH" }
case_family = "happy_path"
oracle_ref = "SPEC_RUNTIME_SEMANTICS_001#1112-symbolic-boundary-resolution"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "none", status = "unchanged" }
rationale = "Fields, constant indices, partial selections, and dereferences preserve the complete rooted path and exact runtime value identity."
[[behavior]]
partition = { equals = "UNSUPPORTED_OR_INVALID_PATH" }
case_family = "wrong_type_or_shape"
oracle_ref = "SPEC_RUNTIME_SEMANTICS_001#1112-symbolic-boundary-resolution"
outcome = "reject"
no_partial_apply = true
delta = { target = "unchanged", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "expected_diagnostic", status = "unchanged" }
rationale = "Expressions, calls, rootless paths, invalid indices, null dereferences, and incompatible values return their stable boundary class with no mutation."
[[behavior]]
partition = { equals = "DIRECT_BIND_SIMPLE_DECLARED_SCALAR" }
case_family = "happy_path"
oracle_ref = "SPEC_RUNTIME_SEMANTICS_001#1112-symbolic-boundary-resolution"
