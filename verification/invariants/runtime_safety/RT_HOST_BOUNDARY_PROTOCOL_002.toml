no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "not_applicable", process_image = "expected_delta", diagnostics = "none", status = "unchanged" }
rationale = "Direct binding accepts one declared scalar global or uniquely resolved program variable and retains its exact storage reference."
[[behavior]]
