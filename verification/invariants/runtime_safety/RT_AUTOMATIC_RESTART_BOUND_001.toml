tests = ["TEST_AUTO_88A430D6A4852CF7B968", "TEST_AUTO_8B901DEF0D4408B99942", "TEST_AUTO_BD22925B0FA814DDB2F3", "TEST_AUTO_EBC7D491061F23BDD8B6"]
gates = ["pr"]
evidence_refs = []
spec_gap_refs = []
missing = ["cataloged_tests", "focused_execution_evidence", "literal_backoff_floor_exponential_and_cap", "final_remote_gate"]

[spec]
status = "specified"
source_refs = ["SPEC_RUNTIME_ENGINE_001"]

[oracle]
kind = "trust_contract"
ref = "SPEC_RUNTIME_ENGINE_001#fault-overrun-and-watchdog-handling"

[[behavior]]
partition = { equals = "PERSISTENT_NONPANIC_FAULT_RESTART_LIMIT" }
case_family = "persistence_or_recovery"
oracle_ref = "SPEC_RUNTIME_ENGINE_001#fault-overrun-and-watchdog-handling"
outcome = "fault_visible"
no_partial_apply = true
delta = { target = "unchanged", siblings = "unchanged", retain = "expected_delta", process_image = "unchanged", diagnostics = "stable_error", status = "fault_visible" }
rationale = "A persistent ordinary cycle fault receives at most three consecutive restart attempts before visible restart-limit escalation."

[[behavior]]
partition = { equals = "WATCHDOG_RESTART_LIMIT" }
case_family = "time_or_clock_fault"
oracle_ref = "SPEC_RUNTIME_ENGINE_001#fault-overrun-and-watchdog-handling"
outcome = "fault_visible"
fault_surface = "RestartLimitExceeded"
no_partial_apply = true
delta = { target = "unchanged", siblings = "unchanged", retain = "expected_delta", process_image = "unchanged", diagnostics = "stable_error", status = "fault_visible" }
rationale = "A watchdog configured to restart receives exactly the bounded attempt budget before visible restart-limit escalation retains watchdog context."

[[behavior]]
partition = { equals = "RESTART_LIMITER_EXACT_ATTEMPT_BUDGET" }
case_family = "boundary_high"
oracle_ref = "SPEC_RUNTIME_ENGINE_001#fault-overrun-and-watchdog-handling"
fault_surface = "RestartLimitExceeded"
no_partial_apply = true
outcome = "reject"
delta = { target = "unchanged", siblings = "unchanged", retain = "unchanged", process_image = "unchanged", diagnostics = "stable_error", status = "unchanged" }
rationale = "The limiter admits attempts one through three and rejects the fourth consecutive request with a restart-limit error recording three consumed attempts. This helper behavior does not itself mutate resource state."

[[behavior]]
partition = { equals = "RESTART_BACKOFF_NONZERO_MONOTONIC_AND_INTERNAL_CAP" }
case_family = "time_or_clock_fault"
oracle_ref = "SPEC_RUNTIME_ENGINE_001#fault-overrun-and-watchdog-handling"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "unchanged", process_image = "unchanged", diagnostics = "none", status = "unchanged" }
rationale = "Automatic retry delay is nonzero, later attempts do not shorten it, and a large cycle interval plus attempt count saturates at the implementation's cap constant. Literal floor, exponential sequence, and one-second cap proof remain explicit debt."

