schema_version = 1
id = "RT_WEB_HELPER_GRAMMAR_002"
title = "Runtime web helper grammar preserves exact request and projection semantics"
area = "runtime_safety"
risk = "wrong_result"
status = "mapped"
owner = "trust-runtime"
last_reviewed = "2026-08-01"
claim = "Shared runtime web helpers preserve first-header and first-query authority, exact URL and rollout grammar, non-destructive decoding, stable probe fallbacks, bounded QR rendering, and coherent epoch units."
proof_level = "S0"
contract_kind = "decision_table"
source_refs = ["docs/specs/11-runtime-engine.md", "crates/trust-runtime/src/web/web_helpers/contract_tests.rs"]
tests = ["TEST_AUTO_965EDC85DA3B126DD123"]
gates = ["veryquick", "pr"]
evidence_refs = []
spec_gap_refs = []
missing = ["focused_execution_evidence", "assertion_reachability", "mutation_sensitivity", "broad_remote_gate"]

[spec]
status = "specified"
source_refs = ["SPEC_RUNTIME_ENGINE_001"]

[oracle]
kind = "trust_contract"
ref = "SPEC_RUNTIME_ENGINE_001#6-9-7-runtime-web-authentication-and-post-admission"

[[behavior]]
partition = { equals = "FIRST_CASE_INSENSITIVE_HEADER" }
case_family = "encoding_or_unicode"
oracle_ref = "SPEC_RUNTIME_ENGINE_001#6-9-7-runtime-web-authentication-and-post-admission"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "none", status = "unchanged" }
rationale = "Header lookup returns the first ASCII-case-insensitive match, trims only outer ASCII whitespace, and preserves absence."

[[behavior]]
partition = { equals = "TLS_AND_SOCKET_WEB_URL" }
case_family = "platform_or_filesystem_variation"
oracle_ref = "SPEC_RUNTIME_ENGINE_001#6-9-7-runtime-web-authentication-and-post-admission"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "none", status = "unchanged" }
rationale = "Web URLs select http or https, map wildcard IPv4 to localhost, retain ordinary authorities, and bracket IPv6."

[[behavior]]
partition = { equals = "FIRST_EXACT_QUERY_AND_UNSIGNED_LIMIT" }
case_family = "wrong_type_or_shape"
oracle_ref = "SPEC_RUNTIME_ENGINE_001#6-9-7-runtime-web-authentication-and-post-admission"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "stable_error", status = "unchanged" }
rationale = "Query lookup uses the first exact key and limit accepts only one present nonempty unsigned decimal value within usize."

[[behavior]]
partition = { equals = "NON_DESTRUCTIVE_URL_DECODING" }
case_family = "encoding_or_unicode"
oracle_ref = "SPEC_RUNTIME_ENGINE_001#6-9-7-runtime-web-authentication-and-post-admission"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "none", status = "unchanged" }
rationale = "Plus and valid hex escapes decode, invalid UTF-8 becomes the lossy replacement, and malformed or incomplete escapes remain literal."

[[behavior]]
partition = { equals = "EXACT_ROLLOUT_ACTION_ROUTE" }
case_family = "extra_or_unknown"
oracle_ref = "SPEC_RUNTIME_ENGINE_001#6-9-7-runtime-web-authentication-and-post-admission"
outcome = "reject"
no_partial_apply = true
delta = { target = "unchanged", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "stable_error", status = "unchanged" }
rationale = "Only the exact two-component rollout action route matches; components are trimmed and empty, extra, prefix, suffix, and case variants reject."

[[behavior]]
partition = { equals = "PROBE_RESULT_AND_FAILURE_FALLBACK" }
case_family = "wrong_type_or_shape"
oracle_ref = "SPEC_RUNTIME_ENGINE_001#6-9-7-runtime-web-authentication-and-post-admission"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "stable_error", status = "status_degraded" }
rationale = "Successful probe JSON uses plc_name, then resource, then PLC and state or online; invalid or failed results project unreachable unless a string error is supplied."

[[behavior]]
partition = { equals = "COMPLETE_OR_VISIBLE_QR_RESULT" }
case_family = "boundary_high"
oracle_ref = "SPEC_RUNTIME_ENGINE_001#6-9-7-runtime-web-authentication-and-post-admission"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "stable_error", status = "unchanged" }
rationale = "QR rendering returns a complete SVG for exact bytes and a visible error when encoder capacity is exceeded."

[[behavior]]
partition = { equals = "COHERENT_EPOCH_MILLISECOND_NANOSECOND_UNITS" }
case_family = "time_or_clock_fault"
oracle_ref = "SPEC_RUNTIME_ENGINE_001#6-9-7-runtime-web-authentication-and-post-admission"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "none", status = "unchanged" }
rationale = "Wall-clock helpers expose Unix-epoch milliseconds and nanoseconds with the nanosecond reading no earlier than the contemporaneous millisecond value."

