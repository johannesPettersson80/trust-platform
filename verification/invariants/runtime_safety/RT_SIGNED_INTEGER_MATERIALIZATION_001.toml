schema_version = 1
id = "RT_SIGNED_INTEGER_MATERIALIZATION_001"
title = "Signed integer result materialization preserves value or fails before storage"
area = "runtime_safety"
risk = "safety_critical"
status = "implemented"
owner = "trust-runtime"
last_reviewed = "2026-07-22"
claim = "Materializing an integer result as SINT, INT, DINT, or LINT preserves every representable value exactly; a value outside the destination range returns RuntimeError::Overflow before storage, and a non-signed destination returns RuntimeError::TypeMismatch without a value."
proof_level = "G1"
contract_kind = "decision_table"
source_refs = ["crates/trust-runtime-core/src/numeric.rs"]
tests = ["TEST_RUNTIME_SIGNED_INTEGER_MATERIALIZATION_001", "TEST_RUNTIME_SIGNED_INTEGER_MATERIALIZATION_TRACE_001"]
gates = ["pr"]
evidence_refs = [
  "EVID_TEST_RUNTIME_SIGNED_INTEGER_MATERIALIZATION_TRACE_001_LOCK_BASELINE",
  "EVID_TEST_RUNTIME_SIGNED_INTEGER_MATERIALIZATION_TRACE_001_LOCK_COMPARE",
]
spec_gap_refs = []
missing = [
  "assertion_reachability",
  "mutation_sensitivity",
  "broad_remote_gate",
]

[spec]
status = "specified"
source_refs = ["SPEC_RUNTIME_SEMANTICS_001"]

[oracle]
kind = "trust_contract"
ref = "SPEC_RUNTIME_SEMANTICS_001#6-8-signed-integer-result-materialization"

[[behavior]]
partition = { equals = "SIGNED_DESTINATION_REPRESENTABLE_VALUE" }
case_family = "happy_path"
oracle_ref = "SPEC_RUNTIME_SEMANTICS_001#6-8-signed-integer-result-materialization"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "none", status = "unchanged" }
rationale = "For each signed destination, its minimum, zero, and maximum values are returned exactly with the destination runtime tag."

[[behavior]]
partition = { equals = "SIGNED_DESTINATION_BELOW_MINIMUM" }
case_family = "below_min"
oracle_ref = "SPEC_RUNTIME_SEMANTICS_001#6-8-signed-integer-result-materialization"
outcome = "reject"
no_partial_apply = true
delta = { target = "unchanged", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "stable_error", status = "unchanged" }
rationale = "The first value below each signed destination minimum returns RuntimeError::Overflow and produces no replacement value."

[[behavior]]
partition = { equals = "SIGNED_DESTINATION_ABOVE_MAXIMUM" }
case_family = "above_max"
oracle_ref = "SPEC_RUNTIME_SEMANTICS_001#6-8-signed-integer-result-materialization"
outcome = "reject"
no_partial_apply = true
delta = { target = "unchanged", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "stable_error", status = "unchanged" }
rationale = "The first value above each signed destination maximum returns RuntimeError::Overflow and produces no replacement value."

[[behavior]]
partition = { equals = "NON_SIGNED_DESTINATION_CATEGORY" }
case_family = "wrong_type_or_shape"
oracle_ref = "SPEC_RUNTIME_SEMANTICS_001#6-8-signed-integer-result-materialization"
outcome = "reject"
no_partial_apply = true
delta = { target = "unchanged", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "stable_error", status = "unchanged" }
rationale = "Unsigned and floating destination categories return RuntimeError::TypeMismatch rather than being interpreted by the signed boundary."

[[coverage.cells]]
dimension = "happy_path"
state = "covered"
rationale = "The producer-authentic behavior-lock pair executes minimum, zero, and maximum for SINT, INT, DINT, and LINT and compares the exact returned destination tag and value."

[[coverage.cells]]
dimension = "below_min"
state = "covered"
rationale = "The producer-authentic behavior-lock pair executes the first value below every signed destination minimum and requires RuntimeError::Overflow without external state change."

[[coverage.cells]]
dimension = "above_max"
state = "covered"
rationale = "The producer-authentic behavior-lock pair executes the first value above every signed destination maximum and requires RuntimeError::Overflow without external state change."

[[coverage.cells]]
dimension = "wrong_type_or_shape"
state = "covered"
rationale = "The producer-authentic behavior-lock pair executes USINT, UINT, UDINT, ULINT, REAL, and LREAL destinations and requires RuntimeError::TypeMismatch without external state change."
