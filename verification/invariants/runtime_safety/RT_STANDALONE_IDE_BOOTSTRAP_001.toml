case_family = "happy_path"
oracle_ref = "SPEC_RUNTIME_ENGINE_001#runtime-cli-entrypoint-diagnostics-and-dispatch-contract"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "unchanged", process_image = "unchanged", diagnostics = "none", status = "unchanged" }
rationale = "The direct root runtime wins; otherwise the selected workspace runtime supplies identity and deterministic build sources to local authoring state."

[[behavior]]
partition = { equals = "MALFORMED_RUNTIME_OR_NON_DIRECTORY_PROJECT" }
case_family = "wrong_type_or_shape"
oracle_ref = "SPEC_RUNTIME_ENGINE_001#runtime-cli-entrypoint-diagnostics-and-dispatch-contract"
