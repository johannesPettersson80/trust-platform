ref = "SPEC_RUNTIME_ENGINE_001#6-8-1d-runtime-build-and-ci-failure-contract"

[[behavior]]
partition = { equals = "ONE_RECOGNIZED_FAILURE_CLASS" }
case_family = "happy_path"
oracle_ref = "SPEC_RUNTIME_ENGINE_001#6-8-1d-runtime-build-and-ci-failure-contract"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "unchanged", process_image = "unchanged", diagnostics = "none", status = "not_applicable" }
rationale = "Configuration, build, test, timeout, and internal failures map to the stable public constants 10, 11, 12, 13, and 20."

[[behavior]]
partition = { equals = "MULTIPLE_RECOGNIZED_FAILURE_CLASSES" }
case_family = "ordering_or_lifecycle"
oracle_ref = "SPEC_RUNTIME_ENGINE_001#6-8-1d-runtime-build-and-ci-failure-contract"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "unchanged", process_image = "unchanged", diagnostics = "none", status = "not_applicable" }
rationale = "Timeout wins over test, test over build, and build over configuration; command context cannot override the recognized result."

[[behavior]]
partition = { equals = "UNCLASSIFIED_MESSAGE_WITH_OPTIONAL_COMMAND" }
case_family = "extra_or_unknown"
oracle_ref = "SPEC_RUNTIME_ENGINE_001#6-8-1d-runtime-build-and-ci-failure-contract"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "unchanged", process_image = "unchanged", diagnostics = "none", status = "not_applicable" }
rationale = "Only an internal classification is replaced by the documented build, check, test, or validate command fallback."

[[coverage.cells]]
