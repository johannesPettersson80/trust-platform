schema_version = 1
id = "RT_GPIO_PARAMETER_HANDOFF_002"
title = "GPIO parameters and backend handoff preserve exact bit and health state"
area = "runtime_safety"
risk = "safety_critical"
status = "specified"
owner = "trust-runtime"
last_reviewed = "2026-08-01"
claim = "GPIO parameter parsing, mapping, validation, chip discovery, sysfs handoff, debounce, inversion, bounds, and health recovery fail closed without unintended backend or process-image mutation."
proof_level = "S0"
contract_kind = "state_machine"
source_refs = ["docs/specs/11-runtime-engine.md", "crates/trust-runtime/src/io/gpio_contract_tests.rs"]
tests = []
gates = ["veryquick", "pr"]
evidence_refs = []
spec_gap_refs = []
missing = ["catalog_mapping", "focused_execution_evidence", "assertion_reachability", "mutation_sensitivity", "physical_gpio_evidence", "broad_remote_gate"]
[spec]
status = "specified"
source_refs = ["SPEC_RUNTIME_ENGINE_001"]
[oracle]
kind = "trust_contract"
ref = "SPEC_RUNTIME_ENGINE_001#io-drivers"

[[behavior]]
partition = { equals = "CLOSED_PARAMETER_ROOT_COLLECTION_AND_ENTRY_SHAPES" }
case_family = "wrong_type_or_shape"
oracle_ref = "SPEC_RUNTIME_ENGINE_001#io-drivers"
outcome = "reject"
no_partial_apply = true
delta = { target = "unchanged", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "stable_error", status = "unchanged" }
rationale = "The root is a table, input/output collections are lists when present, entries have the declared shape, and unknown backends reject."
[[behavior]]
partition = { equals = "BACKEND_ALIASES_DEFAULTS_AND_EMPTY_CONSTRUCTION" }
case_family = "happy_path"
oracle_ref = "SPEC_RUNTIME_ENGINE_001#io-drivers"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "none", status = "unchanged" }
rationale = "Absent, chardev, and libgpiod select the documented character-device defaults, sysfs selects compatibility paths, and empty construction opens no default character device."
[[behavior]]
partition = { equals = "CONCRETE_DIRECTIONAL_BIT_MAPPING" }
case_family = "wrong_type_or_shape"
oracle_ref = "SPEC_RUNTIME_ENGINE_001#io-drivers"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "stable_error", status = "unchanged" }
rationale = "Inputs require concrete simple IX bits, outputs require concrete simple QX bits, address and physical line are mandatory, line precedes pin alias, and u32 bounds are closed."
[[behavior]]
partition = { equals = "UNIQUE_PHYSICAL_LINE_AND_DIRECTIONAL_IMAGE_BIT" }
case_family = "duplicate_or_collision"
oracle_ref = "SPEC_RUNTIME_ENGINE_001#io-drivers"
outcome = "reject"
no_partial_apply = true
delta = { target = "unchanged", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "stable_error", status = "unchanged" }
rationale = "Physical lines are unique across all mappings and process-image bits are unique within each direction."
[[behavior]]
partition = { equals = "BOOLEAN_AND_DEBOUNCE_FORM_NORMALIZATION" }
case_family = "wrong_type_or_shape"
oracle_ref = "SPEC_RUNTIME_ENGINE_001#io-drivers"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "stable_error", status = "unchanged" }
rationale = "Boolean and debounce forms accept only documented values, preserve stable defaults and bounds, retain a changed input until its debounce interval, then accept it."
[[behavior]]
partition = { equals = "BOUNDED_SYNTHETIC_CHIP_DISCOVERY" }
case_family = "platform_or_filesystem_variation"
oracle_ref = "SPEC_RUNTIME_ENGINE_001#io-drivers"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "stable_error", status = "status_degraded" }
rationale = "Chip enumeration handles missing or invalid roots, bounds synthetic entries, skips invalid files, and accepts only trimmed valid numeric helper values."
[[behavior]]
partition = { equals = "VALIDATION_HAS_NO_BACKEND_SIDE_EFFECT" }
case_family = "ordering_or_lifecycle"
oracle_ref = "SPEC_RUNTIME_ENGINE_001#io-drivers"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "unchanged", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "none", status = "unchanged" }
rationale = "Parameter validation performs no device open, sysfs export, direction write, or process-image change."
[[behavior]]
partition = { equals = "SYSFS_EXPORT_DIRECTION_AND_EXACT_INPUT" }
case_family = "platform_or_filesystem_variation"
oracle_ref = "SPEC_RUNTIME_ENGINE_001#io-drivers"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "stable_error", status = "unchanged" }
rationale = "Sysfs configures existing input/output files, exports missing lines, and admits only exact input level values without fabricating state."
[[behavior]]
partition = { equals = "INPUT_INVERSION_SELECTED_BIT_HANDOFF" }
case_family = "happy_path"
oracle_ref = "SPEC_RUNTIME_ENGINE_001#io-drivers"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "not_applicable", process_image = "expected_delta", diagnostics = "none", status = "unchanged" }
rationale = "Input handoff applies inversion to exactly the selected process-image bit and preserves every sibling bit."
[[behavior]]
partition = { equals = "OUTPUT_INVERSION_AND_UNCHANGED_SUPPRESSION" }
case_family = "happy_path"
oracle_ref = "SPEC_RUNTIME_ENGINE_001#io-drivers"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "none", status = "unchanged" }
rationale = "Output handoff applies inversion and suppresses a backend write when the physical level did not change."
[[behavior]]
partition = { equals = "PROCESS_IMAGE_BOUNDS_FAILURE" }
case_family = "boundary_high"
oracle_ref = "SPEC_RUNTIME_ENGINE_001#io-drivers"
outcome = "reject"
no_partial_apply = true
delta = { target = "unchanged", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "stable_error", status = "fault_visible" }
rationale = "Byte and bit helper bounds and mapped process-image bounds reject without panic or mutation and fault health visibly."
[[behavior]]
partition = { equals = "BACKEND_FAILURE_RETRY_AND_HEALTH_RECOVERY" }
case_family = "persistence_or_recovery"
oracle_ref = "SPEC_RUNTIME_ENGINE_001#io-drivers"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "stable_error", status = "expected_delta" }
rationale = "Read failures short-circuit, failed outputs retry, health remains faulted while failing, and a later confirmed success restores healthy state."

