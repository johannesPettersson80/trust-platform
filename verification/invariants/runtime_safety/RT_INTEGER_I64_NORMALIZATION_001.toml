schema_version = 1
id = "RT_INTEGER_I64_NORMALIZATION_001"
title = "Integer runtime normalization preserves value or fails closed"
area = "runtime_safety"
risk = "safety_critical"
status = "gap_open"
owner = "trust-runtime"
last_reviewed = "2026-07-22"
claim = "Normalizing an integer runtime value to i64 preserves every representable signed or unsigned value exactly; ULINT above i64::MAX returns RuntimeError::Overflow, and a non-integer runtime tag returns RuntimeError::TypeMismatch without a value."
proof_level = "S0"
contract_kind = "decision_table"
source_refs = ["crates/trust-runtime-core/src/numeric.rs"]
tests = ["TEST_AUTO_25B0EF01FE0B077934F8", "TEST_RUNTIME_INTEGER_I64_NORMALIZATION_001", "TEST_RUNTIME_INTEGER_I64_NORMALIZATION_TRACE_001"]
gates = ["pr"]
evidence_refs = ["EVID_TEST_RUNTIME_INTEGER_I64_NORMALIZATION_TRACE_001_LOCK_BASELINE", "EVID_TEST_RUNTIME_INTEGER_I64_NORMALIZATION_TRACE_001_LOCK_COMPARE"]
spec_gap_refs = []
missing = [
  "mutation_sensitivity",
  "broad_remote_gate",
]

[spec]
status = "specified"
source_refs = ["SPEC_RUNTIME_SEMANTICS_001"]

[oracle]
kind = "trust_contract"
ref = "SPEC_RUNTIME_SEMANTICS_001#6-9-integer-runtime-normalization-to-i64"

[[behavior]]
partition = { equals = "SIGNED_INTEGER_RUNTIME_VALUE" }
case_family = "happy_path"
oracle_ref = "SPEC_RUNTIME_SEMANTICS_001#6-9-integer-runtime-normalization-to-i64"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "none", status = "unchanged" }
rationale = "SINT, INT, DINT, and LINT minimum, zero, and maximum values retain their exact mathematical value in i64."

[[behavior]]
partition = { equals = "UNSIGNED_REPRESENTABLE_RUNTIME_VALUE" }
case_family = "happy_path"
oracle_ref = "SPEC_RUNTIME_SEMANTICS_001#6-9-integer-runtime-normalization-to-i64"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "none", status = "unchanged" }
rationale = "USINT, UINT, UDINT, and ULINT values through i64::MAX retain their exact non-negative mathematical value."

[[behavior]]
partition = { equals = "ULINT_ABOVE_I64_MAXIMUM" }
case_family = "above_max"
oracle_ref = "SPEC_RUNTIME_SEMANTICS_001#6-9-integer-runtime-normalization-to-i64"
outcome = "reject"
no_partial_apply = true
delta = { target = "unchanged", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "stable_error", status = "unchanged" }
rationale = "The first ULINT above i64::MAX and u64::MAX return RuntimeError::Overflow without a substitute signed value."

[[behavior]]
partition = { equals = "NON_INTEGER_RUNTIME_VALUE" }
case_family = "wrong_type_or_shape"
oracle_ref = "SPEC_RUNTIME_SEMANTICS_001#6-9-integer-runtime-normalization-to-i64"
outcome = "reject"
no_partial_apply = true
delta = { target = "unchanged", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "stable_error", status = "unchanged" }
rationale = "Boolean, floating, bit-string, text, temporal, aggregate, reference, and sentinel categories are not interpreted as integers."

[[coverage.cells]]
dimension = "happy_path"
state = "covered"
rationale = "The producer-authentic behavior-lock pair executes every signed width at its minimum and maximum and every unsigned width at its representable maximum, including ULINT at i64::MAX, and requires the exact i64 value."

[[coverage.cells]]
dimension = "above_max"
state = "covered"
rationale = "The producer-authentic behavior-lock pair executes both the first ULINT above i64::MAX and u64::MAX and requires RuntimeError::Overflow without a substitute value."

[[coverage.cells]]
dimension = "wrong_type_or_shape"
state = "covered"
rationale = "The producer-authentic behavior-lock pair executes Boolean, floating, bit-string, narrow and wide text and character, reference, and null runtime categories and requires RuntimeError::TypeMismatch without a substitute value."
