schema_version = 1
id = "RT_GUIDED_PROJECT_ARTIFACTS_001"
title = "Guided setup produces one coherent runnable project"
area = "runtime_safety"
risk = "silent_corruption"
status = "mapped"
owner = "trust-runtime"
last_reviewed = "2026-07-22"
claim = "Wizard, CLI, and browser setup validate resource and timing inputs, compile the complete project and dependencies before replacing runtime artifacts, migrate recognized legacy sources, and apply project or system I/O selection without unsafe filesystem deletion."
proof_level = "T1"
contract_kind = "protocol_trace"
source_refs = [
  "crates/trust-runtime/src/bin/trust-runtime/wizard.rs",
  "crates/trust-runtime/src/bin/trust-runtime/setup/cli_flows.rs",
  "crates/trust-runtime/src/bin/trust-runtime/setup_web.rs",
]
tests = [
  "TEST_RUNTIME_SETUP_RESOURCE_NAMES_001",
  "TEST_RUNTIME_SETUP_ZERO_CYCLE_001",
  "TEST_RUNTIME_SETUP_COMPILE_PRESERVES_001",
  "TEST_RUNTIME_SETUP_IO_DANGLING_REMOVE_001",
  "TEST_RUNTIME_SETUP_IO_DIRECTORY_REJECT_001",
  "TEST_RUNTIME_SETUP_LEGACY_MIGRATION_001",
  "TEST_RUNTIME_SETUP_WEB_ARTIFACTS_001",
  "TEST_RUNTIME_SETUP_WEB_SAFE_DEFAULTS_001",
  "TEST_RUNTIME_SETUP_CLI_ARTIFACTS_001",
  "TEST_RUNTIME_SETUP_LITERAL_PATH_001",
  "TEST_RUNTIME_SETUP_NUMERIC_NAME_001",
]
gates = ["pr"]
evidence_refs = []
spec_gap_refs = []
missing = ["interactive_tty_success_path", "filesystem_write_fault_injection", "assertion_reachability", "mutation_sensitivity", "broad_remote_gate"]

[spec]
status = "specified"
source_refs = ["SPEC_DEVELOPER_WORKFLOWS_001"]

[oracle]
kind = "trust_contract"
ref = "SPEC_DEVELOPER_WORKFLOWS_001#project-initialization"

[[behavior]]
partition = { equals = "VALID_NEW_OR_MIGRATED_PROJECT" }
case_family = "happy_path"
oracle_ref = "SPEC_DEVELOPER_WORKFLOWS_001#project-initialization"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "unchanged", process_image = "unchanged", diagnostics = "none", status = "not_applicable" }
rationale = "Setup creates or migrates sources, includes local dependencies, and emits mutually coherent runtime.toml, config.st, I/O selection, and validated program.stbc artifacts."

[[behavior]]
partition = { equals = "INVALID_NAME_ZERO_CYCLE_OR_COMPILE_FAILURE" }
case_family = "wrong_type_or_shape"
oracle_ref = "SPEC_DEVELOPER_WORKFLOWS_001#project-initialization"
outcome = "reject"
no_partial_apply = true
delta = { target = "unchanged", siblings = "unchanged", retain = "unchanged", process_image = "unchanged", diagnostics = "stable_error", status = "not_safe_reported" }
rationale = "Invalid generated contracts and compilation failures reject before setup-owned runtime, source configuration, and bytecode artifacts are replaced."

[[behavior]]
partition = { equals = "PROJECT_OR_SYSTEM_IO_SELECTION" }
case_family = "platform_or_filesystem_variation"
oracle_ref = "SPEC_DEVELOPER_WORKFLOWS_001#project-initialization"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "unchanged", process_image = "unchanged", diagnostics = "none", status = "not_applicable" }
rationale = "System-I/O selection removes only regular files or links, including dangling links, and rejects directory or unsupported shapes without recursive deletion."

[[coverage.cells]]
dimension = "happy_path"
state = "covered"
rationale = "Focused unit and CLI tests prove project creation, literal paths, valid generated identifiers, browser apply, legacy migration, dependency compilation, and decoded bytecode validity."

[[coverage.cells]]
dimension = "wrong_type_or_shape"
state = "covered"
rationale = "Focused tests prove zero-cycle and malformed-source rejection while retaining the previous runtime configuration, generated config, and bytecode."

[[coverage.cells]]
dimension = "platform_or_filesystem_variation"
state = "covered"
rationale = "Focused native tests prove dangling-link removal and directory rejection; injected write failures and interactive TTY success remain explicit debt."
