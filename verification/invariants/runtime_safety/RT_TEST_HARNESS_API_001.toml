[spec]
status = "specified"
source_refs = ["SPEC_RUNTIME_SEMANTICS_001"]

[oracle]
kind = "trust_contract"
ref = "SPEC_RUNTIME_SEMANTICS_001#11-1-test-harness"

[[behavior]]
partition = { equals = "SOURCE_CONSTRUCTION_PASSIVE" }
case_family = "happy_path"
oracle_ref = "SPEC_RUNTIME_SEMANTICS_001#11-1-test-harness"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "unchanged", process_image = "unchanged", diagnostics = "none", status = "not_applicable" }
rationale = "A fresh source harness exposes declared initialization with zero completed cycles and zero simulated time before explicit execution."

[[behavior]]
partition = { equals = "EXACT_CYCLE_AND_TIME_ACCOUNTING" }
case_family = "ordering_or_lifecycle"
oracle_ref = "SPEC_RUNTIME_SEMANTICS_001#11-1-test-harness"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "unchanged", process_image = "expected_delta", diagnostics = "none", status = "not_applicable" }
rationale = "Explicit cycle controls execute their requested count, update program state and cycle count once per cycle, and do not advance simulated time implicitly."

[[behavior]]
partition = { equals = "RUN_UNTIL_PRECHECK_AND_STOP" }
case_family = "ordering_or_lifecycle"
oracle_ref = "SPEC_RUNTIME_SEMANTICS_001#11-1-test-harness"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "unchanged", process_image = "expected_delta", diagnostics = "none", status = "not_applicable" }
rationale = "Run-until checks the current runtime first, returns one result per executed cycle, and stops without executing an extra cycle after the predicate becomes true."

[[behavior]]
partition = { equals = "BOUNDED_EXHAUSTION" }
case_family = "resource_limit"
oracle_ref = "SPEC_RUNTIME_SEMANTICS_001#11-1-test-harness"
outcome = "reject"
no_partial_apply = false
delta = { target = "unchanged", siblings = "unchanged", retain = "unchanged", process_image = "expected_delta", diagnostics = "expected_diagnostic", status = "not_applicable" }
rationale = "Run-until-max commits its three completed cycles and then panics with the reviewed limit-bearing message when the predicate remains false."

