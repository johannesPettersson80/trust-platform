[[behavior]]
partition = { equals = "CONFIG_TOKEN_COMPLETE_ACCEPTANCE_SET" }
case_family = "happy_path"
oracle_ref = "SPEC_RUNTIME_ENGINE_001#portable-watchdog-and-fault-configuration-model"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "unchanged", process_image = "unchanged", diagnostics = "none", status = "unchanged" }
rationale = "Whitespace-trimmed ASCII-case-insensitive watchdog, fault, and retain tokens map to the complete documented action and mode sets."

[[behavior]]
partition = { equals = "CONFIG_TOKEN_REJECTION_PRESERVES_ORIGINAL_TEXT" }
case_family = "extra_or_unknown"
oracle_ref = "SPEC_RUNTIME_ENGINE_001#portable-watchdog-and-fault-configuration-model"
outcome = "reject"
no_partial_apply = true
delta = { target = "unchanged", siblings = "unchanged", retain = "unchanged", process_image = "unchanged", diagnostics = "stable_error", status = "unchanged" }
rationale = "Every token outside the closed set returns the exact InvalidConfig variant and preserves the complete original text in the diagnostic."

[[behavior]]
partition = { equals = "WATCHDOG_DEFAULT_AND_DECISION_PROJECTION" }
case_family = "ordering_or_lifecycle"
oracle_ref = "SPEC_RUNTIME_ENGINE_001#portable-watchdog-and-fault-configuration-model"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "unchanged", process_image = "unchanged", diagnostics = "none", status = "unchanged" }
rationale = "New and default watchdog holders store disabled zero-timeout SafeHalt and project the active action to the exact action and safe-state instruction without executing it."

[[behavior]]
partition = { equals = "FAULT_DEFAULT_READS_AND_INFO_IDENTITY" }
case_family = "happy_path"
oracle_ref = "SPEC_RUNTIME_ENGINE_001#portable-watchdog-and-fault-configuration-model"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "unchanged", process_image = "unchanged", diagnostics = "none", status = "unchanged" }
rationale = "New and default fault holders remain healthy with Halt policy and no error under reads, while FaultInfo clone preserves the exact host-supplied reason."

[[coverage.cells]]
