spec_gap_refs = []
missing = ["assertion_reachability", "mutation_sensitivity", "broad_remote_gate"]

[spec]
status = "specified"
source_refs = ["SPEC_RUNTIME_SEMANTICS_001"]

[oracle]
kind = "trust_contract"
ref = "SPEC_RUNTIME_SEMANTICS_001#2-7-portable-runtime-value-and-program-model-contracts"

[[behavior]]
partition = { equals = "CIVIL_DATE_EPOCH_AND_GREGORIAN_RULES" }
case_family = "happy_path"
oracle_ref = "SPEC_RUNTIME_SEMANTICS_001#2-7-portable-runtime-value-and-program-model-contracts"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "unchanged", process_image = "unchanged", diagnostics = "none", status = "unchanged" }
rationale = "The proleptic Gregorian calendar maps the Unix epoch to day zero and applies the divisible-by-4, century, and divisible-by-400 leap rules."

[[behavior]]
partition = { equals = "CIVIL_DATE_INVALID_OR_I64_OVERFLOW" }
case_family = "wrong_type_or_shape"
oracle_ref = "SPEC_RUNTIME_SEMANTICS_001#2-7-portable-runtime-value-and-program-model-contracts"
outcome = "reject"
no_partial_apply = true
delta = { target = "unchanged", siblings = "unchanged", retain = "unchanged", process_image = "unchanged", diagnostics = "stable_error", status = "unchanged" }
rationale = "Invalid calendar fields return InvalidDate and every unrepresentable intermediate or result returns Overflow without panic or wrap."

[[behavior]]
partition = { equals = "PROFILE_DAY_RESOLUTION_EXACT_QUOTIENT" }
case_family = "resource_limit"
oracle_ref = "SPEC_RUNTIME_SEMANTICS_001#2-7-portable-runtime-value-and-program-model-contracts"
outcome = "reject"
no_partial_apply = true
delta = { target = "unchanged", siblings = "unchanged", retain = "unchanged", process_image = "unchanged", diagnostics = "stable_error", status = "unchanged" }
rationale = "A profile resolution must be positive, no larger than a day, and divide the day exactly; valid profiles return the exact ticks-per-day quotient."

[[behavior]]
partition = { equals = "SIGNED_DAY_AND_NANOSECOND_TICK_CONVERSION" }
case_family = "boundary_low"
oracle_ref = "SPEC_RUNTIME_SEMANTICS_001#2-7-portable-runtime-value-and-program-model-contracts"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "unchanged", process_image = "unchanged", diagnostics = "none", status = "unchanged" }
rationale = "Day conversion uses checked multiply-plus-epoch arithmetic, while signed nanoseconds use truncation toward zero or Euclidean division exactly as requested."

[[coverage.cells]]
dimension = "happy_path"
state = "gap_open"
rationale = "Epoch and Gregorian leap-rule assertions await red-green completion, catalog binding, and dynamic trace."

