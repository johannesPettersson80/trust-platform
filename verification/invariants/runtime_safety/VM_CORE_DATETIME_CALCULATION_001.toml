schema_version = 1
id = "VM_CORE_DATETIME_CALCULATION_001"
title = "Portable date-time calculations preserve calendar and profile boundaries"
area = "runtime_safety"
risk = "wrong_result"
status = "mapped"
owner = "trust-runtime"
last_reviewed = "2026-08-12"
claim = "Civil-date and profile-tick helpers use checked proleptic-Gregorian arithmetic, accept only exactly representable positive day resolutions, preserve the configured epoch, and apply the requested signed division mode."
proof_level = "S0"
contract_kind = "decision_table"
source_refs = ["docs/specs/10-runtime-semantics.md", "crates/trust-runtime-core/src/datetime.rs"]
tests = ["TEST_AUTO_0DD6F5FFD78B0AAF4BAC", "TEST_AUTO_BA82D0C35FD9C81BB003", "TEST_AUTO_D22C929A6648C0C54C86"]
gates = ["pr"]
