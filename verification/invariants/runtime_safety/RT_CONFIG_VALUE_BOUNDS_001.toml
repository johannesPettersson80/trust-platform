schema_version = 1
id = "RT_CONFIG_VALUE_BOUNDS_001"
title = "Runtime configuration preserves duration and I/O value bounds"
area = "runtime_safety"
risk = "silent_corruption"
status = "mapped"
owner = "trust-runtime"
last_reviewed = "2026-07-22"
claim = "Runtime configuration rejects millisecond values that cannot be represented by the signed-nanosecond runtime Duration and rejects safe-state integers outside the addressed output width; neither path overflows, panics, narrows, wraps, clamps, or substitutes values."
proof_level = "T1"
contract_kind = "decision_table"
source_refs = [
  "crates/trust-runtime/src/config/parser/validation/runtime/base.rs",
  "crates/trust-runtime/src/config/parser/validation/runtime/ads.rs",
  "crates/trust-runtime/src/config/parser/validation/runtime/opcua_client.rs",
  "crates/trust-runtime/src/config/parser/validation/io.rs",
]
tests = [
  "TEST_IO_SCHEMA_PRESERVES_SAFE_STATE_INTEGER_WIDTHS_001",
  "TEST_RUNTIME_SCHEMA_PRESERVES_SIGNED_DURATION_BOUNDS_001",
]
gates = ["pr"]
evidence_refs = []
spec_gap_refs = []
missing = ["assertion_reachability", "mutation_sensitivity", "broad_remote_gate"]

[spec]
status = "specified"
source_refs = ["SPEC_RUNTIME_ENGINE_001"]

[oracle]
kind = "trust_contract"
ref = "SPEC_RUNTIME_ENGINE_001#runtime-configuration-loading-and-validation-contract"

[[behavior]]
partition = { equals = "MAXIMUM_REPRESENTABLE_DURATION_OR_TYPED_SAFE_STATE" }
case_family = "boundary_high"
oracle_ref = "SPEC_RUNTIME_ENGINE_001#runtime-configuration-loading-and-validation-contract"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "unchanged", process_image = "unchanged", diagnostics = "none", status = "not_applicable" }
rationale = "The maximum millisecond value representable as signed nanoseconds and each maximum unsigned safe-state value remain exact after parsing."

[[behavior]]
partition = { equals = "DURATION_OR_SAFE_STATE_ABOVE_REPRESENTABLE_RANGE" }
case_family = "above_max"
oracle_ref = "SPEC_RUNTIME_ENGINE_001#runtime-configuration-loading-and-validation-contract"
outcome = "reject"
no_partial_apply = true
delta = { target = "unchanged", siblings = "unchanged", retain = "unchanged", process_image = "unchanged", diagnostics = "stable_error", status = "not_safe_reported" }
rationale = "A value one above the owning representation rejects before a RuntimeConfig or IoConfig is returned."

[[coverage.cells]]
dimension = "boundary_high"
state = "covered"
rationale = "Focused parser tests retain exact maximum duration and BYTE, WORD, DWORD, and LWORD values."

[[coverage.cells]]
dimension = "above_max"
state = "covered"
rationale = "Focused parser tests reject duration and typed safe-state values above their representable maximums."
