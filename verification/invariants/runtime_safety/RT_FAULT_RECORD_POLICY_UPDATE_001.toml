schema_version = 1
id = "RT_FAULT_RECORD_POLICY_UPDATE_001"
title = "Fault recording and policy replacement preserve independent state"
area = "runtime_safety"
risk = "safety_critical"
status = "mapped"
owner = "trust-runtime"
last_reviewed = "2026-07-22"
claim = "Recording stores the newest runtime fault and marks the holder faulted without changing policy; replacing policy stores the new policy without clearing or rewriting fault observations."
proof_level = "T1"
contract_kind = "state_machine"
source_refs = ["crates/trust-runtime-core/src/watchdog.rs"]
tests = ["TEST_AUTO_3ABA95C0A5F1B0311E38", "TEST_AUTO_3EFD5D5E736CB0C47DD6", "TEST_RUNTIME_FAULT_RECORD_POLICY_UPDATE_001"]
gates = ["pr"]
evidence_refs = []
spec_gap_refs = []
missing = [
  "assertion_reachability",
  "mutation_sensitivity",
  "broad_remote_gate",
]

[spec]
status = "specified"
source_refs = ["SPEC_RUNTIME_ENGINE_001"]

[oracle]
kind = "trust_contract"
ref = "SPEC_RUNTIME_ENGINE_001#fault-recording-and-policy-replacement"

[[behavior]]
partition = { equals = "FIRST_FAULT_RECORD" }
case_family = "happy_path"
oracle_ref = "SPEC_RUNTIME_ENGINE_001#fault-recording-and-policy-replacement"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "unchanged", process_image = "unchanged", diagnostics = "none", status = "fault_visible" }
rationale = "Recording sets faulted true and stores the supplied error exactly while preserving the configured policy."

[[behavior]]
partition = { equals = "LATER_FAULT_REPLACES_LAST" }
case_family = "ordering_or_lifecycle"
oracle_ref = "SPEC_RUNTIME_ENGINE_001#fault-recording-and-policy-replacement"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "unchanged", process_image = "unchanged", diagnostics = "none", status = "fault_visible" }
rationale = "A later fault replaces the stored last error without changing the policy or clearing the faulted observation."

[[behavior]]
partition = { equals = "POLICY_REPLACED_WHILE_FAULTED" }
case_family = "ordering_or_lifecycle"
oracle_ref = "SPEC_RUNTIME_ENGINE_001#fault-recording-and-policy-replacement"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "unchanged", process_image = "unchanged", diagnostics = "none", status = "fault_visible" }
rationale = "Replacing policy changes only future handling policy; it preserves the current fault flag and exact stored error."

[[coverage.cells]]
dimension = "happy_path"
state = "covered"
rationale = "The focused unit matrix records WatchdogTimeout under SafeHalt and checks the exact error, faulted state, and unchanged policy."

[[coverage.cells]]
dimension = "ordering_or_lifecycle"
state = "covered"
rationale = "The focused unit matrix replaces policy while faulted and then records DivisionByZero, proving independent policy and latest-error state transitions."
