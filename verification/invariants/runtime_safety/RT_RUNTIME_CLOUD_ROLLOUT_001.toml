schema_version = 1
id = "RT_RUNTIME_CLOUD_ROLLOUT_001"
title = "Runtime Cloud rollout preserves ordered completion, failure, abort, and terminal state"
area = "runtime_safety"
risk = "false_status"
status = "mapped"
owner = "trust-runtime"
last_reviewed = "2026-07-29"
claim = "A Runtime Cloud rollout completes only after target verification, retains apply failure evidence, aborts unfinished targets, and rejects state-changing actions against terminal rollouts."
proof_level = "S0"
contract_kind = "state_machine"
source_refs = [
  "crates/trust-runtime/src/runtime_cloud/rollout_policy.rs",
  "crates/trust-runtime/src/web/runtime_cloud_state/rollouts.rs",
  "crates/trust-runtime/src/web/runtime_cloud_routes/rollouts.rs",
]
tests = ["TEST_AUTO_F6B45DEF6650A34B17B3"]
gates = ["pr"]
evidence_refs = []
spec_gap_refs = []
missing = ["assertion_reachability", "mutation_sensitivity", "broad_remote_gate"]

[spec]
status = "specified"
source_refs = ["SPEC_RUNTIME_ENGINE_001"]

[oracle]
kind = "trust_contract"
ref = "SPEC_RUNTIME_ENGINE_001#runtime-cloud-state-dispatch-and-rollout-contract"

[[behavior]]
partition = { equals = "APPLY_VERIFY_AND_COMPLETE" }
case_family = "happy_path"
oracle_ref = "SPEC_RUNTIME_ENGINE_001#runtime-cloud-state-dispatch-and-rollout-contract"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "expected_delta", retain = "expected_delta", process_image = "unchanged", diagnostics = "none", status = "unchanged" }
rationale = "The rollout completes only after every selected target advances through apply and retains deterministic verification evidence."

[[behavior]]
partition = { equals = "APPLY_OR_RECONCILIATION_FAILURE" }
case_family = "hardware_or_network_fault"
oracle_ref = "SPEC_RUNTIME_ENGINE_001#runtime-cloud-state-dispatch-and-rollout-contract"
outcome = "not_safe_reported"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "expected_delta", process_image = "unchanged", diagnostics = "stable_error", status = "status_degraded" }
rationale = "A failed target makes the rollout fail and retains the underlying configuration-apply error."

[[behavior]]
partition = { equals = "ABORT_OR_TERMINAL_ACTION" }
case_family = "ordering_or_lifecycle"
oracle_ref = "SPEC_RUNTIME_ENGINE_001#runtime-cloud-state-dispatch-and-rollout-contract"
outcome = "reject"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "expected_delta", retain = "expected_delta", process_image = "unchanged", diagnostics = "stable_error", status = "unchanged" }
rationale = "Abort marks active work and unfinished targets aborted, while pause, resume, or abort against terminal state conflicts without rewriting it."

