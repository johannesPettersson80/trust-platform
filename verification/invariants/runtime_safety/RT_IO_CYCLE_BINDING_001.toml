no_partial_apply = true
delta = { target = "set_to_expected", siblings = "expected_delta", retain = "unchanged", process_image = "expected_delta", diagnostics = "none", status = "unchanged" }
rationale = "Configured driver order is preserved globally across a successful boundary: every input read completes before task execution and every output write follows task execution, so no driver write occurs before all driver reads."

