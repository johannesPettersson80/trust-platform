[[behavior]]
partition = { equals = "CYCLE_READ_EXECUTE_WRITE_SNAPSHOT" }
case_family = "ordering_or_lifecycle"
oracle_ref = "SPEC_RUNTIME_ENGINE_001#io-drivers"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "unchanged", process_image = "expected_delta", diagnostics = "none", status = "unchanged" }
rationale = "Inputs are latched before tasks, outputs are committed after tasks, and one snapshot follows the output commit."

[[behavior]]
partition = { equals = "COMPOSED_DRIVER_SINGLE_INVOCATION" }
