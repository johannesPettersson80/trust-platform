schema_version = 1
id = "RT_OFFLINE_COMM_AUTHORING_CLI_001"
title = "Offline communication authoring rejects malformed inputs and preserves operation routing"
area = "runtime_safety"
risk = "false_status"
status = "mapped"
owner = "trust-runtime"
last_reviewed = "2026-07-23"
claim = "Each offline communication CLI action invokes its matching operation and prints only a successful JSON result; malformed local payloads and snapshots fail before success, and a freshly rendered runtime template remains valid for offline topology and apply."
proof_level = "T1"
contract_kind = "protocol_trace"
source_refs = ["crates/trust-runtime/src/bin/trust-runtime/comm.rs", "crates/trust-runtime/src/host/bundle_template.rs"]
tests = [
  "TEST_OFFLINE_COMM_AUTHORING_CLI_COMM_CLI_RUNS_SCHEMA_APPLY_TOPOLOGY_AND_CACHED_BROWSE_OFFLINE_001",
  "TEST_OFFLINE_COMM_AUTHORING_CLI_COMM_CLI_VALIDATES_PAYLOADS_AND_MANAGES_THE_SELECTED_OPCUA_TRUST_STORE_001",
  "TEST_OFFLINE_COMM_AUTHORING_CLI_COMM_CLI_REJECTS_MALFORMED_LOCAL_AUTHORING_INPUTS_001"
]
gates = ["pr"]
evidence_refs = []
spec_gap_refs = []
missing = ["assertion_reachability", "mutation_sensitivity", "broad_remote_gate", "external_protocol_discovery"]

[spec]
status = "specified"
source_refs = ["SPEC_RUNTIME_ENGINE_001"]

[oracle]
kind = "trust_contract"
ref = "SPEC_RUNTIME_ENGINE_001#6-8-1a-offline-communication-authoring-client"

[[behavior]]
partition = { equals = "VALID_OFFLINE_AUTHORING_ACTION" }
case_family = "happy_path"
oracle_ref = "SPEC_RUNTIME_ENGINE_001#6-8-1a-offline-communication-authoring-client"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "unchanged", process_image = "unchanged", diagnostics = "none", status = "unchanged" }
rationale = "Schema, topology, apply, discover, cached browse, and OPC UA trust actions each delegate once and return their structured result."

[[behavior]]
partition = { equals = "MALFORMED_LOCAL_JSON_OR_SNAPSHOT" }
case_family = "wrong_type_or_shape"
oracle_ref = "SPEC_RUNTIME_ENGINE_001#6-8-1a-offline-communication-authoring-client"
outcome = "reject"
no_partial_apply = true
delta = { target = "unchanged", siblings = "unchanged", retain = "unchanged", process_image = "unchanged", diagnostics = "stable_error", status = "status_degraded" }
rationale = "Malformed or incorrectly shaped local inputs fail before a delegated operation can report success."

[[behavior]]
partition = { equals = "FRESH_DEFAULT_RUNTIME_TEMPLATE" }
case_family = "ordering_or_lifecycle"
oracle_ref = "SPEC_RUNTIME_ENGINE_001#6-8-1a-offline-communication-authoring-client"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "unchanged", process_image = "unchanged", diagnostics = "none", status = "unchanged" }
rationale = "A newly rendered runtime template omits an unset mesh secret and remains valid when offline apply is followed by topology."

[[coverage.cells]]
dimension = "happy_path"
state = "covered"
rationale = "The existing offline CLI integration tests execute every run_comm action family and validate representative structured results."

[[coverage.cells]]
dimension = "wrong_type_or_shape"
state = "covered"
rationale = "The focused negative matrices reject malformed JSON, non-object parameters and targets, and missing or malformed snapshots."

[[coverage.cells]]
dimension = "ordering_or_lifecycle"
state = "covered"
rationale = "The focused regression renders a new project, applies communication configuration, and then loads offline topology successfully."

[[coverage.cells]]
dimension = "hardware_or_network_fault"
state = "gap_open"
rationale = "Real external protocol discovery remains owned by protocol and hardware proof lanes."
