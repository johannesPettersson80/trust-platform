no_partial_apply = true
delta = { target = "set_to_expected", siblings = "expected_delta", retain = "not_applicable", process_image = "expected_delta", diagnostics = "stable_error", status = "status_degraded" }
rationale = "Health snapshots replace stale rows in driver order; empty safe-state refreshes health only; safe-state attempts every driver and returns the first failure."
[[behavior]]
