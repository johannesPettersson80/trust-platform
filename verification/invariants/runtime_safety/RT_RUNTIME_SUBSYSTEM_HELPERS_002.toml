[[behavior]]
partition = { equals = "RESOURCE_METADATA_COMPATIBILITY_AND_TASK_SPELLING" }
case_family = "encoding_or_unicode"
oracle_ref = "SPEC_RUNTIME_ENGINE_001#scan-cycle-architecture"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "stable_error", status = "unchanged" }
rationale = "The legacy RESOURCE placeholder applies only to one resource named RESOURCE; ordinary metadata matches program references case-insensitively while preserving task spelling."
[[behavior]]
partition = { equals = "CASE_INSENSITIVE_CYCLE_SCHEDULING_AND_PROGRAM_EXECUTION" }
case_family = "ordering_or_lifecycle"
oracle_ref = "SPEC_RUNTIME_ENGINE_001#scan-cycle-architecture"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "none", status = "unchanged" }
rationale = "Cycle scheduling and program execution resolve runtime names case-insensitively without changing configured order."
[[behavior]]
partition = { equals = "CYCLE_DEADLINE_AND_NONNEGATIVE_MILLISECOND_PROJECTION" }
case_family = "time_or_clock_fault"
oracle_ref = "SPEC_RUNTIME_ENGINE_001#scan-cycle-architecture"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "stable_error", status = "unchanged" }
rationale = "Output deadlines distinguish missing, future, and expired, while cycle-time projection clamps negative values and preserves nonnegative milliseconds."
[[behavior]]
