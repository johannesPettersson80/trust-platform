schema_version = 1
id = "RT_SIMULATION_WORKFLOW_001"
title = "Simulation models preserve deterministic scan-boundary behavior"
area = "runtime_safety"
risk = "silent_corruption"
status = "specified"
owner = "trust-runtime"
last_reviewed = "2026-07-27"
claim = "Accepted simulation models activate predictably, apply coupling and physics effects only at scan boundaries, reject conflicting feedback targets, replay deterministically, expose due faults, and do not manufacture watchdog failures from clock scaling."
proof_level = "S0"
contract_kind = "state_machine"
source_refs = [
  "docs/specs/11-runtime-engine.md",
  "docs/PRODUCT_DECISIONS.md",
  "crates/trust-runtime/src/host/simulation.rs",
  "crates/trust-runtime/tests/simulation_workflow.rs",
]
tests = []
gates = ["pr"]
evidence_refs = []
spec_gap_refs = []
missing = ["cataloged_tests", "focused_execution_evidence", "coupling_only_implicit_enable", "disturbance_only_implicit_enable", "explicit_disable_override", "file_backed_due_and_equal_time_order", "physics_to_physics_target_collision", "threshold_equality", "observable_false_branch_due_application", "known_coupling_trace_oracle", "different_seed_influence", "programmatic_disturbance_order", "multi_effect_ordering_boundaries", "final_remote_gate"]

[spec]
status = "specified"
source_refs = ["SPEC_RUNTIME_ENGINE_001"]

[oracle]
kind = "trust_contract"
ref = "SPEC_RUNTIME_ENGINE_001#simulation-model-execution"

[[behavior]]
partition = { equals = "MODEL_PARSE_WITH_EXPLICIT_ENABLE" }
case_family = "happy_path"
oracle_ref = "SPEC_RUNTIME_ENGINE_001#simulation-model-execution"
outcome = "accept_value"
delta = { target = "set_to_expected", siblings = "expected_delta", retain = "not_applicable", process_image = "unchanged", diagnostics = "none", status = "expected_delta" }
rationale = "The loader preserves an explicitly enabled model's seed, positive time scale, coupling, and disturbance configuration."

[[behavior]]
partition = { equals = "PHYSICS_PARSE_WITH_IMPLICIT_ENABLE" }
case_family = "happy_path"
oracle_ref = "SPEC_RUNTIME_ENGINE_001#simulation-model-execution"
outcome = "accept_value"
delta = { target = "set_to_expected", siblings = "expected_delta", retain = "not_applicable", process_image = "unchanged", diagnostics = "none", status = "expected_delta" }
rationale = "A file with omitted simulation enablement and enabled nonempty physics loads as enabled while preserving backend, step, joint kind, and exact I/O endpoints."

[[behavior]]
partition = { equals = "PHYSICS_FEEDBACK_TARGET_CONFLICT" }
case_family = "duplicate_or_collision"
oracle_ref = "SPEC_RUNTIME_ENGINE_001#simulation-model-execution"
outcome = "reject"
delta = { target = "unchanged", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "stable_error", status = "unchanged" }
rationale = "A physics feedback target that duplicates a coupling target rejects with the reviewed conflict diagnostic."

[[behavior]]
partition = { equals = "PHYSICS_FEEDBACK_SCAN_BOUNDARY" }
case_family = "ordering_or_lifecycle"
oracle_ref = "SPEC_RUNTIME_ENGINE_001#simulation-model-execution"
outcome = "accept_value"
delta = { target = "set_to_expected", siblings = "unchanged", retain = "not_applicable", process_image = "expected_delta", diagnostics = "none", status = "unchanged" }
rationale = "A physics step queues encoder feedback after a scan and the following pre-cycle boundary applies the exact due value."

[[behavior]]
partition = { equals = "DETERMINISTIC_PHYSICS_REPLAY" }
case_family = "ordering_or_lifecycle"
oracle_ref = "SPEC_RUNTIME_ENGINE_001#simulation-model-execution"
outcome = "accept_value"
delta = { target = "set_to_expected", siblings = "expected_delta", retain = "not_applicable", process_image = "expected_delta", diagnostics = "none", status = "unchanged" }
rationale = "Two fixed-step revolute simulations with the same accepted model and inputs produce equal traces whose first and clamped final encoder values follow the specified zero initialization, step, clamp, round, and bound rules; helper-selected length and artifact hash are not compatibility oracles."

[[behavior]]
partition = { equals = "DETERMINISTIC_COUPLING_REPLAY" }
case_family = "happy_path"
oracle_ref = "SPEC_RUNTIME_ENGINE_001#simulation-model-execution"
outcome = "accept_value"
delta = { target = "set_to_expected", siblings = "expected_delta", retain = "not_applicable", process_image = "expected_delta", diagnostics = "none", status = "unchanged" }
rationale = "Two coupling simulations with the same accepted model, time sequence, and output inputs produce equal traces; this behavior does not claim the trace is nonempty or independently correct."

[[behavior]]
partition = { equals = "COUPLING_THRESHOLD_DELAY_BOUNDARY" }
case_family = "ordering_or_lifecycle"
oracle_ref = "SPEC_RUNTIME_ENGINE_001#simulation-model-execution"
outcome = "accept_value"
delta = { target = "set_to_expected", siblings = "unchanged", retain = "not_applicable", process_image = "expected_delta", diagnostics = "none", status = "unchanged" }
rationale = "A reviewed below-threshold source leaves the false input unchanged, while an above-threshold source remains invisible before the configured delay and becomes true at the due boundary; threshold equality and observable false-branch application remain explicit gaps."

[[behavior]]
partition = { equals = "SCRIPTED_FAULT_AT_DUE_TIME" }
case_family = "time_or_clock_fault"
oracle_ref = "SPEC_RUNTIME_ENGINE_001#simulation-model-execution"
outcome = "fault_visible"
fault_surface = "SimulationFault"
delta = { target = "set_to_expected", siblings = "not_applicable", retain = "not_applicable", process_image = "not_applicable", diagnostics = "stable_error", status = "fault_visible" }
rationale = "A programmatically constructed scripted fault leaves the runtime unfaulted before its due time and becomes a visible SimulationFault at the due boundary; unrelated state preservation is not claimed."

[[behavior]]
partition = { equals = "ACCELERATED_CLOCK_CLEAN_STOP" }
case_family = "time_or_clock_fault"
oracle_ref = "SPEC_RUNTIME_ENGINE_001#simulation-model-execution"
outcome = "accept_value"
delta = { target = "set_to_expected", siblings = "not_applicable", retain = "unchanged", process_image = "unchanged", diagnostics = "none", status = "expected_delta" }
rationale = "An accelerated scheduler clock does not manufacture a watchdog failure from scaled model time: an explicitly stopped nonoverrunning resource reaches Stopped with no terminal error."

[[coverage.cells]]
dimension = "happy_path"
state = "gap_open"
rationale = "Reviewed simulation configuration and deterministic replay assertions await generated catalog mapping and focused execution."

[[coverage.cells]]
dimension = "duplicate_or_collision"
state = "gap_open"
rationale = "Reviewed feedback-target conflict assertions await generated catalog mapping and focused execution."

[[coverage.cells]]
dimension = "ordering_or_lifecycle"
state = "gap_open"
rationale = "Reviewed scan-boundary and physics replay assertions await generated catalog mapping and focused execution."

[[coverage.cells]]
dimension = "time_or_clock_fault"
state = "gap_open"
rationale = "Reviewed scripted-fault and accelerated-clock clean-stop assertions await generated catalog mapping and focused execution."
