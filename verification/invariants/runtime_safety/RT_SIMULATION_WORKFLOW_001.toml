delta = { target = "set_to_expected", siblings = "unchanged", retain = "not_applicable", process_image = "expected_delta", diagnostics = "none", status = "unchanged" }
rationale = "A reviewed below-threshold source leaves the false input unchanged, while an above-threshold source remains invisible before the configured delay and becomes true at the due boundary; threshold equality and observable false-branch application remain explicit gaps."

[[behavior]]
partition = { equals = "SCRIPTED_FAULT_AT_DUE_TIME" }
case_family = "time_or_clock_fault"
oracle_ref = "SPEC_RUNTIME_ENGINE_001#simulation-model-execution"
