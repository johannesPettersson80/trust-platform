dimension = "boundary_high"
state = "gap_open"
rationale = "Bounded-string canonicalization awaits focused catalog proof."

[[coverage.cells]]
dimension = "ordering_or_lifecycle"
state = "gap_open"
rationale = "Structure-field addition and removal await focused catalog proof."

[[coverage.cells]]
dimension = "extra_or_unknown"
state = "gap_open"
rationale = "Orphan removal awaits focused catalog proof."

[[coverage.cells]]
dimension = "persistence_or_recovery"
state = "covered"
rationale = "Accepted catalog mappings and the exact focused remote shard cover compatible recursive enum, structure, and one-dimensional array identity canonicalization."

[[coverage.cells]]
dimension = "wrong_type_or_shape"
state = "covered"
rationale = "Accepted catalog mappings and the exact focused remote shard cover rejection of reviewed incompatible nested structure fields and array elements without claiming independently observed atomic unchanged state."
