schema_version = 1
id = "RT_RETAIN_MIGRATION_001"
title = "Retain migration is typed, visible, and transactional"
area = "runtime_safety"
risk = "data_loss"
status = "mapped"
owner = "trust-runtime"
last_reviewed = "2026-07-28"
claim = "Warm-load migration safely widens numeric values, canonicalizes bounded strings, reconciles declared structure fields, drops orphan globals, emits typed events, and never exposes a partial rejected snapshot."
proof_level = "S0"
contract_kind = "decision_table"
source_refs = [
  "docs/specs/11-runtime-engine.md",
  "crates/trust-runtime/src/runtime",
  "crates/trust-runtime/src/retain",
]
tests = ["TEST_AUTO_27D4369EB8A25ADDB6A8", "TEST_AUTO_5B7344B729E5C62F8DE3", "TEST_AUTO_5CE1CFAF7B148E819A77", "TEST_AUTO_5EDF42B452D0B1EDDA96", "TEST_AUTO_75EFF22ADED7B9F53606", "TEST_AUTO_7CD5D444A8A4F7601610", "TEST_AUTO_82C2C9A40CD6B6417DA6", "TEST_AUTO_86D6D1369E5C7793C53F", "TEST_AUTO_FC0227884281CC4F9C2C"]
gates = ["pr"]
evidence_refs = []
spec_gap_refs = []
missing = ["final_remote_gate"]

[spec]
status = "specified"
source_refs = ["SPEC_RUNTIME_ENGINE_001"]

[oracle]
kind = "trust_contract"
ref = "SPEC_RUNTIME_ENGINE_001#retain-codec-compatibility-and-migration"

[[behavior]]
partition = { equals = "SAFE_NUMERIC_WIDENING" }
case_family = "happy_path"
oracle_ref = "SPEC_RUNTIME_ENGINE_001#retain-codec-compatibility-and-migration"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "expected_delta", process_image = "unchanged", diagnostics = "none", status = "unchanged" }
rationale = "A safely widenable retained scalar preserves its mathematical value in the current destination type and emits RetainMigrationApplied."

[[behavior]]
partition = { equals = "BOUNDED_STRING_CANONICALIZATION" }
case_family = "boundary_high"
oracle_ref = "SPEC_RUNTIME_ENGINE_001#retain-codec-compatibility-and-migration"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "expected_delta", process_image = "unchanged", diagnostics = "none", status = "unchanged" }
rationale = "An overlong retained string is canonicalized to the current declared bound without splitting a scalar and emits RetainMigrationApplied."

[[behavior]]
partition = { equals = "DECLARED_STRUCTURE_FIELD_ADDITION" }
case_family = "ordering_or_lifecycle"
oracle_ref = "SPEC_RUNTIME_ENGINE_001#retain-codec-compatibility-and-migration"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "expected_delta", retain = "expected_delta", process_image = "unchanged", diagnostics = "none", status = "unchanged" }
rationale = "A newly declared structure field receives its declared initializer or type default while preserved fields retain their values, and migration emits RetainMigrationApplied."

[[behavior]]
partition = { equals = "REMOVED_STRUCTURE_FIELD_DROP" }
case_family = "ordering_or_lifecycle"
oracle_ref = "SPEC_RUNTIME_ENGINE_001#retain-codec-compatibility-and-migration"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "expected_delta", retain = "expected_delta", process_image = "unchanged", diagnostics = "none", status = "unchanged" }
rationale = "A field absent from the current structure declaration is dropped while remaining fields preserve their values, and migration emits RetainMigrationApplied."

[[behavior]]
partition = { equals = "ORPHAN_GLOBAL_DROP" }
case_family = "extra_or_unknown"
oracle_ref = "SPEC_RUNTIME_ENGINE_001#retain-codec-compatibility-and-migration"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "expected_delta", process_image = "unchanged", diagnostics = "none", status = "unchanged" }
rationale = "A retained global absent from the current program is dropped and emits RetainOrphanDropped."

[[behavior]]
partition = { equals = "RECURSIVE_DECLARED_IDENTITY_CANONICALIZATION" }
case_family = "persistence_or_recovery"
oracle_ref = "SPEC_RUNTIME_ENGINE_001#retain-codec-compatibility-and-migration"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "expected_delta", process_image = "unchanged", diagnostics = "none", status = "unchanged" }
rationale = "Reviewed enum values, a nested enum in one structure, and a one-dimensional array of structures rebuild the current declared type, variant, field, and inclusive-bounds identities."

[[behavior]]
partition = { equals = "INCOMPATIBLE_NESTED_VALUE_REJECTION" }
case_family = "wrong_type_or_shape"
oracle_ref = "SPEC_RUNTIME_ENGINE_001#retain-codec-compatibility-and-migration"
outcome = "reject"
no_partial_apply = false
delta = { target = "not_applicable", siblings = "not_applicable", retain = "not_applicable", process_image = "not_applicable", diagnostics = "expected_diagnostic", status = "unchanged" }
rationale = "A BOOL substituted for the reviewed INT structure field or array element rejects retain application with the cause class invalid retained value; these tests do not independently observe atomic unchanged state."

[[coverage.cells]]
dimension = "happy_path"
state = "gap_open"
rationale = "Safe scalar migration awaits focused catalog proof."

