schema_version = 1
id = "RT_UNSIGNED_INTEGER_MATERIALIZATION_001"
title = "Unsigned integer result materialization preserves value or fails before storage"
area = "runtime_safety"
risk = "safety_critical"
status = "implemented"
owner = "trust-runtime"
last_reviewed = "2026-07-22"
claim = "Materializing an integer result as USINT, UINT, UDINT, or ULINT preserves every representable value exactly; a value below zero or above the destination range returns RuntimeError::Overflow before storage, and a non-unsigned destination returns RuntimeError::TypeMismatch without a value."
proof_level = "G1"
contract_kind = "decision_table"
source_refs = ["crates/trust-runtime-core/src/numeric.rs"]
tests = ["TEST_RUNTIME_UNSIGNED_INTEGER_MATERIALIZATION_001", "TEST_RUNTIME_UNSIGNED_INTEGER_MATERIALIZATION_TRACE_001"]
gates = ["pr"]
evidence_refs = [
  "EVID_TEST_RUNTIME_UNSIGNED_INTEGER_MATERIALIZATION_TRACE_001_LOCK_BASELINE",
  "EVID_TEST_RUNTIME_UNSIGNED_INTEGER_MATERIALIZATION_TRACE_001_LOCK_COMPARE",
  "EVID_RT_UNSIGNED_INTEGER_MATERIALIZATION_ASSERTION_REACHABILITY_001",
]
spec_gap_refs = []
missing = [
  "mutation_sensitivity",
  "broad_remote_gate",
]

[spec]
status = "specified"
source_refs = ["SPEC_RUNTIME_SEMANTICS_001"]

[oracle]
kind = "trust_contract"
ref = "SPEC_RUNTIME_SEMANTICS_001#6-10-unsigned-integer-result-materialization"

[[behavior]]
partition = { equals = "UNSIGNED_DESTINATION_REPRESENTABLE_VALUE" }
case_family = "happy_path"
oracle_ref = "SPEC_RUNTIME_SEMANTICS_001#6-10-unsigned-integer-result-materialization"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "none", status = "unchanged" }
rationale = "For each unsigned destination, zero and the maximum value are returned exactly with the destination runtime tag."

[[behavior]]
partition = { equals = "UNSIGNED_DESTINATION_ABOVE_MAXIMUM" }
case_family = "above_max"
oracle_ref = "SPEC_RUNTIME_SEMANTICS_001#6-10-unsigned-integer-result-materialization"
outcome = "reject"
no_partial_apply = true
delta = { target = "unchanged", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "stable_error", status = "unchanged" }
rationale = "The first value above each unsigned destination maximum returns RuntimeError::Overflow and produces no replacement value."

[[behavior]]
partition = { equals = "NON_UNSIGNED_DESTINATION_CATEGORY" }
case_family = "wrong_type_or_shape"
oracle_ref = "SPEC_RUNTIME_SEMANTICS_001#6-10-unsigned-integer-result-materialization"
outcome = "reject"
no_partial_apply = true
delta = { target = "unchanged", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "stable_error", status = "unchanged" }
rationale = "Signed and floating destination categories return RuntimeError::TypeMismatch rather than being interpreted by the unsigned boundary."

[[behavior]]
partition = { equals = "UNSIGNED_DESTINATION_BELOW_ZERO" }
case_family = "below_min"
oracle_ref = "SPEC_RUNTIME_SEMANTICS_001#6-10-unsigned-integer-result-materialization"
outcome = "reject"
no_partial_apply = true
delta = { target = "unchanged", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "stable_error", status = "unchanged" }
rationale = "A negative integer result returns RuntimeError::Overflow before writing an unsigned destination."

[[coverage.cells]]
dimension = "happy_path"
state = "covered"
rationale = "The producer-authentic behavior-lock pair executes zero and the maximum for USINT, UINT, UDINT, and ULINT and compares the exact returned destination tag and value."

[[coverage.cells]]
dimension = "above_max"
state = "covered"
rationale = "The producer-authentic behavior-lock pair executes the first value above every unsigned destination maximum and requires RuntimeError::Overflow without a substitute value."

[[coverage.cells]]
dimension = "wrong_type_or_shape"
state = "covered"
rationale = "The producer-authentic behavior-lock pair executes SINT, INT, DINT, LINT, REAL, and LREAL destinations and requires RuntimeError::TypeMismatch without a substitute value."

[[coverage.cells]]
dimension = "below_min"
state = "gap_open"
rationale = "The reviewed VM output-width assertion awaits generated catalog mapping."
