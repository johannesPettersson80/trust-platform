schema_version = 1
id = "RT_RUNTIME_CLOUD_ACTION_POLICY_001"
title = "Runtime Cloud preflight validates targets and applies profile-specific write policy"
area = "runtime_safety"
risk = "security"
status = "mapped"
owner = "trust-runtime"
last_reviewed = "2026-07-22"
claim = "Runtime Cloud action preflight fails closed for malformed target sets, prevents duplicate target execution, and applies explicit WAN write allowlists only in the WAN profile while preserving the secure transport requirements of plant and WAN profiles."
proof_level = "T1"
contract_kind = "decision_table"
source_refs = [
  "crates/trust-runtime/src/runtime_cloud/routing.rs",
  "crates/trust-runtime/src/runtime_cloud/profile_policy.rs",
]
tests = [
  "TEST_ACTION_MAPPING_REJECTS_INVALID_CONFIG_AND_COMMAND_PAYLOADS_001",
  "TEST_ALLOWLIST_SUPPORTS_GLOBAL_AND_EXACT_PATTERNS_001",
  "TEST_ALLOWLIST_SUPPORTS_PREFIX_AND_SUFFIX_PATTERNS_001",
  "TEST_CFG_APPLY_LINK_TRANSPORT_PROTECTED_KEY_REQUIRES_ADMIN_ROLE_001",
  "TEST_CFG_APPLY_REQUIRES_ADMIN_FOR_EVERY_PROTECTED_RUNTIME_KEY_001",
  "TEST_CFG_APPLY_ROOT_LEVEL_PROTECTED_KEY_REQUIRES_ADMIN_ROLE_001",
  "TEST_DEV_AND_PLANT_PROFILES_DO_NOT_REQUIRE_WAN_WRITE_ALLOWLIST_001",
  "TEST_DEV_PROFILE_ALLOWS_REMOTE_TARGET_WITHOUT_SECURE_TRANSPORT_METADATA_001",
  "TEST_MAP_ACTION_CFG_APPLY_EMITS_CONFIG_SET_CONTROL_REQUEST_001",
  "TEST_MAP_ACTION_STATUS_READ_EMITS_STATUS_CONTROL_REQUEST_001",
  "TEST_PREFLIGHT_APPLIES_ACL_DENIAL_FOR_CFG_WRITE_001",
  "TEST_PREFLIGHT_CONNECTED_VIA_MISMATCH_HAS_DETERMINISTIC_PRECEDENCE_001",
  "TEST_PREFLIGHT_DENIES_UNREACHABLE_TARGET_WITH_REASON_CODE_001",
  "TEST_PREFLIGHT_DISTINGUISHES_STALE_TARGET_AND_ALLOWS_LOCAL_TARGET_001",
  "TEST_PREFLIGHT_REJECTS_BLANK_IDENTITY_AND_INVALID_API_VERSIONS_001",
  "TEST_PREFLIGHT_REJECTS_EMPTY_BLANK_OR_DUPLICATE_TARGET_LISTS_001",
  "TEST_PREFLIGHT_REJECTS_UNKNOWN_ACTION_BEFORE_TARGET_ROUTING_001",
  "TEST_RUNTIME_CLOUD_API_PAYLOAD_FUZZ_SMOKE_BUDGET_001",
  "TEST_RUNTIME_CLOUD_PREFLIGHT_ALLOWS_CROSS_SITE_CFG_APPLY_WITH_ALLOWLIST_001",
  "TEST_RUNTIME_CLOUD_PREFLIGHT_DENIES_CFG_APPLY_FOR_VIEWER_WITH_DETERMINISTIC_ACL_CODE_001",
  "TEST_RUNTIME_CLOUD_PREFLIGHT_DENIES_CMD_INVOKE_FOR_VIEWER_WITH_PERMISSION_DENIED_CODE_001",
  "TEST_RUNTIME_CLOUD_PREFLIGHT_DEV_ALLOWS_CROSS_SITE_CFG_APPLY_WITHOUT_ALLOWLIST_001",
  "TEST_RUNTIME_CLOUD_PREFLIGHT_MARKS_PARTIAL_PARTITION_TARGET_AS_STALE_001",
  "TEST_RUNTIME_CLOUD_PREFLIGHT_REJECTS_CROSS_ORIGIN_POST_001",
  "TEST_RUNTIME_CLOUD_PREFLIGHT_REJECTS_NON_JSON_CONTENT_TYPE_001",
  "TEST_RUNTIME_CLOUD_PREFLIGHT_REJECTS_OVERSIZED_JSON_BODY_001",
  "TEST_RUNTIME_CLOUD_PREFLIGHT_RETURNS_DETERMINISTIC_UNREACHABLE_DENIAL_001",
  "TEST_RUNTIME_CLOUD_PREFLIGHT_WAN_REQUIRES_SECURE_PROFILE_PRECONDITIONS_001",
  "TEST_SECURE_PROFILES_REQUIRE_TOKEN_TLS_AND_SECURE_REMOTE_METADATA_001",
  "TEST_WAN_ALLOWLIST_PARSER_FUZZ_SMOKE_BUDGET_001",
  "TEST_WAN_PROFILE_DENIES_WRITE_WITHOUT_MATCHING_RULE_001",
  "TEST_WAN_READ_ACTION_DOES_NOT_REQUIRE_WRITE_ALLOWLIST_001",
]
gates = ["pr"]
evidence_refs = []
spec_gap_refs = []
missing = ["assertion_reachability", "mutation_sensitivity", "broad_remote_gate"]

[spec]
status = "specified"
source_refs = ["SPEC_RUNTIME_ENGINE_001"]

[oracle]
kind = "trust_contract"
ref = "SPEC_RUNTIME_ENGINE_001#runtime-cloud-action-preflight-and-profile-contract"

[[behavior]]
partition = { equals = "VALID_UNIQUE_NONEMPTY_TARGETS" }
case_family = "happy_path"
oracle_ref = "SPEC_RUNTIME_ENGINE_001#runtime-cloud-action-preflight-and-profile-contract"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "unchanged", process_image = "unchanged", diagnostics = "none", status = "not_applicable" }
rationale = "A valid target set reaches common role, reachability, freshness, and profile policy exactly once per target."

[[behavior]]
partition = { equals = "EMPTY_BLANK_OR_DUPLICATE_TARGETS" }
case_family = "wrong_type_or_shape"
oracle_ref = "SPEC_RUNTIME_ENGINE_001#runtime-cloud-action-preflight-and-profile-contract"
outcome = "reject"
no_partial_apply = true
delta = { target = "unchanged", siblings = "unchanged", retain = "unchanged", process_image = "unchanged", diagnostics = "stable_error", status = "not_safe_reported" }
rationale = "Malformed target sets cannot become an allowed no-op or repeat a target side effect."

[[behavior]]
partition = { equals = "DEV_OR_PLANT_CROSS_SITE_WRITE_WITHOUT_WAN_RULE" }
case_family = "auth_or_permission"
oracle_ref = "SPEC_RUNTIME_ENGINE_001#runtime-cloud-action-preflight-and-profile-contract"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "unchanged", process_image = "unchanged", diagnostics = "none", status = "not_applicable" }
rationale = "The WAN write allowlist is not a policy input for dev or plant; their documented role and transport checks remain authoritative."

[[behavior]]
partition = { equals = "WAN_CROSS_SITE_WRITE_WITHOUT_MATCHING_RULE" }
case_family = "auth_or_permission"
oracle_ref = "SPEC_RUNTIME_ENGINE_001#runtime-cloud-action-preflight-and-profile-contract"
outcome = "reject"
no_partial_apply = true
delta = { target = "unchanged", siblings = "unchanged", retain = "unchanged", process_image = "unchanged", diagnostics = "stable_error", status = "not_safe_reported" }
rationale = "WAN cross-site writes remain default-deny until an explicit action and target rule matches."

[[coverage.cells]]
dimension = "happy_path"
state = "covered"
rationale = "Existing routing and profile tests cover valid target, role, reachability, secure transport, and allowlisted WAN paths."

[[coverage.cells]]
dimension = "wrong_type_or_shape"
state = "covered"
rationale = "The focused malformed-target matrix covers empty, blank, and duplicate target sets."

[[coverage.cells]]
dimension = "auth_or_permission"
state = "covered"
rationale = "The profile matrix distinguishes dev and plant behavior from WAN default-deny behavior."
