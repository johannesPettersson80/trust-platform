schema_version = 1
id = "RT_OPENOT_TELEMETRY_PUBLICATION_001"
title = "OpenOT telemetry publication is ordered and fail closed"
area = "runtime_safety"
risk = "silent_corruption"
status = "planned"
owner = "trust-runtime"
last_reviewed = "2026-07-27"
claim = "Each successful runtime cycle publishes its required heartbeat or configured producer records with intact source metadata and never reports success after a required append failure."
proof_level = "S0"
contract_kind = "protocol_trace"
source_refs = ["docs/specs/27-openot-authoring.md", "crates/trust-runtime/src/runtime", "crates/trust-runtime/tests/openot_telemetry.rs"]
tests = []
gates = ["pr"]
evidence_refs = []
spec_gap_refs = []
missing = ["cataloged_tests", "focused_execution_evidence", "final_remote_gate"]

[spec]
status = "specified"
source_refs = ["SPEC_OPENOT_AUTHORING_001"]

[oracle]
kind = "trust_contract"
ref = "SPEC_OPENOT_AUTHORING_001#12-runtime-telemetry-publication"

[[behavior]]
partition = { equals = "HEARTBEAT_OR_ST_PRODUCER_PUBLICATION" }
case_family = "happy_path"
oracle_ref = "SPEC_OPENOT_AUTHORING_001#12-1-heartbeat-and-st-producer-publication"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "expected_delta", retain = "unchanged", process_image = "unchanged", diagnostics = "none", status = "unchanged" }
rationale = "A successful cycle appends one canonical heartbeat or drains every complete configured ST producer record in configured order."

[[behavior]]
partition = { equals = "REQUIRED_PUBLICATION_FAILS_THE_CYCLE" }
case_family = "resource_limit"
oracle_ref = "SPEC_OPENOT_AUTHORING_001#12-2-publication-failure-and-scan-integrity"
outcome = "reject"
no_partial_apply = true
delta = { target = "unchanged", siblings = "unchanged", retain = "unchanged", process_image = "unchanged", diagnostics = "expected_diagnostic", status = "expected_delta" }
rationale = "A required create, encode, or append failure fails the cycle and never acknowledges uncommitted producer data."

[[behavior]]
partition = { equals = "MULTI_SOURCE_SEQUENCE_AND_TRANSITION_ORDER" }
case_family = "ordering_or_lifecycle"
oracle_ref = "SPEC_OPENOT_AUTHORING_001#12-3-multi-source-sequence-and-transition"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "expected_delta", retain = "unchanged", process_image = "unchanged", diagnostics = "none", status = "unchanged" }
rationale = "Configured producer order is retained while each run/source pair keeps independent monotonic sequence and transition order."

[[coverage.cells]]
dimension = "happy_path"
state = "gap_open"
rationale = "The heartbeat and ST-producer publication contract is specified; catalog mapping and focused execution are pending."

[[coverage.cells]]
dimension = "resource_limit"
state = "gap_open"
rationale = "The publication failure contract is specified; catalog mapping and focused execution are pending."

[[coverage.cells]]
dimension = "ordering_or_lifecycle"
state = "gap_open"
rationale = "The multi-source ordering contract is specified; catalog mapping and focused execution are pending."
