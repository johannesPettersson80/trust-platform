schema_version = 1
id = "RT_CONTROL_REQUEST_JOB_001"
title = "Runtime control requests and asynchronous jobs fail closed"
area = "runtime_safety"
risk = "false_status"
status = "mapped"
owner = "trust-runtime"
last_reviewed = "2026-07-26"
claim = "Runtime control decodes and routes each request exactly once, distinguishes unsupported types from invalid parameters, and exposes bounded asynchronous job success, failure, and not-found state without synthetic ADS results."
proof_level = "S1"
contract_kind = "protocol_trace"
source_refs = ["crates/trust-runtime/src/control"]
tests = ["TEST_AUTO_310AD2B4269939FFE836", "TEST_AUTO_4A21D68A73FE4FBAEC0D", "TEST_AUTO_7CFA25E00041BF572099", "TEST_AUTO_98C072DEE99220B94B98", "TEST_AUTO_A542BF00CD94824D5DB6", "TEST_AUTO_A6203BCF8543279FF710", "TEST_AUTO_A883DECF8E1190C71056", "TEST_AUTO_CE772515BBC4E8ED75DB", "TEST_AUTO_D23A413C4CDBA3912B2A", "TEST_AUTO_E597196254404C3948A6", "TEST_AUTO_E7009F6DA35E4F274C36", "TEST_AUTO_EC51372847454451E8D4"]
gates = ["pr"]
evidence_refs = []
spec_gap_refs = []
missing = ["assertion_reachability", "mutation_sensitivity", "broad_remote_gate"]

[spec]
status = "specified"
source_refs = ["SPEC_RUNTIME_ENGINE_001"]

[oracle]
kind = "trust_contract"
ref = "SPEC_RUNTIME_ENGINE_001#runtime-control-request-job-and-state-surface-contract"

[[behavior]]
partition = { malformed = "CONTROL_REQUEST_JSON" }
coverage_dimension = "wrong_type_or_shape"
oracle_ref = "SPEC_RUNTIME_ENGINE_001#runtime-control-request-job-and-state-surface-contract"
outcome = "reject"
no_partial_apply = true
delta = { target = "unchanged", siblings = "not_applicable", retain = "unchanged", process_image = "unchanged", diagnostics = "stable_error", status = "unchanged" }
rationale = "Malformed request JSON returns one negative response without dispatch or mutation."

[[behavior]]
partition = { equals = "UNREGISTERED_CONTROL_REQUEST_TYPE" }
case_family = "extra_or_unknown"
oracle_ref = "SPEC_RUNTIME_ENGINE_001#runtime-control-request-job-and-state-surface-contract"
outcome = "reject"
no_partial_apply = true
delta = { target = "unchanged", siblings = "not_applicable", retain = "unchanged", process_image = "unchanged", diagnostics = "stable_error", status = "unchanged" }
rationale = "Only an absent operation type returns the stable unsupported-request error."

[[behavior]]
partition = { equals = "REGISTERED_HANDLER_ROUTE" }
case_family = "happy_path"
oracle_ref = "SPEC_RUNTIME_ENGINE_001#runtime-control-request-job-and-state-surface-contract"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "not_applicable", retain = "unchanged", process_image = "unchanged", diagnostics = "none", status = "unchanged" }
rationale = "Every registered operation reaches its owning handler; this partition proves routing only and does not claim complete semantic success."

[[behavior]]
partition = { malformed = "REQUIRED_CONTROL_PARAMS" }
coverage_dimension = "wrong_type_or_shape"
oracle_ref = "SPEC_RUNTIME_ENGINE_001#runtime-control-request-job-and-state-surface-contract"
outcome = "reject"
no_partial_apply = true
delta = { target = "unchanged", siblings = "not_applicable", retain = "unchanged", process_image = "unchanged", diagnostics = "stable_error", status = "unchanged" }
rationale = "Missing or malformed required parameters return a parameter error rather than falling through as unsupported."

[[behavior]]
partition = { equals = "REQUIRED_ADS_WIRE_UNAVAILABLE" }
case_family = "platform_or_filesystem_variation"
oracle_ref = "SPEC_RUNTIME_ENGINE_001#runtime-control-request-job-and-state-surface-contract"
outcome = "reject"
no_partial_apply = true
delta = { target = "unchanged", siblings = "not_applicable", retain = "unchanged", process_image = "unchanged", diagnostics = "stable_error", status = "not_safe_reported" }
rationale = "A live ADS operation without ads-wire fails explicitly and cannot synthesize discovery, Doctor, route, or import results."

[[behavior]]
partition = { equals = "ASYNCHRONOUS_JOB_LIFECYCLE" }
case_family = "concurrency_or_cancellation"
oracle_ref = "SPEC_RUNTIME_ENGINE_001#runtime-control-request-job-and-state-surface-contract"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "not_applicable", retain = "unchanged", process_image = "unchanged", diagnostics = "expected_diagnostic", status = "not_safe_reported" }
rationale = "ADS client and server Doctor return a nonempty job ID and terminate as complete with a report or failed with a retained reason."

[[behavior]]
partition = { equals = "UNKNOWN_JOB_ID" }
case_family = "extra_or_unknown"
oracle_ref = "SPEC_RUNTIME_ENGINE_001#runtime-control-request-job-and-state-surface-contract"
outcome = "reject"
no_partial_apply = true
delta = { target = "unchanged", siblings = "not_applicable", retain = "unchanged", process_image = "unchanged", diagnostics = "stable_error", status = "unchanged" }
rationale = "Polling an unknown job returns the stable machine-readable not-found error without creating a job."

