schema_version = 1
id = "RT_FAULT_STATE_CLEAR_001"
title = "Fault-state clearing is atomic, policy-preserving, and recovery-neutral"
area = "runtime_safety"
risk = "safety_critical"
status = "gap_open"
owner = "trust-runtime"
last_reviewed = "2026-07-22"
claim = "Clearing the portable runtime fault holder removes both the faulted flag and stored last error without changing fault policy; clearing an already healthy holder is idempotent and performs no resource recovery side effect."
proof_level = "S0"
contract_kind = "decision_table"
source_refs = ["crates/trust-runtime-core/src/watchdog.rs"]
tests = ["TEST_RUNTIME_FAULT_STATE_CLEAR_001", "TEST_RUNTIME_FAULT_STATE_CLEAR_TRACE_001"]
gates = ["pr"]
evidence_refs = ["EVID_TEST_RUNTIME_FAULT_STATE_CLEAR_TRACE_001_LOCK_BASELINE", "EVID_TEST_RUNTIME_FAULT_STATE_CLEAR_TRACE_001_LOCK_COMPARE"]
spec_gap_refs = []
missing = [
  "mutation_sensitivity",
  "broad_remote_gate",
]

[spec]
status = "specified"
source_refs = ["SPEC_RUNTIME_ENGINE_001"]

[oracle]
kind = "trust_contract"
ref = "SPEC_RUNTIME_ENGINE_001#fault-state-clear-lifecycle"

[[behavior]]
partition = { equals = "RECORDED_FAULT_CLEAR" }
case_family = "happy_path"
oracle_ref = "SPEC_RUNTIME_ENGINE_001#fault-state-clear-lifecycle"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "unchanged", process_image = "unchanged", diagnostics = "none", status = "not_applicable" }
rationale = "A recorded fault clears as one observable transition: faulted becomes false, the last error becomes absent, and the configured fault policy remains unchanged."

[[behavior]]
partition = { equals = "HEALTHY_CLEAR_IDEMPOTENT" }
case_family = "ordering_or_lifecycle"
oracle_ref = "SPEC_RUNTIME_ENGINE_001#fault-state-clear-lifecycle"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "unchanged", siblings = "unchanged", retain = "unchanged", process_image = "unchanged", diagnostics = "none", status = "not_applicable" }
rationale = "Repeated clear calls on a healthy holder preserve the healthy state, absent last error, and configured policy without manufacturing a recovery action."

[[coverage.cells]]
dimension = "happy_path"
state = "covered"
rationale = "The cataloged unit lock and producer-authentic generated trace pair execute the recorded-fault transition and verify that the flag and stored error clear while SafeHalt policy remains unchanged."

[[coverage.cells]]
dimension = "ordering_or_lifecycle"
state = "covered"
rationale = "The producer-authentic generated trace pair executes repeated clear calls on an already healthy holder and verifies that Restart policy and healthy observations remain unchanged."
