[spec]
status = "specified"
source_refs = ["SPEC_RUNTIME_ENGINE_001"]

[oracle]
kind = "trust_contract"
ref = "SPEC_RUNTIME_ENGINE_001#runtime-configuration-loading-and-validation-contract"

[[behavior]]
partition = { equals = "DOCUMENTED_EXPLICIT_OR_OMITTED_OPTIONAL_CONFIGURATION" }
case_family = "happy_path"
oracle_ref = "SPEC_RUNTIME_ENGINE_001#runtime-configuration-loading-and-validation-contract"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "unchanged", process_image = "unchanged", diagnostics = "none", status = "not_applicable" }
rationale = "Documented explicit values are preserved and omitted optional fields receive only their documented defaults."

[[behavior]]
partition = { equals = "UNKNOWN_WRONG_SHAPE_MIXED_FORM_OR_INCOMPLETE_GROUP" }
case_family = "wrong_type_or_shape"
oracle_ref = "SPEC_RUNTIME_ENGINE_001#runtime-configuration-loading-and-validation-contract"
outcome = "reject"
no_partial_apply = true
delta = { target = "unchanged", siblings = "unchanged", retain = "unchanged", process_image = "unchanged", diagnostics = "stable_error", status = "not_safe_reported" }
rationale = "Closed schemas and conditional groups reject malformed or conflicting input before a configuration object is returned."

[[behavior]]
partition = { equals = "BLANK_EXPLICIT_ENDPOINT_PATH_INTERFACE_PRODUCER_PATTERN_OR_VERSION_ENTRY" }
case_family = "missing_required"
oracle_ref = "SPEC_RUNTIME_ENGINE_001#runtime-configuration-loading-and-validation-contract"
outcome = "reject"
no_partial_apply = true
delta = { target = "unchanged", siblings = "unchanged", retain = "unchanged", process_image = "unchanged", diagnostics = "stable_error", status = "not_safe_reported" }
rationale = "A present value must remain distinguishable from omission; trimming cannot silently turn explicit input into a default or discarded entry."

[[behavior]]
partition = { equals = "REMOTE_OR_SECURITY_SENSITIVE_CONFIGURATION" }
case_family = "auth_or_permission"
oracle_ref = "SPEC_RUNTIME_ENGINE_001#runtime-configuration-loading-and-validation-contract"
outcome = "reject"
no_partial_apply = true
delta = { target = "unchanged", siblings = "unchanged", retain = "unchanged", process_image = "unchanged", diagnostics = "stable_error", status = "not_safe_reported" }
rationale = "Remote web, mesh, ADS, OPC UA, signed deployment, and write-capable surfaces require their documented authentication, TLS, allowlist, and acknowledgement combinations."

[[coverage.cells]]
dimension = "happy_path"
state = "covered"
rationale = "Focused parser tests cover valid runtime, I/O, ADS, OPC UA, OpenOT, realtime, HMI persistence, runtime-cloud, transport, and omission-default configurations."

[[coverage.cells]]
dimension = "wrong_type_or_shape"
state = "covered"
rationale = "Focused negative tests cover unknown fields, invalid ranges and enums, mixed or empty I/O driver forms, duplicate entries, invalid paths, and incomplete conditional groups."

[[coverage.cells]]
dimension = "missing_required"
state = "covered"
rationale = "Focused regressions reject blank explicit paths and blank collection or map entries instead of defaulting or dropping them."

[[coverage.cells]]
dimension = "auth_or_permission"
state = "covered"
rationale = "Focused parser tests cover control authentication, TLS credentials, CA and keyring requirements, ADS exposure/client restrictions, OPC UA credentials, and explicit insecure-transport opt-ins."
