schema_version = 1
id = "RT_RUNTIME_CLOUD_DISPATCH_001"
title = "Runtime Cloud dispatch preserves target isolation, remote payload, and audit correlation"
area = "runtime_safety"
risk = "silent_corruption"
status = "mapped"
owner = "trust-runtime"
last_reviewed = "2026-07-29"
claim = "Runtime Cloud dispatch never substitutes local mutation for an unavailable remote target, keeps local targets independent of unrelated partitions, returns remote status and configuration payloads, and retains one audit and request correlation across success and failure."
proof_level = "S0"
contract_kind = "protocol_trace"
source_refs = [
  "crates/trust-runtime/src/web/runtime_cloud_dispatch.rs",
  "crates/trust-runtime/src/web/runtime_cloud_routes",
  "crates/trust-runtime/tests/web_io_config_integration",
]
tests = ["TEST_AUTO_32C133895EF215A753BF", "TEST_AUTO_3362A72E05A959F7FFB3", "TEST_AUTO_33A2FF91EF8E84727972", "TEST_AUTO_526714F31DC8382E8F14", "TEST_AUTO_9E7E128921D261CC0DDE", "TEST_AUTO_A87E1CF2D7FC307115AB", "TEST_AUTO_CA23666027C91B2552EE", "TEST_AUTO_CB4DC2C360EA8DE45593", "TEST_AUTO_D74A24E1A5D2F78A6E2D", "TEST_AUTO_F3F082D6F583D954B0F2"]
gates = ["pr"]
evidence_refs = []
spec_gap_refs = []
missing = ["assertion_reachability", "mutation_sensitivity", "broad_remote_gate"]

[spec]
status = "specified"
source_refs = ["SPEC_RUNTIME_ENGINE_001"]

[oracle]
kind = "trust_contract"
ref = "SPEC_RUNTIME_ENGINE_001#runtime-cloud-state-dispatch-and-rollout-contract"

[[behavior]]
partition = { equals = "LOCAL_TARGET_DISPATCH_INDEPENDENCE" }
case_family = "hardware_or_network_fault"
oracle_ref = "SPEC_RUNTIME_ENGINE_001#runtime-cloud-state-dispatch-and-rollout-contract"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "unchanged", process_image = "unchanged", diagnostics = "none", status = "unchanged" }
rationale = "A local configuration target dispatches directly and remains operational when an unrelated peer is partitioned."

[[behavior]]
partition = { equals = "UNREACHABLE_OR_BUDGET_EXHAUSTED_REMOTE_TARGET" }
case_family = "concurrency_or_cancellation"
oracle_ref = "SPEC_RUNTIME_ENGINE_001#runtime-cloud-state-dispatch-and-rollout-contract"
outcome = "reject"
no_partial_apply = true
delta = { target = "unchanged", siblings = "unchanged", retain = "unchanged", process_image = "unchanged", diagnostics = "stable_error", status = "not_safe_reported" }
rationale = "Unreachable or budget-exhausted remote work returns a visible denial and never falls back to local apply."

[[behavior]]
partition = { equals = "REMOTE_STATUS_CONFIGURATION_AND_IO_PROXY" }
case_family = "happy_path"
oracle_ref = "SPEC_RUNTIME_ENGINE_001#runtime-cloud-state-dispatch-and-rollout-contract"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "unchanged", process_image = "expected_delta", diagnostics = "none", status = "unchanged" }
rationale = "Remote status, runtime configuration, and I/O proxy requests return and, where authorized, persist the selected remote runtime payload."

[[behavior]]
partition = { equals = "REQUEST_AND_TARGET_AUDIT_CORRELATION" }
case_family = "ordering_or_lifecycle"
oracle_ref = "SPEC_RUNTIME_ENGINE_001#runtime-cloud-state-dispatch-and-rollout-contract"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "expected_delta", process_image = "unchanged", diagnostics = "none", status = "unchanged" }
rationale = "Dispatch response, target control audit, and caller request preserve one correlation and matching audit identity."

[[behavior]]
partition = { equals = "SUCCESS_AND_FAILURE_AUDIT_TRUTH" }
case_family = "hardware_or_network_fault"
oracle_ref = "SPEC_RUNTIME_ENGINE_001#runtime-cloud-state-dispatch-and-rollout-contract"
outcome = "not_safe_reported"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "expected_delta", process_image = "unchanged", diagnostics = "stable_error", status = "status_degraded" }
rationale = "Successful and failed remote configuration operations retain their matching audit identity, boolean result, and underlying error truth."

[[coverage.cells]]
dimension = "hardware_or_network_fault"
state = "covered"
rationale = "Accepted catalog mappings bind reviewed assertions to every hardware_or_network_fault behavior in RT_RUNTIME_CLOUD_DISPATCH_001; dynamic proof and broad remote validation remain explicit debt."

[[coverage.cells]]
dimension = "concurrency_or_cancellation"
state = "covered"
