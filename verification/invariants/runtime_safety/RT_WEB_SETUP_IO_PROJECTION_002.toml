schema_version = 1
id = "RT_WEB_SETUP_IO_PROJECTION_002"
title = "Runtime web setup preserves bundle, I/O, source, and HMI asset boundaries"
area = "runtime_safety"
risk = "data_loss"
status = "specified"
owner = "trust-runtime"
last_reviewed = "2026-08-01"
claim = "Web setup selects one bundle root, converts and validates ordered I/O configuration without silent narrowing, mutates only the selected project or system-I/O boundary, and confines source and HMI asset reads to their declared roots."
proof_level = "S0"
contract_kind = "state_machine"
source_refs = ["docs/specs/11-runtime-engine.md", "crates/trust-runtime/src/web/setup_support/contract_tests.rs"]
tests = []
gates = ["veryquick", "pr"]
evidence_refs = []
spec_gap_refs = []
missing = ["catalog_mapping", "focused_execution_evidence", "assertion_reachability", "mutation_sensitivity", "rendered_setup_smoke", "broad_remote_gate"]

[spec]
status = "specified"
source_refs = ["SPEC_RUNTIME_ENGINE_001"]

[oracle]
kind = "trust_contract"
ref = "SPEC_RUNTIME_ENGINE_001#runtime-web-setup-and-io-projection-contract"

[[behavior]]
partition = { equals = "EXPLICIT_BUNDLE_ROOT_AND_DEFAULT_RESOURCE" }
case_family = "platform_or_filesystem_variation"
oracle_ref = "SPEC_RUNTIME_ENGINE_001#runtime-web-setup-and-io-projection-contract"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "none", status = "unchanged" }
rationale = "An explicit bundle root is preserved; default resource identity uses the final path component with punctuation sanitized and falls back to trust-plc only when no component exists."

[[behavior]]
partition = { equals = "ORDERED_DRIVER_FORM_PRECEDENCE" }
case_family = "ordering_or_lifecycle"
oracle_ref = "SPEC_RUNTIME_ENGINE_001#runtime-web-setup-and-io-projection-contract"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "not_applicable", process_image = "expected_delta", diagnostics = "stable_error", status = "unchanged" }
rationale = "A present driver list takes precedence over legacy driver, must remain nonempty, trims nonempty names, defaults omitted parameters to an empty table, and enables every entry in order."

[[behavior]]
partition = { equals = "RECURSIVE_JSON_TO_TOML_PARAMETER_SHAPE" }
case_family = "wrong_type_or_shape"
oracle_ref = "SPEC_RUNTIME_ENGINE_001#runtime-web-setup-and-io-projection-contract"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "stable_error", status = "unchanged" }
rationale = "Supported scalars, arrays, and nested objects retain their shapes recursively, while top-level or legacy non-object parameters reject instead of being wrapped or discarded."

[[behavior]]
partition = { equals = "ORDERED_IO_AND_SAFE_STATE_PROJECTION" }
case_family = "happy_path"
oracle_ref = "SPEC_RUNTIME_ENGINE_001#runtime-web-setup-and-io-projection-contract"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "not_applicable", process_image = "expected_delta", diagnostics = "none", status = "unchanged" }
rationale = "Rendered and response I/O preserve driver, parameter, and safe-state order; the first driver supplies the legacy projection; addresses, areas, sizes, bit indices, wildcards, Boolean, integer, and bit-string values retain exact width semantics."

[[behavior]]
partition = { equals = "PROJECT_IO_PRECEDENCE_AND_VALIDATED_SAVE" }
case_family = "persistence_or_recovery"
oracle_ref = "SPEC_RUNTIME_ENGINE_001#runtime-web-setup-and-io-projection-contract"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "not_applicable", process_image = "expected_delta", diagnostics = "stable_error", status = "unchanged" }
rationale = "Existing project I/O takes precedence in load responses and a project save validates the complete rendered configuration before replacement."

[[behavior]]
partition = { equals = "PROJECT_OR_SYSTEM_IO_MUTATION_BOUNDARY" }
case_family = "ordering_or_lifecycle"
oracle_ref = "SPEC_RUNTIME_ENGINE_001#runtime-web-setup-and-io-projection-contract"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "not_applicable", process_image = "expected_delta", diagnostics = "none", status = "unchanged" }
rationale = "Selecting system I/O removes only project io.toml; project setup writes validated runtime and I/O without system mutation; system setup runs only when explicitly selected."

[[behavior]]
partition = { equals = "SORTED_DIRECT_SOURCE_LIST_AND_CONFINED_READ" }
case_family = "platform_or_filesystem_variation"
oracle_ref = "SPEC_RUNTIME_ENGINE_001#runtime-web-setup-and-io-projection-contract"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "stable_error", status = "unchanged" }
rationale = "A missing source directory lists empty; direct regular .st files list case-insensitively in sorted order; reads admit contained nested files and reject traversal or symbolic escape."

[[behavior]]
partition = { equals = "CONFINED_LOWERCASE_SVG_HMI_ASSET" }
case_family = "platform_or_filesystem_variation"
oracle_ref = "SPEC_RUNTIME_ENGINE_001#runtime-web-setup-and-io-projection-contract"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "stable_error", status = "unchanged" }
rationale = "HMI asset reads remain below hmi, admit only a regular lowercase .svg file, and reject parent traversal or symbolic escape."

[[coverage.cells]]
dimension = "platform_or_filesystem_variation"
state = "gap_open"
rationale = "Focused bundle, source, HMI asset, traversal, and symlink tests exist, but catalog binding, cross-platform proof, and dynamic proof are pending."
[[coverage.cells]]
