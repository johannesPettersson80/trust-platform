schema_version = 1
id = "RT_HARNESS_TRANSPORT_PROTOCOL_001"
title = "Harness transport preserves request isolation and protocol compatibility"
area = "runtime_safety"
risk = "compatibility"
status = "mapped"
owner = "trust-runtime"
last_reviewed = "2026-07-22"
claim = "Every non-empty JSON-line request produces one versioned response, failures remain isolated to their request, and protocol v1 and v2 retain their documented watch-value behavior."
proof_level = "T1"
contract_kind = "protocol_trace"
source_refs = ["crates/trust-runtime/src/bin/trust-harness.rs"]
tests = ["TEST_RUNTIME_HARNESS_PROTOCOL_SELECTION_001", "TEST_RUNTIME_HARNESS_LINE_ISOLATION_001", "TEST_RUNTIME_HARNESS_V1_WATCH_FAILURE_001", "TEST_RUNTIME_HARNESS_V1_WATCH_SHAPE_001", "TEST_RUNTIME_HARNESS_ERROR_CLASSIFICATION_001"]
gates = ["pr"]
evidence_refs = []
spec_gap_refs = []
missing = ["assertion_reachability", "mutation_sensitivity", "broad_remote_gate"]

[spec]
status = "specified"
source_refs = ["SPEC_RUNTIME_SEMANTICS_001"]

[oracle]
kind = "trust_contract"
ref = "SPEC_RUNTIME_SEMANTICS_001#11-2-harness-automation-json-line-contract"

[[behavior]]
partition = { equals = "REQUEST_LINE_SUCCESS_OR_FAILURE" }
case_family = "happy_path"
oracle_ref = "SPEC_RUNTIME_SEMANTICS_001#11-2-harness-automation-json-line-contract"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "unchanged", process_image = "unchanged", diagnostics = "none", status = "not_applicable" }
rationale = "Each non-empty input line produces exactly one response carrying the selected protocol version without terminating the session after a malformed or failed request."

[[behavior]]
partition = { equals = "PROTOCOL_V1_WATCH_COMPATIBILITY" }
case_family = "happy_path"
oracle_ref = "SPEC_RUNTIME_SEMANTICS_001#11-2-harness-automation-json-line-contract"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "unchanged", process_image = "unchanged", diagnostics = "none", status = "not_applicable" }
rationale = "Protocol v1 retains its legacy value map and promotes unrepresentable per-watch failures to request errors; protocol v2 keeps per-entry results."

[[behavior]]
partition = { equals = "STABLE_ERROR_VOCABULARY" }
case_family = "wrong_type_or_shape"
oracle_ref = "SPEC_RUNTIME_SEMANTICS_001#11-2-harness-automation-json-line-contract"
outcome = "reject"
no_partial_apply = true
delta = { target = "unchanged", siblings = "unchanged", retain = "unchanged", process_image = "unchanged", diagnostics = "stable_error", status = "not_applicable" }
rationale = "Structural, semantic, runtime, boundary, and unresolved-name failures retain distinct documented error kinds."

[[coverage.cells]]
dimension = "happy_path"
state = "covered"
rationale = "Focused CLI integration tests cover protocol selection, successful versioned responses, and both watch encodings."

[[coverage.cells]]
dimension = "wrong_type_or_shape"
state = "covered"
rationale = "Focused CLI integration tests cover malformed lines, invalid protocol selection, stable error classification, and continued session use."
