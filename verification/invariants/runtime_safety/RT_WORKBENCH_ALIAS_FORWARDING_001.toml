schema_version = 1
id = "RT_WORKBENCH_ALIAS_FORWARDING_001"
title = "Deprecated runtime workbench aliases preserve the trust-dev contract"
area = "runtime_safety"
risk = "false_status"
status = "mapped"
owner = "trust-runtime"
last_reviewed = "2026-07-22"
claim = "The deprecated runtime test, docs, commit, and agent aliases warn with the accepted removal window, preserve every trust-dev argument and stream, select the child executable safely, and propagate launch, exit, and Unix signal outcomes without false success."
proof_level = "T1"
contract_kind = "protocol_trace"
source_refs = [
  "crates/trust-runtime/src/bin/trust-runtime/agent.rs",
  "crates/trust-runtime/src/bin/trust-runtime/commit.rs",
  "crates/trust-runtime/src/bin/trust-runtime/dev_forward.rs",
  "crates/trust-runtime/src/bin/trust-runtime/docs.rs",
  "crates/trust-runtime/src/bin/trust-runtime/test.rs",
]
tests = [
  "TEST_RUNTIME_ALIAS_TEST_FORWARD_001",
  "TEST_RUNTIME_ALIAS_TEST_OUTPUT_VALUES_001",
  "TEST_RUNTIME_ALIAS_DOCS_FORWARD_001",
  "TEST_RUNTIME_ALIAS_DOCS_FORMAT_VALUES_001",
  "TEST_RUNTIME_ALIAS_AGENT_FORWARD_001",
  "TEST_RUNTIME_ALIAS_COMMIT_FORWARD_001",
  "TEST_RUNTIME_ALIAS_SIBLING_FALLBACK_001",
  "TEST_RUNTIME_ALIAS_SIGNAL_STATUS_001",
  "TEST_RUNTIME_ALIAS_EXIT_STATUS_001",
  "TEST_RUNTIME_ALIAS_LAUNCH_ERROR_001",
]
gates = ["pr"]
evidence_refs = []
spec_gap_refs = []
missing = ["assertion_reachability", "mutation_sensitivity", "windows_child_status_evidence", "broad_remote_gate"]

[spec]
status = "specified"
source_refs = ["SPEC_DEVELOPER_WORKFLOWS_001"]

[oracle]
kind = "trust_contract"
ref = "SPEC_DEVELOPER_WORKFLOWS_001#deprecated-runtime-workbench-aliases"

[[behavior]]
partition = { equals = "TEST_DOCS_COMMIT_OR_AGENT_ALIAS" }
case_family = "happy_path"
oracle_ref = "SPEC_DEVELOPER_WORKFLOWS_001#deprecated-runtime-workbench-aliases"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "unchanged", process_image = "unchanged", diagnostics = "expected_diagnostic", status = "not_applicable" }
rationale = "Each alias preserves its command, paths, flags, values, output choices, streams, warning, and successful trust-dev result."

[[behavior]]
partition = { equals = "EXPLICIT_SIBLING_OR_PATH_CHILD_SELECTION" }
case_family = "platform_or_filesystem_variation"
oracle_ref = "SPEC_DEVELOPER_WORKFLOWS_001#deprecated-runtime-workbench-aliases"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "unchanged", process_image = "unchanged", diagnostics = "expected_diagnostic", status = "not_applicable" }
rationale = "Explicit override wins, an executable sibling is eligible, and an unusable sibling does not shadow the PATH child."

[[behavior]]
partition = { equals = "CHILD_NONZERO_SIGNAL_OR_LAUNCH_FAILURE" }
case_family = "ordering_or_lifecycle"
oracle_ref = "SPEC_DEVELOPER_WORKFLOWS_001#deprecated-runtime-workbench-aliases"
outcome = "reject"
no_partial_apply = true
delta = { target = "unchanged", siblings = "unchanged", retain = "unchanged", process_image = "unchanged", diagnostics = "stable_error", status = "not_safe_reported" }
rationale = "Normal child status is exact, Unix signals map to 128 plus signal, and launch errors retain installation guidance."

[[coverage.cells]]
dimension = "happy_path"
state = "covered"
rationale = "Focused integration tests execute every compatibility alias through the real trust-dev binary."

[[coverage.cells]]
dimension = "platform_or_filesystem_variation"
state = "covered"
rationale = "Focused Linux tests prove unusable-sibling fallback and direct format-value mappings."

[[coverage.cells]]
dimension = "ordering_or_lifecycle"
state = "covered"
rationale = "Focused tests prove launch failure plus normal non-zero and Unix signal exit mapping; Windows status authority remains explicit debt."
