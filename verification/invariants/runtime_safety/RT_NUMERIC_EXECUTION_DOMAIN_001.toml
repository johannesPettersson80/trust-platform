source_refs = ["SPEC_RUNTIME_SEMANTICS_001"]

[oracle]
kind = "trust_contract"
ref = "SPEC_RUNTIME_SEMANTICS_001#2-3-declared-type-materialization"

[[behavior]]
partition = { equals = "UNSIGNED_EXECUTION_DOMAIN_NORMALIZATION" }
case_family = "boundary_low"
oracle_ref = "SPEC_RUNTIME_SEMANTICS_001#2-3-declared-type-materialization"
outcome = "reject"
no_partial_apply = true
delta = { target = "unchanged", siblings = "unchanged", retain = "unchanged", process_image = "unchanged", diagnostics = "stable_error", status = "unchanged" }
rationale = "Every unsigned runtime tag and every non-negative signed tag preserves its exact u64 value, while a negative signed value or non-numeric tag returns RuntimeError::TypeMismatch."

[[behavior]]
partition = { equals = "FLOAT_EXECUTION_DOMAIN_NORMALIZATION" }
case_family = "happy_path"
oracle_ref = "SPEC_RUNTIME_SEMANTICS_001#2-3-declared-type-materialization"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "unchanged", process_image = "unchanged", diagnostics = "none", status = "unchanged" }
rationale = "Each of the ten signed, unsigned, REAL, and LREAL runtime tags converts to its documented f64 execution value without accepting bit strings or other non-numeric tags."

[[behavior]]
partition = { equals = "NON_NUMERIC_EXECUTION_DOMAIN_REJECTION" }
case_family = "wrong_type_or_shape"
oracle_ref = "SPEC_RUNTIME_SEMANTICS_001#2-3-declared-type-materialization"
outcome = "reject"
no_partial_apply = true
delta = { target = "unchanged", siblings = "unchanged", retain = "unchanged", process_image = "unchanged", diagnostics = "stable_error", status = "unchanged" }
rationale = "BOOL, bit-string, string, reference, and NULL values are not silently reinterpreted as signed, unsigned, or floating numeric execution values."

