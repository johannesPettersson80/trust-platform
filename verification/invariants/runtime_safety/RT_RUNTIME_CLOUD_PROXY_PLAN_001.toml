schema_version = 1
id = "RT_RUNTIME_CLOUD_PROXY_PLAN_001"
title = "Runtime Cloud proxy planners emit only valid correlated action requests"
area = "runtime_safety"
risk = "security"
status = "mapped"
owner = "trust-runtime"
last_reviewed = "2026-07-22"
claim = "Runtime Cloud control and I/O proxy planners reject malformed request identity, routing, and API-version inputs before preflight or side effects, and preserve one correlation ID across control action and payload boundaries."
proof_level = "T1"
contract_kind = "decision_table"
source_refs = [
  "crates/trust-runtime/src/runtime_cloud/control_proxy_policy.rs",
  "crates/trust-runtime/src/runtime_cloud/io_proxy_policy.rs",
]
tests = [
  "TEST_CONTROL_PROXY_POLICY_PROXY_PLAN_REJECTS_BLANK_CONNECTED_VIA_001",
  "TEST_CONTROL_PROXY_POLICY_PROXY_PLAN_REJECTS_BLANK_REQUEST_ID_WHEN_SUPPLIED_001",
  "TEST_CONTROL_PROXY_POLICY_PROXY_PLAN_REJECTS_BREAKING_API_VERSION_001",
  "TEST_CONTROL_PROXY_POLICY_PROXY_PLAN_USES_CFG_APPLY_FOR_CONFIG_SET_001",
  "TEST_CONTROL_PROXY_POLICY_PROXY_PLAN_USES_GENERATED_REQUEST_ID_WHEN_MISSING_001",
  "TEST_CONTROL_PROXY_POLICY_PROXY_PLAN_USES_STATUS_READ_FOR_VIEWER_CONTROL_REQUEST_001",
  "TEST_CONTROL_PROXY_POLICY_PROXY_ROLE_DENIAL_USES_CFG_WRITE_CODE_FOR_CONFIG_SET_001",
  "TEST_IO_PROXY_POLICY_PROXY_PLAN_REJECTS_BLANK_CONNECTED_VIA_001",
  "TEST_IO_PROXY_POLICY_PROXY_PLAN_REJECTS_INVALID_API_VERSIONS_001",
  "TEST_IO_PROXY_POLICY_READ_PLAN_USES_LEGACY_TARGET_ERROR_TEXT_001",
  "TEST_IO_PROXY_POLICY_READ_PLAN_USES_STATUS_READ_ACTION_001",
  "TEST_IO_PROXY_POLICY_WRITE_PLAN_REJECTS_EMPTY_ACTOR_001",
  "TEST_IO_PROXY_POLICY_WRITE_PLAN_USES_CFG_APPLY_ACTION_001",
  "TEST_IO_PROXY_POLICY_WRITE_PLAN_VALIDATES_TARGET_BEFORE_ACTOR_001",
  "TEST_RUNTIME_CLOUD_PROXY_PLANNERS_REJECT_MALFORMED_REQUESTS_AS_BAD_REQUESTS_001",
]
gates = ["pr"]
evidence_refs = []
spec_gap_refs = []
missing = ["assertion_reachability", "mutation_sensitivity", "broad_remote_gate"]

[spec]
status = "specified"
source_refs = ["SPEC_RUNTIME_ENGINE_001"]

[oracle]
kind = "trust_contract"
ref = "SPEC_RUNTIME_ENGINE_001#runtime-cloud-action-preflight-and-profile-contract"

[[behavior]]
partition = { equals = "VALID_PROXY_REQUEST" }
case_family = "happy_path"
oracle_ref = "SPEC_RUNTIME_ENGINE_001#runtime-cloud-action-preflight-and-profile-contract"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "unchanged", process_image = "unchanged", diagnostics = "none", status = "not_applicable" }
rationale = "A valid proxy request produces one correlated action request and, for control proxy requests, one forwarded control payload."

[[behavior]]
partition = { equals = "BLANK_IDENTITY_OR_ROUTING_FIELD" }
case_family = "wrong_type_or_shape"
oracle_ref = "SPEC_RUNTIME_ENGINE_001#runtime-cloud-action-preflight-and-profile-contract"
outcome = "reject"
no_partial_apply = true
delta = { target = "unchanged", siblings = "unchanged", retain = "unchanged", process_image = "unchanged", diagnostics = "stable_error", status = "not_safe_reported" }
rationale = "A proxy planner cannot emit an action that already violates the common action identity and routing contract."

[[behavior]]
partition = { equals = "MALFORMED_OR_BREAKING_API_VERSION" }
case_family = "wrong_type_or_shape"
oracle_ref = "SPEC_RUNTIME_ENGINE_001#runtime-cloud-action-preflight-and-profile-contract"
outcome = "reject"
no_partial_apply = true
delta = { target = "unchanged", siblings = "unchanged", retain = "unchanged", process_image = "unchanged", diagnostics = "stable_error", status = "not_safe_reported" }
rationale = "Both proxy planners reject incompatible API versions before preflight or dispatch."

[[coverage.cells]]
dimension = "happy_path"
state = "covered"
rationale = "Focused control and I/O planner tests cover read, write, command, role, payload, and correlation mappings."

[[coverage.cells]]
dimension = "wrong_type_or_shape"
state = "covered"
rationale = "Focused unit and HTTP tests cover blank identity and routing values plus malformed and breaking API versions."
