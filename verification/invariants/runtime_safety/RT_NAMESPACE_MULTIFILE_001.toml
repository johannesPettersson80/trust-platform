[oracle]
kind = "trust_contract"
ref = "SPEC_RUNTIME_ENGINE_001#namespace-qualified-multifile-runtime-assembly"

[[behavior]]
partition = { equals = "USING_IMPORTED_FUNCTION_EXECUTES_ACROSS_SOURCES" }
case_family = "happy_path"
oracle_ref = "SPEC_RUNTIME_ENGINE_001#namespace-qualified-multifile-runtime-assembly"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "none", status = "unchanged" }
rationale = "A direct namespace function imported by USING remains callable from a program supplied in a separate source unit and produces the reviewed value."

[[behavior]]
partition = { equals = "NAMESPACED_PROGRAM_REGISTERED_AND_EXECUTED" }
case_family = "happy_path"
oracle_ref = "SPEC_RUNTIME_ENGINE_001#namespace-qualified-multifile-runtime-assembly"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "none", status = "unchanged" }
rationale = "A namespaced program retains its fully qualified registry identity and remains an executable scan entry point."

[[behavior]]
partition = { equals = "NAMESPACED_SIBLING_POU_GRAPH_REGISTERED_AND_EXECUTED" }
case_family = "happy_path"
oracle_ref = "SPEC_RUNTIME_ENGINE_001#namespace-qualified-multifile-runtime-assembly"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "none", status = "unchanged" }
rationale = "Sibling functions, function blocks, classes, and interfaces retain qualified identities, resolve within one namespace, and execute the reviewed call and interface-assignment graph."

[[behavior]]
partition = { malformed = "CASE_INSENSITIVE_DUPLICATE_PROGRAM_IDENTITY" }
coverage_dimension = "duplicate_or_collision"
oracle_ref = "SPEC_RUNTIME_ENGINE_001#namespace-qualified-multifile-runtime-assembly"
outcome = "reject"
no_partial_apply = true
delta = { target = "unchanged", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "expected_diagnostic", status = "unchanged" }
rationale = "Program identities differing only by ASCII case reject merged assembly and report the duplicate condition plus the reviewed original spelling."

[[coverage.cells]]
dimension = "happy_path"
state = "gap_open"
rationale = "The product and IEC authority is reviewed; focused mappings and execution evidence for the three accepted namespace paths remain pending."

[[coverage.cells]]
dimension = "duplicate_or_collision"
