schema_version = 1
id = "DEV_AGENT_HARNESS_TRANSACTION_002"
title = "Agent harness requests produce ordered isolated fixture results"
area = "plcopen_devtools"
risk = "wrong_result"
status = "mapped"
owner = "trust-dev"
last_reviewed = "2026-08-01"
claim = "Agent harness source selection, validation, execution, assertion accounting, failure projection, session isolation, and timeout reporting preserve the reviewed request order and typed evidence without converting fixture failures into protocol success or shared-state mutation."
proof_level = "S0"
contract_kind = "state_machine"
source_refs = [
  "docs/specs/20-agent-api-v1.md",
  "docs/guides/AGENT_CONTRACT_V1.md",
  "crates/trust-dev/src/agent/harness.rs",
  "crates/trust-dev/src/agent/contract_tests.rs",
  "crates/trust-dev/src/agent/harness_contract_tests.rs",
]
tests = ["TEST_AUTO_D3004610DE24F6D3AFD1"]
gates = ["veryquick", "pr"]
evidence_refs = []
spec_gap_refs = []
missing = ["focused_execution_evidence", "assertion_reachability", "mutation_sensitivity", "broad_remote_gate"]

[spec]
status = "specified"
source_refs = ["SPEC_AGENT_API_V1_001"]

[oracle]
kind = "trust_contract"
ref = "SPEC_AGENT_API_V1_001#6-harness-request-and-result-transaction-authority"

[[behavior]]
partition = { equals = "SOURCE_SELECTOR_EXCLUSIVITY_AND_ORDER" }
case_family = "missing_required"
oracle_ref = "SPEC_AGENT_API_V1_001#6-harness-request-and-result-transaction-authority"
outcome = "reject"
no_partial_apply = true
delta = { target = "unchanged", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "stable_error", status = "unchanged" }
rationale = "Empty, multiple, blank-inline, or normalized-duplicate selectors are invalid params, while one explicit file list retains caller order."

[[behavior]]
partition = { equals = "STEP_AND_TYPED_VALUE_PREFLIGHT" }
case_family = "wrong_type_or_shape"
oracle_ref = "SPEC_AGENT_API_V1_001#6-harness-request-and-result-transaction-authority"
outcome = "reject"
no_partial_apply = true
delta = { target = "unchanged", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "stable_error", status = "unchanged" }
rationale = "Unknown step or assertion discriminators, malformed typed values, invalid times or bounds, and unsupported restart modes return -32602 before later execution."

[[behavior]]
partition = { equals = "CYCLE_AND_RESTART_BOUNDARIES" }
case_family = "boundary_low"
oracle_ref = "SPEC_AGENT_API_V1_001#6-harness-request-and-result-transaction-authority"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "expected_delta", process_image = "expected_delta", diagnostics = "none", status = "unchanged" }
rationale = "Cycle count defaults to one while explicit zero is preserved by request decoding, and only case-insensitive cold or warm restart modes are accepted."

[[behavior]]
partition = { equals = "SUCCESS_RESULT_SHAPE_AND_ACCOUNTING" }
case_family = "happy_path"
oracle_ref = "SPEC_AGENT_API_V1_001#6-harness-request-and-result-transaction-authority"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "not_applicable", process_image = "expected_delta", diagnostics = "none", status = "unchanged" }
rationale = "An empty watch snapshot has the stable camel-case shape, successful results omit failures, and evaluated equals passed plus failed without exceeding total."

[[behavior]]
partition = { equals = "ASSERTION_MISMATCH_ORDER_AND_TYPED_EVIDENCE" }
case_family = "ordering_or_lifecycle"
oracle_ref = "SPEC_AGENT_API_V1_001#6-harness-request-and-result-transaction-authority"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "expected_delta", retain = "not_applicable", process_image = "unchanged", diagnostics = "expected_diagnostic", status = "expected_delta" }
rationale = "Mismatches count as evaluated failures with typed expected and actual values, and later independent assertions still execute in stable order."

[[behavior]]
partition = { equals = "COMPILE_RUNTIME_STEP_AND_BOUNDARY_FAILURES" }
case_family = "ordering_or_lifecycle"
oracle_ref = "SPEC_AGENT_API_V1_001#6-harness-request-and-result-transaction-authority"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "not_applicable", process_image = "expected_delta", diagnostics = "expected_diagnostic", status = "expected_delta" }
rationale = "Compile failure returns zero steps, runtime or step failure does not inflate assertion counts, and boundary errors remain structured fixture failures with stable step and failure order."

[[behavior]]
partition = { equals = "RUN_UNTIL_TIMEOUT_EVIDENCE" }
case_family = "time_or_clock_fault"
oracle_ref = "SPEC_AGENT_API_V1_001#6-harness-request-and-result-transaction-authority"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "not_applicable", process_image = "expected_delta", diagnostics = "stable_error", status = "expected_delta" }
rationale = "Execute timeout is an ordered fixture step failure with last actual value, while the stateful run_until method uses -32004 and preserves name, budget, and typed expected value."

[[behavior]]
partition = { equals = "EXECUTE_FRESH_SESSION_ISOLATION" }
case_family = "persistence_or_recovery"
oracle_ref = "SPEC_AGENT_API_V1_001#6-harness-request-and-result-transaction-authority"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "unchanged", process_image = "unchanged", diagnostics = "none", status = "unchanged" }
rationale = "Every execute request starts fresh and neither consumes nor mutates the separately loaded stateful harness session."

[[behavior]]
partition = { equals = "STATEFUL_NOT_LOADED_ERROR" }
case_family = "missing_required"
oracle_ref = "SPEC_AGENT_API_V1_001#6-harness-request-and-result-transaction-authority"
outcome = "reject"
no_partial_apply = true
delta = { target = "unchanged", siblings = "unchanged", retain = "unchanged", process_image = "unchanged", diagnostics = "stable_error", status = "unchanged" }
rationale = "Stateful methods before load use -32003 without data and cannot fabricate an empty harness result."

[[behavior]]
partition = { equals = "DISPATCH_ERROR_CLASS_PRESERVATION" }
case_family = "extra_or_unknown"
oracle_ref = "SPEC_AGENT_API_V1_001#6-harness-request-and-result-transaction-authority"
outcome = "reject"
no_partial_apply = true
delta = { target = "unchanged", siblings = "unchanged", retain = "unchanged", process_image = "unchanged", diagnostics = "stable_error", status = "unchanged" }
rationale = "Invalid harness arguments remain -32602, not-loaded remains -32003, runtime cycle errors preserve structured errors, and timeout remains -32004."

