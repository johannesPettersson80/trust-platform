schema_version = 1
id = "DEV_AGENT_JSONRPC_ENVELOPE_002"
title = "Agent JSON-RPC envelopes preserve correlation and failure class"
area = "plcopen_devtools"
risk = "compatibility"
status = "mapped"
owner = "trust-dev"
last_reviewed = "2026-08-01"
claim = "The Agent API v1 parser, envelope validator, dispatcher, method inventory, and error projection preserve the reviewed JSON-RPC request identity and distinguish parse, envelope, method, and parameter failures without ambiguous response members."
proof_level = "S0"
contract_kind = "protocol_trace"
source_refs = [
  "docs/specs/20-agent-api-v1.md",
  "docs/guides/AGENT_CONTRACT_V1.md",
  "crates/trust-dev/src/agent.rs",
  "crates/trust-dev/src/agent/contract_tests.rs",
]
tests = ["TEST_AUTO_E6A30CE520FFBCDD7A6E"]
gates = ["veryquick", "pr"]
evidence_refs = []
spec_gap_refs = []
missing = ["focused_execution_evidence", "assertion_reachability", "mutation_sensitivity", "broad_remote_gate"]

[spec]
status = "specified"
source_refs = ["SPEC_AGENT_API_V1_001"]

[oracle]
kind = "trust_contract"
ref = "SPEC_AGENT_API_V1_001#4-json-rpc-envelope-and-dispatch-authority"

[[behavior]]
partition = { equals = "MALFORMED_JSON_PARSE_ERROR" }
case_family = "wrong_type_or_shape"
oracle_ref = "SPEC_AGENT_API_V1_001#4-json-rpc-envelope-and-dispatch-authority"
outcome = "reject"
no_partial_apply = true
delta = { target = "unchanged", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "stable_error", status = "unchanged" }
rationale = "Malformed JSON produces -32700 with null ID and exactly one error member rather than an envelope or method failure."

[[behavior]]
partition = { equals = "INVALID_REQUEST_ENVELOPE" }
case_family = "missing_required"
oracle_ref = "SPEC_AGENT_API_V1_001#4-json-rpc-envelope-and-dispatch-authority"
outcome = "reject"
no_partial_apply = true
delta = { target = "unchanged", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "stable_error", status = "unchanged" }
rationale = "A non-object, missing or unsupported jsonrpc member, absent or empty method, or notification is -32600 and cannot be reclassified as a parse error."

[[behavior]]
partition = { equals = "REQUEST_ID_SHAPE_AND_CORRELATION" }
case_family = "boundary_low"
oracle_ref = "SPEC_AGENT_API_V1_001#4-json-rpc-envelope-and-dispatch-authority"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "none", status = "unchanged" }
rationale = "String and numeric IDs are preserved exactly, a valid ID survives later envelope or dispatch errors, and null, Boolean, object, or array IDs reject with null response ID."

[[behavior]]
partition = { equals = "PARAMS_ENVELOPE_BOUNDARY" }
case_family = "wrong_type_or_shape"
oracle_ref = "SPEC_AGENT_API_V1_001#4-json-rpc-envelope-and-dispatch-authority"
outcome = "reject"
no_partial_apply = true
delta = { target = "unchanged", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "stable_error", status = "unchanged" }
rationale = "Scalar params reject at the request-envelope boundary, while missing or wrongly shaped required method params use correlated -32602 invalid-params responses."

[[behavior]]
partition = { equals = "UNKNOWN_TOP_LEVEL_MEMBER_INTEROPERABILITY" }
case_family = "extra_or_unknown"
oracle_ref = "SPEC_AGENT_API_V1_001#4-json-rpc-envelope-and-dispatch-authority"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "unchanged", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "none", status = "unchanged" }
rationale = "Unknown top-level members do not alter validation, correlation, or dispatch of an otherwise valid request."

[[behavior]]
partition = { equals = "UNKNOWN_METHOD_FAILURE" }
case_family = "extra_or_unknown"
oracle_ref = "SPEC_AGENT_API_V1_001#4-json-rpc-envelope-and-dispatch-authority"
outcome = "reject"
no_partial_apply = true
delta = { target = "unchanged", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "stable_error", status = "unchanged" }
rationale = "An unknown method retains its valid request ID and returns the stable -32601 method-not-found error."

[[behavior]]
partition = { equals = "AUTHORITATIVE_METHOD_INVENTORY" }
case_family = "ordering_or_lifecycle"
oracle_ref = "SPEC_AGENT_API_V1_001#4-json-rpc-envelope-and-dispatch-authority"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "none", status = "unchanged" }
rationale = "agent.describe returns stdio/jsonl transport identity and a complete duplicate-free method list whose members each have a dispatch route."

