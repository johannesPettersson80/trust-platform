schema_version = 1
id = "PLCO_TRANSACTIONAL_ARTIFACTS_002"
title = "PLCopen import and export publish one recoverable artifact transaction"
area = "plcopen_devtools"
risk = "data_loss"
status = "mapped"
owner = "trust-plcopen"
last_reviewed = "2026-08-01"
claim = "PLCopen import and export keep generated paths portable and contained, discover source deterministically, reject symbolic-link traversal, and either publish a complete coherent artifact set or restore the exact pre-call filesystem state, except for the specified report-only no-content result."
proof_level = "S0"
contract_kind = "state_machine"
source_refs = [
  "docs/guides/PLCOPEN_INTEROP_COMPATIBILITY.md",
  "crates/trust-plcopen/src/plcopen/import.rs",
  "crates/trust-plcopen/src/plcopen/export.rs",
  "crates/trust-plcopen/src/plcopen/source_parse.rs",
  "crates/trust-plcopen/src/plcopen/pou_externals.rs",
  "crates/trust-plcopen/src/plcopen/xml_common.rs",
  "crates/trust-plcopen/src/plcopen/tests/transaction_contract.rs",
]
tests = ["TEST_AUTO_31507F5CF7F569FCA8D7"]
gates = ["veryquick", "pr"]
evidence_refs = []
spec_gap_refs = []
missing = ["focused_execution_evidence", "assertion_reachability", "mutation_sensitivity", "cross_platform_execution", "broad_remote_gate"]

[spec]
status = "specified"
source_refs = ["SPEC_PLCOPEN_IMPORT_DECISION_001"]

[oracle]
kind = "trust_contract"
ref = "SPEC_PLCOPEN_IMPORT_DECISION_001#transactional-filesystem-and-artifact-contract"

[[behavior]]
partition = { equals = "PORTABLE_SINGLE_COMPONENT_SANITIZATION" }
case_family = "platform_or_filesystem_variation"
oracle_ref = "SPEC_PLCOPEN_IMPORT_DECISION_001#transactional-filesystem-and-artifact-contract"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "none", status = "unchanged" }
rationale = "File names and path segments become nonempty single portable components without separators, dot aliases, Windows device aliases, or trailing dot or space."

[[behavior]]
partition = { equals = "CONTAINED_CASE_INSENSITIVE_COLLISION_RESOLUTION" }
case_family = "duplicate_or_collision"
oracle_ref = "SPEC_PLCOPEN_IMPORT_DECISION_001#transactional-filesystem-and-artifact-contract"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "none", status = "unchanged" }
rationale = "Generated nested paths remain beneath src and deterministic ordinal suffixes preserve exact, case-alias, directory, batch, and post-sanitization collisions."

[[behavior]]
partition = { equals = "RECURSIVE_LITERAL_SOURCE_DISCOVERY" }
case_family = "ordering_or_lifecycle"
oracle_ref = "SPEC_PLCOPEN_IMPORT_DECISION_001#transactional-filesystem-and-artifact-contract"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "none", status = "unchanged" }
rationale = "Export recursively discovers every ASCII-case spelling of .st and .pou as literal paths, ignores unrelated files, and returns a stable sorted order."

[[behavior]]
partition = { equals = "SOURCE_DIRECTORY_OR_SYMLINK_REJECTION" }
case_family = "platform_or_filesystem_variation"
oracle_ref = "SPEC_PLCOPEN_IMPORT_DECISION_001#transactional-filesystem-and-artifact-contract"
outcome = "reject"
no_partial_apply = true
delta = { target = "unchanged", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "expected_diagnostic", status = "unchanged" }
rationale = "A source-like directory, source symlink, output symlink, or import-destination symlink is rejected without following or changing the target."

[[behavior]]
partition = { equals = "CDATA_BYTE_PRESERVATION" }
case_family = "encoding_or_unicode"
oracle_ref = "SPEC_PLCOPEN_IMPORT_DECISION_001#transactional-filesystem-and-artifact-contract"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "none", status = "unchanged" }
rationale = "CDATA splitting round-trips source and vendor-hook bytes even when the payload contains the CDATA terminator sequence."

[[behavior]]
partition = { equals = "SOURCE_MAP_COHERENCE_AND_EXPORT_DETERMINISM" }
case_family = "ordering_or_lifecycle"
oracle_ref = "SPEC_PLCOPEN_IMPORT_DECISION_001#transactional-filesystem-and-artifact-contract"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "expected_delta", retain = "not_applicable", process_image = "unchanged", diagnostics = "none", status = "unchanged" }
rationale = "Embedded and sidecar maps agree and bind every POU to a positive line; repeated export is deterministic except for the named generation timestamp."

[[behavior]]
partition = { equals = "EXPORT_PREFLIGHT_REJECTION_BEFORE_MUTATION" }
case_family = "duplicate_or_collision"
oracle_ref = "SPEC_PLCOPEN_IMPORT_DECISION_001#transactional-filesystem-and-artifact-contract"
outcome = "reject"
no_partial_apply = true
delta = { target = "unchanged", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "expected_diagnostic", status = "unchanged" }
rationale = "Case-insensitive duplicate semantic identities and invalid output targets are rejected before any existing output artifact changes."

[[behavior]]
partition = { equals = "EXPORT_ROLLBACK_ON_MEMBER_PUBLICATION_FAILURE" }
case_family = "persistence_or_recovery"
oracle_ref = "SPEC_PLCOPEN_IMPORT_DECISION_001#transactional-filesystem-and-artifact-contract"
outcome = "reject"
no_partial_apply = true
delta = { target = "unchanged", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "expected_diagnostic", status = "unchanged" }
rationale = "Source-map, adapter-report, or Siemens-bundle publication failure restores the exact pre-call output-tree snapshot."

[[behavior]]
partition = { equals = "SUCCESSFUL_EXPORT_COHERENT_ARTIFACT_SET" }
case_family = "happy_path"
oracle_ref = "SPEC_PLCOPEN_IMPORT_DECISION_001#transactional-filesystem-and-artifact-contract"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "expected_delta", retain = "not_applicable", process_image = "unchanged", diagnostics = "none", status = "unchanged" }
rationale = "Generic and adapter exports commit exactly their complete required sets, and the report and adapter metadata bind only committed paths."

[[behavior]]
partition = { equals = "MALFORMED_OR_INVALID_ROOT_IMPORT_NO_MUTATION" }
case_family = "wrong_type_or_shape"
oracle_ref = "SPEC_PLCOPEN_IMPORT_DECISION_001#transactional-filesystem-and-artifact-contract"
outcome = "reject"
no_partial_apply = true
delta = { target = "unchanged", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "expected_diagnostic", status = "unchanged" }
rationale = "Malformed XML and a non-project root leave the complete destination snapshot unchanged."

[[behavior]]
partition = { equals = "NO_IMPORTABLE_CONTENT_REPORT_ONLY_RESULT" }
case_family = "missing_required"
oracle_ref = "SPEC_PLCOPEN_IMPORT_DECISION_001#transactional-filesystem-and-artifact-contract"
outcome = "reject"
no_partial_apply = true
delta = { target = "unchanged", siblings = "expected_delta", retain = "not_applicable", process_image = "unchanged", diagnostics = "expected_diagnostic", status = "unchanged" }
rationale = "A well-formed project with no importable ST writes only its migration report and writes neither source nor preserved-vendor artifact."

[[behavior]]
partition = { equals = "IMPORT_COLLISION_PRESERVATION" }
case_family = "duplicate_or_collision"
oracle_ref = "SPEC_PLCOPEN_IMPORT_DECISION_001#transactional-filesystem-and-artifact-contract"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "none", status = "unchanged" }
rationale = "Exact, case-alias, batch, sanitized, and path-like imported identities use contained deterministic suffixes without overwriting existing entries."

[[behavior]]
partition = { equals = "IMPORT_ROLLBACK_ON_MEMBER_PUBLICATION_FAILURE" }
case_family = "persistence_or_recovery"
oracle_ref = "SPEC_PLCOPEN_IMPORT_DECISION_001#transactional-filesystem-and-artifact-contract"
outcome = "reject"
no_partial_apply = true
delta = { target = "unchanged", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "expected_diagnostic", status = "unchanged" }
rationale = "Migration-report or vendor-extension publication failure restores the exact pre-call project snapshot."

[[behavior]]
partition = { equals = "SUCCESSFUL_IMPORT_COHERENT_ARTIFACT_SET" }
case_family = "happy_path"
oracle_ref = "SPEC_PLCOPEN_IMPORT_DECISION_001#transactional-filesystem-and-artifact-contract"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "expected_delta", retain = "not_applicable", process_image = "unchanged", diagnostics = "none", status = "unchanged" }
rationale = "Successful import atomically publishes the complete source set, optional preserved vendor artifact, and migration report whose paths and counts match the committed state."

