schema_version = 1
id = "PLCO_SEMANTIC_IMPORT_002"
title = "PLCopen semantic import publishes only complete supported ST"
area = "plcopen_devtools"
risk = "silent_corruption"
status = "specified"
owner = "trust-plcopen"
last_reviewed = "2026-08-01"
claim = "Supported PLCopen type, interface, body, function, and CODESYS method semantics map to deterministic ST, while incomplete, duplicate, ambiguous, or invalid semantic units fail closed without shortened source publication."
proof_level = "S0"
contract_kind = "decision_table"
source_refs = [
  "docs/guides/PLCOPEN_INTEROP_COMPATIBILITY.md",
  "crates/trust-plcopen/src/plcopen/type_parser.rs",
  "crates/trust-plcopen/src/plcopen/pou_interface.rs",
  "crates/trust-plcopen/src/plcopen/xml_common.rs",
  "crates/trust-plcopen/src/plcopen/tests/semantic_import_contract.rs",
]
tests = []
gates = ["veryquick", "pr"]
evidence_refs = []
spec_gap_refs = []
missing = ["catalog_mapping", "focused_execution_evidence", "assertion_reachability", "mutation_sensitivity", "broad_remote_gate"]

[spec]
status = "specified"
source_refs = ["SPEC_PLCOPEN_IMPORT_DECISION_001"]

[oracle]
kind = "trust_contract"
ref = "SPEC_PLCOPEN_IMPORT_DECISION_001#semantic-xml-to-st-import-contract"

[[behavior]]
partition = { equals = "POU_KIND_ALIAS_NORMALIZATION" }
case_family = "boundary_low"
oracle_ref = "SPEC_PLCOPEN_IMPORT_DECISION_001#semantic-xml-to-st-import-contract"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "none", status = "unchanged" }
rationale = "Reviewed case and punctuation variants normalize only to program, function, or function block; unknown kinds remain unsupported."

[[behavior]]
partition = { equals = "ELEMENTARY_STRING_AND_DERIVED_TYPES" }
case_family = "boundary_low"
oracle_ref = "SPEC_PLCOPEN_IMPORT_DECISION_001#semantic-xml-to-st-import-contract"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "none", status = "unchanged" }
rationale = "The complete elementary matrix maps to canonical uppercase ST, positive string lengths are retained, unbounded strings stay unbounded, and derived types require a nonblank identity."

[[behavior]]
partition = { equals = "ORDERED_AGGREGATE_TYPE_IMPORT" }
case_family = "ordering_or_lifecycle"
oracle_ref = "SPEC_PLCOPEN_IMPORT_DECISION_001#semantic-xml-to-st-import-contract"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "none", status = "unchanged" }
rationale = "Complete arrays, structures, enumerations, and direct or nested subranges retain every dimension, field, initializer, member value, bound, base type, and source order."

[[behavior]]
partition = { equals = "MALFORMED_TYPE_UNIT_REJECTION" }
case_family = "wrong_type_or_shape"
oracle_ref = "SPEC_PLCOPEN_IMPORT_DECISION_001#semantic-xml-to-st-import-contract"
outcome = "reject"
no_partial_apply = true
delta = { target = "unchanged", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "expected_diagnostic", status = "unchanged" }
rationale = "Invalid string lengths and incomplete, empty, duplicate, or partially malformed aggregate types return no semantic type and cannot publish shortened data-type ST."

[[behavior]]
partition = { equals = "INTERFACE_SECTION_ORDER_AND_INITIAL_VALUES" }
case_family = "ordering_or_lifecycle"
oracle_ref = "SPEC_PLCOPEN_IMPORT_DECISION_001#semantic-xml-to-st-import-contract"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "expected_delta", process_image = "unchanged", diagnostics = "none", status = "unchanged" }
rationale = "All supported variable sections render in the specified stable order and retain declaration order, canonical types, and simple initial values."

[[behavior]]
partition = { equals = "INTERFACE_MODIFIERS_AND_ACCESS_VARIABLES" }
case_family = "happy_path"
oracle_ref = "SPEC_PLCOPEN_IMPORT_DECISION_001#semantic-xml-to-st-import-contract"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "expected_delta", process_image = "unchanged", diagnostics = "none", status = "unchanged" }
rationale = "Constant, retain, and persistent modifiers preserve declared order; access variables render the documented read-only or default read-write direction."

[[behavior]]
partition = { equals = "INTERFACE_ATOMIC_VALIDATION" }
case_family = "wrong_type_or_shape"
oracle_ref = "SPEC_PLCOPEN_IMPORT_DECISION_001#semantic-xml-to-st-import-contract"
outcome = "reject"
no_partial_apply = true
delta = { target = "unchanged", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "expected_diagnostic", status = "unchanged" }
rationale = "Contradictory modifiers, missing required metadata, unsupported types, invalid identifiers, or case-insensitive duplicate declarations reject the POU without partial source."

[[behavior]]
partition = { equals = "CASE_INSENSITIVE_XML_SURFACE" }
case_family = "boundary_low"
oracle_ref = "SPEC_PLCOPEN_IMPORT_DECISION_001#semantic-xml-to-st-import-contract"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "none", status = "unchanged" }
rationale = "Reviewed element and attribute spellings import equivalently under ASCII-case-insensitive comparison."

[[behavior]]
partition = { equals = "BODY_PRESERVATION_AND_SYNTHESIS" }
case_family = "ordering_or_lifecycle"
oracle_ref = "SPEC_PLCOPEN_IMPORT_DECISION_001#semantic-xml-to-st-import-contract"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "expected_diagnostic", status = "unchanged" }
rationale = "A matching complete wrapper is preserved, a statement body is wrapped with PLCO207, and an interface-only POU becomes a declaration shell with PLCO208."

[[behavior]]
partition = { equals = "FUNCTION_RETURN_AND_RESULT_ASSIGNMENT" }
case_family = "boundary_low"
oracle_ref = "SPEC_PLCOPEN_IMPORT_DECISION_001#semantic-xml-to-st-import-contract"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "expected_diagnostic", status = "unchanged" }
rationale = "Functions retain a structured return type or default to INT with PLCO211, and only a real result assignment suppresses the deterministic PLCO212 fallback."

[[behavior]]
partition = { equals = "PROGRAM_INSTANCE_TYPE_PROMOTION" }
case_family = "boundary_low"
oracle_ref = "SPEC_PLCOPEN_IMPORT_DECISION_001#semantic-xml-to-st-import-contract"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "expected_delta", retain = "not_applicable", process_image = "unchanged", diagnostics = "expected_diagnostic", status = "unchanged" }
rationale = "A program referenced as a derived instance type becomes a function block and records PLCO210 for that POU."

[[behavior]]
partition = { equals = "MIXED_EXECUTABLE_REPRESENTATION_REJECTION" }
case_family = "extra_or_unknown"
oracle_ref = "SPEC_PLCOPEN_IMPORT_DECISION_001#semantic-xml-to-st-import-contract"
outcome = "reject"
no_partial_apply = true
delta = { target = "unchanged", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "expected_diagnostic", status = "unchanged" }
rationale = "A POU containing both supported ST and any non-ST executable body is skipped as one ambiguous unit with the named non-ST diagnostic."

[[behavior]]
partition = { equals = "CODESYS_METHOD_IMPORT" }
case_family = "ordering_or_lifecycle"
oracle_ref = "SPEC_PLCOPEN_IMPORT_DECISION_001#semantic-xml-to-st-import-contract"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "expected_diagnostic", status = "unchanged" }
rationale = "Function-block methods preserve header, interface, body, visibility, return, and order; missing headers default with PLCO214, wrong owners skip with PLCO213, and existing case aliases are not duplicated."

