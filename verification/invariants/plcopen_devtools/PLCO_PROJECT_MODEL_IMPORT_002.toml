no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "none", status = "unchanged" }
rationale = "Resources directly under instances are wrapped only in ImportedConfiguration, preserving resource content and order."

[[behavior]]
partition = { equals = "INTERVAL_NORMALIZATION" }
case_family = "boundary_low"
oracle_ref = "SPEC_PLCOPEN_IMPORT_DECISION_001#project-model-import-contract"
