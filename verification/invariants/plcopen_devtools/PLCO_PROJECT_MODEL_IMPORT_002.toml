delta = { target = "set_to_expected", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "none", status = "unchanged" }
rationale = "A periodic task defaults to T#100ms and priority 1 when omitted, while an event task retains event mode without an interval default."

[[behavior]]
