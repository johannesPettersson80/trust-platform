schema_version = 1
id = "PLCO_PROJECT_MODEL_IMPORT_002"
title = "PLCopen project models normalize without redirecting or hiding loss"
area = "plcopen_devtools"
risk = "silent_corruption"
status = "mapped"
owner = "trust-plcopen"
last_reviewed = "2026-08-01"
claim = "Supported PLCopen configurations, resources, tasks, and program instances preserve reviewed hierarchy, order, scheduling, binding, identity, and accounting rules, while ambiguous or invalid models fail closed instead of being silently redirected."
proof_level = "S0"
contract_kind = "decision_table"
source_refs = [
  "docs/guides/PLCOPEN_INTEROP_COMPATIBILITY.md",
  "crates/trust-plcopen/src/plcopen/import_project_model.rs",
  "crates/trust-plcopen/src/plcopen/type_parser.rs",
  "crates/trust-plcopen/src/plcopen/tests/project_model_contract.rs",
]
tests = ["TEST_AUTO_BB61ED066EBFD860C974"]
gates = ["veryquick", "pr"]
evidence_refs = []
spec_gap_refs = []
missing = ["focused_execution_evidence", "assertion_reachability", "mutation_sensitivity", "broad_remote_gate"]

[spec]
status = "specified"
source_refs = ["SPEC_PLCOPEN_IMPORT_DECISION_001"]

[oracle]
kind = "trust_contract"
ref = "SPEC_PLCOPEN_IMPORT_DECISION_001#project-model-import-contract"

[[behavior]]
partition = { equals = "SUPPORTED_HIERARCHIES_AND_ALIAS_FORMS" }
case_family = "happy_path"
oracle_ref = "SPEC_PLCOPEN_IMPORT_DECISION_001#project-model-import-contract"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "none", status = "unchanged" }
rationale = "Nested holders, direct configurations, direct resources, case-insensitive element names, and reviewed alias attributes reconstruct the documented model without losing complete nodes."

[[behavior]]
partition = { equals = "DIRECT_RESOURCE_SYNTHETIC_CONFIGURATION" }
case_family = "boundary_low"
oracle_ref = "SPEC_PLCOPEN_IMPORT_DECISION_001#project-model-import-contract"
