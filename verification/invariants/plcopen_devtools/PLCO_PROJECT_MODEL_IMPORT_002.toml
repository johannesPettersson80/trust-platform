no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "none", status = "unchanged" }
rationale = "Trimmed IEC time literals are preserved and supported nonnegative PT seconds or milliseconds convert exactly to deterministic ST time literals."

[[behavior]]
