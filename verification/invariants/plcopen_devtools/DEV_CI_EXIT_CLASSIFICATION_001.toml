[oracle]
kind = "trust_contract"
ref = "SPEC_DEVELOPER_WORKFLOWS_001#developer-ci-exit-classification"

[[behavior]]
partition = { equals = "ONE_RECOGNIZED_FAILURE_CLASS" }
case_family = "happy_path"
oracle_ref = "SPEC_DEVELOPER_WORKFLOWS_001#developer-ci-exit-classification"
