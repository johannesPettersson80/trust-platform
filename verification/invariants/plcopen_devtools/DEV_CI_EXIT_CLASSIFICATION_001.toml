no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "not_applicable", process_image = "not_applicable", diagnostics = "none", status = "unchanged" }
rationale = "Reviewed representative configuration, build, test, timeout, and internal messages map to public codes 10, 11, 12, 13, and 20."

[[behavior]]
partition = { equals = "MULTIPLE_RECOGNIZED_FAILURE_CLASSES" }
case_family = "ordering_or_lifecycle"
oracle_ref = "SPEC_DEVELOPER_WORKFLOWS_001#developer-ci-exit-classification"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "not_applicable", process_image = "not_applicable", diagnostics = "none", status = "unchanged" }
rationale = "The specification orders timeout before test, build, and configuration recognition, but this trust-dev batch has no direct collision test."

[[behavior]]
partition = { equals = "UNCLASSIFIED_MESSAGE_WITH_OPTIONAL_COMMAND" }
case_family = "extra_or_unknown"
oracle_ref = "SPEC_DEVELOPER_WORKFLOWS_001#developer-ci-exit-classification"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "not_applicable", process_image = "not_applicable", diagnostics = "none", status = "unchanged" }
rationale = "An otherwise internal message maps by build, test, or validate command context."

[[coverage.cells]]
dimension = "happy_path"
state = "gap_open"
rationale = "The reviewed representative one-class mappings await generated catalog mapping."

