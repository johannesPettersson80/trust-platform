[spec]
status = "specified"
source_refs = ["SPEC_PLCOPEN_IMPORT_DECISION_001"]

[oracle]
kind = "trust_contract"
ref = "SPEC_PLCOPEN_IMPORT_DECISION_001#semantic-st-to-xml-export-contract"

[[behavior]]
partition = { equals = "POU_KIND_IDENTITY_AND_SOURCE_LOCATION" }
case_family = "boundary_low"
oracle_ref = "SPEC_PLCOPEN_IMPORT_DECISION_001#semantic-st-to-xml-export-contract"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "expected_diagnostic", status = "unchanged" }
rationale = "Three standard POU kinds retain name, path, and one-based declaration line; test POUs map with warnings and unsupported top-level nodes report path and line."

[[behavior]]
partition = { equals = "POU_BODY_NORMALIZATION" }
case_family = "ordering_or_lifecycle"
