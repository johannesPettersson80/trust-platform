schema_version = 1
id = "DEV_AGENT_WORKSPACE_CONTAINMENT_002"
title = "Agent workspace operations remain normalized and contained"
area = "plcopen_devtools"
risk = "security"
status = "specified"
owner = "trust-dev"
last_reviewed = "2026-08-01"
claim = "Agent workspace and project operations preserve normalized portable paths and exact bytes while rejecting lexical, canonical, project-root, and symbolic-link escapes before reading or mutating outside their authority."
proof_level = "S0"
contract_kind = "security_policy"
source_refs = [
  "docs/specs/20-agent-api-v1.md",
  "docs/guides/AGENT_CONTRACT_V1.md",
  "crates/trust-dev/src/agent.rs",
  "crates/trust-dev/src/agent/contract_tests.rs",
]
tests = []
gates = ["veryquick", "pr"]
evidence_refs = []
spec_gap_refs = []
missing = ["catalog_mapping", "focused_execution_evidence", "assertion_reachability", "mutation_sensitivity", "cross_platform_execution", "broad_remote_gate"]

[spec]
status = "specified"
source_refs = ["SPEC_AGENT_API_V1_001"]

[oracle]
kind = "trust_contract"
ref = "SPEC_AGENT_API_V1_001#5-workspace-and-project-filesystem-authority"

[[behavior]]
partition = { equals = "WORKSPACE_READ_RESULT_AND_IO_FAILURE" }
case_family = "happy_path"
oracle_ref = "SPEC_AGENT_API_V1_001#5-workspace-and-project-filesystem-authority"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "none", status = "unchanged" }
rationale = "Successful read returns normalized relative identity and exact text; a missing file uses -32002 and retains the normalized in-workspace path in error data."

[[behavior]]
partition = { equals = "WORKSPACE_WRITE_PARENT_AND_BYTE_CONTRACT" }
case_family = "ordering_or_lifecycle"
oracle_ref = "SPEC_AGENT_API_V1_001#5-workspace-and-project-filesystem-authority"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "expected_delta", retain = "not_applicable", process_image = "unchanged", diagnostics = "none", status = "unchanged" }
rationale = "Authorized parent creation precedes one exact text write and reports UTF-8 bytes; disabled parent creation fails without creating any parent or file."

[[behavior]]
partition = { equals = "LEXICAL_PORTABLE_PATH_MATRIX" }
case_family = "platform_or_filesystem_variation"
oracle_ref = "SPEC_AGENT_API_V1_001#5-workspace-and-project-filesystem-authority"
outcome = "reject"
no_partial_apply = true
delta = { target = "unchanged", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "stable_error", status = "unchanged" }
rationale = "Empty, absolute, drive, UNC, and above-root paths reject portably, while in-scope parent segments normalize without losing the final filename."

[[behavior]]
partition = { equals = "PROJECT_ROOT_AND_SUBPATH_RESOLUTION" }
case_family = "wrong_type_or_shape"
oracle_ref = "SPEC_AGENT_API_V1_001#5-workspace-and-project-filesystem-authority"
outcome = "reject"
no_partial_apply = true
delta = { target = "unchanged", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "stable_error", status = "unchanged" }
rationale = "The selected project must resolve to an existing in-workspace directory, and project subpaths resolve from that project rather than the workspace root."

[[behavior]]
partition = { equals = "READ_AND_WRITE_SYMLINK_ESCAPE_REJECTION" }
case_family = "auth_or_permission"
oracle_ref = "SPEC_AGENT_API_V1_001#5-workspace-and-project-filesystem-authority"
outcome = "reject"
no_partial_apply = true
delta = { target = "unchanged", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "stable_error", status = "unchanged" }
rationale = "Read and write aliases that resolve outside the workspace are rejected before content access, directory creation, or file mutation."

[[behavior]]
partition = { equals = "PROJECT_AND_SOURCE_SYMLINK_ESCAPE_REJECTION" }
case_family = "auth_or_permission"
oracle_ref = "SPEC_AGENT_API_V1_001#5-workspace-and-project-filesystem-authority"
outcome = "reject"
no_partial_apply = true
delta = { target = "unchanged", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "stable_error", status = "unchanged" }
rationale = "A symlinked project root or project-relative subpath that leaves the project or workspace boundary is not accepted as an authorized target."

[[behavior]]
partition = { equals = "CONTAINMENT_ERROR_SHAPE" }
case_family = "auth_or_permission"
oracle_ref = "SPEC_AGENT_API_V1_001#5-workspace-and-project-filesystem-authority"
outcome = "reject"
no_partial_apply = true
delta = { target = "unchanged", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "stable_error", status = "unchanged" }
rationale = "Containment errors use -32001 and stable path_outside_workspace data without leaking unrelated source or secret material."

[[coverage.cells]]
dimension = "happy_path"
state = "gap_open"
rationale = "Focused normalized-read tests exist, but accepted catalog binding and dynamic proof are pending."

[[coverage.cells]]
dimension = "ordering_or_lifecycle"
state = "gap_open"
rationale = "Focused write side-effect tests exist, but accepted catalog binding and dynamic proof are pending."

[[coverage.cells]]
dimension = "platform_or_filesystem_variation"
state = "gap_open"
rationale = "Focused portable-path tests exist, but accepted catalog binding and cross-platform proof are pending."

[[coverage.cells]]
dimension = "wrong_type_or_shape"
state = "gap_open"
rationale = "Focused project resolution tests exist, but accepted catalog binding and dynamic proof are pending."

[[coverage.cells]]
dimension = "auth_or_permission"
state = "gap_open"
rationale = "Focused containment and symlink tests exist, but accepted catalog binding and dynamic proof are pending."
