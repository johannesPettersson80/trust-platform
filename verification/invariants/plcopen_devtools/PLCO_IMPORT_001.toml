source_refs = ["SPEC_PLCOPEN_IMPORT_DECISION_001"]

[oracle]
kind = "trust_contract"
ref = "SPEC_PLCOPEN_IMPORT_DECISION_001"

[[behavior]]
partition = { equals = "ST_BODY_IMPORT" }
case_family = "happy_path"
oracle_ref = "SPEC_PLCOPEN_IMPORT_DECISION_001#st-only-import-profile"
outcome = "accept_value"
delta = { target = "set_to_expected", siblings = "not_applicable", retain = "not_applicable", process_image = "unchanged", diagnostics = "none", status = "unchanged" }
rationale = "A supported ST POU body is emitted as an ST source file."

[[behavior]]
partition = { equals = "ST_BODY_WITH_BENIGN_METADATA" }
case_family = "extra_or_unknown"
oracle_ref = "SPEC_PLCOPEN_IMPORT_DECISION_001#st-only-import-profile"
outcome = "accept_value"
delta = { target = "set_to_expected", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "none", status = "unchanged" }
rationale = "Opaque addData metadata beside a valid ST body does not hide or replace the ST program."

[[behavior]]
partition = { equals = "FBD_BODY_REJECTED" }
case_family = "wrong_type_or_shape"
oracle_ref = "SPEC_PLCOPEN_IMPORT_DECISION_001#non-st-body-diagnostics"
outcome = "reject"
error_code = "PLCO215"
no_partial_apply = true
delta = { target = "unchanged", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "expected_diagnostic", status = "unchanged" }
rationale = "An FBD body is skipped with PLCO215 and is never scraped into an ST source."

