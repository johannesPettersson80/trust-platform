schema_version = 1
id = "PLCO_ST_COMPLETE_PROFILE_001"
title = "The public ST-complete profile has one stable identity and scope"
area = "plcopen_devtools"
risk = "wrong_result"
status = "specified"
owner = "trust-plcopen"
last_reviewed = "2026-07-27"
claim = "Library and CLI profile projections expose the reviewed TC6 namespace, trust-st-complete-v1 identity, supported scope, round-trip limits, and known gaps; the library additionally exposes the reviewed partial shim scope without implying complete TC6 support."
proof_level = "S0"
contract_kind = "decision_table"
source_refs = ["docs/guides/PLCOPEN_INTEROP_COMPATIBILITY.md", "docs/PLCOPEN_DECISIONS.md", "crates/trust-plcopen/src/plcopen/profile.rs"]
tests = []
gates = ["pr"]
evidence_refs = []
spec_gap_refs = []
missing = ["cataloged_tests", "focused_execution_evidence", "profile_json_schema_rejection", "final_remote_gate"]

[spec]
status = "specified"
source_refs = ["SPEC_PLCOPEN_IMPORT_DECISION_001"]

[oracle]
kind = "trust_contract"
ref = "SPEC_PLCOPEN_IMPORT_DECISION_001#st-complete-profile-contract"

[[behavior]]
partition = { equals = "LIBRARY_PROFILE" }
case_family = "happy_path"
oracle_ref = "SPEC_PLCOPEN_IMPORT_DECISION_001#st-complete-profile-contract"
outcome = "accept_value"
delta = { target = "set_to_expected", siblings = "expected_delta", retain = "not_applicable", process_image = "not_applicable", diagnostics = "none", status = "unchanged" }
rationale = "The library profile exposes the exact namespace/profile, its ST POU subset, supported and partial compatibility rows, and nonempty limits and gaps."

[[behavior]]
partition = { equals = "CLI_JSON_PROFILE" }
case_family = "happy_path"
oracle_ref = "SPEC_PLCOPEN_IMPORT_DECISION_001#st-complete-profile-contract"
outcome = "accept_value"
delta = { target = "set_to_expected", siblings = "expected_delta", retain = "not_applicable", process_image = "not_applicable", diagnostics = "none", status = "expected_delta" }
rationale = "The profile command succeeds and emits parseable JSON with the exact namespace/profile plus supported compatibility, round-trip-limit, and known-gap fields."

[[coverage.cells]]
dimension = "happy_path"
state = "gap_open"
rationale = "The two reviewed profile projections await generated catalog mapping and focused execution."
