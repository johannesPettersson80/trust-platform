schema_version = 1
id = "PLCO_MOTION_SINGLE_AXIS_QUEUE_001"
title = "PLCopen Motion Phase A queues, promotes, aborts, and flushes deterministically"
area = "plcopen_devtools"
risk = "wrong_result"
status = "mapped"
owner = "trust-plcopen"
last_reviewed = "2026-07-26"
claim = "One active command and two buffered slots preserve FIFO ownership, fail closed on overflow or unsupported blending, and expose deterministic abort and fault cleanup."
proof_level = "S0"
contract_kind = "state_machine"
source_refs = ["libraries/plcopen_motion/single_axis_core/src"]
tests = ["TEST_AUTO_4CCCDEB5FA8584377F51", "TEST_AUTO_52A80BCD49F3C1847B01", "TEST_AUTO_5DF00898127CB8AB178F", "TEST_AUTO_6F92A39D9A99760BACBF", "TEST_AUTO_B36FA3D4E189B57BF8E5", "TEST_AUTO_C4454E17A90BBBE1C607", "TEST_AUTO_D2D27C18BFA8A70AC7E4", "TEST_AUTO_DE7941EA23FB8E9BFE1E"]
