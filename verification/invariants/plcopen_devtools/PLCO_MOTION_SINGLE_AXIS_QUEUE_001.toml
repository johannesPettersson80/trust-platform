no_partial_apply = true
delta = { target = "unchanged", siblings = "unchanged", retain = "unchanged", process_image = "unchanged", diagnostics = "stable_error", status = "unchanged" }
rationale = "Phase A supports mcAborting and mcBuffered and rejects every mcBlending mode before admission."

[[behavior]]
partition = { equals = "CONTINUOUS_ABORT_RESETS_INENDVELOCITY" }
case_family = "ordering_or_lifecycle"
oracle_ref = "SPEC_PLCOPEN_MOTION_LIBRARY_SPEC_FOR_TRUST_V0_1_001#11-output-semantics"
