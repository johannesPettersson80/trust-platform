[spec]
status = "specified"
source_refs = ["SPEC_PLCOPEN_MOTION_LIBRARY_SPEC_FOR_TRUST_V0_1_001"]

[oracle]
kind = "trust_contract"
ref = "SPEC_PLCOPEN_MOTION_LIBRARY_SPEC_FOR_TRUST_V0_1_001#16-buffering-and-command-queue-semantics"

[[behavior]]
partition = { equals = "BUFFERED_ACTIVATION_FIFO_AND_CAPACITY" }
case_family = "resource_limit"
oracle_ref = "SPEC_PLCOPEN_MOTION_LIBRARY_SPEC_FOR_TRUST_V0_1_001#16-buffering-and-command-queue-semantics"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "expected_delta", process_image = "unchanged", diagnostics = "stable_error", status = "unchanged" }
rationale = "Two buffered slots preserve FIFO order and a third request fails with mcERR_QueueFull."

[[behavior]]
partition = { equals = "ACTIVE_FAULT_CLEARS_ACTIVE_AND_QUEUE" }
case_family = "hardware_or_network_fault"
oracle_ref = "SPEC_PLCOPEN_MOTION_LIBRARY_SPEC_FOR_TRUST_V0_1_001#16-buffering-and-command-queue-semantics"
outcome = "fault_visible"
no_partial_apply = false
delta = { target = "set_to_expected", siblings = "expected_delta", retain = "expected_delta", process_image = "unchanged", diagnostics = "stable_error", status = "fault_visible" }
rationale = "After active and queued commands have been accepted, a backend fault exposes the stable axis error, enters ErrorStop, and clears the active and queued slots."

[[behavior]]
partition = { equals = "BUFFERED_FAULT_REPORTS_ERROR" }
case_family = "hardware_or_network_fault"
oracle_ref = "SPEC_PLCOPEN_MOTION_LIBRARY_SPEC_FOR_TRUST_V0_1_001#16-buffering-and-command-queue-semantics"
outcome = "fault_visible"
no_partial_apply = false
delta = { target = "unchanged", siblings = "expected_delta", retain = "expected_delta", process_image = "unchanged", diagnostics = "stable_error", status = "fault_visible" }
rationale = "Buffered owners retain and expose Error with the stable axis fault code, not CommandAborted, after an earlier active fault flushes the queue, even if MC_Reset clears the live axis fault first."

[[behavior]]
partition = { equals = "QUEUED_CONTINUOUS_UPDATE_DOES_NOT_MUTATE_ACCEPTED_COMMAND" }
case_family = "ordering_or_lifecycle"
oracle_ref = "SPEC_PLCOPEN_MOTION_LIBRARY_SPEC_FOR_TRUST_V0_1_001#10-execution-semantics"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "unchanged", siblings = "unchanged", retain = "unchanged", process_image = "unchanged", diagnostics = "none", status = "unchanged" }
rationale = "ContinuousUpdate cannot rewrite the captured inputs of a command that is still queued."

[[behavior]]
partition = { equals = "BUFFER_MODE_SUPPORT_BY_FB_FAMILY" }
case_family = "wrong_type_or_shape"
oracle_ref = "SPEC_PLCOPEN_MOTION_LIBRARY_SPEC_FOR_TRUST_V0_1_001#16-buffering-and-command-queue-semantics"
