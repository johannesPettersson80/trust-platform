schema_version = 1
id = "VM_SEAM_STRING_ELEMENT_001"
title = "Runtime string operations share one Unicode-scalar element model"
area = "bytecode_vm"
risk = "wrong_result"
status = "mapped"
owner = "trust-runtime-core"
last_reviewed = "2026-07-26"
claim = "Runtime-core string helpers, runtime value paths, and VariableStorage references use 1-based Unicode-scalar positions, preserve unaffected elements on writes, and reject unrepresentable narrow or wide elements without producing a replacement value."
proof_level = "S0"
contract_kind = "decision_table"
source_refs = [
  "crates/trust-runtime-core/src/value/string_semantics.rs",
  "crates/trust-runtime/src/memory",
  "crates/trust-runtime/src/value/reference.rs",
]
tests = []
gates = ["pr"]
evidence_refs = []
spec_gap_refs = []
missing = ["cataloged_behavior_tests", "assertion_reachability", "broad_remote_gate"]

[spec]
status = "specified"
source_refs = ["SPEC_VM_VALUE_SEMANTICS_001", "SPEC_IEC_DEVIATIONS_001"]

[oracle]
kind = "trust_contract"
ref = "SPEC_VM_VALUE_SEMANTICS_001#runtime-string-elements"

[[behavior]]
partition = { equals = "SCALAR_COUNT_AND_LIBRARY_POSITIONS" }
case_family = "encoding_or_unicode"
oracle_ref = "SPEC_VM_VALUE_SEMANTICS_001#runtime-string-elements"
outcome = "accept_value"
delta = { target = "set_to_expected", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "none", status = "unchanged" }
rationale = "Counts and standard string positions use Unicode scalar elements rather than UTF-8 bytes or UTF-16 code units."

[[behavior]]
partition = { equals = "NARROW_INDEX_IN_RANGE" }
case_family = "happy_path"
oracle_ref = "SPEC_VM_VALUE_SEMANTICS_001#runtime-string-elements"
outcome = "accept_value"
delta = { target = "set_to_expected", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "none", status = "unchanged" }
rationale = "A 1-based STRING index reads a scalar that fits CHAR and a successful write replaces exactly the selected scalar."

[[behavior]]
partition = { equals = "WIDE_INDEX_IN_RANGE" }
case_family = "encoding_or_unicode"
oracle_ref = "SPEC_VM_VALUE_SEMANTICS_001#runtime-string-elements"
outcome = "accept_value"
delta = { target = "set_to_expected", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "none", status = "unchanged" }
rationale = "A 1-based WSTRING index reads a scalar that fits WCHAR and a successful write replaces exactly the selected scalar."

[[behavior]]
partition = { equals = "IN_RANGE_ELEMENT_EXCEEDS_REQUESTED_WIDTH" }
case_family = "wrong_type_or_shape"
oracle_ref = "SPEC_VM_VALUE_SEMANTICS_001#runtime-string-elements"
outcome = "reject"
no_partial_apply = true
delta = { target = "unchanged", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "expected_diagnostic", status = "unchanged" }
rationale = "For an in-range index, a selected scalar outside the requested CHAR or WCHAR width returns RuntimeError::Overflow without a replacement value."

[[behavior]]
partition = { equals = "IN_RANGE_INVALID_REPLACEMENT_SHAPE_OR_SCALAR" }
case_family = "wrong_type_or_shape"
oracle_ref = "SPEC_VM_VALUE_SEMANTICS_001#runtime-string-elements"
outcome = "reject"
no_partial_apply = true
delta = { target = "unchanged", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "expected_diagnostic", status = "unchanged" }
rationale = "For an in-range index, an invalid scalar encoding, empty or multi-scalar string, or non-character replacement returns RuntimeError::TypeMismatch without a replacement value."

[[behavior]]
partition = { equals = "INDEX_BELOW_ONE" }
case_family = "boundary_low"
oracle_ref = "SPEC_VM_VALUE_SEMANTICS_001#runtime-string-elements"
outcome = "reject"
no_partial_apply = true
delta = { target = "unchanged", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "expected_diagnostic", status = "unchanged" }
rationale = "Bounds are validated first; an index below 1 returns RuntimeError::IndexOutOfBounds with upper sentinel i64::MAX and cannot mutate the string even when the replacement is also invalid."

[[behavior]]
partition = { equals = "INDEX_ABOVE_SCALAR_COUNT" }
case_family = "boundary_high"
oracle_ref = "SPEC_VM_VALUE_SEMANTICS_001#runtime-string-elements"
outcome = "reject"
no_partial_apply = true
delta = { target = "unchanged", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "expected_diagnostic", status = "unchanged" }
rationale = "Bounds are validated first; an index above the scalar count returns RuntimeError::IndexOutOfBounds with that count as the upper bound and cannot mutate the string even when the replacement is also invalid."

[[behavior]]
partition = { equals = "VM_AND_STORAGE_REFERENCE_ROUND_TRIP" }
case_family = "happy_path"
oracle_ref = "SPEC_VM_VALUE_SEMANTICS_001#runtime-string-elements"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "none", status = "unchanged" }
rationale = "VM value paths and VariableStorage references expose the same Unicode-scalar indexed read/write behavior as runtime core."

[[coverage.cells]]
dimension = "happy_path"
state = "gap_open"
rationale = "Narrow and reference-path read/write behavior awaits catalog association."

[[coverage.cells]]
dimension = "encoding_or_unicode"
state = "gap_open"
rationale = "Scalar counting, string-library positions, and wide read/write behavior await catalog association."

[[coverage.cells]]
dimension = "boundary_low"
state = "gap_open"
rationale = "Indexed lower-bound rejection awaits catalog association."

[[coverage.cells]]
dimension = "boundary_high"
state = "gap_open"
rationale = "Indexed upper-bound rejection awaits catalog association."

[[coverage.cells]]
dimension = "wrong_type_or_shape"
state = "gap_open"
rationale = "Unrepresentable scalar and invalid replacement rejection await catalog association."
