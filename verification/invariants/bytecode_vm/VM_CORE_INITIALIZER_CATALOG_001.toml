missing = ["assertion_reachability", "mutation_sensitivity", "broad_remote_gate"]

[spec]
status = "specified"
source_refs = ["SPEC_VM_VALUE_SEMANTICS_001"]

[oracle]
kind = "trust_contract"
ref = "SPEC_VM_VALUE_SEMANTICS_001#2-7-portable-runtime-value-and-program-model-contracts"

[[behavior]]
partition = { equals = "EMPTY_AND_MISSING_LOOKUP" }
case_family = "missing_required"
oracle_ref = "SPEC_VM_VALUE_SEMANTICS_001#2-7-portable-runtime-value-and-program-model-contracts"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "unchanged", siblings = "unchanged", retain = "unchanged", process_image = "unchanged", diagnostics = "none", status = "unchanged" }
rationale = "A new catalog has no initializer or type-default association, and missing lookups return no value."

[[behavior]]
partition = { equals = "SEQUENTIAL_INSERT_AND_EXACT_EXPRESSION" }
case_family = "ordering_or_lifecycle"
oracle_ref = "SPEC_VM_VALUE_SEMANTICS_001#2-7-portable-runtime-value-and-program-model-contracts"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "expected_delta", retain = "unchanged", process_image = "unchanged", diagnostics = "none", status = "unchanged" }
rationale = "Successive inserts allocate identities zero and one and preserve each exact expression under its allocated identity."

[[behavior]]
partition = { equals = "TYPE_DEFAULT_LAST_WRITE_WINS" }
case_family = "ordering_or_lifecycle"
oracle_ref = "SPEC_VM_VALUE_SEMANTICS_001#2-7-portable-runtime-value-and-program-model-contracts"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "unchanged", process_image = "unchanged", diagnostics = "none", status = "unchanged" }
rationale = "Replacing one type's default selects the latest initializer while preserving both records and leaving other types unassociated."

[[coverage.cells]]
