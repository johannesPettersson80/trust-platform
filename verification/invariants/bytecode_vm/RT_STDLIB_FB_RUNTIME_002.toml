schema_version = 1
id = "RT_STDLIB_FB_RUNTIME_002"
title = "Standard function-block runtime state preserves edge, priority, type, and time authority"
area = "bytecode_vm"
risk = "wrong_result"
status = "specified"
owner = "trust-runtime"
last_reviewed = "2026-08-01"
claim = "Standard function-block lookup, triggers, counters, bistables, and timers preserve unique definitions, edge sampling, priority, generic value family, saturation, scan-time state, and no-partial-output publication on type failure."
proof_level = "S0"
contract_kind = "state_machine"
source_refs = ["docs/specs/08-standard-function-blocks.md", "crates/trust-runtime/tests/stdlib_fb_contract.rs"]
tests = []
gates = ["veryquick", "pr"]
evidence_refs = []
spec_gap_refs = []
missing = ["catalog_mapping", "focused_execution_evidence", "assertion_reachability", "mutation_sensitivity", "broad_remote_gate"]
[spec]
status = "specified"
source_refs = ["SPEC_IEC_STANDARD_FBS_CANDIDATE_001"]
[oracle]
kind = "trust_contract"
ref = "SPEC_IEC_STANDARD_FBS_CANDIDATE_001"

[[behavior]]
partition = { equals = "UNIQUE_CASE_INSENSITIVE_DEFINITION_AND_SIGNATURE" }
case_family = "duplicate_or_collision"
oracle_ref = "SPEC_IEC_STANDARD_FBS_CANDIDATE_001"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "none", status = "unchanged" }
rationale = "Definitions are unique and complete, lookup and aliases are case-insensitive, and timer/counter preset and current/elapsed signatures retain matching generic families."
[[behavior]]
partition = { equals = "RISING_AND_FALLING_TRIGGER_PHASE" }
case_family = "ordering_or_lifecycle"
oracle_ref = "SPEC_IEC_STANDARD_FBS_CANDIDATE_001#edge-detection-function-blocks"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "none", status = "unchanged" }
rationale = "Rising trigger pulses once per low-to-high edge; falling trigger follows the documented cold-low pulse and requires high to rearm."
[[behavior]]
partition = { equals = "COUNTER_EDGE_PRIORITY_AND_POST_VALUE_OUTPUTS" }
case_family = "ordering_or_lifecycle"
oracle_ref = "SPEC_IEC_STANDARD_FBS_CANDIDATE_001#counter-function-blocks"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "expected_delta", retain = "not_applicable", process_image = "unchanged", diagnostics = "none", status = "unchanged" }
rationale = "CTU counts rising edges with reset dominance, CTD load dominates, CTUD uses reset then load then edges, held inputs do not repeat, and outputs derive from the post-transition value."
[[behavior]]
partition = { equals = "COUNTER_GENERIC_FAMILY_SATURATION_AND_MEMORY" }
case_family = "boundary_high"
oracle_ref = "SPEC_IEC_STANDARD_FBS_CANDIDATE_001#counter-function-blocks"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "none", status = "unchanged" }
rationale = "Counters preserve the selected integer family and edge memory and saturate at signed bounds rather than wrapping."
[[behavior]]
partition = { equals = "RESET_OR_SET_DOMINANT_BISTABLE_STATE" }
case_family = "ordering_or_lifecycle"
oracle_ref = "SPEC_IEC_STANDARD_FBS_CANDIDATE_001#bistable-function-blocks"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "none", status = "unchanged" }
rationale = "RS is reset dominant, SR is set dominant, and each retains state between calls."
[[behavior]]
partition = { equals = "TON_TOF_TP_INPUT_AND_REARM_STATE" }
case_family = "ordering_or_lifecycle"
oracle_ref = "SPEC_IEC_STANDARD_FBS_CANDIDATE_001#timer-function-blocks"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "expected_delta", retain = "not_applicable", process_image = "unchanged", diagnostics = "none", status = "unchanged" }
rationale = "TON delays and resets on falling input, TOF holds its expiry plateau until high rearm, and TP ignores a falling input during its pulse and rearms only after low."
[[behavior]]
partition = { equals = "TIMER_CURRENT_PRESET_AND_NONNEGATIVE_DELTA" }
case_family = "time_or_clock_fault"
oracle_ref = "SPEC_IEC_STANDARD_FBS_CANDIDATE_001#timer-function-blocks"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "none", status = "unchanged" }
rationale = "Every step uses the current preset, non-positive presets normalize to zero, negative direct deltas contribute zero, and first call or backward storage-clock movement contributes zero."
[[behavior]]
partition = { equals = "TIMER_LTIME_OUTPUT_FAMILY" }
case_family = "happy_path"
oracle_ref = "SPEC_IEC_STANDARD_FBS_CANDIDATE_001#timer-function-blocks"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "none", status = "unchanged" }
rationale = "Storage timers preserve LTIME elapsed output when the selected preset family is LTIME."
[[behavior]]
partition = { equals = "TYPE_MISMATCH_NO_OUTPUT_PUBLICATION" }
case_family = "wrong_type_or_shape"
oracle_ref = "SPEC_IEC_STANDARD_FBS_CANDIDATE_001"
outcome = "reject"
no_partial_apply = true
delta = { target = "unchanged", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "stable_error", status = "unchanged" }
rationale = "Counter or timer storage family mismatch rejects before publishing any output."

