[oracle]
kind = "trust_contract"
ref = "SPEC_IEC_STANDARD_FUNCTIONS_001#non-iec-extensions-mp-014"

[[behavior]]
partition = { equals = "ASSERTION_SUCCESS_NULL" }
case_family = "happy_path"
oracle_ref = "SPEC_IEC_STANDARD_FUNCTIONS_001#non-iec-extensions-mp-014"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "unchanged", process_image = "unchanged", diagnostics = "none", status = "unchanged" }
rationale = "Each reviewed true assertion condition, including INT/DINT comparison and finite REAL/LREAL ASSERT_NEAR, returns Value::Null."

[[behavior]]
partition = { equals = "ASSERTION_CONDITION_FAILURE" }
case_family = "wrong_type_or_shape"
oracle_ref = "SPEC_IEC_STANDARD_FUNCTIONS_001#non-iec-extensions-mp-014"
outcome = "reject"
no_partial_apply = false
delta = { target = "not_applicable", siblings = "not_applicable", retain = "not_applicable", process_image = "not_applicable", diagnostics = "stable_error", status = "not_applicable" }
rationale = "A reviewed failed equality, inequality, ordering, or tolerance condition returns RuntimeError::AssertionFailed rather than a normal runtime value."

[[behavior]]
partition = { equals = "ASSERTION_RELATIONAL_MESSAGE_FORMS" }
case_family = "happy_path"
oracle_ref = "SPEC_IEC_STANDARD_FUNCTIONS_001#non-iec-extensions-mp-014"
outcome = "reject"
no_partial_apply = false
delta = { target = "not_applicable", siblings = "not_applicable", retain = "not_applicable", process_image = "not_applicable", diagnostics = "stable_error", status = "not_applicable" }
rationale = "Equality and ordering failures use the six specified message forms with decimal integer, .0 REAL, uppercase Boolean, and quoted CHAR representatives instead of internal Value debug text."

[[behavior]]
partition = { equals = "ASSERT_NEAR_FAILURE_CONTEXT" }
case_family = "happy_path"
oracle_ref = "SPEC_IEC_STANDARD_FUNCTIONS_001#non-iec-extensions-mp-014"
outcome = "reject"
no_partial_apply = false
delta = { target = "not_applicable", siblings = "not_applicable", retain = "not_applicable", process_image = "not_applicable", diagnostics = "stable_error", status = "not_applicable" }
rationale = "A reviewed ASSERT_NEAR failure identifies ASSERT_NEAR and includes delta context without fixing an unasserted complete message."

