schema_version = 1
id = "RT_STDLIB_COUNTER_STATE_001"
title = "Runtime counter function blocks preserve edge-driven state and value types"
area = "bytecode_vm"
risk = "wrong_result"
status = "planned"
owner = "trust-runtime"
last_reviewed = "2026-07-27"
claim = "Runtime CTU, CTD, and CTUD instances apply their exercised reset or load controls, count only rising edges, derive their outputs from CV, and preserve the selected counter value type."
proof_level = "S0"
contract_kind = "state_machine"
source_refs = ["docs/specs/08-standard-function-blocks.md", "crates/trust-runtime/src/stdlib/fbs/counters.rs"]
tests = []
gates = ["pr"]
evidence_refs = []
spec_gap_refs = []
missing = ["accepted_catalog_mappings", "focused_execution_evidence", "final_remote_gate"]

[spec]
status = "specified"
source_refs = ["SPEC_IEC_STANDARD_FBS_CANDIDATE_001"]

[oracle]
kind = "trust_contract"
ref = "SPEC_IEC_STANDARD_FBS_CANDIDATE_001#4-counter-function-blocks-table-45"

[[behavior]]
partition = { equals = "CTU_RISING_EDGE_RESET_AND_THRESHOLD" }
case_family = "ordering_or_lifecycle"
oracle_ref = "SPEC_IEC_STANDARD_FBS_CANDIDATE_001#ctu---up-counter"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "expected_delta", process_image = "unchanged", diagnostics = "none", status = "unchanged" }
rationale = "CTU increments CV once per CU rising edge, holds CV without a new edge, reports Q when CV reaches PV, and gives R priority by resetting CV to zero and Q to false."

[[behavior]]
partition = { equals = "CTD_RISING_EDGE_LOAD_AND_ZERO" }
case_family = "ordering_or_lifecycle"
oracle_ref = "SPEC_IEC_STANDARD_FBS_CANDIDATE_001#ctd---down-counter"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "expected_delta", process_image = "unchanged", diagnostics = "none", status = "unchanged" }
rationale = "CTD gives LD priority by loading PV, decrements CV once per CD rising edge, holds CV without a new edge, and reports Q when CV reaches zero."

[[behavior]]
partition = { equals = "CTUD_EDGE_RESET_AND_OUTPUTS" }
case_family = "ordering_or_lifecycle"
oracle_ref = "SPEC_IEC_STANDARD_FBS_CANDIDATE_001#ctud---up-down-counter"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "expected_delta", process_image = "unchanged", diagnostics = "none", status = "unchanged" }
rationale = "CTUD increments on a CU rising edge, decrements on a CD rising edge, gives R priority over counting, and derives QU and QD from the resulting CV. This behavior does not claim the unexercised LD or simultaneous-edge partitions."

[[behavior]]
partition = { equals = "COUNTER_SELECTED_RUNTIME_VALUE_TYPE" }
case_family = "happy_path"
oracle_ref = "SPEC_IEC_STANDARD_FBS_CANDIDATE_001#ctu---up-counter"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "expected_delta", process_image = "unchanged", diagnostics = "none", status = "unchanged" }
rationale = "An overloaded base counter selects the runtime PV/CV integer family from its call values, while an explicit typed variant such as CTD_UDINT preserves that declared value type."

[[coverage.cells]]
dimension = "ordering_or_lifecycle"
state = "gap_open"
rationale = "The counter state machines are specified; the ready runtime tests still require accepted catalog mappings and focused execution evidence."

[[coverage.cells]]
dimension = "happy_path"
state = "gap_open"
rationale = "The supported counter type families are specified; the ready runtime tests still require accepted catalog mappings and focused execution evidence."
