[[behavior]]
partition = { equals = "REAL_FINITE_AND_NONFINITE_VALIDITY" }
case_family = "happy_path"
oracle_ref = "SPEC_IEC_STANDARD_FUNCTIONS_001#10-validate-functions-table-39"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "unchanged", process_image = "unchanged", diagnostics = "none", status = "unchanged" }
rationale = "IS_VALID returns TRUE for finite REAL#1.0 and FALSE for REAL NaN and LREAL positive infinity."

[[behavior]]
partition = { equals = "BCD_NIBBLE_VALIDITY" }
case_family = "happy_path"
oracle_ref = "SPEC_IEC_STANDARD_FUNCTIONS_001#10-validate-functions-table-39"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "unchanged", process_image = "unchanged", diagnostics = "none", status = "unchanged" }
rationale = "IS_VALID_BCD returns TRUE for the reviewed valid BYTE, WORD, DWORD, and LWORD values and FALSE for WORD#16#12FA."

[[behavior]]
