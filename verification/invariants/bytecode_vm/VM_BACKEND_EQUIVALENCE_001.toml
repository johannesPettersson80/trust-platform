schema_version = 1
id = "VM_BACKEND_EQUIVALENCE_001"
title = "Optimized VM backends preserve stack-executor semantics"
area = "bytecode_vm"
risk = "wrong_result"
status = "planned"
owner = "trust-runtime"
last_reviewed = "2026-07-26"
claim = "Register-IR and tier-1 execution preserve stack-executor values, types, mutations, traps, budgets, deadlines, calls, and control flow, and may fall back only before mutation."
proof_level = "S0"
contract_kind = "protocol_trace"
source_refs = ["crates/trust-runtime/src/runtime/vm/register_ir", "crates/trust-runtime/src/runtime/vm/dispatch.rs", "crates/trust-runtime/src/runtime/vm/budget.rs"]
