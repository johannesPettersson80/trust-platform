missing = ["catalog_mapping", "assertion_reachability", "mutation_sensitivity", "broad_remote_gate"]

[spec]
status = "specified"
source_refs = ["SPEC_BYTECODE_FORMAT_001", "SPEC_RUNTIME_SEMANTICS_001"]

[oracle]
kind = "trust_contract"
ref = "SPEC_BYTECODE_FORMAT_001#optimized-backend-semantic-equivalence"

[[behavior]]
partition = { equals = "STACK_REGISTER_AND_TIER1_RESULT_PARITY" }
case_family = "happy_path"
oracle_ref = "SPEC_BYTECODE_FORMAT_001#optimized-backend-semantic-equivalence"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "unchanged", process_image = "expected_delta", diagnostics = "none", status = "unchanged" }
rationale = "Supported arithmetic, CASE, loop, function, and function-block execution produces the same observable result on every accepted backend."

[[behavior]]
partition = { equals = "BACKEND_DECLINE_BEFORE_MUTATION" }
case_family = "extra_or_unknown"
oracle_ref = "SPEC_BYTECODE_FORMAT_001#optimized-backend-semantic-equivalence"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "unchanged", process_image = "expected_delta", diagnostics = "expected_diagnostic", status = "unchanged" }
rationale = "Unsupported optimized instructions decline before mutation and execute through the canonical stack path without a partial optimized result."

[[behavior]]
partition = { equals = "SHARED_INSTRUCTION_BUDGET" }
case_family = "resource_limit"
oracle_ref = "SPEC_BYTECODE_FORMAT_001#fixed-resource-limits"
outcome = "fault_visible"
fault_surface = "ExecutionTimeout"
no_partial_apply = true
delta = { target = "unchanged", siblings = "unchanged", retain = "unchanged", process_image = "unchanged", diagnostics = "stable_error", status = "fault_visible" }
rationale = "All backends and nested calls charge the same original bytecode instructions and fault at the same exhausted-budget boundary without underflow."

[[behavior]]
partition = { equals = "DEADLINE_BEFORE_OBSERVABLE_COMMIT" }
case_family = "concurrency_or_cancellation"
oracle_ref = "SPEC_BYTECODE_FORMAT_001#optimized-backend-semantic-equivalence"
outcome = "fault_visible"
no_partial_apply = true
delta = { target = "unchanged", siblings = "unchanged", retain = "unchanged", process_image = "unchanged", diagnostics = "stable_error", status = "fault_visible" }
rationale = "A reached deadline traps before the guarded forward workload or compiled block commits its next observable mutation."

[[coverage.cells]]
dimension = "happy_path"
