schema_version = 1
id = "VM_RUNTIME_VALUE_MATERIALIZATION_001"
title = "Runtime materialization preserves aggregate defaults and canonical enum identity"
area = "bytecode_vm"
risk = "wrong_result"
status = "planned"
owner = "trust-runtime"
last_reviewed = "2026-07-26"
claim = "Runtime startup and VM local initialization materialize aggregate defaults, overrides, independent instances, references, and canonical enum values without erasing declared type identity."
proof_level = "S0"
contract_kind = "decision_table"
source_refs = ["crates/trust-runtime/src/harness/initializer.rs", "crates/trust-runtime/src/runtime/vm/local_init.rs", "crates/trust-runtime/src/value"]
tests = []
gates = ["pr"]
evidence_refs = []
spec_gap_refs = []
missing = ["catalog_mapping", "assertion_reachability", "mutation_sensitivity", "broad_remote_gate"]

[spec]
status = "specified"
source_refs = ["SPEC_RUNTIME_SEMANTICS_001", "SPEC_VM_VALUE_SEMANTICS_001", "SPEC_IEC_VARIABLES_001"]

[oracle]
kind = "trust_contract"
ref = "SPEC_RUNTIME_SEMANTICS_001#status-and-scope"

[[behavior]]
partition = { equals = "AGGREGATE_DEFAULT_AND_OVERRIDE_MATERIALIZATION" }
case_family = "happy_path"
oracle_ref = "SPEC_IEC_VARIABLES_001#initialization-table-14"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "expected_delta", process_image = "expected_delta", diagnostics = "none", status = "unchanged" }
rationale = "Type, member, variable, FB, direct-address, and VAR_CONFIG initialization compose in the documented precedence order while multi-name aggregate instances remain independent."

[[behavior]]
partition = { equals = "CANONICAL_ENUM_RUNTIME_IDENTITY" }
case_family = "happy_path"
oracle_ref = "SPEC_VM_VALUE_SEMANTICS_001#compound-type-values"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "unchanged", process_image = "unchanged", diagnostics = "none", status = "unchanged" }
rationale = "Enum aliases, case variants, initializers, assignments, comparisons, and CASE labels retain the canonical declared enum identity and numeric variant value."

[[coverage.cells]]
dimension = "happy_path"
state = "gap_open"
rationale = "Reviewed aggregate-initializer and enum-runtime assertions await generated catalog mapping."
