schema_version = 1
id = "RT_STDLIB_CORE_HELPER_002"
title = "Standard-function core and helper execution preserve common-type authority"
area = "bytecode_vm"
risk = "wrong_result"
status = "mapped"
owner = "trust-runtime"
last_reviewed = "2026-08-01"
claim = "Standard-function registration, arity, common-type coercion, arithmetic, numerical, bit, comparison, selection, string, time, and assertion helpers preserve exact runtime families and stable rejection boundaries."
proof_level = "S0"
contract_kind = "decision_table"
source_refs = ["docs/specs/07-standard-functions.md", "crates/trust-runtime/tests/stdlib_core_contract.rs", "crates/trust-runtime/tests/stdlib_helper_contract.rs"]
tests = []
