case_family = "encoding_or_unicode"
oracle_ref = "SPEC_IEC_STANDARD_FUNCTIONS_001"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "stable_error", status = "unchanged" }
rationale = "String functions preserve narrow or wide family, count Unicode elements, use one-based clamped boundaries, join matching character families, and enforce nonnegative internal capacity."
[[behavior]]
partition = { equals = "BINARY_TIME_ARITHMETIC_AND_MOVE_IDENTITY" }
case_family = "wrong_type_or_shape"
oracle_ref = "SPEC_IEC_STANDARD_FUNCTIONS_001#time-arithmetic-functions"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "stable_error", status = "unchanged" }
rationale = "Time-related addition is binary, duration scale accepts both multiplication orders and left division, common time requires identical families, and MOVE preserves exact identity."
[[behavior]]
partition = { equals = "ASSERTION_SUCCESS_AND_STABLE_FAILURE" }
case_family = "wrong_type_or_shape"
oracle_ref = "SPEC_IEC_STANDARD_FUNCTIONS_001#assertion-extension-functions"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "stable_error", status = "unchanged" }
rationale = "Boolean, relational, and near assertions return null on success, preserve user value text and lossless widening on failure, and reject wrong arity, types, negative delta, or non-finite near values."

