[oracle]
kind = "trust_contract"
ref = "SPEC_IEC_STANDARD_FUNCTIONS_001"

[[behavior]]
partition = { equals = "INDEPENDENT_NORMALIZED_LIBRARY_REGISTRY" }
case_family = "ordering_or_lifecycle"
oracle_ref = "SPEC_IEC_STANDARD_FUNCTIONS_001"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "none", status = "unchanged" }
rationale = "Cloned libraries own independent registries and custom registration normalizes function names and parameter metadata without changing siblings."
[[behavior]]
partition = { equals = "STABLE_REQUIRED_AND_OBSERVED_ARITY" }
case_family = "wrong_type_or_shape"
oracle_ref = "SPEC_IEC_STANDARD_FUNCTIONS_001"
outcome = "reject"
no_partial_apply = true
delta = { target = "unchanged", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "stable_error", status = "unchanged" }
rationale = "Arity helpers preserve the required and observed counts and fixed or extensible functions enforce their documented minimum and exact arity."
[[behavior]]
partition = { equals = "COMMON_NUMERIC_KIND_AND_RANGE" }
case_family = "wrong_type_or_shape"
oracle_ref = "SPEC_IEC_STANDARD_FUNCTIONS_001"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "stable_error", status = "unchanged" }
rationale = "Compatible numeric values widen to one common kind, mixed-sign or out-of-range values reject, and selected values retain the resulting declared family."
[[behavior]]
partition = { equals = "COMMON_COMPARISON_RELATION_AND_NAN" }
case_family = "happy_path"
oracle_ref = "SPEC_IEC_STANDARD_FUNCTIONS_001"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "none", status = "unchanged" }
rationale = "Common comparison supports every relation after coercion and retains IEEE NaN relation semantics."
[[behavior]]
partition = { equals = "DECLARED_BIT_WIDTH_MASK_AND_VALUE" }
case_family = "boundary_high"
oracle_ref = "SPEC_IEC_STANDARD_FUNCTIONS_001"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "none", status = "unchanged" }
rationale = "Bit masks cover the exact low width through 64, values round-trip every declared bit family, and common bit coercion widens and zero-extends."
[[behavior]]
partition = { equals = "TIES_EVEN_DURATION_SCALE_AND_REJECTION" }
case_family = "boundary_high"
oracle_ref = "SPEC_IEC_STANDARD_FUNCTIONS_001#portable-time-operator-semantics"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "stable_error", status = "unchanged" }
rationale = "Nanosecond scaling rounds ties to even for both signs and rejects zero division, non-finite factors, and overflow."
[[behavior]]
partition = { equals = "RUNTIME_CLOCK_LOGICAL_DISPATCH" }
case_family = "time_or_clock_fault"
oracle_ref = "SPEC_IEC_STANDARD_FUNCTIONS_001#current-datetime-host-clock-boundary"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "stable_error", status = "unchanged" }
rationale = "Clock dispatch preserves logical time, CURRENT_DT returns a nonnegative Unix millisecond value, and unknown clock names reject."
[[behavior]]
partition = { equals = "CHECKED_ARITHMETIC_ABS_AND_EXPONENT" }
case_family = "boundary_high"
oracle_ref = "SPEC_IEC_STANDARD_FUNCTIONS_001"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "stable_error", status = "unchanged" }
rationale = "Arithmetic folds left, fixed operations reject division or arity errors, ABS preserves integer family and rejects signed minima, and exponentiation preserves base width while rejecting unrepresentable results."
[[behavior]]
partition = { equals = "FINITE_REAL_NUMERICAL_AND_TRIGONOMETRIC_RESULT" }
case_family = "wrong_type_or_shape"
oracle_ref = "SPEC_IEC_STANDARD_FUNCTIONS_001"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "stable_error", status = "unchanged" }
rationale = "Unary and trigonometric functions preserve real width, cover zero and quadrants, promote mixed ATAN2 inputs, and reject non-finite results."
[[behavior]]
partition = { equals = "DECLARED_WIDTH_BITWISE_SHIFT_AND_ROTATE" }
case_family = "boundary_high"
oracle_ref = "SPEC_IEC_STANDARD_FUNCTIONS_001"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "stable_error", status = "unchanged" }
rationale = "NOT, variadic bitwise operations, shifts, and rotations mask to declared width; shifts at or above width zero-fill, negative counts reject, and rotations reduce modulo width."
[[behavior]]
partition = { equals = "ADJACENT_CHAIN_AND_COMMON_TYPE_COMPARISON" }
case_family = "wrong_type_or_shape"
oracle_ref = "SPEC_IEC_STANDARD_FUNCTIONS_001"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "stable_error", status = "unchanged" }
rationale = "Comparison chains compare adjacent pairs in one common type, bit strings widen, incompatible families reject, and non-extensible NE requires two inputs."
[[behavior]]
partition = { equals = "SELECTION_COMMON_TYPE_AND_INDEX" }
case_family = "boundary_high"
oracle_ref = "SPEC_IEC_STANDARD_FUNCTIONS_001"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "stable_error", status = "unchanged" }
rationale = "SEL, MIN, MAX, LIMIT, and zero-based MUX use one common type, validate even unselected inputs, and report both index-range directions."
[[behavior]]
