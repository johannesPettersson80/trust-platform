no_partial_apply = true
delta = { target = "unchanged", siblings = "unchanged", retain = "unchanged", process_image = "unchanged", diagnostics = "expected_diagnostic", status = "unchanged" }
rationale = "A source JMP statement accepted by analysis but unsupported by the bytecode encoder rejects module construction instead of becoming NOP."

[[behavior]]
partition = { equals = "UNSUPPORTED_EXPRESSION_AFTER_VALID_PREFIX" }
case_family = "extra_or_unknown"
oracle_ref = "SPEC_BYTECODE_FORMAT_001#source-to-bytecode-fail-closed-boundary"
