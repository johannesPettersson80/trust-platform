no_partial_apply = true
delta = { target = "unchanged", siblings = "unchanged", retain = "unchanged", process_image = "unchanged", diagnostics = "expected_diagnostic", status = "unchanged" }
rationale = "An executable array-initializer assignment unsupported by the encoder rejects the complete module even after a supported assignment has already emitted bytes."

[[coverage.cells]]
