schema_version = 1
id = "VM_SEAM_SUBRANGE_001"
title = "Subrange writes cannot silently store out-of-range values"
area = "bytecode_vm"
risk = "wrong_result"
status = "spec_gap"
owner = "trust-runtime-core"
last_reviewed = "2026-07-13"
claim = "Runtime writes to subrange-typed storage must reject out-of-range values visibly without modifying the target; unresolved wrong-type and stable-error boundaries remain explicit."
proof_level = "S0"
contract_kind = "decision_table"
source_refs = ["crates/trust-runtime-core/src/value/types.rs"]
tests = [
  "TEST_VM_SUBRANGE_ASSIGNMENT_REJECTION_001",
  "TEST_VM_SUBRANGE_FB_INPUT_REJECTION_001",
  "TEST_VM_SUBRANGE_HMI_WRITE_REJECTION_001",
  "TEST_VM_SUBRANGE_REF_WRITE_REJECTION_001",
  "TEST_VM_SUBRANGE_RETAIN_RELOAD_REJECTION_001",
]
gates = ["veryquick", "pr"]
evidence_refs = []
spec_gap_refs = [
  "SPEC_GAP_VM_VALUE_SEMANTICS_001",
  "SPEC_GAP_VM_ERROR_MODEL_001",
]
missing = [
  "in_range_and_below_min_tests",
  "wrong_type_behavior",
  "stable_error_code",
  "producer_authentic_proof",
]

[input]
name = "value"
type = "INT"
declared = "INT(0..100)"

[spec]
status = "ambiguous"
source_refs = ["SPEC_VM_VALUE_SEMANTICS_001"]

[oracle]
kind = "trust_contract"
ref = "SPEC_GAP_VM_VALUE_SEMANTICS_001"

[[behavior]]
partition = { min = 0, max = 100 }
oracle_ref = "SPEC_VM_VALUE_SEMANTICS_001#subrange-runtime-writes"
outcome = "accept_value"
delta = { target = "set_to_input", siblings = "not_applicable", retain = "not_applicable", process_image = "not_applicable", diagnostics = "none", status = "not_applicable" }
rationale = "The inclusive lower and upper bounds are valid subrange values and are stored without a diagnostic."

[[behavior]]
partition = { below = 0 }
oracle_ref = "SPEC_VM_VALUE_SEMANTICS_001#subrange-runtime-writes"
outcome = "reject"
no_partial_apply = true
delta = { target = "unchanged", siblings = "not_applicable", retain = "not_applicable", process_image = "not_applicable", diagnostics = "expected_diagnostic", status = "not_applicable" }
rationale = "A value below the inclusive lower bound is rejected visibly before target storage changes."

[[behavior]]
partition = { above = 100 }
oracle_ref = "SPEC_VM_VALUE_SEMANTICS_001#subrange-runtime-writes"
outcome = "reject"
no_partial_apply = true
delta = { target = "unchanged", siblings = "not_applicable", retain = "not_applicable", process_image = "not_applicable", diagnostics = "expected_diagnostic", status = "not_applicable" }
rationale = "A value above the inclusive upper bound is rejected visibly before target storage changes."

[[behavior]]
partition = { wrong_type = "REAL" }
spec_gap_ref = "SPEC_GAP_VM_VALUE_SEMANTICS_001"
rationale = "Wrong-type assignment into subrange storage needs the same written value-semantics contract before cases can assert rejection or conversion."

[[coverage.cells]]
dimension = "happy_path"
state = "gap_open"
rationale = "Inclusive in-range behavior is specified, but no runnable mapped boundary test is linked yet."

[[coverage.cells]]
dimension = "above_max"
state = "covered"
rationale = "Mapped runtime tests cover assignment, FB parameter copy-in, dynamic-reference, HMI/control, and retain-reload writes above the declared maximum without claiming a stable error identifier."

[[coverage.cells]]
dimension = "below_min"
state = "gap_open"
rationale = "Below-minimum rejection is specified, but no runnable mapped test is linked yet."

[[coverage.cells]]
dimension = "wrong_type_or_shape"
state = "spec_gap"
rationale = "Wrong-type subrange writes must be specified before negative cases can assert conversion, rejection, or trap behavior."
spec_gap_ref = "SPEC_GAP_VM_VALUE_SEMANTICS_001"
