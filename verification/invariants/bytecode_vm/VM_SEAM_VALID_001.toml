[oracle]
kind = "trust_contract"
ref = "SPEC_BYTECODE_FORMAT_001"

[[behavior]]
partition = { equals = "TRUNCATED_REQUIRED_CONTAINER_DATA" }
case_family = "missing_required"
oracle_ref = "SPEC_BYTECODE_FORMAT_001#7-4-validator-before-apply"
outcome = "reject"
no_partial_apply = true
delta = { target = "unchanged", siblings = "unchanged", retain = "unchanged", process_image = "unchanged", diagnostics = "expected_diagnostic", status = "unchanged" }
rationale = "A container truncated before its section table or before a declared required payload is rejected before the candidate module changes live runtime state."

[[behavior]]
partition = { equals = "DUPLICATE_STANDARDIZED_SECTION_ID" }
case_family = "extra_or_unknown"
oracle_ref = "SPEC_BYTECODE_FORMAT_001#4-2-section-table-entry"
outcome = "reject"
no_partial_apply = true
delta = { target = "unchanged", siblings = "unchanged", retain = "not_applicable", process_image = "not_applicable", diagnostics = "expected_diagnostic", status = "unchanged" }
rationale = "A second occurrence of any standardized section ID from 0x0001 through 0x000C invalidates the container before first-section selection can create order-dependent semantics."

[[behavior]]
partition = { equals = "UNIMPLEMENTED_RESERVED_LEGACY_OR_UNKNOWN_OPCODE" }
case_family = "extra_or_unknown"
oracle_ref = "SPEC_BYTECODE_FORMAT_001#7-4-validator-before-apply"
outcome = "reject"
no_partial_apply = true
delta = { target = "unchanged", siblings = "unchanged", retain = "unchanged", process_image = "unchanged", diagnostics = "expected_diagnostic", status = "unchanged" }
rationale = "Legacy, proposed, reserved, and vendor opcode values remain invalid until the accepted bytecode version implements them explicitly."

[[behavior]]
partition = { equals = "UNKNOWN_OPTIONAL_SECTION_FLAGS_ZERO" }
case_family = "extra_or_unknown"
oracle_ref = "SPEC_BYTECODE_FORMAT_001#4-2-section-table-entry"
outcome = "accept_value"
delta = { target = "unchanged", siblings = "unchanged", retain = "unchanged", process_image = "unchanged", diagnostics = "none", status = "unchanged" }
rationale = "An unknown STBC 1.x section with flags zero is preserved as uninterpreted bytes and ignored by validation and runtime apply."

[[behavior]]
partition = { equals = "JUMP_OUTSIDE_POU_OR_INSTRUCTION_BOUNDARY" }
case_family = "wrong_type_or_shape"
oracle_ref = "SPEC_BYTECODE_FORMAT_001#7-4-validator-before-apply"
outcome = "reject"
no_partial_apply = true
delta = { target = "unchanged", siblings = "unchanged", retain = "unchanged", process_image = "unchanged", diagnostics = "expected_diagnostic", status = "unchanged" }
rationale = "A relative jump outside its POU or into an operand byte is rejected before execution."

[[behavior]]
partition = { equals = "INVALID_OPERAND_STACK_DATAFLOW" }
case_family = "wrong_type_or_shape"
oracle_ref = "SPEC_BYTECODE_FORMAT_001#7-4-validator-before-apply"
outcome = "reject"
no_partial_apply = true
delta = { target = "unchanged", siblings = "unchanged", retain = "unchanged", process_image = "unchanged", diagnostics = "expected_diagnostic", status = "unchanged" }
rationale = "Stack underflow, incompatible merge depth or shape, and non-empty normal exits are rejected during validation."

[[behavior]]
partition = { equals = "IMPLEMENTED_OPCODE_SET" }
case_family = "happy_path"
oracle_ref = "SPEC_BYTECODE_FORMAT_001#7-3-accepted-instruction-set"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "unchanged", process_image = "unchanged", diagnostics = "none", status = "unchanged" }
rationale = "Every opcode implemented by the accepted bytecode version passes complete operand and runtime-support validation."

[[behavior]]
partition = { equals = "INVALID_SECTION_RANGE_OR_METADATA_REFERENCE" }
case_family = "wrong_type_or_shape"
oracle_ref = "SPEC_BYTECODE_FORMAT_001#7-4-validator-before-apply"
outcome = "reject"
no_partial_apply = true
delta = { target = "unchanged", siblings = "unchanged", retain = "unchanged", process_image = "unchanged", diagnostics = "expected_diagnostic", status = "unchanged" }
rationale = "Out-of-bounds or overlapping sections and incompatible debug or variable metadata references reject the complete candidate before apply."

[[behavior]]
partition = { equals = "INVALID_VAR_META_UNIQUENESS_OR_LOCAL_STATE" }
case_family = "wrong_type_or_shape"
oracle_ref = "SPEC_BYTECODE_FORMAT_001#6-11-var-meta-0x000b-optional"
outcome = "reject"
no_partial_apply = true
delta = { target = "unchanged", siblings = "unchanged", retain = "unchanged", process_image = "unchanged", diagnostics = "expected_diagnostic", status = "unchanged" }
rationale = "Duplicate reference or textual-name metadata and local entries carrying retain or initializer state are rejected instead of creating order-dependent or persistent local state."

