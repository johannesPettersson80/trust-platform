area = "bytecode_vm"
risk = "wrong_result"
status = "planned"
owner = "trust-runtime"
last_reviewed = "2026-07-27"
claim = "Runtime standard conversions preserve the reviewed rounding, transfer, date/time, character, text, and BCD results while non-finite text-to-real input is rejected without an overclaimed error variant."
proof_level = "S0"
contract_kind = "decision_table"
source_refs = ["docs/specs/07-standard-functions.md", "crates/trust-runtime/src/stdlib/conversions"]
