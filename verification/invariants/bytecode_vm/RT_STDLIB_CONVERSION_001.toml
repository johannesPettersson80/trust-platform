[spec]
status = "specified"
source_refs = ["SPEC_IEC_STANDARD_FUNCTIONS_001"]

[oracle]
kind = "trust_contract"
ref = "SPEC_IEC_STANDARD_FUNCTIONS_001#2-type-conversion-functions-tables-22-27"

[[behavior]]
partition = { equals = "ROUND_TO_NEAREST_TIES_EVEN" }
case_family = "happy_path"
oracle_ref = "SPEC_IEC_STANDARD_FUNCTIONS_001#21-numeric-conversions"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "unchanged", process_image = "unchanged", diagnostics = "none", status = "unchanged" }
rationale = "The reviewed REAL_TO_INT values 1.4, 1.6, 3.9, -1.6, 1.5, and 2.5 produce INT#1, INT#2, INT#4, INT#-2, INT#2, and INT#2; REAL#-2.5 produces INT#-2."

[[behavior]]
partition = { equals = "TRUNCATION_AND_NUMERIC_WIDENING" }
case_family = "happy_path"
oracle_ref = "SPEC_IEC_STANDARD_FUNCTIONS_001#21-numeric-conversions"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "unchanged", process_image = "unchanged", diagnostics = "none", status = "unchanged" }
rationale = "TRUNC_INT(REAL#1.6) returns INT#1, LREAL_TO_DINT(LREAL#42.0) returns DINT#42, and the reviewed integer-to-real conversions preserve -7 and 4 exactly."

[[behavior]]
partition = { equals = "BOOLEAN_AND_INTEGER_WIDTH_CONVERSION" }
case_family = "happy_path"
oracle_ref = "SPEC_IEC_STANDARD_FUNCTIONS_001#21-numeric-conversions"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "unchanged", process_image = "unchanged", diagnostics = "none", status = "unchanged" }
rationale = "BOOL_TO_INT(TRUE) returns INT#1, INT_TO_DINT(INT#5) returns DINT#5, and DINT_TO_INT(DINT#7) returns INT#7."

[[behavior]]
partition = { equals = "BIT_WIDTH_TRANSFER" }
case_family = "happy_path"
oracle_ref = "SPEC_IEC_STANDARD_FUNCTIONS_001#22-bit-data-type-conversions-table-24"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "unchanged", process_image = "unchanged", diagnostics = "none", status = "unchanged" }
rationale = "WORD#16#1234 narrows to BYTE#16#34, BYTE#16#12 widens to WORD#16#0012, SINT#18 transfers to WORD#16#0012, and WORD#16#1234 transfers to SINT#16#34."

[[behavior]]
partition = { equals = "REAL_BINARY_TRANSFER" }
case_family = "happy_path"
oracle_ref = "SPEC_IEC_STANDARD_FUNCTIONS_001#23-bitnumeric-conversions-table-25"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "unchanged", process_image = "unchanged", diagnostics = "none", status = "unchanged" }
rationale = "REAL#1.0 converts to its exact DWORD bit representation and that DWORD converts back to REAL#1.0."

[[behavior]]
partition = { equals = "DATE_TIME_AND_DURATION_CONVERSION" }
case_family = "happy_path"
oracle_ref = "SPEC_IEC_STANDARD_FUNCTIONS_001#24-date-and-time-conversions-table-26"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "unchanged", process_image = "unchanged", diagnostics = "none", status = "unchanged" }
rationale = "The reviewed DT, DATE, TOD, LDT, and LTOD conversions preserve epoch-based component values, while TIME_TO_DWORD and DWORD_TO_TIME preserve 0 ms and 123 ms."

