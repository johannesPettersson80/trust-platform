schema_version = 1
id = "RT_LITERAL_MATERIALIZATION_002"
title = "Runtime literal materialization preserves IEC value and tag identity"
area = "bytecode_vm"
risk = "wrong_result"
status = "specified"
owner = "trust-runtime"
last_reviewed = "2026-08-01"
claim = "Runtime literal materialization preserves numeric, Boolean, string, duration, date, time-of-day, and date-time value identity and rejects invalid prefixes, ranges, and calendar components."
proof_level = "S0"
contract_kind = "decision_table"
source_refs = ["docs/specs/01-lexical-elements.md", "docs/specs/10-runtime-semantics.md", "crates/trust-runtime/tests/lexical_literal_runtime_contract.rs"]
tests = []
gates = ["veryquick", "pr"]
evidence_refs = []
spec_gap_refs = []
missing = ["catalog_mapping", "focused_execution_evidence", "assertion_reachability", "mutation_sensitivity", "broad_remote_gate"]
[spec]
status = "specified"
source_refs = ["SPEC_IEC_LEXICAL_ELEMENTS_001", "SPEC_RUNTIME_SEMANTICS_001"]
[oracle]
kind = "trust_contract"
ref = "SPEC_IEC_LEXICAL_ELEMENTS_001#7-numeric-literals-table-5-section-632"

[[behavior]]
partition = { equals = "DECIMAL_BASED_SEPARATOR_VALUE" }
case_family = "encoding_or_unicode"
oracle_ref = "SPEC_IEC_LEXICAL_ELEMENTS_001#7-numeric-literals-table-5-section-632"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "none", status = "unchanged" }
rationale = "Decimal and based integer separators are ignored only at legal positions and materialize the exact mathematical value."
[[behavior]]
partition = { equals = "TYPED_INTEGER_BIT_AND_BOOLEAN_TAG" }
case_family = "happy_path"
oracle_ref = "SPEC_IEC_LEXICAL_ELEMENTS_001#7-numeric-literals-table-5-section-632"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "none", status = "unchanged" }
rationale = "Signed integers, bit strings, and Boolean typed literals retain their declared runtime tag and exact admitted value."
[[behavior]]
partition = { equals = "UNKNOWN_OR_OUT_OF_RANGE_TYPED_LITERAL" }
case_family = "wrong_type_or_shape"
oracle_ref = "SPEC_IEC_LEXICAL_ELEMENTS_001#7-numeric-literals-table-5-section-632"
outcome = "reject"
no_partial_apply = true
delta = { target = "unchanged", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "stable_error", status = "unchanged" }
rationale = "Unknown type prefixes, integer payloads outside the declared width, and numeric Boolean payloads other than zero or one reject."
[[behavior]]
partition = { equals = "NARROW_AND_WIDE_STRING_ESCAPE_ORDER" }
case_family = "encoding_or_unicode"
oracle_ref = "SPEC_IEC_LEXICAL_ELEMENTS_001#8-character-string-literals-table-6-section-633"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "none", status = "unchanged" }
rationale = "Narrow escapes decode in source order and wide escapes preserve their Unicode code-unit value."
[[behavior]]
partition = { equals = "SIGNED_COMPOSITE_DURATION" }
case_family = "boundary_high"
oracle_ref = "SPEC_IEC_LEXICAL_ELEMENTS_001#10-duration-literals-table-8-section-634"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "none", status = "unchanged" }
rationale = "The sign applies to the complete duration, a fraction is exact on the least-significant unit, and the most-significant unit may carry into larger units."
[[behavior]]
partition = { equals = "GREGORIAN_DATE_ALIAS_AND_VALIDITY" }
case_family = "time_or_clock_fault"
oracle_ref = "SPEC_IEC_LEXICAL_ELEMENTS_001#11-date-and-time-literals-table-9-section-635"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "stable_error", status = "unchanged" }
rationale = "DATE prefixes are aliases for one value; Gregorian leap-year and month-length rules accept valid dates and reject invalid days including nonleap February 29."
[[behavior]]
partition = { equals = "TIME_OF_DAY_ALIAS_AND_COMPONENT_BOUNDS" }
case_family = "time_or_clock_fault"
oracle_ref = "SPEC_IEC_LEXICAL_ELEMENTS_001#11-date-and-time-literals-table-9-section-635"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "stable_error", status = "unchanged" }
rationale = "Time-of-day prefixes are aliases and hour 24, minute 60, or second 60 reject rather than rolling into another day."
[[behavior]]
partition = { equals = "DATE_TIME_ALIAS_AND_COMPONENT_VALIDATION" }
case_family = "time_or_clock_fault"
oracle_ref = "SPEC_IEC_LEXICAL_ELEMENTS_001#11-date-and-time-literals-table-9-section-635"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "stable_error", status = "unchanged" }
rationale = "Date-time prefixes are aliases and invalid date or clock components reject the complete value."
[[behavior]]
partition = { equals = "FINITE_REAL_DECIMAL_EXPONENT" }
case_family = "happy_path"
oracle_ref = "SPEC_IEC_LEXICAL_ELEMENTS_001#7-numeric-literals-table-5-section-632"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "none", status = "unchanged" }
rationale = "A real exponent applies the exact decimal power before finite runtime materialization."

