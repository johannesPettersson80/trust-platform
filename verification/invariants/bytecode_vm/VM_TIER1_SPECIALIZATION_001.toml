schema_version = 1
id = "VM_TIER1_SPECIALIZATION_001"
title = "Tier-1 specialization accepts only semantics-preserving blocks"
area = "bytecode_vm"
risk = "wrong_result"
status = "planned"
owner = "trust-runtime"
last_reviewed = "2026-07-26"
claim = "Tier-1 compilation accepts reviewed register blocks with equivalent values, traps, branches, references, calls, and instruction costs, or declines before mutation."
proof_level = "S0"
contract_kind = "decision_table"
source_refs = ["crates/trust-runtime/src/runtime/vm/register_ir/tier1"]
tests = []
gates = ["pr"]
evidence_refs = []
spec_gap_refs = []
missing = ["catalog_mapping", "assertion_reachability", "mutation_sensitivity", "broad_remote_gate"]

[spec]
status = "specified"
source_refs = ["SPEC_BYTECODE_FORMAT_001"]

[oracle]
kind = "trust_contract"
ref = "SPEC_BYTECODE_FORMAT_001#tier-1-specialization"

[[behavior]]
partition = { equals = "REVIEWED_BLOCK_EXECUTION" }
case_family = "happy_path"
oracle_ref = "SPEC_BYTECODE_FORMAT_001#tier-1-specialization"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "unchanged", process_image = "expected_delta", diagnostics = "none", status = "unchanged" }
rationale = "Accepted arithmetic, comparison, boolean, and reference blocks preserve register-interpreter results and traps."

[[behavior]]
partition = { equals = "GUARD_MISMATCH_DECLINES" }
case_family = "wrong_type_or_shape"
oracle_ref = "SPEC_BYTECODE_FORMAT_001#tier-1-specialization"
outcome = "reject"
no_partial_apply = true
delta = { target = "unchanged", siblings = "unchanged", retain = "unchanged", process_image = "unchanged", diagnostics = "none", status = "unchanged" }
rationale = "A specialization guard mismatch declines the block before mutation rather than reinterpreting unsupported operands."

[[behavior]]
partition = { equals = "FUNCTION_AND_FUNCTION_BLOCK_CALLS" }
case_family = "ordering_or_lifecycle"
oracle_ref = "SPEC_BYTECODE_FORMAT_001#tier-1-specialization"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "unchanged", process_image = "expected_delta", diagnostics = "none", status = "unchanged" }
rationale = "Accepted function, native, and function-block calls preserve argument, result, and instance-state semantics."

[[behavior]]
partition = { equals = "DYNAMIC_SELF_AND_SUPER_REFERENCES" }
case_family = "happy_path"
oracle_ref = "SPEC_BYTECODE_FORMAT_001#tier-1-specialization"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "unchanged", process_image = "expected_delta", diagnostics = "none", status = "unchanged" }
rationale = "Accepted dynamic, self-field, inherited-super, and array reference forms preserve the register interpreter's location and null-reference behavior."

[[coverage.cells]]
dimension = "happy_path"
state = "gap_open"
rationale = "Reviewed arithmetic, boolean, and reference specialization assertions await generated catalog mapping."

[[coverage.cells]]
dimension = "wrong_type_or_shape"
state = "gap_open"
rationale = "Reviewed guard-decline assertions await generated catalog mapping."

[[coverage.cells]]
dimension = "ordering_or_lifecycle"
state = "gap_open"
rationale = "Reviewed call-specialization assertions await generated catalog mapping."
