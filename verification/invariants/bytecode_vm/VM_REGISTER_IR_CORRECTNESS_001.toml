schema_version = 1
id = "VM_REGISTER_IR_CORRECTNESS_001"
title = "Register-IR lowering and fusion preserve verified bytecode meaning"
area = "bytecode_vm"
risk = "wrong_result"
status = "planned"
owner = "trust-runtime"
last_reviewed = "2026-07-26"
claim = "Register-IR lowering preserves control flow, stack semantics, operands, register definitions, fusion dependencies, and original instruction costs, rejecting malformed IR before execution."
proof_level = "S0"
contract_kind = "decision_table"
source_refs = ["crates/trust-runtime/src/runtime/vm/register_ir/lowering", "crates/trust-runtime/src/runtime/vm/register_ir/verify.rs"]
tests = []
gates = ["pr"]
evidence_refs = []
spec_gap_refs = []
missing = ["catalog_mapping", "assertion_reachability", "mutation_sensitivity", "broad_remote_gate"]

[spec]
status = "specified"
source_refs = ["SPEC_BYTECODE_FORMAT_001"]

[oracle]
kind = "trust_contract"
ref = "SPEC_BYTECODE_FORMAT_001#register-ir-lowering-verification-and-fusion"

[[behavior]]
partition = { equals = "CONTROL_FLOW_AND_STACK_LOWERING" }
case_family = "ordering_or_lifecycle"
oracle_ref = "SPEC_BYTECODE_FORMAT_001#register-ir-lowering-verification-and-fusion"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "unchanged", process_image = "unchanged", diagnostics = "none", status = "not_applicable" }
rationale = "Leaders, branches, loops, RETURN, CASE selectors, and stack normalization preserve bytecode control-flow and merge-depth semantics."

[[behavior]]
partition = { equals = "INVALID_IR_REJECTED" }
case_family = "wrong_type_or_shape"
oracle_ref = "SPEC_BYTECODE_FORMAT_001#register-ir-lowering-verification-and-fusion"
outcome = "reject"
no_partial_apply = true
delta = { target = "unchanged", siblings = "unchanged", retain = "unchanged", process_image = "unchanged", diagnostics = "stable_error", status = "not_applicable" }
rationale = "Underflow, conflicting merge depths, invalid block targets, undefined reads, out-of-range destinations, and invalid cost metadata reject before execution."

[[behavior]]
partition = { equals = "COMPLETE_FUSION_WINDOW" }
case_family = "happy_path"
oracle_ref = "SPEC_BYTECODE_FORMAT_001#register-ir-lowering-verification-and-fusion"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "unchanged", process_image = "unchanged", diagnostics = "none", status = "not_applicable" }
rationale = "A complete reviewed fusion preserves operands, read dependencies, guarded branch behavior, faults, and the surrounding instruction sequence."

[[behavior]]
partition = { equals = "ORIGINAL_INSTRUCTION_COST_ACCOUNTING" }
case_family = "resource_limit"
oracle_ref = "SPEC_BYTECODE_FORMAT_001#register-ir-lowering-verification-and-fusion"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "unchanged", process_image = "unchanged", diagnostics = "none", status = "not_applicable" }
rationale = "Lowered and fused operations retain the exact sum of the original bytecode instruction costs."

[[behavior]]
partition = { equals = "UNSUPPORTED_LOWERING_PRESERVES_FALLBACK_OPERANDS" }
case_family = "extra_or_unknown"
oracle_ref = "SPEC_BYTECODE_FORMAT_001#register-ir-lowering-verification-and-fusion"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "unchanged", siblings = "unchanged", retain = "unchanged", process_image = "unchanged", diagnostics = "expected_diagnostic", status = "not_applicable" }
rationale = "Unsupported lowering preserves the complete original operands so canonical execution can restart before mutation."

