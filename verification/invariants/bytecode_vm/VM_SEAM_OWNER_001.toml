schema_version = 1
id = "VM_SEAM_OWNER_001"
title = "Bytecode instance ownership is explicit or rejected"
area = "bytecode_vm"
risk = "silent_corruption"
status = "implemented"
owner = "trust-runtime-core"
last_reviewed = "2026-07-17"
claim = "A bytecode POU body must either declare an unambiguous instance owner or fail validation before stale absolute instance IDs can be executed."
proof_level = "G1"
contract_kind = "decision_table"
source_refs = ["crates/trust-runtime/src/bytecode/validate", "crates/trust-runtime-core/src/vm"]
tests = [
  "TEST_BYTECODE_OWNER_PRODUCT_REJECTION_001",
  "TEST_BYTECODE_OWNER_VALIDATOR_REJECTION_001",
  "TEST_BYTECODE_OWNER_SHARED_FRAME_REJECTION_001",
  "TEST_VM_OWNER_TRACE_001",
]
gates = ["veryquick", "pr"]
evidence_refs = [
  "EVID_TEST_VM_OWNER_TRACE_001_LOCK_BASELINE",
  "EVID_TEST_VM_OWNER_TRACE_001_LOCK_COMPARE",
]
spec_gap_refs = []
missing = ["broad_remote_gate"]

[input]
name = "pou_reference_table"
type = "trust bytecode references"
declared = "POU owner relationship"

[spec]
status = "specified"
source_refs = ["SPEC_BYTECODE_FORMAT_001"]

[oracle]
kind = "trust_contract"
ref = "SPEC_BYTECODE_FORMAT_001"

[[behavior]]
partition = { equals = "LOCAL_RANGES_SHARE_FRAME_OWNER" }
case_family = "duplicate_or_collision"
oracle_ref = "SPEC_BYTECODE_FORMAT_001#validator-before-apply"
outcome = "reject"
no_partial_apply = true
delta = { target = "unchanged", siblings = "unchanged", retain = "unchanged", process_image = "unchanged", diagnostics = "expected_diagnostic", status = "unchanged" }
rationale = "Distinct POU local-reference ranges cannot claim the same frame owner."

[[behavior]]
partition = { equals = "INSTRUCTION_MIXES_INSTANCE_OWNERS" }
case_family = "wrong_type_or_shape"
oracle_ref = "SPEC_BYTECODE_FORMAT_001#validator-before-apply"
outcome = "reject"
no_partial_apply = true
delta = { target = "unchanged", siblings = "unchanged", retain = "unchanged", process_image = "unchanged", diagnostics = "expected_diagnostic", status = "unchanged" }
rationale = "A POU body that uses instance references from more than one explicit owner is rejected before execution."

[[coverage.cells]]
dimension = "wrong_type_or_shape"
state = "covered"
rationale = "The case-backed direct-validator and product-apply runner covers shared frame owners and crafted multi-owner instance references with a current producer-authentic lock comparison."
