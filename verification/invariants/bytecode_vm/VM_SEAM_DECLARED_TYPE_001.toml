  "TEST_VM_DECLARED_DINT_CONVERSION_PATHS_001",
  "TEST_VM_DECLARED_DINT_RUNTIME_TAG_001",
  "TEST_VM_DECLARED_LITERAL_CONTEXT_001",
  "TEST_VM_DECLARED_PARAMETER_COPY_IN_001",
  "TEST_VM_DECLARED_REAL_CONVERSION_PATHS_001",
  "TEST_VM_DECLARED_REAL_RUNTIME_TAG_001",
  "TEST_VM_REAL_BINARY_OVERFLOW_UNIT_001",
  "TEST_VM_REAL_BINARY_OVERFLOW_INTEGRATION_001",
  "TEST_VM_REAL_NAMED_OVERFLOW_DIRECT_001",
