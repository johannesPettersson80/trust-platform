[input]
name = "assignment"
type = "IEC expression"
declared = "target declared type"

[spec]
status = "specified"
source_refs = ["SPEC_VM_VALUE_SEMANTICS_001"]

[oracle]
kind = "trust_contract"
ref = "SPEC_GAP_VM_ERROR_MODEL_001"

[[behavior]]
partition = { equals = "INT_LITERAL_TO_REAL_SLOT" }
case_family = "happy_path"
oracle_ref = "SPEC_VM_VALUE_SEMANTICS_001#declared-type-materialization"
outcome = "accept_value"
delta = { target = "set_to_expected", siblings = "not_applicable", retain = "not_applicable", process_image = "not_applicable", diagnostics = "none", status = "not_applicable" }
rationale = "A compatible INT literal assigned to REAL storage materializes as the declared REAL runtime value before later arithmetic."

[[behavior]]
partition = { equals = "INT_VARIABLE_TO_REAL_SLOT" }
case_family = "happy_path"
oracle_ref = "SPEC_VM_VALUE_SEMANTICS_001#declared-type-materialization"
outcome = "accept_value"
delta = { target = "set_to_expected", siblings = "not_applicable", retain = "not_applicable", process_image = "not_applicable", diagnostics = "none", status = "not_applicable" }
rationale = "A compatible INT variable assigned or copied into REAL storage materializes as Value::Real and preserves REAL arithmetic semantics."

[[behavior]]
partition = { equals = "INT_EXPRESSION_TO_DINT_SLOT" }
case_family = "happy_path"
oracle_ref = "SPEC_VM_VALUE_SEMANTICS_001#declared-type-materialization"
outcome = "accept_value"
delta = { target = "set_to_expected", siblings = "not_applicable", retain = "not_applicable", process_image = "not_applicable", diagnostics = "none", status = "not_applicable" }
rationale = "A compatible INT expression assigned or copied into DINT storage materializes as Value::DInt and preserves DINT arithmetic width."

[[behavior]]
partition = { equals = "COMPATIBLE_LITERAL_INITIALIZER_WIDENING" }
case_family = "happy_path"
oracle_ref = "SPEC_VM_VALUE_SEMANTICS_001#declared-type-materialization"
outcome = "accept_value"
delta = { target = "set_to_expected", siblings = "not_applicable", retain = "not_applicable", process_image = "not_applicable", diagnostics = "none", status = "not_applicable" }
rationale = "A compatible typed literal initializer materializes as the variable's wider declared runtime type."

[[behavior]]
partition = { equals = "COMPATIBLE_TYPED_ASSIGNMENT_WIDENING" }
case_family = "happy_path"
oracle_ref = "SPEC_VM_VALUE_SEMANTICS_001#declared-type-materialization"
outcome = "accept_value"
delta = { target = "set_to_expected", siblings = "not_applicable", retain = "not_applicable", process_image = "not_applicable", diagnostics = "none", status = "not_applicable" }
rationale = "Compatible DINT-to-LINT and REAL-to-LREAL assignments preserve the value and materialize the wider declared runtime type."

[[behavior]]
partition = { equals = "POU_OUTPUT_WIDENING" }
case_family = "happy_path"
oracle_ref = "SPEC_VM_VALUE_SEMANTICS_001#declared-type-materialization"
outcome = "accept_value"
delta = { target = "set_to_expected", siblings = "not_applicable", retain = "not_applicable", process_image = "not_applicable", diagnostics = "none", status = "not_applicable" }
rationale = "A DINT POU output assigned to a LINT caller target materializes as Value::LInt with the same value."

[[behavior]]
partition = { equals = "FUNCTION_RESULT_WIDENING" }
case_family = "happy_path"
oracle_ref = "SPEC_VM_VALUE_SEMANTICS_001#declared-type-materialization"
outcome = "accept_value"
delta = { target = "set_to_expected", siblings = "not_applicable", retain = "not_applicable", process_image = "not_applicable", diagnostics = "none", status = "not_applicable" }
rationale = "A REAL expression assigned to an LREAL function result materializes as Value::LReal before the caller observes it."

[[behavior]]
partition = { wrong_type = "INT_ACTUAL_TO_DINT_INOUT" }
oracle_ref = "SPEC_VM_VALUE_SEMANTICS_001#declared-type-materialization"
outcome = "reject"
delta = { target = "not_applicable", siblings = "not_applicable", retain = "not_applicable", process_image = "not_applicable", diagnostics = "expected_diagnostic", status = "not_applicable" }
rationale = "Implicit conversion is forbidden for VAR_IN_OUT, so an INT actual cannot bind to a DINT formal."

[[behavior]]
partition = { wrong_type = "DINT_TO_INT_NARROWING_ASSIGNMENT" }
oracle_ref = "SPEC_VM_VALUE_SEMANTICS_001#declared-type-materialization"
outcome = "reject"
delta = { target = "not_applicable", siblings = "not_applicable", retain = "not_applicable", process_image = "not_applicable", diagnostics = "expected_diagnostic", status = "not_applicable" }
rationale = "An implicit DINT-to-INT assignment that cannot preserve value and accuracy is rejected unless explicitly converted."

[[behavior]]
partition = { wrong_type = "BOOL_TO_REAL_SLOT" }
oracle_ref = "SPEC_VM_VALUE_SEMANTICS_001#declared-type-materialization"
outcome = "reject"
no_partial_apply = true
delta = { target = "unchanged", siblings = "not_applicable", retain = "not_applicable", process_image = "not_applicable", diagnostics = "expected_diagnostic", status = "not_applicable" }
rationale = "BOOL is not an implicitly compatible numeric source for REAL storage and is rejected before storage."

[[behavior]]
partition = { equals = "ACCURACY_PRESERVING_INTEGER_TO_FLOAT" }
case_family = "happy_path"
oracle_ref = "SPEC_VM_VALUE_SEMANTICS_001#declared-type-materialization"
outcome = "accept_value"
delta = { target = "set_to_expected", siblings = "not_applicable", retain = "not_applicable", process_image = "not_applicable", diagnostics = "none", status = "not_applicable" }
rationale = "SINT and INT may materialize as REAL, while SINT, INT, and DINT may materialize as LREAL because every source value remains exact."

[[behavior]]
partition = { wrong_type = "DINT_TO_REAL_IMPLICIT" }
oracle_ref = "SPEC_VM_VALUE_SEMANTICS_001#declared-type-materialization"
outcome = "reject"
no_partial_apply = true
delta = { target = "unchanged", siblings = "not_applicable", retain = "not_applicable", process_image = "not_applicable", diagnostics = "expected_diagnostic", status = "not_applicable" }
rationale = "Typed DINT-to-REAL requires an explicit conversion because not every DINT value is exactly representable in REAL."

[[behavior]]
partition = { wrong_type = "LINT_TO_LREAL_IMPLICIT" }
oracle_ref = "SPEC_VM_VALUE_SEMANTICS_001#declared-type-materialization"
outcome = "reject"
no_partial_apply = true
delta = { target = "unchanged", siblings = "not_applicable", retain = "not_applicable", process_image = "not_applicable", diagnostics = "expected_diagnostic", status = "not_applicable" }
rationale = "Typed LINT-to-LREAL requires an explicit conversion because not every LINT value is exactly representable in LREAL."

[[behavior]]
partition = { wrong_type = "NONREPRESENTABLE_CONTEXT_INTEGER_TO_REAL" }
oracle_ref = "SPEC_VM_VALUE_SEMANTICS_001#declared-type-materialization"
outcome = "reject"
no_partial_apply = true
delta = { target = "unchanged", siblings = "not_applicable", retain = "not_applicable", process_image = "not_applicable", diagnostics = "expected_diagnostic", status = "not_applicable" }
rationale = "An untyped integer literal that requires rounding in its REAL or LREAL context requires an explicit conversion."

