[oracle]
kind = "trust_contract"
ref = "SPEC_VM_VALUE_SEMANTICS_001#2-5-time-date-representation"

[[behavior]]
partition = { equals = "DURATION_UNIT_CONSTRUCTION" }
case_family = "happy_path"
oracle_ref = "SPEC_VM_VALUE_SEMANTICS_001#2-5-time-date-representation"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "unchanged", process_image = "unchanged", diagnostics = "none", status = "unchanged" }
rationale = "For representable products, duration construction from nanoseconds, microseconds, milliseconds, or seconds stores the corresponding signed nanosecond count; nanosecond and millisecond accessors expose that same stored duration."

[[behavior]]
partition = { equals = "SHORT_DATETIME_TICK_ROUND_TRIP" }
case_family = "happy_path"
oracle_ref = "SPEC_VM_VALUE_SEMANTICS_001#2-5-time-date-representation"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "unchanged", process_image = "unchanged", diagnostics = "none", status = "unchanged" }
rationale = "DATE, TOD, and DT constructors and accessors preserve the exact signed tick count without applying timezone or calendar metadata."

[[behavior]]
partition = { equals = "LONG_DATETIME_NANOSECOND_ROUND_TRIP" }
case_family = "happy_path"
oracle_ref = "SPEC_VM_VALUE_SEMANTICS_001#2-5-time-date-representation"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "unchanged", process_image = "unchanged", diagnostics = "none", status = "unchanged" }
rationale = "LDATE, LTOD, and LDT constructors and accessors preserve their exact signed 64-bit nanosecond count."

[[behavior]]
partition = { equals = "CHECKED_SHORT_TICK_CONVERSION" }
case_family = "wrong_type_or_shape"
oracle_ref = "SPEC_VM_VALUE_SEMANTICS_001#2-7-portable-runtime-value-and-program-model-contracts"
outcome = "reject"
no_partial_apply = true
delta = { target = "unchanged", siblings = "unchanged", retain = "unchanged", process_image = "unchanged", diagnostics = "expected_diagnostic", status = "unchanged" }
rationale = "Checked DATE, TOD, and DT conversion accepts every i64 tick value and returns DateTimeError::OutOfRange for a source outside that range."

[[behavior]]
partition = { equals = "DATE_PLUS_TOD_WITHOUT_TIMEZONE" }
case_family = "happy_path"
oracle_ref = "SPEC_VM_VALUE_SEMANTICS_001#2-7-portable-runtime-value-and-program-model-contracts"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "unchanged", process_image = "unchanged", diagnostics = "none", status = "unchanged" }
rationale = "Combining DATE and TOD without timezone metadata produces DT with the checked sum of their signed tick values."

[[behavior]]
partition = { malformed = "DATE_PLUS_TOD_WITH_TIMEZONE_METADATA" }
coverage_dimension = "wrong_type_or_shape"
oracle_ref = "SPEC_VM_VALUE_SEMANTICS_001#2-7-portable-runtime-value-and-program-model-contracts"
outcome = "reject"
no_partial_apply = true
delta = { target = "unchanged", siblings = "unchanged", retain = "unchanged", process_image = "unchanged", diagnostics = "expected_diagnostic", status = "unchanged" }
rationale = "A DATE-plus-TOD combination carrying a timezone offset is rejected with DateTimeError::TimezoneNotSupported."

[[behavior]]
partition = { equals = "DEFAULT_SHORT_DATETIME_PROFILE" }
case_family = "happy_path"
oracle_ref = "SPEC_VM_VALUE_SEMANTICS_001#2-5-time-date-representation"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "unchanged", process_image = "unchanged", diagnostics = "none", status = "unchanged" }
rationale = "The default short date/time profile exposes epoch tick zero and a one-millisecond resolution."

