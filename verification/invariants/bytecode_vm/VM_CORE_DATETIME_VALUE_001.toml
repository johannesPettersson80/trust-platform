last_reviewed = "2026-07-30"
claim = "Portable duration, short DATE/TOD/DT, and long LDATE/LTOD/LDT values preserve their declared signed representation; checked short tick conversion and DATE-plus-TOD composition reject invalid inputs; and the default short profile uses Unix epoch tick zero with one-millisecond resolution."
proof_level = "S0"
