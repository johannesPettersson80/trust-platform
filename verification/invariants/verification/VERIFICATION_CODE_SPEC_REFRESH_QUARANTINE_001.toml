dimension = "supply_chain_or_artifact_fault"
state = "covered"
rationale = "Focused fixtures reject report count drift, duplicate identities, non-derived fact identities, source-input drift, generated-ID drift, operation-set digest drift, exact-row reconstruction drift, reviewer-role drift, and proposal/fact identity drift."

[[coverage.cells]]
dimension = "extra_or_unknown"
state = "covered"
