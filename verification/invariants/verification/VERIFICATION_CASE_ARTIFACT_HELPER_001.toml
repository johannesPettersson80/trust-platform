schema_version = 1
id = "VERIFICATION_CASE_ARTIFACT_HELPER_001"
title = "Case helper artifacts remain identity-bound and execution-honest"
area = "verification"
risk = "silent_corruption"
status = "mapped"
owner = "verification"
last_reviewed = "2026-07-27"
claim = "The shared verification-case helper binds committed case identity, digest, execution result, snapshots, state delta, provenance, and same-run TRUST_VERIFY stamps without executing blocked or invalid cases."
proof_level = "S0"
contract_kind = "protocol_trace"
source_refs = [
  "docs/internal/testing/checklists/plc-verification-program/metadata-model.md",
  "crates/verification-cases/src/lib.rs",
]
tests = ["TEST_AUTO_1A7BDF97311D84EE779B", "TEST_AUTO_247AAB98DD35F057E1EA", "TEST_AUTO_C932AA981C465EDBACC6"]
gates = ["pr"]
evidence_refs = []
spec_gap_refs = []
missing = ["cataloged_tests", "focused_execution_evidence", "resolved_generated_input_oracles", "final_remote_gate"]

[spec]
status = "specified"
source_refs = ["SPEC_VERIFICATION_PROGRAM_CONTRACT_001"]

[oracle]
kind = "trust_contract"
ref = "SPEC_VERIFICATION_PROGRAM_CONTRACT_001#case-artifact"

[[behavior]]
partition = { equals = "COMMITTED_RELATIVE_CASE_IDENTITY" }
case_family = "happy_path"
oracle_ref = "SPEC_VERIFICATION_PROGRAM_CONTRACT_001#case-artifact"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "not_applicable", process_image = "not_applicable", diagnostics = "none", status = "unchanged" }
rationale = "A workspace-absolute committed case path is recorded as its stable committed-relative identity."

[[behavior]]
partition = { equals = "DEFAULT_OR_STAMPED_ARTIFACT_DIRECTORY" }
case_family = "ordering_or_lifecycle"
oracle_ref = "SPEC_VERIFICATION_PROGRAM_CONTRACT_001#case-artifact"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "not_applicable", process_image = "not_applicable", diagnostics = "none", status = "unchanged" }
rationale = "Standalone runs use the workspace target artifact directory and a complete TRUST_VERIFY directory stamp overrides that default exactly."

[[behavior]]
partition = { equals = "BLOCKED_CASE_WITHOUT_EXECUTION" }
case_family = "missing_required"
oracle_ref = "SPEC_VERIFICATION_PROGRAM_CONTRACT_001#case-artifact"
outcome = "blocked"
no_partial_apply = true
delta = { target = "unchanged", siblings = "unchanged", retain = "not_applicable", process_image = "not_applicable", diagnostics = "stable_error", status = "unchanged" }
rationale = "A blocked case is recorded as blocked without invoking its probe or runner."

[[behavior]]
partition = { equals = "RUNNABLE_CASE_CAPTURE" }
case_family = "happy_path"
oracle_ref = "SPEC_VERIFICATION_PROGRAM_CONTRACT_001#case-artifact"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "expected_delta", retain = "not_applicable", process_image = "not_applicable", diagnostics = "none", status = "unchanged" }
rationale = "A runnable case records execution, observations, snapshots, state delta, and provenance in its artifact."

[[behavior]]
partition = { equals = "DIGEST_OR_SCHEMA_REJECTION" }
case_family = "wrong_type_or_shape"
oracle_ref = "SPEC_VERIFICATION_PROGRAM_CONTRACT_001#case-artifact"
outcome = "reject"
no_partial_apply = true
delta = { target = "unchanged", siblings = "unchanged", retain = "not_applicable", process_image = "not_applicable", diagnostics = "stable_error", status = "unchanged" }
rationale = "A mismatched case digest or unsupported schema version rejects before case execution or artifact creation."

[[behavior]]
partition = { equals = "COMPLETE_TRUST_VERIFY_STAMPS" }
case_family = "ordering_or_lifecycle"
oracle_ref = "SPEC_VERIFICATION_PROGRAM_CONTRACT_001#case-artifact"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "expected_delta", retain = "not_applicable", process_image = "not_applicable", diagnostics = "none", status = "unchanged" }
rationale = "A complete TRUST_VERIFY stamp set is preserved in the in-memory and serialized case artifact."

[[behavior]]
partition = { equals = "PARTIAL_TRUST_VERIFY_STAMPS" }
case_family = "missing_required"
oracle_ref = "SPEC_VERIFICATION_PROGRAM_CONTRACT_001#case-artifact"
outcome = "reject"
no_partial_apply = true
delta = { target = "unchanged", siblings = "unchanged", retain = "not_applicable", process_image = "not_applicable", diagnostics = "stable_error", status = "unchanged" }
rationale = "A partial TRUST_VERIFY environment rejects before execution or artifact creation."

[[behavior]]
partition = { equals = "MISMATCHED_TRUST_VERIFY_BINDING" }
case_family = "wrong_type_or_shape"
oracle_ref = "SPEC_VERIFICATION_PROGRAM_CONTRACT_001#case-artifact"
outcome = "reject"
no_partial_apply = true
delta = { target = "unchanged", siblings = "unchanged", retain = "not_applicable", process_image = "not_applicable", diagnostics = "stable_error", status = "unchanged" }
rationale = "A stamped test ID, case digest, or artifact directory that differs from the active configuration rejects before execution."

[[coverage.cells]]
dimension = "happy_path"
state = "gap_open"
rationale = "Committed identity is ready for mapping; runnable case capture awaits resolution of generated-input helper oracles."

[[coverage.cells]]
dimension = "ordering_or_lifecycle"
state = "gap_open"
rationale = "Artifact-directory selection is ready for mapping; complete stamp capture awaits resolution of generated-input helper oracles."

[[coverage.cells]]
dimension = "missing_required"
state = "gap_open"
rationale = "Blocked and partial-stamp tests await generated-input helper-oracle resolution."

[[coverage.cells]]
dimension = "wrong_type_or_shape"
state = "gap_open"
rationale = "Digest, schema, and stamped-binding rejection tests await generated-input helper-oracle resolution."
