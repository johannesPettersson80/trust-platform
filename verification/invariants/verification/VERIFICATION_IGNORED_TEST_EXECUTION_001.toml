source_refs = ["SPEC_VERIFICATION_INVENTORY_001"]

[oracle]
kind = "release_contract"
ref = "SPEC_VERIFICATION_INVENTORY_001#ignored-test-execution-proof-contract"

[[behavior]]
partition = { equals = "EXACT_IGNORED_REGISTRY_IDENTITY_AND_ROUTING" }
case_family = "happy_path"
oracle_ref = "SPEC_VERIFICATION_INVENTORY_001#ignored-test-execution-proof-contract"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "not_applicable", process_image = "not_applicable", diagnostics = "none", status = "unchanged" }
rationale = "Every cataloged ignored fact joins one exact live registry row and preserves its class, reason, unblock condition, environment, topology, and public-claim fields."

[[behavior]]
partition = { equals = "STRUCTURAL_MAPPING_IS_NOT_PRODUCT_EXECUTION" }
case_family = "ordering_or_lifecycle"
oracle_ref = "SPEC_VERIFICATION_INVENTORY_001#ignored-test-execution-proof-contract"
outcome = "reject"
no_partial_apply = true
delta = { target = "unchanged", siblings = "unchanged", retain = "not_applicable", process_image = "not_applicable", diagnostics = "expected_diagnostic", status = "not_safe_reported" }
rationale = "Registry validation, catalog presence, default-suite filtering, and missing-environment skips cannot be promoted to native product proof."

[[behavior]]
partition = { equals = "NATIVE_ENVIRONMENT_TERMINAL_RESULT_AND_ARTIFACT" }
case_family = "hardware_or_network_fault"
oracle_ref = "SPEC_VERIFICATION_INVENTORY_001#ignored-test-execution-proof-contract"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "not_applicable", process_image = "not_applicable", diagnostics = "none", status = "unchanged" }
rationale = "Manual children run through their parent, performance and soak tests run in their measurement lane, and lab tests run on the reviewed topology with source-bound terminal results and retained artifacts."

[[coverage.cells]]
dimension = "happy_path"
state = "covered"
rationale = "Exact per-discovery catalog bindings cover registry identity and routing; native executions remain explicit downstream proof debt."

[[coverage.cells]]
dimension = "ordering_or_lifecycle"
state = "covered"
rationale = "The invariant preserves the boundary between structural mapping, default-suite skips, and executed product proof."

[[coverage.cells]]
dimension = "hardware_or_network_fault"
state = "covered"
rationale = "Every lab-required row retains its reviewed topology and artifact requirement without claiming an unrun hardware result."
