schema_version = 1
id = "VERIFICATION_FOCUSED_TRACE_CONTROL_PLANE_001"
title = "Focused trace evidence is authenticated and quarantined"
area = "verification"
risk = "silent_corruption"
status = "mapped"
owner = "verification"
last_reviewed = "2026-08-12"
claim = "Focused trace execution, receipt authentication, trace assembly, and mapping-candidate generation fail closed on identity or evidence drift and cannot mutate authority metadata."
proof_level = "S0"
contract_kind = "protocol_trace"
source_refs = [
  "scripts/verification/coverage_trace_cli.py",
  "scripts/verification/coverage_trace_document.py",
  "scripts/verification/focused_trace_receipt.py",
  "scripts/verification/focused_mapping_candidates.py",
]
tests = ["TEST_VERIFICATION_FOCUSED_TRACE_CONTROL_PLANE_001"]
gates = ["veryquick", "pr"]
evidence_refs = []
spec_gap_refs = []
missing = [
  "producer_authentic_focused_execution_evidence",
  "assertion_reachability",
  "mutation_sensitivity",
  "final_remote_gate",
]

[spec]
status = "specified"
source_refs = ["SPEC_VERIFICATION_PROGRAM_CONTRACT_001"]

[oracle]
kind = "trust_contract"
ref = "SPEC_VERIFICATION_PROGRAM_CONTRACT_001#focused-trace-control-plane-contract"

[[behavior]]
partition = { equals = "TRACE_RECEIPT_AUTHENTICATION" }
case_family = "wrong_type_or_shape"
oracle_ref = "SPEC_VERIFICATION_PROGRAM_CONTRACT_001#focused-trace-control-plane-contract"
outcome = "reject"
no_partial_apply = true
delta = { target = "unchanged", siblings = "unchanged", retain = "not_applicable", process_image = "not_applicable", diagnostics = "stable_error", status = "unchanged" }
rationale = "Receipt validation binds the exact request, raw evidence, tools, trace, and covered source bytes; missing, forged, or drifted input rejects."

[[behavior]]
partition = { equals = "FOCUSED_TRACE_EXECUTION" }
case_family = "ordering_or_lifecycle"
oracle_ref = "SPEC_VERIFICATION_PROGRAM_CONTRACT_001#focused-trace-control-plane-contract"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "not_applicable", process_image = "not_applicable", diagnostics = "none", status = "unchanged" }
rationale = "Execution is restricted to the exact requested identities and reuses only complete exact attempts while keeping unsupported identities explicit."

[[behavior]]
partition = { equals = "TRACE_DOCUMENT_ASSEMBLY" }
case_family = "duplicate_or_collision"
oracle_ref = "SPEC_VERIFICATION_PROGRAM_CONTRACT_001#focused-trace-control-plane-contract"
outcome = "reject"
no_partial_apply = true
delta = { target = "unchanged", siblings = "unchanged", retain = "not_applicable", process_image = "not_applicable", diagnostics = "stable_error", status = "unchanged" }
rationale = "Request, attempt, and export sets must be equal and only zero-exit attributed observations may be represented as observed."

[[behavior]]
partition = { equals = "MAPPING_CANDIDATE_QUARANTINE" }
case_family = "auth_or_permission"
oracle_ref = "SPEC_VERIFICATION_PROGRAM_CONTRACT_001#focused-trace-control-plane-contract"
outcome = "reject"
no_partial_apply = true
delta = { target = "unchanged", siblings = "unchanged", retain = "not_applicable", process_image = "not_applicable", diagnostics = "stable_error", status = "unchanged" }
rationale = "Candidate generation is receipt-bound, deterministic, quarantine-only, and has no authority-metadata write capability."

[[behavior]]
partition = { equals = "TRACE_RECEIPT_OUTPUT_COMMIT" }
case_family = "ordering_or_lifecycle"
oracle_ref = "SPEC_VERIFICATION_PROGRAM_CONTRACT_001#focused-trace-control-plane-contract"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "not_applicable", process_image = "not_applicable", diagnostics = "none", status = "unchanged" }
rationale = "A validated receipt is staged, flushed, synchronized, and atomically committed as canonical JSON."

[[behavior]]
partition = { equals = "TRACE_RECEIPT_OUTPUT_COLLISION" }
case_family = "duplicate_or_collision"
oracle_ref = "SPEC_VERIFICATION_PROGRAM_CONTRACT_001#focused-trace-control-plane-contract"
outcome = "reject"
no_partial_apply = true
delta = { target = "unchanged", siblings = "unchanged", retain = "not_applicable", process_image = "not_applicable", diagnostics = "stable_error", status = "unchanged" }
rationale = "A different existing receipt is preserved byte-for-byte and the replacement is rejected without leaving staged output."

[[behavior]]
partition = { equals = "TRACE_OBSERVED_SOURCE_PROJECTION" }
case_family = "ordering_or_lifecycle"
oracle_ref = "SPEC_VERIFICATION_PROGRAM_CONTRACT_001#focused-trace-control-plane-contract"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "not_applicable", process_image = "not_applicable", diagnostics = "stable_error", status = "unchanged" }
rationale = "Observed coverage produces one deterministic source projection, rejects source drift during assembly, and cannot mutate authority metadata."

[[coverage.cells]]
dimension = "wrong_type_or_shape"
state = "gap_open"
rationale = "Focused self-tests are mapped; producer-authentic run evidence remains pending."

[[coverage.cells]]
dimension = "ordering_or_lifecycle"
state = "gap_open"
rationale = "Focused self-tests are mapped; authenticated execution evidence remains pending."

[[coverage.cells]]
dimension = "duplicate_or_collision"
state = "gap_open"
rationale = "Focused self-tests are mapped; assertion-strength evidence remains pending."

[[coverage.cells]]
dimension = "auth_or_permission"
state = "gap_open"
rationale = "Focused self-tests are mapped; quarantine and mutation evidence remain pending."
