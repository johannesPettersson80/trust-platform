schema_version = 1
id = "VERIFICATION_SPEC_SYNC_001"
title = "Specification synchronization checks retain exact reviewed source coverage"
area = "verification"
risk = "false_status"
status = "mapped"
owner = "verification"
last_reviewed = "2026-07-29"
claim = "Governance checks bind their complete immutable source closure and fail when reviewed LSP capabilities, LSP configuration tokens, or standard-library names disappear from their authoritative specification or coverage document."
proof_level = "S0"
contract_kind = "release_matrix"
source_refs = [
  "docs/specs/30-verification-inventory.md",
  "crates/trust-lsp/tests/spec_drift.rs",
  "crates/trust-ide/tests/stdlib_coverage.rs",
]
tests = ["TEST_AUTO_189FCFE72219BBE0FF65", "TEST_AUTO_2750FE1E8A1AEE6DF9CE", "TEST_AUTO_CD7F5ED58A7CDC82E91A"]
gates = ["pr"]
evidence_refs = []
spec_gap_refs = []
missing = ["focused_execution", "assertion_reachability", "mutation_sensitivity", "broad_remote_gate"]

[spec]
status = "specified"
source_refs = ["SPEC_VERIFICATION_INVENTORY_001"]

[oracle]
kind = "trust_contract"
ref = "SPEC_VERIFICATION_INVENTORY_001#specification-synchronization-proof-contract"

[[behavior]]
partition = { equals = "LSP_CAPABILITY_METHOD_SET" }
case_family = "supply_chain_or_artifact_fault"
oracle_ref = "SPEC_VERIFICATION_INVENTORY_001#specification-synchronization-proof-contract"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "not_applicable", process_image = "not_applicable", diagnostics = "none", status = "unchanged" }
rationale = "Every reviewed LSP method remains present in the bound LSP specification source."

[[behavior]]
partition = { equals = "LSP_CONFIGURATION_TOKEN_SET" }
case_family = "supply_chain_or_artifact_fault"
oracle_ref = "SPEC_VERIFICATION_INVENTORY_001#specification-synchronization-proof-contract"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "not_applicable", process_image = "not_applicable", diagnostics = "none", status = "unchanged" }
rationale = "Every reviewed indexing and diagnostics configuration token remains present in the bound LSP specification source."

[[behavior]]
partition = { equals = "STDLIB_COVERAGE_NAME_SET" }
case_family = "supply_chain_or_artifact_fault"
oracle_ref = "SPEC_VERIFICATION_INVENTORY_001#specification-synchronization-proof-contract"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "not_applicable", process_image = "not_applicable", diagnostics = "none", status = "unchanged" }
rationale = "Every reviewed exported standard function and function block remains represented in the bound coverage document."

[[coverage.cells]]
dimension = "supply_chain_or_artifact_fault"
state = "covered"
rationale = "Accepted catalog mappings bind reviewed assertions to every supply_chain_or_artifact_fault behavior in VERIFICATION_SPEC_SYNC_001; dynamic proof and broad remote validation remain explicit debt."
