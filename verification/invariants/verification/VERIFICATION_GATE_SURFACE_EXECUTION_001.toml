[oracle]
kind = "release_contract"
ref = "SPEC_VERIFICATION_INVENTORY_001#gate-and-workflow-surface-proof-contract"

[[behavior]]
partition = { equals = "EXACT_GATE_INVENTORY_IDENTITY_AND_ROUTING" }
case_family = "happy_path"
oracle_ref = "SPEC_VERIFICATION_INVENTORY_001#gate-and-workflow-surface-proof-contract"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "not_applicable", process_image = "not_applicable", diagnostics = "none", status = "unchanged" }
rationale = "Every cataloged gate fact joins one exact live inventory surface and preserves its command role, suite routing, environment, enforcement, and artifact fields."

[[behavior]]
partition = { equals = "SOURCE_BOUND_NATIVE_TERMINAL_RESULT" }
case_family = "ordering_or_lifecycle"
oracle_ref = "SPEC_VERIFICATION_INVENTORY_001#gate-and-workflow-surface-proof-contract"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "not_applicable", process_image = "not_applicable", diagnostics = "none", status = "unchanged" }
rationale = "An assigned surface becomes executed proof only from its complete native command or workflow-job result on the bound source revision."

[[behavior]]
partition = { equals = "WEAKER_POSTURE_CANNOT_ESCALATE_TO_REQUIRED_PROOF" }
case_family = "supply_chain_or_artifact_fault"
oracle_ref = "SPEC_VERIFICATION_INVENTORY_001#gate-and-workflow-surface-proof-contract"
outcome = "reject"
no_partial_apply = true
delta = { target = "unchanged", siblings = "unchanged", retain = "not_applicable", process_image = "not_applicable", diagnostics = "expected_diagnostic", status = "not_safe_reported" }
rationale = "Conditional, supporting, report-only, advisory, and excluded surfaces retain their declared posture even when cataloged or observed passing."

[[behavior]]
partition = { equals = "DECLARED_ARTIFACT_SOURCE_AND_RESULT_BINDING" }
case_family = "supply_chain_or_artifact_fault"
oracle_ref = "SPEC_VERIFICATION_INVENTORY_001#gate-and-workflow-surface-proof-contract"
outcome = "reject"
no_partial_apply = true
delta = { target = "unchanged", siblings = "unchanged", retain = "not_applicable", process_image = "not_applicable", diagnostics = "expected_diagnostic", status = "not_safe_reported" }
rationale = "Declared evidence must bind the exact source, surface, terminal result, path, and retention posture; stale, missing, or cross-revision evidence cannot close the gate."

