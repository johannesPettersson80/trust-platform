claim = "Every public platform support claim must map to a release artifact, CI job, smoke proof, or explicit unsupported boundary."
proof_level = "G1"
contract_kind = "protocol_trace"
source_refs = ["README.md", ".github/workflows"]
tests = ["TEST_RELEASE_PLATFORM_MATRIX_TRACE_001"]
