schema_version = 1
id = "REL_RELEASE_EVIDENCE_GUARD_001"
title = "Release evidence guards bind one exact release identity"
area = "release"
risk = "false_status"
status = "mapped"
owner = "release"
last_reviewed = "2026-08-12"
claim = "Release preflight and publication guards accept only aligned manifests and one exact annotated-tag, SHA, main-push workflow, published release, Latest marker, and unique required asset set."
proof_level = "S0"
contract_kind = "protocol_trace"
source_refs = [
  "scripts/check_release_version_alignment.py",
  "scripts/check_release_tag_preflight.py",
  "scripts/check_version_release_evidence.py",
  "scripts/release_evidence_contract.py",
  "scripts/release_evidence_contract_gate.sh",
]
tests = ["TEST_RELEASE_EVIDENCE_CONTRACT_GUARD_001"]
gates = ["veryquick", "pr"]
evidence_refs = []
spec_gap_refs = []
missing = ["targeted_lock_proof", "assertion_reachability", "mutation_sensitivity", "broad_remote_gate"]

[spec]
status = "specified"
source_refs = ["SPEC_RELEASE_EVIDENCE_001"]

[oracle]
kind = "release_contract"
ref = "SPEC_RELEASE_EVIDENCE_001#artifact-and-version-provenance"

[[behavior]]
partition = { equals = "EXACT_RELEASE_EVIDENCE_GUARDS" }
case_family = "happy_path"
oracle_ref = "SPEC_RELEASE_EVIDENCE_001#artifact-and-version-provenance"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "not_applicable", process_image = "not_applicable", diagnostics = "none", status = "unchanged" }
rationale = "Manifest versions align and the annotated tag, checked-out SHA, successful exact-main workflow, published release, Latest marker, and unique required assets bind one release identity."

[[behavior]]
partition = { equals = "MALFORMED_OR_NONEXACT_RELEASE_EVIDENCE" }
case_family = "supply_chain_or_artifact_fault"
oracle_ref = "SPEC_RELEASE_EVIDENCE_001#artifact-and-version-provenance"
outcome = "reject"
no_partial_apply = true
delta = { target = "unchanged", siblings = "unchanged", retain = "not_applicable", process_image = "not_applicable", diagnostics = "stable_error", status = "not_safe_reported" }
rationale = "Missing, malformed, duplicated, wrong-event, wrong-branch, wrong-SHA, or otherwise non-exact release evidence fails closed without certifying publication."

[[coverage.cells]]
dimension = "happy_path"
state = "covered"
rationale = "The focused release evidence contract gate contains accepted aligned-manifest and exact-identity assertions; dynamic lock proof remains explicit debt."

[[coverage.cells]]
dimension = "supply_chain_or_artifact_fault"
state = "covered"
rationale = "The focused release evidence contract gate contains malformed, duplicated, and non-exact evidence rejection assertions; dynamic lock proof remains explicit debt."
