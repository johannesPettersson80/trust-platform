[[behavior]]
partition = { equals = "ENVELOPE_CORRELATION_AND_COMPATIBILITY" }
case_family = "happy_path"
oracle_ref = "SPEC_DEBUG_ADAPTER_001#dap-json-wire-schema"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "unchanged", process_image = "unchanged", diagnostics = "none", status = "unchanged" }
rationale = "Request, response, and event envelopes emit canonical discriminators and correlation fields while accepting only the documented legacy response alias."

[[behavior]]
partition = { equals = "CUSTOM_IO_AND_VARIABLE_STATE" }
case_family = "happy_path"
oracle_ref = "SPEC_DEBUG_ADAPTER_001#dap-json-wire-schema"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "unchanged", process_image = "unchanged", diagnostics = "none", status = "unchanged" }
rationale = "I/O and variable snapshots preserve required collections, force state, stable instance identity, and optional scan/frame state."

[[behavior]]
partition = { equals = "CUSTOM_MUTATION_ARGUMENTS" }
case_family = "wrong_type_or_shape"
oracle_ref = "SPEC_DEBUG_ADAPTER_001#dap-json-wire-schema"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "unchanged", process_image = "unchanged", diagnostics = "none", status = "unchanged" }
rationale = "Custom I/O and variable mutations retain their required address, value, scope, and name fields with lowercase action/scope discriminators."

[[behavior]]
partition = { equals = "STANDARD_SESSION_AND_INSPECTION_PAYLOADS" }
case_family = "happy_path"
oracle_ref = "SPEC_DEBUG_ADAPTER_001#dap-json-wire-schema"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "unchanged", process_image = "unchanged", diagnostics = "none", status = "unchanged" }
rationale = "Initialize, lifecycle, run-control, stack, scope, variable, evaluate, and mutation payloads use exact DAP lower-camel-case fields and preserve explicit zero values."

[[behavior]]
partition = { equals = "BREAKPOINT_AND_RELOAD_PAYLOADS" }
case_family = "ordering_or_lifecycle"
oracle_ref = "SPEC_DEBUG_ADAPTER_001#dap-json-wire-schema"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "unchanged", process_image = "unchanged", diagnostics = "none", status = "unchanged" }
rationale = "Breakpoint requests, results, locations, and reload arguments preserve required source identity, positions, verification state, and optional replacement inputs."

[[behavior]]
partition = { equals = "MISSING_REQUIRED_OR_INVALID_ENUM" }
case_family = "missing_required"
oracle_ref = "SPEC_DEBUG_ADAPTER_001#dap-json-wire-schema"
outcome = "reject"
no_partial_apply = true
delta = { target = "unchanged", siblings = "unchanged", retain = "unchanged", process_image = "unchanged", diagnostics = "stable_error", status = "unchanged" }
rationale = "Missing required fields, wrong JSON shapes, and unsupported message, scope, or action spellings fail deserialization instead of fabricating defaults."

