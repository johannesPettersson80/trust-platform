schema_version = 1
id = "LSP_TELEMETRY_TRANSACTION_002"
title = "LSP telemetry aggregates and reconfigures without silent loss"
area = "editor_safety"
risk = "false_status"
status = "specified"
owner = "trust-lsp"
last_reviewed = "2026-08-01"
claim = "Opt-in telemetry preserves the stable non-sensitive event vocabulary, clamped saturating aggregate math, append-only record schema, threshold and explicit flush lifecycle, and retry-visible reconfiguration failures without discarding samples."
proof_level = "S0"
contract_kind = "state_machine"
source_refs = ["docs/specs/14-lsp.md", "crates/trust-lsp/src/telemetry.rs", "crates/trust-lsp/src/telemetry/contract_tests.rs"]
tests = []
gates = ["veryquick", "pr"]
evidence_refs = []
spec_gap_refs = []
missing = ["catalog_mapping", "focused_execution_evidence", "assertion_reachability", "mutation_sensitivity", "broad_remote_gate"]
[spec]
status = "specified"
source_refs = ["SPEC_LSP_CONTRACT_001"]
[oracle]
kind = "trust_contract"
ref = "SPEC_LSP_CONTRACT_001#763-persisted-and-external-input-integrity"

[[behavior]]
partition = { equals = "STABLE_NON_SENSITIVE_EVENT_VOCABULARY" }
case_family = "happy_path"
oracle_ref = "SPEC_LSP_CONTRACT_001#763-persisted-and-external-input-integrity"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "none", status = "unchanged" }
rationale = "The complete event identity set is stable and the aggregate schema contains no source, path, symbol, message, endpoint, token, or user data."
[[behavior]]
partition = { equals = "FIRST_AND_REPEATED_AGGREGATE_MATH" }
case_family = "ordering_or_lifecycle"
oracle_ref = "SPEC_LSP_CONTRACT_001#763-persisted-and-external-input-integrity"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "none", status = "unchanged" }
rationale = "First sample sets count, total, min, and max; later samples update each field and event identities aggregate independently."
[[behavior]]
partition = { equals = "SATURATING_COUNT_TOTAL_AND_CLAMPED_DURATION" }
case_family = "resource_limit"
oracle_ref = "SPEC_LSP_CONTRACT_001#763-persisted-and-external-input-integrity"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "none", status = "unchanged" }
rationale = "Count and total saturate, duration conversion clamps instead of wrapping, and zero duration remains exactly zero."
[[behavior]]
partition = { equals = "DISABLED_AND_MISSING_CONFIGURATION" }
case_family = "missing_required"
oracle_ref = "SPEC_LSP_CONTRACT_001#763-persisted-and-external-input-integrity"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "unchanged", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "none", status = "unchanged" }
rationale = "Disabled collector creates no sink or file, while missing configuration flushes then disables an existing sink."
[[behavior]]
partition = { equals = "EMPTY_THRESHOLD_AND_EXPLICIT_FLUSH" }
case_family = "boundary_low"
oracle_ref = "SPEC_LSP_CONTRACT_001#763-persisted-and-external-input-integrity"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "none", status = "unchanged" }
rationale = "Empty explicit flush writes nothing, zero threshold normalizes to one, and threshold or explicit flush appends one record then resets."
[[behavior]]
partition = { equals = "RECONFIGURATION_FLUSH_BEFORE_SWITCH" }
case_family = "ordering_or_lifecycle"
oracle_ref = "SPEC_LSP_CONTRACT_001#763-persisted-and-external-input-integrity"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "none", status = "unchanged" }
rationale = "Path and threshold changes flush the old aggregate before installing the new configuration."
[[behavior]]
partition = { equals = "APPEND_ONLY_AGGREGATE_RECORD" }
case_family = "persistence_or_recovery"
oracle_ref = "SPEC_LSP_CONTRACT_001#763-persisted-and-external-input-integrity"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "none", status = "unchanged" }
rationale = "Successful flush appends without overwriting earlier records and serializes only the aggregate schema."
[[behavior]]
partition = { equals = "FAILED_FLUSH_RETAINS_RETRY_STATE" }
case_family = "persistence_or_recovery"
oracle_ref = "SPEC_LSP_CONTRACT_001#763-persisted-and-external-input-integrity"
outcome = "reject"
no_partial_apply = true
delta = { target = "unchanged", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "expected_diagnostic", status = "status_degraded" }
rationale = "Failed write retains the aggregate, failed old-sink flush blocks silent path replacement, and failed disable flush keeps the sink observable for retry."

