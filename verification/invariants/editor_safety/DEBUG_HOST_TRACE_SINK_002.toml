schema_version = 1
id = "DEBUG_HOST_TRACE_SINK_002"
title = "Debug trace activation and file sinks never change control flow"
area = "editor_safety"
risk = "false_status"
status = "mapped"
owner = "trust-debug"
last_reviewed = "2026-08-01"
claim = "Host debug tracing is enabled only by the primary environment switch, uses stable prefix and log-path precedence, appends and flushes when configured, and treats every optional file failure as nonfatal diagnostic output."
proof_level = "S0"
contract_kind = "state_machine"
source_refs = ["docs/specs/13-debug-adapter.md", "crates/trust-runtime/src/host/debug/trace/contract_tests.rs"]
tests = ["TEST_AUTO_50CB4605D12B0C2BF4C8"]
gates = ["veryquick", "pr"]
evidence_refs = []
spec_gap_refs = []
missing = ["focused_execution_evidence", "assertion_reachability", "mutation_sensitivity", "broad_remote_gate"]
[spec]
status = "specified"
source_refs = ["SPEC_DEBUG_ADAPTER_001"]
[oracle]
kind = "trust_contract"
ref = "SPEC_DEBUG_ADAPTER_001#breakpoint-evaluation-source-resolution-and-hook-contract"

[[behavior]]
partition = { equals = "TRACE_DISABLED_WITHOUT_PRIMARY_SWITCH" }
case_family = "missing_required"
oracle_ref = "SPEC_DEBUG_ADAPTER_001#breakpoint-evaluation-source-resolution-and-hook-contract"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "unchanged", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "none", status = "unchanged" }
rationale = "A configured log path alone writes nothing while ST_DEBUG_TRACE is absent."
[[behavior]]
partition = { equals = "EMPTY_PRIMARY_SWITCH_ENABLES_PREFIXED_TRACE" }
case_family = "boundary_low"
oracle_ref = "SPEC_DEBUG_ADAPTER_001#breakpoint-evaluation-source-resolution-and-hook-contract"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "none", status = "unchanged" }
rationale = "Presence of ST_DEBUG_TRACE, including an empty value, enables records with the stable runtime-debug prefix."
[[behavior]]
partition = { equals = "PRIMARY_LOG_PATH_PRECEDENCE" }
case_family = "ordering_or_lifecycle"
oracle_ref = "SPEC_DEBUG_ADAPTER_001#breakpoint-evaluation-source-resolution-and-hook-contract"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "none", status = "unchanged" }
rationale = "ST_DEBUG_TRACE_LOG selects the append-only sink and takes precedence over ST_DEBUG_DAP_LOG."
[[behavior]]
partition = { equals = "COMPATIBILITY_LOG_PATH_FALLBACK" }
case_family = "missing_required"
oracle_ref = "SPEC_DEBUG_ADAPTER_001#breakpoint-evaluation-source-resolution-and-hook-contract"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "none", status = "unchanged" }
rationale = "The compatibility log variable is used only when the primary log-path variable is absent."
[[behavior]]
partition = { equals = "APPEND_AND_FLUSH_TRACE_RECORD" }
case_family = "persistence_or_recovery"
oracle_ref = "SPEC_DEBUG_ADAPTER_001#breakpoint-evaluation-source-resolution-and-hook-contract"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "none", status = "unchanged" }
rationale = "An enabled configured sink appends and flushes one prefixed record without truncating earlier records."
[[behavior]]
partition = { equals = "TRACE_FILE_FAILURE_NONFATAL" }
case_family = "platform_or_filesystem_variation"
oracle_ref = "SPEC_DEBUG_ADAPTER_001#breakpoint-evaluation-source-resolution-and-hook-contract"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "unchanged", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "expected_diagnostic", status = "status_degraded" }
rationale = "Open, lock, write, or flush failure may report a diagnostic but never changes debugger control flow."

