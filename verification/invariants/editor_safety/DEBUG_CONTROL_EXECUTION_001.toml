[oracle]
kind = "trust_contract"
ref = "SPEC_DEBUG_ADAPTER_001#runtime-debug-control-execution"

[[behavior]]
partition = { equals = "STEP_EXECUTION" }
case_family = "ordering_or_lifecycle"
oracle_ref = "SPEC_DEBUG_ADAPTER_001#runtime-debug-control-execution"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "unchanged", process_image = "unchanged", diagnostics = "none", status = "status_degraded" }
rationale = "Step In stops at the next statement, Step Over waits for the starting depth, and Step Out waits for the caller after resuming from pause."

[[behavior]]
partition = { equals = "BREAKPOINT_RESOLUTION_AND_STOP_EVENT" }
case_family = "happy_path"
oracle_ref = "SPEC_DEBUG_ADAPTER_001#runtime-debug-control-execution"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "unchanged", process_image = "unchanged", diagnostics = "none", status = "status_degraded" }
rationale = "Zero-based byte coordinates, line boundaries, clamping, file identity, half-open overlap, containment, and deterministic before/after selection resolve one authoritative statement; a matching current-generation breakpoint pauses before it and emits one stop."

[[behavior]]
partition = { equals = "CYCLIC_BREAKPOINT_REHIT" }
case_family = "ordering_or_lifecycle"
oracle_ref = "SPEC_DEBUG_ADAPTER_001#runtime-debug-control-execution"
outcome = "accept_value"
no_partial_apply = false
delta = { target = "set_to_expected", siblings = "not_applicable", retain = "not_applicable", process_image = "not_applicable", diagnostics = "none", status = "not_applicable" }
rationale = "After continue, an unchanged breakpoint remains eligible in later scans until cleared or filtered, while one breakpoint identity emits at most one stop per scan even if multiple VM debug-map entries overlap its source range."

[[behavior]]
partition = { equals = "LIVE_BREAKPOINT_MUTATION" }
case_family = "ordering_or_lifecycle"
oracle_ref = "SPEC_DEBUG_ADAPTER_001#runtime-debug-control-execution"
outcome = "accept_value"
no_partial_apply = false
delta = { target = "set_to_expected", siblings = "not_applicable", retain = "not_applicable", process_image = "not_applicable", diagnostics = "none", status = "not_applicable" }
rationale = "Per-file replacement preserves other files and request order, advances generation with saturation even for an empty replacement, and clear removes generations and the cycle guard; live changes become eligible only at the next matching boundary."

[[behavior]]
partition = { equals = "WATCH_FRAME_AND_TASK_ORDER" }
case_family = "ordering_or_lifecycle"
oracle_ref = "SPEC_DEBUG_ADAPTER_001#runtime-debug-control-execution"
