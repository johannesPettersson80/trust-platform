[[behavior]]
partition = { equals = "STEP_EXECUTION" }
case_family = "ordering_or_lifecycle"
oracle_ref = "SPEC_DEBUG_ADAPTER_001#runtime-debug-control-execution"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "unchanged", process_image = "unchanged", diagnostics = "none", status = "status_degraded" }
rationale = "Step In stops at the next statement, Step Over waits for the starting depth, and Step Out waits for the caller after resuming from pause."

[[behavior]]
partition = { equals = "BREAKPOINT_RESOLUTION_AND_STOP_EVENT" }
case_family = "happy_path"
oracle_ref = "SPEC_DEBUG_ADAPTER_001#runtime-debug-control-execution"
