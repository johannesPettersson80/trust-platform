kind = "trust_contract"
ref = "SPEC_LSP_CONTRACT_001"

[[behavior]]
partition = { equals = "COMPLETION_HOVER_SIGNATURE" }
case_family = "missing_required"
oracle_ref = "SPEC_LSP_CONTRACT_001#61-completion"
outcome = "accept_value"
delta = { target = "set_to_expected", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "none", status = "unchanged" }
rationale = "Completion, hover, and signature help resolve the current project and cursor context and return only protocol-valid items."

[[behavior]]
partition = { equals = "DIAGNOSTICS_DELIVERY" }
case_family = "ordering_or_lifecycle"
oracle_ref = "SPEC_LSP_CONTRACT_001#62-diagnostics"
outcome = "accept_value"
delta = { target = "set_to_expected", siblings = "expected_delta", retain = "not_applicable", process_image = "unchanged", diagnostics = "expected", status = "unchanged" }
rationale = "Syntax, semantic, and warning diagnostics preserve ownership, severity, cancellation, and dependent-file refresh without false empty success."

[[behavior]]
