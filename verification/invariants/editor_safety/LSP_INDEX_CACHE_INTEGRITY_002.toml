schema_version = 1
id = "LSP_INDEX_CACHE_INTEGRITY_002"
title = "LSP index cache cannot become semantic authority"
area = "editor_safety"
risk = "silent_corruption"
status = "specified"
owner = "trust-lsp"
last_reviewed = "2026-08-01"
claim = "Index-cache loading, identity, hit validation, update, removal, retention, hashing, metadata checks, and save failure preserve one current complete optimization document without returning stale or partial semantic facts."
proof_level = "S0"
contract_kind = "state_machine"
source_refs = ["docs/specs/14-lsp.md", "crates/trust-lsp/src/index_cache.rs", "crates/trust-lsp/src/index_cache/contract_tests.rs"]
tests = []
gates = ["veryquick", "pr"]
evidence_refs = []
spec_gap_refs = []
missing = ["catalog_mapping", "focused_execution_evidence", "assertion_reachability", "mutation_sensitivity", "cross_platform_execution", "broad_remote_gate"]
[spec]
status = "specified"
source_refs = ["SPEC_LSP_CONTRACT_001"]
[oracle]
kind = "trust_contract"
ref = "SPEC_LSP_CONTRACT_001#763-persisted-and-external-input-integrity"

[[behavior]]
partition = { equals = "ABSENT_MALFORMED_OR_UNSUPPORTED_LOAD" }
case_family = "wrong_type_or_shape"
oracle_ref = "SPEC_LSP_CONTRACT_001#763-persisted-and-external-input-integrity"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "none", status = "unchanged" }
rationale = "Absent, malformed, unreadable, or unsupported-version cache loads as one empty current-schema model and exposes no retained entry."
[[behavior]]
partition = { equals = "COMPLETE_RELOADABLE_SAVE" }
case_family = "persistence_or_recovery"
oracle_ref = "SPEC_LSP_CONTRACT_001#763-persisted-and-external-input-integrity"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "none", status = "unchanged" }
rationale = "A successful save publishes one complete current-schema JSON document that reloads every independent source entry."
[[behavior]]
partition = { equals = "CONTENT_UPDATE_REPLACE_NOT_DUPLICATE" }
case_family = "ordering_or_lifecycle"
oracle_ref = "SPEC_LSP_CONTRACT_001#763-persisted-and-external-input-integrity"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "none", status = "unchanged" }
rationale = "Same content refreshes its disk signature without duplication; changed content replaces the entry and content hash."
[[behavior]]
partition = { equals = "LIVE_REGULAR_UTF8_HIT_REQUIREMENT" }
case_family = "platform_or_filesystem_variation"
oracle_ref = "SPEC_LSP_CONTRACT_001#763-persisted-and-external-input-integrity"
outcome = "reject"
no_partial_apply = true
delta = { target = "unchanged", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "none", status = "unchanged" }
rationale = "Deleted, non-UTF-8, missing, or non-regular sources cannot produce a hit even when prior metadata exists."
[[behavior]]
partition = { equals = "SELECTIVE_REMOVE_AND_RETAIN" }
case_family = "ordering_or_lifecycle"
oracle_ref = "SPEC_LSP_CONTRACT_001#763-persisted-and-external-input-integrity"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "none", status = "unchanged" }
rationale = "remove deletes only the selected normalized identity and retain deletes every unselected identity."
[[behavior]]
partition = { equals = "NORMALIZED_PATH_CACHE_IDENTITY" }
case_family = "duplicate_or_collision"
oracle_ref = "SPEC_LSP_CONTRACT_001#763-persisted-and-external-input-integrity"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "none", status = "unchanged" }
rationale = "Lexical path aliases share one cache identity and a normalized retain alias preserves that entry."
[[behavior]]
partition = { equals = "CONTENT_HASH_AND_DISK_SIGNATURE" }
case_family = "boundary_low"
oracle_ref = "SPEC_LSP_CONTRACT_001#763-persisted-and-external-input-integrity"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "none", status = "unchanged" }
rationale = "Content hash is stable and content-sensitive and a disk signature requires one existing regular input."
[[behavior]]
partition = { equals = "FAILED_SAVE_PRESERVES_MEMORY_AND_PRIOR_FILE" }
case_family = "persistence_or_recovery"
oracle_ref = "SPEC_LSP_CONTRACT_001#763-persisted-and-external-input-integrity"
outcome = "reject"
no_partial_apply = true
delta = { target = "unchanged", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "expected_diagnostic", status = "unchanged" }
rationale = "A failed save neither destroys in-memory entries nor replaces a previous valid cache with a partial document."
[[behavior]]
partition = { equals = "INDEPENDENT_SOURCE_ENTRY_RETENTION" }
case_family = "duplicate_or_collision"
oracle_ref = "SPEC_LSP_CONTRACT_001#763-persisted-and-external-input-integrity"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "none", status = "unchanged" }
rationale = "Distinct normalized source identities remain simultaneously present with their independent content instead of replacing or aliasing one another."

