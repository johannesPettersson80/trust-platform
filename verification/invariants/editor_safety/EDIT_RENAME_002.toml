schema_version = 1
id = "EDIT_RENAME_002"
title = "Cross-file rename checks the merged project symbol table"
area = "editor_safety"
risk = "silent_corruption"
status = "gap_open"
owner = "trust-ide"
last_reviewed = "2026-07-10"
claim = "Cross-file rename conflict checks must include imported and merged project symbols."
proof_level = "S0"
contract_kind = "state_machine"
source_refs = ["crates/trust-ide/src", "crates/trust-hir/src"]
tests = []
gates = []
evidence_refs = []
spec_gap_refs = []
missing = [
  "producer_authentic_red_green_proof",
  "broad_remote_gate",
]

[spec]
status = "specified"
source_refs = ["SPEC_LSP_CONTRACT_001"]

[oracle]
kind = "trust_contract"
ref = "SPEC_LSP_CONTRACT_001"

[[behavior]]
partition = { equals = "IMPORTED_ORIGIN_COLLISION" }
case_family = "duplicate_or_collision"
oracle_ref = "SPEC_LSP_CONTRACT_001#rename-conflict-safety"
outcome = "reject"
delta = { target = "unchanged", siblings = "unchanged", retain = "unchanged", process_image = "unchanged", diagnostics = "stable_error", status = "unchanged" }
rationale = "A rename requested from an imported use site is checked against the declaration's origin scope before edits are returned."

[[behavior]]
partition = { equals = "PROJECT_TOP_LEVEL_COLLISION" }
case_family = "duplicate_or_collision"
oracle_ref = "SPEC_LSP_CONTRACT_001#rename-conflict-safety"
outcome = "reject"
delta = { target = "unchanged", siblings = "unchanged", retain = "unchanged", process_image = "unchanged", diagnostics = "stable_error", status = "unchanged" }
rationale = "Top-level POU renames check case-insensitive names across the merged project symbol table."

[[behavior]]
partition = { equals = "CROSS_FILE_REFERENCE_REBIND" }
case_family = "duplicate_or_collision"
oracle_ref = "SPEC_LSP_CONTRACT_001#rename-conflict-safety"
outcome = "reject"
delta = { target = "unchanged", siblings = "unchanged", retain = "unchanged", process_image = "unchanged", diagnostics = "stable_error", status = "unchanged" }
rationale = "A project-wide candidate edit is refused when a use-site local or imported symbol would capture an edited cross-file reference."

[[behavior]]
partition = { equals = "SAFE_CROSS_FILE_RENAME" }
case_family = "happy_path"
oracle_ref = "SPEC_LSP_CONTRACT_001#rename-conflict-safety"
outcome = "accept_value"
delta = { target = "set_to_expected", siblings = "unchanged", retain = "unchanged", process_image = "unchanged", diagnostics = "none", status = "unchanged" }
rationale = "When the complete merged-project edit preserves every reference binding, rename returns declaration and use-site edits without partial mutation."

[[coverage.cells]]
dimension = "duplicate_or_collision"
state = "gap_open"
rationale = "Focused imported-origin, project-level, and cross-file capture tests cover the written conflict contract; producer-authentic proof and a causal broad gate remain open."
