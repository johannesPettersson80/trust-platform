ref = "SPEC_LSP_CONTRACT_001#662-hmi-command-and-descriptor-diagnostics"

[[behavior]]
partition = { equals = "VALID_HMI_DESCRIPTOR" }
case_family = "happy_path"
oracle_ref = "SPEC_LSP_CONTRACT_001#662-hmi-command-and-descriptor-diagnostics"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "none", status = "unchanged" }
rationale = "A valid HMI page remains diagnostic-free without requiring a successful runtime compile."

[[behavior]]
partition = { equals = "INVALID_HMI_DESCRIPTOR_SHAPE" }
case_family = "wrong_type_or_shape"
oracle_ref = "SPEC_LSP_CONTRACT_001#662-hmi-command-and-descriptor-diagnostics"
outcome = "reject"
no_partial_apply = true
delta = { target = "unchanged", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "expected_diagnostic", status = "unchanged" }
rationale = "Invalid descriptor type, widget, property, and binding shapes produce their named diagnostics from the open buffer."

[[behavior]]
partition = { equals = "UNKNOWN_BINDING_NEAR_MATCH" }
case_family = "extra_or_unknown"
oracle_ref = "SPEC_LSP_CONTRACT_001#662-hmi-command-and-descriptor-diagnostics"
outcome = "reject"
no_partial_apply = true
delta = { target = "unchanged", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "expected_diagnostic", status = "unchanged" }
rationale = "An unknown binding reports the closest valid external symbol and suppresses unrelated suggestions."

[[behavior]]
partition = { equals = "HMI_BINDING_CATALOG_COMMAND" }
case_family = "missing_required"
oracle_ref = "SPEC_LSP_CONTRACT_001#662-hmi-command-and-descriptor-diagnostics"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "none", status = "unchanged" }
rationale = "The binding command returns the deterministic external contract catalogue for the current project."

[[behavior]]
partition = { equals = "HMI_INIT_SCAFFOLD_COMMAND" }
case_family = "ordering_or_lifecycle"
oracle_ref = "SPEC_LSP_CONTRACT_001#662-hmi-command-and-descriptor-diagnostics"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "expected_delta", retain = "not_applicable", process_image = "unchanged", diagnostics = "none", status = "unchanged" }
rationale = "A valid initialization request writes and returns the deterministic scaffold in the reviewed command order."

