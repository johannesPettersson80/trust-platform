schema_version = 1
id = "DEBUG_PAUSE_001"
title = "Debug pause has explicit watchdog and scan-deadline semantics"
area = "editor_safety"
risk = "safety_critical"
status = "implemented"
owner = "trust-debug"
last_reviewed = "2026-07-16"
claim = "Breakpoint and pause handling must not leave scan deadlines, watchdogs, I/O, or safe-state behavior implicit."
proof_level = "G1"
contract_kind = "state_machine"
source_refs = [
  "crates/trust-runtime/src/host/debug/control",
  "crates/trust-runtime/src/scheduler/runner_loop.rs",
]
tests = [
  "TEST_DEBUG_PAUSE_WATCHDOG_001",
  "TEST_RUNTIME_PAUSE_WATCHDOG_001",
  "TEST_DEBUG_PAUSE_TRACE_001",
]
gates = ["pr"]
evidence_refs = [
  "EVID_TEST_DEBUG_PAUSE_TRACE_001_LOCK_BASELINE",
  "EVID_TEST_DEBUG_PAUSE_TRACE_001_LOCK_COMPARE",
  "EVID_DEBUG_PAUSE_WATCHDOG_GAP_CLOSEOUT_20260716",
]
spec_gap_refs = []
missing = [
  "broad_remote_gate",
]

[spec]
status = "specified"
source_refs = ["SPEC_DEBUG_ADAPTER_001", "SPEC_RUNTIME_ENGINE_001"]

[oracle]
kind = "trust_contract"
ref = "SPEC_RUNTIME_ENGINE_001"

[[behavior]]
partition = { equals = "DEBUG_STATEMENT_PAUSE_LONGER_THAN_WATCHDOG" }
case_family = "time_or_clock_fault"
oracle_ref = "SPEC_RUNTIME_ENGINE_001#debug-and-resource-pause-interaction"
outcome = "accept_value"
delta = { target = "unchanged", siblings = "not_applicable", retain = "unchanged", process_image = "unchanged", diagnostics = "none", status = "unchanged" }
rationale = "Operator dwell at a statement-boundary debug pause is excluded from the armed cycle deadlines; resume continues the same cycle without manufacturing a watchdog fault."

[[behavior]]
partition = { equals = "RESOURCE_PAUSE_BETWEEN_CYCLES" }
case_family = "ordering_or_lifecycle"
oracle_ref = "SPEC_RUNTIME_ENGINE_001#debug-and-resource-pause-interaction"
outcome = "accept_value"
delta = { target = "unchanged", siblings = "not_applicable", retain = "unchanged", process_image = "unchanged", diagnostics = "none", status = "unchanged" }
rationale = "A resource pause between cycles starts no scan, output commit, or watchdog interval; resume starts the next normally bounded cycle."

[[coverage.cells]]
dimension = "time_or_clock_fault"
state = "covered"
rationale = "The committed pause trace covers statement-boundary dwell and between-cycle pause semantics with a current-contract lock comparison; a causal broad gate remains open."
