schema_version = 1
id = "LSP_LIBRARY_DOCUMENT_INGESTION_002"
title = "Library documentation headings define deterministic symbol prose"
area = "editor_safety"
risk = "wrong_result"
status = "specified"
owner = "trust-lsp"
last_reviewed = "2026-08-01"
claim = "Library documentation recognizes the reviewed ATX heading grammar, preserves normalized body text, applies case-insensitive replacement precedence, and isolates missing or invalid files without erasing valid entries."
proof_level = "S0"
contract_kind = "decision_table"
source_refs = ["docs/specs/14-lsp.md", "crates/trust-lsp/src/library_docs", "crates/trust-lsp/src/library_docs/contract_tests.rs"]
tests = []
gates = ["veryquick", "pr"]
evidence_refs = []
spec_gap_refs = []
missing = ["catalog_mapping", "focused_execution_evidence", "assertion_reachability", "mutation_sensitivity", "broad_remote_gate"]
[spec]
status = "specified"
source_refs = ["SPEC_LSP_CONTRACT_001"]
[oracle]
kind = "trust_contract"
ref = "SPEC_LSP_CONTRACT_001#763-persisted-and-external-input-integrity"

[[behavior]]
partition = { equals = "ATX_HEADING_GRAMMAR" }
case_family = "boundary_low"
oracle_ref = "SPEC_LSP_CONTRACT_001#763-persisted-and-external-input-integrity"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "none", status = "unchanged" }
rationale = "Levels one through six with space or tab define symbols; missing whitespace and seven hashes do not."
[[behavior]]
partition = { equals = "HEADING_IDENTITY_AND_BODY_REQUIREMENT" }
case_family = "missing_required"
oracle_ref = "SPEC_LSP_CONTRACT_001#763-persisted-and-external-input-integrity"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "none", status = "unchanged" }
rationale = "Heading identity trims and matches case-insensitively; prose before the first heading, blank headings, and headings without body produce no entry."
[[behavior]]
partition = { equals = "BODY_LINE_PARAGRAPH_AND_INLINE_CONTENT" }
case_family = "ordering_or_lifecycle"
oracle_ref = "SPEC_LSP_CONTRACT_001#763-persisted-and-external-input-integrity"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "none", status = "unchanged" }
rationale = "Body line order and paragraph breaks remain, inline hashes and fenced text stay body content, and CRLF normalizes to LF."
[[behavior]]
partition = { equals = "DUPLICATE_HEADING_REPLACEMENT" }
case_family = "duplicate_or_collision"
oracle_ref = "SPEC_LSP_CONTRACT_001#763-persisted-and-external-input-integrity"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "none", status = "unchanged" }
rationale = "A later nonempty duplicate replaces the earlier body while an empty later duplicate cannot erase it."
[[behavior]]
partition = { equals = "CONFIGURED_FILE_PRECEDENCE_AND_FAILURE_ISOLATION" }
case_family = "ordering_or_lifecycle"
oracle_ref = "SPEC_LSP_CONTRACT_001#763-persisted-and-external-input-integrity"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "none", status = "unchanged" }
rationale = "Later configured files replace earlier symbols; missing and non-UTF-8 files contribute nothing and do not erase other valid entries."

