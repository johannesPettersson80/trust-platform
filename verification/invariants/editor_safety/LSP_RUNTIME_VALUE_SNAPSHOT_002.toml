schema_version = 1
id = "LSP_RUNTIME_VALUE_SNAPSHOT_002"
title = "Runtime inline values come from one coherent bounded snapshot"
area = "editor_safety"
risk = "false_status"
status = "mapped"
owner = "trust-lsp"
last_reviewed = "2026-08-01"
claim = "Runtime-value endpoint parsing, framed requests, scope validation, variable normalization, instance selection, and local merge precedence either produce one coherent snapshot or reject it without partial mixed-observation values."
proof_level = "S0"
contract_kind = "protocol_trace"
source_refs = ["docs/specs/14-lsp.md", "crates/trust-lsp/src/handlers/runtime_values", "crates/trust-lsp/src/handlers/runtime_values/contract_tests.rs"]
tests = ["TEST_AUTO_425A84AFA8375DE14F60"]
gates = ["veryquick", "pr"]
evidence_refs = []
spec_gap_refs = []
missing = ["focused_execution_evidence", "assertion_reachability", "mutation_sensitivity", "unix_platform_execution", "broad_remote_gate"]
[spec]
status = "specified"
source_refs = ["SPEC_LSP_CONTRACT_001"]
[oracle]
kind = "trust_contract"
ref = "SPEC_LSP_CONTRACT_001#712-progressive-results-and-interactive-latency"

[[behavior]]
partition = { equals = "ENDPOINT_SCHEME_AND_ADDRESS" }
case_family = "platform_or_filesystem_variation"
oracle_ref = "SPEC_LSP_CONTRACT_001#712-progressive-results-and-interactive-latency"
outcome = "reject"
no_partial_apply = true
delta = { target = "unchanged", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "none", status = "unchanged" }
rationale = "TCP requires the exact scheme and nonempty address, Unix requires an absolute nonempty path on Unix, and numeric socket addresses resolve without rewriting identity."
[[behavior]]
partition = { equals = "REQUEST_ID_FRAME_PARAMS_AND_AUTH" }
case_family = "ordering_or_lifecycle"
oracle_ref = "SPEC_LSP_CONTRACT_001#712-progressive-results-and-interactive-latency"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "none", status = "unchanged" }
rationale = "Requests start at ID 1, increment, use exact scopes or variables frames and params, and omit absent or blank auth from every request."
[[behavior]]
partition = { equals = "KNOWN_SCOPE_SELECTION_AND_SEPARATION" }
case_family = "extra_or_unknown"
oracle_ref = "SPEC_LSP_CONTRACT_001#712-progressive-results-and-interactive-latency"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "none", status = "unchanged" }
rationale = "Trimmed case-insensitive locals, globals, retain, and instances remain separate, unknown scopes trigger no request, and duplicate or zero known references reject the snapshot."
[[behavior]]
partition = { equals = "ADVERTISED_SCOPE_ATOMIC_FETCH" }
case_family = "hardware_or_network_fault"
oracle_ref = "SPEC_LSP_CONTRACT_001#712-progressive-results-and-interactive-latency"
outcome = "reject"
no_partial_apply = true
delta = { target = "unchanged", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "none", status = "unchanged" }
rationale = "Failure or malformed variables for any advertised required scope rejects the entire snapshot rather than mixing observations."
[[behavior]]
partition = { equals = "VARIABLE_NAME_NORMALIZATION" }
case_family = "duplicate_or_collision"
oracle_ref = "SPEC_LSP_CONTRACT_001#712-progressive-results-and-interactive-latency"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "none", status = "unchanged" }
rationale = "Variable names trim, blanks drop, and the first duplicate wins deterministically."
[[behavior]]
partition = { equals = "INSTANCE_HINT_PRECEDENCE" }
case_family = "ordering_or_lifecycle"
oracle_ref = "SPEC_LSP_CONTRACT_001#712-progressive-results-and-interactive-latency"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "none", status = "unchanged" }
rationale = "Caller hint order selects exact qualified prefix, then exact case-insensitive type, then unique unqualified base; ambiguity selects none, sole instance is fallback, and multiple unmatched instances are ignored."
[[behavior]]
partition = { equals = "INSTANCE_LOCAL_MERGE_PRECEDENCE" }
case_family = "duplicate_or_collision"
oracle_ref = "SPEC_LSP_CONTRACT_001#712-progressive-results-and-interactive-latency"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "none", status = "unchanged" }
rationale = "Selected instance values supplement locals while explicit locals win duplicate names."
[[behavior]]
partition = { equals = "RESPONSE_ENVELOPE_FAILURE" }
case_family = "hardware_or_network_fault"
oracle_ref = "SPEC_LSP_CONTRACT_001#712-progressive-results-and-interactive-latency"
outcome = "reject"
no_partial_apply = true
delta = { target = "unchanged", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "none", status = "unchanged" }
rationale = "ok=false, missing result, malformed JSON or shapes, and closed response streams reject the complete snapshot."

