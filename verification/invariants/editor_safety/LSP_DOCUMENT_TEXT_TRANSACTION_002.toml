schema_version = 1
id = "LSP_DOCUMENT_TEXT_TRANSACTION_002"
title = "LSP document text uses one UTF-16 line and change transaction"
area = "editor_safety"
risk = "silent_corruption"
status = "specified"
owner = "trust-lsp"
last_reviewed = "2026-08-01"
claim = "Document line indexing, byte offsets, UTF-16 positions and lengths, full replacements, and ordered incremental changes preserve every untouched byte and fail an invalid batch without returning partial text."
proof_level = "S0"
contract_kind = "state_machine"
source_refs = ["docs/specs/14-lsp.md", "crates/trust-lsp/src/document_text", "crates/trust-lsp/src/document_text/contract_tests.rs"]
tests = []
gates = ["veryquick", "pr"]
evidence_refs = []
spec_gap_refs = []
missing = ["catalog_mapping", "focused_execution_evidence", "assertion_reachability", "mutation_sensitivity", "broad_remote_gate"]
[spec]
status = "specified"
source_refs = ["SPEC_LSP_CONTRACT_001"]
[oracle]
kind = "trust_contract"
ref = "SPEC_LSP_CONTRACT_001#762-utf-16-text-positions-and-incremental-changes"

[[behavior]]
partition = { equals = "LINE_TERMINATOR_AND_FINAL_EMPTY_LINE_MODEL" }
case_family = "boundary_low"
oracle_ref = "SPEC_LSP_CONTRACT_001#762-utf-16-text-positions-and-incremental-changes"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "none", status = "unchanged" }
rationale = "Empty text and LF, CRLF, lone CR, mixed endings, and trailing terminators produce the exact documented line model and out-of-range line access returns none."
[[behavior]]
partition = { equals = "BYTE_OFFSET_TO_UTF16_POSITION" }
case_family = "encoding_or_unicode"
oracle_ref = "SPEC_LSP_CONTRACT_001#762-utf-16-text-positions-and-incremental-changes"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "none", status = "unchanged" }
rationale = "Offsets inside terminators map to the preceding line end, beyond EOF clamps, and offsets inside a multibyte scalar move to its start with supplementary scalars counting two units."
[[behavior]]
partition = { equals = "UTF16_POSITION_TO_BYTE_OFFSET" }
case_family = "encoding_or_unicode"
oracle_ref = "SPEC_LSP_CONTRACT_001#762-utf-16-text-positions-and-incremental-changes"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "none", status = "unchanged" }
rationale = "Scalar-boundary positions round-trip, inside-surrogate positions select the scalar start, beyond-line columns select line end, and out-of-range lines reject."
[[behavior]]
partition = { equals = "UTF16_LENGTH_BOUNDARY" }
case_family = "encoding_or_unicode"
oracle_ref = "SPEC_LSP_CONTRACT_001#762-utf-16-text-positions-and-incremental-changes"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "none", status = "unchanged" }
rationale = "Lengths count ASCII, BMP, supplementary scalars, and terminators, clamp byte inputs to scalar boundaries, and return zero for empty or reversed intervals."
[[behavior]]
partition = { equals = "INCREMENTAL_INSERT_DELETE_AND_REPLACE" }
case_family = "happy_path"
oracle_ref = "SPEC_LSP_CONTRACT_001#762-utf-16-text-positions-and-incremental-changes"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "none", status = "unchanged" }
rationale = "Start and line-end insertions, deletions, and single- or multi-line replacements use UTF-16 columns and preserve untouched bytes."
[[behavior]]
partition = { equals = "SEQUENTIAL_FULL_AND_INCREMENTAL_CHANGE_ORDER" }
case_family = "ordering_or_lifecycle"
oracle_ref = "SPEC_LSP_CONTRACT_001#762-utf-16-text-positions-and-incremental-changes"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "none", status = "unchanged" }
rationale = "Each range observes preceding changes, full and incremental replacements may follow one another, and untouched CRLF bytes remain exact."
[[behavior]]
partition = { equals = "INVALID_RANGE_BATCH_ROLLBACK" }
case_family = "wrong_type_or_shape"
oracle_ref = "SPEC_LSP_CONTRACT_001#762-utf-16-text-positions-and-incremental-changes"
outcome = "reject"
no_partial_apply = true
delta = { target = "unchanged", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "stable_error", status = "unchanged" }
rationale = "Out-of-range start or end and reversed same- or multi-line ranges use stable typed errors; any invalid later change returns no partial document."
[[behavior]]
partition = { equals = "EMPTY_CHANGE_BATCH_IDENTITY" }
case_family = "missing_required"
oracle_ref = "SPEC_LSP_CONTRACT_001#762-utf-16-text-positions-and-incremental-changes"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "unchanged", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "none", status = "unchanged" }
rationale = "An empty batch preserves the exact document bytes and identity."

