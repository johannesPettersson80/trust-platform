schema_version = 1
id = "EDIT_DOC_CLOSE_001"
title = "Document close discards unsaved state and restores durable project truth"
area = "editor_safety"
risk = "silent_corruption"
status = "gap_open"
owner = "trust-lsp"
last_reviewed = "2026-07-16"
claim = "Closing a document must discard its unsaved buffer, remove stale semantic state, and recompute project truth from durable sources."
proof_level = "S0"
contract_kind = "state_machine"
source_refs = [
  "crates/trust-lsp/src/handlers/sync.rs",
  "crates/trust-lsp/src/state/documents.rs",
]
tests = []
gates = []
evidence_refs = []
spec_gap_refs = ["SPEC_GAP_EDITOR_DOCUMENT_CLOSE_001"]
missing = [
  "producer_authentic_behavior_lock",
  "broad_remote_gate",
]

[spec]
status = "specified"
source_refs = ["SPEC_LSP_CONTRACT_001"]

[oracle]
kind = "trust_contract"
ref = "SPEC_LSP_CONTRACT_001"

[[behavior]]
partition = { equals = "TRACKED_FILE_RELOAD" }
case_family = "persistence_or_recovery"
oracle_ref = "SPEC_LSP_CONTRACT_001#document-close-and-durable-project-truth"
outcome = "accept_value"
delta = { target = "set_to_expected", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "none", status = "unchanged" }
rationale = "Closing a readable file discards its unsaved buffer and replaces it with the current disk bytes as closed project state."

[[behavior]]
partition = { equals = "UNREADABLE_OR_NON_FILE_REMOVE" }
case_family = "persistence_or_recovery"
oracle_ref = "SPEC_LSP_CONTRACT_001#document-close-and-durable-project-truth"
outcome = "accept_value"
delta = { target = "set_to_expected", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "none", status = "unchanged" }
rationale = "Closing a document without a readable durable file removes it from the project index rather than retaining unsaved contents."

[[behavior]]
partition = { equals = "DISCARDED_CONTENT_CACHE_INVALIDATION" }
case_family = "persistence_or_recovery"
oracle_ref = "SPEC_LSP_CONTRACT_001#document-close-and-durable-project-truth"
outcome = "accept_value"
delta = { target = "set_to_expected", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "none", status = "unchanged" }
rationale = "Semantic, semantic-token, and diagnostic caches cannot retain content discarded by didClose."

[[behavior]]
partition = { equals = "DEPENDENT_RECOMPUTE" }
case_family = "persistence_or_recovery"
oracle_ref = "SPEC_LSP_CONTRACT_001#document-close-and-durable-project-truth"
outcome = "accept_value"
delta = { target = "set_to_expected", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "expected_diagnostic", status = "unchanged" }
rationale = "Dependent semantic and diagnostic results are recomputed from the reloaded or removed durable source."

[[behavior]]
partition = { equals = "DIAGNOSTIC_PROTOCOL_RECONCILIATION" }
case_family = "persistence_or_recovery"
oracle_ref = "SPEC_LSP_CONTRACT_001#document-close-and-durable-project-truth"
outcome = "accept_value"
delta = { target = "set_to_expected", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "expected_diagnostic", status = "unchanged" }
rationale = "Push clients clear only the closed URI and pull clients recompute later results from durable project truth."

[[coverage.cells]]
dimension = "persistence_or_recovery"
state = "gap_open"
rationale = "The lifecycle is written and red/green tested; current-contract behavior-lock evidence and gap closeout remain open."
