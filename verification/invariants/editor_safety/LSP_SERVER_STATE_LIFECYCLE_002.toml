schema_version = 1
id = "LSP_SERVER_STATE_LIFECYCLE_002"
title = "LSP server state advances only on committed current authority"
area = "editor_safety"
risk = "silent_corruption"
status = "specified"
owner = "trust-lsp"
last_reviewed = "2026-08-01"
claim = "Server construction, owned configuration, workspace selection, document and file identity, semantic generations, request tickets, token and diagnostic caches, hierarchy snapshots, activity, and database views remain coherent and reject stale or no-op mutation."
proof_level = "S0"
contract_kind = "state_machine"
source_refs = ["docs/specs/14-lsp.md", "crates/trust-lsp/src/state", "crates/trust-lsp/src/state/state_contract_tests.rs"]
tests = []
gates = ["veryquick", "pr"]
evidence_refs = []
spec_gap_refs = []
missing = ["catalog_mapping", "focused_execution_evidence", "assertion_reachability", "mutation_sensitivity", "broad_remote_gate"]
[spec]
status = "specified"
source_refs = ["SPEC_LSP_CONTRACT_001"]
[oracle]
kind = "trust_contract"
ref = "SPEC_LSP_CONTRACT_001#764-server-state-lifecycle-and-cache-contract"

[[behavior]]
partition = { equals = "NEW_DEFAULT_EMPTY_STATE_AND_DOCUMENT_BYTES" }
case_family = "happy_path"
oracle_ref = "SPEC_LSP_CONTRACT_001#764-server-state-lifecycle-and-cache-contract"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "none", status = "unchanged" }
rationale = "new and default create the same empty closed-capability state, generations start as specified, and Document counts UTF-8 bytes."
[[behavior]]
partition = { equals = "OWNED_WORKSPACE_CAPABILITY_AND_CONFIGURATION_SNAPSHOTS" }
case_family = "ordering_or_lifecycle"
oracle_ref = "SPEC_LSP_CONTRACT_001#764-server-state-lifecycle-and-cache-contract"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "none", status = "unchanged" }
rationale = "Workspace folders and configuration are owned snapshots and capability flags toggle independently."
[[behavior]]
partition = { equals = "PRIMARY_PRIORITY_AND_DEEPEST_URI_ROOT" }
case_family = "ordering_or_lifecycle"
oracle_ref = "SPEC_LSP_CONTRACT_001#764-server-state-lifecycle-and-cache-contract"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "none", status = "unchanged" }
rationale = "Same-root configuration replaces, primary uses highest numeric priority, and URI lookup uses the deepest registered root independently."
[[behavior]]
partition = { equals = "UNKNOWN_UPDATE_AND_INDEXING_NO_PROMOTION" }
case_family = "extra_or_unknown"
oracle_ref = "SPEC_LSP_CONTRACT_001#764-server-state-lifecycle-and-cache-contract"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "unchanged", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "none", status = "unchanged" }
rationale = "Unknown update is a complete no-op, cannot create/promote a closed document, and indexing cannot replace identical closed or any open editor authority."
[[behavior]]
partition = { equals = "UNKNOWN_CLOSE_REMOVE_NO_GENERATION" }
case_family = "extra_or_unknown"
oracle_ref = "SPEC_LSP_CONTRACT_001#764-server-state-lifecycle-and-cache-contract"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "unchanged", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "none", status = "unchanged" }
rationale = "Unknown close and remove preserve both document generation and semantic request ticket."
[[behavior]]
partition = { equals = "URI_DOCUMENT_FILE_ID_AND_CONFIG_SCOPE" }
case_family = "platform_or_filesystem_variation"
oracle_ref = "SPEC_LSP_CONTRACT_001#764-server-state-lifecycle-and-cache-contract"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "none", status = "unchanged" }
rationale = "Document/file-ID lookups are bidirectional, config projection includes only indexing-root paths, and ensure_document rejects non-file or missing file URIs."
[[behavior]]
partition = { equals = "GENERATION_INVALIDATES_HIERARCHY_CACHES" }
case_family = "ordering_or_lifecycle"
oracle_ref = "SPEC_LSP_CONTRACT_001#764-server-state-lifecycle-and-cache-contract"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "expected_delta", retain = "not_applicable", process_image = "unchanged", diagnostics = "none", status = "unchanged" }
rationale = "Every committed project-text mutation advances once and clears both hierarchy caches, and hierarchy reads are detached snapshots."
[[behavior]]
partition = { equals = "SEMANTIC_TICKET_AND_TOKEN_CACHE_CURRENTNESS" }
case_family = "concurrency_or_cancellation"
oracle_ref = "SPEC_LSP_CONTRACT_001#764-server-state-lifecycle-and-cache-contract"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "none", status = "unchanged" }
rationale = "New or cancelled tickets invalidate every older generation, and only the current ticket may replace semantic-token cache state."
[[behavior]]
partition = { equals = "DIAGNOSTIC_CACHE_DUAL_HASH_IDENTITY" }
case_family = "duplicate_or_collision"
oracle_ref = "SPEC_LSP_CONTRACT_001#764-server-state-lifecycle-and-cache-contract"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "none", status = "unchanged" }
rationale = "Diagnostic result ID is reused only when both content and diagnostic hashes match."
[[behavior]]
partition = { equals = "ACTIVITY_AND_DATABASE_VIEW" }
case_family = "ordering_or_lifecycle"
oracle_ref = "SPEC_LSP_CONTRACT_001#764-server-state-lifecycle-and-cache-contract"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "none", status = "unchanged" }
rationale = "Activity moves from never-recorded to elapsed age and the database view tracks the same project sources owned by document lifecycle."

