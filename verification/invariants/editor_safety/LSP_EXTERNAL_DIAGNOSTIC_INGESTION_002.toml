schema_version = 1
id = "LSP_EXTERNAL_DIAGNOSTIC_INGESTION_002"
title = "External diagnostic documents ingest atomically and in order"
area = "editor_safety"
risk = "silent_corruption"
status = "specified"
owner = "trust-lsp"
last_reviewed = "2026-08-01"
claim = "Each external-diagnostic file is an atomic ordered input whose target, range, severity, source, code, and optional fix data normalize exactly without allowing malformed entries or invalid URI fallback to publish partial diagnostics."
proof_level = "S0"
contract_kind = "protocol_trace"
source_refs = ["docs/specs/14-lsp.md", "crates/trust-lsp/src/external_diagnostics", "crates/trust-lsp/src/external_diagnostics/contract_tests.rs"]
tests = []
gates = ["veryquick", "pr"]
evidence_refs = []
spec_gap_refs = []
missing = ["catalog_mapping", "focused_execution_evidence", "assertion_reachability", "mutation_sensitivity", "broad_remote_gate"]
[spec]
status = "specified"
source_refs = ["SPEC_LSP_CONTRACT_001"]
[oracle]
kind = "trust_contract"
ref = "SPEC_LSP_CONTRACT_001#763-persisted-and-external-input-integrity"

[[behavior]]
partition = { equals = "DOCUMENT_SHAPE_AND_ATOMIC_SCHEMA_VALIDATION" }
case_family = "wrong_type_or_shape"
oracle_ref = "SPEC_LSP_CONTRACT_001#763-persisted-and-external-input-integrity"
outcome = "reject"
no_partial_apply = true
delta = { target = "unchanged", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "none", status = "unchanged" }
rationale = "A top-level list or diagnostics wrapper is accepted; malformed, unreadable, missing, or one-entry schema-invalid files contribute nothing as complete input units."
[[behavior]]
partition = { equals = "URI_AND_PATH_TARGET_PRECEDENCE" }
case_family = "ordering_or_lifecycle"
oracle_ref = "SPEC_LSP_CONTRACT_001#763-persisted-and-external-input-integrity"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "none", status = "unchanged" }
rationale = "Relative paths resolve from the project, absolute paths remain, explicit URI wins, and an invalid explicit URI does not fall back to a path."
[[behavior]]
partition = { equals = "DOCUMENT_FILTER_AND_MISSING_TARGET" }
case_family = "extra_or_unknown"
oracle_ref = "SPEC_LSP_CONTRACT_001#763-persisted-and-external-input-integrity"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "unchanged", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "none", status = "unchanged" }
rationale = "Entries for other documents and entries without URI or path are inapplicable and do not leak into the selected result."
[[behavior]]
partition = { equals = "ZERO_BASED_RANGE_PRESERVATION" }
case_family = "boundary_low"
oracle_ref = "SPEC_LSP_CONTRACT_001#763-persisted-and-external-input-integrity"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "none", status = "unchanged" }
rationale = "An external LSP range remains exact and zero-based."
[[behavior]]
partition = { equals = "SEVERITY_VOCABULARY_AND_DEFAULT" }
case_family = "boundary_low"
oracle_ref = "SPEC_LSP_CONTRACT_001#763-persisted-and-external-input-integrity"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "none", status = "unchanged" }
rationale = "Absent or invalid severity defaults to warning; trimmed case-insensitive strings and numeric values 1 through 4 map exactly to LSP severity."
[[behavior]]
partition = { equals = "SOURCE_AND_STRING_CODE" }
case_family = "missing_required"
oracle_ref = "SPEC_LSP_CONTRACT_001#763-persisted-and-external-input-integrity"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "none", status = "unchanged" }
rationale = "Source defaults to external, explicit source is preserved, and a string code remains a string."
[[behavior]]
partition = { equals = "OPTIONAL_FIX_DATA" }
case_family = "happy_path"
oracle_ref = "SPEC_LSP_CONTRACT_001#763-persisted-and-external-input-integrity"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "none", status = "unchanged" }
rationale = "Fix data preserves replacement text and optional title and range without fabricating omitted fields."
[[behavior]]
partition = { equals = "FILE_AND_ENTRY_DECLARATION_ORDER" }
case_family = "ordering_or_lifecycle"
oracle_ref = "SPEC_LSP_CONTRACT_001#763-persisted-and-external-input-integrity"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "none", status = "unchanged" }
rationale = "Configured file order and per-file entry order determine the final diagnostic order."

[[coverage.cells]]
dimension = "happy_path"
state = "gap_open"
rationale = "Focused fix-data tests exist, but accepted catalog binding and dynamic proof are pending."
[[coverage.cells]]
dimension = "wrong_type_or_shape"
state = "gap_open"
rationale = "Focused atomic document validation tests exist, but accepted catalog binding and dynamic proof are pending."
[[coverage.cells]]
dimension = "ordering_or_lifecycle"
state = "gap_open"
rationale = "Focused target precedence and ordering tests exist, but accepted catalog binding and dynamic proof are pending."
[[coverage.cells]]
dimension = "extra_or_unknown"
state = "gap_open"
rationale = "Focused inapplicable-entry tests exist, but accepted catalog binding and dynamic proof are pending."
[[coverage.cells]]
dimension = "boundary_low"
state = "gap_open"
rationale = "Focused range and severity tests exist, but accepted catalog binding and dynamic proof are pending."
[[coverage.cells]]
