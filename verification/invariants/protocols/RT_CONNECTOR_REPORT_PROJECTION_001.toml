status = "mapped"
owner = "trust-runtime"
last_reviewed = "2026-07-26"
claim = "Connector report shape, driver policy, point quality, protocol state, and TCP-only confidence must preserve their exact reviewed meanings."
proof_level = "S0"
contract_kind = "decision_table"
source_refs = ["crates/trust-runtime/src/connectors", "docs/specs/23-connector-status.md"]
tests = ["TEST_AUTO_2B71CDA6D428E5AA3600", "TEST_AUTO_2CAF3FB378ED1968BC05", "TEST_AUTO_4FBDF6E7EFCD79AAF13A", "TEST_AUTO_4FD6BEEC35F23C0FE962", "TEST_AUTO_52F76E1274CF56E0704C", "TEST_AUTO_55D437E9E329FF76C784", "TEST_AUTO_59437AD1E0698611D045", "TEST_AUTO_5A83F98038D22DC3CF2D", "TEST_AUTO_6541A691564505602302", "TEST_AUTO_673146F9407CFA0E2A7B", "TEST_AUTO_7ABC26CF210FA536482F", "TEST_AUTO_A11A3EC89B0848F97F9F", "TEST_AUTO_A4B53D5EAD921AF1BEA5", "TEST_AUTO_D101156555E69D07F53D"]
