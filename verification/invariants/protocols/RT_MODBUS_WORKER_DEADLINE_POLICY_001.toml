schema_version = 1
id = "RT_MODBUS_WORKER_DEADLINE_POLICY_001"
title = "Modbus worker deadlines preserve configured error policy"
area = "protocols"
risk = "false_status"
status = "mapped"
owner = "trust-runtime"
last_reviewed = "2026-07-23"
claim = "A Modbus input or output handoff that misses its scan deadline faults and returns an error under fault policy, while warn and ignore return degraded success; faulted input does not copy a cached snapshot and timed-out output remains queued, while completed loopback and runtime safe-state handoffs remain successful controls."
proof_level = "T1"
contract_kind = "decision_table"
source_refs = ["crates/trust-runtime/src/io/modbus/worker.rs"]
tests = [
