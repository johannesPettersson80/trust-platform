  "TEST_MODBUS_WORKER_DEADLINE_POLICY_OUTPUT_DEADLINE_FOLLOWS_ERROR_POLICY_WITHOUT_CANCELLING_HANDOFF_001",
  "TEST_MODBUS_WORKER_DEADLINE_POLICY_MODBUS_DRIVER_READS_AND_WRITES_DEFAULT_REGISTER_FUNCTIONS_001",
  "TEST_MODBUS_WORKER_DEADLINE_POLICY_MODBUS_COLD_START_NO_DATA_FOLLOWS_ON_ERROR_POLICY_001",
  "TEST_MODBUS_WORKER_DEADLINE_POLICY_MODBUS_SAFE_STATE_HANDOFF_SUCCEEDS_WHEN_WORKER_CONFIRMS_DELIVERY_001"
]
gates = ["pr"]
evidence_refs = []
spec_gap_refs = []
