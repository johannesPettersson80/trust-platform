schema_version = 1
id = "RT_ADS_SYMBOL_IMPORT_SELECTION_001"
title = "ADS symbol selection and generated names are deterministic and ST-safe"
area = "protocols"
risk = "wrong_result"
status = "mapped"
owner = "trust-runtime"
last_reviewed = "2026-07-22"
claim = "ADS import selection honors exact-list precedence and complete star matching without empty-pattern broadening, while generated names remain unique Structured Text identifiers rather than keywords."
proof_level = "T1"
contract_kind = "decision_table"
source_refs = ["crates/trust-runtime/src/host/ads/onboarding/import.rs"]
tests = [
  "TEST_ADS_SYMBOL_IMPORT_BUILD_IMPORT_RESPONSE_EMPTY_PATTERN_SELECTS_NOTHING_001",
  "TEST_ADS_SYMBOL_IMPORT_BUILD_IMPORT_RESPONSE_GLOB_BACKTRACKS_TO_ANCHORED_SUFFIX_001",
  "TEST_ADS_SYMBOL_IMPORT_BUILD_IMPORT_RESPONSE_HONORS_EXPLICIT_SYMBOL_LIST_001",
  "TEST_ADS_SYMBOL_IMPORT_BUILD_IMPORT_RESPONSE_PREFIXES_ALL_RESERVED_ST_KEYWORDS_001",
]
gates = ["pr"]
evidence_refs = []
spec_gap_refs = []
missing = ["assertion_reachability", "mutation_sensitivity", "broad_remote_gate"]

[spec]
status = "specified"
source_refs = ["SPEC_RUNTIME_ENGINE_001"]

[oracle]
kind = "trust_contract"
ref = "SPEC_RUNTIME_ENGINE_001#ads-symbol-import-selection-and-generated-identifiers"

[[behavior]]
partition = { equals = "EXACT_SYMBOL_LIST" }
case_family = "happy_path"
oracle_ref = "SPEC_RUNTIME_ENGINE_001#ads-symbol-import-selection-and-generated-identifiers"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "unchanged", process_image = "unchanged", diagnostics = "none", status = "not_applicable" }
rationale = "Exact symbols are selected without broadening from simultaneous include patterns."

[[behavior]]
partition = { equals = "STAR_PATTERN_WITH_REPEATED_SUFFIX_FRAGMENT" }
case_family = "happy_path"
oracle_ref = "SPEC_RUNTIME_ENGINE_001#ads-symbol-import-selection-and-generated-identifiers"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "unchanged", process_image = "unchanged", diagnostics = "none", status = "not_applicable" }
rationale = "Backtracking star matching finds the occurrence that satisfies the complete anchored suffix."

[[behavior]]
partition = { equals = "EMPTY_INCLUDE_PATTERN" }
case_family = "missing_required"
oracle_ref = "SPEC_RUNTIME_ENGINE_001#ads-symbol-import-selection-and-generated-identifiers"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "unchanged", process_image = "unchanged", diagnostics = "none", status = "not_applicable" }
rationale = "An empty filter deterministically selects nothing instead of becoming an implicit wildcard."

[[behavior]]
partition = { equals = "NORMALIZED_ST_KEYWORD" }
case_family = "encoding_or_unicode"
oracle_ref = "SPEC_RUNTIME_ENGINE_001#ads-symbol-import-selection-and-generated-identifiers"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "unchanged", process_image = "unchanged", diagnostics = "none", status = "not_applicable" }
rationale = "The canonical ST lexer identifies the complete keyword vocabulary before generated-name emission."

[[coverage.cells]]
dimension = "happy_path"
state = "covered"
rationale = "Focused tests cover exact-list precedence and a repeated-fragment anchored glob."

[[coverage.cells]]
dimension = "missing_required"
state = "covered"
rationale = "A focused regression covers an explicitly empty include pattern."

[[coverage.cells]]
