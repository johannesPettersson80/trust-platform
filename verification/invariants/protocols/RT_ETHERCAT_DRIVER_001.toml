schema_version = 1
id = "RT_ETHERCAT_DRIVER_001"
title = "EtherCAT configuration, health policy, and process-image shape are deterministic"
area = "protocols"
risk = "safety_critical"
status = "mapped"
owner = "trust-runtime"
last_reviewed = "2026-07-26"
claim = "EtherCAT configuration and ordinary cycle failures must preserve deterministic layout and fail closed on an incompatible process-image shape."
proof_level = "S0"
contract_kind = "protocol_trace"
source_refs = ["crates/trust-runtime/src/io/ethercat", "docs/specs/11-runtime-engine.md"]
tests = ["TEST_AUTO_06821893F4327F36D9E8", "TEST_AUTO_2CDFD00CD4BD8C8471A8", "TEST_AUTO_6F665C0AE3F1C64063FF", "TEST_AUTO_A55F43B94FBE8F142878", "TEST_AUTO_B6FF8A186F0A1C6B7D26", "TEST_AUTO_B8264EC4F849EE66B2CA", "TEST_AUTO_C5B92BB21025CAE02946", "TEST_AUTO_FBF8AF35E1047258FE7E"]
gates = ["veryquick", "pr"]
evidence_refs = []
spec_gap_refs = []
missing = ["focused_remote_execution", "default_chain_exact_order_and_channels", "physical_hardware_topology_evidence", "broad_remote_gate"]

[spec]
status = "specified"
source_refs = ["SPEC_RUNTIME_ENGINE_001"]

[oracle]
kind = "trust_contract"
ref = "SPEC_RUNTIME_ENGINE_001#io-drivers"

[[behavior]]
partition = { equals = "VALID_DEFAULT_OR_EXPLICIT_ADAPTER_CONFIGURATION" }
case_family = "happy_path"
oracle_ref = "SPEC_RUNTIME_ENGINE_001#io-drivers"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "none", status = "unchanged" }
rationale = "Reviewed defaults preserve deterministic image sizing and an explicit hardware adapter name remains authoritative; the current tests do not prove the exact full module order, slots, or channel sequence."

[[behavior]]
partition = { equals = "CYCLE_LATENCY_THRESHOLD" }
case_family = "hardware_or_network_fault"
oracle_ref = "SPEC_RUNTIME_ENGINE_001#io-drivers"
outcome = "not_safe_reported"
no_partial_apply = true
delta = { target = "unchanged", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "expected_diagnostic", status = "status_degraded" }
rationale = "A cycle exceeding its reviewed latency threshold preserves a visible degraded health state."

[[behavior]]
partition = { equals = "FAULT_POLICY_FAILURE" }
case_family = "hardware_or_network_fault"
oracle_ref = "SPEC_RUNTIME_ENGINE_001#io-drivers"
outcome = "reject"
no_partial_apply = true
delta = { target = "unchanged", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "expected_diagnostic", status = "fault_visible" }
rationale = "Fault policy returns the driver failure and exposes faulted health."

[[behavior]]
partition = { equals = "WARN_OR_IGNORE_POLICY_FAILURE" }
case_family = "hardware_or_network_fault"
oracle_ref = "SPEC_RUNTIME_ENGINE_001#io-drivers"
outcome = "not_safe_reported"
no_partial_apply = true
delta = { target = "unchanged", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "expected_diagnostic", status = "status_degraded" }
rationale = "Warn or ignore policy may keep the runtime active only while preserving degraded health."

[[behavior]]
partition = { equals = "PROCESS_IMAGE_SHAPE_MISMATCH" }
case_family = "wrong_type_or_shape"
oracle_ref = "SPEC_RUNTIME_ENGINE_001#io-drivers"
outcome = "reject"
no_partial_apply = true
delta = { target = "unchanged", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "expected_diagnostic", status = "fault_visible" }
rationale = "A discovered process-image size mismatch faults even under warn because continuing would reinterpret channel layout."

[[coverage.cells]]
dimension = "hardware_or_network_fault"
state = "gap_open"
rationale = "The EtherCAT configuration and policy contract is specified; mapping and focused execution remain pending, and physical topology evidence stays open."
