schema_version = 1
id = "RT_ADS_ONBOARDING_DISCOVERY_001"
title = "ADS onboarding discovery preserves endpoint identity and partial success"
area = "protocols"
risk = "wrong_result"
status = "mapped"
owner = "trust-runtime"
last_reviewed = "2026-07-26"
claim = "Manual, directed-identify, and directed-broadcast discovery preserve every distinct ADS endpoint, deduplicate repeated endpoint observations, and isolate broadcast failures."
proof_level = "T1"
contract_kind = "protocol_trace"
source_refs = ["crates/trust-runtime/src/host/ads/onboarding/discover.rs"]
tests = ["TEST_ADS_ONBOARDING_DISCOVERY_BROADCAST_FAILURE_PRESERVES_SUCCESSFUL_MANUAL_IDENTITY_001", "TEST_ADS_ONBOARDING_DISCOVERY_DIRECTED_BROADCAST_COLLECTS_MULTIPLE_ADS_TARGETS_FROM_ONE_SUBNET_001", "TEST_ADS_ONBOARDING_DISCOVERY_DIRECTED_BROADCAST_IS_OPTIONAL_AND_DEDUPLICATED_001", "TEST_ADS_ONBOARDING_DISCOVERY_DIRECTED_IDENTIFY_COLLECTS_TARGET_FIELDS_FROM_WIRE_001", "TEST_ADS_ONBOARDING_DISCOVERY_DISCOVERY_DEDUPLICATES_BY_ADS_ENDPOINT_NOT_HOST_IP_001", "TEST_ADS_ONBOARDING_DISCOVERY_MANUAL_DISCOVERY_PATH_DOES_NOT_DEPEND_ON_UDP_IDENTIFY_001", "TEST_AUTO_0C0E896B727531F1A82B"]
gates = ["pr"]
evidence_refs = []
spec_gap_refs = []
missing = ["assertion_reachability", "mutation_sensitivity", "broad_remote_gate"]

[spec]
status = "specified"
source_refs = ["SPEC_RUNTIME_ENGINE_001"]

[oracle]
kind = "trust_contract"
ref = "SPEC_RUNTIME_ENGINE_001#ads-onboarding-discovery-endpoint-identity"

[[behavior]]
partition = { equals = "MANUAL_IDENTITY_SUPPLIED" }
case_family = "happy_path"
oracle_ref = "SPEC_RUNTIME_ENGINE_001#ads-onboarding-discovery-endpoint-identity"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "unchanged", process_image = "unchanged", diagnostics = "none", status = "not_applicable" }
rationale = "Manual routed targets remain first-class even when UDP identify is unavailable."

[[behavior]]
partition = { equals = "DIRECTED_IDENTIFY_REQUIRED" }
case_family = "missing_required"
oracle_ref = "SPEC_RUNTIME_ENGINE_001#ads-onboarding-discovery-endpoint-identity"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "unchanged", process_image = "unchanged", diagnostics = "none", status = "not_applicable" }
rationale = "Without a supplied AMS identity, directed identify supplies the endpoint fields."

[[behavior]]
partition = { equals = "MULTIPLE_ENDPOINTS_SAME_HOST" }
case_family = "duplicate_or_collision"
oracle_ref = "SPEC_RUNTIME_ENGINE_001#ads-onboarding-discovery-endpoint-identity"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "expected_delta", retain = "unchanged", process_image = "unchanged", diagnostics = "none", status = "not_applicable" }
rationale = "Endpoint uniqueness is AMS Net ID plus AMS port, never host IP alone."

[[behavior]]
partition = { equals = "REPEATED_ENDPOINT_OBSERVATION" }
case_family = "duplicate_or_collision"
oracle_ref = "SPEC_RUNTIME_ENGINE_001#ads-onboarding-discovery-endpoint-identity"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "unchanged", siblings = "unchanged", retain = "unchanged", process_image = "unchanged", diagnostics = "none", status = "not_applicable" }
rationale = "Repeated observations of one ADS endpoint produce one result."

[[behavior]]
partition = { equals = "ONE_BROADCAST_CANDIDATE_FAILS" }
case_family = "hardware_or_network_fault"
oracle_ref = "SPEC_RUNTIME_ENGINE_001#ads-onboarding-discovery-endpoint-identity"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "unchanged", siblings = "unchanged", retain = "unchanged", process_image = "unchanged", diagnostics = "none", status = "not_applicable" }
rationale = "Broadcast failure is isolated and cannot erase successful independent results."

[[coverage.cells]]
dimension = "happy_path"
state = "covered"
rationale = "Focused tests cover manual identity, directed identify, broadcast enumeration, and derived targets."

[[coverage.cells]]
dimension = "duplicate_or_collision"
state = "covered"
rationale = "Focused regression covers same-host distinct endpoints, repeated endpoint identity, and distinct AMS ports."

[[coverage.cells]]
dimension = "hardware_or_network_fault"
state = "covered"
rationale = "A behavior lock proves broadcast failure preserves an independent manual result."

[[coverage.cells]]
dimension = "missing_required"
state = "covered"
rationale = "Existing focused directed-identify tests cover endpoint-field discovery when no manual AMS identity is supplied."
