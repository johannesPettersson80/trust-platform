[spec]
status = "specified"
source_refs = ["SPEC_RUNTIME_ENGINE_001"]

[oracle]
kind = "trust_contract"
ref = "SPEC_RUNTIME_ENGINE_001#ads-server-command-dispatch-and-resource-safety"

[[behavior]]
partition = { equals = "POLICY_REJECTED_CLIENT" }
case_family = "auth_or_permission"
oracle_ref = "SPEC_RUNTIME_ENGINE_001#ads-server-command-dispatch-and-resource-safety"
outcome = "reject"
no_partial_apply = true
delta = { target = "unchanged", siblings = "unchanged", retain = "unchanged", process_image = "unchanged", diagnostics = "stable_error", status = "not_safe_reported" }
rationale = "Policy rejection precedes command parsing, handle allocation, reads, writes, and notifications."

[[behavior]]
partition = { equals = "VALID_DIRECT_NAME_HANDLE_OR_UPLOAD_READ" }
case_family = "happy_path"
oracle_ref = "SPEC_RUNTIME_ENGINE_001#ads-server-command-dispatch-and-resource-safety"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "unchanged", siblings = "unchanged", retain = "unchanged", process_image = "unchanged", diagnostics = "none", status = "not_applicable" }
rationale = "Compatible clients receive deterministic metadata and value bytes at the requested ADS wire length."

[[behavior]]
partition = { equals = "HANDLE_LIMIT_OR_NUMERIC_WRAP" }
case_family = "resource_limit"
oracle_ref = "SPEC_RUNTIME_ENGINE_001#ads-server-command-dispatch-and-resource-safety"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "unchanged", process_image = "unchanged", diagnostics = "none", status = "not_applicable" }
rationale = "Allocation returns a unique non-zero free handle or a stable resource error without replacing live state."

[[behavior]]
partition = { equals = "WRITABLE_OR_READ_ONLY_SYMBOL" }
case_family = "auth_or_permission"
oracle_ref = "SPEC_RUNTIME_ENGINE_001#ads-server-command-dispatch-and-resource-safety"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "unchanged", process_image = "expected_delta", diagnostics = "stable_error", status = "not_applicable" }
rationale = "Only capability-authorized writes reach the runtime queue and every decision crosses the audit boundary."

[[behavior]]
partition = { equals = "MALFORMED_OR_OVERSIZED_SUMUP_WRITE" }
case_family = "wrong_type_or_shape"
oracle_ref = "SPEC_RUNTIME_ENGINE_001#ads-server-command-dispatch-and-resource-safety"
outcome = "reject"
no_partial_apply = true
delta = { target = "unchanged", siblings = "unchanged", retain = "unchanged", process_image = "unchanged", diagnostics = "stable_error", status = "not_safe_reported" }
rationale = "The complete aggregate framing and write-data range set validates before the first item can mutate runtime state."

[[behavior]]
partition = { equals = "VALID_OR_INVALID_NOTIFICATION_REGISTRATION" }
case_family = "boundary_high"
oracle_ref = "SPEC_RUNTIME_ENGINE_001#ads-server-command-dispatch-and-resource-safety"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "unchanged", process_image = "unchanged", diagnostics = "stable_error", status = "not_applicable" }
rationale = "Valid watches receive unique registrations and invalid modes, sizes, targets, limits, or deletes fail without replacing live registrations."

[[coverage.cells]]
dimension = "happy_path"
state = "covered"
rationale = "Focused command tests cover direct, by-name, by-handle, system-symbol, upload, sum-up, and notification success paths."

