schema_version = 1
id = "RT_OPCUA_SERVER_SURFACE_001"
title = "OPC UA server scalar, security, and cold-start authority is fail-closed"
area = "protocols"
risk = "security"
status = "mapped"
owner = "trust-runtime"
last_reviewed = "2026-07-26"
claim = "The OPC UA server must expose only reviewed read-only scalar and enum values, enforce compatible security and trust, and start without fabricating a value before the first runtime snapshot."
proof_level = "S0"
contract_kind = "protocol_trace"
source_refs = ["crates/trust-runtime/src/host/opcua", "crates/trust-runtime/tests/opcua_integration.rs", "docs/specs/11-runtime-engine.md"]
tests = ["TEST_AUTO_21730EA1408811561B32", "TEST_AUTO_6236F0B25551D48929F7", "TEST_AUTO_6847FE4C45F88000E0B4", "TEST_AUTO_A2F34DF30D8EC15DD686", "TEST_AUTO_B45DE574A2218F802B88", "TEST_AUTO_BE2359D13DCE953DC558", "TEST_AUTO_CA24079FB9ACE8346755", "TEST_AUTO_DA883AC380548C276E7F"]
gates = ["veryquick", "pr"]
evidence_refs = []
spec_gap_refs = []
missing = ["external_opcua_vendor", "production_certificate_topology", "broad_remote_gate"]

[spec]
status = "specified"
source_refs = ["SPEC_RUNTIME_ENGINE_001"]

[oracle]
kind = "trust_contract"
ref = "SPEC_RUNTIME_ENGINE_001#opc-ua-server-surface-security-and-cold-start"

[[behavior]]
partition = { equals = "SUPPORTED_SCALAR_OR_ENUM_PROJECTION" }
case_family = "happy_path"
oracle_ref = "SPEC_RUNTIME_ENGINE_001#opc-ua-server-surface-security-and-cold-start"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "none", status = "unchanged" }
rationale = "Reviewed IEC scalar widths retain their OPC UA type and value, while an enum retains its selected variant name as String."

[[behavior]]
partition = { equals = "UNSUPPORTED_RUNTIME_VALUE" }
case_family = "wrong_type_or_shape"
oracle_ref = "SPEC_RUNTIME_ENGINE_001#opc-ua-server-surface-security-and-cold-start"
outcome = "reject"
no_partial_apply = true
delta = { target = "unchanged", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "none", status = "unchanged" }
rationale = "Null, references, time values, and unsupported aggregates are omitted instead of projected as fabricated scalars."

[[behavior]]
partition = { equals = "SECURE_PROFILE_DEFAULT" }
case_family = "auth_or_permission"
oracle_ref = "SPEC_RUNTIME_ENGINE_001#opc-ua-server-surface-security-and-cold-start"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "none", status = "unchanged" }
rationale = "The secure default is Basic256Sha256 with SignAndEncrypt and anonymous access disabled."

[[behavior]]
partition = { equals = "INCOMPATIBLE_SECURITY_POLICY_AND_MODE" }
case_family = "auth_or_permission"
oracle_ref = "SPEC_RUNTIME_ENGINE_001#opc-ua-server-surface-security-and-cold-start"
outcome = "reject"
no_partial_apply = true
delta = { target = "unchanged", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "stable_error", status = "unchanged" }
rationale = "Policy None with signing, or another incompatible policy/mode pair, fails before server activation."

[[behavior]]
partition = { equals = "SERVER_START_BEFORE_FIRST_SNAPSHOT" }
case_family = "ordering_or_lifecycle"
oracle_ref = "SPEC_RUNTIME_ENGINE_001#opc-ua-server-surface-security-and-cold-start"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "none", status = "not_safe_reported" }
rationale = "The listener starts before snapshot authority and later publishes the first available snapshot without inventing an earlier value."

[[behavior]]
partition = { equals = "REFERENCE_CLIENT_READS_SUPPORTED_SCALAR" }
case_family = "hardware_or_network_fault"
oracle_ref = "SPEC_RUNTIME_ENGINE_001#opc-ua-server-surface-security-and-cold-start"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "none", status = "unchanged" }
rationale = "The loopback reference client reads an exported supported scalar with read-only authority."

[[behavior]]
partition = { equals = "USER_AUTH_AND_CERTIFICATE_TRUST" }
case_family = "auth_or_permission"
oracle_ref = "SPEC_RUNTIME_ENGINE_001#opc-ua-server-surface-security-and-cold-start"
outcome = "not_safe_reported"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "expected_diagnostic", status = "not_safe_reported" }
rationale = "Anonymous and untrusted clients fail while the configured trusted username path may read the node."

[[coverage.cells]]
dimension = "auth_or_permission"
state = "gap_open"
rationale = "The server surface and security contract is specified; catalog mapping, focused execution, and external-vendor proof remain open."
