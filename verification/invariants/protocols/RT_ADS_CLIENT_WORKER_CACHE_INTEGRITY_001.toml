spec_gap_refs = []
missing = ["assertion_reachability", "mutation_sensitivity", "broad_remote_gate", "zero_by_name_handle_policy", "zero_subscription_id_policy", "duplicate_valid_notification_policy", "pending_write_replay_across_reconnect_policy", "in_flight_transport_call_cancellation", "external_ads_target", "twincat_lab"]

[spec]
status = "specified"
source_refs = ["SPEC_RUNTIME_ENGINE_001"]

[oracle]
kind = "trust_contract"
ref = "SPEC_RUNTIME_ENGINE_001#ads-client-transport-boundary"

[[behavior]]
partition = { equals = "COMPLETE_CORRELATED_STABLE_SESSION" }
case_family = "happy_path"
oracle_ref = "SPEC_RUNTIME_ENGINE_001#ads-client-transport-boundary"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "unchanged", process_image = "unchanged", diagnostics = "none", status = "unchanged" }
rationale = "Complete handle, poll, subscription, notification, and write responses with a stable equality token may update only their correlated points."

[[behavior]]
partition = { equals = "MISSING_EXTRA_DUPLICATE_OR_MISMATCHED_RESPONSE" }
case_family = "wrong_type_or_shape"
oracle_ref = "SPEC_RUNTIME_ENGINE_001#ads-client-transport-boundary"
outcome = "reject"
no_partial_apply = true
delta = { target = "unchanged", siblings = "unchanged", retain = "unchanged", process_image = "unchanged", diagnostics = "stable_error", status = "fault_visible" }
rationale = "Structurally malformed handle, poll, subscription, notification, or write responses cannot partially publish candidate state or fabricate success."

[[behavior]]
partition = { equals = "UNEQUAL_OR_UNSTABLE_SYMBOL_TOKEN_OR_RECONNECT" }
case_family = "ordering_or_lifecycle"
oracle_ref = "SPEC_RUNTIME_ENGINE_001#ads-client-transport-boundary"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "unchanged", process_image = "unchanged", diagnostics = "expected_diagnostic", status = "status_degraded" }
rationale = "Any unequal token revokes old Good authority, and new session state publishes only after complete validation with the same token before and after construction."

[[behavior]]
partition = { equals = "NEWER_LOCAL_WRITE_GENERATION_DURING_OLDER_COMPLETION" }
case_family = "concurrency_or_cancellation"
oracle_ref = "SPEC_RUNTIME_ENGINE_001#ads-client-transport-boundary"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "unchanged", process_image = "unchanged", diagnostics = "none", status = "status_degraded" }
rationale = "An older in-flight result cannot erase or overwrite a newer pending value, cancellation, or non-finite error generation."

[[behavior]]
partition = { equals = "NONFINITE_REAL_OR_LREAL_EGRESS" }
case_family = "wrong_type_or_shape"
oracle_ref = "SPEC_RUNTIME_ENGINE_001#ads-client-transport-boundary"
outcome = "reject"
no_partial_apply = true
delta = { target = "unchanged", siblings = "unchanged", retain = "unchanged", process_image = "unchanged", diagnostics = "stable_error", status = "fault_visible" }
rationale = "Scalar or array NaN and infinity cancel local unconfirmed intent and fail before shared queue or ADS wire activity."

[[behavior]]
partition = { equals = "STOP_REQUEST_DURING_IDLE_WAIT" }
case_family = "concurrency_or_cancellation"
oracle_ref = "SPEC_RUNTIME_ENGINE_001#ads-client-transport-boundary"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "unchanged", siblings = "unchanged", retain = "unchanged", process_image = "unchanged", diagnostics = "none", status = "unchanged" }
rationale = "Stop wakes the worker's idle wait without claiming cancellation of a transport operation already in flight."

[[coverage.cells]]
dimension = "happy_path"
state = "covered"
rationale = "Existing bridge, read/write, notification, descriptor, and worker locks cover complete correlated operation."

[[coverage.cells]]
dimension = "wrong_type_or_shape"
state = "covered"
rationale = "Focused adversarial responses and egress values cover malformed cardinality, identity, descriptor, quality, and finite-value boundaries."

[[coverage.cells]]
dimension = "duplicate_or_collision"
state = "covered"
rationale = "Focused handle and subscription cases reject duplicate response identities before state publication."

[[coverage.cells]]
dimension = "ordering_or_lifecycle"
state = "covered"
rationale = "Symbol equality, refresh, reconnect, stable candidate publication, and interruptible idle shutdown are directly exercised."

[[coverage.cells]]
dimension = "concurrency_or_cancellation"
state = "covered"
rationale = "Generation-tagged completion proof prevents an older write result from erasing a newer intent or error."

[[coverage.cells]]
dimension = "hardware_or_network_fault"
state = "gap_open"
rationale = "Hermetic transport proof does not replace external ADS target and TwinCAT lab evidence."

[[coverage.cells]]
dimension = "persistence_or_recovery"
state = "gap_open"
rationale = "Terminal write retry/drop and pending-intent replay across reconnect remain unresolved product decisions."
