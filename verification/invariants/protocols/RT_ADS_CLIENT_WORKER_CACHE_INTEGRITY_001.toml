schema_version = 1
id = "RT_ADS_CLIENT_WORKER_CACHE_INTEGRITY_001"
title = "ADS client worker and cache preserve correlated session and write truth"
area = "protocols"
risk = "silent_corruption"
status = "mapped"
owner = "trust-runtime"
last_reviewed = "2026-07-23"
claim = "The ADS client publishes and mutates worker/cache state only from complete endpoint-correlated responses and stable symbol authority, represents output intent and completion with generation-safe local truth, rejects non-finite egress before queue or wire activity, and can stop an idle worker without waiting for the configured polling interval."
proof_level = "T1"
contract_kind = "state_machine"
source_refs = ["crates/trust-runtime/src/host/ads/client.rs", "crates/trust-runtime/src/host/ads/client/worker.rs", "crates/trust-runtime/src/host/ads/client/cache.rs"]
