schema_version = 1
id = "RT_MODBUS_DRIVER_001"
title = "Modbus functions, point maps, failures, and worker lifecycle are deterministic"
area = "protocols"
risk = "silent_corruption"
status = "mapped"
owner = "trust-runtime"
last_reviewed = "2026-07-26"
claim = "Modbus configuration and execution must preserve function, typed point-map, error-policy, exception, reconnect, and shutdown authority."
proof_level = "S0"
contract_kind = "protocol_trace"
source_refs = ["crates/trust-runtime/src/io/modbus", "docs/specs/11-runtime-engine.md"]
tests = ["TEST_AUTO_115B36B27D6276F2E2C0", "TEST_AUTO_22FFF435A5C79CFB4226", "TEST_AUTO_2CE088F1926B33175423", "TEST_AUTO_456E5DFC92F78865CD94", "TEST_AUTO_6E23CF19296BECF5CAB1", "TEST_AUTO_788265591A86ECBA1247", "TEST_AUTO_7CCA5C983F3BC05339EC", "TEST_AUTO_84211DB0157DDFA2DAD8", "TEST_AUTO_859C42B742CE618E4C76", "TEST_AUTO_A3BEFC6AEFD5123C849D", "TEST_AUTO_A89C5FA2356D682836D2", "TEST_AUTO_F8896C1E5734037D4BF4"]
gates = ["veryquick", "pr"]
evidence_refs = []
spec_gap_refs = []
missing = ["cataloged_behavior_tests", "focused_remote_execution", "retry_attempt_observation", "worker_shutdown_join", "external_modbus_device_evidence", "broad_remote_gate"]

[spec]
status = "specified"
source_refs = ["SPEC_RUNTIME_ENGINE_001"]

[oracle]
kind = "trust_contract"
ref = "SPEC_RUNTIME_ENGINE_001#io-drivers"

[[behavior]]
partition = { equals = "SUPPORTED_EXPLICIT_FUNCTION" }
case_family = "happy_path"
oracle_ref = "SPEC_RUNTIME_ENGINE_001#io-drivers"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "not_applicable", process_image = "expected_delta", diagnostics = "none", status = "unchanged" }
rationale = "FC01/02/03/04 reads and FC05/06/15/16 writes preserve their configured direction and wire operation."

[[behavior]]
partition = { equals = "TYPED_POINT_MAP_READ_OR_WRITE" }
case_family = "happy_path"
oracle_ref = "SPEC_RUNTIME_ENGINE_001#io-drivers"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "not_applicable", process_image = "expected_delta", diagnostics = "none", status = "unchanged" }
rationale = "Coil and register point maps preserve type, endian, scale, offset, and process-image coordinates."

[[behavior]]
partition = { equals = "UNKNOWN_FUNCTION" }
case_family = "extra_or_unknown"
oracle_ref = "SPEC_RUNTIME_ENGINE_001#io-drivers"
outcome = "reject"
no_partial_apply = true
delta = { target = "unchanged", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "expected_diagnostic", status = "unchanged" }
rationale = "An unrecognized Modbus function fails before worker activation."

[[behavior]]
partition = { equals = "INVALID_POINT_TYPE_OR_SCALING" }
case_family = "wrong_type_or_shape"
oracle_ref = "SPEC_RUNTIME_ENGINE_001#io-drivers"
outcome = "reject"
no_partial_apply = true
delta = { target = "unchanged", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "expected_diagnostic", status = "unchanged" }
rationale = "Invalid point-map type or scaling combinations fail before worker activation."

[[behavior]]
partition = { equals = "FAULT_POLICY_TRANSPORT_FAILURE" }
case_family = "hardware_or_network_fault"
oracle_ref = "SPEC_RUNTIME_ENGINE_001#io-drivers"
outcome = "reject"
no_partial_apply = true
delta = { target = "unchanged", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "expected_diagnostic", status = "fault_visible" }
rationale = "Fault policy returns the typed transport failure and exposes faulted health."

[[behavior]]
partition = { equals = "WARN_OR_IGNORE_TRANSPORT_FAILURE" }
case_family = "hardware_or_network_fault"
oracle_ref = "SPEC_RUNTIME_ENGINE_001#io-drivers"
outcome = "not_safe_reported"
no_partial_apply = true
delta = { target = "unchanged", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "expected_diagnostic", status = "status_degraded" }
rationale = "Warn and ignore may keep the runtime active only with degraded health."

[[behavior]]
partition = { equals = "PROTOCOL_EXCEPTION" }
case_family = "hardware_or_network_fault"
oracle_ref = "SPEC_RUNTIME_ENGINE_001#io-drivers"
outcome = "reject"
no_partial_apply = true
delta = { target = "unchanged", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "expected_diagnostic", status = "fault_visible" }
rationale = "A Modbus exception remains an address/protocol error and is not rewritten as generic transport unavailability."

[[behavior]]
partition = { equals = "RECONNECT_ATTEMPT_OBSERVED" }
case_family = "ordering_or_lifecycle"
oracle_ref = "SPEC_RUNTIME_ENGINE_001#io-drivers"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "unchanged", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "none", status = "status_degraded" }
rationale = "An unavailable endpoint produces another observable connection attempt."

[[behavior]]
partition = { equals = "RECONNECT_NONSPINNING_BOUND" }
case_family = "ordering_or_lifecycle"
oracle_ref = "SPEC_RUNTIME_ENGINE_001#io-drivers"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "unchanged", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "none", status = "status_degraded" }
rationale = "Failed connection attempts use a non-zero bounded backoff instead of spinning continuously."

[[behavior]]
partition = { equals = "DROP_SHUTDOWN_SIGNAL_BOUND" }
case_family = "concurrency_or_cancellation"
oracle_ref = "SPEC_RUNTIME_ENGINE_001#io-drivers"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "unchanged", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "none", status = "unchanged" }
rationale = "Drop signals shutdown and returns within its deadline without claiming the detached worker has joined."

[[coverage.cells]]
dimension = "hardware_or_network_fault"
state = "gap_open"
rationale = "The driver contract is specified; catalog mapping, focused execution, and external-device evidence remain pending."
