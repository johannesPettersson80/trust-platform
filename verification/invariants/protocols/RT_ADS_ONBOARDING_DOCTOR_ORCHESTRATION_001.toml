owner = "trust-runtime"
last_reviewed = "2026-07-22"
claim = "The ADS client Doctor validates manual and active endpoints, executes the ordered fail-closed step chain, accepts only uploaded symbols, and reports live read health from timestamped good points."
proof_level = "T1"
contract_kind = "decision_table"
source_refs = ["crates/trust-runtime/src/host/ads/onboarding/doctor.rs", "crates/trust-runtime/src/host/ads/onboarding/doctor/job.rs", "crates/trust-runtime/src/host/ads/onboarding/doctor/target_validation.rs", "crates/trust-runtime/src/host/ads/onboarding/identity.rs"]
tests = ["TEST_ADS_ONBOARDING_DOCTOR_ACTIVE_DEVICE_BATCH_READ_REQUIRES_A_TIMESTAMPED_GOOD_POINT_001", "TEST_ADS_ONBOARDING_DOCTOR_ACTIVE_DEVICE_READ_ONLY_USES_LIVE_STATUS_AND_NEVER_OPENS_WIRE_CONNECTION_001", "TEST_ADS_ONBOARDING_DOCTOR_ACTIVE_DEVICE_SHORTCUT_REQUIRES_THE_EXACT_REQUESTED_ENDPOINT_001", "TEST_ADS_ONBOARDING_DOCTOR_DOCTOR_HAPPY_PATH_RUNS_REQUIRED_STEPS_AND_SKIPS_WRITE_PROBE_BY_DEFAULT_001", "TEST_ADS_ONBOARDING_DOCTOR_DOCTOR_JOB_REPORTS_PROGRESS_AND_CANCELLATION_001", "TEST_ADS_ONBOARDING_DOCTOR_DOCTOR_MAPS_NAMED_FAILURES_TO_THE_FAILED_STEP_AND_BLOCKS_DEPENDENTS_001", "TEST_ADS_ONBOARDING_DOCTOR_DOCTOR_REJECTS_BLANK_OR_ABSENT_SELECTED_SYMBOL_AT_UPLOAD_BOUNDARY_001", "TEST_ADS_ONBOARDING_DOCTOR_DOCTOR_REJECTS_INVALID_MANUAL_ENDPOINT_BEFORE_WIRE_ACTIVITY_001", "TEST_ADS_ONBOARDING_DOCTOR_DOCTOR_RUNS_GUARDED_WRITE_PROBE_ONLY_WHEN_EXPLICIT_001", "TEST_ADS_ONBOARDING_DOCTOR_DOCTOR_WITH_MANUAL_TARGET_IDENTITY_DOES_NOT_REQUIRE_UDP_IDENTIFY_001", "TEST_ADS_ONBOARDING_DOCTOR_FULL_DOCTOR_AGAINST_ACTIVE_DEVICE_REQUIRES_EXPLICIT_PAUSE_001", "TEST_ADS_ONBOARDING_DOCTOR_MOCK_FAILURE_SCENARIOS_COVER_NAMED_FIELD_FAILURES_001", "TEST_ADS_ONBOARDING_DOCTOR_PRODUCTION_READY_REQUIRES_PASS_EVIDENCE_AND_LIVE_DEPLOYED_STATUS_001", "TEST_ADS_ONBOARDING_DOCTOR_REQUIRED_DOCTOR_STEPS_AND_TIMEOUTS_MATCH_SPEC_001", "TEST_ADS_ONBOARDING_DOCTOR_WIRE_ERROR_CLASSIFICATION_KEEPS_REMEDIATION_MACHINE_READABLE_001"]
gates = ["pr"]
evidence_refs = []
spec_gap_refs = []
missing = ["assertion_reachability", "mutation_sensitivity", "broad_remote_gate", "external_ads_target", "twincat_lab"]

[spec]
status = "specified"
source_refs = ["SPEC_RUNTIME_ENGINE_001"]

[oracle]
kind = "trust_contract"
ref = "SPEC_RUNTIME_ENGINE_001#ads-doctor-orchestration-and-active-device-safety"

[[behavior]]
partition = { equals = "VALID_MANUAL_FULL_DOCTOR" }
case_family = "happy_path"
oracle_ref = "SPEC_RUNTIME_ENGINE_001#ads-doctor-orchestration-and-active-device-safety"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "unchanged", process_image = "unchanged", diagnostics = "none", status = "not_applicable" }
rationale = "A valid endpoint executes the fixed step order and attaches production evidence only after an all-pass live runtime-host run."

[[behavior]]
partition = { equals = "MALFORMED_MANUAL_ENDPOINT" }
case_family = "wrong_type_or_shape"
oracle_ref = "SPEC_RUNTIME_ENGINE_001#ads-doctor-orchestration-and-active-device-safety"
outcome = "reject"
no_partial_apply = true
delta = { target = "unchanged", siblings = "unchanged", retain = "unchanged", process_image = "unchanged", diagnostics = "stable_error", status = "not_safe_reported" }
rationale = "Invalid IP, AMS Net ID, or zero port fails before the first ADS wire operation."

[[behavior]]
partition = { equals = "BLANK_OR_ABSENT_SELECTED_SYMBOL" }
case_family = "missing_required"
oracle_ref = "SPEC_RUNTIME_ENGINE_001#ads-doctor-orchestration-and-active-device-safety"
outcome = "reject"
no_partial_apply = true
delta = { target = "unchanged", siblings = "unchanged", retain = "unchanged", process_image = "unchanged", diagnostics = "stable_error", status = "not_safe_reported" }
rationale = "Only an exact symbol from the uploaded table may advance to handle resolution."

[[behavior]]
partition = { equals = "MATCHING_ACTIVE_DEVICE_WITH_CURRENT_POINTS" }
case_family = "happy_path"
oracle_ref = "SPEC_RUNTIME_ENGINE_001#ads-doctor-orchestration-and-active-device-safety"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "unchanged", process_image = "unchanged", diagnostics = "none", status = "not_applicable" }
rationale = "Matching live status avoids a duplicate AMS connection and passes read health only for timestamped all-good points."

[[behavior]]
partition = { equals = "MISMATCHED_OR_DEGRADED_ACTIVE_DEVICE" }
case_family = "hardware_or_network_fault"
oracle_ref = "SPEC_RUNTIME_ENGINE_001#ads-doctor-orchestration-and-active-device-safety"
outcome = "reject"
no_partial_apply = true
delta = { target = "unchanged", siblings = "unchanged", retain = "unchanged", process_image = "unchanged", diagnostics = "stable_error", status = "not_safe_reported" }
rationale = "Another endpoint fails closed; empty, timestamp-less, or degraded point state cannot be a passing batch read."

[[coverage.cells]]
dimension = "happy_path"
state = "covered"
rationale = "Focused tests cover manual full runs, optional writes, production evidence, and matching active-device status."

[[coverage.cells]]
dimension = "wrong_type_or_shape"
state = "covered"
rationale = "Focused tests cover malformed IP and AMS identity plus zero port before wire activity."

[[coverage.cells]]
dimension = "missing_required"
state = "covered"
rationale = "Focused tests cover blank, absent, and valid explicit symbol selection and enabled-write probe requirements."

[[coverage.cells]]
dimension = "hardware_or_network_fault"
state = "covered"
rationale = "Focused tests cover target mismatch, empty live points, missing timestamps, degraded points, and pause requirements."

[[coverage.cells]]
dimension = "concurrency_or_cancellation"
state = "covered"
rationale = "Focused job tests cover pre-run cancellation, lifecycle state, progress, and dependent-step blocking."
