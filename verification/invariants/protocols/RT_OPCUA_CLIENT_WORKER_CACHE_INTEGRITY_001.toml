schema_version = 1
id = "RT_OPCUA_CLIENT_WORKER_CACHE_INTEGRITY_001"
title = "OPC UA client worker and cache preserve current session and write truth"
area = "protocols"
risk = "silent_corruption"
status = "mapped"
owner = "trust-runtime"
last_reviewed = "2026-07-23"
claim = "The OPC UA client accepts only current exactly correlated subscription events, preserves monotonic freshness and generation-safe queued writes, rejects non-finite scalar egress and malformed write responses, and revokes readable authority during prompt shutdown."
proof_level = "T1"
contract_kind = "state_machine"
source_refs = ["crates/trust-runtime/src/host/opcua/client_cache.rs", "crates/trust-runtime/src/host/opcua/client_worker.rs", "crates/trust-runtime/src/host/opcua/client_bridge.rs"]
tests = ["TEST_OPCUA_CLIENT_WORKER_CACHE_INTEGRITY_PERSISTENT_WORKER_APPLIES_SUBSCRIPTION_UPDATES_WITHOUT_RECONNECTING_PER_SCAN_001", "TEST_OPCUA_CLIENT_WORKER_CACHE_INTEGRITY_OPCUA_EVENT_QUEUE_REJECTS_SATURATION_AND_RECOVERS_AFTER_DRAIN_001", "TEST_OPCUA_CLIENT_WORKER_CACHE_INTEGRITY_PERSISTENT_WORKER_BATCHES_WRITES_WITHOUT_RECONNECTING_PER_WRITE_001", "TEST_OPCUA_CLIENT_WORKER_CACHE_INTEGRITY_PERSISTENT_WORKER_REJECTED_WRITE_MARKS_POINT_WITHOUT_RECONNECTING_001", "TEST_OPCUA_CLIENT_WORKER_CACHE_INTEGRITY_PERSISTENT_WORKER_MARKS_STALE_THEN_RECOVERS_ON_SUBSCRIPTION_UPDATE_001", "TEST_OPCUA_CLIENT_WORKER_CACHE_INTEGRITY_PERSISTENT_WORKER_RECONNECTS_AFTER_SESSION_LOSS_WITHOUT_SCAN_THREAD_IO_001", "TEST_OPCUA_CLIENT_WORKER_CACHE_INTEGRITY_PERSISTENT_WORKER_RECREATES_SUBSCRIPTION_AFTER_SERVER_RESTART_001", "TEST_OPCUA_CLIENT_WORKER_CACHE_INTEGRITY_PERSISTENT_WORKER_USES_RECOVERY_HOOK_TO_REESTABLISH_SUBSCRIPTIONS_001", "TEST_OPCUA_CLIENT_WORKER_CACHE_INTEGRITY_CONNECTED_DETAIL_REPORTS_TIMEOUT_NEGOTIATION_OR_DOCUMENTED_GAP_001", "TEST_OPCUA_CLIENT_WORKER_CACHE_INTEGRITY_CURRENT_SESSION_SAMPLES_REQUIRE_EXACT_CONFIGURED_IDENTITY_001", "TEST_OPCUA_CLIENT_WORKER_CACHE_INTEGRITY_OLDER_SESSION_CALLBACKS_CANNOT_REGRESS_RECONNECTED_WORKER_001", "TEST_OPCUA_CLIENT_WORKER_CACHE_INTEGRITY_OLDER_ACTIVE_SESSION_SAMPLE_CANNOT_REPLACE_NEWER_VALUE_001", "TEST_OPCUA_CLIENT_WORKER_CACHE_INTEGRITY_WRITE_COMPLETION_PRESERVES_NEWER_PENDING_GENERATION_001", "TEST_OPCUA_CLIENT_WORKER_CACHE_INTEGRITY_NON_FINITE_OUTPUTS_CANCEL_PENDING_AND_ALLOW_LATER_FINITE_VALUE_001", "TEST_OPCUA_CLIENT_WORKER_CACHE_INTEGRITY_WORKER_SHUTDOWN_INTERRUPTS_IDLE_WAIT_AND_REVOKES_GOOD_AUTHORITY_001", "TEST_OPCUA_CLIENT_WORKER_CACHE_INTEGRITY_WIRE_WRITE_STATUS_CARDINALITY_MUST_MATCH_REQUEST_001"]
gates = ["pr"]
evidence_refs = []
spec_gap_refs = []
missing = ["assertion_reachability", "mutation_sensitivity", "broad_remote_gate", "pending_write_replay_across_reconnect_policy", "server_source_timestamp_ordering", "external_opcua_target"]

[spec]
status = "specified"
source_refs = ["SPEC_RUNTIME_ENGINE_001"]

[oracle]
kind = "trust_contract"
ref = "SPEC_RUNTIME_ENGINE_001#opc-ua-client-worker-cache-and-scalar-output-integrity"

[[behavior]]
partition = { equals = "EXACT_CURRENT_SESSION_SAMPLE" }
case_family = "happy_path"
oracle_ref = "SPEC_RUNTIME_ENGINE_001#opc-ua-client-worker-cache-and-scalar-output-integrity"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "unchanged", process_image = "unchanged", diagnostics = "none", status = "unchanged" }
rationale = "Only an active-generation sample matching configured variable, node, type, and access may publish value authority."

[[behavior]]
partition = { equals = "MISMATCHED_SAMPLE_IDENTITY" }
case_family = "wrong_type_or_shape"
oracle_ref = "SPEC_RUNTIME_ENGINE_001#opc-ua-client-worker-cache-and-scalar-output-integrity"
outcome = "reject"
no_partial_apply = true
delta = { target = "unchanged", siblings = "unchanged", retain = "unchanged", process_image = "unchanged", diagnostics = "stable_error", status = "fault_visible" }
rationale = "Unknown or mismatched sample identity cannot create dynamic status or mutate cached and PLC values."

[[behavior]]
partition = { equals = "OLDER_SESSION_OR_EVENT_TIME" }
case_family = "ordering_or_lifecycle"
oracle_ref = "SPEC_RUNTIME_ENGINE_001#opc-ua-client-worker-cache-and-scalar-output-integrity"
outcome = "reject"
no_partial_apply = true
delta = { target = "unchanged", siblings = "unchanged", retain = "unchanged", process_image = "unchanged", diagnostics = "none", status = "unchanged" }
rationale = "Replaced-session callbacks and older active-session events cannot regress newer connection, value, or freshness authority."

[[behavior]]
partition = { equals = "NEWER_WRITE_DURING_OLDER_COMPLETION" }
case_family = "concurrency_or_cancellation"
oracle_ref = "SPEC_RUNTIME_ENGINE_001#opc-ua-client-worker-cache-and-scalar-output-integrity"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "unchanged", process_image = "unchanged", diagnostics = "none", status = "unchanged" }
rationale = "An older success or rejection cannot remove or overwrite a newer queued output generation."

[[behavior]]
partition = { equals = "NONFINITE_REAL_OR_LREAL_EGRESS" }
case_family = "wrong_type_or_shape"
oracle_ref = "SPEC_RUNTIME_ENGINE_001#opc-ua-client-worker-cache-and-scalar-output-integrity"
outcome = "reject"
no_partial_apply = true
delta = { target = "unchanged", siblings = "unchanged", retain = "unchanged", process_image = "unchanged", diagnostics = "stable_error", status = "fault_visible" }
rationale = "NaN and infinity cancel unconfirmed local intent and fail before pending cache or OPC UA wire activity."

[[behavior]]
partition = { equals = "WRITE_STATUS_CARDINALITY_MISMATCH" }
case_family = "wrong_type_or_shape"
oracle_ref = "SPEC_RUNTIME_ENGINE_001#opc-ua-client-worker-cache-and-scalar-output-integrity"
outcome = "reject"
no_partial_apply = true
delta = { target = "unchanged", siblings = "unchanged", retain = "unchanged", process_image = "unchanged", diagnostics = "stable_error", status = "fault_visible" }
rationale = "Missing or extra service results cannot be reported as a successful write batch."

[[behavior]]
partition = { equals = "STOP_REQUEST_DURING_IDLE_WAIT" }
case_family = "concurrency_or_cancellation"
oracle_ref = "SPEC_RUNTIME_ENGINE_001#opc-ua-client-worker-cache-and-scalar-output-integrity"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "unchanged", process_image = "unchanged", diagnostics = "none", status = "unchanged" }
rationale = "Stop wakes the idle worker promptly, disconnects, and revokes readable Good authority."

[[coverage.cells]]
dimension = "happy_path"
state = "covered"
rationale = "Existing persistent session, subscription, and write locks remain green."

[[coverage.cells]]
dimension = "wrong_type_or_shape"
state = "covered"
rationale = "Identity, non-finite egress, and write-cardinality failures are exercised."

[[coverage.cells]]
dimension = "ordering_or_lifecycle"
state = "covered"
rationale = "Current generation, monotonic event time, reconnect, stale recovery, and shutdown are exercised."

[[coverage.cells]]
dimension = "concurrency_or_cancellation"
state = "covered"
rationale = "Older success and rejection completions preserve a newer pending generation."

[[coverage.cells]]
dimension = "hardware_or_network_fault"
state = "gap_open"
rationale = "Hermetic transport proof does not replace an external OPC UA target."

[[coverage.cells]]
dimension = "persistence_or_recovery"
state = "gap_open"
rationale = "Pending-output reconnect replay and server timestamp ordering remain unresolved."
