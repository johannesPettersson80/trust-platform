[oracle]
kind = "trust_contract"
ref = "SPEC_RUNTIME_ENGINE_001#ads-diagnostic-report-and-production-readiness-truth"

[[behavior]]
partition = { equals = "NONEMPTY_ALL_PASS_REPORT" }
case_family = "happy_path"
oracle_ref = "SPEC_RUNTIME_ENGINE_001#ads-diagnostic-report-and-production-readiness-truth"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "unchanged", process_image = "unchanged", diagnostics = "none", status = "not_applicable" }
rationale = "A non-empty all-pass report may pass but remains not ready until role-appropriate evidence is attached."

[[behavior]]
partition = { equals = "EMPTY_BLOCKING_OR_NONBLOCKING_FAILURE" }
case_family = "missing_required"
oracle_ref = "SPEC_RUNTIME_ENGINE_001#ads-diagnostic-report-and-production-readiness-truth"
outcome = "reject"
no_partial_apply = true
delta = { target = "unchanged", siblings = "unchanged", retain = "unchanged", process_image = "unchanged", diagnostics = "stable_error", status = "not_safe_reported" }
rationale = "Empty and blocking reports fail; non-blocking failed steps remain partial and cannot become a clean pass."

[[behavior]]
partition = { equals = "CURRENT_ROLE_APPROPRIATE_EVIDENCE" }
case_family = "happy_path"
oracle_ref = "SPEC_RUNTIME_ENGINE_001#ads-diagnostic-report-and-production-readiness-truth"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "unchanged", process_image = "unchanged", diagnostics = "none", status = "not_applicable" }
rationale = "Matching deployed configuration and live status with fresh role-shaped evidence produces ready."

[[behavior]]
partition = { equals = "STALE_MISSING_MISMATCHED_OR_CLOCK_UNSAFE_EVIDENCE" }
case_family = "boundary_high"
oracle_ref = "SPEC_RUNTIME_ENGINE_001#ads-diagnostic-report-and-production-readiness-truth"
outcome = "reject"
no_partial_apply = true
delta = { target = "unchanged", siblings = "unchanged", retain = "unchanged", process_image = "unchanged", diagnostics = "stable_error", status = "not_safe_reported" }
rationale = "Age, overflow, clock, deployment, and live-status uncertainty invalidates readiness without mutating runtime state."

[[behavior]]
