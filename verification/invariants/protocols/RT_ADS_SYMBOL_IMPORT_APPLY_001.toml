schema_version = 1
id = "RT_ADS_SYMBOL_IMPORT_APPLY_001"
title = "ADS symbol import applies deterministic capability-faithful artifacts"
area = "protocols"
risk = "wrong_result"
status = "mapped"
owner = "trust-runtime"
last_reviewed = "2026-07-22"
claim = "ADS import strictly merges selected symbols, current configuration, snapshots, types, modes, and acknowledged capabilities into deterministic configuration and ST artifacts."
proof_level = "T1"
contract_kind = "decision_table"
source_refs = ["crates/trust-runtime/src/host/ads/onboarding/import.rs", "crates/trust-runtime/src/control/ads_handlers/import_symbols.rs"]
tests = [
  "TEST_ADS_SYMBOL_IMPORT_CONTROL_IMPORT_SYMBOLS_APPLY_ACKNOWLEDGED_WRITABLE_SYMBOLS_AS_READ_WRITE_001",
  "TEST_ADS_SYMBOL_IMPORT_CONTROL_IMPORT_SYMBOLS_APPLY_ACKNOWLEDGED_WRITE_ONLY_SYMBOL_AS_WRITE_001",
  "TEST_ADS_SYMBOL_IMPORT_CORE_APPLY_IMPORT_MERGES_SECOND_CONNECTION_AND_IS_IDEMPOTENT_001",
  "TEST_ADS_SYMBOL_IMPORT_CORE_APPLY_IMPORT_PINS_LOCAL_NET_ID_AND_GENERATES_SINGLE_FILE_001",
  "TEST_ADS_SYMBOL_IMPORT_CORE_APPLY_IMPORT_PROJECTS_STRING_ARRAY_AND_NOTIFY_MODE_001",
  "TEST_ADS_SYMBOL_IMPORT_CORE_APPLY_IMPORT_REJECTS_EMPTY_SELECTION_001",
  "TEST_ADS_SYMBOL_IMPORT_CORE_APPLY_IMPORT_REJECTS_MALFORMED_EXISTING_TOML_001",
  "TEST_ADS_SYMBOL_IMPORT_CORE_APPLY_IMPORT_REJECTS_WRITE_BINDING_WITHOUT_ACKNOWLEDGEMENT_001",
  "TEST_ADS_SYMBOL_IMPORT_CORE_IEC_TYPE_NAME_COVERS_ALL_SUPPORTED_SCALAR_TYPES_001",
]
gates = ["pr"]
evidence_refs = []
spec_gap_refs = []
missing = ["assertion_reachability", "mutation_sensitivity", "broad_remote_gate"]

[spec]
status = "specified"
source_refs = ["SPEC_RUNTIME_ENGINE_001"]

[oracle]
kind = "trust_contract"
ref = "SPEC_RUNTIME_ENGINE_001#ads-symbol-import-apply-and-merge"

[[behavior]]
partition = { equals = "VALID_SELECTED_CONNECTION_MERGE" }
case_family = "happy_path"
oracle_ref = "SPEC_RUNTIME_ENGINE_001#ads-symbol-import-apply-and-merge"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "expected_delta", retain = "unchanged", process_image = "unchanged", diagnostics = "none", status = "not_applicable" }
rationale = "The named connection and snapshot are replaced deterministically while other connections remain present and uniquely named."

[[behavior]]
partition = { equals = "EMPTY_SELECTION" }
case_family = "missing_required"
oracle_ref = "SPEC_RUNTIME_ENGINE_001#ads-symbol-import-apply-and-merge"
outcome = "reject"
no_partial_apply = true
delta = { target = "unchanged", siblings = "unchanged", retain = "unchanged", process_image = "unchanged", diagnostics = "stable_error", status = "not_safe_reported" }
rationale = "No connection artifact exists without at least one selected candidate."

[[behavior]]
partition = { equals = "MALFORMED_CURRENT_CONFIGURATION" }
case_family = "wrong_type_or_shape"
oracle_ref = "SPEC_RUNTIME_ENGINE_001#ads-symbol-import-apply-and-merge"
outcome = "reject"
no_partial_apply = true
delta = { target = "unchanged", siblings = "unchanged", retain = "unchanged", process_image = "unchanged", diagnostics = "stable_error", status = "not_safe_reported" }
rationale = "Current configuration is strict merge authority and cannot be silently discarded."

[[behavior]]
partition = { equals = "STRING_ARRAY_NOTIFY_PROJECTION" }
case_family = "boundary_high"
oracle_ref = "SPEC_RUNTIME_ENGINE_001#ads-symbol-import-apply-and-merge"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "unchanged", process_image = "unchanged", diagnostics = "none", status = "not_applicable" }
rationale = "Capacity, signed array bounds, scalar kind, and notification mode survive configuration projection."

[[behavior]]
partition = { equals = "UNACKNOWLEDGED_WRITE_CAPABILITY" }
case_family = "auth_or_permission"
oracle_ref = "SPEC_RUNTIME_ENGINE_001#ads-symbol-import-apply-and-merge"
outcome = "reject"
no_partial_apply = true
delta = { target = "unchanged", siblings = "unchanged", retain = "unchanged", process_image = "unchanged", diagnostics = "stable_error", status = "not_safe_reported" }
rationale = "Write output cannot exist without explicit acknowledgement."

[[behavior]]
partition = { equals = "ACKNOWLEDGED_REMOTE_CAPABILITIES" }
case_family = "auth_or_permission"
oracle_ref = "SPEC_RUNTIME_ENGINE_001#ads-symbol-import-apply-and-merge"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "unchanged", process_image = "unchanged", diagnostics = "none", status = "not_applicable" }
rationale = "Read-write remains read_write and write-only remains write; acknowledgement never invents read capability."

[[coverage.cells]]
dimension = "happy_path"
state = "covered"
rationale = "Focused tests cover first apply, multi-connection merge, global name uniqueness, and idempotence."

[[coverage.cells]]
dimension = "wrong_type_or_shape"
state = "covered"
rationale = "Focused tests cover strict malformed current configuration and every supported scalar type token."

[[coverage.cells]]
dimension = "boundary_high"
state = "covered"
rationale = "Focused projection covers STRING capacity, negative/inclusive array bounds, and notify mode."

[[coverage.cells]]
dimension = "auth_or_permission"
state = "covered"
rationale = "Focused tests cover unacknowledged denial and acknowledged read-write versus write-only capability projection."

[[coverage.cells]]
dimension = "persistence_or_recovery"
state = "covered"
rationale = "The merge behavior lock covers byte-identical repeated application and preserved sibling connections."
