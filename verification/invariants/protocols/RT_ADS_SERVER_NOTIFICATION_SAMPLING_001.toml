[oracle]
kind = "trust_contract"
ref = "SPEC_RUNTIME_ENGINE_001#ads-server-command-dispatch-and-resource-safety"

[[behavior]]
partition = { equals = "DUE_CADENCE_AND_CHANGE_COALESCING" }
case_family = "ordering_or_lifecycle"
oracle_ref = "SPEC_RUNTIME_ENGINE_001#ads-server-command-dispatch-and-resource-safety"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "expected_delta", retain = "not_applicable", process_image = "unchanged", diagnostics = "none", status = "unchanged" }
rationale = "SERVERCYCLE emits at successive due instants while SERVERONCHA emits, suppresses equal bytes, and emits after a byte change."

[[behavior]]
partition = { equals = "WATCH_LENGTH_AND_TARGET_SOURCE" }
case_family = "boundary_high"
oracle_ref = "SPEC_RUNTIME_ENGINE_001#ads-server-command-dispatch-and-resource-safety"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "none", status = "unchanged" }
rationale = "Runtime symbols, little-endian symbol versions, and static system bytes are truncated to watch length; static targets bypass runtime value reads."

[[behavior]]
partition = { equals = "SOURCE_READ_FAILURE_INVALIDATES_SAMPLE" }
case_family = "persistence_or_recovery"
oracle_ref = "SPEC_RUNTIME_ENGINE_001#ads-server-command-dispatch-and-resource-safety"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "stable_error", status = "unchanged" }
rationale = "A source read failure emits an invalidated sample with the original handle and no fabricated value bytes."

[[behavior]]
partition = { equals = "FILETIME_TIMESTAMP_CONVERSION" }
case_family = "boundary_low"
oracle_ref = "SPEC_RUNTIME_ENGINE_001#ads-server-command-dispatch-and-resource-safety"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "none", status = "unchanged" }
rationale = "Unix epoch milliseconds zero and one convert to the exact representable Windows FILETIME offset and next millisecond."

