owner = "trust-runtime"
last_reviewed = "2026-07-23"
claim = "ADS client configuration accepts only unique, canonical, internally consistent connection and point declarations, preserves explicit plain-transport acknowledgement and runtime identity readiness, and rejects malformed or overflowing type/address metadata before worker creation or wire activity."
proof_level = "T1"
contract_kind = "decision_table"
source_refs = ["crates/trust-runtime/src/host/ads/contracts.rs"]
tests = ["TEST_ADS_CLIENT_CONFIGURATION_PARSES_ADS_TOML_AND_APPLIES_SECURITY_AND_POINT_DEFAULTS_001", "TEST_ADS_CLIENT_CONFIGURATION_REJECTS_PLAIN_TRANSPORT_WITHOUT_EXPLICIT_ACK_001", "TEST_ADS_CLIENT_CONFIGURATION_PLAIN_TRANSPORT_ACK_SURFACES_SECURITY_WARNING_001", "TEST_ADS_CLIENT_CONFIGURATION_PRODUCTION_LOCAL_IDENTITY_VALIDATION_REQUIRES_PINNED_LOCAL_NET_ID_001", "TEST_ADS_CLIENT_CONFIGURATION_PRODUCTION_LOCAL_IDENTITY_VALIDATION_REJECTS_MISMATCHED_LOCAL_NET_ID_001", "TEST_ADS_CLIENT_CONFIGURATION_PRODUCTION_LOCAL_IDENTITY_VALIDATION_ACCEPTS_MATCHING_LOCAL_NET_ID_001", "TEST_ADS_CLIENT_CONFIGURATION_REJECTS_INSECURE_ACK_WITHOUT_PLAIN_TRANSPORT_001", "TEST_ADS_CLIENT_CONFIGURATION_REJECTS_DUPLICATE_DECLARED_VARIABLE_BINDING_001", "TEST_ADS_CLIENT_CONFIGURATION_REJECTS_NOTIFICATION_MODE_WITHOUT_NOTIFY_MODE_001", "TEST_ADS_CLIENT_CONFIGURATION_REJECTS_MIXED_SYMBOL_AND_INDEX_ADDRESSING_001", "TEST_ADS_CLIENT_CONFIGURATION_REJECTS_DUPLICATE_CONNECTION_NAMES_WITH_DISTINCT_POINT_BINDINGS_001", "TEST_ADS_CLIENT_CONFIGURATION_REJECTS_NONCANONICAL_TARGET_AMS_NET_IDS_DURING_CONFIGURATION_PARSE_001", "TEST_ADS_CLIENT_CONFIGURATION_REJECTS_BLANK_OR_NONCANONICAL_EXPLICIT_LOCAL_AMS_NET_IDS_DURING_CONFIGURATION_PARSE_001", "TEST_ADS_CLIENT_CONFIGURATION_LOCKS_CONNECTION_AND_DECLARED_GLOBAL_SHAPE_VALIDATION_001", "TEST_ADS_CLIENT_CONFIGURATION_LOCKS_EXACT_POINT_ADDRESS_SHAPE_VALIDATION_001", "TEST_ADS_CLIENT_CONFIGURATION_LOCKS_POINT_ENUM_AND_TYPE_VALIDATION_001", "TEST_ADS_CLIENT_CONFIGURATION_REJECTS_ZERO_STRING_CAPACITY_001", "TEST_ADS_CLIENT_CONFIGURATION_REJECTS_STRING_CAPACITY_ON_NON_STRING_TYPE_001", "TEST_ADS_CLIENT_CONFIGURATION_REJECTS_INDEX_ADDRESS_SIZE_THAT_DISAGREES_WITH_DECLARED_TYPE_001", "TEST_ADS_CLIENT_CONFIGURATION_REJECTS_ARRAY_METADATA_WHOSE_BYTE_LENGTH_OVERFLOWS_001"]
