[spec]
status = "specified"
source_refs = ["SPEC_RUNTIME_ENGINE_001"]

[oracle]
kind = "trust_contract"
ref = "SPEC_RUNTIME_ENGINE_001#ads-client-configuration-and-activation"

[[behavior]]
partition = { equals = "CANONICAL_COMPLETE_CONFIGURATION" }
case_family = "happy_path"
oracle_ref = "SPEC_RUNTIME_ENGINE_001#ads-client-configuration-and-activation"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "unchanged", process_image = "unchanged", diagnostics = "none", status = "not_applicable" }
rationale = "A complete canonical configuration is normalized into one deterministic runtime contract without wire activity."

[[behavior]]
partition = { equals = "INVALID_CONNECTION_OR_IDENTITY_SHAPE" }
case_family = "wrong_type_or_shape"
oracle_ref = "SPEC_RUNTIME_ENGINE_001#ads-client-configuration-and-activation"
outcome = "reject"
no_partial_apply = true
delta = { target = "unchanged", siblings = "unchanged", retain = "unchanged", process_image = "unchanged", diagnostics = "stable_error", status = "not_safe_reported" }
rationale = "Empty, duplicate, noncanonical, or incomplete connection authority is rejected before route or worker construction."

[[behavior]]
partition = { equals = "INVALID_POINT_ADDRESS_OR_TYPE_METADATA" }
case_family = "boundary_high"
oracle_ref = "SPEC_RUNTIME_ENGINE_001#ads-client-configuration-and-activation"
outcome = "reject"
no_partial_apply = true
delta = { target = "unchanged", siblings = "unchanged", retain = "unchanged", process_image = "unchanged", diagnostics = "stable_error", status = "not_safe_reported" }
rationale = "Incomplete, mismatched, zero-capacity, or overflowing point metadata is rejected before allocation or activation."

[[behavior]]
partition = { equals = "INVALID_SECURITY_OR_RUNTIME_IDENTITY" }
case_family = "auth_or_permission"
oracle_ref = "SPEC_RUNTIME_ENGINE_001#ads-client-configuration-and-activation"
outcome = "reject"
no_partial_apply = true
delta = { target = "unchanged", siblings = "unchanged", retain = "unchanged", process_image = "unchanged", diagnostics = "stable_error", status = "not_safe_reported" }
rationale = "Plain transport requires explicit acknowledgement, and production readiness requires the pinned local identity to match the runtime host."

[[coverage.cells]]
dimension = "happy_path"
state = "covered"
rationale = "The canonical configuration lock covers defaults, explicit address forms, types, access, and notification metadata."

[[coverage.cells]]
dimension = "wrong_type_or_shape"
state = "covered"
rationale = "Focused tables cover empty, duplicate, noncanonical, incomplete, unsupported, and mismatched configuration shapes."

[[coverage.cells]]
