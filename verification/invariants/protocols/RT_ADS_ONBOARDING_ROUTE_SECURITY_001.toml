schema_version = 1
id = "RT_ADS_ONBOARDING_ROUTE_SECURITY_001"
title = "ADS route artifacts and automatic credentials are fail-closed"
area = "protocols"
risk = "security"
status = "mapped"
owner = "trust-runtime"
last_reviewed = "2026-07-22"
claim = "ADS route automation admits credentials only on trusted eligible paths and emits credential-free artifacts whose user-controlled XML cannot become PowerShell code."
proof_level = "T1"
contract_kind = "security_policy"
source_refs = ["crates/trust-runtime/src/host/ads/onboarding/route.rs"]
tests = ["TEST_ADS_ONBOARDING_ROUTE_AUTOMATIC_ROUTE_ADD_REJECTS_BLANK_CREDENTIALS_BEFORE_WIRE_001", "TEST_ADS_ONBOARDING_ROUTE_ROUTE_ADD_POLICY_ALLOWS_TRUSTED_CHANNEL_TO_CALL_WIRE_001", "TEST_ADS_ONBOARDING_ROUTE_ROUTE_ADD_POLICY_REJECTS_NAT_IDENTITY_BEFORE_WIRE_CALL_001", "TEST_ADS_ONBOARDING_ROUTE_ROUTE_ADD_POLICY_REJECTS_UNTRUSTED_CHANNEL_BEFORE_WIRE_CALL_001", "TEST_ADS_ONBOARDING_ROUTE_ROUTE_ARTIFACTS_PRESERVE_UNRELATED_ROUTES_AND_REPORT_ENCODING_CHANGES_001", "TEST_ADS_ONBOARDING_ROUTE_ROUTE_PLAN_DISABLES_AUTOMATIC_ROUTE_FOR_UNTRUSTED_OR_NAT_IDENTITY_001", "TEST_ADS_ONBOARDING_ROUTE_ROUTE_PLAN_USES_RUNTIME_HOST_IDENTITY_AND_GENERATES_ALL_FALLBACKS_001", "TEST_ADS_ONBOARDING_ROUTE_ROUTE_POWERSHELL_ENCODES_XML_AGAINST_HERE_STRING_BREAKOUT_001", "TEST_ADS_ONBOARDING_ROUTE_SERVER_ROUTE_ARTIFACTS_DO_NOT_INCLUDE_CLIENT_MODE_1861_WARNING_001", "TEST_AUTO_124D4256A1FBFDC950E4"]
gates = ["pr"]
evidence_refs = []
spec_gap_refs = []
missing = ["assertion_reachability", "mutation_sensitivity", "broad_remote_gate"]

[spec]
status = "specified"
source_refs = ["SPEC_RUNTIME_ENGINE_001"]

[oracle]
kind = "trust_contract"
ref = "SPEC_RUNTIME_ENGINE_001#ads-onboarding-route-artifact-and-credential-safety"

[[behavior]]
partition = { equals = "TRUSTED_ELIGIBLE_VALID_CREDENTIALS" }
case_family = "happy_path"
oracle_ref = "SPEC_RUNTIME_ENGINE_001#ads-onboarding-route-artifact-and-credential-safety"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "unchanged", process_image = "unchanged", diagnostics = "none", status = "not_applicable" }
rationale = "Only a trusted channel, eligible local identity, and nonblank credentials may reach automatic route addition."

[[behavior]]
partition = { equals = "UNTRUSTED_OR_PUBLIC_ROUTE_AUTHORITY" }
case_family = "auth_or_permission"
oracle_ref = "SPEC_RUNTIME_ENGINE_001#ads-onboarding-route-artifact-and-credential-safety"
outcome = "reject"
no_partial_apply = true
delta = { target = "unchanged", siblings = "unchanged", retain = "unchanged", process_image = "unchanged", diagnostics = "stable_error", status = "not_safe_reported" }
rationale = "Untrusted channels and public or NAT-suspect identities fail before the route wire."

[[behavior]]
partition = { equals = "BLANK_ONE_SHOT_CREDENTIAL" }
case_family = "missing_required"
oracle_ref = "SPEC_RUNTIME_ENGINE_001#ads-onboarding-route-artifact-and-credential-safety"
outcome = "reject"
no_partial_apply = true
delta = { target = "unchanged", siblings = "unchanged", retain = "unchanged", process_image = "unchanged", diagnostics = "stable_error", status = "not_safe_reported" }
rationale = "Blank username or password cannot be passed to the route wire."

[[behavior]]
partition = { equals = "HOSTILE_ROUTE_ARTIFACT_TEXT" }
case_family = "encoding_or_unicode"
oracle_ref = "SPEC_RUNTIME_ENGINE_001#ads-onboarding-route-artifact-and-credential-safety"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "unchanged", process_image = "unchanged", diagnostics = "none", status = "not_applicable" }
rationale = "XML escaping plus base64 transport keeps user text out of PowerShell syntax."

[[behavior]]
partition = { equals = "CLIENT_OR_SERVER_ROUTE_PLAN" }
case_family = "platform_or_filesystem_variation"
oracle_ref = "SPEC_RUNTIME_ENGINE_001#ads-onboarding-route-artifact-and-credential-safety"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "unchanged", process_image = "unchanged", diagnostics = "none", status = "not_applicable" }
rationale = "Role-specific artifact guidance remains deterministic and credential-free."

[[coverage.cells]]
dimension = "happy_path"
state = "covered"
rationale = "Focused tests cover trusted automatic route addition and complete route-plan artifact generation."

[[coverage.cells]]
dimension = "auth_or_permission"
state = "covered"
rationale = "Focused tests cover untrusted channel, NAT/public identity, and blank credential denials before the wire."

[[coverage.cells]]
dimension = "encoding_or_unicode"
state = "covered"
rationale = "The regression decodes the generated base64 payload and proves hostile route text remains escaped XML data."

[[coverage.cells]]
