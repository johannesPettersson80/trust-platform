delta = { target = "unchanged", siblings = "unchanged", retain = "unchanged", process_image = "unchanged", diagnostics = "stable_error", status = "fault_visible" }
rationale = "A server-rejected point write faults that point visibly without tearing down the otherwise healthy persistent session."

[[coverage.cells]]
