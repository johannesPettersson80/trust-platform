delta = { target = "set_to_expected", siblings = "not_applicable", retain = "unchanged", process_image = "unchanged", diagnostics = "none", status = "unchanged" }
rationale = "Repeated scan ticks and output writes reuse one connected session rather than reconnecting per scan or write."

[[behavior]]
partition = { equals = "STALE_VALUE_HOLD_AND_RECOVERY" }
case_family = "persistence_or_recovery"
oracle_ref = "SPEC_OPCUA_CLIENT_LIFECYCLE_DECISION_001#freshness-status"
outcome = "accept_value"
delta = { target = "set_to_expected", siblings = "not_applicable", retain = "unchanged", process_image = "expected_delta", diagnostics = "none", status = "status_degraded" }
rationale = "A freshness timeout marks the connection stale without overwriting the last PLC value, and a later subscription update restores connected state."

[[behavior]]
partition = { equals = "SESSION_LOSS_BACKOFF" }
case_family = "persistence_or_recovery"
oracle_ref = "SPEC_OPCUA_CLIENT_LIFECYCLE_DECISION_001#subscription-recovery"
outcome = "accept_value"
delta = { target = "set_to_expected", siblings = "not_applicable", retain = "unchanged", process_image = "unchanged", diagnostics = "none", status = "status_degraded" }
rationale = "Session loss becomes reconnecting and the worker honors its bounded backoff before opening another session."

[[behavior]]
partition = { equals = "SUBSCRIPTION_RECREATED_AFTER_RECONNECT" }
case_family = "persistence_or_recovery"
oracle_ref = "SPEC_OPCUA_CLIENT_LIFECYCLE_DECISION_001#subscription-recovery"
outcome = "accept_value"
delta = { target = "set_to_expected", siblings = "not_applicable", retain = "unchanged", process_image = "expected_delta", diagnostics = "none", status = "unchanged" }
rationale = "A reconnect recreates the read subscription and accepts a later subscription value through the same PLC binding."

[[behavior]]
partition = { equals = "SUBSCRIPTION_TRANSFER_RECOVERY" }
case_family = "persistence_or_recovery"
oracle_ref = "SPEC_OPCUA_CLIENT_LIFECYCLE_DECISION_001#subscription-recovery"
outcome = "accept_value"
delta = { target = "set_to_expected", siblings = "not_applicable", retain = "unchanged", process_image = "expected_delta", diagnostics = "none", status = "unchanged" }
rationale = "When the transport can recover the session and transfer subscriptions, the worker does not create an unnecessary replacement session."

[[behavior]]
partition = { equals = "REJECTED_WRITE_POINT_FAULT_ISOLATION" }
