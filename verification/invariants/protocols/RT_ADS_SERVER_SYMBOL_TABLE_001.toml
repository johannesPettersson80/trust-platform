area = "protocols"
risk = "silent_corruption"
status = "mapped"
owner = "trust-runtime"
last_reviewed = "2026-07-27"
claim = "The ADS server constructs deterministic symbol snapshots with unique names, contiguous addresses, exact capability flags, stable serialization, and complete-snapshot version identity."
proof_level = "S0"
contract_kind = "state_machine"
source_refs = [
  "docs/specs/11-runtime-engine.md",
  "crates/trust-ads-server/src/symbols.rs",
]
tests = []
gates = ["pr"]
evidence_refs = []
spec_gap_refs = []
missing = [
  "cataloged_tests",
  "focused_execution_evidence",
  "empty_or_whitespace_name_policy",
  "case_sensitivity_and_alignment_policy",
  "overflow_and_invalid_type_boundaries",
  "version_wrap_and_serialization_failure",
