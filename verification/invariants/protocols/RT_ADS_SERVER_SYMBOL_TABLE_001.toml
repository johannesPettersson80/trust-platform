[spec]
status = "specified"
source_refs = ["SPEC_RUNTIME_ENGINE_001"]

[oracle]
kind = "trust_contract"
ref = "SPEC_RUNTIME_ENGINE_001#ads-server-runtime-publication-and-lifecycle"

[[behavior]]
partition = { equals = "DETERMINISTIC_CONTIGUOUS_ASSIGNMENT" }
case_family = "ordering_or_lifecycle"
oracle_ref = "SPEC_RUNTIME_ENGINE_001#ads-server-runtime-publication-and-lifecycle"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "expected_delta", retain = "not_applicable", process_image = "unchanged", diagnostics = "none", status = "unchanged" }
rationale = "Input order does not change the sorted snapshot, and reviewed BOOL/REAL entries receive contiguous offsets and exact byte size."

[[behavior]]
partition = { equals = "DUPLICATE_NAME_REJECTION" }
case_family = "duplicate_or_collision"
oracle_ref = "SPEC_RUNTIME_ENGINE_001#ads-server-runtime-publication-and-lifecycle"
outcome = "reject"
no_partial_apply = true
delta = { target = "unchanged", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "stable_error", status = "unchanged" }
rationale = "Two accepted declarations with the same ADS symbol name reject with the duplicate-name error."

[[behavior]]
partition = { equals = "CAPABILITY_FLAG_PRESERVATION" }
case_family = "auth_or_permission"
oracle_ref = "SPEC_RUNTIME_ENGINE_001#ads-server-runtime-publication-and-lifecycle"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "none", status = "unchanged" }
rationale = "Readable construction plus an added write capability produces a symbol containing both exact flags."

[[behavior]]
partition = { equals = "DETERMINISTIC_SNAPSHOT_SERIALIZATION" }
case_family = "happy_path"
oracle_ref = "SPEC_RUNTIME_ENGINE_001#ads-server-runtime-publication-and-lifecycle"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "none", status = "unchanged" }
rationale = "Serializing the same accepted snapshot twice produces identical deterministic content; terminal newline formatting is not part of this behavior."

[[behavior]]
partition = { equals = "SERIALIZED_SNAPSHOT_VERSION_CHANGE" }
case_family = "ordering_or_lifecycle"
oracle_ref = "SPEC_RUNTIME_ENGINE_001#ads-server-runtime-publication-and-lifecycle"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "none", status = "expected_delta" }
rationale = "The first complete serialized snapshot establishes version 1, equal serialization retains 1, changed serialization advances to 2, and repeated changed serialization retains 2."

[[coverage.cells]]
dimension = "ordering_or_lifecycle"
state = "gap_open"
rationale = "Deterministic assignment and serialized-snapshot version assertions await generated catalog mapping; atomic publication remains explicit debt."

[[coverage.cells]]
dimension = "duplicate_or_collision"
state = "gap_open"
rationale = "Duplicate-name rejection awaits generated catalog mapping and focused execution."

[[coverage.cells]]
dimension = "auth_or_permission"
state = "gap_open"
rationale = "Capability-flag preservation awaits generated catalog mapping and focused execution."

[[coverage.cells]]
dimension = "happy_path"
state = "gap_open"
rationale = "Stable deterministic serialization awaits generated catalog mapping and focused execution."
