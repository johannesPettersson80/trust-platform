[oracle]
kind = "trust_contract"
ref = "SPEC_RUNTIME_ENGINE_001#communication-schema-capabilities-and-test"

[[behavior]]
partition = { equals = "VERSIONED_FILTERED_SCHEMA" }
case_family = "happy_path"
oracle_ref = "SPEC_RUNTIME_ENGINE_001#communication-schema-capabilities-and-test"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "none", status = "unchanged" }
rationale = "Schema version four returns only the requested protocol and preserves stable ownership, apply-mode, multi-instance, and typed-field metadata."

[[behavior]]
partition = { equals = "SECRET_SCHEMA_FIELD" }
case_family = "auth_or_permission"
oracle_ref = "SPEC_RUNTIME_ENGINE_001#communication-schema-capabilities-and-test"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "none", status = "unchanged" }
rationale = "A secret field is identified as secret metadata without a serialized secret default or value."

[[behavior]]
partition = { equals = "CAPABILITY_BUILD_PLATFORM_CONFIGURATION_STATE" }
case_family = "platform_or_filesystem_variation"
oracle_ref = "SPEC_RUNTIME_ENGINE_001#communication-schema-capabilities-and-test"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "none", status = "not_safe_reported" }
rationale = "The version-four registry distinguishes build, platform, and configuration state, requires default-visible platform protocols to be built, and fails closed for an unknown platform marker."

[[behavior]]
partition = { equals = "COMPLETED_NEGATIVE_OR_UNSUPPORTED_TEST" }
case_family = "hardware_or_network_fault"
oracle_ref = "SPEC_RUNTIME_ENGINE_001#communication-schema-capabilities-and-test"
outcome = "not_safe_reported"
no_partial_apply = true
delta = { target = "unchanged", siblings = "unchanged", retain = "not_applicable", process_image = "unchanged", diagnostics = "expected_diagnostic", status = "not_safe_reported" }
rationale = "A completed negative protocol test remains a structured result, while an unsupported Test operation reports supported false instead of appearing usable."

