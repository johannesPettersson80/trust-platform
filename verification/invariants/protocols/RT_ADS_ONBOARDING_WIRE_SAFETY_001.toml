schema_version = 1
id = "RT_ADS_ONBOARDING_WIRE_SAFETY_001"
title = "ADS onboarding wire preserves endpoint identity and restores guarded writes"
area = "protocols"
risk = "safety_critical"
status = "mapped"
owner = "trust-runtime"
last_reviewed = "2026-07-22"
claim = "The ADS onboarding wire keeps raw transport types behind its boundary, scopes connection state, preserves distinct ADS endpoints, rejects invalid read data, and restores the original PLC value after every attempted guarded probe failure."
proof_level = "T1"
contract_kind = "decision_table"
source_refs = ["crates/trust-runtime/src/host/ads/onboarding/wire.rs", "crates/trust-runtime/src/host/ads/onboarding/wire/mock.rs"]
tests = [
  "TEST_ADS_ONBOARDING_WIRE_GUARDED_PROBE_MATCHING_READBACK_DEFERS_NORMAL_RESTORE_001",
  "TEST_ADS_ONBOARDING_WIRE_GUARDED_PROBE_MISMATCH_REPORTS_RESTORE_FAILURE_001",
  "TEST_ADS_ONBOARDING_WIRE_GUARDED_PROBE_READ_ERROR_ATTEMPTS_AND_REPORTS_RESTORE_FAILURE_001",
  "TEST_ADS_ONBOARDING_WIRE_GUARDED_PROBE_WRITE_FAILURE_ATTEMPTS_AND_REPORTS_RESTORE_FAILURE_001",
  "TEST_ADS_ONBOARDING_WIRE_MOCK_WIRE_HAPPY_PATH_COVERS_REQUIRED_OPERATIONS_001",
  "TEST_ADS_ONBOARDING_WIRE_ONBOARDING_BOUNDARY_KEEPS_RAW_ADS_TYPES_OUT_OF_PUBLIC_SCHEMA_001",
  "TEST_ADS_ONBOARDING_WIRE_UDP_WIRE_DEDUPLICATES_BY_ADS_ENDPOINT_NOT_HOST_IP_001",
]
gates = ["pr"]
evidence_refs = []
spec_gap_refs = []
missing = ["assertion_reachability", "mutation_sensitivity", "broad_remote_gate", "external_ads_target", "twincat_lab"]

[spec]
status = "specified"
source_refs = ["SPEC_RUNTIME_ENGINE_001"]

[oracle]
kind = "trust_contract"
ref = "SPEC_RUNTIME_ENGINE_001#ads-onboarding-live-wire-and-guarded-write-recovery"

[[behavior]]
partition = { equals = "DISTINCT_OR_REPEATED_UDP_ENDPOINT" }
case_family = "duplicate_or_collision"
oracle_ref = "SPEC_RUNTIME_ENGINE_001#ads-onboarding-live-wire-and-guarded-write-recovery"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "unchanged", process_image = "unchanged", diagnostics = "none", status = "not_applicable" }
rationale = "Endpoint identity is AMS Net ID plus AMS port, not the shared host IP or observation source."

[[behavior]]
partition = { equals = "VALID_ONBOARDING_WIRE_SEQUENCE" }
case_family = "happy_path"
oracle_ref = "SPEC_RUNTIME_ENGINE_001#ads-onboarding-live-wire-and-guarded-write-recovery"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "unchanged", process_image = "unchanged", diagnostics = "none", status = "not_applicable" }
rationale = "The wire boundary exposes product identities, symbols, values, and errors while retaining transport implementation types internally."

[[behavior]]
partition = { equals = "PROBE_WRITE_OR_READBACK_FAILURE" }
case_family = "persistence_or_recovery"
oracle_ref = "SPEC_RUNTIME_ENGINE_001#ads-onboarding-live-wire-and-guarded-write-recovery"
outcome = "reject"
no_partial_apply = true
delta = { target = "not_applicable", siblings = "unchanged", retain = "unchanged", process_image = "unchanged", diagnostics = "stable_error", status = "not_safe_reported" }
rationale = "Every failure after a probe write attempt restores and verifies the original PLC value before returning failure."

[[behavior]]
partition = { equals = "PROBE_AND_RESTORE_FAILURE" }
case_family = "hardware_or_network_fault"
oracle_ref = "SPEC_RUNTIME_ENGINE_001#ads-onboarding-live-wire-and-guarded-write-recovery"
outcome = "reject"
no_partial_apply = false
delta = { target = "set_to_expected", siblings = "unchanged", retain = "unchanged", process_image = "unchanged", diagnostics = "stable_error", status = "not_safe_reported" }
rationale = "When restoration cannot be confirmed, the result retains both the initiating and restore failures and never reports success."

[[behavior]]
partition = { equals = "TYPE_OR_QUALITY_MISMATCH" }
case_family = "wrong_type_or_shape"
oracle_ref = "SPEC_RUNTIME_ENGINE_001#ads-onboarding-live-wire-and-guarded-write-recovery"
outcome = "reject"
no_partial_apply = true
delta = { target = "unchanged", siblings = "unchanged", retain = "unchanged", process_image = "unchanged", diagnostics = "stable_error", status = "not_safe_reported" }
rationale = "Descriptor mismatch, unknown handles, non-good quality, missing values, and unknown returned point names cannot manufacture wire values."

[[coverage.cells]]
dimension = "happy_path"
state = "covered"
rationale = "Focused mock-wire tests exercise every required onboarding operation and the successful guarded read-back handoff."

[[coverage.cells]]
dimension = "duplicate_or_collision"
state = "covered"
rationale = "Focused wire tests cover same-IP distinct endpoints, repeated endpoints, and distinct AMS ports."

[[coverage.cells]]
dimension = "persistence_or_recovery"
state = "covered"
rationale = "Focused tests prove restore attempts after probe-write, read-back, and mismatch failures."

[[coverage.cells]]
dimension = "hardware_or_network_fault"
state = "covered"
rationale = "Focused tests prove combined diagnostic truth when both the probe path and restoration fail."

[[coverage.cells]]
dimension = "wrong_type_or_shape"
state = "gap_open"
rationale = "Existing onboarding boundary tests keep raw wire types out of the public schema; external value/type proof remains explicitly open."
