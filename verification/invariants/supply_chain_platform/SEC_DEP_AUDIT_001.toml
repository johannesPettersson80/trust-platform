rationale = "Every ignored advisory carries ownership, rationale, removal, review, and an expiry no more than 90 days later."

[[coverage.cells]]
dimension = "supply_chain_or_artifact_fault"
state = "covered"
rationale = "Rust exception ownership and zero-vulnerability VS Code lockfile policy are covered by a current-contract lock comparison; a causal broad gate remains open."
