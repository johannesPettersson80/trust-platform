owner = "release"
last_reviewed = "2026-07-17"
claim = "Release proof must expose dependency vulnerability and license status together with owned, time-bounded exceptions."
proof_level = "G1"
contract_kind = "protocol_trace"
source_refs = ["Cargo.toml", "Cargo.lock", "editors/vscode/package.json", "editors/vscode/package-lock.json"]
