schema_version = 1
id = "SEC_ARTIFACT_001"
title = "Release artifacts bind to the tested commit and tag"
area = "supply_chain_platform"
risk = "supply_chain"
status = "gap_open"
owner = "release"
last_reviewed = "2026-07-17"
claim = "Every release artifact and checksum must map to the commit, tag, and workflow execution that produced and tested it."
proof_level = "S0"
contract_kind = "protocol_trace"
source_refs = [".github/workflows", "Cargo.toml", "editors/vscode/package.json"]
tests = ["TEST_ARTIFACT_PROVENANCE_TRACE_001"]
gates = ["pr"]
evidence_refs = []
spec_gap_refs = []
missing = ["current_lock_proof", "published_release_provenance_asset", "broad_remote_gate"]

[spec]
status = "specified"
source_refs = ["SPEC_RELEASE_EVIDENCE_001"]

[oracle]
kind = "release_contract"
ref = "SPEC_RELEASE_EVIDENCE_001"

[[behavior]]
partition = { equals = "ARTIFACT_PROVENANCE_CHAIN" }
case_family = "supply_chain_or_artifact_fault"
oracle_ref = "SPEC_RELEASE_EVIDENCE_001#artifact-and-version-provenance"
outcome = "accept_value"
delta = { target = "set_to_expected", siblings = "unchanged", retain = "not_applicable", process_image = "not_applicable", diagnostics = "none", status = "unchanged" }
rationale = "The release provenance record exhaustively binds each artifact digest to the tag, commit, and workflow execution."

[[coverage.cells]]
dimension = "supply_chain_or_artifact_fault"
state = "gap_open"
rationale = "Artifact provenance and checksum rules are specified and generated; current lock proof, a published provenance asset, and a broad gate remain open."
