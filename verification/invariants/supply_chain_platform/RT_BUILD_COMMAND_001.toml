schema_version = 1
id = "RT_BUILD_COMMAND_001"
title = "Runtime builds preserve artifact and report identity"
area = "supply_chain_platform"
risk = "supply_chain"
status = "mapped"
owner = "release"
last_reviewed = "2026-07-29"
claim = "The runtime build command resolves the canonical project source root and local dependency closure deterministically, compiles reviewed cross-file root sources, rejects malformed dependency graphs, emits byte-identical output for the reviewed unchanged dependency graph, writes program.stbc only after successful compilation, preserves an existing artifact on compile failure, performs check without writing the artifact, and reports exact build identity in CI or human output."
proof_level = "T1"
contract_kind = "protocol_trace"
source_refs = ["crates/trust-runtime/src/bin/trust-runtime/build.rs", "crates/trust-runtime/src/host/bundle_builder"]
tests = ["TEST_AUTO_253D75705176F76907C4", "TEST_AUTO_36E7E7C235C77FD764A5", "TEST_AUTO_3E24745EDD37F61AE492", "TEST_AUTO_45CB6C9BAD8DCCF0A59F", "TEST_AUTO_4CFAF7598FF6ED520833", "TEST_AUTO_4E78FA1FE054B4A0AD08", "TEST_AUTO_5D5805D749354AFB4996", "TEST_AUTO_DC6A59A72613FBA3CFA8", "TEST_AUTO_E585CA0FF1F35FD3CC14", "TEST_AUTO_E726DF21E9F7F87134B0", "TEST_AUTO_FF69B42F579111AE16BF", "TEST_RUNTIME_BUILD_CI_DEPENDENCIES_001", "TEST_RUNTIME_BUILD_FAILURE_PRESERVES_ARTIFACT_001", "TEST_RUNTIME_BUILD_HUMAN_DISCOVERY_001"]
gates = ["pr"]
evidence_refs = []
spec_gap_refs = []
missing = ["assertion_reachability", "mutation_sensitivity", "windows_path_evidence", "broad_remote_gate", "general_dependency_ordering", "symlink_and_concurrent_filesystem_behavior", "partial_artifact_cleanup", "external_registry_dependencies", "bytecode_semantic_equivalence"]

[spec]
status = "specified"
source_refs = ["SPEC_RUNTIME_ENGINE_001"]

[oracle]
kind = "trust_contract"
ref = "SPEC_RUNTIME_ENGINE_001#6-8-1d-runtime-build-and-ci-failure-contract"

[[behavior]]
partition = { equals = "VALID_PROJECT_SOURCE_OVERRIDE_AND_DEPENDENCIES" }
case_family = "happy_path"
oracle_ref = "SPEC_RUNTIME_ENGINE_001#6-8-1d-runtime-build-and-ci-failure-contract"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "unchanged", process_image = "unchanged", diagnostics = "none", status = "not_applicable" }
rationale = "A valid build writes bytecode and CI output binds the artifact to the complete selected source and dependency identity."

[[behavior]]
partition = { equals = "SOURCE_DEPENDENCY_OR_COMPILE_FAILURE" }
case_family = "missing_required"
oracle_ref = "SPEC_RUNTIME_ENGINE_001#6-8-1d-runtime-build-and-ci-failure-contract"
outcome = "reject"
no_partial_apply = true
delta = { target = "unchanged", siblings = "unchanged", retain = "unchanged", process_image = "unchanged", diagnostics = "stable_error", status = "not_safe_reported" }
rationale = "Compilation must succeed before program.stbc is opened, so a failed build reports exit 11 without replacing prior bytecode."

[[behavior]]
partition = { equals = "CURRENT_DIRECTORY_HUMAN_OUTPUT" }
case_family = "platform_or_filesystem_variation"
oracle_ref = "SPEC_RUNTIME_ENGINE_001#6-8-1d-runtime-build-and-ci-failure-contract"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "unchanged", process_image = "unchanged", diagnostics = "none", status = "not_applicable" }
rationale = "Bundle discovery can select the current project and human output reports the artifact, count, bounded source list, and omitted count."

[[behavior]]
partition = { equals = "CANONICAL_SRC_WITHOUT_OVERRIDE" }
case_family = "happy_path"
oracle_ref = "SPEC_RUNTIME_ENGINE_001#runtime-bundle-builder-source-and-dependency-resolution"
outcome = "accept_value"
no_partial_apply = true
delta = { target = "set_to_expected", siblings = "unchanged", retain = "unchanged", process_image = "unchanged", diagnostics = "none", status = "not_applicable" }
rationale = "Without an override, the reviewed canonical src directory resolves successfully."

[[behavior]]
