schema_version = 1
id = "FUZZ_PROGRAM_V1"
title = "PLC fuzz and malformed-input program inventory"
status = "mapped"
owner = "verification"
proof_posture = "association_only"
execution_posture = "inventory_only"
mapping_basis = "explicit_live_identity_and_reviewed_surface_association_only"
last_reviewed = "2026-07-11"

[corpus_policy]
working_corpus_storage = "machine_local_ignored"
raw_crash_storage = "machine_local_ignored"
durable_evidence_status = "not_durable"
contents_assessed = false
tracked_generated_corpus_allowed = false
rationale = "Generated working corpora and raw crash artifacts are local discovery inputs, not durable verification evidence. Their contents and counts are intentionally excluded from this reproducible inventory."

[crash_regression_handoff]
enforcement_status = "not_enforced"
required_disposition = "deterministic_regression"
p9_005_row_remains_open = true
rationale = "The written program requires a minimized crash to become a deterministic regression, but no machine registry or exhaustive crash-to-regression join enforces that handoff yet."

[[surfaces]]
id = "st_lexer_parser"
title = "Structured Text lexer and parser"
area = "compiler_iec"
rationale = "Generated source text exercises lexical handling, parser recovery, and bounded diagnostics."

[[surfaces]]
id = "hir_lowering_input"
title = "HIR and lowering input"
area = "compiler_iec"
rationale = "Generated parsed programs should exercise semantic queries and lowering inputs without treating parser survival as lowering evidence."

[[surfaces]]
id = "plcopen_xml"
title = "PLCopen XML"
area = "plcopen_devtools"
rationale = "Malformed and vendor-shaped XML needs a dedicated import/export target; deterministic negative tests alone are not a fuzz target."

[[surfaces]]
id = "bytecode_container_instructions"
title = "Bytecode container and instruction streams"
area = "bytecode_vm"
rationale = "Container structure and instruction streams need generated malformed-input pressure at the validator boundary."

[[surfaces]]
id = "protocol_payloads"
title = "Protocol payloads"
area = "protocols"
rationale = "Framing, dispatch, and decoded payload boundaries need generated input independent of live hardware."

[[surfaces]]
id = "config_files"
title = "Configuration files"
area = "runtime_safety"
rationale = "Configuration parsers need generated malformed documents; generated policy strings are not a substitute for file parsing."

[[surfaces]]
id = "lsp_incremental_edits"
title = "LSP incremental edits"
area = "editor_safety"
rationale = "Protocol-level edit sequences need generated range, encoding, and lifecycle variation beyond lower-level HIR edit cycles."

[[surfaces]]
id = "hmi_schema_payloads"
title = "HMI schema payloads"
area = "hmi_ui"
rationale = "HMI schema and value payloads need generated malformed shapes without implying browser or authorization behavior."

