[package]
name = "trust-lsp"
description = "Language Server Protocol implementation for IEC 61131-3 Structured Text"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "trust-lsp"
path = "src/main.rs"

[features]
default = []
perf_alloc_metrics = []

[dependencies]
trust-syntax.workspace = true
trust-hir.workspace = true
trust-ide.workspace = true
tower-lsp.workspace = true
lsp-types.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
hex.workspace = true
toml.workspace = true
# Edits of trust-lsp.toml and simulation.toml that keep the rest of the file (specification 25 §11.6).
toml_edit.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true
glob.workspace = true
parking_lot.workspace = true
rustc-hash = { workspace = true, features = ["std"] }
text-size.workspace = true
smol_str = { workspace = true, features = ["std"] }
percent-encoding.workspace = true
trust-devices.workspace = true
trust-visual.workspace = true
trust-runtime.workspace = true
trust-runtime-client.workspace = true
thiserror.workspace = true
getrandom = "0.4"

[dev-dependencies]
expect-test.workspace = true
insta.workspace = true
verification-cases.workspace = true
futures-util.workspace = true
tower.workspace = true
