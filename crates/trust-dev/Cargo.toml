[package]
name = "trust-dev"
description = "Developer and workbench CLI for truST"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
anyhow.workspace = true
base64 = "0.23.1"
clap.workspace = true
dialoguer.workspace = true
owo-colors.workspace = true
rmcp = { version = "=3.8.0", features = [
    "server",
    "transport-io",
    "transport-async-rw",
] }
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
smol_str = { workspace = true, features = ["std"] }
tokio.workspace = true
toml.workspace = true
trust-runtime.workspace = true
trust-syntax.workspace = true
trust-wasm-analysis.workspace = true

[dev-dependencies]
rmcp = { version = "=3.8.0", features = ["client"] }
trust-runtime-core = { workspace = true, default-features = false }
verification-cases.workspace = true
