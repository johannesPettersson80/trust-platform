[package]
name = "trust-debug"
description = "Debug Adapter Protocol helpers for Structured Text"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
# The base64 of a compiled debug expression in a control request (specification 11 §6.13.2).
base64 = "0.23.1"
serde.workspace = true
serde_json.workspace = true
trust-runtime.workspace = true
trust-hir.workspace = true
indexmap = { workspace = true, features = ["std"] }
smol_str = { workspace = true, features = ["std"] }
tracing.workspace = true
tracing-subscriber.workspace = true

[features]
default = ["ads-server", "ads-wire"]
ads-server = ["trust-runtime/ads-server"]
ads-wire = ["trust-runtime/ads-wire"]

[dev-dependencies]
