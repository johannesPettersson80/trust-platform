[package]
name = "trust-platform-stm32f4"
description = "Thin STM32F4 chip adapter (STM32F407) for the shared truST engine"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
# The chip of the build; a bare-metal build without it fails with a message. The STM32F407 is the
# one supported chip (the STM32F401 was retired on 17 October 2026), so it is the default.
default = ["stm32f407"]
stm32f407 = ["stm32f4xx-hal/stm32f407", "stm32f4/stm32f407"]

[target.'cfg(all(target_arch = "arm", target_os = "none"))'.dependencies]
stm32f4xx-hal = { version = "=0.23.0", default-features = false }
stm32f4 = { version = "=0.16.0", default-features = false, features = ["critical-section", "rt"] }
cortex-m = { version = "=0.7.9", features = ["critical-section-single-core"] }
# The shared reset record the F407 keeps in the RTC backup registers, so both chips store the
# same record.
trust-platform-memory.workspace = true

# The host test tests/chip_file.rs compares the chip table with chips/stm32f407.toml. A
# dev-dependency is resolved only for this workspace's own tests, never for a firmware build.
[dev-dependencies]
trust-chips.workspace = true
