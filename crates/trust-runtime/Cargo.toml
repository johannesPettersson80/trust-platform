[package]
name = "trust-runtime"
description = "Runtime for IEC 61131-3 Structured Text"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
trust-syntax.workspace = true
trust-hir.workspace = true
trust-ide.workspace = true
trust-plcopen.workspace = true
trust-ads-core.workspace = true
trust-tcads-native.workspace = true
trust-ads-server = { workspace = true, optional = true }
trust-runtime-core = { workspace = true, features = ["hir"] }
trust-wasm-analysis.workspace = true
smol_str.workspace = true
rustc-hash.workspace = true
text-size.workspace = true
indexmap = { workspace = true, features = ["serde"] }
tracing.workspace = true
crc32fast.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
toml_edit.workspace = true
clap.workspace = true
clap_complete.workspace = true
qrcode.workspace = true
urlencoding.workspace = true
roxmltree.workspace = true
anyhow.workspace = true
glob.workspace = true
ratatui.workspace = true
crossterm.workspace = true
dialoguer.workspace = true
indicatif.workspace = true
owo-colors.workspace = true
rumqttc.workspace = true
native-tls.workspace = true
time.workspace = true
rapier3d.workspace = true
notify = "8"
tiny_http = { version = "0.12", features = ["ssl-rustls"] }
tungstenite = "0.28"
mdns-sd = "0.18"
if-addrs = "0.15"
zenoh = { version = "=1.7.2", default-features = false, features = ["transport_tcp"] }
base64 = "0.22"
rand = "0.10"
ureq = "3"
sha2 = "0.10"
signal-hook = "0.3.18"
rustls = "0.23"
tiverse-mmap = "1.0"
region = "3.0"
rusqlite = { version = "0.40.2", features = ["bundled"], optional = true }
postgres = { version = "0.19.14", optional = true }
postgres-native-tls = { version = "0.5.3", optional = true }
mysql = { version = "28.0.0", default-features = false, features = ["minimal-rust", "rustls-tls"], optional = true }
open-ot-definition = { git = "https://github.com/johannesPettersson80/open-ot-experiments.git", rev = "137f0e765f085c262651f479be35298b836ac891" }
open-ot-document = { git = "https://github.com/johannesPettersson80/open-ot-experiments.git", rev = "137f0e765f085c262651f479be35298b836ac891" }
opcua = { version = "0.12", default-features = false, features = ["server", "client", "vendored-openssl"], optional = true }
ads = { version = "=0.4.4", optional = true }
crossbeam-channel.workspace = true
tokio = { workspace = true, optional = true }
tokio-util = { version = "0.7", features = ["compat"], optional = true }
tiberius = { version = "0.12.3", default-features = false, features = ["tds73", "native-tls"], optional = true }

[target.'cfg(unix)'.dependencies]
ethercrab = { version = "0.6", optional = true }
# OpenOT Rust crates are pinned so fresh source builds do not need a sibling
# checkout. scripts/checkout_openot_ref.sh is still used for OpenOT IEC example
# sources and conformance fixtures that are not Cargo crates.
open-ot-carriage = { git = "https://github.com/johannesPettersson80/open-ot-experiments.git", rev = "137f0e765f085c262651f479be35298b836ac891" }
open-ot-shm = { git = "https://github.com/johannesPettersson80/open-ot-experiments.git", rev = "137f0e765f085c262651f479be35298b836ac891" }

[dev-dependencies]
verification-cases.workspace = true

[target.'cfg(unix)'.dev-dependencies]
open-ot-conformance = { git = "https://github.com/johannesPettersson80/open-ot-experiments.git", rev = "137f0e765f085c262651f479be35298b836ac891" }

[target.'cfg(target_os = "linux")'.dependencies]
gpio-cdev = "0.6"
rustix = { version = "1.1.4", features = ["mm", "thread"] }

[features]
default = [
    "debug",
    "ethercat-wire",
    "ads-wire",
    "ads-server",
    "opcua-wire",
    "openot-database-all",
]
debug = []
opcua-wire = ["dep:opcua"]
ethercat-wire = ["dep:ethercrab", "dep:tokio"]
ads-wire = ["dep:ads"]
ads-server = ["dep:trust-ads-server"]
openot-real-database-tests = []
openot-database-all = [
    "openot-database-sqlite",
    "openot-database-postgresql",
    "openot-database-timescaledb",
    "openot-database-mysql",
    "openot-database-sqlserver",
    "openot-database-influxdb3",
]
openot-database-sqlite = ["dep:rusqlite"]
openot-database-postgresql = ["dep:postgres", "dep:postgres-native-tls"]
openot-database-timescaledb = ["dep:postgres", "dep:postgres-native-tls"]
openot-database-mysql = ["dep:mysql"]
openot-database-sqlserver = ["dep:tiberius", "dep:tokio", "dep:tokio-util"]
openot-database-influxdb3 = ["dep:rusqlite"]
