[package]
name = "trust-runtime"
description = "Runtime for IEC 61131-3 Structured Text"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
trust-syntax.workspace = true
trust-hir.workspace = true
trust-ide.workspace = true
trust-plcopen.workspace = true
trust-ads-core.workspace = true
trust-ads-server = { workspace = true, optional = true }
trust-runtime-core = { workspace = true, features = ["hir"] }
trust-wasm-analysis.workspace = true
smol_str.workspace = true
rustc-hash.workspace = true
text-size.workspace = true
indexmap = { workspace = true, features = ["serde"] }
tracing.workspace = true
crc32fast.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
toml_edit.workspace = true
clap.workspace = true
clap_complete.workspace = true
qrcode.workspace = true
urlencoding.workspace = true
roxmltree.workspace = true
anyhow.workspace = true
glob.workspace = true
ratatui.workspace = true
crossterm.workspace = true
dialoguer.workspace = true
indicatif.workspace = true
owo-colors.workspace = true
rumqttc.workspace = true
native-tls.workspace = true
time.workspace = true
scena.workspace = true
rapier3d.workspace = true
urdf-rs.workspace = true
k.workspace = true
notify = "8"
tiny_http = { version = "0.12", features = ["ssl-rustls"] }
tungstenite = "0.28"
mdns-sd = "0.18"
if-addrs = "0.15"
zenoh = { version = "=1.7.2", default-features = false, features = ["transport_tcp"] }
base64 = "0.22"
rand = "0.10"
ureq = "3"
sha2 = "0.10"
rustls = "0.23"
tiverse-mmap = "1.0"
region = "3.0"
open-ot-definition = { path = "../../../open-ot-ref/crates/definition" }
opcua = { version = "0.12", default-features = false, features = ["server", "client", "vendored-openssl"], optional = true }
ads = { version = "=0.4.4", optional = true }
crossbeam-channel = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }

[target.'cfg(unix)'.dependencies]
ethercrab = { version = "0.6", optional = true }
# Local S4b development dependency. The shared builder must keep
# ../open-ot-ref checked out at rev >= 7b5f500; a git/vendor dep is a follow-up.
open-ot-carriage = { path = "../../../open-ot-ref/crates/carriage" }
open-ot-shm = { path = "../../../open-ot-ref/crates/open-ot-shm" }

[target.'cfg(unix)'.dev-dependencies]
open-ot-conformance = { path = "../../../open-ot-ref/crates/conformance" }
open-ot-document = { path = "../../../open-ot-ref/crates/document" }

[target.'cfg(target_os = "linux")'.dependencies]
gpio-cdev = "0.6"
rustix = { version = "1.1.4", features = ["mm", "thread"] }

[features]
default = ["debug", "ethercat-wire", "ads-wire", "ads-server", "opcua-wire"]
debug = []
opcua-wire = ["dep:opcua"]
ethercat-wire = ["dep:ethercrab", "dep:tokio"]
ads-wire = ["dep:ads", "dep:crossbeam-channel"]
ads-server = ["dep:trust-ads-server"]
