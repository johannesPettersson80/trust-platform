[package]
name = "trust-plc-macros"
description = "The attributes of truST's Rust POUs: #[trust_fb], #[trust_function] and #[budget] (specification 48)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1.0.107"
quote = "1.0.47"
syn = { version = "3.0.7", features = ["full"] }
trust-plc-decl = { workspace = true }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
pedantic = "warn"
