[package]
name = "trust-plc-macros"
description = "The attributes of truST's Rust POUs: #[trust_fb], #[trust_function] and #[budget] (specification 48)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1.0.107"
quote = "1.0.47"
syn = { version = "3.0.7", features = ["full", "visit", "visit-mut"] }
trust-plc-decl = { workspace = true }

# The attributes' examples declare and call Rust POUs through `trust_plc`, as a project does, and run
# as tests (specification 48 RU-89). It names `trust-plc` by its path alone, without a version, so that
# `cargo publish` leaves it out of the published crate, which comes before `trust-plc` (RU-12).
[dev-dependencies]
trust-plc = { path = "../trust-plc" }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
pedantic = "warn"
