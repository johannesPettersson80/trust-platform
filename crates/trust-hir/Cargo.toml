[package]
name = "trust-hir"
description = "High-level IR and semantic analysis for IEC 61131-3 Structured Text"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
trust-syntax.workspace = true
salsa.workspace = true
smol_str.workspace = true
rustc-hash.workspace = true
tracing.workspace = true
text-size.workspace = true
rowan.workspace = true
parking_lot.workspace = true

[target.'cfg(loom)'.dependencies]
# Salsa's transitive boxcar dependency switches to its loom backend under
# `--cfg loom`, but boxcar keeps the loom dependency behind an optional feature.
boxcar = { version = "0.2.14", features = ["loom"] }

[dev-dependencies]
insta.workspace = true
serde.workspace = true
toml.workspace = true
verification-cases.workspace = true
