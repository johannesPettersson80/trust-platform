[package]
name = "trust-platform-esp32"
description = "Thin ESP32-C6-DevKitC-1 hardware adapter for the shared truST engine"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[target.'cfg(all(target_arch = "riscv32", target_os = "none"))'.dependencies]
esp-hal = { version = "=1.2.2", features = ["esp32c6", "unstable"] }
esp-storage = { version = "=0.10.0", features = ["esp32c6"] }
critical-section = "1.2.0"

# The host test tests/chip_file.rs compares the profile with chips/esp32c6.toml. A dev-dependency
# is resolved only for this workspace's own tests, never for a firmware build.
[dev-dependencies]
trust-chips.workspace = true
