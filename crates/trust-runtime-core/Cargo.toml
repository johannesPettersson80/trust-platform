[package]
name = "trust-runtime-core"
description = "Portable bytecode execution core for the truST runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
default = ["std"]
std = ["dep:crc32fast", "crc32fast/std", "indexmap/std", "rustc-hash/std", "smol_str/std", "thiserror/std"]
hir = ["std", "dep:trust-hir"]

[dependencies]
crc32fast = { workspace = true, optional = true }
indexmap.workspace = true
libm.workspace = true
rustc-hash.workspace = true
smol_str.workspace = true
thiserror.workspace = true
trust-hir = { workspace = true, optional = true }

[dev-dependencies]
crc32fast.workspace = true
verification-cases.workspace = true
