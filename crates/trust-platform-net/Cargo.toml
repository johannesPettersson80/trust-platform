[package]
name = "trust-platform-net"
description = "The network of a truST chip without an operating system: an IPv4 interface, DHCP and the control connection over TCP"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
# The TCP/IP stack, without std: Ethernet frames (Wi-Fi stations carry them too), IPv4 with DHCP, the
# answer to ping, the multicast group of discovery and the name lookup of a time server, and TCP and
# UDP sockets. Pinned, as the chips' firmware is.
smoltcp = { version = "=0.14.0", default-features = false, features = ["alloc", "medium-ethernet", "proto-ipv4", "proto-dhcpv4", "proto-dns", "auto-icmp-echo-reply", "multicast", "socket-tcp", "socket-udp", "socket-dhcpv4", "socket-dns"] }
# The `id` of a second client's request, which the busy reply answers; without std.
serde = { version = "1.0.229", default-features = false, features = ["derive", "alloc"] }
serde_json = { version = "1.0.152", default-features = false, features = ["alloc"] }
# The control link's frames and peers, and the monotonic clock reading the link's stall rule takes.
trust-runtime-core.workspace = true
# The line framing every control link over a byte stream shares (specification 34 PORT-05), and the
# device settings the network is built from.
trust-runtime-services.workspace = true

[dev-dependencies]
# The tests' client pings the chip.
smoltcp = { version = "=0.14.0", default-features = false, features = ["socket-icmp"] }

[lints]
workspace = true
