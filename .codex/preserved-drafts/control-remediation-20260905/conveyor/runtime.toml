[bundle]
version = 1
[resource]
name = "Simulator"
cycle_interval_ms = 50
[runtime.control]
endpoint = "unix:///tmp/trust-conveyor.sock"
mode = "production"
debug_enabled = true
[runtime.web]
enabled = false
listen = "127.0.0.1:8080"
auth = "local"
tls = false
[runtime.tls]
mode = "disabled"
require_remote = false
[runtime.discovery]
enabled = false
service_name = "truST"
advertise = false
interfaces = []
[runtime.mesh]
enabled = false
listen = "0.0.0.0:5200"
tls = false
auth_token = ""
publish = []
[runtime.observability]
enabled = false
sample_interval_ms = 1000
mode = "all"
include = []
history_path = "history/h.jsonl"
max_entries = 20000
prometheus_enabled = false
prometheus_path = "/metrics"
[runtime.log]
level = "info"
[runtime.retain]
mode = "none"
save_interval_ms = 1000
[runtime.watchdog]
enabled = false
timeout_ms = 1000
action = "halt"
[runtime.fault]
policy = "halt"
