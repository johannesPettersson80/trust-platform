# The ESP32-C6, the ESP32 chip of truST (specification 34, TARGET-03; the format is Appendix H).
# Values from the adapter profile crates/trust-platform-esp32/src/profile.rs, the firmware's
# partition table firmware/trust-esp32c6/partitions.csv, the ESP32-C6 memory windows of
# xtask/src/portability/elf.rs (from esp-hal 1.2.2) and specification 34 D.2. The host test
# crates/trust-platform-esp32/tests/chip_file.rs compares them with profile.rs and with the program
# slot constants of crates/trust-platform-esp32/src/program_flash.rs.

[identity]
name = "esp32c6"
model = "ESP32-C6"
family = "esp32"
# The chip ID of the ROM, espflash and the running image header.
device_id = 13
# The USB-Serial/JTAG controller, which also carries the ROM's download mode.
usb_bootloader = { vid = 0x303A, pid = 0x1001 }

# The HP core; the LP core is not used.
[processor]
core = "RISC-V HP core"
isa = "RV32IMAC"
rust_target = "riscv32imac-unknown-none-elf"
fpu = "none"

[clock]
# CpuClock::max() of esp-hal.
max_hz = 160_000_000
firmware_hz = 160_000_000
crystal_min_hz = 40_000_000
crystal_max_hz = 40_000_000

# The flash sits on the SPI flash interface, in the module (8 MB on the bench's DevKitC-1); its
# size is read when truST is installed.
[memory.spi_flash]
erase_kib = 4

[[memory.ram]]
name = "HP SRAM"
start = 0x4080_0000
kib = 512
dma = true

# The RTC fast memory.
[[memory.ram]]
name = "LP SRAM"
start = 0x5000_0000
kib = 16
dma = false

# The event store the chip's heap allows: the newest events the store keeps when the project sets
# none, and the most a project may set (specification 34, Appendix H.2 and H.4; specification 11,
# the event store). A larger maximum waits for a measurement of the heap a program leaves on the
# bench.
[events]
default_capacity = 200
max_capacity = 200

# Flash offsets: the ESP-IDF image format puts the boot loader at 0x0 and the partition table at
# 0x8000; the rest are the partitions of partitions.csv.
[layout]
bootloader = { start = 0x0, kib = 32 }
partition_table = { start = 0x8000, kib = 4 }
# The two sectors of the boot counter (specification 34 PORT-05 and Appendix D.2), one erase unit
# each, in the gap between the partition table and the firmware. They are SECTOR_A_OFFSET and
# SECTOR_B_OFFSET of boot_counter.rs, which the host test boot_counter.rs checks, and the data
# partitions bootcnt_a and bootcnt_b of partitions.csv.
boot_counter_a = { start = 0x9000, kib = 4 }
boot_counter_b = { start = 0xA000, kib = 4 }
# The boot loader's choice between the two firmware slots, ESP-IDF's `otadata` (specification 34
# TARGET-04): two erase units, one entry each.
firmware_select = { start = 0xB000, kib = 8 }
# The two sectors of the device settings, device.toml (TARGET-02).
device_a = { start = 0xD000, kib = 4 }
device_b = { start = 0xE000, kib = 4 }
# The two firmware slots, `ota_0` and `ota_1` (TARGET-04): an update over the control connection is
# written into the slot that does not run, and the boot loader rolls back a firmware that does not
# confirm itself. FIRMWARE_A_OFFSET, FIRMWARE_B_OFFSET and FIRMWARE_SLOT_BYTES of firmware_slots.rs.
firmware = { start = 0x1_0000, kib = 1984 }
firmware_b = { start = 0x20_0000, kib = 1984 }
# The installed application: from after the second firmware slot to the two pairing sectors before
# the checkpoint slots at the very end of the 8 MB module (owner, 25 October 2026: the second
# firmware slot takes 1,984 KiB of what O7 gave the application; the reference workload's image is
# 67,848 bytes, so no program loses room).
application = { start = 0x3F_0000, kib = 4120 }
# The two program slots of the program store (specification 34 §5.1): the two halves of `application`,
# of equal size, which an install writes in turn. Their offsets and size are SLOT_A_OFFSET,
# SLOT_B_OFFSET and SLOT_BYTES of program_flash.rs, and the host test chip_file.rs checks them.
application_a = { start = 0x3F_0000, kib = 2060 }
application_b = { start = 0x5F_3000, kib = 2060 }
# The two sectors of the pairings (specification 11 §6.9.6), one erase unit each, after the program
# store. They are PAIRING_A_OFFSET and PAIRING_B_OFFSET of device_flash.rs, which the host test
# chip_file.rs checks, and the data partitions pair_a and pair_b of partitions.csv.
pairing_a = { start = 0x7F_6000, kib = 4 }
pairing_b = { start = 0x7F_7000, kib = 4 }
checkpoint_a = { start = 0x7F_8000, kib = 16 }
checkpoint_b = { start = 0x7F_C000, kib = 16 }

[interfaces]
usb = ["USB_SERIAL_JTAG"]
ethernet = []
wifi = ["WIFI"]
bluetooth = ["BLE"]
uart = ["UART0", "UART1", "LP_UART"]
can = ["TWAI0", "TWAI1"]
spi = ["SPI2"]
i2c = ["I2C0", "LP_I2C0"]
adc = ["ADC1"]
dac = []
timers = ["TIMG0", "TIMG1", "SYSTIMER"]
pwm = ["LEDC", "MCPWM0"]

# GPIO0 to GPIO30.
[gpio]
pins = 31
# GPIO24 to GPIO30 are the SPI flash interface (SPICS0, SPIQ, SPIWP, VDD_SPI, SPIHD, SPICLK,
# SPID; ESP32-C6 datasheet, pin overview): the firmware and the program run from that flash, so a
# line there would stop the chip.
reserved = [
    { pin = "GPIO12", reason = "usb" },
    { pin = "GPIO13", reason = "usb" },
    { pin = "GPIO24", reason = "flash" },
    { pin = "GPIO25", reason = "flash" },
    { pin = "GPIO26", reason = "flash" },
    { pin = "GPIO27", reason = "flash" },
    { pin = "GPIO28", reason = "flash" },
    { pin = "GPIO29", reason = "flash" },
    { pin = "GPIO30", reason = "flash" },
]

[firmware]
crate = "firmware/trust-esp32c6"
bin = "trust-esp32c6"
# Measured on the C6 bench: the control requests (status, start and stop, states, faults and
# events) and Live Values at the pins (read, write, force and release), 18 October 2026; debugging
# compiled programs from VS Code and installs with online change, 24 October 2026 (the native
# list's N3 and N4).
components = ["engine", "control", "live-values", "debug", "deploy"]

[sources]
documents = [
    "ESP32-C6 Series Datasheet v1.5",
    "ESP32-C6 Technical Reference Manual",
]
measured = ["identity.device_id", "processor.isa", "processor.fpu", "clock.firmware_hz"]
measured_on = "the owner's ESP32-C6-DevKitC-1, 15 October 2026: chip ID 13 by the M0 probes, misa 0x40903105, 16,003,071 cycles in 100,018 microseconds (specification 34, D.2)"
unchecked = [
    "identity.usb_bootloader",
    "clock.crystal_min_hz",
    "clock.crystal_max_hz",
    "memory.spi_flash.erase_kib",
    "memory.ram.name",
    "memory.ram.dma",
    "layout.partition_table.kib",
    "interfaces.ethernet",
    "interfaces.uart",
    "interfaces.can",
    "interfaces.spi",
    "interfaces.i2c",
    "interfaces.adc",
    "interfaces.dac",
    "interfaces.timers",
    "interfaces.pwm",
    "gpio.pins",
]
