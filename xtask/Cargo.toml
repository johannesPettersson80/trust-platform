[package]
name = "xtask"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
anyhow.workspace = true
crc32fast = { workspace = true, features = ["std"] }
object = { version = "=0.40.0", default-features = false, features = ["read", "std"] }
proc-macro2 = { version = "1.0.107", features = ["span-locations"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
hex.workspace = true
syn = { version = "3.0.7", features = ["full", "visit"] }
toml.workspace = true
# The chip files: build-firmware builds each chip's firmware from its file, and the bench
# profiles take their chip values from it.
trust-chips.workspace = true

[target.'cfg(windows)'.dependencies]
process-wrap = { version = "=10.0.1", default-features = false, features = ["std", "job-object"] }
