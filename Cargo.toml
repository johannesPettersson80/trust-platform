[workspace]
resolver = "3"
members = [
    "xtask",
    "crates/trust-debug",
    "crates/trust-syntax",
    "crates/trust-hir",
    "crates/trust-ide",
    "crates/trust-lsp",
    "crates/trust-dev",
    "crates/trust-plcopen",
    "crates/trust-ads-core",
    "crates/trust-ads-server",
    "crates/verification-cases",
    "crates/trust-runtime-core",
    "crates/trust-platform-stm32f4",
    "crates/trust-runtime",
    "crates/trust-tcads-native",
    "crates/trust-wasm-analysis",
]
exclude = [
    "third_party/tiverse-mmap",
    "firmware/trust-nucleo-f401re",
]

[workspace.package]
version = "0.24.74"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/johannesPettersson80/trust-platform"
rust-version = "1.99"
authors = ["Johannes Pettersson <johannes_salomon@hotmail.com>"]
keywords = ["lsp", "plc", "iec61131", "structured-text", "automation"]
categories = ["development-tools", "text-editors"]

[workspace.dependencies]
# Syntax
logos = "0.16.1"
rowan = "0.17.0"
text-size = "1.1.1"

# Semantic analysis
salsa = "0.28.5"

# LSP
tower-lsp = "0.20.0"
lsp-types = "0.97.0"
tower = "0.4.13"

# Async runtime
tokio = { version = "1.53.2", features = ["full"] }

# Serialization
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.152"
toml = "1.1.8"
toml_edit = { version = "0.25.17", features = ["serde"] }
sha2 = "0.11.0"
hex = "0.4.3"
clap = { version = "4.6.7", features = ["derive"] }
clap_complete = "4.6.11"
qrcode = { version = "0.14.1", default-features = false, features = ["svg"] }
urlencoding = "2.1.3"
percent-encoding = "2.3.2"
roxmltree = "0.21.1"
wasm-bindgen = "0.2.129"

# Error handling
thiserror = { version = "2.0.21", default-features = false }
anyhow = "1.0.104"

# Testing
expect-test = "1.5.1"
insta = { version = "1.49.0", features = ["glob"] }
futures-util = "0.3.34"

# Utilities
smol_str = { version = "0.3.6", default-features = false }
rustc-hash = { version = "2.1.3", default-features = false }
indexmap = { version = "2.14.2", default-features = false }
libm = "=0.2.16"
drop_bomb = "0.1.5"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
once_cell = "1.21.4"
parking_lot = "0.12.5"
crossbeam-channel = "0.5.17"
glob = "0.3.4"
crc32fast = { version = "=1.5.2", default-features = false }
ratatui = "0.30.2"
crossterm = "0.29.0"
dialoguer = "0.12.0"
indicatif = "0.18.6"
owo-colors = "4.4.0"
rumqttc = { version = "0.25.1", default-features = false, features = ["use-native-tls"] }
native-tls = { version = "0.2.18", features = ["alpn", "vendored"] }
time = "0.3.55"
rapier3d = { version = "0.36.1", default-features = false, features = ["dim3", "f32", "enhanced-determinism"] }

# Internal crates
trust-syntax = { path = "crates/trust-syntax" }
trust-hir = { path = "crates/trust-hir" }
trust-ide = { path = "crates/trust-ide" }
trust-dev = { path = "crates/trust-dev" }
trust-plcopen = { path = "crates/trust-plcopen" }
trust-ads-core = { path = "crates/trust-ads-core" }
trust-ads-server = { path = "crates/trust-ads-server" }
verification-cases = { path = "crates/verification-cases" }
trust-runtime-core = { path = "crates/trust-runtime-core" }
trust-runtime = { path = "crates/trust-runtime" }
trust-tcads-native = { path = "crates/trust-tcads-native" }
trust-wasm-analysis = { path = "crates/trust-wasm-analysis" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"

[profile.release]
lto = true
codegen-units = 1

[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = false
codegen-units = 16

[profile.dev]
debug = 1
incremental = true

[profile.test]
debug = 1
incremental = true

[profile.dev.package.insta]
opt-level = 3

[profile.dev.package.similar]
opt-level = 3

[patch.crates-io]
tiverse-mmap = { path = "third_party/tiverse-mmap" }
