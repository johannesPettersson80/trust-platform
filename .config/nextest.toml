# cargo-nextest's profiles. CI's Test jobs run the full suite with `--profile ci`: every test in its own
# process, the tests of all programs in parallel (specification 22, "CI reliability and release-gate
# artifact contract").

[profile.ci]
# Every failing test is reported, not only the first.
fail-fast = false

# A test that asserts how long something takes runs alone: it takes every test thread, so that no
# other test of any program runs beside it (specification 22). Under `cargo test` the program's own
# measurement lock does that for its program.
[[profile.ci.overrides]]
filter = '''
binary(ci_cicd_contract) & (
    test(=ci_clean_setup_first_passing_test_is_under_ten_minutes)
    | test(=ci_single_test_feedback_is_under_two_seconds_for_small_project)
    | test(=ci_run_all_tests_scales_roughly_linearly_for_small_projects)
)
'''
threads-required = "num-test-threads"

[[profile.ci.overrides]]
filter = 'binary(web_ide_performance_gate)'
threads-required = "num-test-threads"

# The scan supervisor's tests time real cycles against a watchdog; beside other tests a loaded
# runner held a cycle past its timeout (6 November 2026, macOS, G56).
[[profile.ci.overrides]]
filter = 'binary(concurrency_supervisor)'
threads-required = "num-test-threads"

# The debugger's pause tests run 1 ms cycles against a 20 ms watchdog and expect no fault. Beside other
# tests a loaded Windows runner held the scan thread past the watchdog once (6 November 2026, G58).
# Under `cargo test` each was a program of its own and ran alone.
[[profile.ci.overrides]]
filter = 'binary(debug_pause_watchdog) | binary(debug_pause_watchdog_trace_cases)'
threads-required = "num-test-threads"

# On Windows, native-tls 0.2.18 keeps the key of an identity it builds from a PKCS#8 PEM pair in a key
# container of the user, which it names by a count kept in its own process (`native-tls-0` first) and
# creates when it is missing. Every test runs in its own process, so two tests that build an identity at
# the same time use the same container: one of them fails, or one key replaces the other (6 November
# 2026, G59). The MQTT tests build these identities, so on Windows they run one at a time.
[[profile.ci.overrides]]
platform = 'cfg(windows)'
filter = 'package(trust-runtime) & (test(/mqtt/) | binary(device_in_the_loop))'
test-group = 'native-tls-identity'

[test-groups]
native-tls-identity = { max-threads = 1 }
