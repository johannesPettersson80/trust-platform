[package]
name = "trust-fuzz"
version = "0.0.0"
license = "MIT OR Apache-2.0"
publish = false
edition = "2024"
rust-version = "1.99"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4.13"
trust-hir = { path = "../crates/trust-hir" }
trust-lsp = { path = "../crates/trust-lsp" }
trust-plcopen = { path = "../crates/trust-plcopen" }
trust-runtime = { path = "../crates/trust-runtime" }
trust-runtime-core = { path = "../crates/trust-runtime-core", features = ["register-ir"] }
trust-syntax = { path = "../crates/trust-syntax" }
serde_json = "1.0.152"

[[bin]]
name = "syntax_parse"
path = "fuzz_targets/syntax_parse.rs"
test = false
doc = false

[[bin]]
name = "hir_semantic"
path = "fuzz_targets/hir_semantic.rs"
test = false
doc = false

[[bin]]
name = "hir_lowering"
path = "fuzz_targets/hir_lowering.rs"
test = false
doc = false

[[bin]]
name = "plcopen_xml"
path = "fuzz_targets/plcopen_xml.rs"
test = false
doc = false

[[bin]]
name = "bytecode_container"
path = "fuzz_targets/bytecode_container.rs"
test = false
doc = false

[[bin]]
name = "bytecode_admission"
path = "fuzz_targets/bytecode_admission.rs"
test = false
doc = false

[[bin]]
name = "bytecode_reprepare"
path = "fuzz_targets/bytecode_reprepare.rs"
test = false
doc = false

[[bin]]
name = "runtime_config"
path = "fuzz_targets/runtime_config.rs"
test = false
doc = false

[[bin]]
name = "lsp_incremental"
path = "fuzz_targets/lsp_incremental.rs"
test = false
doc = false

[[bin]]
name = "hmi_payloads"
path = "fuzz_targets/hmi_payloads.rs"
test = false
doc = false

[workspace]
resolver = "3"
