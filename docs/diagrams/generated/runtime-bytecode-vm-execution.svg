"stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="189.4712" x="1774.63" y="1501.5363">materialize globals/instances</text></g><!--link storageWrite to storage--><g class="link" data-entity-1="ent0064" data-entity-2="ent0045" data-link-type="dependency" data-source-line="130" id="lnk77"><path codeLine="130" d="M2805.29,1125.4694 C2827.35,1125.4694 2843.66,1125.4694 2843.66,1125.4694 C2843.66,1125.4694 2843.66,1530.4694 2843.66,1530.4694 C2843.66,1530.4694 1656.81,1530.4694 1339.95,1530.4694" fill="none" id="storageWrite-to-storage" style="stroke:#000000;stroke-width:1;"/><polygon fill="#000000" points="1333.95,1530.4694,1342.95,1534.4694,1338.95,1530.4694,1342.95,1526.4694,1333.95,1530.4694" style="stroke:#000000;stroke-width:1;"/></g><!--link helperPkg to GMN78--><g class="link" data-entity-1="ent0060" data-entity-2="ent0079" data-link-type="association" data-source-line="134" id="lnk80"><path d="M3130.9678,1095.0631 C3136.8391,1095.0631 3145.9352,1056.4694 3156.6641,1056.4694 C3178.1219,1056.4694 3208.2813,1056.4694 3243.0875,1056.4694 C3312.7,1056.4694 3400.9,1056.4694 3475.25,1056.4694" fill="none" id="helperPkg-GMN78" style="stroke:#000000;stroke-width:1;stroke-dasharray:7,7;"/></g><g class="legend" data-source-line="147"><rect fill="none" height="205.5625" rx="7.5" ry="7.5" style="stroke:#000000;stroke-width:1;" width="722.7217" x="3044.5323" y="1590.4694"/><text fill="#000000" font-family="Verdana" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="214.1563" x="3049.5323" y="1608.4645">What this diagram clarifies</text><text fill="#000000" font-family="Verdana" font-size="14" lengthAdjust="spacing" textLength="472.4316" x="3049.5323" y="1624.7614">1. Production task/program execution goes directly to the VM path.</text><text fill="#000000" font-family="Verdana" font-size="14" lengthAdjust="spacing" textLength="514.4863" x="3049.5323" y="1641.0582">2. There is no production backend-dispatch seam or interpreter backend.</text><text fill="#000000" font-family="Verdana" font-size="14" lengthAdjust="spacing" textLength="290.7256" x="3049.5323" y="1657.3551">3. The VM hot path is the combination of:</text><text fill="#000000" font-family="Verdana" font-size="14" lengthAdjust="spacing" textLength="97.9453" x="3062.8829" y="1673.652">- register_ir.rs</text><text fill="#000000" font-family="Verdana" font-size="14" lengthAdjust="spacing" textLength="86.5977" x="3062.8829" y="1689.9489">- dispatch.rs</text><text fill="#000000" font-family="Verdana" font-size="14" lengthAdjust="spacing" textLength="51.0576" x="3062.8829" y="1706.2457">- call.rs</text><text fill="#000000" font-family="Verdana" font-size="14" lengthAdjust="spacing" textLength="120.1895" x="3062.8829" y="1722.5426">- dispatch_refs.rs</text><text fill="#000000" font-family="Verdana" font-size="14" lengthAdjust="spacing" textLength="85.4971" x="3062.8829" y="1738.8395">- memory.rs</text><text fill="#000000" font-family="Verdana" font-size="14" lengthAdjust="spacing" textLength="432.8037" x="3049.5323" y="1755.1364">4. `helper_eval` handles const/debug/config/init helpers only.</text><text fill="#000000" font-family="Verdana" font-size="14" lengthAdjust="spacing" textLength="527.8301" x="3049.5323" y="1771.4332">5. Bytecode resource limits are checked before executable materialization.</text><text fill="#000000" font-family="Verdana" font-size="14" lengthAdjust="spacing" textLength="712.7217" x="3049.5323" y="1787.7301">6. Remaining evaluator internals are test-only and are not part of the runtime scan-loop architecture.</text></g><?plantuml-src bLXTRnkv5NtNhs2p3tNYI49sDttG0WLYn-aQQpj1x7YnXG6Pcg4amZF30ScnhItwttlk9JaV6Zbj4o0PaPU7z_Fmad_nMrKgKHTILnDP5EQfrC-wsapSWwvgQMKfLZ9xs5ZJLFcfAOmLFtmwexyzYSoKjQbKvQ_zhb2YAOiVUxE5hfJVrKeOwxUcDr6PN3bLYv_VzmQjh1veyAVtaudN7d3UDjStucjJULsgXRYz56VFAckyDfMGLIv-LKMjh3Xxb4KZQNGogQ6ot2ZnweirUPEnwEak0zXPvUtkbP1EAFhwyh0HFrpepTQV58qI_ve8_6dD4Q_IhWl5MwfbHYX