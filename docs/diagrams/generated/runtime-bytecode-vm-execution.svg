/><rect fill="#FFFFFF" height="10" style="stroke:#000000;stroke-width:1;" width="15" x="2784.8161" y="1099.3294"/><rect fill="#FFFFFF" height="2" style="stroke:#000000;stroke-width:1;" width="4" x="2782.8161" y="1101.3294"/><rect fill="#FFFFFF" height="2" style="stroke:#000000;stroke-width:1;" width="4" x="2782.8161" y="1105.3294"/><text fill="#000000" font-family="Verdana" font-size="14" lengthAdjust="spacing" textLength="192.7461" x="2587.07" y="1127.3245">helper_eval::storage_lvalue</text><text fill="#000000" font-family="Verdana" font-size="14" lengthAdjust="spacing" textLength="152.4482" x="2587.07" y="1143.6214">debug pending writes</text></g><!--entity initService--><g class="entity" data-qualified-name="helperPkg.initService" data-source-line="117" id="ent0065"><rect fill="#FFFFFF" height="62.5938" rx="2.5" ry="2.5" style="stroke:#000000;stroke-width:1;" width="253.8623" x="2274.52" y="1248.8594"/><rect fill="#FFFFFF" height="10" style="stroke:#000000;stroke-width:1;" width="15" x="2508.3823" y="1253.8594"/><rect fill="#FFFFFF" height="2" style="stroke:#000000;stroke-width:1;" width="4" x="2506.3823" y="1255.8594"/><rect fill="#FFFFFF" height="2" style="stroke:#000000;stroke-width:1;" width="4" x="2506.3823" y="1259.8594"/><text fill="#000000" font-family="Verdana" font-size="14" lengthAdjust="spacing" textLength="128.8232" x="2289.52" y="1281.8545">harness::initializer</text><text fill="#000000" font-family="Verdana" font-size="14" lengthAdjust="spacing" textLength="213.8623" x="2289.52" y="1298.1514">startup/default materialization</text></g><!--entity vmLocalInit--><g class="entity" data-qualified-name="helperPkg.vmLocalInit" data-source-line="118" id="ent0066"><rect fill="#FFFFFF" height="62.5938" rx="2.5" ry="2.5" style="stroke:#000000;stroke-width:1;" width="252.4131" x="2274.24" y="1094.3294"/><rect fill="#FFFFFF" height="10" style="stroke:#000000;stroke-width:1;" width="15" x="2506.6531" y="1099.3294"/><rect fill="#FFFFFF" height="2" style="stroke:#000000;stroke-width:1;" width="4" x="2504.6531" y="1101.3294"/><rect fill="#FFFFFF" height="2" style="stroke:#000000;stroke-width:1;" width="4" x="2504.6531" y="1105.3294"/><text fill="#000000" font-family="Verdana" font-size="14" lengthAdjust="spacing" textLength="165.751" x="2289.24" y="1127.3245">runtime/vm/local_init.rs</text><text fill="#000000" font-family="Verdana" font-size="14" lengthAdjust="spacing" textLength="212.4131" x="2289.24" y="1143.6214">VM local/static initializer plans</text></g><!--entity debugCtx--><g class="entity" data-qualified-name="helperPkg.debugCtx" data-source-line="119" id="ent0067"><rect fill="#FFFFFF" height="62.5938" rx="2.5" ry="2.5" style="stroke:#000000;stroke-width:1;" width="200.2344" x="2882.33" y="1248.8594"/><rect fill="#FFFFFF" height="10" style="stroke:#000000;stroke-width:1;" width="15" x="3062.5644" y="1253.8594"/><rect fill="#FFFFFF" height="2" style="stroke:#000000;stroke-width:1;" width="4" x="3060.5644" y="1255.8594"/><rect fill="#FFFFFF" height="2" style="stroke:#000000;stroke-width:1;" width="4" x="3060.5644" y="1259.8594"/><text fill="#000000" font-family="Verdana" font-size="14" lengthAdjust="spacing" textLength="160.2344" x="2897.33" y="1281.8545">DebugRuntimeContext</text><text fill="#000000" font-family="Verdana" font-size="14" lengthAdjust="spacing" textLength="111.3984" x="2897.33" y="1298.1514">(debug/hook.rs)</text></g><g class="entity" data-qualified-name="GMN17" data-source-line="33" id="ent0018"><path d="M2154.74,727.4694 L2154.74,804.4694 L2078.68,808.4694 L2154.74,812.4694 L2154.74,888.7975 A0,0 0 0 0 2154.74,888.7975 L2448.1497,888.7975 A0,0 0 0 0 2448.1497,888.7975 L2448.1497,737.4694 L2438.1497,727.4694 L2154.74,727.4694 A0,0 0 0 0 2154.74,727.4694" fill="#FFFFFF" style="stroke:#000000;stroke-width:1;"/><path d="M2438.1497,727.4694 L2438.1497,737.4694 L2448.1497,737.4694 L2438.1497,727.4694" fill="#FFFFFF" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="201.8555" x="2160.74" y="744.5363">Native-call symbol metadata is</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="248.6694" x="2160.74" y="759.6691">prepared when the VmModule is built.</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="232.2671" x="2160.74" y="774.8019">CALL_NATIVE does not need to split</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="205.9688" x="2160.74" y="789.9347">raw symbol strings every cycle.</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="4.1323" x="2160.74" y="805.0675">&#160;</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="249.7485" x="2160.74" y="820.2003">`SIZEOF(...)` operands are resolved to</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="244.3784" x="2160.74" y="835.3331">static types before ST bytecode emit.</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="272.4097" x="2160.74" y="850.466">Production codegen emits `SIZEOF_TYPE`</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="256.0708" x="2160.74" y="865.5988">only; legacy `SIZEOF_VALUE` exists for</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="256.9341" x="2160.74" y="880.7316">compatibility / negative-path coverage.</text></g><g class="entity" data-qualified-name="GMN35" data-source-line="64" id="ent0036"><path d="M3167.81,1075.2294 L3167.81,1176.0263 L3431.0873,1176.0263 L3431.0873,1085.2294 L3421.0873,1075.2294 L3167.81,1075.2294" fill="#FFFFFF" style="stroke:#000000;stroke-width:1;"/><path d="M3421.0873,1075.2294 L3421.0873,1085.2294 L3431.0873,1085.2294 L3421.0873,1075.2294" fill="#FFFFFF" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="242.2773" x="3173.81" y="1092.2963">RegisterLoweringCacheState and the</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="232.9971" x="3173.81" y="1107.4291">tier1 specialized executor live here.</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="4.1323" x="3173.81" y="1122.5619">&#160;</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="231.1436" x="3173.81" y="1137.6947">Debug stepping intentionally keeps</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="212.0435" x="3173.81" y="1152.8275">stack-bytecode execution as the</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="143.019" x="3173.81" y="1167.9603">single source of truth.</text></g><g class="entity" data-qualified-name="GMN38" data-source-line="73" id="ent0039"><path d="M3154.28,1359.0594 L3154.28,1444.7234 L3458.6203,1444.7234 L3458.6203,1369.0594 L3448.6203,1359.0594 L3154.28,1359.0594" fill="#FFFFFF" style="stroke:#000000;stroke-width:1;"/><path d="M3448.6203,1359.0594 L3448.6203,1369.0594 L3458.6203,1369.0594 L3448.6203,1359.0594" fill="#FFFFFF" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="234.6538" x="3160.28" y="1376.1263">Stack, register, and tier-1 execution</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="272.1367" x="3160.28" y="1391.2591">charge the same original bytecode count.</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="283.3403" x="3160.28" y="1406.3919">Nested POU/native calls receive the caller's</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="278.9097" x="3160.28" y="1421.5247">remaining budget; exhaustion maps to the</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="240.4556" x="3160.28" y="1436.6575">existing execution-timeout category.</text></g><g class="entity" data-qualified-name="GMN54" data-source-line="97" id="ent0055"><path d="M347,1481.1894 L347,1566.8534 L637.896,1566.8534 L637.896,1491.1894 L627.896,1481.1894 L347,1481.1894" fill="#FFFFFF" style="stroke:#000000;stroke-width:1;"/><path d="M627.896,1481.1894 L627.896,1491.1894 L637.896,1491.1894 L627.896,1481.1894" fill="#FFFFFF" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="269.896" x="353" y="1498.2563">Current performance-sensitive boundary:</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="245.4321" x="353" y="1513.3891">- VM native-call argument marshaling</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="252.1987" x="353" y="1528.5219">- FUNCTION_BLOCK parameter binding</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="167.667" x="353" y="1543.6547">- OUT / IN_OUT copy-back</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="193.0449" x="353" y="1558.7875">- recursive VM POU execution</text></g><g class="entity" data-qualified-name="GMN57" data-source-line="105" id="ent0058"><path d="M11,1481.1894 L11,1566.8534 L301.896,1566.8534 L301.896,1491.1894 L291.896,1481.1894 L11,1481.1894" fill="#FFFFFF" style="stroke:#000000;stroke-width:1;"/><path d="M291.896,1481.1894 L291.896,1491.1894 L301.896,1491.1894 L291.896,1481.1894" fill="#FFFFFF" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="269.896" x="17" y="1498.2563">Current performance-sensitive boundary:</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="168.835" x="17" y="1513.3891">- ValueRef materialization</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="198.6816" x="17" y="1528.5219">- dynamic field/index traversal</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="165.5913" x="17" y="1543.6547">- instance-field resolution</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="241.0078" x="17" y="1558.7875">- storage read/write cloning pressure</text></g><g class="entity" data-qualified-name="GMN78" data-source-line="134" id="ent0079"><path d="M3475.65,1037.3994 L3475.65,1213.8603 L3779.254,1213.8603 L3779.254,1047.3994 L3769.254,1037.3994 L3475.65,1037.3994" fill="#FFFFFF" style="stroke:#000000;stroke-width:1;"/><path d="M3769.254,1037.3994 L3769.254,1047.3994 L3779.254,1047.3994 L3769.254,1037.3994" fill="#FFFFFF" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="209.9297" x="3481.65" y="1054.4663">These helpers exist for bounded</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="223.1265" x="3481.65" y="1069.5991">const/debug/config/init flows only.</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="164.4614" x="3481.65" y="1084.7319">Startup materialization is</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="231.1753" x="3481.65" y="1099.8647">orchestrated by harness::initializer.</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="177.7915" x="3481.65" y="1114.9975">VM local/static initialization</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="282.604" x="3481.65" y="1130.1303">consumes the same default/materialization</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="204.2866" x="3481.65" y="1145.2631">service through local init plans.</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="4.1323" x="3481.65" y="1160.396">&#160;</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="227.7539" x="3481.65" y="1175.5288">Scheduled task/program execution</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="245.9971" x="3481.65" y="1190.6616">does not pass through EvalContext or</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="216.3027" x="3481.65" y="1205.7944">an interpreter backend anymore.</text></g><!--link cycle to taskDispatch--><g class="link" data-entity-1="ent0003" data-entity-2="ent0004" data-link-type="dependency" data-source-line="16" id="lnk6"><path codeLine="16" d="M2216.45,155.5994 C2216.45,166.6194 2216.45,172.9694 2216.45,183.9794" fill="none" id="cycle-to-taskDispatch" style="stroke:#000000;stroke-width:1;"/><polygon fill="#000000" points="2216.45,189.9794,2220.45,180.9794,2216.45,184.9794,2212.45,180.9794,2216.45,189.9794" style="stroke:#000000;stroke-width:1;"/></g><!--link taskDispatch to ensureVm--><g class="link" data-entity-1="ent0004" data-entity-2="ent0005" data-link-type="dependency" data-source-line="17" id="lnk7"><path codeLine="17" d="M2198.45,253.2294 C2198.45,264.0594 2198.45,270.2994 2198.45,281.6694" fill="none" id="taskDispatch-to-ensureVm" style="stroke:#000000;stroke-width:1;"/><polygon fill="#000000" points="2198.45,287.6694,2202.45,278.6694,2198.45,282.6694,2194.45,278.6694,2198.45,287.6694" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="Ver