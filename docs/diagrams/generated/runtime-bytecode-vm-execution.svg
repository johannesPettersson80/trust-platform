" data-source-line="109" id="lnk66"><path d="M2584.5816,1006.2794 C2584.7679,1006.2794 2584.9572,1006.2794 2585.1492,1006.2794 C2585.5334,1006.2794 2585.9288,1006.2794 2586.3353,1006.2794 C2587.9612,1006.2794 2589.7634,1006.2794 2591.7237,1006.2794 C2599.565,1006.2794 2609.935,1006.2794 2621.66,1006.2794" fill="none" id="helperPkg-GMN64" style="stroke:#000000;stroke-width:1;stroke-dasharray:7,7;"/></g><g class="legend" data-source-line="117"><rect fill="none" height="189.2656" rx="7.5" ry="7.5" style="stroke:#000000;stroke-width:1;" width="722.7217" x="2154.2254" y="1335.2794"/><text fill="#000000" font-family="Verdana" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="214.1563" x="2159.2254" y="1353.2745">What this diagram clarifies</text><text fill="#000000" font-family="Verdana" font-size="14" lengthAdjust="spacing" textLength="472.4316" x="2159.2254" y="1369.5714">1. Production task/program execution goes directly to the VM path.</text><text fill="#000000" font-family="Verdana" font-size="14" lengthAdjust="spacing" textLength="514.4863" x="2159.2254" y="1385.8682">2. There is no production backend-dispatch seam or interpreter backend.</text><text fill="#000000" font-family="Verdana" font-size="14" lengthAdjust="spacing" textLength="290.7256" x="2159.2254" y="1402.1651">3. The VM hot path is the combination of:</text><text fill="#000000" font-family="Verdana" font-size="14" lengthAdjust="spacing" textLength="97.9453" x="2172.576" y="1418.462">- register_ir.rs</text><text fill="#000000" font-family="Verdana" font-size="14" lengthAdjust="spacing" textLength="86.5977" x="2172.576" y="1434.7589">- dispatch.rs</text><text fill="#000000" font-family="Verdana" font-size="14" lengthAdjust="spacing" textLength="51.0576" x="2172.576" y="1451.0557">- call.rs</text><text fill="#000000" font-family="Verdana" font-size="14" lengthAdjust="spacing" textLength="120.1895" x="2172.576" y="1467.3526">- dispatch_refs.rs</text><text fill="#000000" font-family="Verdana" font-size="14" lengthAdjust="spacing" textLength="85.4971" x="2172.576" y="1483.6495">- memory.rs</text><text fill="#000000" font-family="Verdana" font-size="14" lengthAdjust="spacing" textLength="405.9453" x="2159.2254" y="1499.9464">4. `helper_eval` handles const/debug/config helpers only.</text><text fill="#000000" font-family="Verdana" font-size="14" lengthAdjust="spacing" textLength="712.7217" x="2159.2254" y="1516.2432">5. Remaining evaluator internals are test-only and are not part of the runtime scan-loop architecture.</text></g><?plantuml-src bLZRRXiv4dtNLt0pBuupiZ2NlEXXW5XnCCRQJX0x3WOmeA6wAJNXRh91icttBFRVvrIHVPEKp6u2s19PFAmwTQN_5GfLAL6NKfkPB4lxNEaNRNOp_wXDBPsin4PcZpjd6vElR6cT-E731VqVIMIsggrH9jo6jbIYgSgVHxkbDYgqjHBMXSAEDepDbLUr-FNjQD59yqYBlxoTpO8EW0kkkRqJdniJTAMMulvQNBoeh0dQ6Y5DBdvNPQsSk7YIPIDfTJQheRBSAV7gaxDvax7egiq0Tc62Qry9wOMYJvyUT-A7AxqhmddPAF6VcS2_tXpnghjrgVXAjSu8vUJrWpbnSMl1AsVElsPK_hQFqXqEqZ-Ul1QB1zEj3DokQsTt8C2VH22IVQzzBKDM7E0PtpYrVghM5SmhrRgqCbTvXDuqkio7lU_e6c7kgrd4PtxcyzyEhnuli4HtKYn5PqbINopwbMrZcFdrfhJPuzgfxUo_8zTSoRzQSkOrgockPL1EorB_nJva1QC5Wu_-K1IWoKlI1RsL6UWuRuFA44iHQRdSEbkjaycdW_K2Yj_UdQ-4LwnNOc6JJfyJR_jCtrSJq4vsGkfJjO2YFQjFwSYte4GciqBb0Y6Pekl1-E2GS_v70PBmCuDo0Rzhsu3xJQdyZm_6W9Sd9NnRRMmfVAqoIEHgq-n49Ul9rRS1P4QlzfuYjqrCXU-U2sL47ocYqjvJwX-ScvZKVPdin1lXNcE34ewS9UnsRvjEtx0LymobfZEbKa7cCaYXFOlKJg4KW25M3_L9zDHfk0kwXpCMNBsxkbhVlBkxlByGkLKU1IK8et0oM11Kwi1YJZxth4MUXNfIheqHVpPJg26azhHif63-S3wgDfV6wnpgN2UsQMU8pbKhpM45UQgMoppbpb16KhPCYy5Xmfnq8SLbQnyQI-iUq3RhPnqAdDffZrHQQnSNW2LB7oCsxGbeKuWt0icaY90Oal4koDmTNjLTqwFt1enXenHQn1iHj78_zOX4rBSWINCVmFo1khmwxu8sePCVIFs8pIB7q3anraWCv2MWweootzl6PGfUJU5GMllOr1693rpBUZO9SWxS5Ec33z9dNX_n5JzsgwGLrSTIxpHI69nGU8AdkkwIR7IWDmH7KbAJpOl1HyevCBiG3JAphj5B4UU-a3K9RP5Er4ewL0OYsDugsXZkc6mTPEt8fC_9jLT9YnK5IYI5MY-ICpO8yZRN9AxWqAmFXPAALg4S4er5txDn7Gr2cm1_mQcme1MFIjL-qFMOxwarfbkfM87Ov5KeZaaX54SJ-dTGdwgjE7SwtoaVYpz_ZZaidt0GKNoGmbIiE8mc1QVhXsyUZ7IxfYBHZJOvMVL6s2RKJG1AtSx9Ct4u052y_I1S4neblUUxy06EXJxnTsjafJEnrQhCvxX5lIJTKufjZ-DkaQEA0A