" d="M1604.45,1236.8294 C1604.45,1268.2494 1604.45,1311.7194 1604.45,1311.7194 C1604.45,1311.7194 1442.22,1311.7194 1340.03,1311.7194" fill="none" id="storageEval-to-storage" style="stroke:#000000;stroke-width:1;"/><polygon fill="#000000" points="1334.03,1311.7194,1343.03,1315.7194,1339.03,1311.7194,1343.03,1307.7194,1334.03,1311.7194" style="stroke:#000000;stroke-width:1;"/></g><!--link storageWrite to storage--><g class="link" data-entity-1="ent0056" data-entity-2="ent0037" data-link-type="dependency" data-source-line="111" id="lnk63"><path codeLine="111" d="M2414.45,1095.9694 C2414.45,1168.9394 2414.45,1342.7194 2414.45,1342.7194 C2414.45,1342.7194 1597.72,1342.7194 1339.81,1342.7194" fill="none" id="storageWrite-to-storage" style="stroke:#000000;stroke-width:1;"/><polygon fill="#000000" points="1333.81,1342.7194,1342.81,1346.7194,1338.81,1342.7194,1342.81,1338.7194,1333.81,1342.7194" style="stroke:#000000;stroke-width:1;"/></g><!--link helperPkg to GMN64--><g class="link" data-entity-1="ent0052" data-entity-2="ent0065" data-link-type="association" data-source-line="115" id="lnk66"><path d="M2584.5816,1064.7194 C2584.7679,1064.7194 2584.9572,1064.7194 2585.1492,1064.7194 C2585.5334,1064.7194 2585.9288,1064.7194 2586.3353,1064.7194 C2587.9612,1064.7194 2589.7634,1064.7194 2591.7237,1064.7194 C2599.565,1064.7194 2609.935,1064.7194 2621.66,1064.7194" fill="none" id="helperPkg-GMN64" style="stroke:#000000;stroke-width:1;stroke-dasharray:7,7;"/></g><g class="legend" data-source-line="123"><rect fill="none" height="189.2656" rx="7.5" ry="7.5" style="stroke:#000000;stroke-width:1;" width="722.7217" x="2154.2254" y="1393.7194"/><text fill="#000000" font-family="Verdana" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="214.1563" x="2159.2254" y="1411.7145">What this diagram clarifies</text><text fill="#000000" font-family="Verdana" font-size="14" lengthAdjust="spacing" textLength="472.4316" x="2159.2254" y="1428.0114">1. Production task/program execution goes directly to the VM path.</text><text fill="#000000" font-family="Verdana" font-size="14" lengthAdjust="spacing" textLength="514.4863" x="2159.2254" y="1444.3082">2. There is no production backend-dispatch seam or interpreter backend.</text><text fill="#000000" font-family="Verdana" font-size="14" lengthAdjust="spacing" textLength="290.7256" x="2159.2254" y="1460.6051">3. The VM hot path is the combination of:</text><text fill="#000000" font-family="Verdana" font-size="14" lengthAdjust="spacing" textLength="97.9453" x="2172.576" y="1476.902">- register_ir.rs</text><text fill="#000000" font-family="Verdana" font-size="14" lengthAdjust="spacing" textLength="86.5977" x="2172.576" y="1493.1989">- dispatch.rs</text><text fill="#000000" font-family="Verdana" font-size="14" lengthAdjust="spacing" textLength="51.0576" x="2172.576" y="1509.4957">- call.rs</text><text fill="#000000" font-family="Verdana" font-size="14" lengthAdjust="spacing" textLength="120.1895" x="2172.576" y="1525.7926">- dispatch_refs.rs</text><text fill="#000000" font-family="Verdana" font-size="14" lengthAdjust="spacing" textLength="85.4971" x="2172.576" y="1542.0895">- memory.rs</text><text fill="#000000" font-family="Verdana" font-size="14" lengthAdjust="spacing" textLength="405.9453" x="2159.2254" y="1558.3864">4. `helper_eval` handles const/debug/config helpers only.</text><text fill="#000000" font-family="Verdana" font-size="14" lengthAdjust="spacing" textLength="712.7217" x="2159.2254" y="1574.6832">5. Remaining evaluator internals are test-only and are not part of the runtime scan-loop architecture.</text></g><?plantuml-src bLZRRXiv4dtNLt0pBuupaZ2Nl6Y11MB5mHZhIn0x7ip2W4nrKsh2tMI3PDlM3FRVzrIHVPEKx6u2n6rU3gjELHqMyxTGg4g9kfJQJ6HPsfTAlsgpdVWdRMhfP2NMCdlQEjkOV6bBwyGFdyxfxs15PglQ6cN2RTYLIZHL-VDWjjH6XLsjX7MXi8C9OtFbLIr-VJyOTD8yqU0lxoUJe0FWWcjkxyINnWHTgOMulnBdhofhWhP6I9EBtrHPAoVEdsNPI1gTJ6gOBBTAlFdiRDval7Ivom1sReBRlH7I2qLVdv-sueTBlIt2MTaeyTT4u4_dZdZJdhfGVAHQPOHoylR1dBWuDUUHcVDl6PL_sqTfDmVfdqxUYlc3