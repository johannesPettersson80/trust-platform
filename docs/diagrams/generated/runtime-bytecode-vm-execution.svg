<text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="233.4795" x="1753.76" y="398.4563">Not selectable in normal production</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="219.0513" x="1753.76" y="413.5891">startup. Retained only behind the</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="191.0454" x="1753.76" y="428.7219">legacy-interpreter feature for</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="185.2944" x="1753.76" y="443.8547">parity/test-oracle workflows.</text></g><g class="entity" data-qualified-name="GMN24" data-source-line="44" id="ent0025"><path d="M1650.17,722.3194 L1650.17,753.4094 L1347.03,757.4094 L1650.17,761.4094 L1650.17,792.8506 A0,0 0 0 0 1650.17,792.8506 L1919.8394,792.8506 A0,0 0 0 0 1919.8394,792.8506 L1919.8394,732.3194 L1909.8394,722.3194 L1650.17,722.3194 A0,0 0 0 0 1650.17,722.3194" fill="#FFFFFF" style="stroke:#000000;stroke-width:1;"/><path d="M1909.8394,722.3194 L1909.8394,732.3194 L1919.8394,732.3194 L1909.8394,722.3194" fill="#FFFFFF" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="201.2969" x="1656.17" y="739.3863">Native call symbol metadata is</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="248.6694" x="1656.17" y="754.5191">prepared when the VmModule is built.</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="232.2671" x="1656.17" y="769.6519">CALL_NATIVE does not need to split</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="213.4019" x="1656.17" y="784.7847">the raw symbol string every call.</text></g><g class="entity" data-qualified-name="GMN39" data-source-line="66" id="ent0040"><path d="M1872.36,969.6194 L1872.36,1016.4094 L1248,1020.4094 L1872.36,1024.4094 L1872.36,1070.4163 A0,0 0 0 0 1872.36,1070.4163 L2135.6373,1070.4163 A0,0 0 0 0 2135.6373,1070.4163 L2135.6373,979.6194 L2125.6373,969.6194 L1872.36,969.6194 A0,0 0 0 0 1872.36,969.6194" fill="#FFFFFF" style="stroke:#000000;stroke-width:1;"/><path d="M2125.6373,969.6194 L2125.6373,979.6194 L2135.6373,979.6194 L2125.6373,969.6194" fill="#FFFFFF" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="242.2773" x="1878.36" y="986.6863">RegisterLoweringCacheState and the</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="232.9971" x="1878.36" y="1001.8191">tier1 specialized executor live here.</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="4.1323" x="1878.36" y="1016.9519">&#160;</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="231.1436" x="1878.36" y="1032.0847">Debug stepping intentionally keeps</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="212.0435" x="1878.36" y="1047.2175">stack-bytecode execution as the</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="143.019" x="1878.36" y="1062.3503">single source of truth.</text></g><g class="entity" data-qualified-name="GMN55" data-source-line="91" id="ent0056"><path d="M981.55,1369.2194 L981.55,1454.8834 L1272.446,1454.8834 L1272.446,1379.2194 L1262.446,1369.2194 L981.55,1369.2194" fill="#FFFFFF" style="stroke:#000000;stroke-width:1;"/><path d="M1262.446,1369.2194 L1262.446,1379.2194 L1272.446,1379.2194 L1262.446,1369.2194" fill="#FFFFFF" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="269.896" x="987.55" y="1386.2863">Current performance-sensitive boundary:</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="245.4321" x="987.55" y="1401.4191">- VM native-call argument marshaling</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="252.1987" x="987.55" y="1416.5519">- FUNCTION_BLOCK parameter binding</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="167.667" x="987.55" y="1431.6847">- OUT / IN_OUT copy-back</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="193.0449" x="987.55" y="1446.8175">- recursive VM POU execution</text></g><g class="entity" data-qualified-name="GMN58" data-source-line="99" id="ent0059"><path d="M645.55,1369.2194 L645.55,1454.8834 L936.446,1454.8834 L936.446,1379.2194 L926.446,1369.2194 L645.55,1369.2194" fill="#FFFFFF" style="stroke:#000000;stroke-width:1;"/><path d="M926.446,1369.2194 L926.446,1379.2194 L936.446,1379.2194 L926.446,1369.2194" fill="#FFFFFF" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="269.896" x="651.55" y="1386.2863">Current performance-sensitive boundary:</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="168.835" x="651.55" y="1401.4191">- ValueRef materialization</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="198.6816" x="651.55" y="1416.5519">- dynamic field/index traversal</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="165.5913" x="651.55" y="1431.6847">- instance-field resolution</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="241.0078" x="651.55" y="1446.8175">- storage read/write cloning pressure</text></g><g class="entity" data-qualified-name="GMN69" data-source-line="118" id="ent0070"><path d="M646.7,1