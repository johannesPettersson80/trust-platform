8.4045">What this diagram clarifies</text><text fill="#000000" font-family="Verdana" font-size="14" lengthAdjust="spacing" textLength="502.6396" x="1615.9977" y="1764.7014">1. Production task/program execution defaults to BytecodeVmBackend.</text><text fill="#000000" font-family="Verdana" font-size="14" lengthAdjust="spacing" textLength="290.7256" x="1615.9977" y="1780.9982">2. The VM hot path is the combination of:</text><text fill="#000000" font-family="Verdana" font-size="14" lengthAdjust="spacing" textLength="97.9453" x="1629.3483" y="1797.2951">- register_ir.rs</text><text fill="#000000" font-family="Verdana" font-size="14" lengthAdjust="spacing" textLength="86.5977" x="1629.3483" y="1813.592">- dispatch.rs</text><text fill="#000000" font-family="Verdana" font-size="14" lengthAdjust="spacing" textLength="51.0576" x="1629.3483" y="1829.8889">- call.rs</text><text fill="#000000" font-family="Verdana" font-size="14" lengthAdjust="spacing" textLength="120.1895" x="1629.3483" y="1846.1857">- dispatch_refs.rs</text><text fill="#000000" font-family="Verdana" font-size="14" lengthAdjust="spacing" textLength="85.4971" x="1629.3483" y="1862.4826">- memory.rs</text><text fill="#000000" font-family="Verdana" font-size="14" lengthAdjust="spacing" textLength="356.6719" x="1615.9977" y="1878.7795">3. EvalContext remains in the repo, but mainly for:</text><text fill="#000000" font-family="Verdana" font-size="14" lengthAdjust="spacing" textLength="268.5635" x="1629.3483" y="1895.0764">- debug-expression / watch evaluation</text><text fill="#000000" font-family="Verdana" font-size="14" lengthAdjust="spacing" textLength="260.6543" x="1629.3483" y="1911.3732">- build-time const and initializer work</text><text fill="#000000" font-family="Verdana" font-size="14" lengthAdjust="spacing" textLength="288.9346" x="1629.3483" y="1927.6701">- optional legacy-interpreter parity builds</text><text fill="#000000" font-family="Verdana" font-size="14" lengthAdjust="spacing" textLength="372.709" x="1615.9977" y="1943.967">4. Architecture work should optimize the VM bridges,</text><text fill="#000000" font-family="Verdana" font-size="14" lengthAdjust="spacing" textLength="378.0957" x="1629.3483" y="1960.2639">not treat EvalContext as the primary production path.</text></g><?plantuml-src bLZRRXiv4dtNLt2JbyIs9CpjnLWi4CiEnbZRCMp7YmKC25Gt9H7g9XiasxPcTlzzJnNPLoa3R08ahMRni2wdBko_XQqgbQWAgSr45eLzA_MxDfk9tsbJIITBiPBPRkDiRVA5BQmJ7xzUqT-UH6RBoXfbmcFO5qhKPV5pRxNGHeLzfOHrOMjx2yRcogjA_FfRxwMJPaSlV_bjCWaw02wu-l59FDGcw5ATYqiLf2vKBYxsGMM04C-tukfTPNNGreXx6RQJIGMTvKQ93_VEvdN6Aujz1hGh4zp-Wv1UA7gwtst4nnkzsOQBebRYpud0dzOUyQ4vzbpn2MgP4Sgdpo_caujBStupS_upe_AlCKgpEKY_-_HPp5zCywPpxh9oTWCF-4yHY6GljQzaoBQCfqrGRYqprMhLMdq156NodbAh-APLA_rUM1Wjip1MiF7bSzb1vMejwoA8gdCXbDb6lDT6S8nqJLfMJk7V3gfG6vdjfxfR4zOK-mWLtoPXyV6I_qmYBeTiElt7eJVwBrXYPA4u5usFasFxRb_NXYrQhWgRxPPEhHbqZF7t_ync8rEFYWnCcFntCZ4sAE68LiAkHyk4ScU3yAfGMP0hMAWDai6LikWvc-Lya2xKrKmy4EiDM4z-4okrrV0LSfUbZhXthMIedH9hwrW4oQN3VXwK3rCBnN7ectMxDHBUpoRaU5AvbpWtyeyzPTOjz87mhGIgbeN-Gv9o7BYIbxeC-hUY-d6OGyfugB9yBPTnnxAmCbVv88d6V8rxdal6WW_qcfpTyZHgTNw-ThPS9eoJ3aw03uzF5mluc7tP947QVL7hue2up-K0j94TQFbQpc52g-Hhsl8ZA979RCinQyhNY_71eRpwCm7EuTyCoWNyNzbQC1VysOinyF6h4dvVhcmXVAKoIEHgLMz4AQl1qOz1KjX8WPQdd0u31pO_OgBqlO0qUTig8zhWY59xJmtWOD_0skR7O2KgSq3_uJBJFngOeU4qLfOWU2w35Df7mZe5pi9vh1wOBbglQaGIkeSP2ow-tDmixxuyNJzVYTmgJqGMHc5diF1TeMEn8mGdtrgdSXY4UbLkpteSJOBxfdA8hnUz7dDjlEQ-aq91ArqQBFRI72R1Qtb-dgTwrNMJL9g6FU6mE7rg-CRTQmoDLyiMqDRBDnsssBNH7Zcxr2w-09OiVAHpMkDwBau5ibQnEvYlyIp8F1qUrHpJehS6z66Z54Q5Kn6qSZ-rYEIe7q6IvYXtC7YiBh-TDhHDwCDsn2B7q3bhbiWQ92sWgenAWxUrGnkTDsGehDtLLKJY3RUocWnepjHDNEzYa9xvVSzVyR5vIrfHCohqHbEjFsM2mazLrQHPRqDh2BQaZ2URvrsCb7FmBEXI8pch2aCLgEwtiYAfDPXCfRI1PIJ2RSrANIKTCbWwIDoUJGyfjZT9ZGKn9Nf5zZeHXvih5lSAQDPoeQ2CtogdPj6rbsnTumVkaOQY2WlsOgTKvJjTZmMVHgHqAjKhU3Q55OfZP0pRendzEtoVQh6uS3hVA1zR0p_799Qls0WQ7-GmrmdYqQ3cD4F8wOkHRbEN9Bf2UoQhJeMjGrK7e5JxAKKc3ea0YgSVy3MXKTPxFWiF22pqYV_lZInr9jPQ5JawVgxUa-ufnzR7STT8KaM0K8bTojZyDlucLIlbA9ZycxF5sg8D8VbyLQ_Ngkj-ZonuqF