1405.1497,539.2894" fill="#FFFFFF" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="201.8555" x="1127.74" y="556.3563">Native-call symbol metadata is</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="248.6694" x="1127.74" y="571.4891">prepared when the VmModule is built.</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="232.2671" x="1127.74" y="586.6219">CALL_NATIVE does not need to split</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="205.9688" x="1127.74" y="601.7547">raw symbol strings every cycle.</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="4.1323" x="1127.74" y="616.8875">&#160;</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="249.7485" x="1127.74" y="632.0203">`SIZEOF(...)` operands are resolved to</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="244.3784" x="1127.74" y="647.1531">static types before ST bytecode emit.</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="272.4097" x="1127.74" y="662.286">Production codegen emits `SIZEOF_TYPE`</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="256.0708" x="1127.74" y="677.4188">only; legacy `SIZEOF_VALUE` exists for</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="256.9341" x="1127.74" y="692.5516">compatibility / negative-path coverage.</text></g><g class="entity" data-qualified-name="GMN30" data-source-line="59" id="ent0031"><path d="M657.81,849.2094 L657.81,895.7194 L613.37,899.7194 L657.81,903.7194 L657.81,950.0062 A0,0 0 0 0 657.81,950.0062 L921.0873,950.0062 A0,0 0 0 0 921.0873,950.0062 L921.0873,859.2094 L911.0873,849.2094 L657.81,849.2094 A0,0 0 0 0 657.81,849.2094" fill="#FFFFFF" style="stroke:#000000;stroke-width:1;"/><path d="M911.0873,849.2094 L911.0873,859.2094 L921.0873,859.2094 L911.0873,849.2094" fill="#FFFFFF" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="242.2773" x="663.81" y="866.2763">RegisterLoweringCacheState and the</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="232.9971" x="663.81" y="881.4091">tier1 specialized executor live here.</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="4.1323" x="663.81" y="896.5419">&#160;</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="231.1436" x="663.81" y="911.6747">Debug stepping intentionally keeps</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="212.0435" x="663.81" y="926.8075">stack-bytecode execution as the</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="143.019" x="663.81" y="941.9403">single source of truth.</text></g><g class="entity" data-qualified-name="GMN46" data-source-line="84" id="ent0047"><path d="M11,1284.4394 L11,1370.1034 L301.896,1370.1034 L301.896,1294.4394 L291.896,1284.4394 L11,1284.4394" fill="#FFFFFF" style="stroke:#000000;stroke-width:1;"/><path d="M291.896,1284.4394 L291.896,1294.4394 L301.896,1294.4394 L291.896,1284.4394" fill="#FFFFFF" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="269.896" x="17" y="1301.5063">Current performance-sensitive boundary:</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="245.4321" x="17" y="1316.6391">- VM native-call argument marshaling</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="252.1987" x="17" y="1331.7719">- FUNCTION_BLOCK parameter binding</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="167.667" x="17" y="1346.9047">- OUT / IN_OUT copy-back</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="193.0449" x="17" y="1362.0375">- recursive VM POU execution</text></g><g class="entity" data-qualified-name="GMN49" data-source-line="92" id="ent0050"><path d="M347,1284.4394 L347,1370.1034 L637.896,1370.1034 L637.896,1294.4394 L627.896,1284.4394 L347,1284.4394" fill="#FFFFFF" style="stroke:#000000;stroke-width:1;"/><path d="M627.896,1284.4394 L627.896,1294.4394 L637.896,1294.4394 L627.896,1284.4394" fill="#FFFFFF" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="269.896" x="353" y="1301.5063">Current performance-sensitive boundary:</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="168.835" x="353" y="1316.6391">- ValueRef materialization</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="198.6816" x="353" y="1331.7719">- dynamic field/index traversal</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="165.5913" x="353" y="1346.9047">- instance-field resolution</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="241.0078" x="353" y="1362.0375">- storage read/write cloning pressure</text></g><g class="entity" data-qualified-name="GMN64" data-source-line="115" id="ent0065"><path d="M2621.95,1013.8994 L2621.95,1114.6963 L2888.9471,1114.6963 L2888.9471,1023.8994 L2878.9471,1013.8994 L2621.95,1013.8994" fill="#FFFFFF" style="stroke:#000000;stroke-width:1;"/><path d="M2878.9471,1013.8994 L2878.9471,1023.8994 L2888.9471,1023.8994 L2878.9471,1013.8994" fill="#FFFFFF" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="209.9297" x="2627.95" y="1030.9663">These helpers exist for bounded</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="198.1865" x="2627.95" y="1046.0991">const/debug/config flows only.</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="4.1323" x="2627.95" y="1061.2319">&#160;</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="227.7539" x="2627.95" y="1076.3647">Scheduled task/program execution</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="245.9971" x="2627.95" y="1091.4975">does not pass through EvalContext or</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="216.3027" x="2627.95" y="1106.6303">an interpreter backend anymore.</text></g><!--link cycle to taskDispatch--><g class="link" data-entity-1="ent0003" data-entity-2="ent0004" data-link-type="dependency" data-source-line="16" id="lnk6"><path codeLine="16" d="M981.45,155.5994 C981.45,166.6194 981.45,172.9694 981.45,183.9794" fill="none" id="cycle-to-taskDispatch" style="stroke:#000000;stroke-width:1;"/><polygon fill="#000000" points="981.45,189.9794,985.45,180.9794,981.45,184.9794,977.45,180.9794,981.45,189.9794" style="stroke:#000000;stroke-width:1;"/></g><!--link taskDispatch to ensureVm--><g class="link" data-entity-1="ent0004" data-entity-2="ent0005" data-link-type="dependency" data-source-line="17" id="lnk7"><path codeLine="17" d="M963.45,253.2294 C963.45,264.0594 963.45,270.2994 963.45,281.6694" fill="none" id="taskDispatch-to-ensureVm" style="stroke:#000000;stroke-width:1;"/><polygon fill="#000000" points="963.45,287.6694,967.45,278.6694,963.45,282.6694,959.45,278.6694,963.45,287.6694" style