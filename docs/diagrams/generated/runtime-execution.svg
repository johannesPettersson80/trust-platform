9">&#8226; use declared GlobalVarMeta type</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="215.9092" x="5108.8646" y="1725.7447">and TypeRegistry to canonicalize</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="273.5269" x="5108.8646" y="1740.8775">retained compound values before storage</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="229.9375" x="5100.6" y="1756.0103">&#8226; stale serialized enum type casing</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="121.5259" x="5108.8646" y="1771.1431">is repaired on load</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="245.2988" x="5100.6" y="1786.276">&#8226; enum mismatches, struct field drift,</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="194.6001" x="5108.8646" y="1801.4088">and array shape/type drift fail</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="227.9316" x="5108.8646" y="1816.5416">startup instead of entering storage</text></g><!--entity start1--><g class="entity" data-qualified-name="lifecyclePkg.startupFlow.start1" data-source-line="206" id="ent0092"><rect fill="#FFFFFF" height="38.5938" rx="2.5" ry="2.5" style="stroke:#000000;stroke-width:1;" width="214.4346" x="4043.78" y="1724.6394"/><text fill="#000000" font-family="Verdana" font-size="14" lengthAdjust="spacing" textLength="106.8525" x="4053.78" y="1740.6345">1. load_retain()</text><text fill="#000000" font-family="Verdana" font-size="14" lengthAdjust="spacing" textLength="194.4346" x="4053.78" y="1756.9314">(decode + value validation)</text></g><!--entity start2--><g class="entity" data-qualified-name="lifecyclePkg.startupFlow.start2" data-source-line="207" id="ent0093"><rect fill="#FFFFFF" height="22.2