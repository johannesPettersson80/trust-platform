 overrides.</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="4.1323" x="6347.81" y="2061.7303">&#160;</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="151.5376" x="6347.81" y="2076.8631">Materialization priority:</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="255.3726" x="6347.81" y="2091.996">retained value &gt; VAR_CONFIG override</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="241.522" x="6347.81" y="2107.1288">&gt; variable initializer &gt; TYPE/member</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="187.2178" x="6347.81" y="2122.2616">defaults &gt; zero/type default.</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="4.1323" x="6347.81" y="2137.3944">&#160;</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="217.4072" x="6347.81" y="2152.5272">Struct/union construction ends at</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="222.1235" x="6347.81" y="2167.66">StructValue::new or an equivalent</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="134.2085" x="6347.81" y="2182.7928">validation boundary.</text></g><!--entity hmiRuntimePort--><g class="entity" data-qualified-name="hmiPkg.hmiControl.hmiRuntimePort" data-source-line="274" id="ent0128"><rect fill="#FFFFFF" height="38.5938" rx="2.5" ry="2.5" style="stroke:#000000;stroke-width:1;" width="248.833" x="9604.58" y="2060.6394"/><text fill="#000000" font-family="Verdana" font-size="14" lengthAdjust="spacing" textLength="202.5762" x="9614.58" y="2076.6345">control/hmi_runtime_ports.rs</text><text fill="#000000" font-family="Verdana" font-size="14" lengthAdjust="spacing" textLe