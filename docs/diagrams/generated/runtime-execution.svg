 lengthAdjust="spacing" textLength="404.168" x="11283.703" y="3374.9539">4. Bytecode VM is the only production execution backend</text><text fill="#000000" font-family="Verdana" font-size="14" lengthAdjust="spacing" textLength="392.1367" x="11283.703" y="3391.2507">5. helper_eval handles debug/tooling/build-helper paths</text><text fill="#000000" font-family="Verdana" font-size="14" lengthAdjust="spacing" textLength="4.4502" x="11283.703" y="3407.5476">&#160;</text><text fill="#000000" font-family="Verdana" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="119.1504" x="11283.703" y="3423.8445">Memory Areas:</text><text fill="#000000" font-family="Verdana" font-size="14" lengthAdjust="spacing" textLength="244.3506" x="11283.703" y="3440.1414">&#8226; Globals - Program-wide variables</text><text fill="#000000" font-family="Verdana" font-size="14" lengthAdjust="spacing" textLength="211.7773" x="11283.703" y="3456.4382">&#8226; Frames - Function call locals</text><text fill="#000000" font-family="Verdana" font-size="14" lengthAdjust="spacing" textLength="192.623" x="11283.703" y="3472.7351">&#8226; Instances - FB/Class state</text><text fill="#000000" font-family="Verdana" font-size="14" lengthAdjust="spacing" textLength="242.6484" x="11283.703" y="3489.032">&#8226; Retain - Persistent across restart</text><text fill="#000000" font-family="Verdana" font-size="14" lengthAdjust="spacing" textLength="264.7285" x="11283.703" y="3505.3289">&#8226; I/O - Direct addresses (%I, %Q, %M)</text></g><?plantuml-src jJpjSYCtSl_r5CYwha9fHLBVtgLbLIYAql8YYJgIMjl9fcXm1YJ7EvmPpuUqTCfL-PK7o2FaqUv9qjtu660uaZPPnLUt8e16ez5eDBeRZVc7V2bMWYKX3w8j7eRnuohu4aIBhUnp42KyvIisuzxdHHeNaT-BmpXbtrtsyNyMX1UlaZWIKJxErw5WnIeyi5h381BvEX4iJlDbR3L4iIyoaR3ZFQiovT5dh3mytjhAWnpGvMandh1H4UN1IdJO-JeN7lJSPMDlAVmY5Eakuv7Fni6g27aUn17hHmiOT6lh7zcFt_0VT1_Ttqu6DttM6uxwtuej0JxoXM1lr5HOBqx56yOpbieABBFlheF5ChzAXOZOlszjCVZF2tcMcMvs3tPwgdwrFUZSIhFEmK7pwEZi3FeozP_u8hm2sJB5bHIHts5zNNKkQmniaiRp80GkN_1SJ03ldQmm0