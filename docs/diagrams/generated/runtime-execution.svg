ource-line="407" id="ent0217"><rect fill="#FFFFFF" height="38.5938" rx="2.5" ry="2.5" style="stroke:#000000;stroke-width:1;" width="226.2676" x="5610.87" y="2750.0794"/><text fill="#000000" font-family="Verdana" font-size="14" lengthAdjust="spacing" textLength="206.2676" x="5620.87" y="2766.0745">3. Compile generated globals</text><text fill="#000000" font-family="Verdana" font-size="14" lengthAdjust="spacing" textLength="163.8164" x="5620.87" y="2782.3714">as normal ST metadata</text></g><!--entity ads4--><g class="entity" data-qualified-name="adsPkg.adsFlow.ads4" data-source-line="408" id="ent0218"><rect fill="#FFFFFF" height="38.5938" rx="2.5" ry="2.5" style="stroke:#000000;stroke-width:1;" width="316.6455" x="5568.68" y="2893.4394"/><text fill="#000000" font-family="Verdana" font-size="14" lengthAdjust="spacing" textLength="296.6455" x="5578.68" y="2909.4345">4. Bundle startup resolves declared global</text><text fill="#000000" font-family="Verdana" font-size="14" lengthAdjust="spacing" textLength="287.1504" x="5578.68" y="2925.7314">-&gt; ValueRef + TypeId and starts workers</text></g><!--entity ads5--><g class="entity" data-qualified-name="adsPkg.adsFlow.ads5" data-source-line="409" id="ent0219"><rect fill="#FFFFFF" height="54.8906" rx="2.5" ry="2.5" style="stroke:#000000;stroke-width:1;" width="282.5615" x="5593.72" y="3013.5294"/><text fill="#000000" font-family="Verdana" font-size="14" lengthAdjust="spacing" textLength="262.5615" x="5603.72" y="3029.5245">5. Worker thread owns ADS transport</text><text fill="#000000" font-family="Verdana" font-size="14" lengthAdjust="spacing" textLength="235.4707" x="5603.72" y="3045.8214">sum-up read/write + notifications</text><text fill="#000000" font-family="Verdana" font-size="14" lengthAdjust="spacing" textLength="175.7998" x="5603.72" y="3062.1182">+ symbol-version checks</text></g><!--entity ads6--><g class="entity" data-qualified-name="adsPkg.adsFlow.ads6" data-source-line="410" id="ent0220"><rect fill="#FFFFFF" he