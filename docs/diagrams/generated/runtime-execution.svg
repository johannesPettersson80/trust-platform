764.21" y="2960.3045">8. write_cycle_outputs()</text></g><!--entity step8a--><g class="entity" data-qualified-name="cyclePkg.cycleFlow.step8a" data-source-line="112" id="ent0044"><rect fill="#FFFFFF" height="38.5938" rx="2.5" ry="2.5" style="stroke:#000000;stroke-width:1;" width="241.1426" x="7727.43" y="3041.6894"/><text fill="#000000" font-family="Verdana" font-size="14" lengthAdjust="spacing" textLength="221.1426" x="7737.43" y="3057.6845">8a. simulation post-cycle hooks</text><text fill="#000000" font-family="Verdana" font-size="14" lengthAdjust="spacing" textLength="150.7119" x="7737.43" y="3073.9814">(coupling scheduling)</text></g><!--entity step9--><g class="entity" data-qualified-name="cyclePkg.cycleFlow.step9" data-source-line="113" id="ent0045"><rect fill="#FFFFFF" height="22.2969" rx="2.5" ry="2.5" style="stroke:#000000;stroke-width:1;" width="168.832" x="7772.58" y="3147.8094"/><text fill="#000000" font-family="Verdana" font-size="14" lengthAdjust="spacing" textLength="148.832" x="7782.58" y="3163.8045">9. update_io_health()</text></g><!--entity step10--><g class="entity" data-qualified-name="cyclePkg.cycleFlow.step10" data-source-line="114" id="ent0046"><rect fill="#FFFFFF" height="22.2969" rx="2.5" ry="2.5" style="stroke:#000000;stroke-width:1;" width="192.2178" x="7760.89" y="3221.6494"/><text fill="#000000" font-family="Verdana" font-size="14" lengthAdjust="spacing" textLength="172.2178" x="7770.89" y="3237.6445">10. Emit CycleEnd event</text></g><g class="entity" data-qualified-name="lifecyclePkg.GMN94" data-source-line="207" id="ent0095"><path d="M4770.43,2203.7694 L4770.43,2249.9494 L4005.24,2253.9494 L4770.43,2257.9494 L4770.43,2274.3006 A0,0 0 0 0 4770.43,2274.3006 L5147.5716,2274.3006 A0,0 0 0 0 5147.5716,2274.3006 L5147.5716,2213.7694 L5137.5716,2203.7694 L4770.43,2203.7694 A0,0 0 0 0 4770.43,2203.7694" fill="#FFFFFF" style="stroke:#000000;stroke-width:1;"/><path d="M5137.5716,2203.7694 L5137.5716,2213.7694 L5147.5716,2213.7694 L5137.5716,2203.7694" fill="#FFFFFF" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="111.376" x="4776.43" y="2220.8363">fail-fast contract:</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="343.77" x="4776.43" y="2235.9691">&#8226; required SHM create/open failure =&gt; startup abort</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="317.0654" x="4776.43" y="2251.1019">&#8226; required page pinning failure =&gt; startup abort</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="356.1416" x="4776.43" y="2266.2347">&#8226; publish readiness metadata for _meta/shm_channels</text></g><g class="entity" data-qualified-name="lifecyclePkg.GMN97" data-source-line="214" id="ent0098"><path d="M4769.72,2351.0594 L4769.72,2436.7234 L5082.2869,2436.7234 L5082.2869,2361.0594 L5072.2869,2351.0594 L4769.72,2351.0594" fill="#FFFFFF" style="stroke:#000000;stroke-width:1;"/><path d="M5072.2869,2351.0594 L5072.2869,2361.0594 L5082.2869,2361.0594 L5072.2869,2351.0594" fill="#FFFFFF" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="172.7896" x="4775.72" y="2368.1263">Linux PREEMPT_RT profile:</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="291.5669" x="4775.72" y="2383.2591">&#8226; verify /sys/kernel/realtime when requested</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="289.1929" x="4775.72" y="2398.3919">&#8226; call mlockall(MCL_CURRENT|MCL_FUTURE)</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="196.1743" x="4775.72" y="2413.5247">&#8226; pin scheduler thread affinity</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="274.2886" x="4775.72" y="2428.6575">&#8226; verify deployed scheduler policy/priority</text></g><g class="entity" data-qualified-name="lifecyclePkg.GMN100" data-source-line="222" id="ent0101"><path d="M4769.6,1678.6794 L4769.6,1739.9494 L3940.3,1743.9494 L4769.6,1747.9494 L4769.6,1840.0075 A0,0 0 0 0 4769.6,1840.0075 L5072.3915,1840.0075 A0,0 0 0 0 5072.3915,1840.0075 L5072.3915,1688.6794 L5062.3915,1678.6794 L4769.6,1678.6794 A0,0 0 0 0 4769.6,1678.6794" fill="#FFFFFF" style="stroke:#000000;stroke-width:1;"/><path d="M5062.3915,1678.6794 L5062.3915,1688.6794 L5072.3915,1688.6794 L5062.3915,1678.6794" fill="#FFFFFF" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="155.0923" x="4775.6" y="1695.7463">Retain restore contract:</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="195.0444" x="4775.6" y="1710.8791">&#8226; decode persisted Value tree</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="228.7695" x="4775.6" y="1726.0119">&#8226; use declared GlobalVarMeta type</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="215.9092" x="4783.8646" y="1741.1447">and TypeRegistry to canonicalize</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="273.5269" x="4783.8646" y="1756.2775">retained compound values before storage</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="229.9375" x="4775.6" y="1771.4103">&#8226; stale serialized enum type casing</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="121.5259" x="4783.8646" y="1786.5431">is repaired on load</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="245.2988" x="4775.6" y="1801.676">&#8226; enum mismatches, struct field drift,</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="194.6001" x="4783.8646" y="1816.8088">and array shape/type drift fail</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="227.9316" x="4783.8646" y="1831.9416">startup instead of entering storage</text></g><!--entity start1--><g class="entity" data-qualified-name="lifecyclePkg.startupFlow.start1" data-source-line="194" id="ent0085"><rect fill="#FFFFFF" height="38.5938" rx="2.5" ry="2.5" style="stroke:#000000;stroke-width:1;" width="214.4346" x="3725.78" y="1740.0494"/><text fill="#000000" font-family="Verdana" font-size="14" lengthAdjust="spacing" textLength="106.8525" x="3735.78" y="1756.0445">1. load_retain()</text><text fill="#000000" font-family="Verdana" font-size="14" lengthAdjust="spacing" textLength="194.4346" x="3735.78" y="1772.3414">(decode + value validation)</text></g><!--entity start2--><g class="entity" data-qualified-name="lifecyclePkg.startupFlow.start2" data-source-line="195" id="ent0086"><rect fill="#FFFFFF" height="22.2969" rx="2.5" ry="2.5" style="stroke:#000000;stroke-width:1;" width="134.2559" x="3765.87" y="2042.1394"/><text fill="#000000" font-family="Verdana" font-size="14" lengthAdjust="spacing" textLength="114.2559" x="3775.87" y="2058.1345">2. init globals/IO</text></g><!--entity start2a--><g class="entity" data-qualified-name="lifecyclePkg.startupFlow.start2a" data-source-line="196" id="ent0087"><rect fill="#FFFFFF" height="38.5938" rx="2.5" ry="2.5" style="stroke:#000000;stroke-width:1;" width="343.5176" x="3661.24" y="2219.7394"/><text fill="#000000" font-family="Verdana" font-size="14" lengthAdjust="spacing" textLength="215.3867" x="3671.24" y="2235.7345">2a. provision T0 SHM channels</text><text fill="#000000" font-family="Verdana" font-size="14" lengthAdjust="spacing" textLength="323.5176" x="3671.24" y="2252.0314">(map shared + initialize headers + pin pages)</text></g><!--entity start2b--><g class="entity" data-qualified-name="lifecyclePkg.startupFlow.start2b" data-source-line="197" id="ent0088"><rect fill="#FFFFFF" height="38.5938" rx="2.5" ry="2.5" style="stroke:#000000;stroke-width:1;" width="313.7266" x="3683.14" y="2374.5894"/><text fill="#000000" font-family="Verdana" font-size="14" lengthAdjust="spacing" textLength="188.0498" x="3693.14" y="2390.5845">2b. apply Linux RT posture</text><text fill="#000000" font-family="Verdana" font-size="14" lengthAdjust="spacing" textLength="293.7266" x="3693.14" y="2406.8814">(verify PREEMPT_RT + mlockall + affinity)</text></g><!--entity start3--><g class="entity" data-qualified-name="lifecyclePkg.startupFlow.start3" data-source-line="198" id="ent0089"><rect fill="#FFFFFF" height="22.2969" rx="2.5" ry="2.5" style="stroke:#000000;stroke-width:1;" width="111.6289" x="3784.19" y="2518.5394"/><text fill="#000000" font-family="Verdana" font-size="14" lengthAdjust="spacing" textLength="91.6289" x="3794.19" y="2534.5345">3. start tasks</text></g><!--entity stop1--><g class="entity" data-qualified-name="lifecyclePkg.shutdownFlow.stop1" data-source-line="235" id="ent0104"><rect fill="#FFFFFF" height="22.2969" rx="2.5" ry="2.5" style="stroke:#000000;stroke-width:1;" width="109.2568" x="4061.37" y="1748.1994"/><text fill="#000000" font-family="Verdana" font-size="14" lengthAdjust="spacing" textLength="89.2568" x="4071.37" y="1764.1945">1. stop tasks</text></g><!--entity stop2--><g class="entity" data-qualified-name="lifecyclePkg.shutdownFlow.stop2" data-source-line="236" id="ent0105"><rect fill="#FFFFFF" height="22.2969" rx="2.5" ry="2.5" style="stroke:#000000;stroke-width:1;" width="129.7031" x="4220.15" y="1748.1994"/><text fill="#000000" font-family="Verdana" font-size="14" lengthAdjust="spacing" textLength="109.7031" x="4230.15" y="1764.1945">2. save_retain()</text></g><!--entity online1--><g class="entity" data-qualified-name="lifecyclePkg.onlineChangeFlow.online1" data-source-line="240" id="ent0107"><rect fill="#FFFFFF" height="22.2969" rx="2.5" ry="2.5" style="stroke:#000000;stroke-width:1;" width="274.4609" x="4434.77" y="1748.1994"/><text fill="#000000" font-family="Verdana" font-size="14" lengthAdjust="spacing" textLength="254.4609" x="4444.77" y="1764.1945">1. queue ReloadBytecode command</text></g><!--entity online2--><g class="entity" data-qualified-name="lifecyclePkg.onlineChangeFlow.online2" data-source-line="241" id="ent0108"><rect fill="#FFFFFF" height="22.2969" rx="2.5" ry="2.5" style="stroke:#000000;stroke-width:1;" width="331.7598" x="4406.12" y="2042.1394"/><text fill="#000000" font-family="Verdana" font-size="14" lengthAdjust="spacing" textLength="311.7598" x="4416.12" y="2058.1345">2. scheduler applies swap at cycle boundary</text></g><!--entity online3--><g class="entity" data-qualified-name="lifecyclePkg.onlineChangeFlow.online3" data-source-line="242" id="ent0109"><rect fill="#FFFFFF" height="22.2969" rx="2.5" ry="2.5" style="stroke:#000000;stroke-width:1;" width="241.0537" x="4451.47" y="2227.8894"/><text fill="#000000" font-family="Verdana" font-size="14" lengthAdjust="spacing" textLength="221.0537" x="4461.47" y="2243.8845">3. apply_online_change_bytes()</text></g><!--entity online4--><g class="entity" data-qualified-name="lifecyclePkg.onlineChangeFlow.online4" data-source-line="243" id="ent0110"><rect fill="#FFFFFF" height="38.5938" rx="2.5" ry="2.5" style="stroke:#000000;stroke-width:1;" width="239.2285" x="4452.39" y="2374.5894"/><text fill="#000000" font-family="Verdana" font-size="14" lengthAdjust="spacing" textLength="219.2285" x="4462.39" y="2390.5845">4. warm restart + retain reload</text><text fill="#000000" font-family="Verdana" font-size="14" lengthAdjust="spacing" textLength="198.3584" x="4462.39" y="2406.8814">(restart-entrypoint IP policy)</text></g><g class="entity" data-qualified-name="hmiPkg.GMN173" data-source-line="323" id="ent0174"><path d="M11518.39,2471.7194 L11518.39,2525.9494 L11467.73,2529.9494 L11518.39,2533.9494 L11518.39,2587.6491 A0,0 0 0 0 11518.39,2587.6491 L11925.6195,2587.6491 A0,0 0 0 0 11925.6195,2587.6491 L11925.6195,2481.7194 L11915.6195,2471.7194 L11518.39,2471.7194 A0,0 0 0 0 11518.39,2471.7194" fill="#FFFFFF" style="stroke:#000000;stroke-width:1;"/><path d="M11915.6195,2471.7194 L11915.6195,2481.7194 L11925.6195,2481.7194 L11915.6195,2471.7194" fill="#FFFFFF" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="122.3574" x="11524.39" y="2488.7863">security boundary:</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="272.6128" x="11524.39" y="2503.9191">&#8226; web auth required for session bootstrap</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="386.2295" x="11524.39" y="2519.0519">&#8226; optional TLS (runtime.web.tls + runtime.tls cert material)</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="252.2813" x="11524.39" y="2534.1847">&#8226; X-Trust-Ide-Session required for calls</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="239.1543" x="11524.39" y="2549.3175">&#8226; writes allowed only in debug mode</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="311.416" x="11524.39" y="2564.4503">&#8226; optimistic conflict check via expected_version</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="262.2979" x="11524.39" y="2579.5831">&#8226; source scope limited to sources/**/*.st</text></g><g class="entity" data-qualified-name="hmiPkg.GMN176" data-source-line="333" id="ent0177"><path d="M11518.11,2025.5894 L11518.11,2080.9878 L11875.8913,2080.9878 L11875.8913,2035.5894 L11865.8913,2025.5894 L11518.11,2025.5894" fill="#FFFFFF" style="stroke:#000000;stroke-width:1;"