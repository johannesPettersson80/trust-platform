cing" textLength="239.1543" x="11912.39" y="2565.6075">&#8226; writes allowed only in debug mode</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="311.416" x="11912.39" y="2580.7403">&#8226; optimistic conflict check via expected_version</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="262.2979" x="11912.39" y="2595.8731">&#8226; source scope limited to sources/**/*.st</text></g><g class="entity" data-qualified-name="hmiPkg.GMN183" data-source-line="341" id="ent0184"><path d="M13708.11,2041.8794 L13708.11,2097.2778 L14065.8913,2097.2778 L14065.8913,2051.8794 L14055.8913,2041.8794 L13708.11,2041.8794" fill="#FFFFFF" style="stroke:#000000;stroke-width:1;"/><path d="M14055.8913,2041.8794 L14055.8913,2051.8794 L14065.8913,2051.8794 L14055.8913,2041.8794" fill="#FFFFFF" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="161.5352" x="13714.11" y="2058.9463">web transport boundary:</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="306.2744" x="13714.11" y="2074.0791">&#8226; accept loop + HTTP lifecycle in web/server.rs</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="336.7813" x="13714.11" y="2089.2119">&#8226; route handlers split by concern in web/*_routes.rs</text></g><g class="entity" data-qualified-name="hmiPkg.GMN186" data-source-line="347" id="ent0187"><path d="M9075.81,1307.0094 L9075.81,1528.8688 L9352.1826,1528.8688 L9352.1826,1317.0094 L9342.1826,1307.0094 L9075.81,1307.0094" fill="#FFFFFF" style="stroke:#000000;stroke-width:1;"/><path d="M9342.1826,1307.0094 L9342.1826,1317.0094 L9352.1826,1317.0094 L9342.1826,1307.0094" fill="#FFFFFF" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="178.3945" x="9081.8