3" height="2" style="stroke:#000000;stroke-width:1;" width="4" x="4382.2613" y="938.0694"/><rect fill="#F5DEB3" height="2" style="stroke:#000000;stroke-width:1;" width="4" x="4382.2613" y="942.0694"/><text fill="#000000" font-family="Verdana" font-size="14" lengthAdjust="spacing" textLength="232.5313" x="4146.73" y="964.0645">HMI + Control/Debug + Historian</text></g><g class="entity" data-qualified-name="GMN113" data-source-line="141" id="ent0114"><path d="M4625.32,671.5394 L4625.32,757.2034 L4884.6745,757.2034 L4884.6745,681.5394 L4874.6745,671.5394 L4625.32,671.5394" fill="#FFFFFF" style="stroke:#000000;stroke-width:1;"/><path d="M4874.6745,671.5394 L4874.6745,681.5394 L4884.6745,681.5394 L4874.6745,671.5394" fill="#FFFFFF" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="164.5186" x="4631.32" y="688.6063">Scan-boundary invariant:</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="238.3545" x="4631.32" y="703.7391">the scan thread never performs ADS</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="195.5332" x="4631.32" y="718.8719">network I/O. It only copies the</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="222.8218" x="4631.32" y="734.0047">latest cache snapshot and queues</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="182.4126" x="4631.32" y="749.1375">write intents for the worker.</text></g><g class="entity" data-qualified-name="GMN116" data-source-line="149" id="ent0117"><path d="M3580.18,88.6394 L3580.18,119.9194 L3525.42,123.9194 L3580.18,127.9194 L3580.18,159.1706 A0,0 0 0 0 3580.18,159.1706 L3857.8221,159.1706 A0,0 0 0 0 3857.8221,159.1706 L3857.8221,98.6394 L3847.8221,88.6394 L3580.18,88.6394 A0,0 0 0 0 3580.18,88.6394" fill="#FFFFFF" style="stroke:#000000;stroke-width:1;"/><path d="M3847.8221,88.6394 L3847.8221,98.6394 L3857.8221,98.6394 L3847.8221,88.6394" fill="#FFFFFF" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="256.6421" x="3586.18" y="105.7063">Production-ready proof comes from the</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="226.7383" x="3586.18" y="120.8391">runtime-host Doctor plus deployed</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="220.8223" x="3586.18" y="135.9719">ADS status. Authoring-only laptop</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="204.2993" x="3586.18" y="151.1047">imports never earn that badge.</text></g><g class="entity" data-qualified-name="GMN119" data-source-line="156" id="ent0120"><path d="M4490.95,804.2394 L4490.95,874.7706 L4801.054,874.7706 L4801.054,814.2394 L4791.054,804.2394 L4490.95,804.2394" fill="#FFFFFF" style="stroke:#000000;stroke-width:1;"/><path d="M4791.054,804.2394 L4791.054,814.2394 L4801.054,814.2394 L4791.054,804.2394" fill="#FFFFFF" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="289.104" x="4496.95" y="821.3063">Linux behavior and remote Windows targets</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="270.8735" x="4496.95" y="836.4391">keep the direct backend. Same-computer</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="281.3472" x="4496.95" y="851.5719">Windows targets use the installed TwinCAT</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="278.3066" x="4496.95" y="866.7047">router for the complete AdsTransport flow.</text></g><g class="entity" data-qualified-name="GMN122" data-source-line="163" id="