<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Operator alarm handbook visual</title>
  <desc id="desc">Alarm workflow view showing active alarm, context check, acknowledge, procedure, and escalation.</desc>
  <defs>
    <style>
      .frame { fill: #fff7ed; stroke: #fed7aa; stroke-width: 2; }
      .panel { fill: #ffffff; stroke: #fdba74; stroke-width: 2; }
      .alarm { fill: #fee2e2; stroke: #dc2626; stroke-width: 2; }
      .step { fill: #fffbeb; stroke: #d97706; stroke-width: 2; }
      .done { fill: #dcfce7; stroke: #16a34a; stroke-width: 2; }
      .arrow { stroke: #c2410c; stroke-width: 5; fill: none; marker-end: url(#arrow); }
      .title { fill: #7c2d12; font: 700 30px system-ui, sans-serif; }
      .body { fill: #431407; font: 19px system-ui, sans-serif; }
      .small { fill: #9a3412; font: 15px system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0 L12 6 L0 12 z" fill="#c2410c"/>
    </marker>
  </defs>
  <rect class="frame" x="24" y="24" width="1152" height="632" rx="18"/>
  <text class="title" x="70" y="90">Alarm response: context before acknowledge</text>

  <rect class="alarm" x="70" y="145" width="250" height="120" rx="12"/>
  <text class="title" x="105" y="195">Active alarm</text>
  <text class="body" x="105" y="230">HighPressureAlarm</text>

  <path class="arrow" d="M320 205 L405 205"/>
  <rect class="step" x="420" y="145" width="250" height="120" rx="12"/>
  <text class="title" x="455" y="195">Check context</text>
  <text class="body" x="455" y="230">trend, HMI, field state</text>

  <path class="arrow" d="M670 205 L755 205"/>
  <rect class="step" x="770" y="145" width="280" height="120" rx="12"/>
  <text class="title" x="805" y="195">Acknowledge</text>
  <text class="body" x="805" y="230">only after operator sees it</text>

  <rect class="panel" x="150" y="350" width="390" height="170" rx="12"/>
  <text class="title" x="185" y="398">Record</text>
  <text class="body" x="185" y="438">alarm code, time, action</text>
  <text class="body" x="185" y="475">condition cleared or not</text>

  <rect class="panel" x="660" y="350" width="390" height="170" rx="12"/>
  <text class="title" x="695" y="398">Escalate</text>
  <text class="body" x="695" y="438">safety boundary, repeated alarm,</text>
  <text class="body" x="695" y="475">or screen and field mismatch</text>

  <path class="arrow" d="M910 265 C910 310, 830 330, 775 350"/>
  <path class="arrow" d="M545 265 C545 310, 400 320, 345 350"/>
  <text class="small" x="70" y="600">Acknowledge is a workflow record. It does not prove the process condition is gone.</text>
</svg>
