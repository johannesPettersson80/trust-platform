<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Operator guide workflow</title>
  <desc id="desc">A generic operator workflow from HMI URL to status check, alarm check, process context, and handover record.</desc>
  <defs>
    <style>
      .bg { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 2; }
      .node { fill: #ffffff; stroke: #0f766e; stroke-width: 2; }
      .stop { fill: #fee2e2; stroke: #dc2626; stroke-width: 2; }
      .arrow { stroke: #0f766e; stroke-width: 5; fill: none; marker-end: url(#arrow); }
      .title { fill: #0f172a; font: 700 30px system-ui, sans-serif; }
      .body { fill: #334155; font: 19px system-ui, sans-serif; }
      .small { fill: #475569; font: 15px system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0 L12 6 L0 12 z" fill="#0f766e"/>
    </marker>
  </defs>
  <rect class="bg" x="24" y="24" width="1152" height="632" rx="18"/>
  <text class="title" x="70" y="92">Operator workflow: inspect before action</text>

  <rect class="node" x="70" y="175" width="220" height="110" rx="14"/>
  <text class="title" x="108" y="222">Open /hmi</text>
  <text class="body" x="108" y="256">use approved URL</text>

  <path class="arrow" d="M290 230 L380 230"/>
  <rect class="node" x="395" y="175" width="240" height="110" rx="14"/>
  <text class="title" x="430" y="222">Check status</text>
  <text class="body" x="430" y="256">connection, freshness</text>

  <path class="arrow" d="M635 230 L725 230"/>
  <rect class="node" x="740" y="175" width="260" height="110" rx="14"/>
  <text class="title" x="775" y="222">Check alarms</text>
  <text class="body" x="775" y="256">context before ack</text>

  <path class="arrow" d="M870 285 C870 335, 790 352, 710 365"/>
  <rect class="node" x="470" y="365" width="260" height="110" rx="14"/>
  <text class="title" x="505" y="412">Compare state</text>
  <text class="body" x="505" y="446">HMI, trend, field</text>

  <path class="arrow" d="M470 420 C380 410, 310 390, 255 360"/>
  <rect class="stop" x="70" y="340" width="240" height="125" rx="14"/>
  <text class="title" x="105" y="388">Do not edit</text>
  <text class="body" x="105" y="422">operator sessions are</text>
  <text class="body" x="105" y="452">not authoring sessions</text>

  <path class="arrow" d="M730 420 L820 420"/>
  <rect class="node" x="835" y="365" width="260" height="110" rx="14"/>
  <text class="title" x="870" y="412">Record handover</text>
  <text class="body" x="870" y="446">owner and next action</text>

  <text class="small" x="70" y="590">The generic docs show the sequence; the site runbook owns URLs, contacts, and permitted actions.</text>
</svg>
