<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Operator shift handover visual</title>
  <desc id="desc">A handover board listing active alarms, unusual values, temporary modes, manual interventions, and open actions.</desc>
  <defs>
    <style>
      .frame { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 2; }
      .header { fill: #0f766e; }
      .row { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; }
      .tag { fill: #ccfbf1; stroke: #0f766e; stroke-width: 1.5; }
      .title { fill: #0f172a; font: 700 30px system-ui, sans-serif; }
      .body { fill: #334155; font: 19px system-ui, sans-serif; }
      .small { fill: #475569; font: 15px system-ui, sans-serif; }
      .white { fill: #ffffff; font: 700 22px system-ui, sans-serif; }
    </style>
  </defs>
  <rect class="frame" x="24" y="24" width="1152" height="632" rx="18"/>
  <rect class="header" x="24" y="24" width="1152" height="78" rx="18"/>
  <text class="white" x="64" y="73">Shift handover board</text>

  <text class="title" x="70" y="155">Do not leave state in someone's memory</text>
  <text class="body" x="70" y="190">The next shift needs exact state, owner, and next action.</text>

  <rect class="row" x="70" y="235" width="1060" height="70" rx="10"/>
  <rect class="tag" x="95" y="255" width="150" height="30" rx="15"/>
  <text class="small" x="170" y="276" text-anchor="middle">Active alarms</text>
  <text class="body" x="275" y="278">name/code, first seen time, acknowledged status</text>

  <rect class="row" x="70" y="320" width="1060" height="70" rx="10"/>
  <rect class="tag" x="95" y="340" width="170" height="30" rx="15"/>
  <text class="small" x="180" y="361" text-anchor="middle">Unusual values</text>
  <text class="body" x="295" y="363">tag, current value, expected range, last stable time</text>

  <rect class="row" x="70" y="405" width="1060" height="70" rx="10"/>
  <rect class="tag" x="95" y="425" width="170" height="30" rx="15"/>
  <text class="small" x="180" y="446" text-anchor="middle">Temporary modes</text>
  <text class="body" x="295" y="448">bypass, maintenance mode, force, or blocked equipment</text>

  <rect class="row" x="70" y="490" width="1060" height="70" rx="10"/>
  <rect class="tag" x="95" y="510" width="155" height="30" rx="15"/>
  <text class="small" x="172" y="531" text-anchor="middle">Open actions</text>
  <text class="body" x="280" y="533">owner, deadline, expected closeout proof</text>

  <text class="small" x="70" y="610">Use with the alarm handbook and daily checks; replace generic contact fields with local runbook owners.</text>
</svg>
