[package]
name = "trust-stm32u5a9"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false
license = "MIT OR Apache-2.0"

[workspace]
resolver = "3"

[dependencies]
# The chip adapter (clock, pins, reset record, watchdog, GPIO, USB control link, wait) and the shared
# measurement crate, which the adapter's memory map and the stack window come from (design §6.2).
trust-platform-stm32u5 = { path = "../../crates/trust-platform-stm32u5" }
trust-platform-memory = { path = "../../crates/trust-platform-memory" }
# The shared single-thread resource loop, container admission and the compiled cycle (specification
# 34, specification 44).
trust-runtime-core = { path = "../../crates/trust-runtime-core", default-features = false }
trust-runtime-services = { path = "../../crates/trust-runtime-services" }
# The kernel interface: the chip calls a compiled program's module where its image lies in the
# internal flash (specification 44 §10.3).
trust-plc-abi = { path = "../../crates/trust-plc-abi" }
# The PAC names the peripherals the boot takes; the adapter uses the same PAC instance.
stm32u5 = { version = "=0.16.0", default-features = false, features = ["stm32u5a9", "rt"] }
cortex-m = { version = "=0.7.9", features = ["critical-section-single-core"] }
cortex-m-rt = { version = "=0.7.7", features = ["set-sp", "set-vtor"] }
smol_str = { version = "0.3.6", default-features = false }
serde_json = { version = "1.0.152", default-features = false, features = ["alloc"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
debug = 1
panic = "abort"
overflow-checks = true

# The signature check of a program image hashes the image and does Ed25519's curve arithmetic
# (specification 44 §5.11): those crates are built for speed, the rest of the firmware for size.
[profile.release.package.sha2]
opt-level = 3

[profile.release.package.curve25519-dalek]
opt-level = 3

[profile.release.package.ed25519-dalek]
opt-level = 3

[profile.dev]
panic = "abort"
