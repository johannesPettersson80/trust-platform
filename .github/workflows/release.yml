name: Release
# Specification 24, "Release rehearsal on pull requests" and "Release after main CI". The plan job
# decides what a run does: a pull request that changes the workspace version rehearses the release
# on its head, and a manual run rehearses the commit it runs on; both build, test and run every
# Publish script and publish nothing. After main's CI passed for a push, the commit it checked is
# released when its version has no complete release yet: the tag, the GitHub release and the
# Marketplace follow the builds and tests, and nobody pushes a tag. Every job checks out the plan's
# commit, never the branch's newest one.
run-name: >-
  ${{ github.event_name == 'workflow_run'
  && format('Release after CI of {0}', github.event.workflow_run.head_sha)
  || (github.event_name == 'pull_request'
  && format('Release rehearsal of #{0}', github.event.pull_request.number)
  || format('Release rehearsal of {0}', github.ref_name)) }}

on:
  pull_request:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

# A new push to a pull request replaces its rehearsal; releases from main run one at a time.
concurrency:
  group: >-
    ${{ github.event_name == 'pull_request'
    && format('release-pr-{0}', github.event.pull_request.number)
    || (github.event_name == 'workflow_run' && 'release-main' || format('release-dispatch-{0}', github.ref)) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # GitHub runners do not guarantee sccache availability; disable wrapper in CI/release.
  RUSTC_WRAPPER: ""

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      sha: ${{ steps.plan.outputs.sha }}
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
    steps:
      # The plan never runs a fork's code. It runs the workflow's own commit, which after main's CI is
      # main's and for a pull request from this repository is its merge commit, and reads the commit
      # it plans for as data. A fork's pull request runs its base, whose planner skips it without
      # reading it. The checkout keeps no credentials, and only the run after main's CI, which asks
      # GitHub whether a release is complete, gets the token.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && github.event.pull_request.base.sha || github.sha }}
          persist-credentials: false

      - name: Plan the run
        id: plan
        env:
          GITHUB_TOKEN: ${{ github.event_name == 'workflow_run' && github.token || '' }}
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_EVENT: ${{ github.event.workflow_run.event }}
          RUN_BRANCH: ${{ github.event.workflow_run.head_branch }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_HEAD_REPOSITORY: ${{ github.event.workflow_run.head_repository.full_name }}
        run: |
          python3 scripts/release_plan.py \
            --event "${EVENT}" \
            --repository "${GITHUB_REPOSITORY}" \
            --official johannesPettersson80/trust-platform \
            --pr-base "${PR_BASE}" \
            --pr-head "${PR_HEAD}" \
            --pr-head-repository "${PR_HEAD_REPOSITORY}" \
            --run-conclusion "${RUN_CONCLUSION}" \
            --run-event "${RUN_EVENT}" \
            --run-branch "${RUN_BRANCH}" \
            --run-sha "${RUN_SHA}" \
            --run-head-repository "${RUN_HEAD_REPOSITORY}" \
            --dispatch-sha "${GITHUB_SHA}"

  release-preflight:
    name: Release Preflight
    needs: plan
    if: ${{ needs.plan.outputs.mode != 'skip' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.sha }}
          fetch-depth: 0

      - name: Checkout OpenOT reference sibling
        shell: bash
        working-directory: ${{ github.workspace }}
        run: bash scripts/checkout_openot_ref.sh

      - name: Validate workspace/extension version alignment
        run: python3 scripts/check_release_version_alignment.py

      - name: Validate owned dependency exception lifetimes
        run: python3 scripts/check_dependency_exceptions.py

      - name: Validate release tag
        if: ${{ needs.plan.outputs.mode == 'release' }}
        env:
          RELEASE_TAG: ${{ needs.plan.outputs.tag }}
        run: python3 scripts/check_release_tag_preflight.py --tag "${RELEASE_TAG}"

      - name: Require the Marketplace token
        # A release publishes every target to the Marketplace; without the token it fails here,
        # before any tag or release exists.
        if: ${{ needs.plan.outputs.mode == 'release' }}
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ -z "${VSCE_PAT}" ]; then
            echo "::error::VSCE_PAT is not set, so the release cannot publish to the Marketplace."
            exit 1
          fi

  runtime-vm-validation:
    name: Runtime Validation
    needs: [plan, release-preflight]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.sha }}

      - name: Checkout OpenOT reference sibling
        shell: bash
        working-directory: ${{ github.workspace }}
        run: bash scripts/checkout_openot_ref.sh

      - uses: dtolnay/rust-toolchain@1.99.0

      - uses: Swatinem/rust-cache@v2

      - name: Toolchain for compiled programs (specification 44 §4.6)
        shell: bash
        run: |
          set -euo pipefail
          rustup target add riscv32imac-unknown-none-elf thumbv8m.main-none-eabihf \
            x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu
          bash scripts/native/build_toolchain_libraries.sh "${RUNNER_TEMP}/trust-toolchain"
          echo "TRUST_TOOLCHAIN=${RUNNER_TEMP}/trust-toolchain" >> "${GITHUB_ENV}"

      - name: Run the full scan benchmark gate
        run: |
          OUT_DIR=artifacts/release/runtime-vm-bench \
          TRUST_VM_BENCH_PROFILE=full \
          TRUST_VM_BENCH_TIER=default \
          TRUST_VM_BENCH_HOST_CODEGEN=generic \
          ./scripts/runtime_vm_bench_gate.sh

      - name: Run the runtime determinism and reliability gate
        run: |
          OUT_DIR=artifacts/release/runtime-vm-determinism \
          TRUST_VM_DETERMINISM_ITERATIONS=3 \
          TRUST_VM_DETERMINISM_TEST_THREADS=1 \
          ./scripts/runtime_vm_determinism_reliability_gate.sh

      - name: Run release conformance suite
        run: |
          mkdir -p conformance-artifacts
          cargo run -p trust-runtime --bin trust-runtime -- \
            conformance \
            --suite-root conformance \
            --output conformance-artifacts/conformance-pass-1.json

      - name: Validate and render conformance result
        run: |
          python3 scripts/validate_conformance_summary_schema.py \
            --schema conformance/schemas/summary-v1.schema.json \
            --schema conformance/schemas/summary-v2.schema.json \
            --summary conformance-artifacts/conformance-pass-1.json
          python3 scripts/render_conformance_summary.py \
            --input conformance-artifacts/conformance-pass-1.json \
            --output conformance-artifacts/conformance-pass-1.md

      - name: Upload release conformance result
        uses: actions/upload-artifact@v7
        with:
          name: release-conformance
          path: conformance-artifacts/

      - name: Upload runtime VM validation artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: release-runtime-vm-validation
          path: |
            artifacts/release/runtime-vm-bench/**
            artifacts/release/runtime-vm-determinism/**

  openot-real-databases:
    name: OpenOT Real Database Matrix
    needs: [plan, release-preflight]
    uses: ./.github/workflows/openot-real-databases.yml
    with:
      ref: ${{ needs.plan.outputs.sha }}
    secrets: inherit

  toolchain-bundle:
    # The toolchain bundle of each platform (specification 44 §4.6), written on that platform with
    # its own trust-runtime from rustup's pinned release and the program libraries.
    name: Toolchain bundle (${{ matrix.platform }})
    needs: [plan, release-preflight]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x64
          - os: ubuntu-24.04-arm
            platform: linux-arm64
          - os: macos-15-intel
            platform: darwin-x64
          - os: macos-latest
            platform: darwin-arm64
          - os: windows-latest
            platform: win32-x64
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.sha }}

      - name: Checkout OpenOT reference sibling
        shell: bash
        working-directory: ${{ github.workspace }}
        run: bash scripts/checkout_openot_ref.sh

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.99.0
        with:
          targets: riscv32imac-unknown-none-elf,thumbv8m.main-none-eabihf,x86_64-unknown-linux-gnu,aarch64-unknown-linux-gnu

      - name: Install Windows vendored OpenSSL Perl prerequisites
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          choco install strawberryperl -y --no-progress
          "C:\Strawberry\perl\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "PERL=C:\Strawberry\perl\bin\perl.exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Write the bundle
        shell: bash
        run: |
          set -euo pipefail
          folder="${RUNNER_TEMP}/trust-toolchain"
          bash scripts/native/build_toolchain_libraries.sh "${folder}"
          cargo build --locked --release -p trust-runtime --bin trust-runtime
          mkdir -p toolchain-artifacts
          archive="toolchain-artifacts/trust-toolchain-${{ matrix.platform }}.tar.gz"
          target/release/trust-runtime toolchain bundle "${folder}" "${archive}"
          # The bundle installs as a user's would.
          target/release/trust-runtime toolchain install --from "${archive}"
          ls -l toolchain-artifacts

      - name: Upload toolchain bundle
        uses: actions/upload-artifact@v7
        with:
          name: toolchain-${{ matrix.platform }}
          path: toolchain-artifacts/*.tar.gz

  build:
    name: Build (${{ matrix.target }})
    # The extension carries its platform's toolchain bundle (specification 44 §4.6).
    needs: [plan, release-preflight, toolchain-bundle]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            platform: linux-x64
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            platform: linux-arm64
            cross: true
          - os: macos-latest
            target: x86_64-apple-darwin
            platform: darwin-x64
          - os: macos-latest
            target: aarch64-apple-darwin
            platform: darwin-arm64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: win32-x64

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.sha }}

      - name: Checkout OpenOT reference sibling
        shell: bash
        working-directory: ${{ github.workspace }}
        run: bash scripts/checkout_openot_ref.sh

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.99.0
        with:
          targets: ${{ matrix.target }}

      - name: Install cross (for cross-compilation)
        if: matrix.cross
        run: cargo install cross --version 0.2.5 --locked

      - name: Install Windows vendored OpenSSL Perl prerequisites
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          choco install strawberryperl -y --no-progress
          "C:\Strawberry\perl\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "PERL=C:\Strawberry\perl\bin\perl.exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build binaries
        run: |
          if [ "${{ matrix.cross }}" = "true" ]; then
            CROSS_CONTAINER_OPTS="--env RUSTC_WRAPPER=" \
              cross build --release --target ${{ matrix.target }} -p trust-lsp -p trust-debug -p trust-runtime -p trust-dev -p trust-control-studio
          else
            cargo build --release --target ${{ matrix.target }} -p trust-lsp -p trust-debug -p trust-runtime -p trust-dev -p trust-control-studio
          fi
        shell: bash

      - name: Prepare extension binaries (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p editors/vscode/bin
          cp target/${{ matrix.target }}/release/trust-lsp editors/vscode/bin/
          cp target/${{ matrix.target }}/release/trust-debug editors/vscode/bin/
          cp target/${{ matrix.target }}/release/trust-runtime editors/vscode/bin/
          cp target/${{ matrix.target }}/release/trust-control-studio editors/vscode/bin/
          cp target/${{ matrix.target }}/release/trust-dev editors/vscode/bin/
          chmod +x editors/vscode/bin/*

      - name: Prepare extension binaries (Windows)
        if: runner.os == 'Windows'
        run: |
          mkdir -p editors/vscode/bin
          cp target/${{ matrix.target }}/release/trust-lsp.exe editors/vscode/bin/
          cp target/${{ matrix.target }}/release/trust-debug.exe editors/vscode/bin/
          cp target/${{ matrix.target }}/release/trust-runtime.exe editors/vscode/bin/
          cp target/${{ matrix.target }}/release/trust-control-studio.exe editors/vscode/bin/
          cp target/${{ matrix.target }}/release/trust-dev.exe editors/vscode/bin/
        shell: bash

      - name: Package runtime (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist/runtime-${{ matrix.platform }}
          cp target/${{ matrix.target }}/release/trust-runtime dist/runtime-${{ matrix.platform }}/
          cp target/${{ matrix.target }}/release/trust-dev dist/runtime-${{ matrix.platform }}/
          cp target/${{ matrix.target }}/release/trust-bundle-gen dist/runtime-${{ matrix.platform }}/
          cp docs/deploy/INSTALL.md dist/runtime-${{ matrix.platform }}/
          cp docs/deploy/systemd/trust-runtime.service dist/runtime-${{ matrix.platform }}/
          cat > dist/runtime-${{ matrix.platform }}/README.txt <<'README'
          truST Runtime

          This bundle contains the trust-runtime, trust-dev, and trust-bundle-gen binaries.

          Quick start:
          - Put trust-runtime, trust-dev, and trust-bundle-gen on your PATH
          - Run: trust-runtime --project <your-project>

          See INSTALL.md for full setup details.
          README
          tar -czf trust-runtime-${{ matrix.platform }}.tar.gz -C dist/runtime-${{ matrix.platform }} .

      - name: Package trust-lsp (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist/trust-lsp-${{ matrix.platform }}
          cp target/${{ matrix.target }}/release/trust-lsp dist/trust-lsp-${{ matrix.platform }}/
          cat > dist/trust-lsp-${{ matrix.platform }}/README.txt <<'README'
          truST IEC 61131-3 Structured Text Language Server

          Put trust-lsp on your PATH and configure your editor for .st files.
          Claude Code users: install the trust-st-lsp plugin from
          https://github.com/johannesPettersson80/trust-claude-plugins
          README
          tar -czf trust-lsp-${{ matrix.platform }}.tar.gz -C dist/trust-lsp-${{ matrix.platform }} .

      - name: Package runtime (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist\runtime-${{ matrix.platform }} | Out-Null
          Copy-Item target/${{ matrix.target }}/release/trust-runtime.exe dist/runtime-${{ matrix.platform }}/
          Copy-Item target/${{ matrix.target }}/release/trust-dev.exe dist/runtime-${{ matrix.platform }}/
          Copy-Item target/${{ matrix.target }}/release/trust-bundle-gen.exe dist/runtime-${{ matrix.platform }}/
          Copy-Item docs/deploy/INSTALL.md dist/runtime-${{ matrix.platform }}/
          Copy-Item docs/deploy/systemd/trust-runtime.service dist/runtime-${{ matrix.platform }}/
          @'
          truST Runtime

          This bundle contains the trust-runtime, trust-dev, and trust-bundle-gen binaries.

          Quick start:
          - Put trust-runtime.exe, trust-dev.exe, and trust-bundle-gen.exe on your PATH
          - Run: trust-runtime --project <your-project>

          See INSTALL.md for full setup details.
          '@ | Set-Content -Path dist/runtime-${{ matrix.platform }}/README.txt
          Compress-Archive -Path dist/runtime-${{ matrix.platform }}/* -DestinationPath trust-runtime-${{ matrix.platform }}.zip

      - name: Package trust-lsp (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist\trust-lsp-${{ matrix.platform }} | Out-Null
          Copy-Item target/${{ matrix.target }}/release/trust-lsp.exe dist/trust-lsp-${{ matrix.platform }}/
          @'
          truST IEC 61131-3 Structured Text Language Server

          Put trust-lsp.exe on your PATH and configure your editor for .st files.
          Claude Code users: install the trust-st-lsp plugin from
          https://github.com/johannesPettersson80/trust-claude-plugins
          '@ | Set-Content -Path dist/trust-lsp-${{ matrix.platform }}/README.txt
          Compress-Archive -Path dist/trust-lsp-${{ matrix.platform }}/* -DestinationPath trust-lsp-${{ matrix.platform }}.zip

      - name: Carry the toolchain bundle (specification 44 §4.6)
        uses: actions/download-artifact@v8
        with:
          name: toolchain-${{ matrix.platform }}
          path: editors/vscode/bin

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24.21.0"
          cache: 'npm'
          cache-dependency-path: editors/vscode/package-lock.json

      - name: Install wasm-pack
        shell: bash
        run: |
          cargo install wasm-pack --version 0.15.0 --locked --force
          export PATH="$HOME/.cargo/bin:$PATH"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          wasm-pack --version

      - name: Install dependencies
        working-directory: editors/vscode
        run: npm ci

      - name: Audit VS Code dependency lockfile
        working-directory: editors/vscode
        run: npm audit --audit-level=low

      - name: Compile extension
        working-directory: editors/vscode
        run: npm run compile

      - name: Package extension
        working-directory: editors/vscode
        run: npx --no-install vsce package --target ${{ matrix.platform }}

      - name: Check the extension carries the toolchain bundle
        shell: bash
        working-directory: editors/vscode
        run: |
          set -euo pipefail
          python=$(command -v python3 || command -v python)
          "$python" - "${{ matrix.platform }}" <<'PY'
          import glob
          import sys
          import zipfile

          platform = sys.argv[1]
          [vsix] = glob.glob("*.vsix")
          wanted = f"extension/bin/trust-toolchain-{platform}.tar.gz"
          if wanted not in zipfile.ZipFile(vsix).namelist():
              sys.exit(f"{vsix} does not carry {wanted}")
          print(f"{vsix} carries {wanted}")
          PY

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v7
        with:
          name: vsix-${{ matrix.platform }}
          path: editors/vscode/*.vsix

      - name: Upload runtime artifact
        uses: actions/upload-artifact@v7
        with:
          name: runtime-${{ matrix.platform }}
          path: |
            trust-runtime-${{ matrix.platform }}.tar.gz
            trust-runtime-${{ matrix.platform }}.zip

      - name: Upload trust-lsp artifact
        uses: actions/upload-artifact@v7
        with:
          name: trust-lsp-${{ matrix.platform }}
          path: |
            trust-lsp-${{ matrix.platform }}.tar.gz
            trust-lsp-${{ matrix.platform }}.zip

  publish:
    name: Publish
    needs: [plan, release-preflight, build, toolchain-bundle, runtime-vm-validation, openot-real-databases]
    runs-on: ubuntu-latest
    # The Marketplace wait of the verification is at most an hour.
    timeout-minutes: 120
    permissions:
      contents: write
      actions: read
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
      RELEASE_SHA: ${{ needs.plan.outputs.sha }}
      RELEASE_TAG: ${{ needs.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.sha }}
          fetch-depth: 0

      - name: Download VSIX artifacts
        uses: actions/download-artifact@v8
        with:
          path: vsix-artifacts
          pattern: vsix-*
          merge-multiple: true

      - name: Download runtime artifacts
        uses: actions/download-artifact@v8
        with:
          path: runtime-artifacts
          pattern: runtime-*
          merge-multiple: true

      - name: Download trust-lsp artifacts
        uses: actions/download-artifact@v8
        with:
          path: trust-lsp-artifacts
          pattern: trust-lsp-*
          merge-multiple: true

      - name: Download toolchain bundles
        uses: actions/download-artifact@v8
        with:
          path: toolchain-artifacts
          pattern: toolchain-*
          merge-multiple: true

      - name: Download release conformance artifact
        uses: actions/download-artifact@v8
        with:
          name: release-conformance
          path: conformance-artifacts

      - name: Generate result-derived conformance status
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-evidence
          python3 scripts/generate_conformance_status.py \
            --summary conformance-artifacts/conformance-pass-1.json \
            --known-gaps conformance/known-gaps.md \
            --commit "${RELEASE_SHA}" \
            --toolchain "$(rustc --version)" \
            --timestamp "$(date --iso-8601=seconds)" \
            --json-out release-evidence/conformance-status.json \
            --markdown-out release-evidence/conformance-status.md

      - name: Generate release artifact provenance
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/generate_release_provenance.py \
            --artifact-root vsix-artifacts \
            --artifact-root runtime-artifacts \
            --artifact-root trust-lsp-artifacts \
            --artifact-root toolchain-artifacts \
            --artifact-root release-evidence \
            --tag "${RELEASE_TAG}" \
            --commit "${RELEASE_SHA}" \
            --workflow-run-id "${GITHUB_RUN_ID}" \
            --workflow-run-url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --timestamp "$(date --iso-8601=seconds)" \
            --output release-evidence/release-provenance.json

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24.21.0"

      - name: Install vsce
        run: npm install -g @vscode/vsce@4.0.0

      - name: Generate release checksums
        shell: bash
        run: |
          set -euo pipefail
          find vsix-artifacts runtime-artifacts trust-lsp-artifacts toolchain-artifacts release-evidence -type f \
            \( -name '*.vsix' -o -name '*.tar.gz' -o -name '*.zip' \
              -o -name 'release-provenance.json' \
              -o -name 'conformance-status.json' \
              -o -name 'conformance-status.md' \) \
            -print0 | sort -z | xargs -0 sha256sum > release-evidence/SHA256SUMS
          cat release-evidence/SHA256SUMS

      - name: Generate release body from changelog
        run: |
          python3 scripts/extract_changelog_section.py \
            --section "${RELEASE_TAG#v}" \
            --title "${RELEASE_TAG}" \
            --output release-notes.md

      - name: Keep the rehearsal's release files
        if: ${{ needs.plan.outputs.mode == 'rehearsal' }}
        uses: actions/upload-artifact@v7
        with:
          name: release-rehearsal-${{ env.RELEASE_TAG }}
          path: |
            release-notes.md
            release-evidence/

      - name: Tag the release
        # An annotated tag on the released commit. A re-run of a release that stopped later finds
        # its tag on the same commit and continues.
        if: ${{ needs.plan.outputs.mode == 'release' }}
        shell: bash
        run: |
          set -euo pipefail
          peeled=$(git ls-remote --tags origin "refs/tags/${RELEASE_TAG}^{}" | cut -f1)
          if [ -n "${peeled}" ]; then
            if [ "${peeled}" != "${RELEASE_SHA}" ]; then
              echo "::error::${RELEASE_TAG} is on ${peeled}, not on the released commit ${RELEASE_SHA}."
              exit 1
            fi
            echo "${RELEASE_TAG} is already on ${RELEASE_SHA}"
            exit 0
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/${RELEASE_TAG}" > /dev/null; then
            echo "::error::${RELEASE_TAG} exists as a lightweight tag; a release tag is annotated."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${RELEASE_TAG}" -m "truST ${RELEASE_TAG}" "${RELEASE_SHA}"
          git push origin "refs/tags/${RELEASE_TAG}"

      - name: Create GitHub Release
        if: ${{ needs.plan.outputs.mode == 'release' }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ env.RELEASE_SHA }}
          name: ${{ env.RELEASE_TAG }}
          make_latest: 'true'
          fail_on_unmatched_files: true
          files: |
            vsix-artifacts/*.vsix
            runtime-artifacts/*.tar.gz
            runtime-artifacts/*.zip
            trust-lsp-artifacts/*.tar.gz
            trust-lsp-artifacts/*.zip
            toolchain-artifacts/*.tar.gz
            release-evidence/release-provenance.json
            release-evidence/conformance-status.json
            release-evidence/conformance-status.md
            release-evidence/SHA256SUMS
          body_path: release-notes.md

      - name: Publish to VS Code Marketplace
        if: ${{ needs.plan.outputs.mode == 'release' }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          vsix_files=(vsix-artifacts/*.vsix)
          if [ "${#vsix_files[@]}" -eq 0 ]; then
            echo "No VSIX artifacts found in vsix-artifacts/"
            exit 1
          fi

          max_attempts=4
          for vsix in "${vsix_files[@]}"; do
            attempt=1
            while [ "$attempt" -le "$max_attempts" ]; do
              echo "Publishing $vsix (attempt $attempt/$max_attempts)"
              output_file="$(mktemp)"
              if vsce publish --packagePath "$vsix" >"$output_file" 2>&1; then
                cat "$output_file"
                rm -f "$output_file"
                break
              fi

              exit_code=$?
              output="$(cat "$output_file")"
              cat "$output_file"
              rm -f "$output_file"

              if echo "$output" | grep -Eiq "already exists|already been published|already published"; then
                echo "VSIX already published for $vsix; treating as success."
                break
              fi

              if echo "$output" | grep -Eiq "Request timeout|ETIMEDOUT|ECONNRESET|socket hang up|ENOTFOUND|EAI_AGAIN|502|503|504"; then
                if [ "$attempt" -lt "$max_attempts" ]; then
                  sleep_seconds=$((attempt * 10))
                  echo "Transient publish failure for $vsix; retrying in ${sleep_seconds}s..."
                  sleep "$sleep_seconds"
                  attempt=$((attempt + 1))
                  continue
                fi
              fi

              echo "Failed to publish $vsix after $attempt attempt(s)."
              exit "$exit_code"
            done
          done

      - name: Verify the release
        # The annotated tag on the commit, the final release named Latest with its evidence, and the
        # Marketplace listing the version for every target within an hour (specification 24).
        if: ${{ needs.plan.outputs.mode == 'release' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/check_version_release_evidence.py \
            --repo "${GITHUB_REPOSITORY}" \
            --tag "${RELEASE_TAG}" \
            --sha "${RELEASE_SHA}"

  conclusion:
    # One result for the whole run: it fails when a job failed or was cancelled, and passes when
    # every job passed or the plan skipped it.
    name: Release Conclusion
    needs: [plan, release-preflight, runtime-vm-validation, openot-real-databases, toolchain-bundle, build, publish]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Every job passed or was skipped by the plan
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "${RESULTS}" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "${RESULTS}" | jq -e 'all(.[]; .result == "success" or .result == "skipped")' > /dev/null
