name: Docs Captures

# Every pull request starts this workflow; its `changes` job decides whether the captures must run,
# with one list of paths for pull requests and pushes to main (specification 22, "Pull-request
# checks and change detection").
on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * *"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTC_WRAPPER: ""

jobs:
  changes:
    name: Changes
    runs-on: ubuntu-latest
    outputs:
      relevant: ${{ steps.changes.outputs.relevant }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Compare the change with the capture paths
        id: changes
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 scripts/ci_changes.py --event "$EVENT" --base "$BASE" --head "$HEAD_SHA" --paths-file .github/paths/docs-captures.txt

  refresh:
    name: Refresh Automated Docs Captures
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Checkout OpenOT reference sibling
        shell: bash
        working-directory: ${{ github.workspace }}
        run: bash scripts/checkout_openot_ref.sh

      - uses: dtolnay/rust-toolchain@1.99.0

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12.15"

      - uses: actions/setup-node@v7
        with:
          node-version: "24.21.0"
          cache: "npm"
          cache-dependency-path: |
            editors/vscode/package-lock.json
            scripts/captures/package-lock.json

      - name: Verify capture process lifecycle
        run: python3 -m unittest scripts.tests.test_capture_lifecycle -v

      - name: Install capture dependencies
        run: |
          cargo install wasm-pack --version 0.15.0 --locked
          npm --prefix scripts/captures ci
          npm --prefix scripts/captures run capture:install

      - name: Toolchain for compiled programs (specification 44 §4.6)
        # The browser IDE and the terminal captures build Structured Text programs for this
        # computer. The job builds the toolchain itself: a version that is not yet published has
        # none to download (0.25.1's pull request, 28 October 2026).
        shell: bash
        run: |
          set -euo pipefail
          folder="${RUNNER_TEMP}/trust-toolchain"
          bash scripts/native/build_toolchain_libraries.sh "${folder}" x86_64-unknown-linux-gnu
          echo "TRUST_TOOLCHAIN=${folder}" >> "${GITHUB_ENV}"

      - name: Refresh browser captures
        run: |
          python scripts/generate_public_docs_media.py --regenerate-browser-captures

      - name: Refresh terminal captures
        run: |
          python scripts/generate_public_docs_media.py --regenerate-terminal-captures

      - name: Refresh code-server captures
        run: |
          python scripts/generate_public_docs_media.py --regenerate-vscode-captures

      - name: Verify docs assets still build
        run: |
          python scripts/generate_public_docs_media.py
          python scripts/check_public_docs_ia.py
          python scripts/check_public_docs_links.py
          python scripts/check_example_catalog_links.py
          python -m pip install --upgrade pip==26.2.1
          python -m pip install -r docs/requirements.txt
          python -m unittest scripts.tests.test_docs_captures_workflow scripts.tests.test_public_docs_ia -v
          mkdocs build --strict
          python scripts/check_public_docs_assets.py
          python scripts/check_public_docs_search.py

      - name: Upload refreshed captures
        uses: actions/upload-artifact@v7
        with:
          name: docs-captures
          path: |
            docs/public/assets/images/**/*.png
            docs/public/assets/images/**/*.gif

  create-refresh-pr:
    name: Create Capture Refresh PR
    needs: refresh
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7

      - name: Download refreshed captures
        uses: actions/download-artifact@v8
        with:
          name: docs-captures
          path: docs/public/assets/images

      - name: Create capture refresh PR
        continue-on-error: true
        uses: peter-evans/create-pull-request@v8
        with:
          branch: automation/docs-captures
          commit-message: "docs: refresh automated screenshots"
          title: "docs: refresh automated screenshots"
          body: |
            Automated Playwright/code-server screenshot refresh.

            Updated from:
            - `scripts/captures/browser/*.spec.mjs`
            - `scripts/captures/vscode/*.spec.mjs`
          add-paths: |
            docs/public/assets/images/**/*.png
            docs/public/assets/images/**/*.gif

  conclusion:
    name: Conclusion
    needs: [changes, refresh]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Every job succeeded or was skipped
        env:
          RESULTS: ${{ toJson(needs) }}
        run: jq --exit-status 'all(.result == "success" or .result == "skipped")' <<< "$RESULTS"
