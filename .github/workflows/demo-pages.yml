name: Docs Pages

# A pull request and a push to main start this workflow; its `changes` job decides whether the site
# must be built, comparing the whole change (specification 22, "Pull-request checks and change
# detection"). A pull request's run builds and checks the site as the deploy does and publishes
# nothing; a push to main deploys it. A Docs Captures run of main that rendered screenshots starts it
# too: the site is built with the newest screenshots of main, and nothing commits them
# (specification 22, "Docs Captures").
on:
  pull_request:
  push:
    branches: [main]
  workflow_run:
    workflows: [Docs Captures]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# Read-only for every job: a pull request's run executes the pull request's own scripts. Only the deploy, which no pull
# request runs, may write to Pages and request an OIDC token.
permissions:
  contents: read
  actions: read

concurrency:
  # A pull request's newer push cancels its older run; the deploys of main share one group, so a pull
  # request never cancels a deploy.
  group: ${{ github.event_name == 'pull_request' && format('docs-pages-pr-{0}', github.event.pull_request.number) || 'docs-pages' }}
  cancel-in-progress: true

jobs:
  changes:
    name: Changes
    # A Docs Captures run counts only when it passed and a push, the schedule or a dispatch started
    # it; a pull request's run never publishes anything.
    if: >-
      github.event_name != 'workflow_run'
      || (github.event.workflow_run.conclusion == 'success'
      && contains(fromJSON('["push", "schedule", "workflow_dispatch"]'), github.event.workflow_run.event))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      relevant: ${{ steps.captures.outputs.relevant || steps.changes.outputs.relevant }}
    steps:
      - uses: actions/checkout@v7
        if: github.event_name != 'workflow_run'
        with:
          fetch-depth: 0

      - name: Compare the change with the documentation paths
        if: github.event_name != 'workflow_run'
        id: changes
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 scripts/ci_changes.py --event "$EVENT" --base "$BASE" --head "$HEAD_SHA" --paths-file .github/paths/docs-pages.txt

      - name: Whether the Docs Captures run rendered screenshots
        # A run whose own change detection skipped the captures uploaded nothing new.
        if: github.event_name == 'workflow_run'
        id: captures
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          count=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/artifacts" \
            --jq '[.artifacts[] | select(.name == "docs-captures" and (.expired | not))] | length')
          echo "the run uploaded ${count} docs-captures artifact(s)"
          if [ "${count}" -gt 0 ]; then echo "relevant=true"; else echo "relevant=false"; fi >> "${GITHUB_OUTPUT}"

  build:
    name: Build Pages Artifact
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12.15"
      - name: Install docs toolchain
        run: |
          python -m pip install --upgrade pip==26.2.1
          python -m pip install -r docs/requirements.txt
      - name: Take the newest screenshots of main
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/docs_captures_artifact.py take --repo "${GITHUB_REPOSITORY}" --dest docs/public/assets/images
      - name: Generate docs media
        run: |
          python scripts/generate_public_docs_media.py
      - name: Check docs links
        run: |
          python scripts/check_public_docs_ia.py
          python scripts/check_public_docs_links.py
          python scripts/check_example_catalog_links.py
          python scripts/check_openot_database_examples.py
      - name: Build docs site
        run: |
          set -euo pipefail
          mkdocs build --strict
          python scripts/check_public_docs_assets.py
          python scripts/check_public_docs_search.py
          test -f site/public/index.html
          test -f site/public/start/agent-quickstart/index.html
          test -f site/public/connect/protocol-matrix/index.html
          test -f site/public/operate/compile-validate-reload/index.html
          test -f site/public/reference/agent-api/v1/index.html
          touch site/public/.nojekyll
      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request'
        with:
          path: site/public

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12.15"
      - uses: actions/configure-pages@v6
        with:
          enablement: true
      - id: deployment
        uses: actions/deploy-pages@v5
      - name: Verify deployed pages
        run: |
          python scripts/verify_public_docs_deploy.py --base-url "${{ steps.deployment.outputs.page_url }}"

  conclusion:
    name: Docs Pages Conclusion
    # A pull request's site check: it fails when the build or one of its checks failed.
    needs: [changes, build]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Every job succeeded or was skipped
        env:
          RESULTS: ${{ toJson(needs) }}
        run: jq --exit-status 'all(.result == "success" or .result == "skipped")' <<< "$RESULTS"
