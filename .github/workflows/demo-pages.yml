name: Docs Pages

# A push to main starts this workflow; its `changes` job decides whether the site must be built and
# deployed, comparing the whole push (specification 22, "Pull-request checks and change detection").
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: docs-pages
  cancel-in-progress: true

jobs:
  changes:
    name: Changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      relevant: ${{ steps.changes.outputs.relevant }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Compare the push with the documentation paths
        id: changes
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: python3 scripts/ci_changes.py --event "$EVENT" --base "$BASE" --head "$HEAD_SHA" --paths-file .github/paths/docs-pages.txt

  build:
    name: Build Pages Artifact
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12.15"
      - name: Install docs toolchain
        run: |
          python -m pip install --upgrade pip==26.2.1
          python -m pip install -r docs/requirements.txt
      - name: Generate docs media
        run: |
          python scripts/generate_public_docs_media.py
      - uses: actions/configure-pages@v6
        with:
          enablement: true
      - name: Check docs links
        run: |
          python scripts/check_public_docs_ia.py
          python scripts/check_public_docs_links.py
          python scripts/check_example_catalog_links.py
          python scripts/check_openot_database_examples.py
      - name: Build docs site
        run: |
          set -euo pipefail
          mkdocs build --strict
          python scripts/check_public_docs_assets.py
          python scripts/check_public_docs_search.py
          test -f site/public/index.html
          test -f site/public/start/agent-quickstart/index.html
          test -f site/public/connect/protocol-matrix/index.html
          test -f site/public/operate/compile-validate-reload/index.html
          test -f site/public/reference/agent-api/v1/index.html
          touch site/public/.nojekyll
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/public

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12.15"
      - id: deployment
        uses: actions/deploy-pages@v5
      - name: Verify deployed pages
        run: |
          python scripts/verify_public_docs_deploy.py --base-url "${{ steps.deployment.outputs.page_url }}"
