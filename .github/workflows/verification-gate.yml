name: Verification Gate

on:
  pull_request:
    branches: [master, main]
  merge_group:

# A new push to a pull request replaces the pull request's unfinished run; a merge group's run always
# finishes (specification 22). No scheduled run checks the verification records (specification 30,
# "Gate and workflow surface proof contract").
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  verification-report:
    name: Verification strict report
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Run PR verification report smoke
        shell: bash
        run: |
          set -euo pipefail
          BASE_SHA="${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}"
          python3 scripts/verification_report_gate.py \
            --base "${BASE_SHA}" \
            --head "${HEAD_SHA}" \
            --intent bugfix \
            --strict \
            --smoke \
            --out-dir target/gate-artifacts/verification
      - name: Add verification report summary
        if: ${{ always() }}
        shell: bash
        run: |
          if [[ -f target/gate-artifacts/verification/verification-gate-report.md ]]; then
            cat target/gate-artifacts/verification/verification-gate-report.md >> "${GITHUB_STEP_SUMMARY}"
          else
            echo "verification-gate-report.md was not produced." >> "${GITHUB_STEP_SUMMARY}"
          fi
      # The report's verdict is its step above; its files are evidence, tried twice, and a failed upload never fails
      # the job (G146; specification 22).
      - name: Upload verification report
        id: verification-report
        if: ${{ always() }}
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: verification-gate-report
          path: target/gate-artifacts/verification/
      - name: Upload verification report (second attempt)
        if: ${{ always() && steps.verification-report.outcome == 'failure' }}
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: verification-gate-report
          overwrite: true
          path: target/gate-artifacts/verification/
