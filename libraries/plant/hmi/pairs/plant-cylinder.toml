format = 1
title = "Cylinder"
block = "Plant.FB_Cylinder"
faceplate = "plant-cylinder"
symbol = "cylinder"

[bind]
open = "Extended"
fault = "Fault"
manual = "Manual"
"out-of-service" = "OutOfService"

[[settings]]
member = "DoubleActing"
title = "Double-acting"
key = true
help = "Retracts with its own solenoid; a single-acting cylinder retracts by spring."

[[settings]]
member = "HasExtendedSensor"
title = "Has extended sensor"
key = true

[[settings]]
member = "HasRetractedSensor"
title = "Has retracted sensor"
key = true

[[settings]]
member = "ExtendTimeout"
title = "Extend timeout"
unit = "s"
min = 0.1
max = 600
step = 0.1
key = true

[[settings]]
member = "RetractTimeout"
title = "Retract timeout"
unit = "s"
min = 0.1
max = 600
step = 0.1
key = true

[[io]]
member = "ExtendCommand"
title = "Extend solenoid"
direction = "output"

[[io]]
member = "RetractCommand"
title = "Retract solenoid"
direction = "output"
required_when = "DoubleActing"

[[io]]
member = "ExtendedSensor"
title = "Extended sensor"
direction = "input"
required_when = "HasExtendedSensor"

[[io]]
member = "RetractedSensor"
title = "Retracted sensor"
direction = "input"
required_when = "HasRetractedSensor"

[program]
position = "actuators"
