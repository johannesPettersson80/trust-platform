format = 1
title = "Analyzer"
block = "Plant.FB_AnalyzerInput"
faceplate = "plant-measurement"
symbol = "analyzer"

[bind]
value = "Value"
fault = "Fault"

[quality]
value = "Quality"

[[settings]]
member = "RangeLow"
title = "Range low"
unit = "$Unit"
key = true

[[settings]]
member = "RangeHigh"
title = "Range high"
unit = "$Unit"
key = true

[[settings]]
member = "FilterTime"
title = "Filter time"
unit = "s"
min = 0
max = 600
help = "0 switches the filter off."

[[settings]]
member = "HighHighEnabled"
title = "High-high alarm"

[[settings]]
member = "HighHighLimit"
title = "High-high limit"
unit = "$Unit"

[[settings]]
member = "HighEnabled"
title = "High alarm"

[[settings]]
member = "HighLimit"
title = "High limit"
unit = "$Unit"

[[settings]]
member = "LowEnabled"
title = "Low alarm"

[[settings]]
member = "LowLimit"
title = "Low limit"
unit = "$Unit"

[[settings]]
member = "LowLowEnabled"
title = "Low-low alarm"

[[settings]]
member = "LowLowLimit"
title = "Low-low limit"
unit = "$Unit"

[[settings]]
member = "Deadband"
title = "Alarm deadband"
unit = "$Unit"
min = 0

[[settings]]
member = "AlarmDelay"
title = "Alarm delay"
unit = "s"
min = 0
max = 600

[[settings]]
member = "RawLow"
title = "Signal at range low"
help = "In the channel's unit, for example 4 for 4 mA."

[[settings]]
member = "RawHigh"
title = "Signal at range high"
help = "In the channel's unit, for example 20 for 20 mA."

[[settings]]
member = "BadBelow"
title = "Signal fault below"

[[settings]]
member = "BadAbove"
title = "Signal fault above"

[[io]]
member = "Raw"
title = "Measurement"
direction = "input"

[[io]]
member = "SignalFault"
title = "Signal fault"
direction = "input"
required = false

[program]
position = "measurements"
