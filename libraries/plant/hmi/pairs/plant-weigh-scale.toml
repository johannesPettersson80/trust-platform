format = 1
title = "Weigh scale"
block = "Plant.FB_WeighScale"
faceplate = "plant-scale"
symbol = "weigh-scale"

[bind]
value = "Net"
fault = "Fault"

[quality]
value = "Quality"

[[settings]]
member = "RangeLow"
title = "Range low"
unit = "$Unit"
key = true

[[settings]]
member = "RangeHigh"
title = "Range high"
unit = "$Unit"
key = true

[[settings]]
member = "FilterTime"
title = "Filter time"
unit = "s"
min = 0
max = 600
help = "0 switches the filter off."

[[settings]]
member = "StableBand"
title = "Stable within"
unit = "$Unit"
min = 0
key = true

[[settings]]
member = "StableTime"
title = "Stable for"
unit = "s"
min = 0
max = 60

[[settings]]
member = "RawLow"
title = "Signal at range low"
help = "In the channel's unit, for example 4 for 4 mA."

[[settings]]
member = "RawHigh"
title = "Signal at range high"
help = "In the channel's unit, for example 20 for 20 mA."

[[settings]]
member = "BadBelow"
title = "Signal fault below"

[[settings]]
member = "BadAbove"
title = "Signal fault above"

[[io]]
member = "Raw"
title = "Measurement"
direction = "input"

[[io]]
member = "SignalFault"
title = "Signal fault"
direction = "input"
required = false

[program]
position = "measurements"

[program.initial]
Unit = "kg"
