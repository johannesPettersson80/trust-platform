format = 1
title = "Positioning equipment"
size = [608, 560]
pinnable = true
settings = true

[fields.Position]
accepts = ["number"]

[fields.ManualPosition]
accepts = ["number"]

[fields.PositionSetpoint]
accepts = ["number"]

[fields.MinPosition]
accepts = ["number"]

[fields.MaxPosition]
accepts = ["number"]

[fields.Deviating]
accepts = ["boolean"]

[fields.Mode]
accepts = ["enumeration"]

[fields.ReasonText]
accepts = ["text"]

[fields.Manual]
accepts = ["boolean"]

[fields.InService]
accepts = ["boolean"]

[fields.StartPermit]
accepts = ["boolean"]

[fields.CommandText]
accepts = ["text"]

[fields.OutOfService]
accepts = ["boolean"]

[[object]]
id = "deviation"
type = "status"
label = "Position deviation"
variant = "alarm"
at = [24, 24]
size = [272, 40]

[object.bind]
state = "$Deviating"

[[object]]
id = "interlocked"
type = "status"
label = "Out of service"
at = [312, 24]
size = [272, 40]

[object.bind]
state = "$OutOfService"

[[object]]
id = "mode"
type = "mode-selector"
options = ["Auto", "Manual"]
at = [24, 80]
size = [560, 48]

[object.bind]
mode = "$Mode"
interlock = "$InService"
"interlock-reason" = "$CommandText"

[object.command]
interface = "Plant.IDevice"
method = "SetMode"
instance = "$instance"

[object.command.arguments]
Value = { input = true }

[[object]]
id = "position"
type = "value"
label = "Position"
unit = "%"
decimals = 1
at = [24, 144]
size = [272, 80]

[object.bind]
value = "$Position"

[[object]]
id = "manual-position"
type = "setpoint"
label = "Manual position"
unit = "%"
at = [312, 144]
size = [272, 80]

[object.bind]
value = "$ManualPosition"
"low-limit" = "$MinPosition"
"high-limit" = "$MaxPosition"
interlock = "$StartPermit"
"interlock-reason" = "$CommandText"

[object.command]
interface = "Plant.IPositionDevice"
method = "SetPosition"
instance = "$instance"

[object.command.arguments]
Value = { input = true }

[[object]]
id = "reason"
type = "text"
variant = "caption"
at = [24, 232]
size = [560, 20]

[object.bind]
text = "$ReasonText"

[[object]]
id = "history"
type = "trend"
label = "Position"
at = [24, 260]
size = [560, 220]

[object.bind]
position = "$Position"
setpoint = "$PositionSetpoint"

[[object]]
id = "out-of-service"
type = "button"
text = "Out of service"
role = "engineer"
at = [24, 496]
size = [272, 40]

[object.bind]
interlock = "$InService"

[object.command]
interface = "Plant.IDevice"
method = "SetMode"
instance = "$instance"

[object.command.arguments]
Value = "OutOfService"

[[object]]
id = "return-to-service"
type = "button"
text = "Return to service"
role = "engineer"
at = [312, 496]
size = [272, 40]

[object.bind]
interlock = "$OutOfService"

[object.command]
interface = "Plant.IDevice"
method = "SetMode"
instance = "$instance"

[object.command.arguments]
Value = "Manual"
