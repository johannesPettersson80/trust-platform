[graph]
all-features = false

[advisories]
ignore = [
    { id = "RUSTSEC-2025-0009", reason = "owner=runtime/web; rationale=tiny_http 0.12 ssl-rustls pulls rustls 0.20/ring 0.16 for the existing HTTPS server and no tiny_http rustls 0.23 release is available; review=2026-04-29; removal=remove when HTTPS hosting moves off tiny_http ssl-rustls or tiny_http upgrades rustls" },
    { id = "RUSTSEC-2025-0010", reason = "owner=runtime/web; rationale=tiny_http 0.12 ssl-rustls pulls unmaintained ring 0.16 for the existing HTTPS server and no tiny_http rustls 0.23 release is available; review=2026-04-29; removal=remove when HTTPS hosting moves off tiny_http ssl-rustls or tiny_http upgrades rustls" },
    { id = "RUSTSEC-2023-0071", reason = "owner=runtime/mesh; rationale=zenoh 1.7.2 transport stack pulls rsa 0.9 and the pinned baseline is governed by the runtime mesh compatibility gate; review=2026-04-29; removal=remove when the Zenoh baseline gate moves to a patched transport stack" },
    { id = "RUSTSEC-2024-0336", reason = "owner=runtime/web; rationale=tiny_http 0.12 ssl-rustls pulls rustls 0.20 for the existing HTTPS server and no tiny_http rustls 0.23 release is available; review=2026-04-29; removal=remove when HTTPS hosting moves off tiny_http ssl-rustls or tiny_http upgrades rustls" },
    { id = "RUSTSEC-2025-0134", reason = "owner=runtime/web; rationale=rustls-pemfile is used by current TLS PEM parsing and tiny_http 0.12 ssl-rustls; review=2026-04-29; removal=replace direct parsing with rustls-pki-types PemObject and remove tiny_http ssl-rustls" },
    { id = "RUSTSEC-2024-0436", reason = "owner=runtime/ui+mesh; rationale=paste is transitive through ratatui and zenoh token-cell; review=2026-04-29; removal=remove when ratatui/zenoh transitive paths stop pulling paste" },
]

[licenses]
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "EPL-2.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "OpenSSL",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.8

[licenses.private]
ignore = false

[[licenses.clarify]]
crate = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [
    { path = "LICENSE", hash = 0xbd0eed23 },
]

[bans]
multiple-versions = "warn"
wildcards = "allow"
allow-workspace = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
