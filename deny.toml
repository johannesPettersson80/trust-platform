[graph]
all-features = false

[advisories]
ignore = [
    { id = "RUSTSEC-2024-0449", reason = "owner=runtime/opcua+mesh; rationale=RUSTSEC-2024-0449 is INFO unmaintained for unsafe-libyaml 0.2.11, reached through serde_yaml 0.9.34 by opcua 0.12.0, zenoh-config 1.7.2 and esp-config 0.8.0 (the ESP32-C6 firmware's build configuration); advisory reports no patched versions, this is maintenance risk only and not a CVE or a patched dependency (re-reviewed 2026-11-18: opcua 0.12.0 and unsafe-libyaml 0.2.11 are still the newest releases); review=2026-11-18; removal=delete this exception after both root and firmware graphs stop reaching unsafe-libyaml following a reviewed safe YAML migration and OPC UA plus Zenoh configuration parity suites pass; expires=2027-02-16" },
    { id = "RUSTSEC-2026-0110", reason = "owner=runtime/embedded; rationale=informational deprecation of bare-metal 0.2.5 required by the ARM-only Cortex-M 0.7 stack of the STM32U5A9 adapter and firmware, with no patched compatible release (re-reviewed 2026-11-18: cortex-m 0.7.10, the newest, still requires bare-metal ^0.2.4); review=2026-11-18; removal=migrate when the compatible Cortex-M dependency graph no longer requires bare-metal, recheck the advisory and both locked graphs before expiry; expires=2027-02-16" },
    { id = "RUSTSEC-2026-0592", reason = "owner=runtime/opcua; rationale=url 2.5.8 and earlier overflow the stack in Url::origin() on nested blob: URLs; the workspace's url 2.x is updated to 2.5.9, which fixes it, and the remaining url 1.7.2 is reached only through opcua 0.12.0, the OPC UA stack of the optional opcua-wire, whose url 1.x line has no fixed release; opcua 0.12.0 never calls Url::origin() (checked 2026-11-22: no origin() call in its sources), so the overflow cannot be reached through it, and a lock test keeps url 1.x reached through opcua only; the stack stays for the reason of RUSTSEC-2024-0421 (async-opcua takes rsa 0.9, checklist G212); review=2026-11-22; removal=remove when opcua-wire's OPC UA stack no longer depends on url 1.x and prove cargo tree -i url@1.7.2 no longer reaches trust-runtime; expires=2027-02-20" },
    { id = "RUSTSEC-2024-0421", reason = "owner=runtime/opcua; rationale=optional opcua-wire depends on opcua 0.12 -> url 1.7 -> idna 0.1 and the opcua crate has no newer patched release (re-reviewed 2026-11-21: opcua 0.12.0 is still the newest release. async-opcua 0.19.0, its maintained continuation and newest release, would remove idna but depends on rsa ^0.9, whose Marvin timing attack (RUSTSEC-2023-0071, a vulnerability) is fixed only in rsa 0.10, and would put that RSA in the OPC UA secure channel in place of the vendored OpenSSL, which mitigates the attack, so opcua-wire moves only once async-opcua takes rsa 0.10, checklist G212); review=2026-11-21; removal=migrate opcua-wire to a maintained OPC UA stack without a known RSA vulnerability (async-opcua once it depends on rsa >= 0.10) and prove cargo tree -i idna no longer reaches trust-runtime; expires=2027-02-16" },
    { id = "RUSTSEC-2024-0388", reason = "owner=runtime/opcua; rationale=optional opcua-wire depends on opcua 0.12 -> derivative 2.2 and the opcua crate has no newer patched release (re-reviewed 2026-11-21: opcua 0.12.0 is still the newest release. async-opcua 0.19.0, its maintained continuation and newest release, would remove derivative but depends on rsa ^0.9, whose Marvin timing attack (RUSTSEC-2023-0071, a vulnerability) is fixed only in rsa 0.10, and would put that RSA in the OPC UA secure channel in place of the vendored OpenSSL, which mitigates the attack, so opcua-wire moves only once async-opcua takes rsa 0.10, checklist G212); review=2026-11-21; removal=migrate opcua-wire to a maintained OPC UA stack without a known RSA vulnerability (async-opcua once it depends on rsa >= 0.10) and prove cargo tree -i derivative no longer reaches trust-runtime; expires=2027-02-16" },
    { id = "RUSTSEC-2025-0134", reason = "owner=runtime/persistence+mesh; rationale=rustls-pemfile is unmaintained (informational, no CVE). truST's own TLS PEM parsing and the vendored tiny_http (third_party/tiny_http) read PEM with rustls pki_types PemObject, and rustls-pemfile 2.2.0 is reached only through mysql 28.0.3 (OpenOT persistence) and zenoh-link-tls 1.7.2 (the mesh's TLS link), which have no release without it (re-reviewed 2026-11-18: mysql 28.0.4 still takes rustls-pemfile ^2.1 and zenoh-link-tls 1.10.2 ^2.2.0); review=2026-11-18; removal=remove when mysql and zenoh-link-tls stop pulling rustls-pemfile; expires=2027-02-16" },
    { id = "RUSTSEC-2026-0543", reason = "owner=runtime/opcua; rationale=chrono is unmaintained (informational, no CVE, all versions affected, no safe upgrade) and is reached only through opcua 0.12.0, the OPC UA stack of the optional opcua-wire, whose newest release is still 0.12.0 (re-reviewed 2026-11-21: async-opcua 0.19.0, the newest release of its maintained continuation, depends on chrono ^0.4 as well, so moving to it would keep chrono, checklist G212), and no crate of the workspace depends on chrono itself; review=2026-11-21; removal=remove when RustSec withdraws the advisory or opcua-wire's OPC UA stack no longer depends on chrono, and prove cargo tree -i chrono no longer reaches trust-runtime; expires=2027-02-15" },
    { id = "RUSTSEC-2026-0542", reason = "owner=runtime/mesh; rationale=humantime is unmaintained (informational, no CVE; all versions affected, no safe upgrade) and is reached only through uhlc 0.8.2, the hybrid logical clock of zenoh 1.7.2 (the mesh); the newest uhlc, 0.9.0, still depends on humantime, and zenoh 1.10.2 is the newest Zenoh (checked 2026-11-17); no crate of the workspace depends on humantime itself; review=2026-11-17; removal=remove when the Zenoh baseline moves to a release whose uhlc no longer pulls humantime; expires=2027-02-15" },
    { id = "RUSTSEC-2024-0436", reason = "owner=runtime/mesh; rationale=zenoh 1.7.2 still pulls paste through token-cell/zenoh-keyexpr even after narrowing features to the TCP transport and removing the rsa path (re-reviewed 2026-11-18: token-cell 4.0.0 no longer depends on paste, but zenoh-keyexpr 1.10.2, the newest, still takes token-cell ^2.0.0); review=2026-11-18; removal=remove when the Zenoh baseline moves to a version or patch stack that no longer pulls paste; expires=2027-02-16" },
]

[licenses]
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "EPL-2.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "OpenSSL",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.8

# LLVM's bundled libFuzzer requires NCSA alongside the Rust wrapper license.
# owner=verification/fuzz; review=2026-10-11; only the reviewed locked release.
# https://spdx.org/licenses/NCSA.html
[[licenses.exceptions]]
name = "libfuzzer-sys"
version = "=0.4.13"
allow = ["NCSA"]

[licenses.private]
ignore = false

[[licenses.clarify]]
crate = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [
    { path = "LICENSE", hash = 0xbd0eed23 },
]

[bans]
multiple-versions = "warn"
wildcards = "allow"
allow-workspace = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = ["https://github.com/johannesPettersson80/open-ot-experiments.git"]
