[graph]
all-features = false

[advisories]
ignore = [
    { id = "RUSTSEC-2024-0449", reason = "owner=runtime/opcua+mesh; rationale=RUSTSEC-2024-0449 is INFO unmaintained for unsafe-libyaml 0.2.11, reached through serde_yaml 0.9.34 by opcua 0.12.0 and zenoh-config 1.7.2; advisory reports no patched versions, this is maintenance risk only and not a CVE or a patched dependency; review=2026-10-13; removal=delete this exception after both root and firmware graphs stop reaching unsafe-libyaml following a reviewed safe YAML migration and OPC UA plus Zenoh configuration parity suites pass; expires=2027-01-11" },
    { id = "RUSTSEC-2026-0110", reason = "owner=runtime/embedded; rationale=informational deprecation of bare-metal 0.2.5 and 1.0.0 required by the ARM-only Cortex-M 0.7.9 and STM32F4 HAL 0.23 stack, with no patched compatible release; review=2026-10-10; removal=migrate when the compatible Cortex-M and HAL dependency graphs no longer require bare-metal, recheck the advisory and both locked graphs before expiry; expires=2027-01-08" },
    { id = "RUSTSEC-2024-0421", reason = "owner=runtime/opcua; rationale=optional opcua-wire depends on opcua 0.12 -> url 1.7 -> idna 0.1 and the opcua crate has no newer patched release; review=2026-08-20; removal=migrate opcua-wire to async-opcua or another maintained OPC UA stack and prove cargo tree -i idna no longer reaches trust-runtime; expires=2026-11-18" },
    { id = "RUSTSEC-2024-0388", reason = "owner=runtime/opcua; rationale=optional opcua-wire depends on opcua 0.12 -> derivative 2.2 and the opcua crate has no newer patched release; review=2026-08-20; removal=migrate opcua-wire to async-opcua or another maintained OPC UA stack and prove cargo tree -i derivative no longer reaches trust-runtime; expires=2026-11-18" },
    { id = "RUSTSEC-2025-0009", reason = "owner=runtime/web; rationale=tiny_http 0.12 ssl-rustls pulls rustls 0.20/ring 0.16 for the existing HTTPS server and no tiny_http rustls 0.23 release is available; review=2026-08-20; removal=remove when HTTPS hosting moves off tiny_http ssl-rustls or tiny_http upgrades rustls; expires=2026-11-18" },
    { id = "RUSTSEC-2025-0010", reason = "owner=runtime/web; rationale=tiny_http 0.12 ssl-rustls pulls unmaintained ring 0.16 for the existing HTTPS server and no tiny_http rustls 0.23 release is available; review=2026-08-20; removal=remove when HTTPS hosting moves off tiny_http ssl-rustls or tiny_http upgrades rustls; expires=2026-11-18" },
    { id = "RUSTSEC-2024-0336", reason = "owner=runtime/web; rationale=tiny_http 0.12 ssl-rustls pulls rustls 0.20 for the existing HTTPS server and no tiny_http rustls 0.23 release is available; review=2026-08-20; removal=remove when HTTPS hosting moves off tiny_http ssl-rustls or tiny_http upgrades rustls; expires=2026-11-18" },
    { id = "RUSTSEC-2026-0349", reason = "owner=runtime/web; rationale=tiny_http 0.12 ssl-rustls pulls rustls 0.20.9 only as a TLS server (ServerConfig/ServerConnection); the advisory concerns a TLS client recording the server-selected key-exchange group before authentication, and rustls 0.20 offers no post-quantum hybrid group to downgrade from; every rustls client path (mysql, ureq, trust-runtime) uses rustls 0.23.46, which fixes it, and no tiny_http rustls 0.23 release is available; review=2026-10-14; removal=remove when HTTPS hosting moves off tiny_http ssl-rustls or tiny_http upgrades rustls; expires=2026-11-18" },
    { id = "RUSTSEC-2025-0134", reason = "owner=runtime/web; rationale=direct TLS parsing now uses rustls pki_types PemObject, but tiny_http 0.12 ssl-rustls still pulls rustls-pemfile 0.2.1; review=2026-08-20; removal=remove when HTTPS hosting moves off tiny_http ssl-rustls or tiny_http upgrades rustls-pemfile; expires=2026-11-18" },
    { id = "RUSTSEC-2024-0436", reason = "owner=runtime/mesh; rationale=zenoh 1.7.2 still pulls paste through token-cell/zenoh-keyexpr even after narrowing features to the TCP transport and removing the rsa path; review=2026-08-20; removal=remove when the Zenoh baseline moves to a version or patch stack that no longer pulls paste; expires=2026-11-18" },
]

[licenses]
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "EPL-2.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "OpenSSL",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.8

# LLVM's bundled libFuzzer requires NCSA alongside the Rust wrapper license.
# owner=verification/fuzz; review=2026-10-11; only the reviewed locked release.
# https://spdx.org/licenses/NCSA.html
[[licenses.exceptions]]
name = "libfuzzer-sys"
version = "=0.4.13"
allow = ["NCSA"]

[licenses.private]
ignore = false

[[licenses.clarify]]
crate = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [
    { path = "LICENSE", hash = 0xbd0eed23 },
]

[bans]
multiple-versions = "warn"
wildcards = "allow"
allow-workspace = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = ["https://github.com/johannesPettersson80/open-ot-experiments.git"]
