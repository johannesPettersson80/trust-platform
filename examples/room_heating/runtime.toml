[bundle]
version = 1

[resource]
name = "MainRes"
cycle_interval_ms = 10

[runtime.control]
mode = "production"
debug_enabled = true

[runtime.web]
enabled = true
listen = "127.0.0.1:8080"
auth = "local"
tls = false

[runtime.tls]
mode = "disabled"
require_remote = false

[runtime.discovery]
enabled = false
service_name = "truST"
advertise = false
interfaces = []

[runtime.mesh]
enabled = false
listen = "0.0.0.0:5200"
tls = false
publish = []

[runtime.observability]
enabled = false
sample_interval_ms = 1000
mode = "all"
include = []
history_path = "history/historian.jsonl"
max_entries = 20000
prometheus_enabled = true
prometheus_path = "/metrics"

[runtime.log]
level = "info"

[runtime.retain]
mode = "file"
path = "retain.bin"
save_interval_ms = 1000

[runtime.watchdog]
enabled = false
timeout_ms = 1000
action = "halt"

[runtime.fault]
policy = "halt"

[[runtime.web.hmi.write]]
path = "Main.FanSpeed"
role = "engineer"

[[runtime.web.hmi.write]]
path = "Simulation.WindowOpening"
role = "engineer"
min = 0.0
max = 100.0

[[runtime.web.hmi.write]]
