role = "engineer"

[[runtime.web.hmi.write]]
path = "Simulation.PumpOverload"
role = "engineer"

[[runtime.web.hmi.write]]
path = "Simulation.FanFault"
role = "engineer"

[[runtime.web.hmi.write]]
path = "Simulation.PositionerFault"
role = "engineer"

[[runtime.web.hmi.write]]
path = "Simulation.TankSensorFault"
role = "engineer"

[[runtime.web.hmi.write]]
path = "Simulation.RoomSensorFault"
role = "engineer"

