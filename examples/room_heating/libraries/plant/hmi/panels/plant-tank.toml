format = 1
title = "Tank"
size = [608, 344]
pinnable = true
settings = true

[fields.Level]
accepts = ["number"]

[fields.Percent]
accepts = ["number"]

[fields.Volume]
accepts = ["number"]

[fields.Quality]
accepts = ["enumeration"]

[[object]]
id = "level"
type = "value"
label = "Level"
decimals = 2
at = [24, 24]
size = [176, 80]

[object.bind]
value = { path = "$Level", quality = "$Quality" }

[[object]]
id = "fill"
type = "value"
label = "Fill"
unit = "%"
decimals = 0
at = [216, 24]
size = [176, 80]

[object.bind]
value = { path = "$Percent", quality = "$Quality" }

[[object]]
id = "volume"
type = "value"
label = "Volume"
unit = "m³"
decimals = 1
at = [408, 24]
size = [176, 80]

[object.bind]
value = { path = "$Volume", quality = "$Quality" }

[[object]]
id = "history"
type = "trend"
label = "Level"
at = [24, 120]
size = [560, 200]

[object.bind]
level = { path = "$Level", quality = "$Quality" }
