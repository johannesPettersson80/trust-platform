format = 1
title = "Valve"
size = [608, 444]
pinnable = true
settings = true

[fields.Opened]
accepts = ["boolean"]

[fields.Closed]
accepts = ["boolean"]

[fields.Moving]
accepts = ["boolean"]

[fields.OpenPermit]
accepts = ["boolean"]

[fields.ClosePermit]
accepts = ["boolean"]

[fields.Operations]
accepts = ["number"]

[fields.Fault]
accepts = ["boolean"]

[fields.ReasonText]
accepts = ["text"]

[fields.Mode]
accepts = ["enumeration"]

[fields.Manual]
accepts = ["boolean"]

[fields.InService]
accepts = ["boolean"]

[fields.OutOfService]
accepts = ["boolean"]

[fields.StartPermit]
accepts = ["boolean"]

[fields.CommandText]
accepts = ["text"]

[[object]]
id = "state"
type = "status"
label = "Open"
at = [24, 24]
size = [272, 40]

[object.bind]
state = "$Opened"

[[object]]
id = "fault"
type = "status"
label = "Fault"
variant = "alarm"
at = [312, 24]
size = [272, 40]

[object.bind]
state = "$Fault"

[[object]]
id = "mode"
type = "mode-selector"
options = ["Auto", "Manual"]
at = [24, 80]
size = [560, 48]

[object.bind]
mode = "$Mode"
interlock = "$InService"
"interlock-reason" = "$CommandText"

[object.command]
interface = "Plant.IDevice"
method = "SetMode"
instance = "$instance"

[object.command.arguments]
Value = { input = true }

[[object]]
id = "closed"
type = "status"
label = "Closed"
at = [24, 144]
size = [272, 40]

[object.bind]
state = "$Closed"

[[object]]
id = "moving"
type = "status"
label = "Moving"
at = [312, 144]
size = [272, 40]

[object.bind]
state = "$Moving"

[[object]]
id = "open"
type = "button"
text = "Open"
expect = true
at = [24, 200]
size = [176, 48]

[object.bind]
feedback = "$Opened"
interlock = "$OpenPermit"
"interlock-reason" = "$CommandText"

[object.command]
interface = "Plant.IOpenCloseDevice"
method = "Open"
instance = "$instance"

[[object]]
id = "close"
type = "button"
text = "Close"
expect = true
at = [216, 200]
size = [176, 48]

[object.bind]
feedback = "$Closed"
interlock = "$ClosePermit"
"interlock-reason" = "$CommandText"

[object.command]
interface = "Plant.IOpenCloseDevice"
method = "Close"
instance = "$instance"

[[object]]
id = "reset"
type = "button"
text = "Reset"
at = [408, 200]
size = [176, 48]

[object.bind]
interlock = "$Fault"

[object.command]
interface = "Plant.IDevice"
method = "Reset"
instance = "$instance"

[[object]]
id = "reason"
type = "text"
variant = "caption"
at = [24, 256]
size = [560, 20]

[object.bind]
text = "$ReasonText"

[[object]]
id = "operations"
type = "value"
label = "Operations"
decimals = 0
at = [24, 284]
size = [560, 80]

[object.bind]
value = "$Operations"

[[object]]
id = "out-of-service"
type = "button"
text = "Out of service"
role = "engineer"
at = [24, 380]
size = [272, 40]

[object.bind]
interlock = "$InService"

[object.command]
interface = "Plant.IDevice"
method = "SetMode"
instance = "$instance"

[object.command.arguments]
Value = "OutOfService"

[[object]]
id = "return-to-service"
type = "button"
text = "Return to service"
role = "engineer"
at = [312, 380]
size = [272, 40]

[object.bind]
interlock = "$OutOfService"

[object.command]
interface = "Plant.IDevice"
method = "SetMode"
instance = "$instance"

[object.command.arguments]
Value = "Manual"
