format = 1
title = "Reversing motor"
size = [608, 500]
pinnable = true
settings = true

[fields.Running]
accepts = ["boolean"]

[fields.Forward]
accepts = ["boolean"]

[fields.Reverse]
accepts = ["boolean"]

[fields.Fault]
accepts = ["boolean"]

[fields.ReasonText]
accepts = ["text"]

[fields.Mode]
accepts = ["enumeration"]

[fields.Manual]
accepts = ["boolean"]

[fields.InService]
accepts = ["boolean"]

[fields.OutOfService]
accepts = ["boolean"]

[fields.StartPermit]
accepts = ["boolean"]

[fields.CommandText]
accepts = ["text"]

[fields.RunHours]
accepts = ["number"]

[fields.Starts]
accepts = ["number"]

[fields.ServiceDue]
accepts = ["boolean"]

[[object]]
id = "state"
type = "status"
label = "Running"
at = [24, 24]
size = [272, 40]

[object.bind]
state = "$Running"

[[object]]
id = "fault"
type = "status"
label = "Fault"
variant = "alarm"
at = [312, 24]
size = [272, 40]

[object.bind]
state = "$Fault"

[[object]]
id = "mode"
type = "mode-selector"
options = ["Auto", "Manual"]
at = [24, 80]
size = [560, 48]

[object.bind]
mode = "$Mode"
interlock = "$InService"
"interlock-reason" = "$CommandText"

[object.command]
interface = "Plant.IDevice"
method = "SetMode"
instance = "$instance"

[object.command.arguments]
Value = { input = true }

[[object]]
id = "first"
type = "status"
label = "Forward"
at = [24, 144]
size = [272, 40]

[object.bind]
state = "$Forward"

[[object]]
id = "second"
type = "status"
label = "Reverse"
at = [312, 144]
size = [272, 40]

[object.bind]
state = "$Reverse"

[[object]]
id = "first-start"
type = "button"
text = "Forward"
expect = true
at = [24, 200]
size = [128, 48]

[object.bind]
feedback = "$Forward"
interlock = "$StartPermit"
"interlock-reason" = "$CommandText"

[object.command]
interface = "Plant.IReversingDevice"
method = "StartForward"
instance = "$instance"

[[object]]
id = "second-start"
type = "button"
text = "Reverse"
expect = true
at = [168, 200]
size = [128, 48]

[object.bind]
feedback = "$Reverse"
interlock = "$StartPermit"
"interlock-reason" = "$CommandText"

[object.command]
interface = "Plant.IReversingDevice"
method = "StartReverse"
instance = "$instance"

[[object]]
id = "stop"
type = "button"
text = "Stop"
variant = "stop"
expect = false
at = [312, 200]
size = [128, 48]

[object.bind]
feedback = "$Running"
interlock = "$Manual"
"interlock-reason" = "$CommandText"

[object.command]
interface = "Plant.IReversingDevice"
method = "Stop"
instance = "$instance"

[[object]]
id = "reset"
type = "button"
text = "Reset"
at = [456, 200]
size = [128, 48]

[object.bind]
interlock = "$Fault"

[object.command]
interface = "Plant.IDevice"
method = "Reset"
instance = "$instance"

[[object]]
id = "reason"
type = "text"
variant = "caption"
at = [24, 256]
size = [560, 20]

[object.bind]
text = "$ReasonText"

[[object]]
id = "hours"
type = "value"
label = "Operating hours"
unit = "h"
decimals = 1
at = [24, 284]
size = [272, 80]

[object.bind]
value = "$RunHours"

[[object]]
id = "starts"
type = "value"
label = "Starts"
decimals = 0
at = [312, 284]
size = [272, 80]

[object.bind]
value = "$Starts"

[[object]]
id = "service-due"
type = "status"
label = "Service due"
variant = "alarm"
at = [24, 380]
size = [560, 40]

[object.bind]
state = "$ServiceDue"

[[object]]
id = "out-of-service"
type = "button"
text = "Out of service"
role = "engineer"
at = [24, 436]
size = [176, 40]

[object.bind]
interlock = "$InService"

[object.command]
interface = "Plant.IDevice"
method = "SetMode"
instance = "$instance"

[object.command.arguments]
Value = "OutOfService"

[[object]]
id = "return-to-service"
type = "button"
text = "Return to service"
role = "engineer"
at = [216, 436]
size = [176, 40]

[object.bind]
interlock = "$OutOfService"

[object.command]
interface = "Plant.IDevice"
method = "SetMode"
instance = "$instance"

[object.command.arguments]
Value = "Manual"

[[object]]
id = "service-done"
type = "button"
text = "Service done"
role = "engineer"
at = [408, 436]
size = [176, 40]

[object.command]
interface = "Plant.IServiceable"
method = "ServiceDone"
instance = "$instance"
