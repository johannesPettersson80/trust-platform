format = 1
title = "On/off controller"
size = [608, 128]
pinnable = true
settings = true

[fields.Setpoint]
accepts = ["number"]

[fields.Demand]
accepts = ["boolean"]

[fields.SetpointMin]
accepts = ["number"]

[fields.SetpointMax]
accepts = ["number"]

[[object]]
id = "setpoint"
type = "setpoint"
label = "Setpoint"
at = [24, 24]
size = [272, 80]

[object.bind]
value = "$Setpoint"
"low-limit" = "$SetpointMin"
"high-limit" = "$SetpointMax"

[object.command]
interface = "Plant.ISetpoint"
method = "SetSetpoint"
instance = "$instance"

[object.command.arguments]
Value = { input = true }

[[object]]
id = "demand"
type = "status"
label = "Demand"
at = [312, 24]
size = [272, 80]

[object.bind]
state = "$Demand"
