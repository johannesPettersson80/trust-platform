format = 1
title = "Totaliser"
size = [608, 136]
pinnable = true
settings = true

[fields.Total]
accepts = ["number"]

[[object]]
id = "total"
type = "value"
label = "Total"
decimals = 1
at = [24, 24]
size = [363, 88]

[object.bind]
value = "$Total"

[[object]]
id = "reset-total"
type = "button"
text = "Reset total"
at = [403, 24]
size = [181, 88]

[object.command]
interface = "Plant.ITotal"
method = "ResetTotal"
instance = "$instance"
