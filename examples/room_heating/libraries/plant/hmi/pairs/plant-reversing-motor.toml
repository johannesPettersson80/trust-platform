format = 1
title = "Reversing motor"
block = "Plant.FB_ReversingMotor"
faceplate = "plant-reversing-motor"
symbol = "motor"

[bind]
running = "Running"
fault = "Fault"
manual = "Manual"
"out-of-service" = "OutOfService"

[[settings]]
member = "HasFeedback"
title = "Has running feedback"
key = true

[[settings]]
member = "StartTimeout"
title = "Start timeout"
unit = "s"
min = 1
max = 600
key = true
help = "Running feedback must arrive within this time."

[[settings]]
member = "StopTimeout"
title = "Stop timeout"
unit = "s"
min = 1
max = 600
key = true
help = "Running feedback must drop within this time."

[[settings]]
member = "ServiceInterval"
title = "Service interval"
unit = "h"
min = 0
max = 100000
help = "Running hours between services; 0 for none."

[[settings]]
member = "ReversalDelay"
title = "Reversal delay"
unit = "s"
min = 0
max = 60
key = true

[[io]]
member = "ForwardCommand"
title = "Forward command"
direction = "output"

[[io]]
member = "ReverseCommand"
title = "Reverse command"
direction = "output"

[[io]]
member = "ForwardFeedback"
title = "Forward feedback"
direction = "input"
required_when = "HasFeedback"

[[io]]
member = "ReverseFeedback"
title = "Reverse feedback"
direction = "input"
required_when = "HasFeedback"

[[io]]
member = "Trip"
title = "Protection trip"
direction = "input"
required = false

[program]
position = "actuators"
