[bundle]
version = 1

[resource]
name = "KilnDryerDecoratorStrategyOop"
cycle_interval_ms = 100

[runtime.control]

[runtime.log]
level = "info"

[runtime.retain]
mode = "none"
save_interval_ms = 1000

[runtime.watchdog]
enabled = false
timeout_ms = 1000
action = "halt"

[runtime.fault]
policy = "halt"

[runtime.opcua]
enabled = true
listen = "127.0.0.1:4840"
endpoint_path = "/"
namespace_uri = "urn:trust:examples:kiln-dryer-decorator-strategy"
publish_interval_ms = 250
max_nodes = 128
expose = ["Dryer.ActiveProfileId", "Dryer.HeatCommand", "Dryer.ConditionedMoisture"]
security_policy = "none"
security_mode = "none"
allow_anonymous = true
