[bundle]
version = 1

[resource]
name = "AirportBaggageCommandObserverOop"
cycle_interval_ms = 50

[runtime.control]

[runtime.log]
level = "info"

[runtime.retain]
mode = "none"
save_interval_ms = 1000

[runtime.watchdog]
enabled = false
timeout_ms = 1000
action = "halt"

[runtime.fault]
policy = "halt"

[runtime.opcua]
enabled = true
listen = "127.0.0.1:4840"
endpoint_path = "/"
namespace_uri = "urn:trust:examples:airport-baggage-command-observer"
publish_interval_ms = 250
max_nodes = 128
expose = ["Diverter.LastBagId", "Diverter.LastCommandId", "Diverter.EventCount"]
security_policy = "none"
security_mode = "none"
allow_anonymous = true
