# The project's service (specification 48 §13): the price service, which runs beside the runtime.
[services.price]
package = "price-service"            # the Cargo package in price-service/
endpoint = "tcp://127.0.0.1:47800"   # the runtime's control endpoint, as runtime.toml sets it
credentials = "secrets/price.token"  # its service token, never in version control
heartbeat = "500ms"
writes = ["Heater.price_setpoint"]   # the one variable the service may write
