[bundle]
version = 1

[resource]
name = "truST-ADS"
cycle_interval_ms = 100

[runtime.control]
endpoint = "unix:///tmp/trust-runtime-ads-server-basic.sock"
mode = "production"
debug_enabled = true
auth_token = "ads-server-smoke-token"

[runtime.web]
enabled = false
listen = "127.0.0.1:8080"
auth = "local"
tls = false

[runtime.tls]
mode = "disabled"
require_remote = false

[runtime.discovery]
enabled = false
service_name = "truST"
advertise = false
interfaces = []

[runtime.mesh]
enabled = false
listen = "0.0.0.0:5200"
tls = false
auth_token = ""
publish = []

[runtime.ads_server]
enabled = true
listen = "127.0.0.1"
ams_net_id = "127.0.0.1.1.1"
ads_port = 851
insecure_transport = true
writes_enabled = true
symbol_namespace = ""
expose = ["global.TankLevel", "global.PumpRunning", "global.Setpoint", "global.StatusWord"]
writable = ["global.Setpoint"]

[[runtime.ads_server.clients]]
ams_net_id = "127.0.0.1.1.100"
source_ip = "127.0.0.1"

[runtime.opcua]
enabled = false
listen = "0.0.0.0:4840"
endpoint_path = "/"
namespace_uri = "urn:trust:runtime"
publish_interval_ms = 250
max_nodes = 128
expose = []
security_policy = "basic256sha256"
security_mode = "sign_and_encrypt"
allow_anonymous = false

[runtime.observability]
enabled = false
sample_interval_ms = 1000
mode = "all"
include = []
history_path = "history/historian.jsonl"
max_entries = 20000
prometheus_enabled = true
prometheus_path = "/metrics"

[runtime.log]
level = "info"

[runtime.retain]
mode = "none"
save_interval_ms = 1000

[runtime.watchdog]
enabled = false
timeout_ms = 1000
action = "halt"

[runtime.fault]
policy = "halt"
