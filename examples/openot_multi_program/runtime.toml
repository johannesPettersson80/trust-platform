[bundle]
version = 1

[resource]
name = "OpenOtMultiProgram"
cycle_interval_ms = 100

[runtime]
execution_backend = "vm"

[runtime.control]
endpoint = "unix:///tmp/trust-openot-multi-program.sock"
mode = "production"
debug_enabled = false

[runtime.web]
enabled = false
listen = "127.0.0.1:8080"
auth = "local"
tls = false

[runtime.openot]
enabled = true
path = "openot-multi-program.shm"
capacity = 4096
fence_mode = "fenced"
source = "st-fb"
producer_instances = ["Filler.OotProducer", "Quality.OotProducer"]

[runtime.log]
level = "info"

[runtime.retain]
mode = "none"
save_interval_ms = 1000

[runtime.watchdog]
enabled = false
timeout_ms = 1000
action = "halt"

[runtime.fault]
policy = "halt"
