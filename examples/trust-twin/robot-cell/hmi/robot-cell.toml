title = "Robot Cell"
icon = "bot"
order = 10
kind = "scene3d"
view = "robot-cell.view.toml"
signals = [
  "Main.RobotShoulderAngle",
  "Main.RobotElbowAngle",
  "Main.RobotWristAngle",
  "Main.RobotGripperOpen",
  "Main.RobotBoxParentState",
  "Main.RobotEnabled",
  "Main.RobotStatusLight",
]

[[section]]
title = "Robot State"
span = 12

[[section.widget]]
type = "value"
bind = "Main.RobotMotionStep"
label = "Robot step"

[[section.widget]]
type = "indicator"
bind = "Main.RobotEnabled"
label = "Robot enabled"

[[section.widget]]
type = "indicator"
bind = "Main.RobotStatusLight"
label = "Cycle carrying box"

[[section.widget]]
type = "value"
bind = "Main.RobotShoulderAngle"
label = "Shoulder angle"
unit = "rad"

[[section.widget]]
type = "value"
bind = "Main.RobotElbowAngle"
label = "Elbow angle"
unit = "rad"

[[section.widget]]
type = "value"
bind = "Main.RobotWristAngle"
label = "Wrist angle"
unit = "rad"

[[section.widget]]
type = "value"
bind = "Main.RobotBoxParentState"
label = "Box parent state"
