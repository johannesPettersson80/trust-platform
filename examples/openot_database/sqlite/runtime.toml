[bundle]
version = 1

[resource]
name = "OpenOtMultiProgram"
cycle_interval_ms = 100

[runtime]
execution_backend = "vm"

[runtime.control]
endpoint = "unix:///tmp/trust-openot-multi-program.sock"
mode = "production"
debug_enabled = false

[runtime.web]
enabled = false
listen = "127.0.0.1:8080"
auth = "local"
tls = false

[runtime.openot]
enabled = true
path = "openot-multi-program.shm"
capacity = 65536
fence_mode = "fenced"
source = "st-fb"
producer_instances = ["Filler.OotProducer", "BatchControl.OotProducer", "OperatorAudit.OotProducer", "SignatureAudit.OotProducer", "TypedValues.OotProducer", "ConditionLifecycle.OotProducer"]

[runtime.openot.persistence]
enabled = true
backend = "sqlite"
batch_size = 256
flush_interval_ms = 250
queue_capacity = 4096
shutdown_timeout_ms = 5000
retry_initial_ms = 250
retry_max_ms = 30000
retry_multiplier = 2
retry_max_attempts = 20

[runtime.openot.persistence.sqlite]
path = "history/openot.sqlite3"

[runtime.log]
level = "info"

[runtime.retain]
mode = "none"
save_interval_ms = 1000

[runtime.watchdog]
enabled = false
timeout_ms = 1000
action = "halt"

[runtime.fault]
policy = "halt"
