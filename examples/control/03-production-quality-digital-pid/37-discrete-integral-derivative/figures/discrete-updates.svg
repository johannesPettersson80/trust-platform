<svg xmlns="http://www.w3.org/2000/svg" width="960" height="350" viewBox="0 0 960 350" role="img" aria-labelledby="title desc">
  <title id="title">Discrete integral and derivative updates</title>
  <desc id="desc">Integral action adds error times elapsed time, while derivative action divides position change by elapsed time.</desc>
  <rect width="960" height="350" fill="#f7fafc"/>
  <text x="480" y="43" text-anchor="middle" font-family="sans-serif" font-size="25" font-weight="700" fill="#17324d">One controller interval Δt</text>
  <rect x="55" y="80" width="390" height="220" rx="18" fill="#e6f2ff" stroke="#2463a6" stroke-width="3"/>
  <text x="250" y="122" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="700" fill="#17324d">Integral update</text>
  <text x="250" y="174" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#17324d">error × elapsed time</text>
  <text x="250" y="219" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#17324d">adds error area</text>
  <text x="250" y="268" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#17324d">τi,k = τi,k−1 + Ki e Δt</text>
  <rect x="515" y="80" width="390" height="220" rx="18" fill="#fff3d6" stroke="#b87900" stroke-width="3"/>
  <text x="710" y="122" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="700" fill="#5b3d00">Derivative update</text>
  <text x="710" y="174" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#5b3d00">position change ÷ elapsed time</text>
  <text x="710" y="219" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#5b3d00">estimates velocity</text>
  <text x="710" y="268" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#5b3d00">τd,k = Kd Δθ / Δt</text>
</svg>
