[simulation]
enabled = true
seed = 20260829
time_scale = 1
max_plant_substeps_per_cycle = 100
plant_trace_capacity = 3000
plant_step_ms = 100

[[plants]]
id = "automatic-water-heater"
name = "Recirculating water heater with confirmed Robust PI"
description = "The running controller remains unchanged during Automatic Tune."
model = "first_order_dead_time"
command_sources = ["%QL0"]
feedback_targets = ["%IL0"]
initial_state = [20.0]
[plants.parameters]
gain = 0.2
time_constant_s = 5.0
dead_time_s = 1.0
initial_delayed_input = 20.0
input_bias = 20.0
output_bias = 20.0
[plants.actuator]
minimum = 0.0
maximum = 100.0
initial_applied = 20.0
[[plants.uncertainties]]
id = "current-heater-sensor-interference"
target = "measurement"
channel = 0
mode = "add"
generator = "sine"
amplitude = 0.02
frequency_hz = 0.5
phase_rad = 0.0

[[plants]]
id = "automatic-water-heater-validation-copy"
name = "Independent validation copy with unapplied Balanced PI candidate"
description = "Executing this Simulation copy validates a candidate without changing the running controller."
model = "first_order_dead_time"
command_sources = ["%QL8"]
feedback_targets = ["%IL8"]
initial_state = [20.0]
[plants.parameters]
gain = 0.2
time_constant_s = 5.0
dead_time_s = 1.0
initial_delayed_input = 20.0
input_bias = 20.0
output_bias = 20.0
[plants.actuator]
minimum = 0.0
maximum = 100.0
initial_applied = 20.0
[[plants.uncertainties]]
id = "candidate-heater-sensor-interference"
target = "measurement"
channel = 0
mode = "add"
generator = "sine"
amplitude = 0.02
frequency_hz = 0.5
phase_rad = 0.0

[[plant_events]]
at_ms = 100000
plant = "automatic-water-heater"
kind = "set_parameter"
parameter = "output_bias"
value = 19.0

[[plant_events]]
at_ms = 100000
plant = "automatic-water-heater-validation-copy"
kind = "set_parameter"
parameter = "output_bias"
value = 19.0
