<svg xmlns="http://www.w3.org/2000/svg" width="900" height="450" viewBox="0 0 900 450" role="img" aria-labelledby="title desc">
  <title id="title">Gravity-driven tank outflow</title>
  <desc id="desc">A tall liquid column above a fixed outlet creates gravity-driven velocity and outlet flow.</desc>
  <rect width="900" height="450" fill="#ffffff"/>
  <text x="70" y="45" font-family="sans-serif" font-size="27" fill="#20252b">More liquid height gives more outlet velocity</text>
  <rect x="280" y="85" width="300" height="285" fill="#eef3f7" stroke="#28343f" stroke-width="4"/>
  <rect x="284" y="135" width="292" height="231" fill="#8dc9e8"/>
  <line x1="284" y1="135" x2="576" y2="135" stroke="#2374ab" stroke-width="4"/>
  <line x1="245" y1="135" x2="245" y2="325" stroke="#28343f" stroke-width="3"/>
  <line x1="230" y1="150" x2="245" y2="135" stroke="#28343f" stroke-width="3"/>
  <line x1="260" y1="150" x2="245" y2="135" stroke="#28343f" stroke-width="3"/>
  <line x1="230" y1="310" x2="245" y2="325" stroke="#28343f" stroke-width="3"/>
  <line x1="260" y1="310" x2="245" y2="325" stroke="#28343f" stroke-width="3"/>
  <text x="205" y="240" font-family="sans-serif" font-size="25" fill="#20252b">h</text>
  <circle cx="580" cy="325" r="13" fill="#ffffff" stroke="#28343f" stroke-width="4"/>
  <line x1="593" y1="325" x2="800" y2="325" stroke="#2374ab" stroke-width="12"/>
  <line x1="768" y1="303" x2="800" y2="325" stroke="#2374ab" stroke-width="12"/>
  <line x1="768" y1="347" x2="800" y2="325" stroke="#2374ab" stroke-width="12"/>
  <text x="625" y="285" font-family="sans-serif" font-size="23" fill="#20252b">outlet velocity, v</text>
  <text x="625" y="385" font-family="sans-serif" font-size="22" fill="#20252b">outlet flow increases with √h</text>
  <text x="310" y="415" font-family="sans-serif" font-size="22" fill="#424b55">Liquid height supplies the gravitational energy.</text>
</svg>
