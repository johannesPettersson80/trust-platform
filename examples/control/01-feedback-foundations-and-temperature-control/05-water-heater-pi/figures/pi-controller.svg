<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" role="img" aria-labelledby="title desc">
  <title id="title">The two parts of a PI controller</title>
  <desc id="desc">Temperature error splits into an immediate proportional correction and a stored integral correction. The two corrections are added to form the heater request.</desc>
  <rect width="900" height="300" rx="20" fill="#f8fafc"/>
  <g font-family="system-ui, sans-serif" fill="#111827">
    <rect x="35" y="115" width="150" height="70" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="110" y="144" text-anchor="middle" font-size="18" font-weight="600">Temperature</text>
    <text x="110" y="169" text-anchor="middle" font-size="18" font-weight="600">error</text>

    <rect x="285" y="35" width="220" height="80" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="395" y="68" text-anchor="middle" font-size="18" font-weight="600">Immediate correction</text>
    <text x="395" y="94" text-anchor="middle" font-size="16">larger error → larger change now</text>

    <rect x="285" y="185" width="220" height="80" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <text x="395" y="218" text-anchor="middle" font-size="18" font-weight="600">Stored correction</text>
    <text x="395" y="244" text-anchor="middle" font-size="16">remaining error → memory changes</text>

    <circle cx="610" cy="150" r="30" fill="#ffffff" stroke="#4b5563" stroke-width="2"/>
    <text x="610" y="159" text-anchor="middle" font-size="28">+</text>

    <rect x="700" y="115" width="165" height="70" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
    <text x="782" y="144" text-anchor="middle" font-size="18" font-weight="600">Heater</text>
    <text x="782" y="169" text-anchor="middle" font-size="18" font-weight="600">request</text>
  </g>
  <g stroke="rgb(75,85,99)" stroke-width="3">
    <line x1="185" y1="140" x2="235" y2="140"/><line x1="235" y1="140" x2="235" y2="75"/><line x1="235" y1="75" x2="285" y2="75"/>
    <line x1="185" y1="160" x2="235" y2="160"/><line x1="235" y1="160" x2="235" y2="225"/><line x1="235" y1="225" x2="285" y2="225"/>
    <line x1="505" y1="75" x2="545" y2="75"/><line x1="545" y1="75" x2="545" y2="130"/><line x1="545" y1="130" x2="580" y2="140"/>
    <line x1="505" y1="225" x2="545" y2="225"/><line x1="545" y1="225" x2="545" y2="170"/><line x1="545" y1="170" x2="580" y2="160"/>
  </g>
  <line x1="640" y1="150" x2="700" y2="150" stroke="rgb(75,85,99)" stroke-width="3"/>
  <g fill="#4b5563">
    <path d="M285 75 L273 68 L273 82 Z"/>
    <path d="M285 225 L273 218 L273 232 Z"/>
    <path d="M580 140 L567 137 L575 127 Z"/>
    <path d="M580 160 L567 163 L575 173 Z"/>
    <path d="M700 150 L688 143 L688 157 Z"/>
  </g>
</svg>
