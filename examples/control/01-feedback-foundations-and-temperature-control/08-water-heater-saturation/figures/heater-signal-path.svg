<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="330" viewBox="0 0 1120 330" role="img" aria-labelledby="title desc">
  <title id="title">Requested and applied heater-power signal path</title>
  <desc id="desc">The PI controller requests heater power. The physical power stage clamps it between zero and one hundred percent before applying it to the heater. The temperature sensor returns the measured outlet temperature to the controller.</desc>
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
  </defs>

  <rect width="1120" height="330" rx="18" fill="#f8fafc"/>
  <text x="48" y="47" fill="#0f172a" font-family="system-ui, sans-serif" font-size="24" font-weight="700">Only applied heater power enters the plant</text>
  <text x="48" y="76" fill="#475569" font-family="system-ui, sans-serif" font-size="16">Keeping the request visible exposes saturation and stored controller demand.</text>

  <g font-family="system-ui, sans-serif" text-anchor="middle">
    <rect x="50" y="125" width="210" height="86" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text x="155" y="160" fill="#0f172a" font-size="19" font-weight="700">PI controller</text>
    <text x="155" y="187" fill="#475569" font-size="15">calculates demand</text>

    <rect x="355" y="125" width="240" height="86" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
    <text x="475" y="160" fill="#0f172a" font-size="19" font-weight="700">Power stage</text>
    <text x="475" y="187" fill="#9a3412" font-size="15">clamps 0 to 100%</text>

    <rect x="690" y="125" width="175" height="86" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
    <text x="778" y="160" fill="#0f172a" font-size="19" font-weight="700">Water heater</text>
    <text x="778" y="187" fill="#166534" font-size="15">physical plant</text>

    <rect x="940" y="125" width="130" height="86" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
    <text x="1005" y="160" fill="#0f172a" font-size="19" font-weight="700">Sensor</text>
    <text x="1005" y="187" fill="#475569" font-size="15">measures PV</text>
  </g>

  <g fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow-blue)">
    <path d="M260 168 H345"/>
    <path d="M595 168 H680"/>
    <path d="M865 168 H930"/>
  </g>
  <g font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">
    <text x="303" y="137" fill="#9a3412">requested MV</text>
    <text x="638" y="137" fill="#166534">applied MV</text>
    <text x="898" y="137" fill="#334155">temperature</text>
  </g>

  <path d="M1005 221 V275 H155 V221" fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow-gray)"/>
  <text x="580" y="303" fill="#334155" font-family="system-ui, sans-serif" font-size="15" font-weight="600" text-anchor="middle">measured outlet temperature (PV) returns to the controller</text>
</svg>
