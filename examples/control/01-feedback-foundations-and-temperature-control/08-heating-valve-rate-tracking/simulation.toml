[simulation]
enabled = true
seed = 20260829
time_scale = 1
max_plant_substeps_per_cycle = 100
plant_trace_capacity = 2400
plant_step_ms = 100

[[plants]]
id = "valve-heater-lesson-30"
model = "first_order_dead_time"
command_sources = ["%QL0"]
feedback_targets = ["%IL8"]
# The actuator publishes the stem position it has actually reached.
actuator_feedback_targets = [{ address = "%IL16" }]
initial_state = [35.0]

# Near 35 °C the hot-water valve delivers the heater's 2 kW per percent, so the water behaves like
# the Lesson 20 heater: 0.2 °C per percent of valve position, 5 s time constant, 1 s transport delay.
[plants.parameters]
gain = 0.2
time_constant_s = 5.0
dead_time_s = 1.0
initial_delayed_input = 75.0
output_bias = 20.0

# The motor moves the stem at most 0.5 % per second in either direction.
[plants.actuator]
minimum = 0.0
maximum = 100.0
rate_up_per_s = 0.5
rate_down_per_s = 0.5
initial_applied = 75.0

# The temperature measurement carries the heater's repeatable ±0.02 °C noise.
[[plants.uncertainties]]
id = "temperature-noise"
target = "measurement"
channel = 0
mode = "add"
generator = "uniform_white"
minimum = -0.02
maximum = 0.02
