<svg xmlns="http://www.w3.org/2000/svg" width="920" height="360" viewBox="0 0 920 360" role="img" aria-labelledby="title desc">
  <title id="title">Requested and applied valve position</title>
  <desc id="desc">The requested position changes immediately. The applied position moves toward it by no more than half a percentage point per scan. Their difference returns to the PI controller.</desc>
  <rect width="920" height="360" rx="24" fill="#f8fafc"/>
  <rect x="45" y="70" width="200" height="86" rx="14" fill="#dbeafe"/>
  <text x="145" y="105" text-anchor="middle" font-family="sans-serif" font-size="21" font-weight="700" fill="#172033">PI controller</text>
  <text x="145" y="133" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#172033">requested position</text>
  <rect x="360" y="70" width="200" height="86" rx="14" fill="#fef3c7"/>
  <text x="460" y="105" text-anchor="middle" font-family="sans-serif" font-size="21" font-weight="700" fill="#172033">Motorized valve</text>
  <text x="460" y="133" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#172033">at most 0.5 point/scan</text>
  <rect x="675" y="70" width="200" height="86" rx="14" fill="#dcfce7"/>
  <text x="775" y="105" text-anchor="middle" font-family="sans-serif" font-size="21" font-weight="700" fill="#172033">Water process</text>
  <text x="775" y="133" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#172033">temperature responds later</text>
  <line x1="245" y1="113" x2="350" y2="113" stroke="#475569" stroke-width="3"/>
  <polygon points="350,113 336,106 336,120" fill="#475569"/>
  <line x1="560" y1="113" x2="665" y2="113" stroke="#475569" stroke-width="3"/>
  <polygon points="665,113 651,106 651,120" fill="#475569"/>
  <rect x="315" y="245" width="290" height="70" rx="14" fill="#e2e8f0"/>
  <text x="460" y="275" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="700" fill="#172033">applied − requested</text>
  <text x="460" y="300" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#172033">tracking correction</text>
  <path d="M460 156 V235" fill="none" stroke="#475569" stroke-width="3"/>
  <polygon points="460,245 453,231 467,231" fill="#475569"/>
  <polyline points="200,156 200,270 305,270" fill="none" stroke="#475569" stroke-width="3"/>
  <polygon points="315,270 301,263 301,277" fill="#475569"/>
  <polyline points="315,300 115,300 115,166" fill="none" stroke="#475569" stroke-width="3"/>
  <polygon points="115,156 108,170 122,170" fill="#475569"/>
</svg>
