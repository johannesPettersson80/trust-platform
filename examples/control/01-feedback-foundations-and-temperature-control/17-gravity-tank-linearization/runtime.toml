[bundle]
version = 1

[resource]
name = "Res"
cycle_interval_ms = 100

[runtime.control]
mode = "debug"
debug_enabled = true

[runtime.log]
level = "info"

[runtime.retain]
mode = "none"
save_interval_ms = 1000

[runtime.watchdog]
enabled = false
timeout_ms = 5000
action = "halt"

[runtime.fault]
policy = "halt"
