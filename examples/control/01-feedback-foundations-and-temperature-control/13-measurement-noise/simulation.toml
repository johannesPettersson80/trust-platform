[simulation]
enabled = true
seed = 20260824
time_scale = 1
max_plant_substeps_per_cycle = 100
plant_trace_capacity = 2000
plant_step_ms = 100

[[plants]]
id = "noisy-fopdt"
model = "first_order_dead_time"
command_sources = ["%QL0"]
feedback_targets = ["%IL0"]
initial_state = [0.0]

[plants.parameters]
gain = 1.0
time_constant_s = 1.0
dead_time_s = 0.5

[[plants.uncertainties]]
id = "measurement-noise"
target = "measurement"
channel = 0
mode = "add"
generator = "normal_approx_white"
mean = 0.0
standard_deviation = 0.02

# The controller never reads this channel. It is a simulator-only reference
# used to reproduce the injected transmitter noise as raw minus true pressure.
[[plants]]
id = "pressure-truth-reference"
model = "first_order_dead_time"
command_sources = ["%QL0"]
feedback_targets = ["%IL8"]
initial_state = [0.0]

[plants.parameters]
gain = 1.0
time_constant_s = 1.0
dead_time_s = 0.5
