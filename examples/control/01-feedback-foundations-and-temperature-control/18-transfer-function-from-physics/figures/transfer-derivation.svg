<svg xmlns="http://www.w3.org/2000/svg" width="980" height="380" viewBox="0 0 980 380" role="img" aria-labelledby="title desc">
  <title id="title">Transfer function derived from a physical tank model</title>
  <desc id="desc">A gravity tank leads to a local differential equation, which the Laplace transform converts into an algebraic transfer function.</desc>
  <rect width="980" height="380" fill="#ffffff"/>
  <text x="55" y="45" font-family="sans-serif" font-size="27" fill="#20252b">The transfer function keeps the model derived from the tank</text>

  <rect x="45" y="105" width="230" height="170" rx="14" fill="#e9f4fb" stroke="#2374ab" stroke-width="3"/>
  <text x="160" y="145" text-anchor="middle" font-family="sans-serif" font-size="23" fill="#20252b">Physical tank</text>
  <text x="160" y="185" text-anchor="middle" font-family="sans-serif" font-size="19" fill="#20252b">inflow − gravity outflow</text>
  <text x="160" y="225" text-anchor="middle" font-family="sans-serif" font-size="19" fill="#20252b">stored liquid changes</text>

  <line x1="275" y1="190" x2="355" y2="190" stroke="#424b55" stroke-width="5"/>
  <line x1="332" y1="174" x2="355" y2="190" stroke="#424b55" stroke-width="5"/>
  <line x1="332" y1="206" x2="355" y2="190" stroke="#424b55" stroke-width="5"/>

  <rect x="355" y="105" width="270" height="170" rx="14" fill="#f3f0fb" stroke="#6954a3" stroke-width="3"/>
  <text x="490" y="145" text-anchor="middle" font-family="sans-serif" font-size="23" fill="#20252b">Local differential equation</text>
  <text x="490" y="202" text-anchor="middle" font-family="sans-serif" font-size="23" fill="#20252b">τ dx/dt + x = Ku</text>
  <text x="490" y="240" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#424b55">valid near the operating point</text>

  <line x1="625" y1="190" x2="705" y2="190" stroke="#424b55" stroke-width="5"/>
  <line x1="682" y1="174" x2="705" y2="190" stroke="#424b55" stroke-width="5"/>
  <line x1="682" y1="206" x2="705" y2="190" stroke="#424b55" stroke-width="5"/>
  <text x="665" y="155" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#424b55">Laplace</text>

  <rect x="705" y="105" width="230" height="170" rx="14" fill="#eef7ed" stroke="#41834c" stroke-width="3"/>
  <text x="820" y="145" text-anchor="middle" font-family="sans-serif" font-size="23" fill="#20252b">Transfer function</text>
  <text x="820" y="202" text-anchor="middle" font-family="sans-serif" font-size="25" fill="#20252b">G(s) = K/(τs + 1)</text>
  <text x="820" y="240" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#424b55">same gain and response time</text>

  <text x="185" y="335" font-family="sans-serif" font-size="21" fill="#20252b">physics → differential equation → algebraic input-output representation</text>
</svg>
