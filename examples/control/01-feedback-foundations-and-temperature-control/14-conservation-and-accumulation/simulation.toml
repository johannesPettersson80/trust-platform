[simulation]
enabled = true
seed = 20260829
time_scale = 1
max_plant_substeps_per_cycle = 100
plant_trace_capacity = 2000
plant_step_ms = 1000

# Constant-area tank: A·dh/dt = q_in − q_out with A = 0.5 m². Inputs: the inlet pump flow (%QL0) and the outlet
# pump flow (%QL8), in m³/s; output: the level (%IL0), in m.
[[plants]]
id = "volume-balance-tank"
model = "state_space"
command_sources = ["%QL0", "%QL8"]
feedback_targets = ["%IL0"]
initial_state = [0.25]

[plants.parameters]
a = [[0.0]]
b = [[2.0, -2.0]]
c = [[1.0]]
d = [[0.0, 0.0]]

# The level sensor reads within ±0.0005 m.
[[plants.uncertainties]]
id = "level-noise"
target = "measurement"
channel = 0
mode = "add"
generator = "uniform_white"
minimum = -0.0005
maximum = 0.0005
