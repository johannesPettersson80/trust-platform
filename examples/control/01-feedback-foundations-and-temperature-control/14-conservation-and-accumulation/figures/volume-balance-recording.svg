<svg xmlns="http://www.w3.org/2000/svg" width="900" height="512" viewBox="0 0 900 512" role="img" aria-labelledby="title desc">
  <title id="title">A flow step fills the tank</title>
  <desc id="desc">With 0.012 cubic metres per second in and 0.010 out, the level rises at 0.004 metres per second from 0.2502 to 0.2896 metres in 10 seconds; when the inflow returns to 0.010, the level stays between 0.2897 and 0.2903 metres instead of returning to 0.25.</desc>
