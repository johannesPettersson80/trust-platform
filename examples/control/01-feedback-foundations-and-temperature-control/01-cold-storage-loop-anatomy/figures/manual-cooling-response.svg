<svg xmlns="http://www.w3.org/2000/svg" width="900" height="610" viewBox="0 0 900 610" role="img" aria-labelledby="title desc">
  <title id="title">Cold-room response to manual actuation and a door disturbance</title>
  <desc id="desc">The actual simulator trace shows a 150 percent request clamped to 100 percent applied compressor demand, safe restoration at 20 seconds, and uncontrolled warming during the observed 60 to 90 second door load.</desc>
