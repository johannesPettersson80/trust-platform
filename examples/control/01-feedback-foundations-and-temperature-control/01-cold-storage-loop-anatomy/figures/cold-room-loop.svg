<svg xmlns="http://www.w3.org/2000/svg" width="900" height="320" viewBox="0 0 900 320" role="img" aria-labelledby="title desc">
  <title id="title">Cold-storage room loop elements</title>
  <desc id="desc">The operator requests compressor demand, the bounded compressor acts on the cold room, the sensor reports temperature, and door and wall heat enter as a disturbance.</desc>
  <style>
  svg { forced-color-adjust: none; color-scheme: light; }
  .surface { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 2; }
  text { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #172033; }
  .title { font-size: 20px; font-weight: 650; }
  .subtitle { font-size: 12px; fill: #4b5568; }
  .box { fill: #ffffff; stroke: #526076; stroke-width: 1.5; }
  .axis { stroke: #526076; stroke-width: 1.2; }
  .grid { stroke: #cbd3df; stroke-width: 0.8; stroke-dasharray: 3 5; }
  .signal { stroke: #1769aa; stroke-width: 2.2; fill: none; }
  .surroundings { stroke: #26734d; stroke-width: 2; fill: none; stroke-dasharray: 7 4; }
  .request { stroke: #7a3eb1; stroke-width: 2.2; fill: none; stroke-dasharray: 2 3; }
  .applied { stroke: #c64b16; stroke-width: 2.2; fill: none; stroke-dasharray: 8 4; }
  .disturbance { stroke: #9b3152; stroke-width: 1.8; fill: none; stroke-dasharray: 5 4; }
  .door-band { fill: #f4d9e2; opacity: 0.42; }
  .tick { font-size: 11px; fill: #465268; }
  .label { font-size: 12px; font-weight: 600; }
  .note { font-size: 11px; fill: #374258; }
</style>
  <rect x="1" y="1" width="898" height="318" rx="8" class="surface" />
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#526076" /></marker></defs>
  <text x="48.0" y="34.0" class="title" text-anchor="start">The physical signals in the cold-room loop</text>
  <text x="48.0" y="55.0" class="subtitle" text-anchor="start">Manual observation only · feedback is not closed in this lesson</text>
  <rect x="55" y="112" width="160" height="76" rx="7" class="box" />
  <text x="135.0" y="140.0" class="label" text-anchor="middle">Operator request</text>
  <text x="135.0" y="164.0" class="note" text-anchor="middle">Requested demand · %</text>
  <rect x="285" y="112" width="160" height="76" rx="7" class="box" />
  <text x="365.0" y="140.0" class="label" text-anchor="middle">Compressor</text>
  <text x="365.0" y="164.0" class="note" text-anchor="middle">Applied demand · 0–100%</text>
  <rect x="515" y="112" width="160" height="76" rx="7" class="box" />
  <text x="595.0" y="140.0" class="label" text-anchor="middle">Cold room + contents</text>
  <text x="595.0" y="164.0" class="note" text-anchor="middle">Process</text>
  <rect x="735" y="112" width="112" height="76" rx="7" class="box" />
  <text x="791.0" y="140.0" class="label" text-anchor="middle">Sensor</text>
  <text x="791.0" y="164.0" class="note" text-anchor="middle">Temperature · °C</text>
  <line x1="215.0" y1="150.0" x2="285.0" y2="150.0" class="signal" marker-end="url(#arrow)" />
  <line x1="445.0" y1="150.0" x2="515.0" y2="150.0" class="signal" marker-end="url(#arrow)" />
  <line x1="675.0" y1="150.0" x2="735.0" y2="150.0" class="signal" marker-end="url(#arrow)" />
  <line x1="595.0" y1="78.0" x2="595.0" y2="112.0" class="disturbance" marker-end="url(#arrow)" />
  <text x="595.0" y="69.0" class="note" text-anchor="middle">Door + wall heat disturbance</text>
  <line x1="791.0" y1="188.0" x2="791.0" y2="244.0" class="signal" />
  <line x1="791.0" y1="244.0" x2="135.0" y2="244.0" class="signal" />
  <text x="463.0" y="265.0" class="note" text-anchor="middle">Temperature is observed; Lesson 2 uses it for automatic feedback</text>
  <text x="55.0" y="292.0" class="note" text-anchor="start">Desired temperature: 2 °C · Measured temperature: sensor reading</text>
</svg>
