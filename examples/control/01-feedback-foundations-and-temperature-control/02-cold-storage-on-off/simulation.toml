[simulation]
enabled = true
seed = 20260828
time_scale = 1
max_plant_substeps_per_cycle = 100
plant_trace_capacity = 2000
plant_step_ms = 100

# One thermal store, with independent refrigeration and surroundings inputs.
# Same balance as the former first_order plant:
# dT/dt = (surroundings - T - 0.05 * compressor_encoding) / 20.
# ST confines compressor_encoding to 0 (OFF) or 100 (ON). No shared actuator
# clamp: surroundings is a temperature, not an actuator command.
[[plants]]
id = "cold-storage-room"
model = "state_space"
command_sources = ["%QL0", "%QL8"]
feedback_targets = ["%IL0"]
initial_state = [4.0]
initial_input = [0.0, 4.0]

[plants.parameters]
a = [[-0.05]]
b = [[-0.0025, 0.05]]
c = [[1.0]]
d = [[0.0, 0.0]]

# Publish the door state and effective surroundings for observation.
# ST owns their timing; no scenario event runs while the learner prepares.
[[plants]]
id = "door-open-indication"
model = "static_gain"
command_sources = ["%QL16"]
feedback_targets = ["%IL8"]
initial_input = [0.0]

[plants.parameters]
gain = 1.0

[[plants]]
id = "effective-surroundings"
model = "static_gain"
command_sources = ["%QL8"]
feedback_targets = ["%IL16"]
initial_input = [4.0]

[plants.parameters]
gain = 1.0
