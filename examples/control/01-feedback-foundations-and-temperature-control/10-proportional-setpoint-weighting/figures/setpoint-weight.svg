<svg xmlns="http://www.w3.org/2000/svg" width="900" height="330" viewBox="0 0 900 330" role="img" aria-labelledby="title desc">
  <title id="title">Proportional setpoint weighting</title>
  <desc id="desc">The target-change path is multiplied by setpoint weight, while the measured-temperature-change path enters proportional action at full strength.</desc>
  <rect width="900" height="330" rx="24" fill="#f8fafc"/>
  <rect x="45" y="45" width="210" height="80" rx="14" fill="#dbeafe"/>
  <text x="150" y="79" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="700" fill="#172033">Target change</text>
  <text x="150" y="106" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#172033">multiplied by b</text>
  <rect x="45" y="205" width="210" height="80" rx="14" fill="#dcfce7"/>
  <text x="150" y="239" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="700" fill="#172033">Measurement change</text>
  <text x="150" y="266" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#172033">full response</text>
  <circle cx="430" cy="165" r="48" fill="#fef3c7"/>
  <text x="430" y="158" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="700" fill="#172033">combine</text>
  <text x="430" y="183" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#172033">bΔSP − ΔPV</text>
  <rect x="610" y="125" width="240" height="80" rx="14" fill="#fee2e2"/>
  <text x="730" y="159" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="700" fill="#172033">Proportional change</text>
  <text x="730" y="186" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#172033">multiply by gain</text>
  <line x1="255" y1="85" x2="388" y2="140" stroke="#475569" stroke-width="3"/>
  <polygon points="392,142 378,143 383,130" fill="#475569"/>
  <line x1="255" y1="245" x2="388" y2="190" stroke="#475569" stroke-width="3"/>
  <polygon points="392,188 383,200 378,187" fill="#475569"/>
  <line x1="478" y1="165" x2="600" y2="165" stroke="#475569" stroke-width="3"/>
  <polygon points="610,165 596,158 596,172" fill="#475569"/>
</svg>
