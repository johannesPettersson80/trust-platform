<svg xmlns="http://www.w3.org/2000/svg" width="900" height="542" viewBox="0 0 900 542" role="img" aria-labelledby="title desc">
  <title id="title">Estimating tank 1 with an observer</title>
  <desc id="desc">After a slug of water that the observers do not know about, the observer with gain 0.48 and 0.28 brings its estimate within 2 millimetres of tank 1 from 22 seconds, the faster one from 12 seconds; with readings 5 millimetres off in alternate directions the slower observer stays within 2 millimetres from 30 seconds while the faster one swings up to 9.6 millimetres.</desc>
