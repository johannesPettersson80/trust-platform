<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img" aria-labelledby="title desc">
  <title id="title">Minimum controller selection tree</title>
  <desc id="desc">Binary actuators use on-off control. Continuous plants use P, PI, PD, or PID according to integration, steady error, damping, and holding-load requirements.</desc>
  <rect x="1" y="1" width="958" height="418" rx="16" fill="#f7f9fc" stroke="#d8e0eb"/>
  <text x="480" y="38" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#243044">Give every controller action one necessary job</text>
  <rect x="365" y="65" width="230" height="55" rx="10" fill="#dcecff"/>
  <text x="480" y="98" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#243044">What can the actuator do?</text>
  <line x1="410" y1="120" x2="215" y2="165" stroke="#526078" stroke-width="2"/>
  <line x1="550" y1="120" x2="725" y2="165" stroke="#526078" stroke-width="2"/>
  <rect x="75" y="165" width="280" height="75" rx="10" fill="#dff3e8"/>
  <text x="215" y="195" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#243044">Only OFF or ON</text>
  <text x="215" y="222" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#08754f">ON/OFF + hysteresis + dwell</text>
  <rect x="585" y="165" width="280" height="75" rx="10" fill="#fff0d8"/>
  <text x="725" y="195" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#243044">Continuously adjustable</text>
  <text x="725" y="222" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#243044">What physical actions are needed?</text>
  <line x1="725" y1="240" x2="725" y2="275" stroke="#526078" stroke-width="2"/>
  <line x1="190" y1="275" x2="835" y2="275" stroke="#526078" stroke-width="2"/>
  <line x1="190" y1="275" x2="190" y2="305" stroke="#526078" stroke-width="2"/>
  <line x1="405" y1="275" x2="405" y2="305" stroke="#526078" stroke-width="2"/>
  <line x1="620" y1="275" x2="620" y2="305" stroke="#526078" stroke-width="2"/>
  <line x1="835" y1="275" x2="835" y2="305" stroke="#526078" stroke-width="2"/>
  <rect x="95" y="305" width="190" height="80" rx="10" fill="#eef2f7"/>
  <rect x="310" y="305" width="190" height="80" rx="10" fill="#eef2f7"/>
  <rect x="525" y="305" width="190" height="80" rx="10" fill="#eef2f7"/>
  <rect x="740" y="305" width="190" height="80" rx="10" fill="#eef2f7"/>
  <text x="190" y="335" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#243044">P</text>
  <text x="190" y="362" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#526078">immediate correction</text>
  <text x="405" y="335" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#243044">PI</text>
  <text x="405" y="362" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#526078">+ learned holding effort</text>
  <text x="620" y="335" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#243044">PD</text>
  <text x="620" y="362" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#526078">+ motion damping</text>
  <text x="835" y="335" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#243044">PID</text>
  <text x="835" y="362" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#526078">damping + holding effort</text>
</svg>
