<svg xmlns="http://www.w3.org/2000/svg" width="900" height="230" viewBox="0 0 900 230" role="img" aria-labelledby="title2 desc2">
<title id="title2">Overhead crane, magnetic bearing, and boiler drum</title>
<desc id="desc2">Simple schematics of the three machines appearing for the first time in this course: an overhead crane with a suspended payload, a rotor centered by opposing electromagnet coils, and a boiler drum with feedwater in and steam out.</desc>
<defs>
  <marker id="arrow-o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#d55e00"/></marker>
  <marker id="arrow-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8792a5"/></marker>
</defs>
<rect width="900" height="230" rx="14" fill="#f7f9fc" stroke="#d8e0eb"/>
<g font-family="system-ui, sans-serif" fill="#243044">
<line x1="60" y1="90" x2="270" y2="90" stroke="#526078" stroke-width="4"/><rect x="140" y="80" width="50" height="26" fill="#eff6ff" stroke="#1268b3" stroke-width="2"/><line x1="165" y1="106" x2="165" y2="160" stroke="#526078" stroke-width="2" stroke-dasharray="4 3"/><circle cx="165" cy="175" r="16" fill="#fff7ed" stroke="#d55e00" stroke-width="2"/><text x="165" y="55" text-anchor="middle" font-size="15" font-weight="700">Overhead crane</text><text x="165" y="205" text-anchor="middle" font-size="12" fill="#526078">trolley force -&gt; payload position</text><circle cx="450" cy="140" r="34" fill="#eff6ff" stroke="#1268b3" stroke-width="2"/><rect x="405" y="128" width="20" height="24" fill="#fff7ed" stroke="#d55e00" stroke-width="2"/><rect x="475" y="128" width="20" height="24" fill="#fff7ed" stroke="#d55e00" stroke-width="2"/><text x="450" y="55" text-anchor="middle" font-size="15" font-weight="700">Magnetic bearing</text><text x="450" y="205" text-anchor="middle" font-size="12" fill="#526078">coil force -&gt; rotor displacement</text><rect x="640" y="95" width="180" height="90" rx="16" fill="#eff6ff" stroke="#1268b3" stroke-width="2"/><line x1="730" y1="95" x2="730" y2="185" stroke="#8792a5" stroke-width="1.5" stroke-dasharray="4 3"/><line x1="600" y1="130" x2="645" y2="130" stroke="#d55e00" stroke-width="3" marker-end="url(#arrow-o)"/><text x="598" y="122" text-anchor="end" font-size="12" fill="#d55e00">feedwater</text><line x1="815" y1="105" x2="850" y2="90" stroke="#8792a5" stroke-width="3" marker-end="url(#arrow-g)"/><text x="820" y="82" font-size="12" fill="#526078">steam out</text><text x="730" y="55" text-anchor="middle" font-size="15" font-weight="700">Boiler drum</text><text x="730" y="205" text-anchor="middle" font-size="12" fill="#526078">feedwater -&gt; drum level</text>
</g>
</svg>
