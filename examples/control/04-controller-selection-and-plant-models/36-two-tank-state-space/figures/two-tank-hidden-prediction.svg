<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" data-stage="pre-commit" viewBox="0 0 900 420">
<title id="title">Commit a prediction from identical visible readings</title>
<desc id="desc">Cases A and B both show zero centimetres downstream. Their upstream states and future traces remain hidden.</desc>
<rect width="900" height="420" fill="#f7f9fc"/>
<style>text{font-family:system-ui,-apple-system,sans-serif;fill:#243044}.tank{fill:#eaf2fb;stroke:#526078;stroke-width:2}.hidden{fill:#eef0f4;stroke:#8792a5;stroke-width:2;stroke-dasharray:7 5}.line{stroke:#526078;stroke-width:3}.blank{fill:#fff;stroke:#8792a5;stroke-width:1.5}</style>
<text x="55" y="45" font-size="24" font-weight="700">Do identical current outputs imply identical future outputs?</text>
<text x="55" y="72" font-size="14">Only the current downstream level is visible. Record your prediction before opening the reveal.</text>
<text x="245" y="112" text-anchor="middle" font-size="18" font-weight="700">Case A</text><rect x="135" y="135" width="220" height="85" rx="8" class="hidden"/><text x="245" y="183" text-anchor="middle" font-size="16">upstream state hidden</text><line x1="245" y1="220" x2="245" y2="255" class="line"/><rect x="135" y="255" width="220" height="85" rx="8" class="tank"/><text x="245" y="296" text-anchor="middle" font-size="16">downstream level</text><text x="245" y="322" text-anchor="middle" font-size="20" font-weight="700">0.000 cm</text><text x="655" y="112" text-anchor="middle" font-size="18" font-weight="700">Case B</text><rect x="545" y="135" width="220" height="85" rx="8" class="hidden"/><text x="655" y="183" text-anchor="middle" font-size="16">upstream state hidden</text><line x1="655" y1="220" x2="655" y2="255" class="line"/><rect x="545" y="255" width="220" height="85" rx="8" class="tank"/><text x="655" y="296" text-anchor="middle" font-size="16">downstream level</text><text x="655" y="322" text-anchor="middle" font-size="20" font-weight="700">0.000 cm</text>
<rect x="135" y="365" width="630" height="36" rx="5" class="blank"/><text x="150" y="389" font-size="14">Prediction and reason:</text>
</svg>
