[simulation]
enabled = true
seed = 20260829
time_scale = 1
max_plant_substeps_per_cycle = 100
plant_trace_capacity = 1000
plant_step_ms = 100

# 24 copies of the coupled vessels of Lesson 71, states relative to 20 °C, with wall coupling Hc = 6, 8 or 10 kW/°C:
#   50·dT1/dt = 2·u1 − 10·(T1 − 20) − Hc·(T1 − T2) − D1,   50·dT2/dt = 2·u2 − 10·(T2 − 20) + Hc·(T1 − T2) − D2,
# at rest at 35 °C with both heaters at 75 %. Ids: architecture (pi paired, dc decoupled), Hc, event (t1/t2 target on
# vessel 1/2, l1/l2 10 kW load on vessel 1/2). Every plant reads its loads from two shared addresses: the load (%QL384)
# or none (%QL392).

