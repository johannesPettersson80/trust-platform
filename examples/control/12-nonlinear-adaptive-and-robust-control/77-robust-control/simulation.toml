[simulation]
enabled = true
seed = 20260829
time_scale = 1
max_plant_substeps_per_cycle = 100
plant_trace_capacity = 2400
plant_step_ms = 100

# The nominal heater of the range: 50·dT/dt = 2·u(t − 1 s) − 10·(T − 20) − D, with T in °C, the command u in points
# delivered 1 s late and an extraction D in kW, which acts at once. It rests at 35 °C with 75 %. Control Studio's validation
# runs the corner heaters of the range, 8 and 12 kW/°C with 0.8 and 1.2 s, as declared models in control-loop.json.
[[plants]]
id = "nominal-heater"
model = "state_space"
command_sources = ["%QL0", "%QL8"]
feedback_targets = ["%IL0", "%IL8"]
# Both feedback bindings observe the water.
initial_state = [0.0]
initial_input = [0.0, 0.0]
input_offset = [-75.0, 0.0]
output_offset = [35.0, 35.0]

[plants.parameters]
a = [[-0.2]]
b = [[0.04, -0.02]]
c = [[1.0], [1.0]]
d = [[0.0, 0.0], [0.0, 0.0]]
input_delays_s = [1.0, 0.0]
