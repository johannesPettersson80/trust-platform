version = 1

[theme]
style = "industrial"
accent = "#c2410c"

[layout]
navigation = "sidebar-left"
header = true
header_title = "P1 HMI"

[write]
enabled = false
allow = []

[[alarm]]
bind = "P1.IntegralCorrection"
high = 100
low = 0
deadband = 2
inferred = true
label = "Integral Correction"

[[alarm]]
bind = "P1.LowPTemperature"
high = 120
low = 0
deadband = 2.4
inferred = true
label = "LOW Ptemperature"

