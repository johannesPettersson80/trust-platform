bind = "P1.LowPValve"
high = 100
low = 0
deadband = 2
inferred = true
label = "LOW Pvalve"

[[alarm]]
bind = "P1.PiTemperature"
high = 120
low = 0
deadband = 2.4
inferred = true
label = "PI Temperature"

[[alarm]]
bind = "P1.PiValve"
high = 100
low = 0
deadband = 2
inferred = true
label = "PI Valve"

[[alarm]]
bind = "P1.SelectedPTemperature"
high = 120
low = 0
deadband = 2.4
inferred = true
label = "Selected Ptemperature"

[[alarm]]
bind = "P1.SelectedPValve"
high = 100
low = 0
deadband = 2
inferred = true
label = "Selected Pvalve"

[[alarm]]
bind = "P1.TargetTemperature"
