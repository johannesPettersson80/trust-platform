<svg xmlns="http://www.w3.org/2000/svg" width="900" height="685" viewBox="0 0 900 685" role="img" aria-labelledby="title desc">
  <title id="title">Fixed and scheduled integral gains</title>
  <desc id="desc">After a 0.02 metre setpoint step, the fixed integral gain designed at 0.25 metres is too slow at 0.09 metres, still 0.0032 metres short after 30 seconds, while the scheduled gain brings the level within 0.002 metres after 22 to 24 seconds at all three levels; the scheduled integral gain at 0.09 metres falls from 0.00333 to 0.00301 as the level rises.</desc>
