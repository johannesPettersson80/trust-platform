[simulation]
enabled = true
seed = 20260829
time_scale = 1
max_plant_substeps_per_cycle = 100
plant_trace_capacity = 4000
plant_step_ms = 100

# One valve, two pressure arrangements, both driven by the same stem request. The motor moves the
# stem at 0.5 % per second; flow follows the reached opening.

# Regulated arrangement: a regulator holds 100 kPa across the valve, so q = 2z kg/s.
[[plants]]
id = "valve-regulated-flow"
model = "piecewise_linear"
command_sources = ["%QL0"]
feedback_targets = ["%IL0"]
actuator_feedback_targets = [{ address = "%IL16" }]
initial_input = [75.0]

[plants.parameters]
input_points = [0.000000, 5.000000, 10.000000, 15.000000, 20.000000, 25.000000, 30.000000, 35.000000, 40.000000, 45.000000, 50.000000, 55.000000, 60.000000, 65.000000, 70.000000, 75.000000, 80.000000, 85.000000, 90.000000, 95.000000, 100.000000]
output_points = [0.000000, 0.100000, 0.200000, 0.300000, 0.400000, 0.500000, 0.600000, 0.700000, 0.800000, 0.900000, 1.000000, 1.100000, 1.200000, 1.300000, 1.400000, 1.500000, 1.600000, 1.700000, 1.800000, 1.900000, 2.000000]

[plants.actuator]
minimum = 0.0
maximum = 100.0
rate_up_per_s = 0.5
rate_down_per_s = 0.5
initial_applied = 75.0

[[plants.uncertainties]]
id = "valve-regulated-flow-noise"
target = "measurement"
channel = 0
mode = "add"
generator = "uniform_white"
minimum = -0.005
maximum = 0.005

# Pressure across the valve in the regulated arrangement.
[[plants]]
id = "valve-regulated-pressure"
model = "piecewise_linear"
command_sources = ["%QL8"]
feedback_targets = ["%IL24"]
initial_input = [75.0]

[plants.parameters]
input_points = [0.000000, 5.000000, 10.000000, 15.000000, 20.000000, 25.000000, 30.000000, 35.000000, 40.000000, 45.000000, 50.000000, 55.000000, 60.000000, 65.000000, 70.000000, 75.000000, 80.000000, 85.000000, 90.000000, 95.000000, 100.000000]
output_points = [100.000000, 100.000000, 100.000000, 100.000000, 100.000000, 100.000000, 100.000000, 100.000000, 100.000000, 100.000000, 100.000000, 100.000000, 100.000000, 100.000000, 100.000000, 100.000000, 100.000000, 100.000000, 100.000000, 100.000000, 100.000000]

[plants.actuator]
minimum = 0.0
maximum = 100.0
rate_up_per_s = 0.5
rate_down_per_s = 0.5
initial_applied = 75.0

# Fixed supply: 128.125 kPa total; the pipe loses 12.5 q^2, so q = 2z sqrt(1.28125/(1 + 0.5 z^2)).
