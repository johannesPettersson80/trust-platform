[simulation]
enabled = true
seed = 20260829
time_scale = 1
max_plant_substeps_per_cycle = 100
plant_trace_capacity = 1000
plant_step_ms = 100

# Two copies of the calibrated additive pump, 1 s·dq/dt + q = 0.2·u: flow q in L/min for the command u in % (0–100),
# at 10 L/min with 50 %. The first follows a carrier step, the second a carrier stop. The flow is measured exactly.
[[plants]]
id = "additive-pump-step"
model = "state_space"
command_sources = ["%QL0"]
feedback_targets = ["%IL0"]
initial_state = [10.0]
initial_input = [50.0]
actuators = [{ minimum = 0.0, maximum = 100.0, initial_applied = 50.0 }]

[plants.parameters]
a = [[-1.0]]
b = [[0.2]]
c = [[1.0]]
d = [[0.0]]

[[plants]]
id = "additive-pump-stop"
model = "state_space"
command_sources = ["%QL8"]
feedback_targets = ["%IL8"]
initial_state = [10.0]
initial_input = [50.0]
actuators = [{ minimum = 0.0, maximum = 100.0, initial_applied = 50.0 }]

[plants.parameters]
a = [[-1.0]]
b = [[0.2]]
c = [[1.0]]
d = [[0.0]]
