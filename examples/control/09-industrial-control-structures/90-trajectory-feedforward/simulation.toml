[simulation]
enabled = true
seed = 20260829
time_scale = 1
max_plant_substeps_per_cycle = 100
plant_trace_capacity = 2500
plant_step_ms = 5

# The drum axis of Lessons 34–42: J·dω/dt = u − B·ω, dθ/dt = ω with J = 1 kg·m² and B = 1 N·m·s/rad.
# Input: motor torque (%QL0); output: angle (%IL0).
[[plants]]
id = "drum-axis"
model = "state_space"
command_sources = ["%QL0"]
feedback_targets = ["%IL0"]
initial_state = [0.0, 0.0]

[plants.parameters]
a = [[0.0, 1.0], [0.0, -1.0]]
b = [[0.0], [1.0]]
c = [[1.0, 0.0]]
d = [[0.0]]

# The encoder reads within ±0.001 rad.
[[plants.uncertainties]]
id = "angle-noise"
target = "measurement"
channel = 0
mode = "add"
generator = "uniform_white"
minimum = -0.001
maximum = 0.001
