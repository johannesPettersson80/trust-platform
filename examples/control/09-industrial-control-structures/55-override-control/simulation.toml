[simulation]
enabled = true
seed = 20260829
time_scale = 1
max_plant_substeps_per_cycle = 100
plant_trace_capacity = 1000
plant_step_ms = 100

# Three copies of the heater-only jacketed vessel of Lesson 63, states relative to the 20 °C surroundings:
#   5·dTj/dt = 2·u − 10·(Tj − Tv),   50·dTv/dt = 10·(Tj − Tv) − 2·(Tv − 20),
# at rest at Tj = 38 °C, Tv = 35 °C with u = 15 %. Input: heater command u in % (0–100); outputs: jacket and vessel
# temperatures, read exactly.

[[plants]]
id = "vessel-pi-alone"
model = "state_space"
command_sources = ["%QL0"]
feedback_targets = ["%IL0", "%IL8"]
initial_state = [18.0, 15.0]
initial_input = [15.0]
output_offset = [20.0, 20.0]
actuators = [{ minimum = 0.0, maximum = 100.0, initial_applied = 15.0 }]

[plants.parameters]
a = [[-2.0, 2.0], [0.2, -0.24]]
b = [[0.4], [0.0]]
c = [[1.0, 0.0], [0.0, 1.0]]
d = [[0.0], [0.0]]

