[simulation]
enabled = true
seed = 20260829
time_scale = 1
max_plant_substeps_per_cycle = 100
plant_trace_capacity = 1000
plant_step_ms = 20

# Two copies of the shaft of Lessons 34–35: J·dω/dt = u − B·ω, dθ/dt = ω with J = 1 kg·m² and B = 1 N·m·s/rad.
# The candidate gain drives the first (torque %QL0; angle %IL0, velocity %IL8), the alternative gain the second
# (torque %QL8; angle %IL16, velocity %IL24).
[[plants]]
id = "shaft-j1-b1"
model = "state_space"
command_sources = ["%QL0"]
feedback_targets = ["%IL0", "%IL8"]
initial_state = [0.0, 0.0]

[plants.parameters]
a = [[0.0, 1.0], [0.0, -1.0]]
b = [[0.0], [1.0]]
c = [[1.0, 0.0], [0.0, 1.0]]
d = [[0.0], [0.0]]

[[plants]]
id = "alternative-shaft-j1-b1"
model = "state_space"
command_sources = ["%QL8"]
feedback_targets = ["%IL16", "%IL24"]
initial_state = [0.0, 0.0]

[plants.parameters]
a = [[0.0, 1.0], [0.0, -1.0]]
b = [[0.0], [1.0]]
c = [[1.0, 0.0], [0.0, 1.0]]
d = [[0.0], [0.0]]
