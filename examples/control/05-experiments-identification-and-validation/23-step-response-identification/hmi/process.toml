title = "Process"
icon = "workflow"
order = 20
kind = "process"
svg = "process.auto.svg"

[[bind]]
selector = "#pid-main-line"
attribute = "stroke"
source = "P1.ExperimentRunning"
map = { "false" = "#94a3b8", "true" = "#2563eb" }

[[bind]]
selector = "#pid-pump-indicator"
attribute = "fill"
source = "P1.ExperimentRunning"
map = { "false" = "#ef4444", "true" = "#22c55e" }

[[bind]]
selector = "#pid-main-line"
attribute = "stroke"
source = "P1.ExperimentEnabled"
map = { "false" = "#94a3b8", "true" = "#2563eb" }

[[bind]]
selector = "#pid-pump-indicator"
attribute = "fill"
source = "P1.ExperimentEnabled"
map = { "false" = "#ef4444", "true" = "#22c55e" }

[[bind]]
selector = "#pid-product-level-fill"
attribute = "height"
source = "P1.OutletTemperature"
scale = { min = 0, max = 120, output_min = 0, output_max = 280 }

[[bind]]
selector = "#pid-product-level-fill"
attribute = "y"
source = "P1.OutletTemperature"
scale = { min = 0, max = 120, output_min = 480, output_max = 200 }

[[bind]]
selector = "#pid-product-level-value"
attribute = "text"
source = "P1.OutletTemperature"
format = "{} %"