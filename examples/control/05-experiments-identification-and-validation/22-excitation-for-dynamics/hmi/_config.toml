version = 1

[theme]
style = "industrial"
accent = "#c2410c"

[layout]
navigation = "sidebar-left"
header = true
header_title = "P1 HMI"

[write]
enabled = false
allow = []

[[alarm]]
bind = "P1.AppliedTorque"
high = 100
low = 0
deadband = 2
inferred = true
label = "Applied Torque"

[[alarm]]
bind = "P1.DrivePosition"
high = 100
low = 0
deadband = 2
inferred = true
label = "Drive Position"

[[alarm]]
bind = "P1.ElapsedSeconds"
high = 100
low = 0
deadband = 2
inferred = true
label = "Elapsed Seconds"

[[alarm]]
bind = "P1.NaturalFrequencyHz"
high = 100
low = 0
deadband = 2
inferred = true
label = "Natural Frequency HZ"

[[alarm]]
bind = "P1.RequestedTorque"
high = 100
low = 0
deadband = 2
inferred = true
label = "Requested Torque"
