<svg xmlns="http://www.w3.org/2000/svg" width="940" height="290" viewBox="0 0 940 290" role="img" aria-labelledby="title desc">
  <title id="title">Five excitation patterns and their purposes</title>
  <desc id="desc">Step for final response, pulse for temporary response, ramp for rate dependence, relay for critical cycle, and multisine for several frequencies.</desc>
  <rect x="1" y="1" width="938" height="288" rx="16" fill="#f7f9fc" stroke="#d8e0eb"/>
  <text x="470" y="38" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#243044">Choose the pattern from the question</text>
  <rect x="25" y="75" width="165" height="170" rx="10" fill="#dcecff"/>
  <rect x="205" y="75" width="165" height="170" rx="10" fill="#dff3e8"/>
  <rect x="385" y="75" width="165" height="170" rx="10" fill="#fff0d8"/>
  <rect x="565" y="75" width="165" height="170" rx="10" fill="#f1e6ff"/>
  <rect x="745" y="75" width="170" height="170" rx="10" fill="#ffe6e6"/>
  <text x="107" y="110" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#243044">Step</text>
  <text x="287" y="110" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#243044">Pulse</text>
  <text x="467" y="110" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#243044">Ramp</text>
  <text x="647" y="110" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#243044">Relay</text>
  <text x="830" y="110" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#243044">Multisine</text>
  <line x1="45" y1="165" x2="90" y2="165" stroke="#0072b2" stroke-width="4"/><line x1="90" y1="165" x2="90" y2="135" stroke="#0072b2" stroke-width="4"/><line x1="90" y1="135" x2="170" y2="135" stroke="#0072b2" stroke-width="4"/>
  <line x1="225" y1="165" x2="260" y2="165" stroke="#009e73" stroke-width="4"/><line x1="260" y1="165" x2="260" y2="135" stroke="#009e73" stroke-width="4"/><line x1="260" y1="135" x2="315" y2="135" stroke="#009e73" stroke-width="4"/><line x1="315" y1="135" x2="315" y2="165" stroke="#009e73" stroke-width="4"/><line x1="315" y1="165" x2="350" y2="165" stroke="#009e73" stroke-width="4"/>
  <line x1="405" y1="175" x2="530" y2="125" stroke="#d55e00" stroke-width="4"/>
  <line x1="585" y1="140" x2="625" y2="140" stroke="#7c4db3" stroke-width="4"/><line x1="625" y1="140" x2="625" y2="180" stroke="#7c4db3" stroke-width="4"/><line x1="625" y1="180" x2="675" y2="180" stroke="#7c4db3" stroke-width="4"/><line x1="675" y1="180" x2="675" y2="140" stroke="#7c4db3" stroke-width="4"/><line x1="675" y1="140" x2="710" y2="140" stroke="#7c4db3" stroke-width="4"/>
  <line x1="765" y1="160" x2="785" y2="135" stroke="#c33" stroke-width="3"/><line x1="785" y1="135" x2="805" y2="180" stroke="#c33" stroke-width="3"/><line x1="805" y1="180" x2="825" y2="125" stroke="#c33" stroke-width="3"/><line x1="825" y1="125" x2="845" y2="175" stroke="#c33" stroke-width="3"/><line x1="845" y1="175" x2="865" y2="140" stroke="#c33" stroke-width="3"/><line x1="865" y1="140" x2="895" y2="160" stroke="#c33" stroke-width="3"/>
  <text x="107" y="220" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#526078">final response</text>
  <text x="287" y="220" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#526078">temporary response</text>
  <text x="467" y="220" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#526078">rate dependence</text>
  <text x="647" y="220" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#526078">critical cycle</text>
  <text x="830" y="220" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#526078">several frequencies</text>
</svg>
