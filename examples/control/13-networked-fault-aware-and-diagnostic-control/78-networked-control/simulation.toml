[simulation]
enabled = true
seed = 20260829
time_scale = 1
max_plant_substeps_per_cycle = 100
plant_trace_capacity = 2000
plant_step_ms = 100

# Lesson 13's heater, six times: 50·dT/dt = 2·u(t − 1) − 10·(T − 20), T in °C, u the command in points delivered 1 s late.
# Each rests at 35 °C with 75 %. The six differ only in what the network does to their remote commands after 5 s.

