initial_input = [75.0]
output_offset = [20.0]
actuators = [{ minimum = 0.0, maximum = 100.0, initial_applied = 75.0 }]

[plants.parameters]
a = [[-0.2]]
b = [[0.04]]
c = [[1.0]]
d = [[0.0]]
