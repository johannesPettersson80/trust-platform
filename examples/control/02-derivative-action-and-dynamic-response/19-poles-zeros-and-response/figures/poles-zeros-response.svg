<svg xmlns="http://www.w3.org/2000/svg" width="960" height="470" viewBox="0 0 960 470" role="img" aria-labelledby="title desc">
  <title id="title">Poles, a zero, and their response signatures</title>
  <desc id="desc">A complex plane shows negative, origin, complex poles and a positive zero beside response sketches for settling, integrating, oscillating, and inverse motion.</desc>
  <rect width="960" height="470" fill="#ffffff"/>
  <text x="55" y="42" font-family="sans-serif" font-size="27" fill="#20252b">Poles create natural modes; zeros reshape the measured response</text>

  <text x="180" y="88" font-family="sans-serif" font-size="22" fill="#20252b">complex s-plane</text>
  <line x1="60" y1="245" x2="430" y2="245" stroke="#424b55" stroke-width="2"/>
  <line x1="280" y1="90" x2="280" y2="395" stroke="#424b55" stroke-width="2"/>
  <text x="390" y="270" font-family="sans-serif" font-size="18" fill="#424b55">real</text>
  <text x="292" y="112" font-family="sans-serif" font-size="18" fill="#424b55">imaginary</text>
  <text x="90" y="375" font-family="sans-serif" font-size="18" fill="#424b55">decaying side</text>
  <text x="320" y="375" font-family="sans-serif" font-size="18" fill="#424b55">growing side</text>
  <line x1="145" y1="230" x2="165" y2="250" stroke="#2374ab" stroke-width="5"/><line x1="165" y1="230" x2="145" y2="250" stroke="#2374ab" stroke-width="5"/>
  <line x1="270" y1="235" x2="290" y2="255" stroke="#2374ab" stroke-width="5"/><line x1="290" y1="235" x2="270" y2="255" stroke="#2374ab" stroke-width="5"/>
  <line x1="195" y1="155" x2="215" y2="175" stroke="#2374ab" stroke-width="5"/><line x1="215" y1="155" x2="195" y2="175" stroke="#2374ab" stroke-width="5"/>
  <line x1="195" y1="315" x2="215" y2="335" stroke="#2374ab" stroke-width="5"/><line x1="215" y1="315" x2="195" y2="335" stroke="#2374ab" stroke-width="5"/>
  <circle cx="355" cy="245" r="11" fill="#ffffff" stroke="#d76720" stroke-width="5"/>
  <text x="340" y="218" font-family="sans-serif" font-size="18" fill="#d76720">zero</text>

  <text x="625" y="88" font-family="sans-serif" font-size="22" fill="#20252b">visible responses</text>
  <line x1="500" y1="390" x2="900" y2="390" stroke="#89939e"/>
  <line x1="500" y1="105" x2="500" y2="390" stroke="#89939e"/>
  <line x1="500" y1="350" x2="560" y2="270" stroke="#2374ab" stroke-width="5"/><line x1="560" y1="270" x2="640" y2="230" stroke="#2374ab" stroke-width="5"/><line x1="640" y1="230" x2="720" y2="220" stroke="#2374ab" stroke-width="5"/>
  <text x="720" y="225" font-family="sans-serif" font-size="17" fill="#2374ab">settles</text>
  <line x1="500" y1="350" x2="880" y2="120" stroke="#507d42" stroke-width="4"/>
  <text x="800" y="110" font-family="sans-serif" font-size="17" fill="#507d42">integrates</text>
  <line x1="500" y1="350" x2="545" y2="160" stroke="#6954a3" stroke-width="4"/><line x1="545" y1="160" x2="590" y2="310" stroke="#6954a3" stroke-width="4"/><line x1="590" y1="310" x2="635" y2="200" stroke="#6954a3" stroke-width="4"/><line x1="635" y1="200" x2="680" y2="275" stroke="#6954a3" stroke-width="4"/><line x1="680" y1="275" x2="735" y2="230" stroke="#6954a3" stroke-width="4"/>
  <text x="745" y="255" font-family="sans-serif" font-size="17" fill="#6954a3">oscillates</text>
  <line x1="500" y1="350" x2="555" y2="380" stroke="#d76720" stroke-width="4"/><line x1="555" y1="380" x2="630" y2="330" stroke="#d76720" stroke-width="4"/><line x1="630" y1="330" x2="720" y2="285" stroke="#d76720" stroke-width="4"/>
  <text x="730" y="290" font-family="sans-serif" font-size="17" fill="#d76720">inverse</text>
</svg>
