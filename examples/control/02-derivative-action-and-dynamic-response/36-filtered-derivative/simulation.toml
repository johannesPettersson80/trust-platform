[simulation]
enabled = true
seed = 20260828
time_scale = 1
max_plant_substeps_per_cycle = 100
plant_trace_capacity = 2500
plant_step_ms = 20

[[plants]]
id = "encoder-servo-positioning-table"
model = "robot_joint"
command_sources = ["%QL0"]
feedback_targets = ["%IL0", "%IL8"]
initial_state = [0.0, 0.0]

[plants.parameters]
inertia_kg_m2 = 1.0
gravity_torque_nm = 4.0
viscous_friction_nm_s_per_rad = 1.0
coulomb_friction_nm = 0.0
friction_smoothing_rad_s = 0.01

[plants.actuator]
minimum = -10.0
maximum = 10.0

[[plants.uncertainties]]
id = "encoder-noise"
target = "measurement"
channel = 0
mode = "add"
generator = "normal_approx_white"
standard_deviation = 0.002
