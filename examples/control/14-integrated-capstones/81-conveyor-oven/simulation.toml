[simulation]
enabled = true
seed = 20260829
time_scale = 1
max_plant_substeps_per_cycle = 100
plant_trace_capacity = 6000
plant_step_ms = 100

[[plants]]
id = "ordinary-conveyor-oven-capstone"
name = "Conveyor oven with accepted ordinary PI"
description = "Delayed product-temperature path using the strongest robust ordinary feedback design."
model = "first_order_dead_time"
command_sources = ["%QL24"]
feedback_targets = ["%IL0"]
initial_state = [20.0]
[plants.parameters]
gain = 0.8
time_constant_s = 12.0
dead_time_s = 16.0
input_bias = 0.0
output_bias = 20.0
[[plants.uncertainties]]
id = "ordinary-temperature-noise"
target = "measurement"
channel = 0
mode = "add"
generator = "normal_approx_white"
standard_deviation = 0.08

[[plants]]
