[simulation]
enabled = true
seed = 20260929
time_scale = 1
max_plant_substeps_per_cycle = 100
plant_trace_capacity = 1000
plant_step_ms = 100

# A cold room cooled by a compressor that is either off or on:
#   60·dT/dt = −(T − 12) − 0.1·u,   u = compressor power in % (0 or 100),
# so the room rests at 12 °C with the compressor off and would settle at 2 °C with it on.
[[plants]]
id = "cold-room"
model = "first_order"
command_sources = ["%QL0"]
feedback_targets = ["%IL0"]
initial_state = [0.0]
initial_input = [0.0]
output_offset = [12.0]

[plants.parameters]
gain = -0.1
time_constant_s = 60.0
