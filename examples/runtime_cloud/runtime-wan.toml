[bundle]
version = 1

[resource]
name = "runtime_wan"
cycle_interval_ms = 100

[runtime.control]
mode = "production"
debug_enabled = false
# Token authentication on the web needs runtime.control.auth_token: add your own before the first
# start. The examples commit no token.

[runtime.web]
enabled = true
listen = "0.0.0.0:19443"
auth = "token"
tls = true

[runtime.tls]
mode = "provisioned"
cert_path = "./certs/runtime.crt"
key_path = "./certs/runtime.key"
ca_path = "./certs/ca.crt"
require_remote = true

[runtime.discovery]
enabled = true
service_name = "runtime_wan"
advertise = true
interfaces = ["eth0"]

[runtime.mesh]
enabled = true
role = "peer"
listen = "0.0.0.0:6200"
connect = []
tls = true
auth_token = "REPLACE_WITH_LONG_RANDOM_TOKEN"
zenohd_version = "1.7.2"
plugin_versions = {}
publish = []
subscribe = {}

[runtime.cloud]
profile = "wan"
site = "site-a"

[runtime.cloud.wan]
allow_write = [
  { action = "cfg_apply", target = "site-b/*" },
  { action = "cmd_invoke", target = "site-b/boiler_1" }
]

[runtime.log]
level = "info"

[runtime.retain]
mode = "none"
save_interval_ms = 1000

[runtime.watchdog]
enabled = false
timeout_ms = 5000
action = "halt"

[runtime.fault]
policy = "halt"
