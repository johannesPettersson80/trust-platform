[simulation]
enabled = true
seed = 20261002
time_scale = 1
plant_step_ms = 100
max_plant_substeps_per_cycle = 100
plant_trace_capacity = 2000

# Tank T-101: a gravity-drained tank of 0.2 m² with an outlet of c = 0.02 m^(5/2)/s. Input: the
# inflow in m³/s; output: the level in m. It starts at rest at 1.5 m with its holding inflow c·√h.
[[plants]]
id = "tank-t101"
model = "gravity_tank"
command_sources = ["%QL0"]
feedback_targets = ["%IL0"]
initial_state = [1.5]
initial_input = [0.0245]

[plants.parameters]
area_m2 = 0.2
outflow_coefficient_m2_sqrt_m_per_s = 0.02
