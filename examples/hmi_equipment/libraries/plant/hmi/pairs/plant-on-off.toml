format = 1
title = "On/off controller"
block = "Plant.FB_OnOffController"
faceplate = "plant-on-off"
symbol = "controller"

[bind]
pv = "MeasuredValue"
sp = "Setpoint"

[[settings]]
member = "Hysteresis"
title = "Hysteresis"
min = 0
key = true

[[settings]]
member = "Heating"
title = "Action"
choices = [{ value = true, title = "Heating: on below the setpoint" }, { value = false, title = "Cooling: on above the setpoint" }]
key = true

[[settings]]
member = "SetpointMin"
title = "Setpoint minimum"

[[settings]]
member = "SetpointMax"
title = "Setpoint maximum"

[[dependencies]]
member = "Measurement"
title = "Measurement"
interface = "Plant.IMeasurement"

[[dependencies]]
member = "Demand"
title = "Controlled equipment"
interface = "Plant.IRunDevice"
required = false
drives = "AutoRun"

[program]
position = "controllers"
