format = 1
title = "Sequence overview"
size = [608, 192]
pinnable = true

[fields.RunningCount]
accepts = ["number"]

[fields.HeldCount]
accepts = ["number"]

[fields.FailedCount]
accepts = ["number"]

[[object]]
id = "running"
type = "value"
label = "Running"
decimals = 0
at = [24, 24]
size = [176, 80]

[object.bind]
value = "$RunningCount"

[[object]]
id = "held"
type = "value"
label = "Held"
decimals = 0
at = [216, 24]
size = [176, 80]

[object.bind]
value = "$HeldCount"

[[object]]
id = "failed"
type = "value"
label = "Failed"
decimals = 0
at = [408, 24]
size = [176, 80]

[object.bind]
value = "$FailedCount"

[[object]]
id = "stop-all"
type = "button"
text = "Stop all"
variant = "stop"
at = [24, 120]
size = [272, 48]

[object.command]
interface = "Plant.ISequenceManager"
method = "StopAll"
instance = "$instance"

[[object]]
id = "abort-all"
type = "button"
text = "Abort all"
variant = "stop"
at = [312, 120]
size = [272, 48]

[object.command]
interface = "Plant.ISequenceManager"
method = "AbortAll"
instance = "$instance"
