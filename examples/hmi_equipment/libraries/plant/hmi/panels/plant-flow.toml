format = 1
title = "Flow"
size = [608, 580]
pinnable = true
settings = true

[fields.Value]
accepts = ["number"]

[fields.Quality]
accepts = ["enumeration"]

[fields.Fault]
accepts = ["boolean"]

[fields.Percent]
accepts = ["number"]

[fields.HighHigh]
accepts = ["boolean"]

[fields.High]
accepts = ["boolean"]

[fields.Low]
accepts = ["boolean"]

[fields.LowLow]
accepts = ["boolean"]

[fields.Total]
accepts = ["number"]

[[object]]
id = "measurement"
type = "value"
label = "Measurement"
at = [24, 24]
size = [363, 88]

[object.bind]
value = { path = "$Value", quality = "$Quality" }

[[object]]
id = "percent"
type = "value"
label = "Of range"
unit = "%"
decimals = 0
at = [403, 24]
size = [181, 88]

[object.bind]
value = "$Percent"

[[object]]
id = "high-high"
type = "status"
label = "High-high"
variant = "alarm"
at = [24, 128]
size = [128, 40]

[object.bind]
state = "$HighHigh"

[[object]]
id = "high"
type = "status"
label = "High"
variant = "alarm"
at = [168, 128]
size = [128, 40]

[object.bind]
state = "$High"

[[object]]
id = "low"
type = "status"
label = "Low"
variant = "alarm"
at = [312, 128]
size = [128, 40]

[object.bind]
state = "$Low"

[[object]]
id = "low-low"
type = "status"
label = "Low-low"
variant = "alarm"
at = [456, 128]
size = [128, 40]

[object.bind]
state = "$LowLow"

[[object]]
id = "fault"
type = "status"
label = "Signal fault"
variant = "alarm"
at = [24, 184]
size = [560, 40]

[object.bind]
state = "$Fault"

[[object]]
id = "total"
type = "value"
label = "Total"
decimals = 1
at = [24, 240]
size = [363, 80]

[object.bind]
value = "$Total"

[[object]]
id = "reset-total"
type = "button"
text = "Reset total"
at = [403, 240]
size = [181, 80]

[object.command]
interface = "Plant.ITotal"
method = "ResetTotal"
instance = "$instance"

[[object]]
id = "history"
type = "trend"
label = "History"
at = [24, 336]
size = [560, 220]

[object.bind]
measurement = { path = "$Value", quality = "$Quality" }
