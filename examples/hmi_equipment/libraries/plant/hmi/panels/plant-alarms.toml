format = 1
title = "Alarm summary"
size = [608, 192]
pinnable = true

[fields.ActiveCount]
accepts = ["number"]

[fields.UnacknowledgedCount]
accepts = ["number"]

[fields.Horn]
accepts = ["boolean"]

[[object]]
id = "active"
type = "value"
label = "Active"
decimals = 0
at = [24, 24]
size = [176, 80]

[object.bind]
value = "$ActiveCount"

[[object]]
id = "unacknowledged"
type = "value"
label = "Unacknowledged"
decimals = 0
at = [216, 24]
size = [176, 80]

[object.bind]
value = "$UnacknowledgedCount"

[[object]]
id = "horn"
type = "status"
label = "Horn"
variant = "alarm"
at = [408, 24]
size = [176, 80]

[object.bind]
state = "$Horn"

[[object]]
id = "acknowledge-all"
type = "button"
text = "Acknowledge all"
at = [24, 120]
size = [272, 48]

[object.command]
interface = "Plant.IAlarmManager"
method = "AcknowledgeAll"
instance = "$instance"

[[object]]
id = "silence"
type = "button"
text = "Silence"
at = [312, 120]
size = [272, 48]

[object.command]
interface = "Plant.IAlarmManager"
method = "Silence"
instance = "$instance"
