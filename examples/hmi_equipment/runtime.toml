[bundle]
version = 1

[resource]
name = "Cpu"
cycle_interval_ms = 100

[runtime.control]
mode = "production"
debug_enabled = false

[runtime.log]
level = "info"

[runtime.retain]
mode = "file"
path = "retain.bin"
save_interval_ms = 1000

[runtime.watchdog]
enabled = false
timeout_ms = 5000
action = "halt"

[runtime.fault]
policy = "halt"

[runtime.web]
enabled = true
listen = "127.0.0.1:8080"
auth = "local"
tls = false

# The runtime display's users and what they may change (specification 39, §12). The demo
# passwords equal the names; replace them with `trust-runtime hmi-password` before real use.
[runtime.web.hmi]
idle_minutes = 15

[[runtime.web.hmi.user]]
name = "operator"
role = "operator"
password = "pbkdf2-sha256:600000:QgeWroJZc4eXPGieE11_Fg:fjSiBIgRzdEWr3YB5pbTv8eXM361rQjUw-x68QhZf_g"

[[runtime.web.hmi.user]]
name = "engineer"
role = "engineer"
password = "pbkdf2-sha256:600000:873e36ejrtKwjB9IofRyiA:sdVsEMdpyBQ00M52cd2-jB-EXWTIVyw4kz7-XU5YSxQ"

# Panel commands and the Settings dialog take their roles from the panels and the component
# definitions: operators command equipment in Manual, engineers change settings and take
# equipment out of service. No write rules are needed for them.

# LIC-101 is ordinary code around Control.PID: its panel writes the loop's variables, so the
# operator's mode, setpoint and manual output have write rules, as Create PLC code adds them.
[[runtime.web.hmi.write]]
path = "Main.LIC101_Manual"
role = "operator"

[[runtime.web.hmi.write]]
path = "Main.LIC101_Setpoint"
role = "operator"
min = 0.2
max = 2.6

[[runtime.web.hmi.write]]
path = "Main.LIC101_ManualOutput"
role = "operator"
min = 0.0
max = 100.0
