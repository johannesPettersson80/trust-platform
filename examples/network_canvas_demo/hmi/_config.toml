version = 1

[theme]
style = "industrial"
accent = "#c2410c"

[layout]
navigation = "sidebar-left"
header = true
header_title = "Main HMI"

[write]
enabled = false
allow = []

[[alarm]]
bind = "global.conveyor_speed"
high = 3600
low = 0
deadband = 72
inferred = true
label = "Conveyor Speed"

[[alarm]]
bind = "global.line_state"
high = 100
low = 0
deadband = 2
inferred = true
label = "Line State"
