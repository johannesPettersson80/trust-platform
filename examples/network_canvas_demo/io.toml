# Simulated I/O so the demo runs with no hardware/brokers on any machine. The Network
# Canvas easy-setup flow is designed to ADD real devices live (drag a protocol onto the
# runtime -> configure -> Apply), which writes them here. To pre-wire real drivers, replace
# this with e.g. modbus-tcp / mqtt / ethercat entries pointing at reachable endpoints.
[io]
driver = "simulated"
params = {}
