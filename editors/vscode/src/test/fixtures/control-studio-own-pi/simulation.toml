[simulation]
enabled = true
seed = 20260930
time_scale = 1
plant_step_ms = 100
max_plant_substeps_per_cycle = 100
plant_trace_capacity = 2000

# First order with dead time: 1.5 °C per % heater, time constant 4 s, dead time 0.5 s, 20 °C with the heater off.
[[plants]]
id = "temperature-process"
model = "first_order_dead_time"
command_sources = ["%QL0"]
feedback_targets = ["%IL0"]
initial_state = [0.0]
initial_input = [0.0]
input_offset = [0.0]
output_offset = [20.0]

[plants.parameters]
gain = 1.5
time_constant_s = 4.0
dead_time_s = 0.5

[plants.actuator]
minimum = 0.0
maximum = 100.0
