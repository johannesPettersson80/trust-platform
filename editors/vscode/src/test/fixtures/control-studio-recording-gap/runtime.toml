[bundle]
version = 1

[resource]
name = "Res"
cycle_interval_ms = 20

[runtime.control]
endpoint = "tcp://127.0.0.1:0"
mode = "debug"
debug_enabled = true
auth_token = "recording-gap-fixture-token"

[runtime.log]
level = "info"

[runtime.retain]
mode = "none"
save_interval_ms = 1000

[runtime.watchdog]
enabled = false
timeout_ms = 5000
action = "halt"

[runtime.fault]
policy = "halt"
