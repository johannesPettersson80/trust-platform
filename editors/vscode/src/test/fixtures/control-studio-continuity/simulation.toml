[simulation]
enabled = true
seed = 20260824
time_scale = 1
plant_step_ms = 100
max_plant_substeps_per_cycle = 100
plant_trace_capacity = 2000

# The process rests at 80 °C with the heater at 40 %, inside the output range, so every identification method's
# excitation around it stays between 0 and 100 %.
[[plants]]
id = "temperature-process"
model = "first_order_dead_time"
command_sources = ["%QL0"]
feedback_targets = ["%IL0"]
initial_state = [60.0]
initial_input = [40.0]
input_offset = [0.0]
output_offset = [20.0]

[plants.parameters]
gain = 1.5
time_constant_s = 4.0
dead_time_s = 0.5

[plants.actuator]
minimum = 0.0
maximum = 100.0
rate_up_per_s = 25.0
rate_down_per_s = 25.0
