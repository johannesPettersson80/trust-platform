format = 1
title = "Totaliser"
block = "Plant.FB_Totalizer"
faceplate = "plant-totalizer"
symbol = "value"

[bind]
value = "Total"

[[settings]]
member = "TotalPer"
title = "Rate unit per"
choices = [{ value = "T#1s", title = "second" }, { value = "T#1m", title = "minute" }, { value = "T#1h", title = "hour" }]
key = true

[[settings]]
member = "CutOff"
title = "Low-flow cut-off"
min = 0

[[dependencies]]
member = "Measurement"
title = "Rate from"
interface = "Plant.IMeasurement"

[program]
position = "measurements"
