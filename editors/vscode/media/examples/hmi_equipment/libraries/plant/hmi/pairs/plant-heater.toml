format = 1
title = "Heater"
block = "Plant.FB_Heater"
faceplate = "plant-heater"
symbol = "heater"

[bind]
power = "PowerOutput"

[[settings]]
member = "HasFeedback"
title = "Has contactor feedback"
key = true

[[settings]]
member = "StartTimeout"
title = "Start timeout"
unit = "s"
min = 1
max = 600
key = true
help = "Running feedback must arrive within this time."

[[settings]]
member = "StopTimeout"
title = "Stop timeout"
unit = "s"
min = 1
max = 600
key = true
help = "Running feedback must drop within this time."

[[settings]]
member = "ServiceInterval"
title = "Service interval"
unit = "h"
min = 0
max = 100000
help = "Running hours between services; 0 for none."

[[settings]]
member = "MaxPower"
title = "Maximum power"
unit = "%"
min = 0
max = 100
key = true

[[settings]]
member = "PulsePeriod"
title = "Pulse period"
unit = "s"
min = 1
max = 600
help = "For a solid-state relay: one on/off period."

[[io]]
member = "RunCommand"
title = "Main contactor"
direction = "output"

[[io]]
member = "RunningFeedback"
title = "Contactor feedback"
direction = "input"
required_when = "HasFeedback"

[[io]]
member = "Trip"
title = "Over-temperature switch"
direction = "input"
required = false

[[io]]
member = "PowerOutput"
title = "Power output"
direction = "output"
required = false

[[io]]
member = "PulseOutput"
title = "Pulse output"
direction = "output"
required = false

[program]
position = "actuators"
