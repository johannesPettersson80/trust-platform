format = 1
title = "Group"
size = [608, 240]
pinnable = true
settings = true

[fields.RunningCount]
accepts = ["number"]

[fields.AvailableCount]
accepts = ["number"]

[fields.Target]
accepts = ["number"]

[fields.Shortfall]
accepts = ["boolean"]

[fields.Selected1]
accepts = ["boolean"]

[fields.Selected2]
accepts = ["boolean"]

[fields.Selected3]
accepts = ["boolean"]

[fields.Selected4]
accepts = ["boolean"]

[[object]]
id = "running"
type = "value"
label = "Running"
decimals = 0
at = [24, 24]
size = [176, 80]

[object.bind]
value = "$RunningCount"

[[object]]
id = "wanted"
type = "value"
label = "Wanted"
decimals = 0
at = [216, 24]
size = [176, 80]

[object.bind]
value = "$Target"

[[object]]
id = "available"
type = "value"
label = "Available"
decimals = 0
at = [408, 24]
size = [176, 80]

[object.bind]
value = "$AvailableCount"

[[object]]
id = "shortfall"
type = "status"
label = "Not enough equipment available"
variant = "alarm"
at = [24, 120]
size = [560, 40]

[object.bind]
state = "$Shortfall"

[[object]]
id = "member-1"
type = "status"
label = "Member 1"
at = [24, 176]
size = [128, 40]

[object.bind]
state = "$Selected1"

[[object]]
id = "member-2"
type = "status"
label = "Member 2"
at = [168, 176]
size = [128, 40]

[object.bind]
state = "$Selected2"

[[object]]
id = "member-3"
type = "status"
label = "Member 3"
at = [312, 176]
size = [128, 40]

[object.bind]
state = "$Selected3"

[[object]]
id = "member-4"
type = "status"
label = "Member 4"
at = [456, 176]
size = [128, 40]

[object.bind]
state = "$Selected4"
