<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="480" viewBox="0 0 1120 480" role="img" aria-labelledby="title2 desc2">
<title id="title2">Four modules share one normalized command and nothing else</title>
<desc id="desc2">Heated vessel, buffer tank, conveyor oven, and flexible drive each keep a separate actuator and sensor. Only the shared normalized experiment command reaches all four.</desc>
<rect width="1120" height="480" rx="14" fill="#f7f9fc" stroke="#d8e0eb"/>
<text x="48" y="48" font-family="system-ui, sans-serif" font-size="22" font-weight="700" fill="#243044">Four modules, one shared command, four different mechanisms</text>
<text x="48" y="75" font-family="system-ui, sans-serif" font-size="15" fill="#526078">Each module keeps its own actuator and sensor; only the normalized command is common.</text>
<g font-family="system-ui, sans-serif" text-anchor="middle" fill="#243044">
<rect x="55.0" y="150" width="195" height="180" rx="10" fill="#eff6ff" stroke="#0072b2" stroke-width="2"/><text x="152.5" y="182" text-anchor="middle" font-size="18" font-weight="700">Heated vessel</text><line x1="75.0" y1="200" x2="230.0" y2="200" stroke="#526078" stroke-width="1.5"/><text x="152.5" y="228" text-anchor="middle" font-size="14" fill="#526078">actuator</text><text x="152.5" y="248" text-anchor="middle" font-size="13">heater command (%)</text><text x="152.5" y="278" text-anchor="middle" font-size="14" fill="#526078">sensor</text><text x="152.5" y="298" text-anchor="middle" font-size="13">temperature</text><rect x="270.0" y="150" width="195" height="180" rx="10" fill="#eff6ff" stroke="#d55e00" stroke-width="2"/><text x="367.5" y="182" text-anchor="middle" font-size="18" font-weight="700">Buffer tank</text><line x1="290.0" y1="200" x2="445.0" y2="200" stroke="#526078" stroke-width="1.5"/><text x="367.5" y="228" text-anchor="middle" font-size="14" fill="#526078">actuator</text><text x="367.5" y="248" text-anchor="middle" font-size="13">net-inflow trim (%)</text><text x="367.5" y="278" text-anchor="middle" font-size="14" fill="#526078">sensor</text><text x="367.5" y="298" text-anchor="middle" font-size="13">level</text><rect x="485.0" y="150" width="195" height="180" rx="10" fill="#eff6ff" stroke="#009e73" stroke-width="2"/><text x="582.5" y="182" text-anchor="middle" font-size="18" font-weight="700">Conveyor oven</text><line x1="505.0" y1="200" x2="660.0" y2="200" stroke="#526078" stroke-width="1.5"/><text x="582.5" y="228" text-anchor="middle" font-size="14" fill="#526078">actuator</text><text x="582.5" y="248" text-anchor="middle" font-size="13">heater command (%)</text><text x="582.5" y="278" text-anchor="middle" font-size="14" fill="#526078">sensor</text><text x="582.5" y="298" text-anchor="middle" font-size="13">product temperature</text><rect x="700.0" y="150" width="195" height="180" rx="10" fill="#eff6ff" stroke="#cc79a7" stroke-width="2"/><text x="797.5" y="182" text-anchor="middle" font-size="18" font-weight="700">Flexible drive</text><line x1="720.0" y1="200" x2="875.0" y2="200" stroke="#526078" stroke-width="1.5"/><text x="797.5" y="228" text-anchor="middle" font-size="14" fill="#526078">actuator</text><text x="797.5" y="248" text-anchor="middle" font-size="13">torque (N·m)</text><text x="797.5" y="278" text-anchor="middle" font-size="14" fill="#526078">sensor</text><text x="797.5" y="298" text-anchor="middle" font-size="13">position</text><line x1="152.5" y1="345" x2="152.5" y2="380" stroke="#526078" stroke-width="2" stroke-dasharray="6 4"/><line x1="367.5" y1="345" x2="367.5" y2="380" stroke="#526078" stroke-width="2" stroke-dasharray="6 4"/><line x1="582.5" y1="345" x2="582.5" y2="380" stroke="#526078" stroke-width="2" stroke-dasharray="6 4"/><line x1="797.5" y1="345" x2="797.5" y2="380" stroke="#526078" stroke-width="2" stroke-dasharray="6 4"/><line x1="152" y1="380" x2="798" y2="380" stroke="#526078" stroke-width="2" stroke-dasharray="6 4"/><rect x="330" y="405" width="240" height="46" rx="8" fill="#fff7ed" stroke="#526078" stroke-width="1.5"/><text x="450" y="433" text-anchor="middle" font-size="15" font-weight="700">Normalized experiment command</text>
</g>
</svg>
