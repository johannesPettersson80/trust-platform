[simulation]
enabled = true
seed = 20260829
time_scale = 1
max_plant_substeps_per_cycle = 100
plant_trace_capacity = 2000
plant_step_ms = 10

# Two copies of the shaft of Lessons 34–35: J·dω/dt = u − B·ω, dθ/dt = ω with J = 1 kg·m² and B = 1 N·m·s/rad,
# integrated in 10 ms steps for both. Only the controller's update period differs: 0.02 s for the first shaft
# (torque %QL0; angle %IL0, velocity %IL8) and 0.6 s for the second (torque %QL8; angle %IL16, velocity %IL24).
[[plants]]
id = "shaft-update-20ms"
model = "state_space"
command_sources = ["%QL0"]
feedback_targets = ["%IL0", "%IL8"]
initial_state = [0.0, 0.0]

[plants.parameters]
a = [[0.0, 1.0], [0.0, -1.0]]
b = [[0.0], [1.0]]
c = [[1.0, 0.0], [0.0, 1.0]]
d = [[0.0], [0.0]]

[[plants]]
id = "shaft-update-600ms"
model = "state_space"
command_sources = ["%QL8"]
feedback_targets = ["%IL16", "%IL24"]
initial_state = [0.0, 0.0]

[plants.parameters]
a = [[0.0, 1.0], [0.0, -1.0]]
b = [[0.0], [1.0]]
c = [[1.0, 0.0], [0.0, 1.0]]
d = [[0.0], [0.0]]
