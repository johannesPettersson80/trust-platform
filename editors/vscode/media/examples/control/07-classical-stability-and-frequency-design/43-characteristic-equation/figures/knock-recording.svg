<svg xmlns="http://www.w3.org/2000/svg" width="900" height="542" viewBox="0 0 900 542" role="img" aria-labelledby="title desc">
  <title id="title">The shaft after a knock, against its characteristic equation</title>
  <desc id="desc">After a 10 newton-metre knock for 0.1 seconds the shaft turns at 0.28 seconds at 0.0953 radians and returns to its target without passing it, 0.0010 radians away after 2 seconds; its lowest velocity is minus 0.147 radians per second at 0.5 seconds. The prediction from the sampled law follows it closely; the continuous (s + 4) squared lies slightly higher.</desc>
