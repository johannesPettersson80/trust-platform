[simulation]
enabled = true
seed = 20260829
time_scale = 1
max_plant_substeps_per_cycle = 100
plant_trace_capacity = 1000
plant_step_ms = 100

# Nine copies of the heater of Lessons 12–30, 50·dT/dt = 2·u(t − 1) − 10·(T − 20) − D, at rest at 35 °C with 75 %:
# three controller candidates (baseline, Tz = 3 s, Tz = 10 s) for each of three cases (target step, heat load,
# measurement noise). Inputs: heater command (delivered 1 s later) and heat extraction in kW; output: the water
# temperature, read exactly.

[[plants]]
id = "target-baseline"
model = "state_space"
command_sources = ["%QL0", "%QL8"]
feedback_targets = ["%IL0"]
initial_state = [15.0]
initial_input = [75.0, 0.0]
output_offset = [20.0]
actuators = [{ minimum = 0.0, maximum = 100.0, initial_applied = 75.0 }, {}]

[plants.parameters]
a = [[-0.2]]
b = [[0.04, -0.02]]
c = [[1.0]]
d = [[0.0, 0.0]]
input_delays_s = [1.0, 0.0]

