[simulation]
enabled = true
seed = 20260829
time_scale = 1
max_plant_substeps_per_cycle = 100
plant_trace_capacity = 2000
plant_step_ms = 100

# Lesson 13's heater, six times: 50·dT/dt = 2·u(t − 1) − 10·(T − 20), T in °C, u the command in points delivered 1 s late.
# Each rests at 35 °C with 75 %. The program derives the two sensor readings of each heater from this temperature and adds the
# case's sensor fault after 5 s.

[[plants]]
id = "stale"
model = "state_space"
command_sources = ["%QL0"]
feedback_targets = ["%IL0"]
initial_state = [15.0]
initial_input = [75.0]
output_offset = [20.0]
actuators = [{ minimum = 0.0, maximum = 100.0, initial_applied = 75.0 }]

[plants.parameters]
a = [[-0.2]]
b = [[0.04]]
c = [[1.0]]
d = [[0.0]]
input_delays_s = [1.0]

