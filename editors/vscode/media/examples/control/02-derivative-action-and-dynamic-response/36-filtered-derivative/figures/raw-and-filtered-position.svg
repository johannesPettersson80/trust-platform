<svg xmlns="http://www.w3.org/2000/svg" width="960" height="330" viewBox="0 0 960 330" role="img" aria-labelledby="title desc">
  <title id="title">Raw and filtered encoder positions</title>
  <desc id="desc">The raw encoder remains visible while a low-pass-filtered copy feeds derivative action.</desc>
  <rect width="960" height="330" fill="#f7fafc"/>
  <rect x="45" y="100" width="230" height="120" rx="18" fill="#e6f2ff" stroke="#2463a6" stroke-width="3"/>
  <text x="160" y="145" text-anchor="middle" font-family="sans-serif" font-size="23" font-weight="700" fill="#17324d">Raw encoder</text>
  <text x="160" y="182" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#17324d">kept visible</text>
  <line x1="275" y1="160" x2="360" y2="160" stroke="#40566d" stroke-width="5"/>
  <path d="M360 160 L343 150 L343 170 Z" fill="#40566d"/>
  <rect x="370" y="75" width="220" height="170" rx="18" fill="#fff3d6" stroke="#b87900" stroke-width="3"/>
  <text x="480" y="125" text-anchor="middle" font-family="sans-serif" font-size="23" font-weight="700" fill="#5b3d00">Low-pass filter</text>
  <text x="480" y="166" text-anchor="middle" font-family="sans-serif" font-size="21" fill="#5b3d00">τf = 0.05 s</text>
  <text x="480" y="205" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#5b3d00">moves 1/3 of gap</text>
  <line x1="590" y1="160" x2="675" y2="160" stroke="#40566d" stroke-width="5"/>
  <path d="M675 160 L658 150 L658 170 Z" fill="#40566d"/>
  <rect x="685" y="100" width="230" height="120" rx="18" fill="#e9f8ee" stroke="#2b7a43" stroke-width="3"/>
  <text x="800" y="145" text-anchor="middle" font-family="sans-serif" font-size="23" font-weight="700" fill="#19482a">Derivative path</text>
  <text x="800" y="182" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#19482a">smaller rapid changes</text>
  <text x="480" y="292" text-anchor="middle" font-family="sans-serif" font-size="21" fill="#263746">less noise-driven torque · more measurement delay</text>
</svg>
