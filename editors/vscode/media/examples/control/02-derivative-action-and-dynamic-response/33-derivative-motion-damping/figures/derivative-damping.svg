<svg xmlns="http://www.w3.org/2000/svg" width="960" height="340" viewBox="0 0 960 340" role="img" aria-labelledby="title desc">
  <title id="title">Derivative torque opposes shaft velocity</title>
  <desc id="desc">Positive shaft velocity creates negative derivative torque, and negative velocity creates positive derivative torque.</desc>
  <rect width="960" height="340" fill="#f7fafc"/>
  <text x="480" y="45" text-anchor="middle" font-family="sans-serif" font-size="25" font-weight="700" fill="#17324d">Derivative torque always opposes motion</text>
  <rect x="60" y="85" width="390" height="190" rx="18" fill="#e6f2ff" stroke="#2463a6" stroke-width="3"/>
  <text x="255" y="120" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="700" fill="#17324d">Shaft moving positive</text>
  <circle cx="255" cy="185" r="34" fill="#ffffff" stroke="#2463a6" stroke-width="4"/>
  <line x1="165" y1="160" x2="220" y2="160" stroke="#2b7a43" stroke-width="6"/>
  <path d="M220 160 L204 150 L204 170 Z" fill="#2b7a43"/>
  <line x1="345" y1="210" x2="290" y2="210" stroke="#b33a3a" stroke-width="6"/>
  <path d="M290 210 L306 200 L306 220 Z" fill="#b33a3a"/>
  <text x="155" y="244" font-family="sans-serif" font-size="19" fill="#19482a">velocity +</text>
  <text x="327" y="244" font-family="sans-serif" font-size="19" fill="#742020">torque −</text>
  <rect x="510" y="85" width="390" height="190" rx="18" fill="#fff3d6" stroke="#b87900" stroke-width="3"/>
  <text x="705" y="120" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="700" fill="#5b3d00">Shaft moving negative</text>
  <circle cx="705" cy="185" r="34" fill="#ffffff" stroke="#b87900" stroke-width="4"/>
  <line x1="795" y1="160" x2="740" y2="160" stroke="#2b7a43" stroke-width="6"/>
  <path d="M740 160 L756 150 L756 170 Z" fill="#2b7a43"/>
  <line x1="615" y1="210" x2="670" y2="210" stroke="#b33a3a" stroke-width="6"/>
  <path d="M670 210 L654 200 L654 220 Z" fill="#b33a3a"/>
  <text x="783" y="244" font-family="sans-serif" font-size="19" fill="#19482a">velocity −</text>
  <text x="548" y="244" font-family="sans-serif" font-size="19" fill="#742020">torque +</text>
  <text x="480" y="315" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#263746">τd = −Kd ω</text>
</svg>
