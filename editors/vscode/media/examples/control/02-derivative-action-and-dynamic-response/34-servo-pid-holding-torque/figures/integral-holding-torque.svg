<svg xmlns="http://www.w3.org/2000/svg" width="960" height="360" viewBox="0 0 960 360" role="img" aria-labelledby="title desc">
  <title id="title">Integral torque balances payload gravity</title>
  <desc id="desc">At the requested position and zero velocity, proportional and derivative torques are zero while stored integral torque balances gravity torque.</desc>
  <rect width="960" height="360" fill="#f7fafc"/>
  <text x="480" y="43" text-anchor="middle" font-family="sans-serif" font-size="25" font-weight="700" fill="#17324d">At the final position</text>
  <circle cx="480" cy="180" r="52" fill="#ffffff" stroke="#40566d" stroke-width="5"/>
  <line x1="480" y1="180" x2="680" y2="90" stroke="#40566d" stroke-width="12"/>
  <circle cx="680" cy="90" r="34" fill="#fff3d6" stroke="#b87900" stroke-width="4"/>
  <text x="680" y="97" text-anchor="middle" font-family="sans-serif" font-size="21" fill="#5b3d00">load</text>
  <line x1="730" y1="145" x2="795" y2="195" stroke="#b33a3a" stroke-width="7"/>
  <path d="M795 195 L774 190 L787 173 Z" fill="#b33a3a"/>
  <text x="800" y="145" font-family="sans-serif" font-size="21" fill="#742020">gravity torque</text>
  <line x1="405" y1="220" x2="340" y2="170" stroke="#2b7a43" stroke-width="7"/>
  <path d="M340 170 L361 175 L348 192 Z" fill="#2b7a43"/>
  <text x="95" y="145" font-family="sans-serif" font-size="21" fill="#19482a">integral torque</text>
  <text x="480" y="307" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#263746">position error = 0 · velocity = 0 · integral torque = gravity torque</text>
</svg>
