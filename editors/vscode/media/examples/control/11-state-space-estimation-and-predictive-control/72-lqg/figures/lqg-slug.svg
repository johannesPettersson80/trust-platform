<svg xmlns="http://www.w3.org/2000/svg" width="900" height="532" viewBox="0 0 900 532" role="img" aria-labelledby="title desc">
  <title id="title">LQG after a slug the estimator was not told about</title>
  <desc id="desc">With tank 1 measured the pump reacts at once and tank 2 rises 2.9 millimetres. LQG with the model's error alone hardly moves its estimate, keeps the pump at 0.010 cubic metres per second and lets tank 2 rise 7.4 millimetres; with upsets allowed the estimate is 2.6 millimetres off after 20 seconds and tank 2 rises 5.4 millimetres.</desc>
