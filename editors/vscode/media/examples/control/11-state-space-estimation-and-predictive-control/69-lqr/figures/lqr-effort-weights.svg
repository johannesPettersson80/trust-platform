<svg xmlns="http://www.w3.org/2000/svg" width="900" height="512" viewBox="0 0 900 512" role="img" aria-labelledby="title desc">
  <title id="title">LQR with two effort weights after a slug</title>
  <desc id="desc">With effort weight 40000 the pump drops to 0.00845 cubic metres per second and tank 2 is within 2 millimetres from 22 seconds after the slug; with four times the weight the pump moves less, to 0.00932, and tank 2 takes 40 seconds. Both stay within 2 millimetres from 50 to 60 seconds.</desc>
