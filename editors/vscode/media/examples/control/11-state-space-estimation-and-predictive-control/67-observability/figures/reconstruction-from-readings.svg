<svg xmlns="http://www.w3.org/2000/svg" width="900" height="542" viewBox="0 0 900 542" role="img" aria-labelledby="title desc">
  <title id="title">Reconstructing tank 1 from tank 2's readings</title>
  <desc id="desc">From exact tank 2 readings the reconstruction follows tank 1 about one millimetre behind and places it near rest at 31 seconds while tank 2 is still 10 millimetres high; with readings 5 millimetres off in alternate directions, the reconstruction jumps by a quarter of a metre.</desc>
