<svg xmlns="http://www.w3.org/2000/svg" width="900" height="492" viewBox="0 0 900 492" role="img" aria-labelledby="title desc">
  <title id="title">Steering two levels with one pump</title>
  <desc id="desc">Twenty seconds of raised flow and eleven seconds of lowered flow bring tank 1 back to rest while tank 2 stands 10.3 millimetres high; afterwards tank 2 drains back to rest, so the unequal levels are reached but not held.</desc>
