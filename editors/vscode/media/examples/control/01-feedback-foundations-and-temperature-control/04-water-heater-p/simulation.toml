[simulation]
enabled = true
seed = 20260829
time_scale = 1
max_plant_substeps_per_cycle = 100
plant_trace_capacity = 2400
plant_step_ms = 100

# One physical temperature input; heater delivery and extraction have independent delays.
[[plants]]
id = "proportional-water-heater"
model = "state_space"
command_sources = ["%QL0", "%QL8"]
feedback_targets = ["%IL0"]
initial_state = [0.0]
initial_input = [0.0, 0.0]
output_offset = [20.0]
actuators = [{ minimum = 0.0, maximum = 100.0, initial_applied = 0.0 }, {}]

[plants.parameters]
a = [[-0.2]]
b = [[0.04, -0.02]]
c = [[1.0]]
d = [[0.0, 0.0]]
input_delays_s = [1.0, 0.0]
