[simulation]
enabled = true
seed = 20260827
time_scale = 1
max_plant_substeps_per_cycle = 100
plant_trace_capacity = 3200
plant_step_ms = 100

[[plants]]
id = "validation-water-heater"
model = "first_order_dead_time"
command_sources = ["%QL0"]
feedback_targets = ["%IL0"]
initial_state = [30.0]

[plants.parameters]
gain = 0.2
time_constant_s = 5.0
dead_time_s = 1.0
input_bias = 20.0
output_bias = 30.0
initial_delayed_input = 20.0

[plants.actuator]
minimum = 0.0
maximum = 100.0

# A fixed-flow validation interval ends at 30 s. The later one-degree
# equilibrium shift is an independently visible cold-flow load that the
# heater-command-only FOPDT model cannot predict.
[[plant_events]]
at_ms = 30000
plant = "validation-water-heater"
kind = "set_parameter"
parameter = "output_bias"
value = 29.0
