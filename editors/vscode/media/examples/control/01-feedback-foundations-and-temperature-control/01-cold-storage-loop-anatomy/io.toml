[io]
driver = "simulated"
params = {}

# A runtime fault can prevent Main from executing its normal OFF commands.
# Apply these outputs before halting: refrigeration OFF, closed-door load,
# and door disturbance OFF. LWORD entries encode the addressed LREAL bits.
[[io.safe_state]]
address = "%QL0"
value = "0"

[[io.safe_state]]
address = "%QL8"
# IEEE 754 binary64 representation of 4.0 degrees Celsius.
value = "4616189618054758400"

[[io.safe_state]]
address = "%QL16"
value = "0"
