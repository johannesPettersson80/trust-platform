[simulation]
enabled = true
seed = 20260824
time_scale = 1
max_plant_substeps_per_cycle = 100
plant_trace_capacity = 2000
plant_step_ms = 100

[[plants]]
id = "recirculating-water-heater"
model = "first_order_dead_time"
command_sources = ["%QL0"]
feedback_targets = ["%IL0"]
initial_state = [20.0]

[plants.parameters]
# The FOPDT values are the local form of the energy balance taught in Main.st:
# K=(P100/100)/H=0.2 degC/% and tau=C/H=5 s.
gain = 0.2
time_constant_s = 5.0
dead_time_s = 1.0
initial_delayed_input = 0.0
output_bias = 20.0

[plants.actuator]
minimum = 0.0
maximum = 100.0
