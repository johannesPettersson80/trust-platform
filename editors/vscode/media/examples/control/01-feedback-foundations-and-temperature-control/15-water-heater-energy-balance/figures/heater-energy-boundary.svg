<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" role="img" aria-labelledby="title desc">
  <title id="title">Water-heater energy boundary</title>
  <desc id="desc">Heater power enters a vessel, heat loss leaves it, and the water and vessel store thermal energy.</desc>
  <rect width="900" height="400" fill="#ffffff"/>
  <text x="55" y="45" font-family="sans-serif" font-size="27" fill="#20252b">Energy stored in the vessel changes by power in minus power out</text>
  <rect x="315" y="105" width="270" height="230" rx="18" fill="#eef3f7" stroke="#28343f" stroke-width="4"/>
  <rect x="335" y="175" width="230" height="140" rx="10" fill="#b8d8ef" stroke="#2374ab" stroke-width="3"/>
  <text x="450" y="222" text-anchor="middle" font-family="sans-serif" font-size="23" fill="#17354a">water + vessel</text>
  <text x="450" y="256" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#17354a">store thermal energy</text>
  <text x="450" y="288" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#17354a">temperature, T</text>

  <line x1="70" y1="220" x2="315" y2="220" stroke="#d13c32" stroke-width="12"/>
  <line x1="282" y1="198" x2="315" y2="220" stroke="#d13c32" stroke-width="12"/>
  <line x1="282" y1="242" x2="315" y2="220" stroke="#d13c32" stroke-width="12"/>
  <text x="82" y="168" font-family="sans-serif" font-size="23" fill="#20252b">heater power enters</text>
  <text x="82" y="195" font-family="sans-serif" font-size="20" fill="#424b55">Pₕ</text>

  <line x1="585" y1="220" x2="830" y2="220" stroke="#6c7783" stroke-width="12"/>
  <line x1="797" y1="198" x2="830" y2="220" stroke="#6c7783" stroke-width="12"/>
  <line x1="797" y1="242" x2="830" y2="220" stroke="#6c7783" stroke-width="12"/>
  <text x="625" y="168" font-family="sans-serif" font-size="23" fill="#20252b">heat loss leaves</text>
  <text x="625" y="195" font-family="sans-serif" font-size="20" fill="#424b55">H(T − Tₐ)</text>

  <text x="184" y="375" font-family="sans-serif" font-size="24" fill="#20252b">stored-energy rate = heater power − heat loss</text>
</svg>
