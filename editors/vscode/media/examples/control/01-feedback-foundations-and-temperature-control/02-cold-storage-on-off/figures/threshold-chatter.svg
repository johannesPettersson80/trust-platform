<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430" viewBox="0 0 900 430" role="img" aria-labelledby="title desc">
  <title id="title">Noisy threshold crossings cause compressor chatter</title>
  <desc id="desc">Eight alternating temperature samples around a two degree threshold cause seven compressor output transitions.</desc>
  <style>
svg { forced-color-adjust: none; color-scheme: light; }
  .surface { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 2; }
  text { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #172033; }
  .title { font-size: 20px; font-weight: 650; }
  .subtitle { font-size: 12px; fill: #4b5568; }
  .axis { stroke: #526076; stroke-width: 1.2; }
  .grid { stroke: #cbd3df; stroke-width: 0.8; stroke-dasharray: 3 5; }
  .pv { stroke: #1769aa; stroke-width: 2.2; fill: none; }
  .sp { stroke: #526076; stroke-width: 1.7; fill: none; stroke-dasharray: 7 4; }
  .mv { stroke: #c64b16; stroke-width: 1.8; fill: none; }
  .event { stroke: #9b3152; stroke-width: 1.8; fill: none; stroke-dasharray: 5 4; }
  .door-band { fill: #f4d9e2; opacity: 0.42; }
  .tick { font-size: 11px; fill: #465268; }
  .label { font-size: 12px; font-weight: 600; }
  .note { font-size: 11px; fill: #374258; }
  .on { fill: #c64b16; }
  .off { fill: #526076; }
  </style>
  <rect x="1" y="1" width="898" height="428" rx="8" class="surface" />
  <text x="48" y="34" class="title">Small threshold crossings reverse the compressor command</text>
  <text x="48" y="55" class="subtitle">Simulation evidence · constant underlying temperature · declared sensor noise · seven transitions</text>
  <line x1="430" y1="76" x2="458" y2="76" class="pv" />
  <text x="466" y="80" class="note">Measured PV</text>
  <line x1="570" y1="76" x2="598" y2="76" class="sp" />
  <text x="606" y="80" class="note">Switching threshold</text>
  <rect x="760" y="68" width="18" height="12" class="on" />
  <text x="786" y="80" class="note">Applied MV</text>
  <line x1="90.0" y1="244.0" x2="850.0" y2="244.0" class="grid" />
  <text x="80" y="248.0" class="tick" text-anchor="end">1.90</text>
  <line x1="90.0" y1="206.0" x2="850.0" y2="206.0" class="grid" />
  <text x="80" y="210.0" class="tick" text-anchor="end">1.95</text>
  <line x1="90.0" y1="168.0" x2="850.0" y2="168.0" class="grid" />
  <text x="80" y="172.0" class="tick" text-anchor="end">2.00</text>
  <line x1="90.0" y1="130.0" x2="850.0" y2="130.0" class="grid" />
  <text x="80" y="134.0" class="tick" text-anchor="end">2.05</text>
  <line x1="90.0" y1="92.0" x2="850.0" y2="92.0" class="grid" />
  <text x="80" y="96.0" class="tick" text-anchor="end">2.10</text>
  <line x1="90.0" y1="92.0" x2="90.0" y2="244.0" class="axis" />
  <line x1="90.0" y1="244.0" x2="850.0" y2="244.0" class="axis" />
  <path d="M90.00,130.00 L198.57,206.00 L307.14,137.60 L415.71,198.40 L524.29,145.20 L632.86,190.80 L741.43,152.80 L850.00,183.20" class="pv" />
  <path d="M90.0,168.0 L850.0,168.0" class="sp" />
  <text x="20" y="168" class="label" text-anchor="middle" transform="rotate(-90 20 168)">Temperature (°C)</text>
  <line x1="90.0" y1="292.0" x2="90.0" y2="378.0" class="axis" />
  <line x1="90.0" y1="378.0" x2="850.0" y2="378.0" class="axis" />
  <text x="20" y="335" class="label" text-anchor="middle" transform="rotate(-90 20 335)">MV (%)</text>
  <rect x="66.0" y="292.0" width="48.0" height="86.0" class="on" />
  <text x="90.0" y="402" class="tick" text-anchor="middle">1</text>
  <rect x="174.6" y="378.0" width="48.0" height="0.0" class="on" />
  <text x="198.6" y="402" class="tick" text-anchor="middle">2</text>
  <rect x="283.1" y="292.0" width="48.0" height="86.0" class="on" />
  <text x="307.1" y="402" class="tick" text-anchor="middle">3</text>
  <rect x="391.7" y="378.0" width="48.0" height="0.0" class="on" />
  <text x="415.7" y="402" class="tick" text-anchor="middle">4</text>
  <rect x="500.3" y="292.0" width="48.0" height="86.0" class="on" />
  <text x="524.3" y="402" class="tick" text-anchor="middle">5</text>
  <rect x="608.9" y="378.0" width="48.0" height="0.0" class="on" />
  <text x="632.9" y="402" class="tick" text-anchor="middle">6</text>
  <rect x="717.4" y="292.0" width="48.0" height="86.0" class="on" />
  <text x="741.4" y="402" class="tick" text-anchor="middle">7</text>
  <rect x="826.0" y="378.0" width="48.0" height="0.0" class="on" />
  <text x="850.0" y="402" class="tick" text-anchor="middle">8</text>
  <text x="470" y="420" class="label" text-anchor="middle">Recorded sample</text>
</svg>
