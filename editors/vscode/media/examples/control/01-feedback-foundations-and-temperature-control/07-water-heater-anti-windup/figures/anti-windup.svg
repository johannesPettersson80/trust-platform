<svg xmlns="http://www.w3.org/2000/svg" width="940" height="390" viewBox="0 0 940 390" role="img" aria-labelledby="title desc">
  <title id="title">Back-calculation anti-windup</title>
  <desc id="desc">Temperature error changes integral memory, while the difference between applied and requested power corrects the same memory toward achievable heater power.</desc>
  <rect width="940" height="390" rx="24" fill="#f8fafc"/>
  <rect x="40" y="55" width="190" height="90" rx="14" fill="#dbeafe"/>
  <text x="135" y="90" text-anchor="middle" font-family="sans-serif" font-size="21" font-weight="700" fill="#172033">Temperature error</text>
  <text x="135" y="119" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#172033">ordinary integral change</text>
  <rect x="375" y="130" width="190" height="90" rx="14" fill="#fef3c7"/>
  <text x="470" y="166" text-anchor="middle" font-family="sans-serif" font-size="21" font-weight="700" fill="#172033">Stored correction</text>
  <text x="470" y="195" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#172033">updated every scan</text>
  <rect x="710" y="55" width="190" height="90" rx="14" fill="#dcfce7"/>
  <text x="805" y="90" text-anchor="middle" font-family="sans-serif" font-size="21" font-weight="700" fill="#172033">PI request</text>
  <text x="805" y="119" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#172033">before heater limit</text>
  <rect x="710" y="260" width="190" height="90" rx="14" fill="#fee2e2"/>
  <text x="805" y="296" text-anchor="middle" font-family="sans-serif" font-size="21" font-weight="700" fill="#172033">Applied power</text>
  <text x="805" y="325" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#172033">after heater limit</text>
  <line x1="230" y1="100" x2="365" y2="160" stroke="#475569" stroke-width="3"/>
  <polygon points="365,160 351,162 357,149" fill="#475569"/>
  <line x1="565" y1="160" x2="700" y2="110" stroke="#475569" stroke-width="3"/>
  <polygon points="700,110 690,121 686,108" fill="#475569"/>
  <line x1="805" y1="145" x2="805" y2="250" stroke="#475569" stroke-width="3"/>
  <polygon points="805,250 798,236 812,236" fill="#475569"/>
  <rect x="350" y="275" width="240" height="80" rx="14" fill="#e2e8f0"/>
  <text x="470" y="307" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="700" fill="#172033">applied − requested</text>
  <text x="470" y="334" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#172033">tracking correction</text>
  <path d="M710 100 H640 Q620 100 620 120 V285 Q620 315 600 315 H590" fill="none" stroke="#475569" stroke-width="3"/>
  <polygon points="590,315 604,308 604,322" fill="#475569"/>
  <line x1="710" y1="305" x2="600" y2="305" stroke="#475569" stroke-width="3"/>
  <polygon points="590,305 604,298 604,312" fill="#475569"/>
  <line x1="470" y1="275" x2="470" y2="230" stroke="#475569" stroke-width="3"/>
  <polygon points="470,220 463,234 477,234" fill="#475569"/>
</svg>
