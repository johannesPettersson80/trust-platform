<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="620" viewBox="0 0 1300 620" role="img" aria-labelledby="title desc">
  <title id="title">Smith-predictor signal path for the heated-air duct</title>
  <desc id="desc">Heater command drives the physical oven and two internal models. Measured-minus-delayed-model correction produces a predicted current temperature. A fallback switch returns either that prediction or the raw measurement to the controller.</desc>
  <defs>
    <marker id="arrow-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/></marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#16a34a"/></marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ea580c"/></marker>
  </defs>
  <rect width="1300" height="620" rx="18" fill="#f8fafc"/>
  <text x="40" y="47" fill="#0f172a" font-family="system-ui, sans-serif" font-size="24" font-weight="700">Two internal models predict what the sensor cannot show yet</text>
  <text x="40" y="76" fill="#475569" font-family="system-ui, sans-serif" font-size="16">Measured-minus-delayed-model correction anchors the estimate; a fallback switch always keeps measured feedback available.</text>
  <rect x="30" y="240" width="190" height="180" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="125" y="324" fill="#0f172a" font-size="17" font-weight="700" text-anchor="middle">PID controller</text><text x="125" y="348" fill="#475569" font-size="13" text-anchor="middle">requests heater power</text><rect x="310" y="130" width="250" height="90" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/><text x="435" y="169" fill="#0f172a" font-size="17" font-weight="700" text-anchor="middle">Physical oven</text><text x="435" y="193" fill="#475569" font-size="13" text-anchor="middle">16 s transport delay</text><rect x="310" y="285" width="250" height="90" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/><text x="435" y="324" fill="#0f172a" font-size="17" font-weight="700" text-anchor="middle">Delay-free model</text><text x="435" y="348" fill="#475569" font-size="13" text-anchor="middle">estimates y_m0 now</text><rect x="310" y="440" width="250" height="90" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/><text x="435" y="479" fill="#0f172a" font-size="17" font-weight="700" text-anchor="middle">Delayed model</text><text x="435" y="503" fill="#475569" font-size="13" text-anchor="middle">estimates y_mL, 16 s late</text><rect x="700" y="250" width="280" height="220" rx="10" fill="#ede9fe" stroke="#6d28d9" stroke-width="2"/><text x="840" y="278" fill="#0f172a" font-size="17" font-weight="700" text-anchor="middle">Predictor</text><text x="840" y="395" fill="#4c1d95" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">c_m = y_meas − y_mL</text><text x="840" y="423" fill="#4c1d95" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">y_pred = y_m0 + c_m</text><text x="840" y="451" fill="#7c3aed" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">|c_m| ≥ 5 degC: fallback</text><rect x="1040" y="285" width="230" height="90" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/><text x="1155" y="324" fill="#0f172a" font-size="17" font-weight="700" text-anchor="middle">Fallback switch</text><text x="1155" y="348" fill="#475569" font-size="13" text-anchor="middle">predicted or measured</text><path d="M220 330 H260" fill="none" stroke="#475569" stroke-width="2.6"/><path d="M260 175 V485" fill="none" stroke="#475569" stroke-width="2.6"/><path d="M260 175 H310" fill="none" stroke="#475569" stroke-width="2.6" marker-end="url(#arrow-g)"/><path d="M260 330 H310" fill="none" stroke="#475569" stroke-width="2.6" marker-end="url(#arrow-g)"/><path d="M260 485 H310" fill="none" stroke="#475569" stroke-width="2.6" marker-end="url(#arrow-g)"/><text x="315" y="218" fill="#166534" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">heater command (u)</text><path d="M560 175 H630 V295 H700" fill="none" stroke="#475569" stroke-width="2.6" marker-end="url(#arrow-g)"/><text x="645" y="240" fill="#166534" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">y_meas</text><path d="M630 175 H1155 V285" fill="none" stroke="#475569" stroke-width="2.6" marker-end="url(#arrow-g)"/><text x="900" y="165" fill="#166534" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">y_meas (measured, always available)</text><path d="M560 330 H700" fill="none" stroke="#475569" stroke-width="2.6" marker-end="url(#arrow-g)"/><text x="630" y="320" fill="#5b21b6" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">y_m0</text><path d="M560 485 H640 V365 H700" fill="none" stroke="#475569" stroke-width="2.6" marker-end="url(#arrow-g)"/><text x="610" y="473" fill="#5b21b6" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">y_mL</text><path d="M980 330 H1040" fill="none" stroke="#475569" stroke-width="2.6" marker-end="url(#arrow-g)"/><text x="1010" y="320" fill="#5b21b6" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">y_pred</text><path d="M1155 375 V555 H125 V420" fill="none" stroke="#ea580c" stroke-width="2.6" marker-end="url(#arrow-orange)"/><text x="640" y="573" fill="#9a3412" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">selected process value (predicted, or measured on fallback) returns to the controller</text>
</svg>
