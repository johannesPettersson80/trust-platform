[simulation]
enabled = true
seed = 20260829
time_scale = 1
max_plant_substeps_per_cycle = 100
plant_trace_capacity = 2400
plant_step_ms = 100

# Native measured/reference temperatures; heater delivery delayed, extraction immediate.
[[plants]]
id = "heater-loop-diagnosis"
model = "state_space"
command_sources = ["%QL0", "%QL8"]
feedback_targets = ["%IL0", "%IL16"]
actuator_feedback_targets = [{ address = "%IL8" }, {}]
initial_state = [15.0]
initial_input = [75.0, 0.0]
output_offset = [20.0, 20.0]
actuators = [{ minimum = 0.0, maximum = 100.0, initial_applied = 75.0 }, {}]

[plants.parameters]
a = [[-0.2]]
b = [[0.04, -0.02]]
c = [[1.0], [1.0]]
d = [[0.0, 0.0], [0.0, 0.0]]
input_delays_s = [1.0, 0.0]

# Set value to0.3 for the reference-disagreement repeat; channel1 stays unbiased.
[[plant_events]]
at_ms = 0
plant = "heater-loop-diagnosis"
kind = "set_sensor_bias"
channel = 0
value = 0.0
