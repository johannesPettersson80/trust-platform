[simulation]
enabled = true
seed = 20260829
time_scale = 1
max_plant_substeps_per_cycle = 100
plant_trace_capacity = 2000
plant_step_ms = 100

[[plants]]
id = "heated-air-duct"
name = "Heated-air duct with downstream sensor"
description = "Heater power changes travel through the duct before reaching the temperature sensor."
model = "first_order_dead_time"
command_sources = ["%QL176"]
feedback_targets = ["%IL160"]
