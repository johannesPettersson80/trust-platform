[simulation]
enabled = true
seed = 20260829
time_scale = 1
max_plant_substeps_per_cycle = 100
plant_trace_capacity = 4000
plant_step_ms = 100

# Two heating valves at a regulated 100 kPa (q = 2z kg/s). Each motor moves its stem at 0.5 % per
# second toward the position it is given; the program decides that position (command path and friction).

# Valve with a command deadband in its positioner: the stem follows the accepted target.
[[plants]]
id = "deadband-valve"
model = "piecewise_linear"
command_sources = ["%QL8"]
feedback_targets = ["%IL0"]
actuator_feedback_targets = [{ address = "%IL16" }]
initial_input = [75.0]

[plants.parameters]
input_points = [0.000000, 5.000000, 10.000000, 15.000000, 20.000000, 25.000000, 30.000000, 35.000000, 40.000000, 45.000000, 50.000000, 55.000000, 60.000000, 65.000000, 70.000000, 75.000000, 80.000000, 85.000000, 90.000000, 95.000000, 100.000000]
output_points = [0.000000, 0.100000, 0.200000, 0.300000, 0.400000, 0.500000, 0.600000, 0.700000, 0.800000, 0.900000, 1.000000, 1.100000, 1.200000, 1.300000, 1.400000, 1.500000, 1.600000, 1.700000, 1.800000, 1.900000, 2.000000]

[plants.actuator]
minimum = 0.0
maximum = 100.0
rate_up_per_s = 0.5
rate_down_per_s = 0.5
initial_applied = 75.0

[[plants.uncertainties]]
id = "deadband-valve-noise"
target = "measurement"
channel = 0
mode = "add"
generator = "uniform_white"
minimum = -0.005
maximum = 0.005

# Valve with stiction: friction decides where the stem may move.
[[plants]]
id = "sticky-valve"
model = "piecewise_linear"
command_sources = ["%QL16"]
feedback_targets = ["%IL8"]
actuator_feedback_targets = [{ address = "%IL24" }]
initial_input = [75.0]

[plants.parameters]
input_points = [0.000000, 5.000000, 10.000000, 15.000000, 20.000000, 25.000000, 30.000000, 35.000000, 40.000000, 45.000000, 50.000000, 55.000000, 60.000000, 65.000000, 70.000000, 75.000000, 80.000000, 85.000000, 90.000000, 95.000000, 100.000000]
output_points = [0.000000, 0.100000, 0.200000, 0.300000, 0.400000, 0.500000, 0.600000, 0.700000, 0.800000, 0.900000, 1.000000, 1.100000, 1.200000, 1.300000, 1.400000, 1.500000, 1.600000, 1.700000, 1.800000, 1.900000, 2.000000]

[plants.actuator]
minimum = 0.0
maximum = 100.0
rate_up_per_s = 0.5
rate_down_per_s = 0.5
initial_applied = 75.0

[[plants.uncertainties]]
id = "sticky-valve-noise"
target = "measurement"
channel = 0
mode = "add"
generator = "uniform_white"
minimum = -0.005
maximum = 0.005
