[simulation]
enabled = true
seed = 20260829
time_scale = 1
max_plant_substeps_per_cycle = 100
plant_trace_capacity = 5000
plant_step_ms = 1000

# Six identical gravity tanks of Lesson 45 (A = 0.5 m², c = 0.020 m^(5/2)/s): fixed and scheduled PI at 0.09, 0.25 and 0.49 m,
# each starting at rest with its holding inflow c·√h0. Inputs: inflows in m³/s; outputs: levels in m, read within ±0.0005 m.

[[plants]]
id = "low-fixed-tank"
model = "gravity_tank"
command_sources = ["%QL0"]
feedback_targets = ["%IL0"]
initial_state = [0.09]
initial_input = [0.006]

[plants.parameters]
area_m2 = 0.5
outflow_coefficient_m2_sqrt_m_per_s = 0.02

[[plants.uncertainties]]
id = "low-fixed-level-noise"
target = "measurement"
channel = 0
mode = "add"
generator = "uniform_white"
minimum = -0.0005
maximum = 0.0005

[[plants]]
id = "low-scheduled-tank"
model = "gravity_tank"
command_sources = ["%QL8"]
