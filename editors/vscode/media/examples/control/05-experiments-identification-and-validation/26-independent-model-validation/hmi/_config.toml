version = 1

[theme]
style = "industrial"
accent = "#c2410c"

[layout]
navigation = "sidebar-left"
header = true
header_title = "P1 HMI"

[write]
enabled = false
allow = []

[[alarm]]
bind = "P1.ElapsedSeconds"
high = 100
low = 0
deadband = 2
inferred = true
label = "Elapsed Seconds"

[[alarm]]
bind = "P1.FrozenPrediction"
high = 100
low = 0
deadband = 2
inferred = true
label = "Frozen Prediction"

[[alarm]]
bind = "P1.HighFlowApplied"
high = 500
low = 0
deadband = 10
inferred = true
label = "High Flow Applied"

[[alarm]]
bind = "P1.HighFlowRequested"
high = 500
low = 0
deadband = 10
inferred = true
label = "High Flow Requested"

[[alarm]]
bind = "P1.HighFlowTemperature"
high = 120
low = 0
deadband = 2.4
inferred = true
label = "High Flow Temperature"

[[alarm]]
bind = "P1.LoadApplied"
high = 100
low = 0
deadband = 2
inferred = true
label = "Load Applied"

[[alarm]]
bind = "P1.LoadRequested"
high = 100
low = 0
deadband = 2
inferred = true
label = "Load Requested"

[[alarm]]
bind = "P1.LoadTemperature"
high = 120
low = 0
deadband = 2.4
inferred = true
label = "Load Temperature"

[[alarm]]
bind = "P1.LocalApplied"
high = 100
low = 0
deadband = 2
inferred = true
label = "Local Applied"

[[alarm]]
bind = "P1.LocalRequested"
high = 100
low = 0
deadband = 2
inferred = true
label = "Local Requested"

[[alarm]]
bind = "P1.LocalTemperature"
high = 120
low = 0
deadband = 2.4
inferred = true
label = "Local Temperature"
