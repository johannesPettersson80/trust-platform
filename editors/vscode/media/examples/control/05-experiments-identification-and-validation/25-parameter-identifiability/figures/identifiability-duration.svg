<svg xmlns="http://www.w3.org/2000/svg" width="900" height="340" viewBox="0 0 900 340" role="img" aria-labelledby="title desc">
  <title id="title">Short and long records compared for parameter identifiability</title>
  <desc id="desc">Two candidate responses overlap inside measurement noise early but separate clearly when the experiment continues toward equilibrium.</desc>
  <rect x="1" y="1" width="898" height="338" rx="16" fill="#f7f9fc" stroke="#d8e0eb"/>
  <text x="450" y="38" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#243044">Run long enough for different parameters to make different predictions</text>
  <line x1="70" y1="275" x2="850" y2="275" stroke="#526078" stroke-width="2"/>
  <line x1="70" y1="70" x2="70" y2="275" stroke="#526078" stroke-width="2"/>
  <line x1="100" y1="250" x2="160" y2="250" stroke="#0072b2" stroke-width="4"/>
  <line x1="160" y1="250" x2="230" y2="225" stroke="#0072b2" stroke-width="4"/>
  <line x1="230" y1="225" x2="350" y2="170" stroke="#0072b2" stroke-width="4"/>
  <line x1="350" y1="170" x2="520" y2="125" stroke="#0072b2" stroke-width="4"/>
  <line x1="520" y1="125" x2="820" y2="105" stroke="#0072b2" stroke-width="4"/>
  <line x1="100" y1="250" x2="160" y2="250" stroke="#d55e00" stroke-width="2"/>
  <line x1="160" y1="250" x2="230" y2="223" stroke="#d55e00" stroke-width="2"/>
  <line x1="230" y1="223" x2="350" y2="155" stroke="#d55e00" stroke-width="2"/>
  <line x1="350" y1="155" x2="520" y2="90" stroke="#d55e00" stroke-width="2"/>
  <line x1="520" y1="90" x2="820" y2="70" stroke="#d55e00" stroke-width="2"/>
  <line x1="180" y1="70" x2="180" y2="290" stroke="#8792a5" stroke-dasharray="6 5"/>
  <text x="180" y="315" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#243044">short record: difference hidden by noise</text>
  <text x="650" y="235" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#243044">long record: final gains separate</text>
  <text x="750" y="100" font-family="sans-serif" font-size="16" fill="#0072b2">A</text>
  <text x="750" y="66" font-family="sans-serif" font-size="16" fill="#d55e00">B</text>
</svg>
