<svg xmlns="http://www.w3.org/2000/svg" width="960" height="380" viewBox="0 0 960 380" role="img" aria-labelledby="title desc">
  <title id="title">Validity guard and deliberate recovery</title>
  <desc id="desc">Invalid data is routed to a safe output before PID state, then acknowledgement, valid scans, reset, and renewed authority occur separately.</desc>
  <rect width="960" height="380" fill="#f7fafc"/>
  <text x="480" y="40" text-anchor="middle" font-family="sans-serif" font-size="25" font-weight="700" fill="#17324d">Invalid data never reaches PID state</text>
  <rect x="45" y="75" width="210" height="100" rx="16" fill="#ffe9e7" stroke="#b33a3a" stroke-width="3"/>
  <text x="150" y="116" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="700" fill="#742020">Invalid or stale</text>
  <text x="150" y="149" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#742020">input</text>
  <line x1="255" y1="125" x2="330" y2="125" stroke="#40566d" stroke-width="5"/>
  <path d="M330 125 L313 115 L313 135 Z" fill="#40566d"/>
  <rect x="340" y="75" width="220" height="100" rx="16" fill="#fff3d6" stroke="#b87900" stroke-width="3"/>
  <text x="450" y="116" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="700" fill="#5b3d00">Validity guard</text>
  <text x="450" y="149" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#5b3d00">reject and latch</text>
  <line x1="560" y1="125" x2="635" y2="125" stroke="#40566d" stroke-width="5"/>
  <path d="M635 125 L618 115 L618 135 Z" fill="#40566d"/>
  <rect x="645" y="75" width="270" height="100" rx="16" fill="#e9f8ee" stroke="#2b7a43" stroke-width="3"/>
  <text x="780" y="116" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="700" fill="#19482a">Safe output 30%</text>
  <text x="780" y="149" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#19482a">no PID state change</text>
  <text x="480" y="220" text-anchor="middle" font-family="sans-serif" font-size="23" font-weight="700" fill="#17324d">Recovery is a sequence, not one reset button</text>
  <text x="480" y="270" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#263746">acknowledge → 3 valid scans → initialize state → renew Auto</text>
  <line x1="215" y1="302" x2="745" y2="302" stroke="#40566d" stroke-width="5"/>
  <path d="M745 302 L728 292 L728 312 Z" fill="#40566d"/>
  <text x="480" y="347" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#263746">each arrow crosses a separate controller scan</text>
</svg>
