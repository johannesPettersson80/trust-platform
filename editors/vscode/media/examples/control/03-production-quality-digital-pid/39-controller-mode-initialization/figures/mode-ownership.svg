<svg xmlns="http://www.w3.org/2000/svg" width="960" height="370" viewBox="0 0 960 370" role="img" aria-labelledby="title desc">
  <title id="title">Controller mode ownership and initialization</title>
  <desc id="desc">Measured pressure and actual valve position initialize controller state before automatic feedback receives command ownership.</desc>
  <rect width="960" height="370" fill="#f7fafc"/>
  <text x="480" y="42" text-anchor="middle" font-family="sans-serif" font-size="25" font-weight="700" fill="#17324d">Before automatic control owns the valve</text>
  <rect x="45" y="75" width="260" height="210" rx="18" fill="#e6f2ff" stroke="#2463a6" stroke-width="3"/>
  <text x="175" y="115" text-anchor="middle" font-family="sans-serif" font-size="23" font-weight="700" fill="#17324d">Running process</text>
  <text x="175" y="165" text-anchor="middle" font-family="sans-serif" font-size="21" fill="#17324d">pressure = 6 bar</text>
  <text x="175" y="207" text-anchor="middle" font-family="sans-serif" font-size="21" fill="#17324d">actual valve = 40%</text>
  <text x="175" y="251" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#17324d">independent feedback</text>
  <line x1="305" y1="180" x2="380" y2="180" stroke="#40566d" stroke-width="5"/>
  <path d="M380 180 L363 170 L363 190 Z" fill="#40566d"/>
  <rect x="390" y="75" width="250" height="210" rx="18" fill="#fff3d6" stroke="#b87900" stroke-width="3"/>
  <text x="515" y="115" text-anchor="middle" font-family="sans-serif" font-size="23" font-weight="700" fill="#5b3d00">Initialize history</text>
  <text x="515" y="165" text-anchor="middle" font-family="sans-serif" font-size="21" fill="#5b3d00">filter = 6 bar</text>
  <text x="515" y="207" text-anchor="middle" font-family="sans-serif" font-size="21" fill="#5b3d00">stored output = 40%</text>
  <text x="515" y="251" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#5b3d00">no new command</text>
  <line x1="640" y1="180" x2="715" y2="180" stroke="#40566d" stroke-width="5"/>
  <path d="M715 180 L698 170 L698 190 Z" fill="#40566d"/>
  <rect x="725" y="75" width="190" height="210" rx="18" fill="#e9f8ee" stroke="#2b7a43" stroke-width="3"/>
  <text x="820" y="115" text-anchor="middle" font-family="sans-serif" font-size="23" font-weight="700" fill="#19482a">Automatic</text>
  <text x="820" y="170" text-anchor="middle" font-family="sans-serif" font-size="21" fill="#19482a">first request</text>
  <text x="820" y="214" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="700" fill="#19482a">40%</text>
  <text x="480" y="334" text-anchor="middle" font-family="sans-serif" font-size="21" fill="#263746">truthful state first · ownership transfer second</text>
</svg>
