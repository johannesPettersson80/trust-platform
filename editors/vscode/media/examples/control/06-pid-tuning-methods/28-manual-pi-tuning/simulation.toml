[simulation]
enabled = true
seed = 20260829
time_scale = 1
max_plant_substeps_per_cycle = 100
plant_trace_capacity = 2400
plant_step_ms = 100

# One measured water temperature; heater delivery is delayed, extraction is immediate.
[[plants]]
id = "heater-manual-tuning"
model = "state_space"
command_sources = ["%QL0", "%QL8"]
feedback_targets = ["%IL0"]
actuator_feedback_targets = [{ address = "%IL8" }, {}]
initial_state = [15.0]
initial_input = [75.0, 0.0]
output_offset = [20.0]
actuators = [{ minimum = 0.0, maximum = 100.0, initial_applied = 75.0 }, {}]

[plants.parameters]
a = [[-0.2]]
b = [[0.04, -0.02]]
c = [[1.0]]
d = [[0.0, 0.0]]
input_delays_s = [1.0, 0.0]
