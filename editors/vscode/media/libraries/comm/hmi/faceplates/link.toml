format = 1
title = "Link"
description = "Communication link"
size = [640, 780]

[fields.Connected]
accepts = ["boolean"]

[fields.Detail]
accepts = ["text"]

[fields.Disabled]
accepts = ["boolean"]

[fields.Enable]
accepts = ["boolean"]

[fields.Exchanges]
accepts = ["number"]

[fields.Failures]
accepts = ["number"]

[fields.LastError]
accepts = ["text"]

[fields.LastGoodAge]
accepts = ["time"]

[fields.LinkFailed]
accepts = ["boolean"]

[fields.Name]
accepts = ["text"]

[fields.Reset]
accepts = ["boolean"]

[fields.ResponseTime]
accepts = ["time"]

[fields.State]
accepts = ["enumeration"]

[fields.StateTime]
accepts = ["time"]

[fields.Test]
accepts = ["boolean"]

[fields.TestResult]
accepts = ["text"]

[[object]]
id = "symbol"
type = "network-link"
at = [16, 16]
size = [160, 108]

[object.bind]
connected = "$Connected"
out-of-service = "$Disabled"

[[object]]
id = "name"
type = "text"
variant = "caption"
at = [192, 20]
size = [432, 28]

[object.bind]
text = "$Name"

[[object]]
id = "state"
type = "value"
at = [192, 52]
size = [208, 72]
label = "State"

[object.bind]
value = "$State"

[[object]]
id = "state-time"
type = "value"
at = [416, 52]
size = [208, 72]
label = "Time in state"

[object.bind]
value = "$StateTime"

[[object]]
id = "connected"
type = "status"
at = [16, 148]
size = [296, 40]
label = "Data exchanged"

[object.bind]
state = "$Connected"

[[object]]
id = "last-good"
type = "value"
at = [328, 140]
size = [296, 56]
label = "Last data"

[object.bind]
value = "$LastGoodAge"

[[object]]
id = "errors"
type = "group"
at = [16, 212]
size = [608, 88]
label = "Latest error"

[[object]]
id = "last-error"
type = "text"
at = [32, 252]
size = [576, 28]

[object.bind]
text = "$LastError"

[[object]]
id = "exchanges"
type = "value"
at = [16, 316]
size = [192, 72]
label = "Exchanges"

[object.bind]
value = "$Exchanges"

[[object]]
id = "failures"
type = "value"
at = [224, 316]
size = [192, 72]
label = "Failures"

[object.bind]
value = "$Failures"

[[object]]
id = "response-time"
type = "value"
at = [432, 316]
size = [192, 72]
label = "Response time"

[object.bind]
value = "$ResponseTime"

[[object]]
id = "protocol"
type = "group"
at = [16, 404]
size = [608, 88]
label = "Protocol"

[[object]]
id = "detail"
type = "text"
at = [32, 444]
size = [576, 28]

[object.bind]
text = "$Detail"

[[object]]
id = "engineering"
type = "group"
at = [16, 508]
size = [608, 152]
label = "Engineering"

[[object]]
id = "enable"
type = "switch"
at = [32, 548]
size = [176, 48]
label = "Link on"
role = "engineer"

[object.bind]
value = { path = "$Enable", direction = "read-write" }

[[object]]
id = "test"
type = "pulse-button"
at = [224, 548]
size = [176, 48]
text = "Test link"
role = "engineer"
pulse = 1

[object.bind]
target = { path = "$Test", direction = "write" }

[[object]]
id = "reset"
type = "pulse-button"
at = [416, 548]
size = [192, 48]
text = "Reset counters"
role = "engineer"
pulse = 1

[object.bind]
target = { path = "$Reset", direction = "write" }

[[object]]
id = "test-result"
type = "text"
at = [32, 612]
size = [576, 28]

[object.bind]
text = "$TestResult"

[[object]]
id = "alarms"
type = "group"
at = [16, 672]
size = [608, 92]
label = "Alarms"

[[object]]
id = "link-failed"
type = "status"
variant = "alarm"
at = [32, 712]
size = [280, 36]
label = "Link failed"

[object.bind]
state = "$LinkFailed"
