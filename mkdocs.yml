site_name: truST Documentation
site_description: IEC 61131-3 Structured Text tooling, runtime, agent contract, and examples.
site_url: https://johannespettersson80.github.io/trust-platform/
repo_url: https://github.com/johannesPettersson80/trust-platform
repo_name: johannesPettersson80/trust-platform
docs_dir: docs/public
site_dir: site/public
theme:
  name: material
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
markdown_extensions:
  - admonition
  - tables
  - pymdownx.snippets:
      base_path:
        - .
      check_paths: true
  - toc:
      permalink: true
plugins:
  - search:
      separator: '[\s\-\.]+'
